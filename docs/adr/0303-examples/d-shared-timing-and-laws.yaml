# ADR-0303 example (d): a sound, a particle and a display share ONE timing block and ONE law vocabulary (ADR-0303 2.0, 3.4, 3.5).
# Scene: a charging orb. The group below gives {at, every, for} to all three; every op reads the same words.
apiVersion: astera/v3
kind: Skill
id: example-charge-orb
anchors:
  - {id: palm, anchor: caster.hand_r, mount: caster}
machine:
  start: charge
  states:
    charge:
      for: 40
      then: done
      do:
        - id: charge
          at: 4                    # default `at` of every op below
          for: 30                  # the group's window; ops inherit it unless they override
          do:
            # DISPLAY (extended kind): one instance, lives for the group's window (for: 30); laws have their own from/for windows.
            - id: orb
              op: display
              kind: sprite
              sprite: couture-s2-haze-soft
              anchor: palm
              offset: {forward: 0.4}
              billboard: center
              size: [0.2, 0.2]                                       # blocks
              for: 30
              motion:
                - {law: grow, per_tick: 0.05, accel: 0.002, at: 0, for: 30}  # swells, faster and faster (scale on the 0.2 base: +0.01 blocks/tick, accel 0.0004)
                - {law: spin, axis: forward, deg_per_tick: 6, accel: 0.4, at: 0, for: 30}

            # PARTICLE (point kind): repeats every 2 ticks inside the same window. Point ops carry no `motion:` (engine: ParticleOpSpec/SoundOpSpec have none),
            # so what the ADR 3.4 `prop` laws said is written as spawn-time CEL on the repeat index i (class S), tau = 2 * i ticks since the group start.
            - id: sparks
              op: particle
              particle: end_rod
              anchor: palm
              every: 2                                               # occurrences at 4, 6, 8, ... (exact multiples of 2)
              for: 30
              count: "= 2 + 0.5 * i"                                 # grow count 0.25/tick: thicker each occurrence
              offset: [0.2, 0.2, 0.2]   # ENGINE GAP: particle `offset` is literal [x, y, z] only, so the ADR 3.4 `grow offset` tightening (-0.008/tick) cannot be written; constant mean box
              extra: "= 0.02 + 0.004 * i + 0.0002 * i * i"           # grow extra 0.002/tick, accel 0.0001: and faster (0.02 + v*tau + a*tau^2/2)

            # SOUND (point kind): the same every/for; a rising hum, as CEL on i.
            - id: hum
              op: sound
              sound: block.beacon.ambient
              anchor: palm
              every: 2
              for: 30
              volume: "= 0.4 * clamp(1.0 - (2 * i - 24) / 6.0, 0.0, 1.0)"   # fade over the last 6 ticks (tau 24..30), exponent 1.0 = linear
              pitch: "= 0.6 + 0.02 * i + 0.001 * i * i"                     # grow pitch 0.01/tick, accel 0.0005

            # CEL on the SAME fields: spawn-time expressions on the repeat index, no extra writes (class S). `rand()` is seeded per (cast, op, i).
            - id: ring
              op: particle
              particle: electric_spark
              anchor: palm
              every: 2
              for: 30
              offset: "= vec(0.0, cos(i * 0.5) * 0.3, sin(i * 0.5) * 0.3)"     # an emit point circling the palm
              count: 0                                                              # vanilla count 0: offset is the DIRECTION, extra the speed
              extra: "= 0.05 + 0.01 * rand()"

        - id: release
          at: 34
          do:
            # damage / hit ticks use the same block: three hits, 2 ticks apart (each occurrence sees i). `at: 0` = the group occurrence tick (34);
            # the group block is not inherited and child timing is relative to it (2.0a, rev4.1 corrected `at: 34` here, which meant 68)
            - {id: pulse, op: hit, at: 0, every: 2, for: 6, anchor: caster, targets: enemies, shape: {sector: {deg: 360, range: 3, height: 2.0, forward: look}}, ignore_invulnerability: false, window: once, damage: {physical: "= 10 + 2 * i"}}
            - {id: boom, op: sound, sound: entity.generic.explode, anchor: palm, volume: 0.8, pitch: 1.2}
            # CEL class T on a display: a flash whose size follows a curve of t. The curve is fitted to segments; the budget is 0.03 blocks.
            - id: flash
              op: display
              kind: sprite
              sprite: couture-s2-haze-soft
              anchor: palm
              billboard: center
              size: [0.3, 0.3]            # ENGINE GAP: display `size` is literal [w, h] only, so the class T size curve of ADR 3.4 is not expressible; constant mean size
              for: 4

    done: {final: true}