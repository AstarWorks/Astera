# ADR-0303 example (d): a sound, a particle and a display share ONE timing block and ONE law vocabulary (ADR-0303 2.0, 3.4, 3.5).
# Scene: a charging orb. The group below gives {at, every, for} to all three; every op reads the same words.
apiVersion: astera/v3
kind: Skill
id: example-charge-orb
anchors:
  - {id: palm, at: caster.hand_r, mount: caster}
presentation:
  timeline:
    - id: charge
      at: 4                    # default `at` of every op below
      for: 30                  # the group's window; ops inherit it unless they override
      do:
        # DISPLAY (extended kind): one instance, lives for the group's window (for: 30); laws have their own from/for windows.
        - id: orb
          op: display
          kind: sprite
          sprite: couture-s2-haze-soft
          at: palm
          offset: {forward: 0.4}
          billboard: center
          size: [0.2, 0.2]                                       # blocks
          motion:
            - {law: grow, prop: size, per_tick: [0.01, 0.01], accel: 0.0004, from: 0, for: 30}  # swells, faster and faster
            - {law: spin, axis: face, deg_per_tick: 6, accel: 0.4}

        # PARTICLE (point kind): repeats every 2 ticks inside the same window. SAME grow / accel words, acting on its own properties.
        - id: sparks
          op: particle
          particle: end_rod
          at: palm
          every: 2                                               # occurrences at 4, 6, 8, ... (exact multiples of 2)
          count: 2
          offset: [0.3, 0.3, 0.3]
          extra: 0.02
          motion:
            - {law: grow, prop: count, per_tick: 0.25}                        # thicker each tick (rounded per occurrence)
            - {law: grow, prop: offset, per_tick: [-0.008, -0.008, -0.008], from: 0, for: 30}   # the spread box tightens: sparks are drawn in
            - {law: grow, prop: extra, per_tick: 0.002, accel: 0.0001}                        # and faster

        # SOUND (point kind): the same every/for; a rising hum. `accel` on pitch is the same law field as `accel` on spin.
        - id: hum
          op: sound
          sound: block.beacon.ambient
          at: palm
          every: 2
          volume: 0.4
          pitch: 0.6
          motion:
            - {law: grow, prop: pitch, per_tick: 0.01, accel: 0.0005}        # per occurrence: pitch = 0.6 + 0.01*tau + ...
            - {law: fade,  prop: volume, exponent: 1.0, from: 24, for: 6}      # fades out over the last 6 ticks (1.0 stated, not hidden: 2.0b)

        # CEL on the SAME fields: spawn-time expressions on the repeat index, no extra writes (class S). `rand()` is seeded per (cast, op, i).
        - id: ring
          op: particle
          particle: electric_spark
          at: palm
          every: 2
          offset: {left: "= sin(i * 0.5) * 0.3", up: "= cos(i * 0.5) * 0.3"}     # an emit point circling the palm
          count: 0                                                              # vanilla count 0: offset is the DIRECTION, extra the speed
          extra: "= 0.05 + 0.01 * rand()"

    - id: release
      at: 34
      do:
        # damage / hit ticks use the same block: three hits, 2 ticks apart (each occurrence sees i)
        - {id: pulse, op: hit, at: 34, every: 2, times: 3, shape: {sector: {deg: 360, range: 3}}, damage: "= 10 + 2 * i"}
        - {id: boom, op: sound, sound: entity.generic.explode, at: palm, volume: 0.8, pitch: 1.2}
        # CEL class T on a display: a flash whose size follows a curve of t. The curve is fitted to segments; the budget is 0.03 blocks.
        - id: flash
          op: display
          kind: sprite
          sprite: couture-s2-haze-soft
          at: palm
          billboard: center
          size: "= [0.2 + 0.1 * t, 0.2 + 0.1 * t]"
          for: 4
