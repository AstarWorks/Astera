# ADR-0303 example (h): the SAME effect, written in the declarative form (primary) and in the imperative `seq:` sugar, with the identical expanded table.
# Effect: a charge state: a shimmer sound every 4 ticks for 16 ticks, an orb display for 16 ticks, and a flash display at tick 16 for 3 ticks.
---
# 1) declarative (recommended default)
apiVersion: astera/v3
kind: Skill
id: example-seq-declarative
machine:
  start: charge
  states:
    charge:
      for: 19
      then: end
      do:
        - {id: shimmer, op: sound, sound: block.amethyst_block.chime, at: caster, volume: 0.5, pitch: "= 1.0 + 0.1 * i", every: 4, for: 16}
        - {id: orb,   op: display, kind: sprite, sprite: haze-soft, at: caster, size: [0.4, 0.4], at_tick: 0, for: 16}
        - {id: flash, op: display, kind: sprite, sprite: flash,     at: caster, size: [1.0, 1.0], at_tick: 16, for: 3}
    end: {final: true}
---
# 2) imperative sugar: same effect with seq. `wait` advances the running offset; each item fires at the current offset.
apiVersion: astera/v3
kind: Skill
id: example-seq-imperative
machine:
  start: charge
  states:
    charge:
      for: 19
      then: end
      do:
        - seq:
            - {id: orb,     op: display, kind: sprite, sprite: haze-soft, at: caster, size: [0.4, 0.4], for: 16}   # offset 0
            - {id: shimmer0, op: sound, sound: block.amethyst_block.chime, at: caster, volume: 0.5, pitch: 1.0}
            - {wait: 4}
            - {id: shimmer1, op: sound, sound: block.amethyst_block.chime, at: caster, volume: 0.5, pitch: 1.1}
            - {wait: 4}
            - {id: shimmer2, op: sound, sound: block.amethyst_block.chime, at: caster, volume: 0.5, pitch: 1.2}
            - {wait: 4}
            - {id: shimmer3, op: sound, sound: block.amethyst_block.chime, at: caster, volume: 0.5, pitch: 1.3}
            - {wait: 4}
            - {id: flash, op: display, kind: sprite, sprite: flash, at: caster, size: [1.0, 1.0], for: 3}   # offset 16
    end: {final: true}
# Both expand (generated) to the IDENTICAL table:
#   charge  ticks 0-19   firings: sound chime @0,4,8,12 x4 (pitch 1.0,1.1,1.2,1.3) | orb display 0-16 | flash display 16-19
#   writes: orb 1 segment (0 laws), flash 1 | hits 0 | path: charge(19)->end  min 19 max 19
# Check (lint + sim `seq-equality`): desugar(seq) == declarative tick for tick; a mismatch fails the load.
# The declarative form is shorter at scale (one `every: 4, for: 16` replaces four ops and three waits) and is what the converter emits.
