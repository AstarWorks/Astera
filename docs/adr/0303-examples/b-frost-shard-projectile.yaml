# ADR-0303 example (b): frost-shard (simple-shoot projectile). Gameplay is unchanged from content/skills/frost-shard/skill.yaml; only the presentation
# half is in the new schema. The gameplay body `bolt` moves the hit volume; the display is anchored on it.
apiVersion: astera/v3
kind: Skill
id: frost-shard
anchors:
  - {id: muzzle, at: caster.eye, offset: {forward: 0.5}, mode: snapshot}   # was pt_caster_0_m0p2_1 / pt_caster_eye_...
  - {id: heart,  at: victim.body, offset: {up: 0.2}}                       # was pt_enemy_0_1_0
presentation:
  timeline:
    - id: cast
      at: 0
      do:
        - id: shard
          op: display
          kind: item
          item: minecraft:prismarine_shard
          context: fixed
          at: bolt                    # gameplay frame, read-only; constant-velocity law exports segments, here sampled per tick (hit can end it)
          scale: [0.9, 0.9, 0.9]      # vanilla scale
          rotate: [{axis: forward, deg: 45}]
          life: {until: end}          # `end` = the projectile's own end event (hit, block, expire)
          motion:
            - {law: follow, anchor: bolt, step: 1}
            - {law: spin, axis: forward, deg_per_tick: 30}      # tumbles about its flight direction
        - {id: snd, op: sound, sound: "astera:skills/frost-cast", at: caster, volume: 0.8, pitch: 1.4}
        - {id: puff, op: particle_def, def: frost-cast, at: muzzle}
    - id: trail
      at: 0
      every: 1
      until: end
      do:
        - {id: t1, op: particle, particle: snowflake, at: {anchor: bolt, sweep: 0.3}, count: 2, offset: [0.08, 0.08, 0.08], extra: 0.01}
        - {id: t2, op: particle, particle: dust,      at: {anchor: bolt, sweep: 0.3}, count: 2, offset: [0.06, 0.06, 0.06], extra: 0, color: "#ebf5ff", size: 1.4}
        - {id: t3, op: particle, particle: end_rod,   at: {anchor: bolt, sweep: 0.3}, count: 1, offset: [0.02, 0.02, 0.02], extra: 0}
  "on":
    hit:
      - {id: snd_hit, op: sound, sound: "astera:skills/frost-impact", at: contact.point, volume: 0.7, pitch: 1.5}
      - {id: p_snow,  op: particle, particle: snowflake, at: heart, count: 30, extra: 0.15}
      - {id: p_rod,   op: particle, particle: end_rod,   at: heart, count: 10, extra: 0.2}
      - {id: p_dust,  op: particle, particle: dust,      at: heart, count: 20, offset: [0.4, 0.4, 0.4], extra: 0, color: "#bee6ff", size: 1.3}
      - {id: p_burst, op: particle, particle: snowflake, at: heart, count: 0, offset: "= contact.normal", extra: 0.04}   # count 0: direction + speed, plain vanilla
    block:
      - {id: snd_blk, op: sound, sound: "astera:skills/frost-impact", at: contact.point, volume: 0.5, pitch: 1.6}
      - {id: p_blk,   op: particle_def, def: frost-impact, at: contact.point}
    expire:
      - {id: p_exp, op: particle_def, def: frost-impact, at: contact.point}
