# Recipe record for the bastion-greatsword S1 SFX. Route: FREE procedural synthesis, no API, no network, no paid service.
# Build:   python3 tools/sound-gen/scripts/bastion_s1_synth.py      (numpy + scipy + ffmpeg/libvorbis)
# Check:   python3 tools/sound-gen/scripts/bastion_s1_evidence.py <dir>   (ffprobe, levels, wave+spectro PNG)
#          python3 tools/sound-gen/scripts/bastion_s1_timeline.py <dir>   (placed-cue timeline, per-tick peaks)
# Encode:  libvorbis -q:a 5, mono, 44.1 kHz. NOT to_ogg.sh (its per-file loudnorm flattens layer levels);
#          peak-normalised to the target below, re-trimmed so the DECODED peak is within 0.1 dB.
# Sources: synth, plus CC0 layers inside the impact-steel / cut-thud / ground-slam composites only: Kenney "Impact Sounds" 1.0
# (CC0, kenney.nl; impactPlate_heavy_000/001, impactMetal_heavy_001, impactMetal_medium_000, impactSoft_heavy_001), pitched down,
# filtered and saturated. The zip is fetched to /tmp, never committed. No game audio, no vanilla audio.
