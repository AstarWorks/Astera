<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pose stills</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { padding: 12px 16px; }
  .st-row { margin: 18px 0 26px; }
  .st-row h2 { margin: 0 0 6px; font-size: 15px; }
  .st-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .st-grid figure { margin: 0; }
  .st-grid img { width: 100%; display: block; background: #111; cursor: zoom-in; min-height: 40px; }
  .st-grid figcaption { font-size: 12px; opacity: .7; padding-top: 2px; }
  .st-notes { white-space: pre-wrap; margin: 8px 0; }
  .st-full { position: fixed; inset: 0; background: #000e; display: none; align-items: center; justify-content: center; z-index: 9; cursor: zoom-out; }
  .st-full img { max-width: 100%; max-height: 100%; }
</style>
</head>
<body>
<div class="top"><span class="crumb"><a href="/">&larr; 武器一覧</a></span> <h1 id="title">loading&hellip;</h1> <span class="sub" id="sub"></span></div>
<div class="st-notes" id="notes"></div>
<div id="rows"></div>
<div class="st-full" id="full"><img alt=""></div>
<script>
const id = new URLSearchParams(location.search).get("id") || "";
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const full = document.getElementById("full");
full.onclick = () => { full.style.display = "none"; };
const LAB = { reference: "参照 Reference", preview: "プレビュー（実機ではない）", ingame: "実機 In-game" };
fetch("/api/cases/" + encodeURIComponent(id)).then((r) => { if (!r.ok) throw new Error("case " + r.status); return r.json(); }).then((d) => {
  document.getElementById("title").textContent = d.case.skill?.name ?? id;
  document.getElementById("sub").textContent = id;
  document.getElementById("notes").textContent = d.case.notes || "";
  const s = d.stills, root = document.getElementById("rows");
  if (!s) { root.textContent = "stills が未公開です: node tools/skill-compare/scripts/publish-stills.mjs " + (d.case.skill?.asteraSkillId ?? id) + " <spec.json>"; return; }
  document.getElementById("sub").textContent = id + " ・ " + (s.title || "") + (s.contentDirty ? " ・ dirty" : "") + " ・ " + (s.contentRevision || "").slice(0, 10);
  for (const row of s.rows) {
    const sec = el("section", "st-row"), g = el("div", "st-grid");
    sec.append(el("h2", null, row.label), g);
    for (const c of ["reference", "preview", "ingame"]) {
      const f = el("figure"), i = el("img");
      if (row[c]) { i.src = s.base + row[c]; i.alt = row.label + " " + c; i.onclick = () => { full.firstChild.src = i.src; full.style.display = "flex"; }; }
      f.append(i, el("figcaption", null, LAB[c]));
      g.append(f);
    }
    root.append(sec);
  }
}).catch((e) => { document.getElementById("title").textContent = "error: " + e.message; });
</script>
</body>
</html>
