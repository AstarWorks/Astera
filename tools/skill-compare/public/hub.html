<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astera レビュー</title>
<link rel="stylesheet" href="/style.css"><style>
body{padding:24px;font-family:system-ui;background:#0b1019;color:#e2ebf6}h1{font-size:24px}#hub-layout{display:grid;grid-template-columns:minmax(250px,30%) 1fr;gap:24px}#hub-list{max-height:70vh;overflow:auto}#hub-list button{display:block;width:100%;text-align:left;padding:9px;margin:4px 0;color:#c5def8;background:#172435;border:1px solid #34485e;border-radius:5px;overflow-wrap:anywhere}#hub-preview img,#hub-preview video{max-width:100%;max-height:72vh}#hub-preview iframe{width:100%;height:72vh;border:1px solid #34485e;background:white}#hub-preview pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:70vh;overflow:auto}#hub-path{overflow-wrap:anywhere;color:#9bb1cb}#hub-message{color:#9bb1cb}a{color:#9bceff}@media(max-width:800px){#hub-layout{grid-template-columns:1fr}}
</style></head><body><h1 id="hub-title"></h1><p id="hub-message" role="status">読み込み中…</p><p id="hub-path"></p><div id="hub-layout"><aside id="hub-list"></aside><main id="hub-preview"></main></div><script type="module" src="/hub.js"></script></body></html>
