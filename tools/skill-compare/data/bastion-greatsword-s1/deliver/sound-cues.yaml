# limbus-sound deliverable for bastion-greatsword-s1 (r2: reference-matched, see docs/contributing/vfx-team/sound.md "Reference profile").
# Director turns each row into play_sound (delay_ticks). hit1 / hit2 = coin 1 / coin 2 of ONE cast; ticks are skill ticks (0 = cast).
# pitch = play_sound pitch (playback-rate multiplier: peak_ms and length scale by 1/pitch).
# volume = LINEAR play_sound volume, solved by `bastion_s1_mix.py calibrate` so each event's level matches the reference relative to
# the hit-1 body (E4). Mixed peak is checked by `bastion_s1_mix.py mix`.
# Several files carry internal lead silence on purpose (whoosh-sweep 24 ms, armor-ring / ring-whirl 8 ms) so the onsets land
# between tick boundaries like the reference (shimmer +1.65 tick after contact).
cues:
