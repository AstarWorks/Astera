<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astera Skill Viewer</title>
<style>
  :root { --bg:#10131a; --panel:#1a1f2b; --fg:#e6e9f0; --muted:#8c94a8; --accent:#ffb84d; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.4 ui-monospace, Menlo, Consolas, monospace; overflow:hidden; }
  #stage { position:absolute; inset:0 0 56px 0; }
  body.capture #stage { inset:0; }
  canvas { display:block; width:100%; height:100%; }
  #bar { position:absolute; left:0; right:0; bottom:0; height:56px; background:var(--panel); display:flex; align-items:center; gap:10px; padding:0 12px; box-sizing:border-box; }
  body.capture #bar { display:none; }
  #bar button, #bar select, #bar label.file { background:#262d3d; color:var(--fg); border:1px solid #394159; border-radius:4px; padding:4px 10px; font:inherit; cursor:pointer; }
  #bar button:hover, #bar label.file:hover { border-color:var(--accent); }
  #scrub { flex:1; accent-color:var(--accent); min-width:80px; }
  #tickLabel { min-width:130px; text-align:right; color:var(--muted); }
  #info { position:absolute; left:10px; top:8px; max-width:46%; pointer-events:none; text-shadow:0 1px 2px #000, 0 0 4px #000; white-space:pre; }
  #info .h { color:var(--accent); }
  #info .m { color:var(--muted); }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #drop { position:absolute; inset:0 0 56px 0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:15px; pointer-events:none; text-align:center; }
  #drop.hidden { display:none; }
  body.dragging #stage { outline:2px dashed var(--accent); outline-offset:-8px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas><div id="flash"></div><div id="info"></div></div>
<div id="drop">Drop a <b>&nbsp;sim-traces/&lt;scenario&gt;.json&nbsp;</b> here, or use "Open trace".<br>(tools/game-sim/build/sim-traces/showcase-*.json)</div>
<div id="bar">
  <label class="file">Open trace<input id="file" type="file" accept=".json,application/json" hidden></label>
  <button id="play" title="Space">Play</button>
  <button id="restart" title="Home">|&lt;</button>
  <input id="scrub" type="range" min="0" max="0" step="0.05" value="0">
  <span id="tickLabel">tick 0 / 0</span>
  <select id="speed" title="Playback speed">
    <option value="0.1">0.1x</option><option value="0.25">0.25x</option><option value="0.5">0.5x</option>
    <option value="1" selected>1x (20 TPS)</option><option value="2">2x</option><option value="4">4x</option>
  </select>
  <select id="cam" title="Camera preset">
    <option value="side">Camera: side</option><option value="behind">Camera: behind caster</option>
    <option value="close">Camera: close (caster front)</option><option value="impact">Camera: impact (first target)</option><option value="top">Camera: top</option><option value="front">Camera: front (target view)</option>
  </select>
  <label><input id="loop" type="checkbox" checked> loop</label>
</div>
<script src="viewer.js"></script>
</body>
</html>
