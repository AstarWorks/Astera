<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Astera Skill 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #10131a; overflow: hidden; color: #e6e9f0; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  .panel { position: fixed; background: rgba(16, 19, 26, .82); border: 1px solid #2a3142; border-radius: 6px; padding: 6px 8px; }
  #top { top: 8px; left: 8px; right: 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #top h1 { margin: 0; font-size: 13px; color: #ffb84d; font-weight: 600; }
  #side { top: 56px; right: 8px; width: 270px; max-height: calc(100% - 150px); overflow: auto; }
  #bottom { left: 8px; right: 8px; bottom: 8px; }
  #bar { display: flex; gap: 8px; align-items: center; }
  #timeline { position: relative; flex: 1; height: 26px; }
  #timeline input { position: absolute; left: 0; right: 0; top: 8px; width: 100%; margin: 0; }
  .mark { position: absolute; top: 0; width: 2px; height: 10px; background: #ff5d5d; pointer-events: none; }
  .mark.fx { background: #6fb7ff; }
  button, select { background: #222a3a; color: #e6e9f0; border: 1px solid #38425a; border-radius: 4px; padding: 3px 8px; font: inherit; cursor: pointer; }
  button:hover { background: #2c3750; }
  button.on { background: #3d5fa8; border-color: #6c8fe0; }
  label { display: inline-flex; gap: 3px; align-items: center; cursor: pointer; white-space: nowrap; }
  #side h2 { margin: 6px 0 3px; font-size: 11px; color: #8d97ad; text-transform: uppercase; letter-spacing: .06em; }
  #side h2:first-child { margin-top: 0; }
  .hit { padding: 1px 4px; cursor: pointer; border-radius: 3px; }
  .hit:hover { background: #2c3750; }
  .hit.now { background: #7a2530; }
  #hud { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); font-size: 18px; color: #ff7676; text-shadow: 0 0 6px #000; pointer-events: none; }
  #warn { color: #c9a45a; font-size: 11px; line-height: 1.35; }
  kbd { background: #222a3a; border: 1px solid #38425a; border-radius: 3px; padding: 0 3px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="panel">
  <h1 id="title">skill</h1>
  <span id="presets"></span>
  <label><input type="checkbox" id="follow"> follow caster</label>
  <span id="layers"></span>
</div>
<div id="hud"></div>
<div id="side" class="panel">
  <h2>tick</h2><div id="tickinfo"></div>
  <h2>hit events (from the skill YAML)</h2><div id="hits"></div>
  <h2>keys</h2>
  <div><kbd>space</kbd> play/pause <kbd>&larr;</kbd><kbd>&rarr;</kbd> tick step <kbd>1-7</kbd> camera presets <kbd>L</kbd> loop<br>
  drag = orbit, wheel = zoom, right-drag = pan. free cam: drag look, <kbd>WASD</kbd> move, <kbd>Q</kbd><kbd>E</kbd> down/up, <kbd>shift</kbd> fast</div>
  <h2>notes</h2><div id="warn"></div>
</div>
<div id="bottom" class="panel">
  <div id="bar">
    <button id="play">&#9654;</button><button id="prev">&#9664;|</button><button id="next">|&#9654;</button>
    <span id="tl" style="min-width:90px">0 / 0</span>
    <div id="timeline"><input type="range" id="scrub" min="0" max="60" step="1" value="0"></div>
    <select id="speed"><option>0.1</option><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select><span>x</span>
    <label><input type="checkbox" id="loop" checked> loop</label>
  </div>
</div>
<script type="module" src="viewer3d.js"></script>
</body>
</html>
