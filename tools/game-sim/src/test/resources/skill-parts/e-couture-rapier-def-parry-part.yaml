# ADR-0303 example (e): the `parry` part and couture-rapier-def calling it. v1 data (content/skills/couture-rapier-def/skill.yaml): resist.physical +0.7 for 30
# ticks, incoming_hit window 30 ticks, range 3.5, riposte 7 ticks after the hit, 30 physical damage. The visual guard is illustrative.
---
apiVersion: astera/v3
kind: Part
id: parry
params:
  window:    {type: ticks,  required: true}
  range:     {type: blocks, required: true}
  resist:    {type: number, required: true}        # no default: the caller states 0.7
  delay:     {type: ticks,  required: true}
  riposte_dmg: {type: number, required: true}
frames_in:  {weapon: anchor}                       # visuals are written against weapon.tip / weapon.long: any weapon works
frames_out: {tip: weapon.tip}
emits: [parried, whiff, end]
machine:
  start: parry_window
  states:
    parry_window:
      for: "= window"
      then: whiff
      enter:
        - {id: resist, op: modify_attribute, attribute: resist.physical, operation: add, amount: "= resist", target: caster, for: "= window"}
        - {id: snd_guard, op: sound, sound: item.shield.block, anchor: caster, volume: 0.6, pitch: 1.5}
      do:
        - id: guard_plate                           # owned by this state: ends at exit, no remove needed
          op: display
          kind: sprite
          sprite: guard-arc
          anchor: weapon.tip
          billboard: center
          size: [0.8, 0.8]
          for: "= window"
          motion: [{law: spin, axis: face, deg_per_tick: 12}, {law: fade, exponent: 1.0, from: 20, for: 10}]
      on:
        - {event: hurt, when: "= dist(caster, event.attacker) <= range", to: riposte, do: [{emit: parried}]}
    riposte:
      for: "= delay"
      then: end
      do:
        - {id: wind, op: sound, sound: item.trident.riptide_1, anchor: caster, volume: 0.7, pitch: 1.6}
      exit:                                          # the hit lands as the state ends (7 ticks after the parry), on every way out except cancel
        - {id: riposte_hit, op: damage, target: event.attacker, damage: {physical: "= riposte_dmg"},
           ignore_invulnerability: true, when: "= dist(caster, event.attacker) < range"}
    whiff: {for: 6, then: end, do: [{id: snd_whiff, op: sound, sound: block.wool.break, anchor: caster, volume: 0.3, pitch: 1.0}]}
    end: {final: true}
---
apiVersion: astera/v3
kind: Skill
id: couture-rapier-def
item: couture-rapier
meta: {cooldown_ticks: 85, resource_cost: 10}
anchors:
  - {id: blade, anchor: caster.eye, mode: follow}
machine:
  start: guard
  states:
    guard:
      use: parry
      with: {window: 30, range: 3.5, resist: 0.7, delay: 7, riposte_dmg: 30}
      frames: {weapon: blade}
      on:
        - {event: guard.end, to: done}
    done: {final: true}
# Expanded table (generated by `expand`):
#   guard (part parry)   window ticks 0-30   branches: hurt[dist<=3.5] -> guard/riposte | timer(30) -> guard/whiff
#     guard/parry_window  firings: resist @0 x1, snd_guard @0 x1 | guard_plate display 0-30 | writes: 2 segments
#     guard/riposte       ticks 0-7 | hits: riposte_hit @7 x1
#     guard/whiff         ticks 0-6
#   paths: parry_window(0..30) + riposte(7) = min 7, max 37 | parry_window(30) + whiff(6) = 36
