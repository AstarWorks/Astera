# EXAMPLE patch (test fixture, not shipped, bound to no item): VFX-only swap, the shape of a paid cosmetic.
# Different spark particle and count, both blade trails removed, the throw sound swapped, one extra burst added.
# Gameplay is untouched (a skin patch may only name presentation.*).
apiVersion: astera/v2
kind: Patch
target: couture-rapier-s2
variant: example_vfx_swap
patchKind: skin
presentation:
  params: {spark_particle: end_rod, spark_count: 30}
  timeline:
    - id: spin_fx
      do:
        - {id: trail_a, $patch: delete}
        - {id: trail_b, $patch: delete}
  on:
    release:
      - {id: throw_snd, sound: couture.slash_light}
      - {id: petals, op: emit, at: palm, particle: cherry_leaves, count: 12, dir: "= forward(volley)", spread_deg: 25}
