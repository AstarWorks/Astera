sprites:
  expanding-ring:
    size: 64
    frames: 8
    graph:
      nodes:
        clock:
          type: anim.time
        radius:
          type: anim.curve
          params:
            mode: once
            keyframes:
            - t: 0
              v: 3
            - t: 0.4
              v: 22
            - t: 1
              v: 28
        thickness:
          type: anim.curve
          params:
            keyframes:
            - t: 0
              v: 5
            - t: 1
              v: 1
        ring:
          type: shape.ring
          params:
            radius:
              from: radius.value
            thickness:
              from: thickness.value
            color: '#7fd6ff'
        out:
          type: output
          inputs:
            image: ring.image
  rotating-magic-circle:
    size: 64
    frames: 8
    graph:
      nodes:
        ring:
          type: shape.ring
          params:
            radius: 27
            thickness: 1
            color: '#ffd25a'
        star:
          type: shape.star
          params:
            points: 7
            step: 2
            radius: 23
            thickness: 1
            color: '#ffe9a8'
        spoke:
          type: shape.line
          params:
            x0: 48
            y0: 32
            x1: 59
            y1: 32
            thickness: 2
            color: '#ffffff'
        repeat:
          type: xform.repeat_radial
          params:
            count: 7
          inputs:
            image: spoke.image
        layers:
          type: composite.add
          inputs:
            a: star.image
            b: ring.image
        pattern:
          type: composite.over
          inputs:
            a: repeat.image
            b: layers.image
        rotation:
          type: anim.rotate
          params:
            speed_deg_per_sec: 120
          inputs:
            image: pattern.image
        glow:
          type: filter.bloom
          params:
            radius: 3
            intensity: 0.5
          inputs:
            image: rotation.image
        out:
          type: output
          inputs:
            image: glow.image
  slash-arc-with-trail:
    size: 64
    frames: 8
    graph:
      nodes:
        angle:
          type: anim.curve
          params:
            keyframes:
            - t: 0
              v: -80
            - t: 1
              v: 100
        arc:
          type: shape.arc
          params:
            radius: 22
            start_deg: 0
            end_deg: 110
            thickness: 5
            taper: 0.8
            color: '#d8e4ff'
        sweep:
          type: xform.rotate
          params:
            angle_deg:
              from: angle.value
          inputs:
            image: arc.image
        trail:
          type: filter.trail
          params:
            decay: 0.6
            mode: add
          inputs:
            image: sweep.image
        out:
          type: output
          inputs:
            image: trail.image
  node-catalog:
    size: 32
    frames: 4
    graph:
      nodes:
        circle:
          type: shape.circle
        polygon:
          type: shape.polygon
        line:
          type: shape.line
        field:
          type: shape.field
          params:
            expression: 1-hypot(x-16,y-16)/12
        number:
          type: values.number
          params:
            value: 2
        vec:
          type: values.vec2
          params:
            x: 16
            y: 16
        wiggle:
          type: anim.wiggler
        time:
          type: anim.time
        value_color:
          type: values.color
          params:
            value: '#ffcc66'
        value_string:
          type: values.string
          params:
            value: outside
        value_boolean:
          type: values.boolean
          params:
            value: true
        value_curve:
          type: values.curve
          params:
            value:
            - t: 0
              v: 1
            - t: 1
              v: 0
        value_gradient:
          type: values.gradient
          params:
            value:
            - t: 0
              color: '#ffffff'
            - t: 1
              color: '#ffffff00'
        value_colors:
          type: values.colors
          params:
            value:
            - '#000000'
            - '#ffffff'
        value_expression:
          type: values.expression
          params:
            value: '1'
        value_variables:
          type: values.variables
          params:
            value: {}
        value_dots:
          type: values.dots
          params:
            value: []
        import:
          type: image.import
          params:
            path: dot.png
        value:
          type: noise.value
        perlin:
          type: noise.perlin
        radial:
          type: generate.gradient_radial
        scatter:
          type: generate.scatter
          params:
            count: 8
            shape: star
          inputs:
            mask: circle.image
        fxscatter:
          type: generate.fx_scatter
          params:
            count: 4
          inputs:
            pattern: polygon.image
        effector:
          type: particle.effector
          params:
            mode: turbulence
        particles:
          type: particle.emitter
          params:
            count: 5
            velocity_direction: angle
            velocity_angle_deg: -90
          inputs:
            sprite: polygon.image
            effector: effector.value
        step0:
          type: xform.translate
          params:
            dx: 1
          inputs:
            image: circle.image
        step1:
          type: xform.rotate
          params:
            angle_deg:
              from: wiggle.value
          inputs:
            image: step0.image
        step2:
          type: xform.scale
          params:
            sx: 1.1
          inputs:
            image: step1.image
        step3:
          type: xform.mirror
          inputs:
            image: step2.image
        step4:
          type: xform.polar
          params:
            mode: to_cartesian
          inputs:
            image: step3.image
        step5:
          type: xform.polar_repeat
          params:
            count: 5
          inputs:
            image: step4.image
        step6:
          type: xform.kaleidoscope
          params:
            count: 5
          inputs:
            image: step5.image
        step7:
          type: anim.scale_pulse
          inputs:
            image: step6.image
        step8:
          type: anim.scale_ramp
          inputs:
            image: step7.image
        step9:
          type: anim.stagger
          inputs:
            image: step8.image
        step10:
          type: filter.blur
          params:
            radius:
              from: number.value
          inputs:
            image: step9.image
        step11:
          type: filter.dilate
          params:
            radius: 1
          inputs:
            image: step10.image
        step12:
          type: filter.outline
          params:
            mode:
              from: value_string.value
            color:
              from: value_color.value
          inputs:
            image: step11.image
        step13:
          type: filter.palette
          params:
            colors: 4
          inputs:
            image: step12.image
        step14:
          type: filter.dither
          params:
            pattern: floyd
          inputs:
            image: step13.image
        step15:
          type: filter.seamless
          inputs:
            image: step14.image
        step16:
          type: filter.directional_warp
          inputs:
            image: step15.image
            map: value.image
        step17:
          type: filter.slope_blur
          inputs:
            image: step16.image
            slope: perlin.image
        step18:
          type: filter.feedback
          params:
            feedback_scale: 1.02
            feedback_rotate_deg: 3
          inputs:
            image: step17.image
        blend_over:
          type: composite.over
          inputs:
            a: step18.image
            b: scatter.image
        blend_add:
          type: composite.add
          inputs:
            a: blend_over.image
            b: fxscatter.image
        blend_screen:
          type: composite.screen
          inputs:
            a: blend_add.image
            b: particles.image
        blend_multiply:
          type: composite.multiply
          inputs:
            a: blend_screen.image
            b: radial.image
        blend_max:
          type: composite.max
          inputs:
            a: blend_multiply.image
            b: field.image
        out:
          type: output
          inputs:
            image: blend_max.image
