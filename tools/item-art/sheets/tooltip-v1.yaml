name: tooltip-v1
grid: [3, 3]
background: "#00FF00"
style: >-
  pixel art fantasy inventory tooltip panels, flat front view, perfectly square and axis aligned.
  Each panel has a charcoal black solid interior and a thin silver white metal frame, with all
  ornament confined to the outermost 12 percent. Straight uniform edges between the corners,
  no interior graphics, no letters, no perspective, no lighting outside the panel. The frames
  themselves ARE the requested artwork, despite the generic no-frames sheet instruction.
  Keep the same outer square dimensions in every occupied cell. Monochrome artwork: silver
  highlights and charcoal shadows only; the build tints the metal to the rarity colour.
cells:
  common: plain narrow silver square frame, tiny bevel, no ornament
  uncommon: narrow silver square frame, subtle double bevel, tiny clipped corners
  rare: narrow silver square frame, small diamond ornaments entirely inside each corner
  epic: narrow silver square frame, elegant small angular filigree entirely inside each corner
  legendary: narrow silver square frame, small ornate crown-like diamond filigree entirely inside each corner
