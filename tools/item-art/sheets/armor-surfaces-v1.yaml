name: armor-surfaces-v1
texture_tiles: true
grid:
- 6
- 4
background: '#FF00FF'
style: ORTHOGRAPHIC FLAT TEXTURE TILES, NOT objects or inventory icons. Each tile
  is an opaque square completely filled edge to edge by the described armor surface;
  no outline, no perspective, no gaps, no lighting gradient. Original crisp low resolution
  pixel art for Minecraft armor UV mapping. Exact grid boundaries. Row 1 scout green/brown,
  row 2 charcoal chain, row 3 silver plate, row 4 cyan/gold ornate.
cells:
