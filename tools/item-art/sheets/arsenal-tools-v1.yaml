name: arsenal-tools-v1
grid:
- 5
- 4
background: '#FF00FF'
style: chunky crisp pixel art for 32px Minecraft-like inventory, bold dark outlines,
  top left light, restrained saturated palettes, no text or particles. Each icon 75
  percent of its cell, ample solid magenta spacing.
