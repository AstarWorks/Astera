# Generated point-frame offsets are [left, up, forward] in the parent frame.
apiVersion: "astera/v2"
kind: Skill
id: fireball-cast
item: fireball-charge
meta: {name: {ja: "火球", en: Fireball}, description: {ja: "火の玉を放ち、着弾で爆ぜる。", en: "Hurls a fireball that bursts on impact."}, cooldown_ticks: 70, resource_cost: 16, tags: [ranged, fire, magic]}
frames:
  - {id: pt_caster_eye_0_0_0p5, kind: point, parent: caster.eye, offset: [0.0, 0.0, 0.5]}
  - {id: pt_caster_0_m0p25_0p9, kind: point, parent: caster, offset: [0.0, -0.25, 0.9]}
  - {id: pt_enemy_0_1p2_0, kind: point, parent: enemy, offset: [0.0, 1.2, 0.0]}
gameplay:
  params: {launch_speed: 1.5, max_lifetime_ticks: 60, aim_distance: 50.0, explode_power: 1.2, explode_radius: 2.5, explode_fire: 27.5, burn_ticks: 20}
  expose:
    - {id: flight_speed, param: launch_speed}
  timeline:
    - id: t0
      at: 0
      do:
        - id: bolt
          op: projectile
          body: bolt
          from: pt_caster_eye_0_0_0p5
          velocity: "= normalize(aim_point(caster, aim_distance) - pos(pt_caster_eye_0_0_0p5)) * launch_speed"
          gravity: 0.0
          drag: 0.0
          max_ticks: "${max_lifetime_ticks}"
          volume: {sphere: {at: bolt, radius: 0.3}}
          pierce: 0
  "on":
    hit:
      - {id: explode, op: explode, at: enemy, power: "${explode_power}", break_blocks: false, radius: "${explode_radius}", components: [{kind: fire, amount: "${explode_fire}"}]}
