name: Astera-Chat
version: '${version}'
main: com.astarworks.astera.chat.platform.AsteraChatPlugin
api-version: '26.3'
folia-supported: true
authors: [AstarWorks]
description: Cross-server chat, Japanize, ranks, Discord and titles.
depend: [Astera-Core]
permissions:
  astera.chat.title:
    default: op
  astera.chat.japanize:
    default: true
  astera.chat.translate:
    default: true
