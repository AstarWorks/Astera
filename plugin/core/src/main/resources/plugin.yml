name: Astera-Core
version: '${version}'
main: com.astarworks.astera.core.platform.AsteraCorePlugin
api-version: '26.3'
folia-supported: true
authors: [AstarWorks]
description: Astera core plugin — shared domain, ServiceRegistry, IDomainEventBus, Paper adapter scaffolding (ADR-0022).
website: https://github.com/AstarWorks/Astera
load: STARTUP
# Wave 6c-stub-packetevents (ADR-0170): PacketEvents loads first so the
# Core onLoad/onEnable can detect + initialise its API. Soft (not depend)
# so Astera boots in vanilla Paper if PacketEvents is absent — the Paper
# adapter falls back to the InMemory IPacketInterceptor.
softdepend: [packetevents]
