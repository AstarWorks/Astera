name: Astera-Weapons
version: '${version}'
main: com.astarworks.astera.weapons.platform.AsteraWeaponsPlugin
api-version: '1.21'
authors: [AstarWorks]
description: Astera weapons plugin — custom weapon definitions, /astera-weapons give, click-to-fire (ADR-0022).
website: https://github.com/AstarWorks/Astera
depend: [Astera-Core]
softdepend: [Astera-Match]
commands:
  astera-weapons:
    description: Astera weapons commands (give, …)
    usage: /astera-weapons <subcommand> [args...]
