name: Astera-Persistence
version: '${version}'
main: com.astarworks.astera.persistence.platform.AsteraPersistencePlugin
api-version: '26.3'
authors: [AstarWorks]
description: Astera persistence plugin — Postgres-backed repositories overriding in-memory defaults (ADR-0022).
website: https://github.com/AstarWorks/Astera
depend: [Astera-Core]
# Overlays are registered in onLoad (ADR-0187), before any plugin's onEnable, so
# Core and the feature plugins resolve the final repositories. loadbefore only
# keeps the enable order stable.
loadbefore: [Astera-Items, Astera-Combat, Astera-Match, Astera-Stats, Astera-Economy]
