---
# Placeholder secret (ADR-0179). Real values live in `private/infra/overlays/<env>/`
# as sealed-secrets or SOPS-encrypted blobs. Do NOT commit real values here.
#
# velocity-forwarding-secret: shared by the Velocity pod (VELOCITY_FORWARDING_SECRET)
#   and the lobby / game pods (CFG_VELOCITY_SECRET -> Paper proxies.velocity.secret).
# pg-user / pg-password: the application role in the `databases` namespace
#   (same values as app-user / app-password in postgresql-secret).
apiVersion: v1
kind: Secret
metadata:
  name: astera-runtime
  namespace: astera
type: Opaque
stringData:
  velocity-forwarding-secret: "REPLACE_ME"
  pg-user: "REPLACE_ME"
  pg-password: "REPLACE_ME"
