apiVersion: apps/v1
kind: Deployment
metadata:
  name: astera-game
  namespace: astera
spec:
  # Phase 1: static 1 replica. Phase 1.5 swaps this for KEDA-driven scaling triggered
  # by the matchmaking queue length (see docs/infrastructure/overview.md scaling section).
  # TODO(Phase 1.5): replace Deployment with a Job-per-match or KEDA ScaledObject.
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: astera-game
  template:
    metadata:
      labels:
        app: astera-game
      annotations:
        # Prometheus pod-discovery (see deploy/platform/monitoring/prometheus/configmap.yaml).
        # Worker β exposes the Astera /metrics endpoint on :9092 via the IMetricsRegistry
        # Paper adapter; Prometheus relabel rules pick up these annotations.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9092"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        fsGroup: 1005
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: minecraft
          # Built from docker/Dockerfile (Step 5) — same image as lobby, baked plugin.
          image: ghcr.io/astarworks/astera:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          env:
            - name: EULA
              value: "TRUE"
            - name: TZ
              value: "Asia/Tokyo"
            - name: TYPE
              value: "PAPER"
            - name: VERSION
              value: "26.3"
            - name: USE_NATIVE_TRANSPORT
              value: "true"
            - name: ENABLE_AUTOPAUSE
              value: "FALSE"
            - name: USE_AIKAR_FLAGS
              value: "true"
            - name: CONSOLE
              value: "false"
            - name: SERVER_PORT
              value: "31002"
            - name: INIT_MEMORY
              value: "8G"
            - name: MAX_MEMORY
              value: "12G"
            - name: SERVER_NAME
              value: "ASTERA GAME"
            - name: MOTD
              value: "Astera - Game"
            - name: MAX_PLAYERS
              value: "100"
            - name: DIFFICULTY
              value: "normal"
            - name: PVP
              value: "true"
            - name: SPAWN_PROTECTION
              value: "0"
            - name: VIEW_DISTANCE
              value: "10"
            - name: SIMULATION_DISTANCE
              value: "8"
            - name: ONLINE_MODE
              value: "false"
            - name: ENABLE_RCON
              value: "true"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-rcon
                  key: game-password
            - name: MODE
              value: "survival"
            - name: ALLOW_FLIGHT
              value: "true"
            - name: ASTERA_METRICS_ENABLED
              value: "true"
            - name: ASTERA_METRICS_PORT
              value: "9092"
          ports:
            - containerPort: 31002
              name: minecraft
              protocol: TCP
            - containerPort: 25575
              name: rcon
              protocol: TCP
            - containerPort: 9092
              name: metrics
              protocol: TCP
          # Wave AF 5operator-observability (ADR-0142): k8s probes wired to
          # HttpMetricsServer endpoints /healthz + /readyz. Health source =
          # IServerHealthCheck.snapshot() (Wave 5t / ADR-0086). Pre-Wave-AF
          # the probes were absent — rolling restart would silently strand
          # players or kick them mid-match.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: shared-data
              mountPath: /shared
          resources:
            requests:
              memory: "8Gi"
              cpu: "1500m"
            limits:
              memory: "12Gi"
              cpu: "2500m"
      volumes:
        - name: data
          hostPath:
            path: /srv/astera/game
            type: DirectoryOrCreate
        - name: shared-data
          hostPath:
            path: /srv/astera/shared
            type: DirectoryOrCreate
