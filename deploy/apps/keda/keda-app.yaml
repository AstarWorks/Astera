---
# ArgoCD Application that syncs deploy/keda — KEDA ScaledObject for
# astera-game. The KEDA operator itself is installed via Helm in
# `make local-e2e` (Worker δ); this Application only manages the
# Astera-owned scaling manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: astera-keda
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AstarWorks/Astera.git
    targetRevision: main
    path: deploy/keda
  destination:
    server: https://kubernetes.default.svc
    namespace: astera
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
