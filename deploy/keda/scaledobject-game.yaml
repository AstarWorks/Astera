---
# KEDA ScaledObject — drives autoscaling of the `astera-game` Deployment
# (deploy/minecraft/game/game-deployment.yaml) based on the Prometheus
# gauge `astera_match_active`.
#
# Dependencies:
#   - Worker β: publishes the `astera_match_active` gauge via the
#     IMetricsRegistry port (Paper adapter scrape endpoint).
#   - Worker γ: deploys the Prometheus stack at
#     http://prometheus.monitoring.svc.cluster.local:9090 (truth source per
#     deploy/platform/monitoring/grafana-datasources.yaml).
#   - Worker δ: installs the KEDA operator (CRDs + controller) via Helm in
#     `make local-e2e`. ArgoCD sync of this manifest will fail-loop until
#     the CRDs are present.
#
# Scaling intent: 1 active match per game-server replica. Scale to zero when
# no matches are active (minReplicaCount: 0); cap at 5 replicas while Phase
# 1.5 capacity planning is in flight.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: astera-game-scaler
  namespace: astera
spec:
  scaleTargetRef:
    name: astera-game
  pollingInterval: 10
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: 5
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
        metricName: astera_match_active
        threshold: "1"
        query: max(astera_match_active)
