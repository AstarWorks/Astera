# Astera local Velocity (ADR-0179). Players authenticate with Mojang here
# (online-mode) and the proxy forwards their real UUID / skin to the backends
# with modern forwarding. The secret is read from VELOCITY_FORWARDING_SECRET.
config-version = "2.7"
bind = "0.0.0.0:25565"
motd = "<#09add3>Astera"
show-max-players = 100
online-mode = true
force-key-authentication = true
prevent-client-proxy-connections = false
player-info-forwarding-mode = "modern"
forwarding-secret-file = "forwarding.secret"
announce-forge = false
kick-existing-players = false
ping-passthrough = "DISABLED"

[servers]
lobby = "lobby:25565"
game = "game:25565"
# Velocity sends a player kicked from a backend to the next server in `try`. With game listed, a lobby kick (admin
# kick, anti-cheat, plugin error) dropped the player into the game server. Only the lobby is a login/fallback
# target: a kick from the lobby disconnects the player, and a kick from game returns them to the lobby.
# While the lobby is down (redeploy) logins are refused rather than routed to a game server that hosts matches only.
try = ["lobby"]

[forced-hosts]
