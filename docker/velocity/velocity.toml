# Astera local Velocity (ADR-0179). Players authenticate with Mojang here
# (online-mode) and the proxy forwards their real UUID / skin to the backends
# with modern forwarding. The secret is read from VELOCITY_FORWARDING_SECRET.
config-version = "2.7"
bind = "0.0.0.0:25565"
motd = "<#09add3>Astera"
show-max-players = 100
online-mode = true
force-key-authentication = true
prevent-client-proxy-connections = false
player-info-forwarding-mode = "modern"
forwarding-secret-file = "forwarding.secret"
announce-forge = false
kick-existing-players = false
ping-passthrough = "DISABLED"

[servers]
lobby = "lobby:25565"
game = "game:25565"
# Fallback order: new logins and players kicked from a backend land on the lobby, or on game while
# the lobby is down (ADR-0186).
try = ["lobby", "game"]

[forced-hosts]
