# Astera local development stack (ADR-0179).
#
#   players --25565--> velocity (online-mode, Mojang auth, modern forwarding)
#                         |-- lobby  (Paper, ASTERA_SERVER_ROLE=lobby: queue, shop, vault)
#                         `-- game   (Paper, ASTERA_SERVER_ROLE=game:  matches only)
#   lobby + game --> postgres (persisted state) + redis (assignments / pub-sub)
#
# Usage (from repo root):  make docker-up
#   (= create docker/.env + a forwarding secret if absent; docker compose up -d --build)
#
# Only `velocity` publishes the Minecraft port. The backends run with
# ONLINE_MODE=FALSE and accept only connections signed with the forwarding
# secret (Paper `proxies.velocity`, applied by docker/paper-patches), so nobody
# can join a backend directly or pose as another player.
#
# The Paper image is built from docker/Dockerfile using the repo root as the
# build context: the multi-stage build compiles the 7 plugin jars AND bakes
# `content/` into the image at /content (outside the /data volume). The Docker
# daemon is shared with the host, so a bind mount of ../content would be empty
# in the container. Content/code changes therefore need `make docker-up`
# (rebuilds the image); `make dev-plugins` / `make dev-content` push just the changed
# jars / content into the running backends instead. See docs/contributing/playtest.md.
#
# Host ports are overridable (ASTERA_PORT, POSTGRES_PORT, REDIS_PORT) and there
# are no pinned container names, so a second stack can run with
# `docker compose -p <other-name>`.

name: astera-dev

x-astera-backend: &astera-backend
  build:
    context: ..
    dockerfile: docker/Dockerfile
    args:
      # PAPER (default) or FOLIA (Folia migration; jar pinned in gradle/libs.versions.toml `folia`).
      # The Dockerfile wrapper entrypoint overrides TYPE below when the image is FOLIA.
      SERVER_TYPE: "${SERVER_TYPE:-PAPER}"
  image: astera/minecraft-server:dev
  restart: unless-stopped
  stdin_open: true
  tty: true
  environment: &astera-backend-env
    # The user must accept the Minecraft EULA to run a server.
    # https://www.minecraft.net/en-us/eula
    EULA: "TRUE"
    TYPE: "PAPER"
    VERSION: "26.3"
    USE_AIKAR_FLAGS: "true"
    MAX_PLAYERS: "20"
    # Authentication happens on Velocity; the backend only trusts the proxy.
    ONLINE_MODE: "FALSE"
    PATCH_DEFINITIONS: "/patches"
    # Always re-sync /plugins -> /data/plugins on start (default would skip a "newer" destination).
    # `make dev-plugins` updates both copies; a rebuilt image (make docker-up) must win (ADR-0186).
    SYNC_SKIP_NEWER_IN_DESTINATION: "false"
    CFG_VELOCITY_SECRET: "${VELOCITY_FORWARDING_SECRET:?VELOCITY_FORWARDING_SECRET is empty: run `make docker-up` (it generates one in docker/.env)}"
    # Main world: superflat (surface block y=-61, stand at y=-60). Matches are not played here: the
    # stages in content/stages/ are sky islands Astera builds into the void `arenas` world (ADR-0246).
    # Only applies when the world is first created (see playtest.md "reset").
    LEVEL_TYPE: "minecraft:flat"
    # 26.3 rejects empty flat settings ("No key layers in MapLike[{}]"), so spell the vanilla
    # default out: bedrock y=-64, dirt -63..-62, grass -61 (stand at y=-60). Lobby backend: the
    # main world is idle, the lobby lives in the generated `lobby` world (ADR-0180).
    GENERATOR_SETTINGS: '{"biome":"minecraft:plains","features":false,"lakes":false,"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"structure_overrides":[]}'
    MODE: "survival"
    DIFFICULTY: "normal"
    PVP: "true"
    SPAWN_PROTECTION: "0"
    ALLOW_FLIGHT: "true"
    OPS: "${OPS:-}"
    ENABLE_RCON: "true"
    RCON_PORT: "25575"
    RCON_PASSWORD: "${RCON_PASSWORD:-astera}"
    # Postgres datasource read by Astera-Persistence (PersistenceModule).
    ASTERA_PG_URL: "jdbc:postgresql://postgres:5432/astera"
    ASTERA_PG_USER: "astera"
    ASTERA_PG_PASSWORD: "${POSTGRES_PASSWORD:-astera}"
    # Redis: cross-server assignments (RedisProxyMessenger) + event broadcast.
    ASTERA_REDIS_URI: "redis://redis:6379"
    # Names in the Velocity [servers] table (docker/velocity/velocity.toml).
    ASTERA_LOBBY_SERVER: "lobby"
    ASTERA_GAME_SERVER: "game"
    # Metrics surface (scraped inside the network; not published to the host).
    ASTERA_METRICS_ENABLED: "true"
    ASTERA_METRICS_PORT: "9092"
    # Resource pack (ADR-0182): clients download from the host address; the
    # server reads the hash inside the network. Off this machine, set
    # ASTERA_RESOURCE_PACK_URL in docker/.env to the host's LAN/public address.
    ASTERA_RESOURCE_PACK_URL: "${ASTERA_RESOURCE_PACK_URL:-http://localhost:8099/astera.zip}"
    ASTERA_RESOURCE_PACK_SHA1_URL: "http://resource-pack/astera.zip.sha1"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    resource-pack:
      condition: service_started

services:
  velocity:
    build:
      context: ./velocity
    image: astera/velocity:dev
    restart: unless-stopped
    ports:
      - "${ASTERA_PORT:-25565}:25565"   # Minecraft Java client: the ONLY published game port
    environment:
      TYPE: "VELOCITY"
      MEMORY: "512M"
      # Debug switch, e.g. VELOCITY_JVM_OPTS=-Dvelocity.packet-decode-logging=true
      JVM_OPTS: "${VELOCITY_JVM_OPTS:-}"
      VELOCITY_FORWARDING_SECRET: "${VELOCITY_FORWARDING_SECRET:?VELOCITY_FORWARDING_SECRET is empty: run `make docker-up` (it generates one in docker/.env)}"
    volumes:
      - velocity-data:/server
    depends_on:
      - lobby
      - game

  lobby:
    <<: *astera-backend
    environment:
      <<: *astera-backend-env
      MEMORY: "3G"
      MOTD: "Astera lobby"
      ASTERA_SERVER_ROLE: "lobby"
      ASTERA_SERVER_NAME: "lobby"
    volumes:
      - lobby-data:/data
      # /content comes from the image (baked in, see Dockerfile).

  game:
    <<: *astera-backend
    environment:
      <<: *astera-backend-env
      MEMORY: "3G"
      MOTD: "Astera game"
      ASTERA_SERVER_ROLE: "game"
      ASTERA_SERVER_NAME: "game"
    volumes:
      - game-data:/data

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "astera"
      POSTGRES_DB: "astera"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-astera}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astera -d astera"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # AI bots (ADR-0247): listens on Redis `astera:bots:request` and spawns protocol bots that queue and play like
  # players ("play vs bots" in the lobby, `make bots N=2 LANE=skirmish`). The bots log in to the backends directly and
  # answer Paper's Velocity modern-forwarding query with the shared secret (online-mode Velocity would refuse them).
  # A plain service: `make dev-plugins` / `make dev-content` never touch it; rebuild with
  #   docker compose -f docker/docker-compose.yml up -d --build bot-runner
  bot-runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bot-runner
    image: astera/bot-runner:dev
    restart: unless-stopped
    environment:
      ASTERA_REDIS_URI: "redis://redis:6379"
      VELOCITY_FORWARDING_SECRET: "${VELOCITY_FORWARDING_SECRET:?VELOCITY_FORWARDING_SECRET is empty: run `make docker-up` (it generates one in docker/.env)}"
      BOT_LOBBY_HOST: "lobby"
      BOT_GAME_HOST: "game"
      BOT_MAX: "${BOT_MAX:-8}"
      BOT_QUEUE_TIMEOUT_MINUTES: "${BOT_QUEUE_TIMEOUT_MINUTES:-10}"
    depends_on:
      redis:
        condition: service_healthy
      lobby:
        condition: service_started
      game:
        condition: service_started

  # Resource pack server (ADR-0182): http://<host>:8099/astera.zip
  resource-pack:
    build:
      context: ..
      dockerfile: docker/Dockerfile.resource-pack
    image: astera/resource-pack:dev
    restart: unless-stopped
    ports:
      - "${RESOURCE_PACK_PORT:-8099}:80"       # http://localhost:8099/astera.zip

volumes:
  velocity-data:
  lobby-data:
  game-data:
  postgres-data:
  redis-data:
