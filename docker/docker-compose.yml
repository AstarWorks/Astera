# Astera local development stack.
#
# Usage (from repo root):  make docker-up
#   (= cp docker/.env.example docker/.env; docker compose up -d --build)
#
# The Paper server image is built from docker/Dockerfile using the repo root as
# the build context: the multi-stage build compiles the 7 plugin jars AND bakes
# `content/` into the image (/config/content -> /data/content). The Docker
# daemon is shared with the host, so a bind mount of ../content would be empty
# in the container. Content/code changes therefore need `make docker-up`
# (rebuilds the image). See docs/contributing/playtest.md.

name: astera-dev

services:
  paper:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: astera/minecraft-server:dev
    container_name: astera-paper
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "25565:25565"   # Minecraft Java client
      - "25575:25575"   # RCON
      - "9092:9092"     # Astera metrics (Prometheus scrape target)
    environment:
      # The user must accept the Minecraft EULA to run a server.
      # https://www.minecraft.net/en-us/eula
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.1.2"
      MEMORY: "4G"
      USE_AIKAR_FLAGS: "true"
      MAX_PLAYERS: "20"
      ONLINE_MODE: "FALSE"
      MOTD: "Astera dev"
      # Playtest world: superflat (surface block y=-61, stand at y=-60), so
      # content/stages/example-arena.yaml coordinates sit on ground. Only
      # applies when the world is first created (see playtest.md "reset").
      LEVEL_TYPE: "FLAT"
      MODE: "survival"
      DIFFICULTY: "normal"
      PVP: "true"
      SPAWN_PROTECTION: "0"
      ALLOW_FLIGHT: "true"
      OPS: "${OPS:-}"
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD:-astera}"
      # Datasource hints for the plugin (read by application config later).
      ASTERA_DB_HOST: "postgres"
      ASTERA_DB_PORT: "5432"
      ASTERA_DB_NAME: "astera"
      ASTERA_DB_USER: "astera"
      ASTERA_DB_PASSWORD: "${POSTGRES_PASSWORD:-astera}"
      ASTERA_REDIS_HOST: "redis"
      ASTERA_REDIS_PORT: "6379"
      # Metrics surface — Prometheus scrape target on the host at :9092/metrics.
      ASTERA_METRICS_ENABLED: "true"
      ASTERA_METRICS_PORT: "9092"
    volumes:
      - paper-data:/data
      # /data/content comes from the image (baked in, see Dockerfile).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: astera-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "astera"
      POSTGRES_DB: "astera"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-astera}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astera -d astera"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: astera-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  paper-data:
  postgres-data:
  redis-data:
