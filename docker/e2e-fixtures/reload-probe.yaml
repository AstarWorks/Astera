# e2e-only probe skill (baked by docker/e2e-tune-content.sh, decoded by game-sim ReloadProbeFixtureScenarioTest).
apiVersion: astera/v3
kind: Skill
id: reload-probe
item: diamond-axe
meta:
  name: {ja: 再読込プローブ, en: Reload Probe}
  description: {ja: "e2e 用。skill reload が次の cast だけを変えることの確認。", en: "e2e probe. Proves skill reload changes only the next cast."}
  cooldown_ticks: 0
  resource_cost: 0
  tags: [probe]
params:
  dmg: {type: number, default: 10}
anchors:
  - {id: feet, anchor: caster.feet, mode: follow}
machine:
  start: hold
  states:
    hold:
      for: 40
      then: done
      do:
        - {id: pin, op: lock, at: 0, for: 40, pitch: true}
        - {id: glow, op: particle, particle: dust, anchor: feet, count: 1, color: "#ffffff", size: 1.0, at: 0}
        - {id: hit, op: damage, at: 0, target: {kind: enemies, around: caster, radius: 8, max_count: 8, include_self: false}, damage: {physical: "${dmg}"}}
    done: {final: true}
