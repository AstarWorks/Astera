# Overlay on docker/docker-compose.yml for an NVIDIA host with NVIDIA Container Toolkit.
services:
  translator:
    build:
      args:
        LLAMA_IMAGE: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:4ccae195bf542f7844301ae06891baa32a7551cb16de8428af6e929403d4292c
    image: astera/translator:adr0308-cuda
    environment:
      TRANSLATOR_GPU_LAYERS: "99"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
