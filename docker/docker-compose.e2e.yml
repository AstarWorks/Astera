# Astera E2E test backend (QA-1, ADR-0222). Used by `make e2e` / :tools:e2e.
#
# One standalone Paper server that runs lobby AND matches (ASTERA_SERVER_ROLE=all)
# with ONLINE_MODE=FALSE and no Velocity, so protocol bots (MCProtocolLib) can join
# under any offline name. It is NOT part of the dev stack: separate compose project
# (`astera-e2e`), own volume, ports bound to 127.0.0.1 only, behind the `e2e` profile.
#
#   ASTERA_E2E_ID=<id> docker compose -p astera-e2e-<id> -f docker/docker-compose.e2e.yml --profile e2e up -d --build e2e e2e-resource-pack
#
# QA-3: every run is isolated per checkout. `scripts/e2e.sh` derives ASTERA_E2E_ID (default: first 8
# hex chars of sha256 of the checkout path, overridable with E2E_ID=...) and that id is used for the
# compose project (`astera-e2e-<id>`), image tags (`:e2e-<id>`), the `astera.e2e.id` image label,
# the runner container name and the volume. Host ports are ephemeral (`127.0.0.1::<port>`), so two
# checkouts never fight over 25570/8098; the runner reaches the backend over the compose network.
# Find the host port of a running backend with: `docker compose -p astera-e2e-<id> ... port e2e 25565`.
#
# No Postgres: the in-memory repositories apply when ASTERA_PG_URL / ASTERA_REDIS_URI are unset (role `all`
# needs no cross-server transfer). A throw-away Redis (`e2e-redis`) exists only for the "Play vs bots" request
# and status channels (ADR-0248, ASTERA_BOTS_REDIS_URI); the suite publishes/reads them over a raw socket.
# The image is built from the same Dockerfile as the dev stack but tagged
# `astera/minecraft-server:e2e` so it never replaces the dev image.

name: astera-e2e-${ASTERA_E2E_ID:-local}

services:
  e2e:
    profiles: ["e2e"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        E2E_FAST: "1"
        # PAPER (default) or FOLIA; see docker/Dockerfile.
        SERVER_TYPE: "${SERVER_TYPE:-PAPER}"
      labels:
        astera.e2e.id: "${ASTERA_E2E_ID:-local}"
    image: astera/minecraft-server:e2e-${ASTERA_E2E_ID:-local}
    stdin_open: true
    tty: true
    ports:
      - "127.0.0.1::25565"
      - "127.0.0.1::25575"
    environment:
      EULA: "TRUE"
      MC_IMAGE_HELPER_OPTS: "-Dio.netty.handler.ssl.noOpenSsl=true"
      TYPE: "PAPER"
      VERSION: "26.3"
      MEMORY: "2G"
      USE_AIKAR_FLAGS: "true"
      MAX_PLAYERS: "20"
      ONLINE_MODE: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"
      LEVEL_TYPE: "astera:void"
      GENERATOR_SETTINGS: '{"biome":"minecraft:plains","features":false,"lakes":false,"layers":[{"block":"minecraft:air","height":1}],"structure_overrides":[]}'
      MODE: "survival"
      DIFFICULTY: "normal"
      PVP: "true"
      SPAWN_PROTECTION: "0"
      ALLOW_FLIGHT: "true"
      MOTD: "Astera e2e"
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD:-astera-e2e}"
      # Production path (QA-7): bots join through `e2e-velocity` (modern forwarding). scripts/e2e.sh
      # sets E2E_PATCHES=/patches (docker/paper-patches/velocity.json: trust the proxy secret) unless
      # E2E_VIA=direct, where the backend stays plain offline-mode for diagnostics / vfx-shot.
      PATCH_DEFINITIONS: "${E2E_PATCHES:-}"
      CFG_VELOCITY_SECRET: "${E2E_FORWARDING_SECRET:-astera-e2e-forwarding-secret}"
      ASTERA_SERVER_ROLE: "all"
      ASTERA_SERVER_NAME: "e2e"
      # ADR-0283: bots join as en_us and the suite asserts English; prod/dev default to ja.
      ASTERA_DEFAULT_LOCALE: "en"
      # ADR-0248: "Play vs bots" publishes on astera:bots:request here and listens on astera:bots:status.
      ASTERA_BOTS_REDIS_URI: "redis://e2e-redis:6379"
      ASTERA_METRICS_ENABLED: "false"
      # Quiet by default elsewhere: weapon input / cast / energy-bar trace lines ("[weapons-debug]").
      ASTERA_DEBUG_WEAPONS: "1"
      # Pack URL as a client would see it; the sha1 is read inside the network.
      # Bots never download the pack (they only record the push packet), so the URL is an in-network name.
      ASTERA_RESOURCE_PACK_URL: "http://e2e-resource-pack/astera.zip"
      ASTERA_RESOURCE_PACK_SHA1_URL: "http://e2e-resource-pack/astera.zip.sha1"
    volumes:
      - e2e-data:/data
    depends_on:
      e2e-resource-pack:
        condition: service_started
      e2e-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "mc-health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  # ADR-0248: Redis for the bot request / status channels only.
  e2e-redis:
    profiles: ["e2e"]
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # QA-7: the production front door. Velocity (offline-mode, modern forwarding) in front of the
  # backend, with -Dvelocity.packet-decode-logging=true so every clientbound packet Velocity cannot
  # re-decode is logged with its id. Bots connect here by default (E2E_VIA=direct skips it).
  e2e-velocity:
    profiles: ["e2e"]
    build:
      context: ./velocity
      dockerfile: Dockerfile.e2e
      labels:
        astera.e2e.id: "${ASTERA_E2E_ID:-local}"
    image: astera/velocity:e2e-${ASTERA_E2E_ID:-local}
    ports:
      - "127.0.0.1::25565"
    environment:
      TYPE: "VELOCITY"
      MC_IMAGE_HELPER_OPTS: "-Dio.netty.handler.ssl.noOpenSsl=true"
      MEMORY: "512M"
      JVM_OPTS: "-Dvelocity.packet-decode-logging=true"
      VELOCITY_FORWARDING_SECRET: "${E2E_FORWARDING_SECRET:-astera-e2e-forwarding-secret}"
    volumes:
      - e2e-velocity-data:/server
    depends_on:
      e2e:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "mc-monitor status --host localhost --port 25565 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  e2e-resource-pack:
    profiles: ["e2e"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.resource-pack
      labels:
        astera.e2e.id: "${ASTERA_E2E_ID:-local}"
    image: astera/resource-pack:e2e-${ASTERA_E2E_ID:-local}
    ports:
      - "127.0.0.1::80"

  # The bot suite, run inside the compose network (see docker/Dockerfile.e2e-runner for why).
  # `make e2e` builds it and runs it with `docker compose run`, then copies the report out.
  e2e-runner:
    profiles: ["e2e"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.e2e-runner
      labels:
        astera.e2e.id: "${ASTERA_E2E_ID:-local}"
    image: astera/e2e-runner:e2e-${ASTERA_E2E_ID:-local}
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      E2E_ONLY: "${E2E_ONLY:-}"
      E2E_WEAPONS: "${E2E_WEAPONS:-}"
      E2E_SKIP: "${E2E_SKIP:-}"
      E2E_VIA: "${E2E_VIA:-velocity}"
    command:
      - gradle
      - --no-daemon
      - --offline
      - --console=plain
      - :tools:e2e:e2e
      - -Pe2e.host=e2e
      - -Pe2e.port=25565
      - -Pe2e.rconPort=25575
      - -Pe2e.rconPassword=${RCON_PASSWORD:-astera-e2e}
      - -Pe2e.serverLog=/e2e-server/logs/latest.log
      - -Pe2e.id=${ASTERA_E2E_ID:-local}
      # QA-7: where bots connect. `velocity` (default) = through e2e-velocity like real players;
      # `direct` = straight to the backend (diagnostics).
      - -Pe2e.via=${E2E_VIA:-velocity}
      - -Pe2e.proxyHost=e2e-velocity
      - -Pe2e.proxyPort=25565
      - -Pe2e.velocityLog=/e2e-velocity/logs/latest.log
      # ADR-0248: the throw-away Redis the suite talks to over a raw socket (bot request / status channels).
      - -Pe2e.redisHost=e2e-redis
      - -Pe2e.redisPort=6379
    volumes:
      # The backend's latest.log, read-only: lets checks assert on server-side log lines (HUD diagnostics).
      - e2e-data:/e2e-server:ro
      # Velocity's latest.log (QA-7): the "no decode errors through the proxy" check reads it.
      - e2e-velocity-data:/e2e-velocity:ro
    depends_on:
      e2e:
        condition: service_healthy

volumes:
  e2e-data:
  e2e-velocity-data:
