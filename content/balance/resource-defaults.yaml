# Per-resource-type defaults — applied when an item doesn't override
# (Wave 5k, ADR-0080, Annihilation vision).
#
# Each weapon's `resource_max_pool` / `resource_regen_per_second` (negative
# sentinel) falls back to the value here. Reload semantics are decided by the
# item itself (`resource_reloadable: true` on Ammo weapons only).
#
# Phase 1 PoC values mirror Hypixel Annihilation pacing:
#   - Ammo: 30 baseline (pistol mag), no passive regen — designers reload.
#   - Stamina: 100 baseline (Dark Souls-style), regen 20/sec → ~5s full refill.
#   - Mana: 100 baseline, regen 5/sec → ~20s full refill.
#
# These values are NOT YET loaded by Core — `ResourceCap.DEFAULTS` carries the
# same numbers as a compiled fall-back. The loader hook lands when Wave 5n
# (per-match balance overlay) introduces the content/balance/ reload pipeline.

ammo:
  max_pool: 30
  regen_per_second: 0.0

stamina:
  max_pool: 100
  regen_per_second: 20.0

mana:
  max_pool: 100
  regen_per_second: 5.0
