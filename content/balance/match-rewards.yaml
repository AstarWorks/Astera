# What a match pays out (F3-4). Applied once per player when a match ends, by
# GrantMatchRewardsOnSummaryListener; re-read at every match end, so
# `make dev-content` takes effect without a restart.
#
# A player earns, for one match:
#
#   participation                      everyone who was in the match
# + win | lose | draw                  by the player's outcome
# + per_kill       x own kills         (enemy-team kills only)
# + per_assist     x own assists
# + per_objective  x own objectives    (a Nexus destroyed by the player)
# + mvp                                only the match MVP
#
# MVP rule (core MvpRule): score = kills*3 + assists*1 + objective*2; the MVP
# is the best scorer of the WINNING team (everybody on a draw); ties go to fewer
# deaths, then more kills. Nobody with a score of 0 is MVP.
#
# Each row has gold / xp (all default 0, all >= 0). GOLD goes to the wallet,
# xp to the level. (Stars are an in-match item, never paid out here: ADR-0257.)
# `default` must list every row; `modes.<game-mode-id>` may override any subset.
# A missing or invalid file falls back to "100 GOLD to winners", nothing else.

default:
  participation: { gold: 10, xp: 25 }
  win:           { gold: 120, xp: 150 }
  lose:          { gold: 35, xp: 60 }
  draw:          { gold: 60, xp: 90 }
  per_kill:      { gold: 5, xp: 20 }
  per_assist:    { gold: 2, xp: 10 }
  per_objective: { gold: 10, xp: 30 }
  mvp:           { gold: 35, xp: 50 }

modes:
  # PvE waves (ADR-0249): the whole party shares the outcome; every mob defeated pays like a
  # kill (a mob is worth less than a player), clearing the encounter pays the win row.
  pve-waves:
    win:           { gold: 70, xp: 120 }
    lose:          { gold: 17, xp: 40 }
    per_kill:      { gold: 3, xp: 12 }
    mvp:           { gold: 12, xp: 25 }
  # Nexus siege: longer matches, destroying a Nexus is the point.
  annihilation:
    win:           { gold: 180, xp: 200 }
    lose:          { gold: 58, xp: 90 }
    per_objective: { gold: 27, xp: 60 }
  # Free-for-all brawl: kills are the objective.
  battle-loyal:
    per_kill:      { gold: 9, xp: 30 }
    per_assist:    { gold: 3, xp: 15 }
