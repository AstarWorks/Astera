idle_ticks: 200
# Astera — Block durability rock-paper-scissors damage matrix (Wave 5d → Wave 5x).
#
# Each cell is "damage per single-hit applied to a 100-HP block":
#   100 = one-hit break
#    25 = four-hit break
#     0 = cannot damage
#
# Outer key of `damage_matrix` is a ToolType.serialKey():
#   - "NONE"             — empty-hand / non-tool
#   - "<KIND>/<TIER>"    — e.g. "PICKAXE/IRON", "AXE/DIAMOND", "SHOVEL/WOOD"
#   - KIND ∈ {PICKAXE, AXE, SHOVEL}, TIER ∈ {WOOD, STONE, IRON, DIAMOND, NETHERITE}
#
# Inner key is a lower-case BlockMaterial (wood / stone / soil / other).
#
# Missing cells fall back to BlockDurabilityRule.DEFAULT_DAMAGE at lookup
# time, so authors only need to list the cells that differ from neutral.
#
# # Wave 5x rock-paper-scissors commitment (ADR-0090)
#
# - PICKAXE excels at STONE, mediocre at WOOD, ineffective at SOIL
# - AXE     excels at WOOD,  mediocre at STONE, ineffective at SOIL
# - SHOVEL  excels at SOIL,  ineffective at WOOD / STONE
# - NONE    chips SOIL / WOOD lightly, useless on STONE

materials:
  "minecraft:oak_log": wood
  "minecraft:oak_planks": wood
  "minecraft:spruce_log": wood
  "minecraft:birch_log": wood
  "minecraft:stone": stone
  "minecraft:cobblestone": stone
  "minecraft:deepslate": stone
  "minecraft:dirt": soil
  "minecraft:grass_block": soil
  "minecraft:sand": soil
  "astera:core_block": stone
  "astera:barrier_block": stone
  "astera:hardened_soil": soil

damage_matrix:
  "NONE":
    wood: 5
    stone: 0
    soil: 10
    other: 5

  "PICKAXE/WOOD":
