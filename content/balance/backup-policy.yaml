# Astera — server-wide restic backup policy (Wave 5w / ADR-0089)
#
# Parsed by `BackupPolicyYaml` (`plugin/core/.../application/config/backup/`).
# Reloadable via `/astera reload backup` once Wave 6b lands the
# `ResticBackupGateway` adapter; Phase 1 PoC uses
# `InMemoryServerBackupGateway` (priority 0) so the values here are
# advisory until the restic adapter ships.
#
# Phase 1 PoC default per `.claude/plans/idea-anti-grief-policy.md` §(b):
#   24 hourly hot snapshots + 7 daily + 4 weekly.
#
# Boundaries:
#   - Server-scoped (whole Postgres cluster + match world archive). Per-player
#     export is Wave 5t's `IPlayerDataExportGateway`.
#   - Restic encryption uses a server-side key; admin individual keys are a
#     Phase 4 concern (ADR-0089 §β Phase 4 carve-out).

retention:
  hourly: 24
  daily: 7
  weekly: 4

schedule:
  # Hourly Postgres incremental: every N minutes (60 = once an hour).
  postgres_incremental_interval_minutes: 60
  # Daily full backup fires at this UTC hour (0-23).
  daily_full_backup_hour_utc: 4

restic:
  # Path to the restic binary. `restic` (resolved via $PATH) is the default;
  # k8s deployments override with the absolute path baked into the image.
  binary_path: restic
  # Repository URI. Empty string disables the production adapter — the
  # in-memory gateway stays active. Production sets this to e.g.
  # `s3:s3.eu-central-1.amazonaws.com/astera-backups`.
  repository_uri: ""
