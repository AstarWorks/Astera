# First-time login starter grant (Wave 5e-fix).
#
# Applied by `InMemoryPlayerProfileService.createFirstTime` when a brand-new
# player joins the server for the first time. Returning players go through
# `RestoreInventoryOnPlayerJoinedListener` instead (Wave 5e).
#
# Fail-soft semantics — see `StarterGrantLoader`:
#   - missing file       → empty grant (no items, no wallet, no tutorial).
#   - YAML parse error   → empty grant + WARN log.
#   - validation error   → empty grant + WARN log with detail.
#   - registry miss on `starter_items` item id → that one item skipped +
#     surfaced in `ProfileError.PartialGrant.failedSteps`.

# Items every new player starts with. Resolved against `IItemRegistry`; ids
# that aren't registered are skipped (the profile is still created). Order
# matters when the Wave 6b inventory adapter consumes the grant — slot 0
# wins the player's hand.
#
# MODE-01: a gun (ranged) plus a sword (melee), so a new player meets two of the three archetypes in the
# first match. This agrees with the norma `weapon_limits` (gun:1,sword:1,staff:1,total:2): the kit fills
# the two-weapon cap exactly, nothing is set aside on match entry. A staff is bought in the shop.
starter_items:
  - pistol
  - knight-sword

# Per-currency initial balance. Currency keys must match `Currency` enum
# constants (GOLD / GEM); values are 64-bit non-negative integers.
# Zero entries are dropped at apply-time so the audit log stays readable.
# GOLD is the everyday currency, earned (matches / quests / advancements / login bonus);
# GEM is premium. Stars are an in-match item and are never granted here (ADR-0262).
wallet_grants:
  GOLD: 0
  GEM: 0

# Tutorial auto-enrollment. When `auto_enroll: true`, the new profile is
# recorded as enrolled in `tutorial.script_id`. The script must be registered
# in `content/tutorials/`; otherwise the enrollment is skipped + folded into
# `failedSteps` (the join still completes).
tutorial:
  auto_enroll: true
  script_id: getting-started

# Welcome dialog shown on first join. Resolution is deferred to a later wave
# when `IDialogGateway` lands in core; today the id is captured + queryable
# via `InMemoryPlayerProfileService.findWelcomeDialog(playerId)` so adapters
# can stage the show when the gateway becomes available.
welcome_dialog_id: astera-welcome
