    min_norma_level: 2
    drops: [{ item_id: ore-gold, count: 2 }]
  - block: astera:ore_heartwood_node
    positions: [{ x: -12, y: 65, z: -4 }, { x: -12, y: 65, z: 4 }, { x: -8, y: 65, z: -12 }, { x: -8, y: 65, z: 12 }, { x: 8, y: 65, z: -12 }, { x: 8, y: 65, z: 12 }, { x: 12, y: 65, z: -4 }, { x: 12, y: 65, z: 4 }]
