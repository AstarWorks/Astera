# Mid ore nodes of siege-isles-tnt: stage-relative x/z, absolute y. Annihilation-style dense mine: emerald at the very centre, then diamond,
# gold-tier (gold / goldheart wood / gold silt), and iron-tier (iron / ironwood / iron clay) on the rim. The pickaxe breaks the stone ores,
# the axe the wood ones, the shovel the clay / silt ones; the wrong tool barely scratches (see content/blocks/ore-*-node.yaml).
# level_speed: break-speed multiplier by Norma level (highest key <= level; level 1 required). skill_mult: a tool skill's damage multiplier
# (same as the Annihilation pillar tool-skill match mult). min_norma_level: below it the node takes no damage (deny sound + action bar).
# Sizing: 92 nodes; hand mining ~3.3 hits/s, tool-skill chips scale with the skill block damage.
id: siege-isles-tnt
level_speed: { 1: 1.0, 2: 1.15, 3: 1.3, 4: 1.5, 5: 1.75 }
skill_mult: 3.0
nodes:
  - block: astera:ore_emerald_node
    positions: [{ x: -4, y: 65, z: -4 }, { x: -4, y: 65, z: 0 }, { x: -4, y: 65, z: 4 }, { x: 0, y: 65, z: -4 }, { x: 0, y: 65, z: 4 }, { x: 4, y: 65, z: -4 }, { x: 4, y: 65, z: 0 }, { x: 4, y: 65, z: 4 }]
    regrow_seconds: 90
    required_tier: DIAMOND
    min_norma_level: 4
    drops: [{ item_id: ore-emerald, count: 1 }]
  - block: astera:ore_diamond_node
    positions: [{ x: -8, y: 65, z: -4 }, { x: -8, y: 65, z: 0 }, { x: -8, y: 65, z: 4 }, { x: -4, y: 65, z: -8 }, { x: -4, y: 65, z: 8 }, { x: 0, y: 65, z: -8 }, { x: 0, y: 65, z: 8 }, { x: 4, y: 65, z: -8 }, { x: 4, y: 65, z: 8 }, { x: 8, y: 65, z: -4 }, { x: 8, y: 65, z: 0 }, { x: 8, y: 65, z: 4 }]
    regrow_seconds: 90
    required_tier: IRON
    min_norma_level: 3
    drops: [{ item_id: ore-diamond, count: 1 }]
  - block: astera:ore_gold_node
    positions: [{ x: -8, y: 65, z: -8 }, { x: -8, y: 65, z: 8 }, { x: 0, y: 65, z: -12 }, { x: 0, y: 65, z: 12 }, { x: 8, y: 65, z: -8 }, { x: 8, y: 65, z: 8 }]
    regrow_seconds: 45
