    positions: [{ x: 6, y: 51, z: -17 }, { x: 12, y: 51, z: 14 }, { x: -18, y: 51, z: 3 }, { x: 7, y: 51, z: -17 }, { x: 11, y: 51, z: 15 }, { x: -18, y: 51, z: 2 }, { x: 8, y: 51, z: -16 }, { x: 10, y: 51, z: 15 }, { x: -18, y: 51, z: 1 }]
