# Highmarch ore pockets: stage-relative x/z, absolute y; 75 nodes on quarry terrace faces and town forge banks.
# Emerald/diamond occupy deep ledges (y51); gold/heartwood/silt the middle ledges (y56); starter ores the upper ledges (y61) and town forges (y65).
# Large visible mineral seams surround the open pockets. The pickaxe breaks stone ores,
# the axe the wood ones, the shovel the clay / silt ones; the wrong tool barely scratches (see content/blocks/ore-*-node.yaml).
# level_speed: break-speed multiplier by Norma level (highest key <= level; level 1 required). skill_mult: a tool skill's damage multiplier
# (same as the Annihilation pillar tool-skill match mult). min_norma_level: below it the node takes no damage (deny sound + action bar).
# Sizing: 75 nodes; hand mining ~3.3 hits/s, tool-skill chips scale with the skill block damage.
id: annihilation-arena
level_speed: { 1: 1.0, 2: 1.15, 3: 1.3, 4: 1.5, 5: 1.75 }
skill_mult: 3.0
# ADR-0319: the Mid opens with the match phases (1 build, 2 engage, 3 center). Base ores (iron / timber / clay) are open from the start, the Mid outer ring
# (gold, diamond) from phase 2, the Mid core (emerald) from phase 3. Every block of this file must be listed.
phase_gates:
  "astera:ore_iron_node": 1
  "astera:ore_timber_node": 1
  "astera:ore_clay_node": 1
  "astera:ore_gold_node": 2
  "astera:ore_heartwood_node": 2
  "astera:ore_silt_node": 2
  "astera:ore_diamond_node": 2
  "astera:ore_emerald_node": 3
