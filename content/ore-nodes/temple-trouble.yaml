# Mid ore nodes of temple-trouble (central plaza, grass layer y=58, so nodes stand at y=59): mined with a pickaxe of the required tier, regrow.
# Stage x/z equal the map's own x/z. Kept clear of the wool-c / wool-d capture pads (x -2..3) and the raised walkway at z=0.
id: temple-trouble
nodes:
  - block: astera:ore_iron_node
    positions: [{ x: -8, y: 59, z: -4 }, { x: 8, y: 59, z: -4 }, { x: -8, y: 59, z: 4 }, { x: 8, y: 59, z: 4 }]
    regrow_seconds: 20
    required_tier: STONE
    drops: [{ item_id: ore-iron, count: 2 }]
  - block: astera:ore_gold_node
    positions: [{ x: 6, y: 59, z: -4 }, { x: -6, y: 59, z: 4 }]
    regrow_seconds: 45
    required_tier: IRON
    drops: [{ item_id: ore-gold, count: 2 }]
  - block: astera:ore_diamond_node
    positions: [{ x: -4, y: 59, z: 8 }, { x: 4, y: 59, z: 8 }]
    regrow_seconds: 90
    required_tier: IRON
    drops: [{ item_id: ore-diamond, count: 1 }]
  - block: astera:ore_emerald_node
    positions: [{ x: -4, y: 59, z: -8 }, { x: 4, y: 59, z: -8 }]
    regrow_seconds: 90
    required_tier: DIAMOND
    drops: [{ item_id: ore-emerald, count: 1 }]
