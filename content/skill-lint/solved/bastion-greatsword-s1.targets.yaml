# SOLVED targets for bastion-greatsword-s1: numbers measured from the solved pose (tools/pose-solve/solve.py), tolerances from the annotation confidence.
# Same format as bastion-greatsword-s1.targets.yaml (docs/contributing/vfx-team/skill-lint.md). Copy over it once the solved keys replace the shipped ones.
skill: bastion-greatsword-s1
caster_height: 1.8
capture_offset_ticks: 6
bones: {hips: hips, torso: body, hand: right_hand}
grip_tolerance: 0.3
budget: {displays: 60, particles: 300}
beats:
- id: B0-coil
  ticks: [0, 5]
  confidence: high
  note: Dead-still low coil from tick 0. Blade lies behind on the floor, flat up. No step.
  blade:
    tip_side_deg: [-161, 15]
    tip_y: [-0.13, 0.2]
    face_normal: [-0.01, 0.95, -0.32]
    face_tol: 30
  body:
    hips_h: [0.32, 0.06]
    lean_deg: [7, 10]
    twist_deg: [10, 20]
  fx: none
  sound:
    window: [0, 5]
- id: B1-snap-follow-through
  ticks: [7, 15]
  confidence: low
  note: Snap (no drawn swing) to a follow-through held 9 ticks. Blade behind the neck at head height. Ring and streak carry the swing; contact
    tick 7. Twist is low confidence (seen from behind).
  blade:
    tip_side_deg: [172, 35]
    tip_y: [1.76, 0.5]
  body:
    hips_h: [0.31, 0.14]
    lean_deg: [4, 22]
    twist_deg: [11, 45]
  sound:
    window: [5, 8]
- id: B2-overshoot
  ticks: [16, 18]
  confidence: low
  blade:
    tip_side_deg: [149, 35]
    tip_y: [2.03, 0.5]
  body:
    hips_h: [0.33, 0.14]
    lean_deg: [7, 22]
    twist_deg: [1, 45]
- id: B3-turned-away-rest
  ticks: [20, 27]
  confidence: medium
  note: Caster spun 150-180 deg, faces away from the target. Tip rests on the floor in front of her (= away from the target), flat up.
  blade:
    tip_side_deg: [-155, 22]
    tip_y: [-0.16, 0.3]
    face_normal: [-0.0, 0.91, -0.42]
    face_tol: 40
  body:
    hips_h: [0.38, 0.09]
    lean_deg: [-4, 15]
    twist_deg: [165, 30]
  fx: none
- id: B4-coil-2
  ticks: [28, 29]
  confidence: low
  note: Deepest crouch, torso pitched about 30 deg. Blade behind at hip height, thin dark line from the side; the text says the flat is vertical
    with the edge leading, which is encoded here (face normal horizontal, across the body).
  blade:
    tip_side_deg: [-148, 35]
    tip_y: [0.47, 0.5]
    face_normal: [-0.28, 0.96, 0.01]
    face_tol: 55
  body:
    hips_h: [0.39, 0.14]
    lean_deg: [27, 22]
    twist_deg: [3, 45]
  fx: none
- id: B5-flash-contact-2
  ticks: [30, 31]
  confidence: high
  note: Body and blade hidden by the flash / close-up (camera trick); only the sound is checked. Contact is t31.
  sound:
    window: [30, 31]
- id: B6-extended
  ticks: [32, 37]
  confidence: medium
  note: Arms reach toward the target at chest height; blade is light, roll unreadable. Held 6 ticks.
  blade:
    tip_side_deg: [3, 22]
    tip_y: [1.2, 0.3]
  body:
    hips_h: [0.38, 0.09]
    lean_deg: [8, 15]
    twist_deg: [34, 30]
- id: B7-drop
  ticks: [38, 39]
  confidence: low
  blade:
    tip_side_deg: [-173, 35]
    tip_y: [0.6, 0.5]
  body:
    hips_h: [0.38, 0.14]
    lean_deg: [24, 22]
    twist_deg: [4, 45]
- id: B8-rest
  ticks: [40, 51]
  confidence: high
  note: Same silhouette as B0, held to the end of the segment; the reference never lifts the blade inside it.
  blade:
    tip_side_deg: [-165, 15]
    tip_y: [0.12, 0.2]
    face_normal: [0.01, 0.96, -0.27]
    face_tol: 30
  body:
    hips_h: [0.36, 0.06]
    lean_deg: [13, 10]
    twist_deg: [1, 20]
  fx: none
regen:
  script: tools/item-art/scripts/bastion_s1_regen.sh
  inputs:
    files: [content/vfx/bastion-s1-rig.yaml, tools/item-art/scripts/bastion_s1_fx.py, tools/item-art/scripts/bastion_s1_particles.py, tools/item-art/scripts/bastion_s1_sprites.py,
      tools/item-art/scripts/rig_path.py]
    skill_step_types: [play_vfx, dash_strike]
  outputs: [content/vfx/bastion-s1-fx-high.yaml, content/vfx/bastion-s1-fx-low.yaml, content/textures/sources/images/bastion-s1-*.png, content/textures/generated/sprites/bastion-s1-*.png]
