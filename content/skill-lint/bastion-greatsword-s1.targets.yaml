# skill-lint targets for bastion-greatsword-s1 (月輪の薙ぎ). Format: docs/contributing/vfx-team/skill-lint.md.
# Source: motion-ref-s1 beat table (reference video Svaaq9F7Ty8, case start_s 11.633, tick t = 11.633 + 0.05 t s).
# These numbers describe the REFERENCE, never what our content currently does. Do not retune a target to make a check pass:
# change the rig/skill, or lower `confidence` and widen the tolerance here with a written reason in `note`.
# Frame: caster-local (+x right, +y up, +z forward = toward the target), origin at the caster's feet, third-person side view.
# Reference screen mapping: screen-right = +z (toward target), screen-left = -z (behind / away), up = +y.
skill: bastion-greatsword-s1
caster_height: 1.8          # H, blocks
capture_offset_ticks: 6     # capture frame = plan tick + 6 (compare camera); plan tick == reference tick
bones: {hips: hips, torso: body, hand: right_hand}   # names in plan.json "bones"
grip_tolerance: 0.3         # blocks, weapon.pos (grip origin) to the hand bone
budget: {displays: 60, particles: 300}               # director.md "Display budget"

# [target, tolerance]. tip_side_deg = angle of the grip->tip direction in the side (z,y) plane, 0 = toward the target,
# +90 = up, 180 / -180 = straight behind, -162 = behind and 18 deg down. Sign-agnostic for face_normal (both faces equal).
# hips_h = hips bone height / H. lean_deg = torso pitch forward. twist_deg = |torso yaw| from the caster facing.
# fx: none = no particle emission and no new display element may start in these ticks (hold / coil).
# sound: window = [first, last] tick in which a play_sound must fire.
beats:
- id: B0-coil
  ticks: [0, 5]
  confidence: high
  note: Dead-still low coil from tick 0. Blade lies behind on the floor, flat up. No step.
  blade: {tip_side_deg: [-162, 25], tip_y: [0.1, 0.3], face_normal: [0, 1, 0], face_tol: 35}
  body: {hips_h: [0.40, 0.07], lean_deg: [10, 15], twist_deg: [45, 40]}
  fx: none
  sound: {window: [0, 5]}
- id: B1-snap-follow-through
  ticks: [7, 15]
  confidence: medium
  note: Snap (no drawn swing) to a follow-through held 9 ticks. Blade behind the neck at head height. Ring and streak carry the swing; contact tick 7. Twist is low confidence (seen from behind).
  blade: {tip_side_deg: [180, 25], tip_y: [1.5, 0.35]}
  body: {hips_h: [0.40, 0.08], lean_deg: [0, 20], twist_deg: [60, 45]}
  sound: {window: [5, 8]}
- id: B2-overshoot
  ticks: [16, 18]
  confidence: medium
  blade: {tip_side_deg: [155, 20], tip_y: [2.0, 0.5]}
- id: B3-turned-away-rest
  ticks: [20, 27]
  confidence: medium
  note: Caster spun 150-180 deg, faces away from the target. Tip rests on the floor in front of her (= away from the target), flat up.
  blade: {tip_side_deg: [-153, 25], tip_y: [0.1, 0.3], face_normal: [0, 1, 0], face_tol: 35}
  body: {hips_h: [0.50, 0.07], lean_deg: [10, 20], twist_deg: [165, 35]}
  fx: none
- id: B4-coil-2
  ticks: [28, 29]
  confidence: low
  note: Deepest crouch, torso pitched about 30 deg. Blade behind at hip height, thin dark line from the side; the text says the flat is vertical with the edge leading, which is encoded here (face normal horizontal, across the body).
  blade: {tip_side_deg: [180, 25], tip_y: [0.9, 0.3], face_normal: [1, 0, 0], face_tol: 40}
  body: {hips_h: [0.30, 0.08], lean_deg: [30, 15], twist_deg: [0, 40]}
  fx: none
- id: B5-flash-contact-2
  ticks: [30, 31]
  confidence: high
  note: Body and blade hidden by the flash / close-up (camera trick); only the sound is checked. Contact is t31.
  sound: {window: [30, 31]}
- id: B6-extended
  ticks: [32, 37]
  confidence: medium
  note: Arms reach toward the target at chest height; blade is light, roll unreadable. Held 6 ticks.
  blade: {tip_side_deg: [0, 20], tip_y: [1.3, 0.3]}
  body: {hips_h: [0.42, 0.10], lean_deg: [15, 20], twist_deg: [0, 35]}
- id: B7-drop
  ticks: [38, 39]
  confidence: medium
  blade: {tip_side_deg: [-135, 40], tip_y: [0.5, 0.5]}
- id: B8-rest
  ticks: [40, 51]
  confidence: high
  note: Same silhouette as B0, held to the end of the segment; the reference never lifts the blade inside it.
  blade: {tip_side_deg: [-162, 25], tip_y: [0.1, 0.3], face_normal: [0, 1, 0], face_tol: 35}
  body: {hips_h: [0.40, 0.07], lean_deg: [10, 15], twist_deg: [45, 40]}
  fx: none

regen:
  script: tools/item-art/scripts/bastion_s1_regen.sh
  inputs:
    files:
    - content/vfx/bastion-s1-rig.yaml
    - tools/item-art/scripts/bastion_s1_fx.py
    - tools/item-art/scripts/bastion_s1_particles.py
    - tools/item-art/scripts/bastion_s1_sprites.py
    - tools/item-art/scripts/rig_path.py
    skill_step_types: [play_vfx, dash_strike]   # the skill's play_vfx / dash / freeze timing (README of the regen script)
  outputs:
  - content/vfx/bastion-s1-fx-high.yaml
  - content/vfx/bastion-s1-fx-low.yaml
  - content/textures/sources/images/bastion-s1-*.png
  - content/textures/generated/sprites/bastion-s1-*.png
