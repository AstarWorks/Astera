# ADR-0185 — lobby menu kit.
#
# Hotbar items (right-click) and buttons in the 2x2 crafting grid of the player's own
# inventory (click). Shown on lobby-hosting backends (server role lobby/all) except while
# the player is in a match. Items are locked: they cannot be moved, dropped, placed,
# crafted with, or saved into inventory snapshots / the vault.
#
#   area: hotbar | crafting_grid | crafting_result
#   slot: hotbar 0..8 | crafting_grid 0..3 (row-major: 0 1 / 2 3) | crafting_result 0
#   item: an id from content/items/ (icon, name and language come from the item)
#   intent: any GuiIntent key; payload is passed through (gui.open {gui: <id>} opens content/gui/<id>.yaml)
entries:
  - id: hotbar-compass
    area: hotbar
    slot: 0
    item: menu-compass
    intent: gui.open
    payload: { gui: main-menu }
    lore_key: astera.lobby-kit.hint.use
  - id: hotbar-queue
    area: hotbar
    slot: 1
    item: gui-tile-queue
    intent: lobby.queue.show
    lore_key: astera.lobby-kit.hint.use
  - id: hotbar-shop
    area: hotbar
    slot: 2
    item: gui-tile-shop
    intent: lobby.shop.open
    lore_key: astera.lobby-kit.hint.use
  - id: hotbar-customize
    area: hotbar
    slot: 3
    item: gui-tile-customize
    intent: lobby.customize.open
    lore_key: astera.lobby-kit.hint.use
  - id: hotbar-profile
    area: hotbar
    slot: 7
    item: gui-tile-profile
    intent: lobby.profile.show
    lore_key: astera.lobby-kit.hint.use
  - id: hotbar-settings
    area: hotbar
    slot: 8
    item: gui-tile-settings
    intent: lobby.settings.show
    lore_key: astera.lobby-kit.hint.use

  # Inventory crafting grid: 2x2 input + result slot.
  - id: grid-menu
    area: crafting_grid
    slot: 0
    item: menu-compass
    intent: gui.open
    payload: { gui: main-menu }
    lore_key: astera.lobby-kit.hint.click
  - id: grid-profile
    area: crafting_grid
    slot: 1
    item: gui-tile-profile
    intent: lobby.profile.show
    lore_key: astera.lobby-kit.hint.click
  - id: grid-shop
    area: crafting_grid
    slot: 2
    item: gui-tile-shop
    intent: lobby.shop.open
    lore_key: astera.lobby-kit.hint.click
  - id: grid-settings
    area: crafting_grid
    slot: 3
    item: gui-tile-settings
    intent: lobby.settings.show
    lore_key: astera.lobby-kit.hint.click
  - id: result-play
    area: crafting_result
    slot: 0
    item: gui-tile-queue
    intent: lobby.queue.show
    lore_key: astera.lobby-kit.hint.click
