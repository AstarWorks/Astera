# Wave 5game-complete (ADR-0121 §B) — 9-slot loadout selector.
#
# Single CHEST_9 row, slot N → loadout N. Each tile carries four click
# routes per LoadoutSelectorGuiSpec contract:
#
#   left   → loadout.selector.activate   (switch active loadout to slot)
#   right  → loadout.selector.rename     (open rename prompt — Wave 6 GUI)
#   shift  → loadout.selector.reset      (clear slot contents)
#   middle → loadout.selector.save       (save current Items inventory → slot)
#
# The `mode` payload on the save intent lets per-mode loadouts share the
# same selector (Norma / Annihilation / Bet 1v1). Phase 1 PoC defaults to
# `norma`; the items plugin's intent handler picks the live match's mode
# when the player is in queue.
#
# This YAML is reload-aware via the Wave 5h reload dispatcher — edit + run
# `/astera reload gui` to push changes without a server restart.
id: loadout-selector
title_key: astera.gui.loadout-selector.title
size: CHEST_9

slots:
  - type: static
    index: 0
    item: gui-tile-loadout
    on_left:   { key: loadout.selector.activate, payload: { slot: "1" } }
    on_right:  { key: loadout.selector.rename,   payload: { slot: "1" } }
    on_shift:  { key: loadout.selector.reset,    payload: { slot: "1" } }
    on_middle: { key: loadout.selector.save,     payload: { slot: "1", mode: "norma" } }
    tooltip:
      - astera.gui.loadout-selector.slot.tooltip.activate
      - astera.gui.loadout-selector.slot.tooltip.rename
      - astera.gui.loadout-selector.slot.tooltip.reset
      - astera.gui.loadout-selector.slot.tooltip.save

  - type: static
    index: 1
    item: gui-tile-loadout
    on_left:   { key: loadout.selector.activate, payload: { slot: "2" } }
    on_right:  { key: loadout.selector.rename,   payload: { slot: "2" } }
    on_shift:  { key: loadout.selector.reset,    payload: { slot: "2" } }
    on_middle: { key: loadout.selector.save,     payload: { slot: "2", mode: "norma" } }

