# Wave 5h demo GUI. Confirmation prompt for shop purchase. CHEST_9 layout:
# border padding around a centred confirm/prompt/cancel triplet. Demonstrates
# the `confirmation` slot variant from ADR-0079 §2.
id: example-shop-confirm-purchase
title_key: astera.gui.shop.confirm-purchase.title
size: CHEST_9

slots:
  - type: border
    index: 0
    item: gui-pane-dark
  - type: border
    index: 1
    item: gui-pane-dark
  - type: border
    index: 2
    item: gui-pane-dark
  - type: confirmation
    index: 4
    prompt_key: astera.gui.shop.confirm-purchase.prompt
    confirm_item: gui-button-confirm
    cancel_item: gui-button-cancel
    confirm:
      key: shop.purchase.confirm
      payload: { itemId: "iron-sword", qty: "1" }
    cancel:
      key: gui.close
  - type: border
    index: 6
    item: gui-pane-dark
  - type: border
    index: 7
    item: gui-pane-dark
  - type: border
    index: 8
    item: gui-pane-dark
