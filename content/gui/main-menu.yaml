# Lobby main menu — five navigation tiles in a 9-slot single-row chest
# (Wave 5wireup, ADR-0116 §G17).
#
# Tiles are placed at slots 1/2/3/4/6/7. Each `on_left` intent is routed by the application-layer
# IGuiIntentRouter — adding a new intent means extending the router, not
# editing this file.
#
# Item ids are placeholder `gui-tile-*` references. Wave 6 inventory
# adapter (gui-tile texture pack) supplies the actual visuals; for now
# the items render through whatever the InMemoryItemRegistry returns.
#
# Slot 1 is the Play tile (ADR-0248): the first and most prominent entry, a green emerald "Play / プレイ".
# Slot 5 is "Leave queue", shown only while the viewer is waiting in a queue (`visible_if: state:queued`).
#
# Slots 0 and 8 are ops-only (ADR-0240): `visible_if: permission:astera.admin.panel` hides them
# for everyone who is neither op nor holds the node. Both dispatch guarded `admin.*` intents.
id: main-menu
title_key: astera.gui.main-menu.title
size: CHEST_9

slots:
  - type: static
    index: 1
    item: gui-tile-queue
    on_left:
      key: lobby.queue.show
    tooltip:
      - astera.gui.main-menu.queue.tooltip
  - type: static
    index: 2
    item: gui-tile-shop
    on_left:
      key: lobby.shop.open
    tooltip:
      - astera.gui.main-menu.shop.tooltip
  - type: static
    index: 3
    item: gui-tile-training
    on_left:
      key: lobby.training.travel
    tooltip:
      - astera.gui.main-menu.training.tooltip
  - type: static
    index: 4
    item: gui-tile-customize
    on_left:
      key: lobby.customize.open
    tooltip:
      - astera.gui.main-menu.customize.tooltip
  - type: static
    index: 5
    item: gui-tile-leave-queue
    visible_if: "state:queued"
    on_left:
      key: lobby.queue.leave
    tooltip:
      - astera.gui.main-menu.leave-queue.tooltip
  - type: static
    index: 6
    item: gui-tile-travel
    on_left:
      key: lobby.travel.show
    tooltip:
      - astera.gui.main-menu.travel.tooltip
  - type: static
    index: 7
    item: gui-tile-profile
    on_left:
      key: lobby.profile.show
    tooltip:
      - astera.gui.main-menu.profile.tooltip
  - type: static
    index: 0
    item: gui-tile-admin
    visible_if: permission:astera.admin.panel
    on_left:
      key: admin.hub.open
    tooltip:
      - astera.gui.main-menu.admin.tooltip
  - type: static
    index: 8
    item: gui-tile-item-catalog
    visible_if: permission:astera.admin.panel
    on_left:
      key: admin.items.open
      payload: { category: all }
    tooltip:
      - astera.gui.main-menu.item-catalog.tooltip
