# Wave 5h demo GUI. Text-input prompt for renaming a loadout. CHEST_9 layout:
# border padding around a single centred text input. Demonstrates the
# `text_input` slot variant from ADR-0074 §2.
id: example-loadout-rename
title_key: astera.gui.loadout.rename.title
size: CHEST_9

slots:
  - type: border
    index: 0
    item: gui-pane-dark
  - type: border
    index: 1
    item: gui-pane-dark
  - type: border
    index: 2
    item: gui-pane-dark
  - type: text_input
    index: 4
    placeholder_key: astera.gui.loadout.rename.placeholder
    max_length: 24
    on_submit:
      key: loadout.rename
      payload: { loadout_id: "main" }
  - type: border
    index: 6
    item: gui-pane-dark
  - type: border
    index: 7
    item: gui-pane-dark
  - type: static
    index: 8
    item: gui-pane-red
    on_click:
      key: gui.close
