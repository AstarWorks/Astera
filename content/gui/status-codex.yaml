# Status effect codex - every status with what it does (UI-12). Opened by `/astera status codex` and linked from
# the Help text. The tooltip of each icon is the shared one-line effect text `astera.statusdesc.<id>`; the icon name
# is the status name. Row 0 and 1 hold the 18 statuses (alphabetical by id); Back returns to the main menu.
id: status-codex
title_key: astera.statuscodex.title
size: CHEST_27

slots:
  - type: static
    index: 0
    item: gui-tile-status-bleed
    tooltip:
      - astera.statusdesc.bleed
  - type: static
    index: 1
    item: gui-tile-status-burn
    tooltip:
      - astera.statusdesc.burn
