# Star generator of the Norma arena (ADR-0246): stands on a built pedestal (a layout landmark of
# content/stages/example-arena.yaml at the same x/z). Mirrors plugin/match/.../application/config/GeneratorYamlConfig.kt.
#
# `match_stage_id` ties the generator to a stage in content/stages/. `period_seconds` is wall-clock seconds.
# `amount` is the base per-spawn star count (anomalies / boons scale it). Stars are an in-match item: the generator holds
# them (up to `stockpile_cap`, default 5) until a participant within `pickup_radius` blocks (default 3) takes them.

id: arena-east
match_stage_id: example-arena
position: { x: 6.5, y: 65.0, z: 0.5 }
period_seconds: 30.0
amount: 1
tier: iron
affiliation:
  kind: neutral
# Sudden death (late game) multiplies each pop.
late_game_multiplier: 2.0
