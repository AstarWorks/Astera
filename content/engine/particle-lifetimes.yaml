# Mean client lifetime (ticks) of every vanilla particle a skill may emit (load-time check 16, caster-eye clutter).
# An emitted particle absent from this file is a load error (UnknownParticleLifetime): add it here, with its source, first.
# mean: expected life in ticks. scale_with_size: true multiplies it by the emitted particle's size (dust-like particles).
# source: jar-26.3 = derived from the vanilla 26.3 particle class; measured-in-client = observed in a real client;
#         carried-default-16 = NOT sourced yet, the 16-tick default of the retired game-sim table (re-source from the jar, then change this tag).
