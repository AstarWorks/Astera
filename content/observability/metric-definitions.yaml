# Astera business KPI manifest (Wave 5u, ADR-0087).
#
# This file is a *manifest*, not a config. The runtime IAnalyticsExporter
# already knows every metric name at compile time; operators consult this
# YAML to know what to dashboard and alert on without source-diving.
#
# Convention:
#  - prefix: `astera_<domain>_<noun>`
#  - suffix `_total` on counters (Prometheus convention; Micrometer auto-adds for Counters)
#  - suffix `_seconds` on duration histograms
#  - no `_total` on gauges (Micrometer strips it silently — see MatchQueueMetric note)
#  - label cardinality must stay bounded — currency / skill_id / weapon_id pull
#    from finite enumerations; matchId is high-card but bounded per session

metrics:
  # ── Match scope ────────────────────────────────────────────────────────
  - name: astera_match_duration_seconds
    type: histogram
    description: "End-to-end match duration from MatchStarted → MatchEnded."
    labels: ["winning_team"]
    unit: seconds

  - name: astera_match_kill_count_total
    type: counter
    description: "Cumulative kill count, labeled by the item id that delivered the lethal blow."
    labels: ["item_id"]

  - name: astera_match_player_count
    type: gauge
    description: "Currently-active players per match. Reset to 0 on MatchEnded."
    labels: ["match_id"]

  # ── Player scope ───────────────────────────────────────────────────────
  - name: astera_player_session_duration_seconds
    type: histogram
    description: "Player session duration from join → quit. Histogram so p50/p95 are queryable."
    labels: []
    unit: seconds

  - name: astera_player_kill_count_total
    type: counter
    description: "Per-player cumulative kills across all matches."
    labels: []

  - name: astera_player_death_count_total
    type: counter
    description: "Per-player cumulative deaths across all matches."
    labels: []

  # ── Economy scope (Wave 5f marketplace) ────────────────────────────────
  - name: astera_shop_revenue_total
    type: counter
    description: "Cumulative shop / marketplace revenue, labeled by currency."
    labels: ["currency"]

  - name: astera_marketplace_listing_count
    type: gauge
    description: "Active marketplace listings at scrape time."
    labels: []

  # ── Skill scope (Wave 5a-fix2 SkillTrigger 20-variant taxonomy) ────────
  - name: astera_skill_cast_total
    type: counter
    description: "Cumulative skill casts, labeled by skill id."
    labels: ["skill_id"]
