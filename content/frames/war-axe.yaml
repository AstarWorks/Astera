# Point table for the war-axe: measured from the real 3D model content/models/items/war-axe.model.json [tools/model-forge/batches/heavy-models], not from a sprite.
# Chain as content/frames/couture-rapier.yaml: q = RotY[180] * [ T + Rxyz * [ S * [p/16 - 0.5] ] ], p = model point in pixels [16 px = 1 block], T/R/S = the model display block of the part display.
# Model space: item upright along model +Y, grip at the bottom, plates thin in Z [centre z = 8], cutting edge toward +X.
# Model points [px]: grip=[8, 2.4, 8] [hand centre, = pivot], root=[14.2, 18.8, 8], tip=[15.0, 29.2, 8], edge dir=[1, 0, 0]; root/tip sit on the striking edge/axis so the trail particles run on the steel.
# length = model extent along model +Y [whole item, grip end to far end] * display scale / 16. hand_anchor = q[[8,8,8]] under the third-person display [the point the hand frame sits on].
