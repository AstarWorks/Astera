# Point table for the stone-axe: a flat handheld sprite (content/textures/generated/items/stone-axe.png, vanilla item/handheld parent), no 3D model (docs/art/arsenal-flat-art.md).
# Same chain and conventions as content/frames/war-axe.yaml: q = RotY(180) * ( T + Rxyz * ( S * (p/16 - 0.5) ) ) on the sprite plane (z = 8), 16 px = 1 block.
# Display transforms are vanilla item/handheld: fixed = rot [0,180,0] tr [0,0,0] scale 0.5; thirdperson_righthand = rot [0,-90,55] tr [0,6.5536,-1.5784] scale 0.85 (vanilla handheld tr [0,4,0.5] moved so the grip sits on the display origin, as the war-axe and the bastion greatsword; model json display override).
# Points are sprite centroids along the handle-to-head diagonal: grip = the lowest 18% (pivot = grip), root = the 30-36% band (head base), tip = the farthest opaque pixel.
# long = the sprite diagonal (1,1,0) grip -> tip; edge = (1,-1,0) in the sprite plane, perpendicular to long. The sprite has no visible cutting-edge side, so edge: leading|trailing in a swing is only a convention.
