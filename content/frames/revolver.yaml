# Point table for the revolver (ADR-0315: the `gun` frame rig of revolver-shot draws it). Frame and chain as content/frames/dagger.yaml:
# item-display-local, block units, q = RotY(180) * ( T + Rxyz * ( S * (p/16 - 0.5) ) ) with T/R/S from the vanilla display block.
# content/models/generated/items/revolver.model.json is a flat `minecraft:item/handheld` item (32x32 texture, 1 model unit = 2 px, texture
# row 0 = model y 16): the grip is the lower-left blob (px cols 1-7, rows 19-24), the barrel runs level to the right (rows 8-11, muzzle col 31).
#   grip = centre of the grip (2.5, 5.5, 8): where the hand holds; pivot = grip
#   root = where the barrel leaves the frame above the grip (5, 11, 8); tip = the muzzle (15.5, 11, 8)
#   long = root -> tip = model +X (the barrel); edge = model +Y (the top of the gun: sights and hammer side), so a rig with long along
#   `aim` and edge along `up` holds the gun level and upright. length = grip bottom (2.5, 3.75) to the muzzle.
# held = under item/generated `fixed` (rot [0,180,0], scale 1); held_hand = under item/handheld `thirdperson_righthand` (rot [0,-90,55],
# tr [0,4,0.5], scale 0.85), the transform the rig's main-hand mesh draws with; hand_anchor = model centre (8,8,8). Both relative to grip.
# Muzzle from grip in held_hand: 0.6906 along long, 0.2922 along edge (display units; the rig scales them by PLAYER_SCALE: 0.65 / 0.27).
apiVersion: astera/v3
kind: ItemFrames
