# Lobby shop (default target of the lobby shop NPC, the main-menu tile and
# `/astera shop`). Every `item` must exist in content/items/ (ShopShippedContentTest).
# Currency design (docs/game-design/economy/README.md, ADR-0271):
#   GOLD  = the one persistent currency, earned from matches (content/balance/match-rewards.yaml),
#           quests, achievements, level rewards and the login bonus. Stars are a match item, never a price.
# Pricing is ordered by item rarity (ShippedWeaponAcquisitionTest pins it, every tier strictly above the one below):
#   common    - starter weapons (content/balance/starter-grant.yaml): never sold here
#   uncommon  150-250
#   rare      350-400
#   epic      500-600
# Not sold, on purpose: the starter weapons (pistol, knight-sword) and the dev/demo items rtm-blaster / skill-tester.
# A new player starts with 150 GOLD (content/balance/starter-grant.yaml, ECO-11): exactly the recommended frost-staff.
# Offers priced at >= 100 need a confirming second click in the GUI (ShopIntentHandler.CONFIRM_AT).
# `recommended: true` pins the offer first (with a badge) for a player who has bought nothing here yet: the starter kit is
# gun + sword, so the newcomer is steered to a staff to meet all three archetypes.
# Offers iterate in YAML order, 9 per GUI row, 45 per page; the footer row holds paging, the category
# cycle (when offers declare `category:`), the wallet and the purchase history (ADR-0211).
# `limit: once` (default) = an unlock paid once, re-claimable for free if the item is lost;
# `limit: unlimited` = a consumable, paid on every purchase.
id: example-shop
display_key: astera.economy.shop.example-shop.title

offers:
  - id: dagger
    item: dagger
    category: sword
    price:
      currency: GOLD
      amount: 150
    stock:
      type: unlimited
    display_key: astera.economy.shop.example-shop.offer.dagger
