  # Consumables (ECO-04): `limit: unlimited` = paid on every purchase, used up on use (consume_item) and gone for
  # good even when used in a match (the match-end restore removes consumed copies). Priced below one match's
  # GOLD (35 for a loss, 120 for a win): a heal costs about a loss's pay, so carrying one is a real choice.
  - id: heal-potion
