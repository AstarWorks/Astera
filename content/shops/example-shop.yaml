# Lobby shop (default target of the lobby shop NPC, the main-menu tile and
# `/astera shop`). Every `item` must exist in content/items/ (ShopShippedContentTest).
# Currency design (docs/game-design/economy/README.md, ADR-0199):
#   STAR  = the everyday currency, paid by every match (content/balance/match-rewards.yaml)
#           -> standard weapons, 100-320 STAR (about 2-6 matches each).
#   GOLD  = scarce prestige currency (quests, advancements, a little per win)
#           -> the top-tier greatsword / thunder staff, 120-150 GOLD.
# A new player starts with 150 STAR (content/balance/starter-grant.yaml): the cheapest offer is
# affordable at once, everything else has to be earned.
# Offers priced at >= 100 need a confirming second click in the GUI (ShopIntentHandler.CONFIRM_AT).
# offers iterate in YAML order, 9 per GUI row (max 45), footer row = wallet.
id: example-shop
display_key: astera.economy.shop.example-shop.title

offers:
  - id: pistol
    item: pistol
    price:
      currency: STAR
      amount: 120
    stock:
      type: unlimited
    display_key: astera.economy.shop.example-shop.offer.pistol-basic
  - id: knight-sword
    item: knight-sword
    price:
      currency: STAR
      amount: 100
    stock:
