# Wave 5pve-boss / Wave 5effects (ADR-0109) demo orchestration.
#
# Boss phase-transition cue: a particle burst at the boss centre + a
# transition sting + a brief status AOE (slowness) on every nearby
# attacker. Scope is intentionally minimal — it documents the wire shape
# that future YAML→EffectChain loaders (Wave 6 / Wave 5pve-boss) will
# consume. Today this file is reference-only; loaders ship in a later
# wave.
id: boss-phase-transition
description: Boss-phase transition cinematic — burst + sting + slowness AOE.
chain:
  parallel:
    - emit:
        kind: particle
        particle:
          key: "minecraft:flash"
          count: 64
    - sequence:
        - delay_ticks: 2
        - emit:
            kind: sound
            sound:
              key: "astera:boss/phase/transition"
              volume: 1.0
              pitch: 1.0
        - delay_ticks: 5
        - emit:
            kind: status
            effect_id: slowness
            duration_ticks: 60
