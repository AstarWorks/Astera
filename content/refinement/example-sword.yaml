# content/refinement/example-sword.yaml — Wave 5refine / ADR-0100.
#
# Per-item refinement profile. Drop one of these per refinable item in
# `content/items/`. Items whose YAML omits a matching file here stay
# non-refinable (default: RefinementSpec.DISABLED).
#
# The four 厳選 axes (HSB 8-layer / 原神 / MH / PoE) all compose
# multiplicatively via the existing IAttributeContainer modifier resolution
# (ADR-0058). Re-rolling sub-stats keeps the old roll set by default — the
# player chooses keep / discard (Warframe Riven 反例 教訓 per ADR-0100).
#
# Resource sink (escalating cost) lives in
# `RefinementMath.rerollCost`:
#   roll 1 → 900   roll 2 → 1000   roll 3 → 2000   roll 4 → 2500   roll 5+ → 3000

id: example-sword
profile:
  enabled: true
  gemstone_slots: 3                       # HSB Gemstone
  reforge_pool: [sharp, fierce, demonic]  # HSB Reforge Stone
  upgradeable_to: 10                      # HSB Star 1..10
  sub_stat_count: 4                       # 原神聖遺物 sub-stats
  max_rolls_per_stat: 5
  candidate_stats:
    - attack
    - crit_chance
    - crit_dmg
    - defense
