# Shared bow-shot body clip for the player skin rig (longbow, shortbow). Mirrors the vanilla bow_pulling pose:
# both arms level and forward (X -90), bow arm (right, the main hand) turned slightly out, string arm (left) turned in toward the bow hand.
# The arrow leaves at skill tick 0 (gameplay ticks are balance), so the drawn pose is held from t0, the string hand snaps back at release (t1-t2), then relaxes.
id: bow-draw
length_ticks: 14
loop: false
lock_movement: false
blend_in_ticks: 0
blend_out_ticks: 3
bones:
  right_arm:
    rotation:
      - { t: 0, v: [-90, -6, 0] }
      - { t: 1, v: [-96, -6, 0], ease: ease_out }     # bow kicks up a hair on release
      - { t: 3, v: [-90, -6, 0], ease: ease_in_out }
      - { t: 9, v: [-90, -6, 0] }                      # follow-through hold
      - { t: 14, v: [0, 0, 0], ease: ease_in_out }
  left_arm:
    rotation:
      - { t: 0, v: [-90, 28, 0] }
      - { t: 1, v: [-78, 60, 0], ease: ease_out }      # string hand whips back
      - { t: 4, v: [-70, 55, 0], ease: ease_in_out }
      - { t: 9, v: [-75, 40, 0] }
      - { t: 14, v: [0, 0, 0], ease: ease_in_out }
  body:
    rotation:
      - { t: 0, v: [0, -12, 0] }
      - { t: 9, v: [0, -12, 0] }
      - { t: 14, v: [0, 0, 0], ease: ease_in_out }
