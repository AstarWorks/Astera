# Friendly wave emote (ADR-0250). Play with `/astera emote wave` or `play_animation: wave`.
# Raising the right arm outward is a negative Z rotation; the wave is the arm rocking +-15 degrees.
id: wave
length_ticks: 30
loop: false
lock_movement: true
blend_in_ticks: 3
blend_out_ticks: 3
bones:
  right_arm:
    rotation:
      - { t: 0, v: [0, 0, 0] }
      - { t: 6, v: [-15, 0, -150], ease: ease_out }
      - { t: 9, v: [-15, 0, -135], ease: ease_in_out }
      - { t: 12, v: [-15, 0, -165], ease: ease_in_out }
      - { t: 15, v: [-15, 0, -135], ease: ease_in_out }
      - { t: 18, v: [-15, 0, -165], ease: ease_in_out }
      - { t: 21, v: [-15, 0, -135], ease: ease_in_out }
      - { t: 24, v: [-15, 0, -150], ease: ease_in_out }
      - { t: 30, v: [0, 0, 0], ease: ease_in_out }
  head:
    rotation:
      - { t: 0, v: [0, 0, 0] }
      - { t: 8, v: [0, 0, 7], ease: ease_out }
      - { t: 24, v: [0, 0, 7] }
      - { t: 30, v: [0, 0, 0], ease: ease_in_out }
  body:
    rotation:
      - { t: 0, v: [0, 0, 0] }
      - { t: 8, v: [0, 0, 3], ease: ease_out }
      - { t: 24, v: [0, 0, 3] }
      - { t: 30, v: [0, 0, 0], ease: ease_in_out }
