# swing-trail: the particle streak a melee swing leaves along the weapon rig (a model-backed anchor), from its root point to its tip point:
#   - {id: trail, use: swing-trail, with: {samples: 6, extra: 0.04, span: 8}, frames: {weapon: /windup/rig}, detach: true}
# One particle per sample point every `every` ticks for `span` ticks, starting at the call tick.
# The row id (trail) is part of the shipped goldens: rename it only together with `regenSkillOracle`.
---
apiVersion: astera/v3
kind: Part
id: swing-trail
params:
  samples:  {type: number, required: true}   # points sampled between root and tip
  span:     {type: ticks, required: true}    # ticks the streak lasts
  extra:    {type: number, default: 0.04}    # particle speed
  every:    {type: ticks, default: 1}
  particle: {type: string, default: crit}
frames_in: {weapon: anchor}
machine:
  start: main
  states:
    main:
      final: true
      do:
        - {id: trail, op: particle, particle: "${particle}", anchor: {of: weapon.root, to: weapon.tip, samples: "${samples}"}, count: 1, extra: "${extra}", at: 0, every: "${every}", for: "${span}"}
