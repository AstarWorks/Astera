# Shatters blocks in a sphere ahead of the caster; the tiers differ in radius.
# Template for pickaxe-shatter-{stone,iron,diamond}: the tier skills own item, cooldown, names and the effect anchor; this part owns the one
# world op plus its sound / particle rows. Tiers differ only by the `with:` params. `sound:` / `def:` are literal ids,
# so the per-tier ids are rows gated on `tier`.
apiVersion: astera/v3
kind: Part
id: pickaxe-shatter
params:
  radius:       {type: number, required: true}
  ahead:        {type: number, default: 4.0}
  tier:         {type: number, required: true}   # 1 stone, 2 iron, 3 diamond: gates the per-tier rows
  stone_pitch:  {type: number, required: true}
  thud_vol:     {type: number, default: 0.7}     # tier 2+ trident thud
  thud_pitch:   {type: number, default: 1.2}
  ripple:       {type: number, default: 29}
  revert:       {type: number, default: 200}
frames_in: {spot: anchor}
emits: [end]
machine:
  start: smash
  states:
    smash:
      for: 1
      then: end
      do:
        - {id: break, op: break_area, anchor: caster, shape: {sphere: {radius: "${radius}", ahead: "${ahead}"}}, tool: pickaxe, block_damage: 100, ripple: "${ripple}", revert: "${revert}", outside_arena: false}
        - {id: snd, op: sound, sound: block.stone.break, anchor: caster, volume: 1.0, pitch: "${stone_pitch}"}
        - {id: snd_2, op: sound, sound: item.trident.hit_ground, anchor: caster, volume: "${thud_vol}", pitch: "${thud_pitch}", when: "= tier >= 2.0"}
        - {id: snd_3, op: sound, sound: block.amethyst_cluster.break, anchor: caster, volume: 0.8, pitch: 1.0, when: "= tier == 3.0"}
        - {id: fx_1, op: particle_def, def: tool-pick-stone, anchor: spot, when: "= tier == 1.0"}
        - {id: fx_2, op: particle_def, def: tool-pick-iron, anchor: spot, when: "= tier == 2.0"}
        - {id: fx_3, op: particle_def, def: tool-pick-diamond, anchor: spot, when: "= tier == 3.0"}
    end: {final: true}
