# 日本語ロケール。
# Key naming: astera.<area>.<...>
# - astera.system.*       システムメッセージ
# - astera.command.*      コマンド出力
# - astera.weapon.<id>.*  武器ごとのテキスト
# - astera.error.*        エラー
#
# Values can use MiniMessage tags:
#   <red>, <gold>, <bold>, <italic>, <reset>
# and placeholders: {player}, {weapon}, {amount}.

astera:
  system:
    welcome: "<gold><bold>Astera</bold></gold> へようこそ、{player}！"
    plugin_enabled: "<green>Astera プラグインが有効になりました</green>"
    plugin_disabled: "<yellow>Astera プラグインを無効化しています...</yellow>"

  command:
    give:
      success: "<green>{player} に <gold>{item}</gold> を渡しました</green>"
      not_found: "<red>アイテム ID <gold>{item}</gold> が見つかりません</red>"
      usage: "<yellow>使い方: /astera-items give <プレイヤー> <アイテムID></yellow>"
    player-only: "<red>このコマンドはプレイヤーのみ実行できます。</red>"
    player-offline: "<red>このコマンドはオンライン中のみ実行できます。</red>"
    menu:
      root: "<gray>メインメニューを開きます。</gray>"
    reload:
      unknown_category: "<red>未登録の reload カテゴリです。Tab キーで登録済みコンテンツタイプを表示できます。</red>"
      load_failed: "<red>reload を中止しました。一部 YAML がパースに失敗しています。直前の状態は保持されています。サーバーログを確認してください。</red>"
    # Wave 5u (ADR-0087): /astera-profiling export — flamegraph snapshot dump.
    profiling:
      root: "<gray>プロファイリング診断コマンド（管理者専用）。</gray>"
      export: "<green>プロファイリング snapshot を flamegraph 形式 (Brendan Gregg collapsed) で書き出します。</green>"

  # Wave _items-1 (ADR-0073): item / weapon の content-specific i18n は
  # 各 content/items/<id>.yaml 内に inline 化。`weapon:` セクションは
  # cross-cutting chrome string (on_cooldown / none_held / fired event 通知)
  # に絞られ、ADR-0073 で `item:` に名前変更。
  item:
    fired: "<yellow>{player} が <gold>{item}</gold> を使用しました</yellow>"
    on_cooldown: "<red>{item} はクールダウン中です ({remaining})</red>"
    none_held: "<gray>アイテムを装備していません</gray>"

  permission:
    denied: "<red>権限がありません: {permission}</red>"

  error:
    internal: "<red>内部エラーが発生しました。詳細はサーバーログを確認してください。</red>"
    permission: "<red>このコマンドを実行する権限がありません</red>"

  # Wave 5d — クロスプラグイン ConfigError messageKey (ADR-0033)。
  # astera.match.config.error.* から昇格。Core 側の DTO
  # (BlockDurabilityYamlConfig, 将来の ParticleDefinitionYamlConfig 等) も
  # Match 側 DTO と同じ i18n 表面を共有する。
  config:
    error:
      unknown-enum-value: "<red>設定エラー: {field} の値 '{value}' は不正です。許容値: {accepted}。</red>"
      out-of-range: "<red>設定エラー: {field}='{value}' は {constraint} に違反しています。</red>"
      field-shape-mismatch: "<red>{field} の設定エラー: {detail}。</red>"
      invalid-identifier: "<red>設定エラー: {field}='{value}' は識別子として無効です ({constraint})。</red>"
      schematic:
        not-found: "<red>schematic ファイルが見つかりません: {path}。</red>"
        invalid-version: "<red>{path} の schematic バージョン {version} はサポートされていません。</red>"

  # Wave 4 R3 — Declarative GUI demo (ADR-0021) + Wave 4.5 bindings (ADR-0027).
  gui:
    loadout:
      title: "ロードアウト"
    personal_vault:
      title: "パーソナルヴォルト"
    button:
      close: "閉じる"
    binding:
      unknown: "<red>不明なバインディング: {binding}</red>"
      unavailable: "<gray>(バインディングデータ利用不可)</gray>"
      resolved_to_barrier: "<red>バインディング解決失敗 (プレースホルダ)。</red>"
    error:
      open-rejected: "<red>メニューを開けませんでした。</red>"
    # Wave 5lobby-content (ADR-0119) — ロビー GUI タイトル + タイル tooltip.
    main-menu:
      title: "<gold>メインメニュー</gold>"
      queue:
        tooltip: "<gray>クリックでマッチキューに参加。</gray>"
      shop:
        tooltip: "<gray>クリックでロビーショップを開く。</gray>"
      refinement:
        tooltip: "<gray>クリックでアイテムを強化。</gray>"
      customize:
        tooltip: "<gray>クリックでロードアウトを編集。</gray>"
      travel:
        tooltip: "<gray>クリックで PvE / サバイバル / ロビーへ移動。</gray>"
      profile:
        tooltip: "<gray>クリックでプロフィールを表示。</gray>"
    travel-menu:
      title: "<gold>移動</gold>"
      pve:
        tooltip: "<gray>PvE オープンワールドへ。</gray>"
      survival:
        tooltip: "<gray>パーティのサバイバルアイランドへ。</gray>"
      lobby:
        tooltip: "<gray>ロビーに戻る。</gray>"
    customize-menu:
      title: "<gold>カスタマイズ</gold>"
      loadout:
        tooltip: "<gray>装備中のロードアウトを編集。</gray>"
      refinement:
        tooltip: "<gray>アイテムに強化を適用。</gray>"
      profile:
        tooltip: "<gray>プロフィールカードを表示。</gray>"
    # Wave 5game-complete (ADR-0121 §B) — 9 枠ロードアウトセレクター。
    loadout-selector:
      title: "<aqua>ロードアウト選択</aqua>"
      slot:
        tooltip:
          activate: "<gray>左クリック: このロードアウトを有効化</gray>"
          rename: "<gray>右クリック: 名前を変更</gray>"
          reset: "<gray>シフトクリック: 内容をクリア</gray>"
          save: "<gray>中クリック: 現在の装備を保存</gray>"
    profile-card:
      title: "<gold>プロフィール</gold>"
      head:
        tooltip: "<gray>自分のアバター。</gray>"
      power-index:
        tooltip: "<gray>パワー指数。</gray>"
      currency:
        tooltip: "<gray>通貨残高。</gray>"
      recent-matches:
        tooltip: "<gray>最近のマッチ。</gray>"
    friends-list:
      title: "<gold>フレンド</gold>"
      add:
        tooltip: "<gray>フレンド申請を送信。</gray>"
      pending:
        tooltip: "<gray>受信中のフレンド申請。</gray>"
      tile:
        tooltip: "<gray>フレンド。</gray>"
    party-manager:
      title: "<gold>パーティ</gold>"
      invite:
        tooltip: "<gray>プレイヤーをパーティに招待。</gray>"
      transfer-leader:
        tooltip: "<gray>リーダー権限を委譲。</gray>"
      kick:
        tooltip: "<gray>メンバーをパーティから外す。</gray>"
      leave:
        tooltip: "<gray>パーティを抜ける。</gray>"
    settings:
      title: "<gold>設定</gold>"
      locale:
        tooltip: "<gray>表示言語を切り替え。</gray>"
      volume:
        tooltip: "<gray>音量を調整。</gray>"
      controls:
        tooltip: "<gray>操作スキームを切り替え。</gray>"
    queue-mode-list:
      title: "<gold>マッチキュー</gold>"
      norma:
        tooltip: "<gray>クリックで Norma ローテーションキューに参加。</gray>"

  weapons:
    command:
      # See en.yaml for the rationale on the dotted "gui.loadout" key.
      gui: "GUI コマンド"
      "gui.loadout": "ロードアウト GUI を開く"
      "gui.loadout.player_not_online": "<red>オンラインでないとこの GUI は開けません。</red>"
      "gui.loadout.not_found": "<red>ロードアウト GUI が登録されていません。</red>"
      "gui.loadout.open_rejected": "<red>ロードアウト GUI を開けませんでした。</red>"
    loadout:
      toggle:
        ok: "ロードアウトを更新しました。"

  # ── Wave 4.5 (ADR-0027): Shop / Loadout 永続化 / Norma / Match / Spawn ──
  economy:
    shop:
      example-shop:
        title: "サンプルショップ"
        offer:
          sword: "サンプルソード"
          pistol: "サンプルピストル"
          wand: "サンプルワンド"
      browse:
        invalid_id: "<red>不正なショップ ID: {shop}</red>"
        player_not_online: "<red>ショップを開くにはオンラインである必要があります。</red>"
        not_found: "<red>ショップが見つかりません: {shop}</red>"
        open_rejected: "<red>ショップ GUI を開けませんでした。</red>"
      purchase:
        success: "<green><gold>{offer}</gold> を {price} {currency} で購入しました。</green>"
        failure_generic: "<red>購入に失敗しました。</red>"
        player_not_online: "<red>購入にはオンラインである必要があります。</red>"
        shop_not_found: "<red>購入中にショップが消失しました。</red>"
        offer_not_found: "<red>そのオファーは存在しません。</red>"
        out_of_stock: "<red>在庫切れです。</red>"
        insufficient_funds: "<red>{currency} の残高が不足しています。</red>"
        delivery_failed: "<red>アイテムを配送できませんでした: {reason}</red>"
    command:
      shop:
        root: "ショップコマンド"
        browse: "ID 指定でショップを開く"
    # Wave 5f (ADR-0035, RTM #12/#19): マーケットプレイス + JP 資金決済法 compliance。
    policy:
      error:
        transfer_blocked: "<red>この通貨は譲渡できません (JP 資金決済法準拠)。</red>"
        cap_exceeded: "<red>発行上限を超えました。時間をおいて再試行してください。</red>"
        redeem_blocked: "<red>この通貨は現金に換金できません。</red>"
        expired: "<red>取引前に対象残高が期限切れになりました。</red>"
    marketplace:
      error:
        not_found: "<red>出品が見つかりません。</red>"
        not_active: "<red>その出品は既に終了しています。</red>"
        self_purchase: "<red>自分の出品は購入できません。</red>"
        insufficient_funds: "<red>{currency} の残高が不足しています。</red>"
        unknown_item: "<red>不明なアイテムです: {item}</red>"
        invalid_price: "<red>出品価格は正の値である必要があります。</red>"
        not_seller: "<red>この出品の出品者ではありません。</red>"
      listing:
        title: "<gold>マーケットプレイス出品</gold>"
        sold: "<gray>売却済</gray>"
        expired: "<gray>期限切れ</gray>"

  # Wave 5bet (ADR-0103): 1v1 賭けマッチのユーザ向けエラー。
  betting:
    unknown_policy: "<red>賭けポリシーが未設定です。</red>"
    currency_not_allowed: "<red>その通貨は賭けに使用できません。</red>"
    stake_exceeds_cap: "<red>1 試合あたりの上限を超えています。</red>"
    daily_cap_exceeded: "<red>本日の賭け上限に達しました。</red>"
    cooldown_active: "<red>直前の賭けからのクールダウン中です。</red>"
    loss_streak_limit: "<red>連敗クールダウン中です。</red>"
    self_betting_forbidden: "<red>自分自身を相手に賭けることはできません。</red>"
    player_opted_out: "<red>その対戦相手は賭けを許可していません。</red>"
    unknown_match: "<red>賭けが見つかりません。</red>"
    not_pending: "<red>その賭けは受諾待ち状態ではありません。</red>"
    not_active: "<red>その賭けは進行中ではありません。</red>"
    acceptance_expired: "<red>この申請は有効期限切れです。</red>"
    not_invited: "<red>あなたはこの賭けの当事者ではありません。</red>"
    escrow_debit_failed: "<red>賭け金を確保するには残高が不足しています。</red>"
    already_escrowed: "<red>この賭けは既に賭け金が確保されています。</red>"
    escrow_missing: "<red>この賭けのエスクロー記録が見つかりません。</red>"

  # Wave 5f (ADR-0035): GUI リアクティブ数値バインディング + パーティクル定義。
  gui_binding:
    coins:
      value: "<gold>{amount} {currency}</gold>"
    kills:
      value: "<aqua>{amount}</aqua>"

  particle:
    example-burst:
      name: "<red>火花バースト</red>"
    example-ring:
      name: "<aqua>氷の輪</aqua>"

  # Wave 5effects (ADR-0109): content/sounds/<category>/ で登録された
  # サウンドの表示名。/astera-sounds 管理リストとツールチップに出る。
  sound:
    match:
      phase-transition:
        name: "<gold>マッチフェーズ遷移</gold>"
    skill:
      fireball-cast:
        name: "<red>ファイアボール詠唱</red>"

  loadout:
    save:
      success: "<green>ロードアウトの <gold>{slot}</gold> スロットを保存しました。</green>"
      failed: "<red>ロードアウトの保存に失敗: {reason}</red>"
    fetch:
      success: "<green>ロードアウトを読み込みました。</green>"
      empty: "<gray>ロードアウト未設定。</gray>"
    slot:
      main: "メイン"
      sub: "サブ"
      move: "移動"
      special: "スペシャル"
      armor: "防具"
      ultimate: "アルティメット"
    cleared: "<gray>{slot} スロットをクリアしました。</gray>"
    apply:
      on_match_start: "<gray>試合用のロードアウトを適用しました。</gray>"

  norma:
    progress:
      updated: "<gray>{norma}: {current}/{target}</gray>"
    completed: "<green>ミッション達成: <gold>{norma}</gold>！</green>"
    reward:
      delivered: "<green>報酬: +{amount} {currency} (+{xp} XP)</green>"
    period:
      new_started: "<gray>新しい {period} 期間が始まりました。</gray>"

  match:
    phase:
      countdown_start: "<yellow>試合開始まで {seconds} 秒…</yellow>"
      active_started: "<green>試合が開始されました！</green>"
      sudden_death: "<gold>サドンデス！</gold>"
    victory: "<green>勝利！ {team} チームの勝ち。</green>"
    defeat: "<red>敗北。{team} チームの勝ち。</red>"
    draw: "<gray>引き分けで試合終了。</gray>"
    score:
      threshold_reached: "<gold>{team} がスコア閾値に到達しました。</gold>"
    no_winning_team: "<gray>勝者なし。</gray>"
    spawn:
      error:
        match-not-found: "<red>スポーン対象の試合が見つかりません。</red>"
        stage-not-found: "<red>試合のステージが見つかりません。</red>"
        no-spawn-for-kind: "<red>指定種別のスポーン地点がありません。</red>"
        teleport-failed: "<red>テレポートに失敗しました。</red>"
    # Wave 5n — 試合 config オーバーレイ エラー (ADR-0080)
    config:
      unknown_match: "<red>試合 config: 不明な試合 ID '{matchId}'。</red>"
      unknown_world: "<red>試合 config: 不明なワールド '{worldId}'。</red>"
    # Wave 5c — ゲームモード表示文字列 (ADR-0032)
    mode:
      battle-loyal:
        name: "<gold>バトルロイヤル</gold>"
        description: "<gray>小規模なフリーフォーオール。最多キル数で勝利。</gray>"
      break-core:
        name: "<gold>コアブレイク</gold>"
        description: "<gray>敵チームのコアブロックを破壊して勝利。</gray>"
      carry-tnt:
        name: "<gold>TNTキャリー</gold>"
        description: "<gray>敵拠点へTNTを運ぶ。先に {wins} 回配達したチームの勝ち。</gray>"
      carry-mini-tnt:
        name: "<gold>ミニTNTキャリー</gold>"
        description: "<gray>ミニTNTを {count} 個収集後、敵拠点へ配達する。</gray>"
      capture-wool:
        name: "<gold>ウールキャプチャ</gold>"
        description: "<gray>制圧エリアを保持して占領。先に {wins} 箇所占領で勝利。</gray>"
      steal-jewelry:
        name: "<gold>ジュエリースティール</gold>"
        description: "<gray>敵の宝石を自陣の保管庫へ盗む。全て盗んで勝利。</gray>"
    # Wave 5d — バリアドメイン (ADR-0033, RTM issue #8)
    barrier:
      created: "<aqua>{position} に {player} がバリアを設置しました。</aqua>"
      destroyed: "<red>バリア {barrier} が破壊されました。</red>"
      error:
        empty-region: "<red>空の領域でバリアを作成できません。</red>"
        invalid-slowdown: "<red>バリアの減衰率は 0% 〜 100% の範囲で指定してください ({value})。</red>"
        not-found: "<red>バリア {barrier} が見つかりません。</red>"
    # Wave 5d — キャプチャゾーン / KOTH (ADR-0033)
    zone:
      captured: "<green>{team} がゾーン {zone} を占領しました。</green>"
      contested: "<yellow>ゾーン {zone} は争奪中です。</yellow>"
    # Wave 5d — マッチ別ワールド (ADR-0033)
    world:
      created: "<gray>マッチワールド {world} を準備しました。</gray>"
      create-failed: "<red>マッチワールドの作成に失敗しました: {detail}。</red>"
      destroyed: "<gray>マッチワールド {world} を破棄しました。</gray>"
    # Wave 5d — ブロックトラッキング (ADR-0033)
    block:
      restored-on-match-end: "<gray>マッチ終了時に {count} 件のブロック変更を復元しました。</gray>"
    # Wave 5w — マッチメイキング キュー (ADR-0089)
    matchmaking:
      queue-failure: "<red>キュー処理が失敗しました。</red>"
      enqueue:
        success: "<green>キューに参加: <gold>{mode}</gold></green>"
        already-enqueued: "<red>既にキューに入っています。</red>"
        mode-closed: "<red>そのモードは閉鎖中です。</red>"
        invalid-mode: "<red>未知のマッチメイク モード <gold>{mode}</gold></red>"
    # Wave 5lobby-content (ADR-0119) — ロビー `lobby.queue.*` GuiIntent 出力.
    queue:
      unknown-mode: "<red>未知のキューモードです。</red>"
      join:
        success: "<green><gold>{mode}</gold> キューに参加しました。</green>"
        already-queued: "<red>既にキューに参加しています。</red>"
        not-queued: "<red>キューに参加していません。</red>"
        mode-closed: "<red>そのキューモードは現在閉鎖中です。</red>"
        party-too-large: "<red>パーティが選択モードに対して大きすぎます。</red>"
      dequeue:
        success: "<green>キューを離脱しました。</green>"
        not-enqueued: "<red>キューに参加していません。</red>"
      status:
        none: "<gray>キューには参加していません。</gray>"
        line: "<yellow>キュー:</yellow> <white>{mode}</white> <gray>(#</gray><gold>{position}</gold><gray>)</gray>"

    # Wave 5v — マッチ録画キャプチャ (ADR-0088)
    replay:
      error:
        not-recording: "<red>このマッチは現在録画されていません。</red>"
        empty: "<red>録画にイベントもキーフレームもありません。</red>"
        storage: "<red>リプレイ保存エラー: {reason}</red>"
        cap-hit: "<yellow>tick {cappedAtTick} で録画サイズ上限に達しました。以降のイベントは破棄されています。</yellow>"
    command:
      replay: "リプレイキャプチャコマンド"
      "replay.start": "マッチの録画を開始"
      "replay.stop": "録画を停止して保存"
      "replay.export": "最新録画を .replay.json に書き出し"
      "replay.invalid-id": "<red>マッチ ID が不正です: {match}</red>"
      "replay.not-found": "<red>マッチ {match} の録画は保存されていません。</red>"
      "replay.export-failed": "<red>マッチ {match} の書き出しに失敗: {reason}</red>"
      # Wave 5complete (ADR-0117 §Axis 3) — フラット管理サブコマンド。
      abort: "<gray>マッチを即座に中止します (AdminEnded)。</gray>"
      cancel: "<gray>マッチをキャンセルします (勝者なし)。</gray>"
      restart: "<gray>現在のマッチを終了し、同じステージで新たに開始します。</gray>"
    # Wave 5complete (ADR-0117 §Axis 4) — マッチごとのサイドバー表示。
    sidebar:
      title: "<gold><bold>マッチスコア</bold></gold>"
      team-line: "<gray>チーム {team}: <white>{score}</white></gray>"
      empty: "<gray>チームなし。</gray>"
    error:
      match-not-found: "<red>マッチが見つかりません。</red>"
      # Wave 5game-complete (ADR-0121 §F) — 最小プレイヤー数 guard.
      insufficient-players: "<red>マッチ開始に必要な人数が足りません（必要 {required} 人、現在 {actual} 人）。</red>"
    # Wave 5game-complete (ADR-0121 §C) — マッチ開始 5 秒カウントダウン。
    countdown:
      "1": "<red><bold>1</bold></red>"
      "2": "<gold><bold>2</bold></gold>"
      "3": "<yellow><bold>3</bold></yellow>"
      "4": "<green><bold>4</bold></green>"
      "5": "<aqua><bold>5</bold></aqua>"
    # Wave 5game-complete (ADR-0121 §D) — プレイヤーごとの結果表示。
    summary:
      victory: "<gold><bold>勝利！</bold></gold>"
      defeat: "<dark_red><bold>敗北</bold></dark_red>"
      draw: "<gray><bold>引き分け</bold></gray>"
      header: "<dark_aqua>== マッチ結果 ==</dark_aqua>"
      reason:
        score-threshold: "<gray>スコア閾値到達により終了。</gray>"
        timer-expired: "<gray>タイマー終了により終了。</gray>"
        admin: "<gray>管理者により終了。</gray>"
        sudden-death: "<gray>サドンデスで決着。</gray>"
        objective: "<gray>目標達成により終了。</gray>"
        cancelled: "<gray>マッチがキャンセルされました。</gray>"
