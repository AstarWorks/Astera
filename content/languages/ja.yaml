    command:
      root: "<gray>リリースノートを表示します（無指定で最新、または version 指定）。</gray>"
    header: "<gold><bold>Astera {version}</bold></gold> <gray>（リリース日: {released}）</gray>"
    highlight: "<gray>* {text}</gray>"
    footer:
      latest: "<gray>詳細は /astera patch {version} で確認できます。</gray>"
      full: "<white>{text}</white>"
    error:
      no_entries: "<red>changelog エントリが登録されていません。</red>"
      invalid_version: "<red>不正な version '{version}'。MAJOR.MINOR.PATCH 形式で指定してください（例: 0.1.0）。</red>"
      unknown_version: "<red>version '{version}' の changelog エントリは存在しません。</red>"

