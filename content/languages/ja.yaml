# UI-11 how-to-progress tutorial (7 steps; title/subtitle/hint/body/bubble/next per step)
  tutorial.guide.done.title: "ステップ完了！"
  tutorial.guide.menu.title: "はじめの一歩 (1/7)"
  tutorial.guide.menu.subtitle: "Fキーでロビーメニューを開こう"
  tutorial.guide.menu.hint: "手を空にするかコンパスを持ってF。スキップ: /astera tutorial skip"
  tutorial.guide.menu.body: "ここがすべての入口です。ロビーメニューから、対戦・ショップ・ミッションなど遊びに必要な機能へ進めます。\n手を空にするか、コンパスを持った状態で Fキー を押してみましょう。\nメニューは何度でも開けます。"
  tutorial.guide.menu.bubble: "Fキーで\nメニューを開こう"
  tutorial.guide.menu.next: "次のステップ: Fキーでメニューを開く"
  tutorial.guide.queue.title: "対戦に参加しよう (2/7)"
  tutorial.guide.queue.subtitle: "プレイゲートの案内人に話しかけよう"
  tutorial.guide.queue.hint: "光るプレイゲートへ歩き、案内人を右クリックしてモードを選ぶ。コンパスでQでも開く。"
  tutorial.guide.queue.body: "対戦に勝つとGOLDなどの報酬が手に入ります。まずは参加してみましょう。\nスポーン横の光るプレイゲートへ歩き、案内人を右クリックしてください。\nモードを選ぶと待機列に入り、人数がそろうと対戦が始まります。"
  tutorial.guide.queue.bubble: "ここで対戦に\n参加しよう"
  tutorial.guide.queue.next: "次のステップ: プレイゲートで対戦に参加"
  tutorial.guide.match.title: "対戦を最後まで遊ぼう (3/7)"
  tutorial.guide.match.subtitle: "対戦が終わるまで遊ぼう"
  tutorial.guide.match.hint: "対戦中はこの案内は止まります。終わってロビーに戻ると次へ進みます。"
  tutorial.guide.match.body: "対戦が終わるとロビーへ戻され、結果と報酬が確認できます。\n勝ち負けは気にせず、まずは最後まで遊んでみましょう。\n対戦中はこの案内は一時停止し、戻ってきたら続きから再開します。"
  tutorial.guide.match.bubble: "対戦を最後まで\n遊ぼう"
  tutorial.guide.match.next: "次のステップ: 対戦を最後まで遊ぶ"
  tutorial.guide.result.title: "結果を確認しよう (4/7)"
  tutorial.guide.result.subtitle: "メニューの「直近の結果」を開こう"
  tutorial.guide.result.hint: "Fキーでメニューを開き、「直近の結果」タイルをクリック。"
  tutorial.guide.result.body: "直近の対戦の成績や報酬は、メニューの「直近の結果」でいつでも見返せます。\nFキーでメニューを開き、「直近の結果」タイルをクリックしてください。\n何を得られたかを確認すると、次の買い物の目安になります。"
  tutorial.guide.result.bubble: "メニューで\n「直近の結果」を開こう"
  tutorial.guide.result.next: "次のステップ: メニューの「直近の結果」を見る"
  tutorial.guide.shop.title: "はじめての買い物 (5/7)"
  tutorial.guide.shop.subtitle: "マーケットでアイテムを1つ買おう"
  tutorial.guide.shop.hint: "マーケットの案内人を右クリックして、GOLDで買えるアイテムを1つ購入しよう。"
  tutorial.guide.shop.body: "最初の買い物ができるよう、スタート用のGOLDを用意してあります。\nマーケットの案内人を右クリックして、買えるアイテムを1つ選びましょう。\n気になるものなら何でも大丈夫です。メニューのショップタイルからも開けます。"
  tutorial.guide.shop.bubble: "ここでアイテムを\n1つ買おう"
  tutorial.guide.shop.next: "次のステップ: マーケットで1つ買い物"
  tutorial.guide.equip.title: "装備しよう (6/7)"
  tutorial.guide.equip.subtitle: "買ったアイテムをホットバーで手に持とう"
  tutorial.guide.equip.hint: "ホットバーの数字キーかホイールで、アイテムを手に持つ。"
  tutorial.guide.equip.body: "買ったアイテムは持ち物に入っています。使うには手に持つ必要があります。\n画面下のホットバーで、数字キーかマウスホイールを使って選んでください。\n対戦中も同じ操作で武器を持ち替えられます。"
  tutorial.guide.equip.bubble: "ホットバーで\n手に持とう"
  tutorial.guide.equip.next: "次のステップ: 買ったアイテムを手に持つ"
  tutorial.guide.missions.title: "ミッションを確認しよう (7/7)"
  tutorial.guide.missions.subtitle: "メニューの「デイリー/クエスト」を開こう"
  tutorial.guide.missions.hint: "Fキーでメニューを開き、「デイリー/クエスト」タイルをクリック。"
  tutorial.guide.missions.body: "ミッションを達成すると、GOLDなどの報酬がもらえます。\nFキーでメニューを開き、「デイリー/クエスト」タイルをクリックしてください。\n毎日の目標を見ておくと、次に何をすればよいか迷いません。"
  tutorial.guide.missions.bubble: "メニューで\nミッションを見よう"
  tutorial.guide.missions.next: "次のステップ: メニューでミッションを確認"
