# ADR-0242 guided lobby tutorial
  tutorial.guide.menu.title: "Your first steps"
  tutorial.guide.menu.subtitle: "Open the lobby menu with F"
  tutorial.guide.menu.hint: "Empty your hand or hold the compass, then press F. Skip: /astera tutorial skip"
  tutorial.guide.range.title: "Training range"
  tutorial.guide.range.subtitle: "Follow the marker to the east island"
  tutorial.guide.range.hint: "Close the menu and walk east across the bridge to the training range."
  tutorial.guide.rack.title: "Choose a weapon"
  tutorial.guide.rack.subtitle: "Take the Knight’s Sword from the rack"
  tutorial.guide.rack.hint: "Right-click the Knight’s Sword frame, then select the sword in your hotbar."
  tutorial.guide.primary.title: "Primary attack"
  tutorial.guide.primary.subtitle: "Hit a melee dummy with left-click"
  tutorial.guide.primary.hint: "Stand next to the marked melee dummy. Aim at it and left-click with the sword."
  tutorial.guide.secondary.title: "Secondary skill"
  tutorial.guide.secondary.subtitle: "Sneak + right-click with the sword"
  tutorial.guide.secondary.hint: "Face safe ground. Hold sneak and right-click to dash; skills spend energy."
  tutorial.guide.reload.title: "Reload a gun"
  tutorial.guide.reload.subtitle: "Take a pistol, right-click to fire, then press Q to reload"
  tutorial.guide.reload.hint: "Right-click the Pistol rack frame, select it, right-click to fire a shot, then press Q to reload. Wait for the reload to finish."
  tutorial.guide.hud.title: "Read your HUD"
  tutorial.guide.hud.subtitle: "Watch the food bar and skill icons for four seconds"
  tutorial.guide.hud.hint: "Food bar = energy, not hunger. Ammo icon = rounds; cooldown icons and the hotbar sweep show when skills are ready."
  tutorial.guide.staff.title: "Cast a spell"
  tutorial.guide.staff.subtitle: "Take the Fire Staff and right-click"
  tutorial.guide.staff.hint: "Right-click the Fire Staff frame on the rack, select it, then right-click to cast. Spells spend energy (the food bar)."
  tutorial.guide.norma.title: "How to win"
  tutorial.guide.norma.subtitle: "Clear Norma levels before the other team"
  tutorial.guide.norma.hint: "Grab stars from generators and kills, hit each level's goal (shown on the sidebar), and reach the top Norma level first."
  tutorial.guide.queue.title: "Ready to play"
  tutorial.guide.queue.subtitle: "Go to the Play gate by the spawn"
  tutorial.guide.queue.hint: "Walk to the glowing Play gate next to the spawn and right-click the Play guide, then pick a mode. Q on the compass opens the same picker."
  tutorial.guide.complete.title: "Training complete!"
  tutorial.guide.complete.subtitle: "Your first graduation earns 50 GOLD. Have fun!"
  tutorial.guide.status.paused: "Tutorial paused at step {step}. Resume with /astera tutorial start."
  tutorial.guide.status.completed: "Tutorial complete. Replay with /astera tutorial start (graduation reward is once only)."
  command.help.tutorial-skip: "Pause the tutorial; resume with tutorial start."

