  # Wave J 5server-content-ops (ADR-0127) — Server ops + news/changelog/login bonus.
  restart:
    command:
      root: "<gray>Schedule a graceful server restart in N minutes (admin only).</gray>"
    default-reason: "<gray>scheduled maintenance</gray>"
    error:
      out_of_range: "<red>Restart minutes must be {min}-{max} (got {minutes}).</red>"
    announcement:
      chat: "<yellow>The server will restart shortly for maintenance.</yellow>"
      title_30s: "<gold><bold>Restart in 30s</bold></gold>"
      title_10s: "<gold><bold>Restart in 10s</bold></gold>"
      title_3s: "<red><bold>Restart in 3s</bold></red>"
      title_1s: "<red><bold>Restart NOW</bold></red>"

  news:
    command:
      root: "<gray>Show the latest server news.</gray>"
    empty: "<gray>No news to report. Check back later.</gray>"
    header: "<gold><bold>Astera News</bold></gold>"
    footer: "<gray>— end of news ({count} shown). Use /astera patch for changelog. —</gray>"
    entry:
      title: "<yellow>[{severity}]</yellow> <bold>{title}</bold>"
      body: "<gray>{body}</gray>"
    welcome-to-phase-1:
      title: "Welcome to Astera Phase 1"
      body: "Phase 1 PoC is now playable. Combat, skills, matches, and crafting are live; expect rough edges and weekly resets."
    wave-6-incoming:
      title: "Wave 6 Paper Sweep Incoming"
      body: "The Bukkit/Paper rendering pass lands next week. Resource packs may flip; please re-download if textures look stale."

  patch:
    command:
      root: "<gray>Show release notes (latest by default, or pass a version).</gray>"
    header: "<gold><bold>Astera {version}</bold></gold> <gray>(released {released})</gray>"
    highlight: "<gray>* {text}</gray>"
    footer:
      latest: "<gray>Use /astera patch {version} to read the full notes.</gray>"
      full: "<white>{text}</white>"
    error:
      no_entries: "<red>No changelog entries are registered.</red>"
      invalid_version: "<red>Invalid version '{version}'. Expected MAJOR.MINOR.PATCH (e.g. 0.1.0).</red>"
      unknown_version: "<red>No changelog entry for version '{version}'.</red>"

  changelog:
    "0_1_0":
      highlight:
        "1": "First playable PvP match loop (start, score, end, reward)."
        "2": "Crafting recipes + quest chains + advancements landed."
        "3": "Admin ops commands + scheduled announcements + maintenance mode."
      full: "Phase 1 PoC release: see docs/vision/VISION.md for scope and per-area status."

  board:
    leaderboard:
      title: "§6§l== Season Ranking =="
      empty: "§7No ranked results yet."

  progress:
    daily:
      header: "<gold><bold>Daily login bonus</bold></gold>"
      status: "<gray>Streak:</gray> <white>{streak}</white> <gray>day(s), today pays day</gray> <white>{day}</white>"
      claimed: "<green>Today's bonus is already collected.</green>"
      unavailable: "<yellow>No bonus is configured for today.</yellow>"
      tomorrow: "<gray>Tomorrow:</gray> <yellow>{amount} {currency}</yellow>"
    missions:
      header: "<gold><bold>Missions</bold></gold>"
      none: "<gray>No missions are available.</gray>"
      line: "<gray>[{period}]</gray> <white>{name}</white> <yellow>{current}/{required}</yellow>"
      line-done: "<gray>[{period}]</gray> <green>{name} - done</green>"
    period:
      daily: "daily"
      weekly: "weekly"
      seasonal: "season"
    quests:
      header: "<gold><bold>Quests</bold></gold>"
