# English locale (fallback).
# See ja.yaml for key naming conventions and MiniMessage syntax.

astera:
  system:
    welcome: "Welcome to <gold><bold>Astera</bold></gold>, {player}!"
    plugin_enabled: "<green>Astera plugin enabled</green>"
    plugin_disabled: "<yellow>Disabling Astera plugin...</yellow>"

  command:
    give:
      success: "<green>Gave <gold>{item}</gold> to {player}</green>"
      not_found: "<red>Item id <gold>{item}</gold> not found</red>"
      usage: "<yellow>Usage: /astera-items give <player> <item-id></yellow>"
    player-only: "<red>This command can only be run by a player.</red>"
    reload:
      unknown_category: "<red>Unknown reload category. Use tab to see registered content types.</red>"
      load_failed: "<red>Reload aborted: one or more files failed to parse. Previous state preserved; check server log.</red>"

  # Wave _items-1 (ADR-0073): item / weapon content-specific i18n is now
  # inline in each content/items/<id>.yaml. The `weapon:` section is reduced
  # to cross-cutting chrome strings (on_cooldown / none_held / fired event)
  # and renamed `item:` per ADR-0073.
  item:
    fired: "<yellow>{player} used <gold>{item}</gold></yellow>"
    on_cooldown: "<red>{item} is on cooldown ({remaining})</red>"
    none_held: "<gray>No item equipped</gray>"

  permission:
    denied: "<red>You don't have permission: {permission}</red>"

  error:
    internal: "<red>An internal error occurred. Check server logs for details.</red>"
    permission: "<red>You do not have permission to run this command</red>"

  # Wave 5d — Cross-plugin ConfigError messageKeys (ADR-0033).
  # Promoted from astera.match.config.error.* so Core-side DTOs
  # (BlockDurabilityYamlConfig, future ParticleDefinitionYamlConfig)
  # share the same i18n surface as Match-side DTOs.
  config:
    error:
      unknown-enum-value: "<red>Configuration error: unknown {field} value '{value}'. Accepted: {accepted}.</red>"
      out-of-range: "<red>Configuration error: {field}='{value}' violates {constraint}.</red>"
      field-shape-mismatch: "<red>Configuration error in {field}: {detail}.</red>"
      invalid-identifier: "<red>Configuration error: {field}='{value}' is not a valid identifier ({constraint}).</red>"
      schematic:
        not-found: "<red>Schematic file not found: {path}.</red>"
        invalid-version: "<red>Unsupported schematic version {version} at {path}.</red>"

  # Wave 4 R3 — Declarative GUI demo (ADR-0021) + Wave 4.5 bindings (ADR-0027).
  gui:
    loadout:
      title: "Loadout"
    personal_vault:
      title: "Personal Vault"
    button:
      close: "Close"
    binding:
      unknown: "<red>Unknown binding: {binding}</red>"
      unavailable: "<gray>(binding data not available)</gray>"
      resolved_to_barrier: "<red>Binding resolution failed (placeholder).</red>"

  weapons:
    command:
      # Two-arity bug guard: `gui` is both a leaf (root subcommand
      # description) and a parent prefix (`gui.loadout`). YAML doesn't allow
      # a scalar AND a map under the same key, so the deeper entry is written
      # as a dotted-string key — LanguageLoader takes keyNode.content
      # verbatim, so this still flattens to the expected
      # `astera.weapons.command.gui.loadout` lookup key.
      gui: "GUI commands"
      "gui.loadout": "Open the loadout GUI"
      "gui.loadout.player_not_online": "<red>You must be online to open this GUI.</red>"
      "gui.loadout.not_found": "<red>Loadout GUI is not registered.</red>"
      "gui.loadout.open_rejected": "<red>Could not open the loadout GUI.</red>"
    loadout:
      toggle:
        ok: "Loadout updated."

  # ── Wave 4.5 (ADR-0027): Shop / Loadout persist / Norma / Match / Spawn ──
  economy:
    shop:
      example-shop:
        title: "Example Shop"
        offer:
          sword: "Example Sword"
          pistol: "Example Pistol"
          wand: "Example Wand"
      browse:
        invalid_id: "<red>Invalid shop id: {shop}</red>"
        player_not_online: "<red>You must be online to browse the shop.</red>"
        not_found: "<red>Shop not found: {shop}</red>"
        open_rejected: "<red>Could not open shop GUI.</red>"
      purchase:
        success: "<green>Purchased <gold>{offer}</gold> for {price} {currency}.</green>"
        failure_generic: "<red>Purchase failed.</red>"
        player_not_online: "<red>You must be online to purchase.</red>"
        shop_not_found: "<red>Shop disappeared during purchase.</red>"
        offer_not_found: "<red>That offer no longer exists.</red>"
        out_of_stock: "<red>Sold out.</red>"
        insufficient_funds: "<red>Insufficient {currency} balance.</red>"
        delivery_failed: "<red>Could not deliver item: {reason}</red>"
    command:
      shop:
        root: "Shop commands"
        browse: "Browse a shop by id"
    # Wave 5f (ADR-0035, RTM #12/#19): marketplace + JP currency policy.
    policy:
      error:
        transfer_blocked: "<red>This currency is non-transferable (JP 資金決済法 compliance).</red>"
        cap_exceeded: "<red>Issuance cap exceeded — please try again later.</red>"
        redeem_blocked: "<red>This currency cannot be redeemed for cash.</red>"
        expired: "<red>That balance expired before this transaction.</red>"
    marketplace:
      error:
        not_found: "<red>Listing not found.</red>"
        not_active: "<red>That listing is no longer active.</red>"
        self_purchase: "<red>You cannot purchase your own listing.</red>"
        insufficient_funds: "<red>Insufficient {currency} balance.</red>"
        unknown_item: "<red>Unknown item: {item}</red>"
        invalid_price: "<red>Listing price must be positive.</red>"
        not_seller: "<red>You are not the seller of this listing.</red>"
      listing:
        title: "<gold>Marketplace listing</gold>"
        sold: "<gray>SOLD</gray>"
        expired: "<gray>EXPIRED</gray>"

  # Wave 5f (ADR-0035): GUI reactive numeric bindings + Particle definitions.
  gui_binding:
    coins:
      value: "<gold>{amount} {currency}</gold>"
    kills:
      value: "<aqua>{amount}</aqua>"

  particle:
    example-burst:
      name: "<red>Ember burst</red>"
    example-ring:
      name: "<aqua>Frost ring</aqua>"

  loadout:
    save:
      success: "<green>Loadout slot <gold>{slot}</gold> saved.</green>"
      failed: "<red>Failed to save loadout: {reason}</red>"
    fetch:
      success: "<green>Loadout loaded.</green>"
      empty: "<gray>No loadout configured.</gray>"
    slot:
      main: "Main"
      sub: "Sub"
      move: "Movement"
      special: "Special"
      armor: "Armor"
      ultimate: "Ultimate"
    cleared: "<gray>Slot {slot} cleared.</gray>"
    apply:
      on_match_start: "<gray>Loadout applied for the match.</gray>"

  norma:
    progress:
      updated: "<gray>{norma}: {current}/{target}</gray>"
    completed: "<green>Mission complete: <gold>{norma}</gold>!</green>"
    reward:
      delivered: "<green>Reward: +{amount} {currency} (+{xp} XP)</green>"
    period:
      new_started: "<gray>A new {period} period has begun.</gray>"

  match:
    phase:
      countdown_start: "<yellow>Match starting in {seconds}s…</yellow>"
      active_started: "<green>The match has started!</green>"
      sudden_death: "<gold>Sudden death!</gold>"
    victory: "<green>Victory! Team {team} wins.</green>"
    defeat: "<red>Defeat. Team {team} wins.</red>"
    draw: "<gray>The match ended in a draw.</gray>"
    score:
      threshold_reached: "<gold>{team} has reached the score threshold.</gold>"
    no_winning_team: "<gray>No clear winner.</gray>"
    spawn:
      error:
        match-not-found: "<red>Match not found for spawn.</red>"
        stage-not-found: "<red>Stage not found for match.</red>"
        no-spawn-for-kind: "<red>No spawn point of the requested kind.</red>"
        teleport-failed: "<red>Teleport failed.</red>"
    # Wave 5n — Per-match config overlay errors (ADR-0080)
    config:
      unknown_match: "<red>Match config: unknown match '{matchId}'.</red>"
      unknown_world: "<red>Match config: unknown world '{worldId}'.</red>"
    # Wave 5c — game mode display strings (ADR-0032)
    mode:
      battle-loyal:
        name: "<gold>Battle Loyal</gold>"
        description: "<gray>Small-scale free-for-all arena. Score the most kills to win.</gray>"
      break-core:
        name: "<gold>Break Core</gold>"
        description: "<gray>Destroy the enemy team's core block to win.</gray>"
      carry-tnt:
        name: "<gold>Carry TNT</gold>"
        description: "<gray>Carry TNT to the enemy base. First team to {wins} deliveries wins.</gray>"
      carry-mini-tnt:
        name: "<gold>Carry Mini TNT</gold>"
        description: "<gray>Collect {count} mini-TNT pieces, then deliver to the enemy base.</gray>"
      capture-wool:
        name: "<gold>Capture Wool</gold>"
        description: "<gray>Hold control regions to capture them. First team to capture {wins} wins.</gray>"
      steal-jewelry:
        name: "<gold>Steal Jewelry</gold>"
        description: "<gray>Steal enemy gems back to your deposit. Steal them all to win.</gray>"
    # Wave 5d — Barrier domain (ADR-0033, RTM issue #8)
    barrier:
      created: "<aqua>Barrier deployed at {position} by {player}.</aqua>"
      destroyed: "<red>Barrier {barrier} has been destroyed.</red>"
      error:
        empty-region: "<red>Cannot create a barrier with an empty region.</red>"
        invalid-slowdown: "<red>Barrier slowdown must be between 0% and 100% (was {value}).</red>"
        not-found: "<red>Barrier {barrier} not found.</red>"
    # Wave 5d — Capture zone / KOTH (ADR-0033)
    zone:
      captured: "<green>{team} captured zone {zone}.</green>"
      contested: "<yellow>Zone {zone} is contested.</yellow>"
    # Wave 5d — Per-match world (ADR-0033)
    world:
      created: "<gray>Match world {world} ready.</gray>"
      create-failed: "<red>Failed to create match world: {detail}.</red>"
      destroyed: "<gray>Match world {world} torn down.</gray>"
    # Wave 5d — Block tracking (ADR-0033)
    block:
      restored-on-match-end: "<gray>{count} block change(s) restored at match end.</gray>"

  spawn:
    teleporting: "<gray>Teleporting to spawn…</gray>"
    no_spawn_defined: "<red>No spawn point defined for this stage.</red>"
    spectator: "<gray>Entering spectator spawn.</gray>"
    lobby: "<gray>Returning to lobby.</gray>"

  armor:
    # Wave 4.5 placeholder. Real armor domain lands in Phase 3 (Wave 6).
    unequipped: "<gray>No armor equipped.</gray>"
    slot:
      helmet: "Helmet"
      chestplate: "Chestplate"
      leggings: "Leggings"
      boots: "Boots"
    example-helmet:
      name: "<gray>Example Helmet</gray>"
      lore: "<dark_gray>slot: helmet / reduction: 10%</dark_gray>"
    example-chestplate:
      name: "<gray>Example Chestplate</gray>"
      lore: "<dark_gray>slot: chestplate / reduction: 25%</dark_gray>"

  combat:
    damage:
      mitigated_by_armor: "<gray>(-{amount} from armor)</gray>"
      critical: "<red><bold>CRITICAL!</bold></red>"
      friendly_fire_blocked: "<yellow>Friendly fire blocked.</yellow>"
    mana:
      insufficient: "<red>Insufficient mana ({have}/{tried}).</red>"
      consumed: "<aqua>-{amount} mana</aqua>"
    skill:
      charge:
        started: "<yellow>Charging {skill}…</yellow>"
        cancelled: "<gray>Charge cancelled.</gray>"
    # Wave 5f (ADR-0035, RTM #21): CEL skill expressions.
    cel:
      error:
        not_yet_implemented: "<gray>(CEL evaluator not yet available — Phase 6.)</gray>"
        parse: "<red>CEL parse error: {message}</red>"
        eval: "<red>CEL evaluation error: {message}</red>"
        attribute_lookup: "<red>CEL attribute lookup failed: {path}</red>"

  # Wave 5c — Star Generator tier display strings (ADR-0032)
  generator:
    tier:
      iron:
        name: "<white>Iron Generator</white>"
      gold:
        name: "<yellow>Gold Generator</yellow>"
      emerald:
        name: "<green>Emerald Generator</green>"
      diamond:
        name: "<aqua>Diamond Generator</aqua>"
    spawned: "<gold>+{amount} {currency}</gold>"

  # Wave 5c — Anomaly display strings (ADR-0032)
  anomaly:
    resource_spike:
      name: "<gold>Resource Spike</gold>"
      description: "<gray>Generator output is amplified for a short window.</gray>"
    status_burst:
      name: "<gold>Status Burst</gold>"
      description: "<gray>Status effects hit harder for a short window.</gray>"
    spawn_surge:
      name: "<gold>Spawn Surge</gold>"
      description: "<gray>Respawn rate is accelerated.</gray>"
    time_warp:
      name: "<gold>Time Warp</gold>"
      description: "<gray>Match timer pace is altered.</gray>"
    gravity_shift:
      name: "<gold>Gravity Shift</gold>"
      description: "<gray>Movement physics shift.</gray>"
    fog_of_war:
      name: "<gold>Fog of War</gold>"
      description: "<gray>Visibility is reduced.</gray>"

  # Wave 5b HUD reference design (ADR-0031). Keys are reserved here so
  # Wave 6 Paper impls have a localised string ready when widgets are wired.
  hud:
    bossbar:
      match:
        phase: "<gold>Phase:</gold> <white>{phase}</white>"
        time_remaining: "<gold>Time:</gold> <white>{time}</white>"
    scoreboard:
      match:
        title: "<gold><bold>Match</bold></gold>"
    actionbar:
      objective: "<yellow>Objective: {objective}</yellow>"
    title:
      match_start: "<gold><bold>MATCH START</bold></gold>"
      match_end: "<red><bold>MATCH END</bold></red>"

  # Wave 5e — Tutorial display strings (ADR-0034). Renders via `astera.tutorial.*`
  # MessageKey calls in `TutorialContents` + `content/tutorials/*.yaml`.
  # Wave 6a wires the Paper-side `TutorialStepEntered` listener that renders.
  tutorial:
    getting_started:
      title: "<gold>Getting Started</gold>"
    welcome: "<aqua>Welcome to Astera! Let's get you set up.</aqua>"
    complete: "<green>Tutorial complete. Have fun!</green>"

  # Wave 5e — Achievement default names + descriptions (ADR-0034).
  # Worker γ exposes 8 milestone achievement IDs; admin-registered catalog
  # consumes these `MessageKey` refs in Wave 5e. Wave 6a wires UI surfacing.
  stats:
    achievement:
      kills-10:
        name: "<gold>First Blood</gold>"
        description: "<gray>10 kills.</gray>"
      kills-50:
        name: "<gold>Slayer</gold>"
        description: "<gray>50 kills.</gray>"
      kills-100:
        name: "<gold>Legend</gold>"
        description: "<gray>100 kills.</gray>"
