  # WP12: personal vault (= ender chest), /vault + vanilla ender chest block.
  vault:
    title: "Personal Vault"
    blocked-in-match: "<red>The vault cannot be opened during a match.</red>"
    unavailable: "<red>Could not open your vault.</red>"

  # Wave _items-1 (ADR-0073): item / weapon content-specific i18n is now
  # inline in each content/items/<id>.yaml. The `weapon:` section is reduced
  # to cross-cutting chrome strings (on_cooldown / none_held / fired event)
  # and renamed `item:` per ADR-0073.
  item:
    fired: "<yellow>{player} used <gold>{item}</gold></yellow>"
    on_cooldown: "<red>{item} is on cooldown ({remaining})</red>"
    none_held: "<gray>No item equipped</gray>"

  permission:
    denied: "<red>You don't have permission: {permission}</red>"

  error:
    internal: "<red>An internal error occurred. Check server logs for details.</red>"
    permission: "<red>You do not have permission to run this command</red>"

  # Wave 5d — Cross-plugin ConfigError messageKeys (ADR-0033).
  # Promoted from astera.match.config.error.* so Core-side DTOs
  # (BlockDurabilityYamlConfig, future ParticleDefinitionYamlConfig)
  # share the same i18n surface as Match-side DTOs.
  config:
    error:
      unknown-enum-value: "<red>Configuration error: unknown {field} value '{value}'. Accepted: {accepted}.</red>"
      out-of-range: "<red>Configuration error: {field}='{value}' violates {constraint}.</red>"
      field-shape-mismatch: "<red>Configuration error in {field}: {detail}.</red>"
      invalid-identifier: "<red>Configuration error: {field}='{value}' is not a valid identifier ({constraint}).</red>"
      schematic:
        not-found: "<red>Schematic file not found: {path}.</red>"
        invalid-version: "<red>Unsupported schematic version {version} at {path}.</red>"

