# Breakable wooden cover (content/blocks/barricade.yaml): a low planked barrier with two firing gaps on top.
# The block state is the custom block's reserved visual state (ADR-0300); a plain vanilla material would not be cover.
id: cover-barricade
boxes:
  - { min: [-3, 1, 0], max: [3, 1, 0], block: "minecraft:note_block[instrument=harp,note=1,powered=false]" }
  - { min: [-3, 2, 0], max: [-2, 2, 0], block: "minecraft:note_block[instrument=harp,note=1,powered=false]" }
  - { min: [0, 2, 0], max: [0, 2, 0], block: "minecraft:note_block[instrument=harp,note=1,powered=false]" }
  - { min: [2, 2, 0], max: [3, 2, 0], block: "minecraft:note_block[instrument=harp,note=1,powered=false]" }
