# Breakable soil cover (content/blocks/sandbags.yaml): a sandbag horseshoe, open to the back (+z).
# packed_mud is the block's identity (its base material) - the shovel is the right tool.
id: cover-sandbags
boxes:
  - { min: [-2, 1, 0], max: [2, 1, 0], block: "minecraft:packed_mud" }
  - { min: [-1, 2, 0], max: [1, 2, 0], block: "minecraft:packed_mud" }
  - { min: [-2, 1, 1], max: [-2, 1, 1], block: "minecraft:packed_mud" }
  - { min: [2, 1, 1], max: [2, 1, 1], block: "minecraft:packed_mud" }
