  - { min: [-2, 1, 1], max: [-2, 1, 1], block: "minecraft:note_block[instrument=harp,note=6,powered=false]" }
  - { min: [2, 1, 1], max: [2, 1, 1], block: "minecraft:note_block[instrument=harp,note=6,powered=false]" }
