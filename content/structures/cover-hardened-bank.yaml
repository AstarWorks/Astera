# Tough earth bank (content/blocks/hardened-soil.yaml): wants a pickaxe, the shovel only scratches it.
# rooted_dirt is the block's identity (its base material).
id: cover-hardened-bank
boxes:
  - { min: [-2, 1, 0], max: [2, 1, 1], block: "minecraft:rooted_dirt" }
  - { min: [-1, 2, 0], max: [1, 2, 0], block: "minecraft:rooted_dirt" }
