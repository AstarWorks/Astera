# One table for every game moment (FX-05). Code names a moment (PresentationMoments), never a raw sound,
# title or particle; this file decides what the player sees and hears.
#
#   cue           sound cue id played to the subject (content/sounds/**, ADR-0267)
#   audience_cue  cue played to bystanders / the match (optional)
#   title/subtitle  i18n keys shown as a title to the subject (optional)
#   action_bar    i18n key shown on the action bar; {name} is filled from the play args (optional)
#   particle      id of a preset below, shown per viewer and filtered by that viewer's particle-visibility setting
#   chain_*       consecutive plays within chain_window_ms rise chain_pitch_semitones each (up to chain_max_steps)
#
# Not here: the countdown / death / result titles (HUD subtitle layouts, ADR-0206) and chat lines. Their sounds are.
# Every moment in PresentationMoments.ALL must have a row (PresentationCueCoverageScenarioTest).

particles:
  star-pop:        { particle: END_ROD,           count: 16,  spread: [0.15, 0.5, 0.15],  speed: 0.06, y_offset: 0.6 }
  star-pickup:     { particle: FIREWORK,          count: 14,  spread: [0.25, 0.4, 0.25],  speed: 0.08, y_offset: 1.0 }
  star-burst:      { particle: END_ROD,           count: 160, spread: [0.2, 0.2, 0.2],    speed: 0.55, y_offset: 1.0 }
  star-burst-gain: { particle: FIREWORK,          count: 40,  spread: [0.6, 0.7, 0.6],    speed: 0.2,  y_offset: 1.0 }
  # Fountain layers (the kill scatter): gold dust and firework sparks over the END_ROD flash.
  star-burst-gold: { particle: WAX_ON,            count: 120, spread: [0.9, 0.5, 0.9],    speed: 1.2,  y_offset: 0.8 }
  star-burst-spark: { particle: FIREWORK,         count: 90,  spread: [0.3, 0.9, 0.3],    speed: 0.45, y_offset: 1.2 }
  norma-level-up:  { particle: TOTEM_OF_UNDYING,  count: 40,  spread: [0.5, 0.8, 0.5],    speed: 0.3,  y_offset: 0.0 }
  norma-level-max: { particle: TOTEM_OF_UNDYING,  count: 120, spread: [0.8, 1.0, 0.8],    speed: 0.5,  y_offset: 0.0 }
  death-soul:      { particle: SOUL,              count: 28,  spread: [0.3, 0.6, 0.3],    speed: 0.06, y_offset: 0.9 }
  respawn-glint:   { particle: END_ROD,           count: 36,  spread: [0.35, 0.9, 0.35],  speed: 0.1,  y_offset: 0.1 }
  player-level-up: { particle: FIREWORK,          count: 30,  spread: [0.5, 0.7, 0.5],    speed: 0.2,  y_offset: 0.5 }

moments:
  countdown-tick:
    cue: "astera:match/countdown-tick"
  countdown-go:
    cue: "astera:match/go"
  kill:
    cue: "astera:combat/kill"
  # death: souls rise from the victim's spot (the killer and nearby viewers see them too); respawn: a rising glint at the
  # spawn point plus a short "back in" line, so the player notices the moment control returns.
  death:
    cue: "astera:match/death"
    particle: death-soul
  respawn:
    cue: "astera:match/respawn"
    action_bar: "astera.presentation.respawn"
    particle: respawn-glint
  # hit: rapid hits climb a half-semitone each (max 4 steps = 2 semitones, 700 ms window) so sustained fire reads as a streak.
  hit:
    cue: "astera:combat/hit"
    chain_window_ms: 700
    chain_pitch_semitones: 0.5
    chain_max_steps: 4
  crit:
    cue: "astera:combat/crit"
  blocked:
    cue: "astera:combat/blocked"
  skill-ready:
    cue: "astera:combat/skill-ready"
  ego-ready:
    cue: "astera:combat/ego-ready"

  # Stars (FX-04). pop = a star appears at a generator (heard and seen nearby); pickup = "+N" with a chime that
  # climbs a semitone-and-a-half per consecutive pickup; burst = the victim's stars fly out (victim feels the loss,
  # the killer sees the haul, bystanders hear it).
  star-pop:
    cue: "astera:star/pop"
    particle: star-pop
  star-pickup:
    cue: "astera:star/pickup"
    action_bar: "astera.match.star.collected"
    particle: star-pickup
    chain_window_ms: 2500
    chain_pitch_semitones: 1.5
    chain_max_steps: 8
  star-burst:
    cue: "astera:star/burst"
    audience_cue: "astera:star/burst"
    action_bar: "astera.presentation.star-burst.victim"
    particle: star-burst
  star-burst-killer:
    cue: "astera:star/burst-gain"
    action_bar: "astera.presentation.star-burst.killer"
    particle: star-burst-gain
  # The fountain's extra layers (played with the same audience as star-burst): a launch thump + sparkle cascade under
  # the burst cue, gold dust, firework sparks. No action bar here (star-burst owns it).
  star-burst-gold:
    cue: "astera:star/burst-boom"
    audience_cue: "astera:star/burst-boom"
    particle: star-burst-gold
  star-burst-spark:
    particle: star-burst-spark

  norma-level-up:
    cue: "astera:norma/level-up"
    audience_cue: "astera:norma/burst"
    title: "astera.match.norma-up.title"
    subtitle: "astera.match.norma-up.subtitle"
    title_stay_ticks: 50
    particle: norma-level-up
  norma-level-max:
    cue: "astera:norma/level-max"
    audience_cue: "astera:norma/burst-max"
    title: "astera.match.norma-up.max.title"
    subtitle: "astera.match.norma-up.max.subtitle"
    title_stay_ticks: 80
    particle: norma-level-max
  norma-choice-open:
    # Sound only: the picker GUI opens in the same tick and covers any title (the GUI's own title and lore say what to do).
    cue: "astera:norma/choice-open"
  norma-choice-picked:
    cue: "astera:norma/choice-picked"
    action_bar: "astera.match.norma-choice.picked.{kind}"
  norma-choice-defaulted:
    cue: "astera:norma/choice-defaulted"
    action_bar: "astera.match.norma-choice.defaulted.{kind}"

  # carry-mini-tnt: a team's pool reached the combine size and the pieces fused into one real TNT (title for the team, cue for all).
  mini-tnt-combined:
    cue: "astera:norma/level-up"
    audience_cue: "astera:norma/burst"
    title: "astera.gamemode.carry-mini-tnt.combined.title"
    subtitle: "astera.gamemode.carry-mini-tnt.combined.subtitle"
    title_stay_ticks: 60
    particle: norma-level-up

  # Queue: a short confirmation when queued; "match found" (title + sting) for everyone in the formed roster.
  queue-join:
    cue: "astera:ui/queue-join"
  match-found:
    cue: "astera:match/found"
    title: "astera.presentation.match-found.title"
    subtitle: "astera.presentation.match-found.subtitle"
    title_stay_ticks: 40

  # The match enters its final stretch (a team reached the score threshold): warning sting + title for everyone.
  sudden-death:
    cue: "astera:match/sudden-death"
    title: "astera.presentation.sudden-death.title"
    subtitle: "astera.presentation.sudden-death.subtitle"
    title_stay_ticks: 50

  match-win:
    cue: "astera:match/win"
  match-lose:
    cue: "astera:match/lose"
  match-draw:
    cue: "astera:match/draw"

  reward-login:
    cue: "astera:ui/login-bonus"
  purchase:
    cue: "astera:ui/purchase"
  quest-complete:
    cue: "astera:ui/quest-complete"
  player-level-up:
    cue: "astera:ui/level-up"
    particle: player-level-up

  # FX-10: menu feedback. Click is played centrally by the GUI intent router for every button;
  # settings buttons play confirm instead. Handlers play confirm (success) / deny (refusal).
  ui-click:
    cue: "astera:ui/click"
  ui-confirm:
    cue: "astera:ui/confirm"
  ui-deny:
    cue: "astera:ui/deny"
