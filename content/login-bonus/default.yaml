# Daily login-bonus rotation (ADR-0127; claim flow ADR-0199).
#
# A player's first login of the (server-local) day pays the reward of their streak day; logging in
# on consecutive days grows the streak, missing a day restarts it at day 1. When the streak is
# longer than the last day listed here the rotation wraps (day 8 pays day 1 again).
# `items` is carried in the claim but nothing delivers it yet - ship currency-only rewards.
# Edit and run `/astera admin reload login-bonus` to apply.

days:
  - day: 1
    reward:
      currency: STAR
      amount: 10
  - day: 2
    reward:
      currency: STAR
      amount: 15
  - day: 3
    reward:
      currency: STAR
      amount: 20
  - day: 4
    reward:
      currency: STAR
      amount: 30
  - day: 5
    reward:
      currency: STAR
      amount: 45
  - day: 6
    reward:
      currency: STAR
      amount: 65
  - day: 7
    reward:
      currency: GOLD
      amount: 25
