# Carry Mini TNT (Clam Blitz / ガチアサリ). Players collect minis ("clams"), make a power TNT and break the enemy basket.
#
# Minis sit on the stage's `clam-<n>` spots (they regrow after `respawn_seconds`); a player carries up to `carry_limit`.
# When the clams in a team's hands add up to `power_need`, the collector gets a power TNT. Every enemy `basket-<team>`
# has a barrier that only a thrown-in power TNT breaks (hold the basket with it): the throw counts `count_per_power`
# and the barrier stays open `barrier_open_seconds`; while it is open, carried minis planted there count
# `count_per_mini` each. A carrier who dies scatters what they carried into up to `scatter_piles` piles.
# Overtime runs while the trailing team holds a power TNT. Implementation: CarryMiniTntGameMode (SiegeGameMode).

id: carry-mini-tnt
title_key: astera.gamemode.carry-mini-tnt.title
impl_class: com.astarworks.astera.match.application.gamemode.CarryMiniTntGameMode
default_config:
  # Norma layer (content/norma-layer/layer.yaml) overrides: objective rounds on the big islands take long, so the time limit is 15 minutes. At the limit the teams are ranked by this mode's objective first, then stars carried, kills.
  time_limit_seconds: "900"
  # F3-5 death / respawn (seconds): death-screen countdown, killer death-cam length, post-respawn invulnerability (ends on attack).
  respawn_delay_seconds: "5"
  death_cam_seconds: "2"
  spawn_protection_seconds: "3"
  # Count model (Splatoon-style, SiegeGameMode): every team starts at count_start; each objective event takes its count_per_* off the scorer's
  # count. 0 = knockout win; at the time limit the lower count wins. count_low_at = "close to knockout" announcement. At the time limit
  # the match runs on up to overtime_max_seconds while the trailing team holds / carries the objective.
  count_start: "100"
  count_low_at: "34"
  overtime_max_seconds: "60"
  # Count values: a thrown-in power TNT and a planted mini (the scorer's count falls by this much).
  count_per_power: "20"
  count_per_mini: "3"
  carry_limit: "8"
  power_need: "10"
  power_carry_weight: "3"
  respawn_seconds: "20"
  barrier_open_seconds: "10"
  scatter_piles: "6"
  scatter_radius: "2"
  # Objective feel (ObjectiveKit): hold time at a pickup / goal in ticks, how long a dropped objective lies before it
  # goes home (seconds), reach of a pile pickup (blocks), distance at which defenders get a gate warning (blocks).
  channel_ticks: "15"
  drop_return_seconds: "20"
  pickup_radius: "3"
  warn_distance: "24"
  carrier_slow_pct_per_item: "8"
  carrier_min_speed_pct: "60"
