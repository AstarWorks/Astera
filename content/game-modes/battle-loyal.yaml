# Battle Loyal (WP11, siege mode).
#
# Team deathmatch on any stage: every kill of an enemy player scores a point
# for the killer's team (shown on the sidebar). First team to `score_threshold`
# points wins. Implementation: BattleLoyalGameMode.
#
# default_config
#   score_threshold  kills needed to win
id: battle-loyal
title_key: astera.gamemode.battle-loyal.title
impl_class: com.astarworks.astera.match.application.gamemode.BattleLoyalGameMode
tick_period_ticks: 20
default_config:
  # Norma layer (content/norma-layer/layer.yaml): the kill goal below is the mode's objective; the layer's defaults
  # (time limit 600 s) apply, ranking by kills first at the limit.
  # F3-5 death / respawn (seconds): death-screen countdown, killer death-cam length, post-respawn invulnerability (ends on attack).
  respawn_delay_seconds: "5"
  death_cam_seconds: "2"
  spawn_protection_seconds: "3"
  score_threshold: "5"
