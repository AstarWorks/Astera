# Steal Jewelry (WP11, siege mode).
#
# Each team keeps `gems_per_team` jewels on its pedestal (stage region
# `jewelry-<team>`). Walk into an enemy pedestal zone to take a jewel, walk
# into your own `base-<team>` zone to bank what you carry. A carrier who dies
# returns the jewels. A team wins by banking every enemy jewel.
# Implementation: StealJewelryGameMode.
#
# default_config
#   gems_per_team  jewels on each pedestal
id: steal-jewelry
title_key: astera.gamemode.steal-jewelry.title
impl_class: com.astarworks.astera.match.application.gamemode.StealJewelryGameMode
tick_period_ticks: 20
default_config:
  gems_per_team: "2"
