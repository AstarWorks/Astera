# Steal Jewelry (WP11, siege mode).
#
# Each team keeps `gems_per_team` jewels on its pedestal (stage region
# `jewelry-<team>`). Walk into an enemy pedestal zone to take a jewel, walk
# into your own `base-<team>` zone to bank what you carry. A carrier who dies
# returns the jewels. A team wins by banking every enemy jewel.
# Implementation: StealJewelryGameMode.
#
# default_config
#   gems_per_team  jewels on each pedestal
id: steal-jewelry
title_key: astera.gamemode.steal-jewelry.title
impl_class: com.astarworks.astera.match.application.gamemode.StealJewelryGameMode
default_config:
  # Norma layer (content/norma-layer/layer.yaml) overrides: objective rounds on the big islands take long, so the time limit is 20 minutes. At the limit the teams are ranked by this mode's objective first, then stars carried, kills.
  time_limit_seconds: "1200"
  # F3-5 death / respawn (seconds): death-screen countdown, killer death-cam length, post-respawn invulnerability (ends on attack).
  respawn_delay_seconds: "5"
  death_cam_seconds: "2"
  spawn_protection_seconds: "3"
  gems_per_team: "2"
  # Objective feel (ObjectiveKit): hold time at a pickup / goal in ticks, how long a dropped objective lies before it
  # goes home (seconds), reach of a pile pickup (blocks), distance at which defenders get a gate warning (blocks).
  channel_ticks: "15"
  drop_return_seconds: "20"
  pickup_radius: "3"
  warn_distance: "24"
  carrier_slow_pct_per_item: "10"
  carrier_min_speed_pct: "60"
