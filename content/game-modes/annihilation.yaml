# Astera Annihilation — 3-pillar Nexus hybrid mode (ADR-0108, Wave 5annihilation).
#
# Astera's core-identity game mode (per `.claude/plans/idea-annihilation-vision.md`):
# 3 teams, 3 pillars per team (graceful degradation defensive Nexus), 銃/剣/魔法
# hybrid combat with per-class resource pools (Wave 5k Ammo / Energy),
# Wave 5combat-depth combo + focus-fire + target-lock integration.
#
# Lifecycle:
# Five phases (ADR-0319), ~28 min + at most 5 min sudden death for 12 players:
#   Phase 1 Build   (6 min): pillars BUILDING, immune; base ores open, the Mid is closed (content/ore-nodes phase_gates).
#   Phase 2 Engage  (8 min): Tier 1 pillars VULNERABLE; Mid outer ring (gold, diamond) opens.
#   Phase 3 Center  (8 min): Tier 2 + 3 pillars VULNERABLE; Mid core (emerald) opens. Killing Tier 3 eliminates the team.
#   Phase 4 Escalation (6 min): pillar damage x escalation_damage_mult.
#   Phase 5 Sudden Death (<= 5 min): pillar damage x sudden_death_damage_mult + bleed (every bleed_interval_ticks each pillar
#     loses bleed_percent of its max HP, never below bleed_floor_percent); on expiry the HP tiebreak decides.
#
# Per-tier debuffs (applied when the owning team loses the pillar):
#   Tier 1 lost → respawn delay +2 sec.
#   Tier 2 lost → resource regen × 0.5 (Ammo / Energy).
#   Tier 3 lost → team eliminated.
#
# Tunables under `default_config` are parsed by AnnihilationYamlOverlay; see
# `plugin/match/.../config/gamemode/annihilation/AnnihilationYamlOverlay.kt`
# for the supported keys + defaults. Values use ticks (20 ticks = 1 sec).

id: annihilation
title_key: astera.gamemode.annihilation.title
impl_class: com.astarworks.astera.match.application.gamemode.annihilation.AnnihilationGameMode
tick_period_ticks: 10
default_config:
  # Particle of the holder-only compass trail (ADR-0319 navigation); drawn every 10 ticks toward the compass target.
  nav_trail_particle: "minecraft:end_rod"
  # Norma layer (content/norma-layer/layer.yaml): Annihilation runs its own phase clock and sudden death, so the layer's
  # time limit is off here.
  time_limit_seconds: "0"
  # F3-5 death / respawn (seconds): death-screen countdown, killer death-cam length, post-respawn invulnerability (ends on attack).
  respawn_delay_seconds: "5"
  death_cam_seconds: "2"
  spawn_protection_seconds: "3"
  # Pillar HP per tier. Pillars are mining-type blocks (tier 1 hard wood / axe, tier 2 hard dirt / shovel, tier 3 hard stone /
  # pickaxe; the matching tool is the stage pillar's `affinity`). Sizing, sustained numbers for ONE player:
  #   tool skill = break_area block_damage 100 x pillar_tool_skill_match_mult 3 = 300 per cast (iron fell/excavate ~5.5 s cooldown
  #   => ~55 dps; bore + shatter ~80 dps); matching-tool hand break 8 x 2 = 16 per break at ~2 breaks/s => ~32 dps.
  #   Tier 1 5000 = ~2.5 min, Tier 2/3 5600 = ~3 min of one player's sustained tool dps. Tuned from 3-run massPlay (2026-11-01): the
  #   first pillar falls between late Phase 2 and Phase 4 (was ~8 min with 3200); matches run to the 33 min clock.
  # A weapon hit counts pillar_weapon_mult 0.18: pistol ~118 dps raw = ~21 dps => Tier 1 ~150 s (about 4x slower than tools).
  # Damage falls off linearly from full at pillar_falloff_near blocks to 0 at pillar_falloff_far blocks (distance attacker -> pillar
  # centre), so a sniper cannot kill a pillar from afar.
  pillar_hp: "5000"
  pillar_hp_tier2: "5600"
  pillar_hp_tier3: "5600"
  pillar_break_damage: "8"
  pillar_hand_match_mult: "2.0"
  pillar_tool_skill_match_mult: "3.0"
  pillar_tool_skill_other_mult: "1.0"
  pillar_weapon_mult: "0.18"
  pillar_falloff_near: "8.0"
  pillar_falloff_far: "32.0"
  # Phase lengths in ticks (20 = 1 s): 6 / 8 / 8 / 6 min, then sudden death 5 min.
  build_phase_ticks: "7200"
  engage_phase_ticks: "9600"
  center_phase_ticks: "9600"
  escalation_phase_ticks: "7200"
  sudden_death_ticks: "6000"
  escalation_damage_mult: "1.5"
  sudden_death_damage_mult: "2.0"
  # Phase 5 bleed: 1% of max HP every 12 s => at most 25% of a pillar over a full 5 min (founder: bleed pressures, never decides);
  # floor 10% keeps a pillar standing; the HP tiebreak decides at expiry.
  bleed_interval_ticks: "240"
  bleed_percent: "1"
  bleed_floor_percent: "10"
  respawn_delay_seconds_tier1_lost: "2"
  resource_regen_mult_tier2_lost: "0.5"
