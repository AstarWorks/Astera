# Carry TNT (WP11, siege mode).
#
# One TNT sits in the stage's `tnt-spawn` zone. Walk into the zone to pick it
# up (only while nobody carries it), carry it into an enemy `base-<team>` zone
# to score a delivery. The carrier dying returns the TNT. First team to
# `deliveries_to_win` deliveries wins. Implementation: CarryTntGameMode.
#
# default_config
#   deliveries_to_win  deliveries needed to win
id: carry-tnt
title_key: astera.gamemode.carry-tnt.title
impl_class: com.astarworks.astera.match.application.gamemode.CarryTntGameMode
tick_period_ticks: 20
default_config:
  # Norma layer (content/norma-layer/layer.yaml) overrides: objective rounds on the big islands take longer than a
  # battle-loyal round, so the time limit is 20 minutes. At the limit the teams are ranked by this mode's objective first, then
  # Norma level, stars, kills. norma_win (default true) lets the top Norma level end the match too.
  time_limit_seconds: "1200"
  # F3-5 death / respawn (seconds): death-screen countdown, killer death-cam length, post-respawn invulnerability (ends on attack).
  respawn_delay_seconds: "5"
  death_cam_seconds: "2"
  spawn_protection_seconds: "3"
  deliveries_to_win: "2"
