# Carry TNT (WP11, siege mode).
#
# One TNT sits in the stage's `tnt-spawn` zone. Walk into the zone to pick it
# up once its shield is broken (only while nobody carries it), hold every
# `checkpoint-<team>-<n>` of the route, then hold the enemy `deliver-<team>`
# pedestal to score. A dropped TNT goes to the last checkpoint after
# `drop_return_seconds`. First team to `deliveries_to_win` deliveries wins. Implementation: CarryTntGameMode.
#
# default_config
#   deliveries_to_win  deliveries needed to win
id: carry-tnt
title_key: astera.gamemode.carry-tnt.title
impl_class: com.astarworks.astera.match.application.gamemode.CarryTntGameMode
default_config:
  # Norma layer (content/norma-layer/layer.yaml) overrides: objective rounds on the big islands take long, so the time limit is 20 minutes. At the limit the teams are ranked by this mode's objective first, then stars carried, kills.
  time_limit_seconds: "1200"
  # F3-5 death / respawn (seconds): death-screen countdown, killer death-cam length, post-respawn invulnerability (ends on attack).
  respawn_delay_seconds: "5"
  death_cam_seconds: "2"
  spawn_protection_seconds: "3"
  # Win condition + count model: 3 deliveries, each worth 34 count (3 x 34 > 100).
  deliveries_to_win: "3"
  count_per_delivery: "34"
  # TNT cycle: seconds before the TNT returns after a delivery (countdown at the pedestal), hold time (ticks) to
  # deliver at the enemy deliver-<team> pedestal and to secure each checkpoint-<team>-<n> on the way.
  respawn_after_delivery_seconds: "30"
  deliver_channel_ticks: "40"
  checkpoint_hold_ticks: "60"
  # Shield on the TNT: HP that must be broken before pickup, drain per second per player standing in tnt-spawn,
  # radius and percentage at which damage dealt near the pedestal also counts.
  shield_hp: "200"
  shield_drain_per_second: "10"
  shield_damage_radius: "6"
  shield_damage_pct: "100"
  # Objective feel (ObjectiveKit): hold time at a pickup / goal in ticks, how long a dropped objective lies before it
  # goes home (seconds), reach of a pile pickup (blocks), distance at which defenders get a gate warning (blocks).
  channel_ticks: "20"
  drop_return_seconds: "12"
  pickup_radius: "3"
  warn_distance: "24"
  # Carrier walk speed = 100 - slow_pct_per_item * pieces, never below min_speed_pct.
  carrier_slow_pct_per_item: "25"
  carrier_min_speed_pct: "60"
