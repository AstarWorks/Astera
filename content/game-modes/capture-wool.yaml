# Capture Wool (WP11, siege mode).
#
# The stage's central `wool-*` zones (one or two) are Splat Zones (ガチエリア): a 5x5 pad (concrete ring, wool core)
# under a tall beam. A team alone in a zone fills its progress ring (`capture_seconds` for a neutral zone,
# `recapture_seconds` for one an enemy holds) and the pad turns into its colour. While one team owns EVERY zone
# its count falls `count_per_second` each second; split ownership of two zones pauses both counts. A team that
# retakes a zone first burns `retake_penalty_pct` percent of the seconds the loser counted (at most
# `penalty_cap_seconds`). Overtime runs while the trailing team owns every zone.
# Implementation: CaptureWoolGameMode, ticked once per second.
id: capture-wool
title_key: astera.gamemode.capture-wool.title
impl_class: com.astarworks.astera.match.application.gamemode.CaptureWoolGameMode
default_config:
  # Norma layer (content/norma-layer/layer.yaml) overrides: objective rounds on the big islands take long, so the time limit is 15 minutes. At the limit the teams are ranked by this mode's objective first, then stars carried, kills.
  time_limit_seconds: "900"
  # F3-5 death / respawn (seconds): death-screen countdown, killer death-cam length, post-respawn invulnerability (ends on attack).
  respawn_delay_seconds: "5"
  death_cam_seconds: "2"
  spawn_protection_seconds: "3"
  # Count model (Splatoon-style, SiegeGameMode): every team starts at count_start; each objective event takes its count_per_* off the scorer's
  # count. 0 = knockout win; at the time limit the lower count wins. count_low_at = "close to knockout" announcement. At the time limit
  # the match runs on up to overtime_max_seconds while the trailing team holds / carries the objective.
  count_start: "100"
  count_low_at: "34"
  overtime_max_seconds: "60"
  capture_seconds: "10"
  recapture_seconds: "8"
  progress_decay_per_second: "1"
  count_per_second: "1"
  retake_penalty_pct: "50"
  penalty_cap_seconds: "20"
  floor_radius: "2"
  inner_radius: "1"
  beam_height: "20"
