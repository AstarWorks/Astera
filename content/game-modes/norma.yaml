# Norma — Astera's PoC control-objective game mode (ADR-0106, Wave 5gamemode).
#
# Wraps the Wave 5c pipeline (Star Generator + Anomaly + Sudden Death) under
# the IGameMode framework. The pipeline itself is wired globally in
# AsteraMatchPlugin; this YAML declares the mode so the framework registry
# can advertise "norma" to /astera match start, /astera queue join, and the
# HUD.
#
# Per Wave 5gamemode handoff: the framework foundation ships with one
# implementation; Phase 3 (Siege, Deathmatch, TDM, CTF) adds files alongside
# this one and Konsist forbids touching the pipeline's global wiring.

id: norma
title_key: astera.gamemode.norma.title
impl_class: com.astarworks.astera.match.application.gamemode.NormaGameMode
tick_period_ticks: 20
default_config:
  # Opts this mode into the Norma layer (stars, kill burst, Norma levels, time-limit ranking). Any mode can set it.
  norma_layer: "true"
  # F3-5 death / respawn (seconds): death-screen countdown, killer death-cam length, post-respawn invulnerability (ends on attack).
  respawn_delay_seconds: "5"
  death_cam_seconds: "2"
  spawn_protection_seconds: "3"
  # Time limit (seconds of ACTIVE time). The match is WON by reaching norma_max_level (below); when the clock runs out
  # the highest Norma level wins, then the most stars carried, then the most kills; still tied = draw.
  time_limit_seconds: "600"
  # Norma levels (docs/game-design/stars-and-norma.md, 100% Orange Juice style): every player starts at level 1 and
  # clears each level with ONE goal of their choice, `/astera norma choose star|kill` (STAR by default): carry
  # norma_stars_goal[level] stars (not consumed) or make norma_kills_goal[level] kills at that level. The first team
  # with a member at norma_max_level wins. Lists are indexed by the level being cleared.
  norma_max_level: "5"
  norma_stars_goal: "3,5,8,12"
  norma_kills_goal: "1,2,3,4"
  # Share of a victim's carried stars that bursts out on death (floor(carried * ratio)); 0..1.
  death_drop_ratio: "1.0"
