# Norma — Astera's PoC control-objective game mode (ADR-0106, Wave 5gamemode).
#
# Wraps the Wave 5c pipeline (Star Generator + Anomaly + Sudden Death) under
# the IGameMode framework. The pipeline itself is wired globally in
# AsteraMatchPlugin; this YAML declares the mode so the framework registry
# can advertise "norma" to /astera match start, /astera queue join, and the
# HUD.
#
# Per Wave 5gamemode handoff: the framework foundation ships with one
# implementation; Phase 3 (Siege, Deathmatch, TDM, CTF) adds files alongside
# this one and Konsist forbids touching the pipeline's global wiring.

id: norma
title_key: astera.gamemode.norma.title
impl_class: com.astarworks.astera.match.application.gamemode.NormaGameMode
tick_period_ticks: 20
default_config: {}
