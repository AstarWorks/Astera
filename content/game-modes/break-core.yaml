# Break Core (WP11, siege mode).
#
# Every team owns one core block (stage region `core-<team>`, a single block).
# Breaking an enemy core eliminates that team; the last team with an intact
# core wins. Implementation: BreakCoreGameMode (SiegeGameMode); the stage
# supplies the regions (content/stages/siege-isles.yaml), the lane is
# `break-core` in content/matchmaking/queue.yaml.
#
# default_config
#   core_block  material of the core block placed at match start
id: break-core
title_key: astera.gamemode.break-core.title
impl_class: com.astarworks.astera.match.application.gamemode.BreakCoreGameMode
tick_period_ticks: 20
default_config:
  # Norma layer (content/norma-layer/layer.yaml) overrides: objective rounds on the big islands take longer than a
  # battle-loyal round, so the time limit is 20 minutes. At the limit the teams are ranked by this mode's objective first, then
  # Norma level, stars, kills. norma_win (default true) lets the top Norma level end the match too.
  time_limit_seconds: "1200"
  # F3-5 death / respawn (seconds): death-screen countdown, killer death-cam length, post-respawn invulnerability (ends on attack).
  respawn_delay_seconds: "5"
  death_cam_seconds: "2"
  spawn_protection_seconds: "3"
  core_block: "minecraft:emerald_block"
