# Sound cue (ADR-0267). Astera OGG synthesized by tools/sound-gen/scripts/synth.sh (ffmpeg, no samples);
# the event is generated into assets/astera/sounds.json by :tools:resource-pack from this id + combat/kill.ogg.
# Vanilla layers added for punch (founder feedback 2026-10-27); the primary stays Astera's so the cue stays identifiable.
id: "astera:combat/kill"
resource_key: "astera:combat/kill"
default_volume: 0.8
default_pitch: 1.0
category: combat
layers:
  - resource_key: "minecraft:entity.player.levelup"
    volume: 0.6
    pitch: 1.5
  - resource_key: "minecraft:entity.experience_orb.pickup"
    volume: 0.6
    pitch: 0.8
  - resource_key: "minecraft:entity.player.attack.strong"
    volume: 0.7
    pitch: 0.6
