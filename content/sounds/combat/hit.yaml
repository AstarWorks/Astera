# Sound cue (ADR-0267). Astera OGG synthesized by tools/sound-gen/scripts/synth.sh (ffmpeg, no samples);
# the event is generated into assets/astera/sounds.json by :tools:resource-pack from this id + combat/hit.ogg.
# Vanilla layers added for punch (founder feedback 2026-10-27); the primary stays Astera's so the cue stays identifiable.
id: "astera:combat/hit"
resource_key: "astera:combat/hit"
default_volume: 0.5
default_pitch: 1.0
category: combat
layers:
  - resource_key: "minecraft:entity.player.attack.strong"
    volume: 0.6
    pitch: 1.1
  # Light high ding as the hitmarker body. Not entity.arrow.hit_player: ClientReceivesE2eTest asserts that vanilla marker is gone.
  - resource_key: "minecraft:entity.experience_orb.pickup"
    volume: 0.35
    pitch: 1.7
