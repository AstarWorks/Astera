# Phase 2 starter: PARALYSIS kind — action-disable, no scalar payload.
# The `disable` params variant carries no magnitude (the domain spec stores
# 0.0 — magnitude is ignored for action-disabling kinds per StatusKind docs).

id: example-paralysis

display_name_key: astera.status.example-paralysis.name

kind: paralysis
default_duration_ticks: 40    # 2s of locked-out actions @ 20 TPS

stackable: false
max_stacks: 1

params:
  type: disable
