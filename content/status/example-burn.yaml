# Phase 2 starter: BURN kind — periodic fire damage over time.
# `params.damage_per_tick` is read by the application-layer tick handler each
# tick the effect is active on a player; `default_duration_ticks` is the
# authoring hint that callers use when spawning the StatusEffectInstance.

id: example-burn

display_name_key: astera.status.example-burn.name

kind: burn
default_duration_ticks: 60   # 3s of fire-tick damage @ 20 TPS

stackable: true
max_stacks: 3

params:
  type: burn
  damage_per_tick: 1.5
