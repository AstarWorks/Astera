# Phase 2 starter: SPEED_UP kind — scalar move-speed multiplier.
# `params.multiplier` scales the entity's base move speed while the effect is
# active. 1.0 = unchanged; >1.0 = faster.

id: example-speed

display_name_key: astera.status.example-speed.name

kind: speed_up
default_duration_ticks: 100   # 5s @ 20 TPS

stackable: false
max_stacks: 1

params:
  type: speed
  multiplier: 1.4
