# Raster sources of item icons (ADR-0238). `./gradlew :tools:item-art:run` converts each listed item's
# source to its 32x32 icon under textures/generated/items; unlisted items stay drawn by code (ADR-0193/0223).
# Any tool may make a source — an AI sheet (tools/item-art/scripts/gen_sheet.py), Aseprite, a hand-drawn
# PNG — only the committed file counts. Per item: `name: <source>` or `{ from: <source>, colors: N, model: handheld|generated }`.

sources:
  # Codex image generation from tools/item-art/sheets/weapons-v1.yaml (one generation, 21 cells).
  weapons-v1:
    file: sheets/weapons-v1.png
    grid: [5, 5]
    cells: [bastion-greatsword, couture-rapier, crimson-chain-axe, dagger, edict-blade, ember-gauntlet, fire-staff, frost-staff, gossamer-katana, greatsword, knight-sword, orrery-staff, pistol, rifle, rtm-blaster, shotgun, sigil-rifle, thunder-staff, vendetta-rifle, verdant-staff, verdict-hammer]

