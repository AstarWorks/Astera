  # vfx-nodegraph-d sample block: 64px, 8 ticks, alpha-cutoff-safe silhouettes.
  sample-magic-circle:
    size: 64
    frames: 8
    colors: 6
    tags:
    - sample
    - magic
    graph:
      nodes:
        ring:
          type: shape.ring
          params:
            radius: 27
            thickness: 2
            color: '#7ecfff'
        star:
          type: shape.star
          params:
            points: 7
            step: 2
            radius: 22
            thickness: 2
            color: '#fff0b8'
        spoke:
          type: shape.line
          params:
            x0: 48
            y0: 32
            x1: 59
            y1: 32
            thickness: 2
            color: '#e9ffff'
        repeat:
          type: xform.repeat_radial
          params:
            count: 7
          inputs:
            image: spoke.image
        inside:
          type: composite.over
          inputs:
            a: star.image
            b: ring.image
        pattern:
          type: composite.over
          inputs:
            a: repeat.image
            b: inside.image
        rotation:
          type: anim.rotate
          params:
            speed_deg_per_sec: 150
          inputs:
            image: pattern.image
        out:
          type: output
          inputs:
            image: rotation.image
  sample-shock-ring:
    size: 64
    frames: 8
    colors: 6
    tags:
    - sample
    - impact
    graph:
      nodes:
        ring:
          type: shape.field
          params:
            variables:
              dx: x-16
              dy: y-16
              r: hypot(dx,dy)
              a: atan2(dy,dx)
            expression: max(0,1-abs(r-(3+10*ease(t)))/(1.8-1.1*t))*if(t>0.65,if(sin(a*12+i)>-0.1,1,0),1)
            color: '#87e3ff'
            smooth: false
        out:
          type: output
          inputs:
            image: ring.image
  sample-slash-arc:
    size: 64
    frames: 8
    colors: 6
    tags:
    - sample
    - slash
    graph:
      nodes:
        angle:
          type: anim.curve
          params:
            mode: once
            keyframes:
            - t: 0
              v: -100
            - t: 1
              v: 90
        arc:
          type: shape.arc
          params:
            radius: 23
            start_deg: 0
            end_deg: 125
            thickness: 5
            taper: 0.8
            color: '#e6f6ff'
        sweep:
          type: xform.rotate
          params:
            angle_deg:
              from: angle.value
          inputs:
            image: arc.image
        trail:
          type: filter.trail
          params:
            decay: 0.48
            mode: over
          inputs:
            image: sweep.image
        palette:
          type: filter.palette
          params:
            colors: 6
          inputs:
            image: trail.image
        out:
          type: output
          inputs:
            image: palette.image
  sample-spark-burst:
    size: 64
    frames: 8
    colors: 6
    tags:
    - sample
    - impact
    graph:
      nodes:
        rays:
          type: shape.field
          params:
            variables:
              dx: x-16
              dy: y-16
              r: hypot(dx,dy)
              a: atan2(dy,dx)
            expression: max(0,1-abs(sin(a*7+0.25))*r/1.5)*if(r>2+6*t,1,0)*if(r<6+8*ease(t),1,0)*(1-0.65*t)
            color: '#ffd26e'
            smooth: false
        out:
          type: output
          inputs:
            image: rays.image
  sample-smoke-puff:
    size: 64
    frames: 8
    colors: 6
    tags:
    - sample
    - ambient
    graph:
      nodes:
        puff:
          type: shape.field
          params:
            variables:
              dx: x-16
              dy: y-16
              r: hypot(dx,dy)
              a: atan2(dy,dx)
            expression: clamp((9+3*t-r+1.5*sin(a*5+i*0.35))/2,0,1)*clamp((r-(2+7*t))/2,0,1)*0.7
            color: '#a5a6c2'
            smooth: false
        out:
          type: output
          inputs:
            image: puff.image
  sample-flame:
    size: 64
    frames: 8
    colors: 6
    tags:
    - sample
    - fire
    graph:
      nodes:
        fire:
          type: shape.field
          params:
            variables:
              dx: x-16+sin((y-16)*0.32-i*0.9)*(26-y)/10
              dy: y-16
            expression: clamp((1-abs(dx)/(2.5+(dy+11)*0.32+sin(dy*0.8-i*0.9)))*if(dy>-11,1,0)*if(dy<11,1,0),0,1)
            color: '#ffac42'
            smooth: false
        out:
          type: output
          inputs:
            image: fire.image
  sample-lightning-arc:
    size: 64
    frames: 8
    colors: 6
    tags:
    - sample
    - lightning
    graph:
      nodes:
        bolt:
          type: shape.field
          params:
            variables:
              dx: x-16
              dy: y-16
              r: hypot(dx,dy)
              a: atan2(dy,dx)
            expression: max(0,1-abs(x-(16+2*(abs((y+floor(i/2))%6-3)-1.5)))/1.3)*if(y>2&&y<30,1,0)
            color: '#b5dcff'
            smooth: false
        branch:
          type: shape.field
          params:
            variables:
              dx: x-16
              dy: y-16
              r: hypot(dx,dy)
              a: atan2(dy,dx)
            expression: max(0,1-seg(x,y,16,16,6+sin(i)*2,8)/0.65)
            color: '#729fff'
            smooth: false
        layers:
          type: composite.over
          inputs:
            a: bolt.image
            b: branch.image
        out:
          type: output
          inputs:
            image: layers.image
  sample-ice-shatter:
