# Custom particle sprites (ADR-0239), tool-only. `./gradlew :tools:item-art:run` writes, per sprite id,
#   textures/generated/sprites/<id>.png   horizontal frame strip
#   fonts/vfx/<id>.json                   bitmap font, frame i = U+E000 + i
#   sprites/<id>.yaml                     runtime metadata (frame count)
# A sprite uses graph: {nodes: ...} or from: <sheet/strip>. See docs/contributing/vfx-team/sprite-graph.md.
# Optional per sprite: size (32), colors (12), outline (false). Sheets are keyed on their flat background.

sources:
  vfx-v1: { file: sheets/vfx-v1.png, grid: [6, 6] }
  bastion-s1-crescent: { file: images/bastion-s1-crescent.png }
  couture-s2-crescent: { file: images/couture-s2-crescent.png }
  couture-s2-crescent-core: { file: images/couture-s2-crescent-core.png }
  couture-s2-streak: { file: images/couture-s2-streak.png }
  couture-s2-petal-spark: { file: images/couture-s2-petal-spark.png }
  couture-s2-overhead-slash: { file: images/couture-s2-overhead-slash.png }
  couture-s2-feather: { file: images/couture-s2-feather.png }
  couture-s2-feather-warm: { file: images/couture-s2-feather-warm.png }
  couture-s2-smear: { file: images/couture-s2-smear.png }
  couture-s2-burst-star: { file: images/couture-s2-burst-star.png }
  couture-s2-burst-plume: { file: images/couture-s2-burst-plume.png }
  couture-s2-burst-shard: { file: images/couture-s2-burst-shard.png }
  couture-s2-burst-soft: { file: images/couture-s2-burst-soft.png }
  couture-s2-haze-soft: { file: images/couture-s2-haze-soft.png }
  couture-s2-ring-thin: { file: images/couture-s2-ring-thin.png }
  couture-s2-burst-flare: { file: images/couture-s2-burst-flare.png }
  couture-s2-burst-core: { file: images/couture-s2-burst-core.png }
  couture-s2-shadow-spikes: { file: images/couture-s2-shadow-spikes.png }
  bastion-s1-ink: { file: images/bastion-s1-ink.png }
  bastion-s1-streak: { file: images/bastion-s1-streak.png }
  bastion-s1-smoke: { file: images/bastion-s1-smoke.png }
  bastion-s1-glint: { file: images/bastion-s1-glint.png }
  bastion-s1-flare: { file: images/bastion-s1-flare.png }
  bastion-s1-sliver: { file: images/bastion-s1-sliver.png }
  bastion-s1-ring-q0: { file: images/bastion-s1-ring-q0.png }
  bastion-s1-ring-q1: { file: images/bastion-s1-ring-q1.png }
  bastion-s1-ring-q2: { file: images/bastion-s1-ring-q2.png }
  bastion-s1-ring-q3: { file: images/bastion-s1-ring-q3.png }
  bastion-s1-hring-q0: { file: images/bastion-s1-hring-q0.png }
  bastion-s1-hring-q1: { file: images/bastion-s1-hring-q1.png }
  bastion-s1-hring-q2: { file: images/bastion-s1-hring-q2.png }
  bastion-s1-hring-q3: { file: images/bastion-s1-hring-q3.png }
  bastion-s1-hring-bq0: { file: images/bastion-s1-hring-bq0.png }
  bastion-s1-hring-bq1: { file: images/bastion-s1-hring-bq1.png }
  bastion-s1-hring-bq2: { file: images/bastion-s1-hring-bq2.png }
  bastion-s1-hring-bq3: { file: images/bastion-s1-hring-bq3.png }
  bastion-s1-spark: { file: images/bastion-s1-spark.png }

sprites:
  gossamer-ribbon:
    frames: 4
    size: 128
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              dx0: (x-16)/(14-0*0.45)
              dy0: (y-16-(0-1.5)*0.35-(0.14)*(x-16))/(2.5+0*0.3)
              a0: (atan2(dy0,dx0)+pi*3+i*0.35+0*0.3)%(2*pi)
              dx1: (x-16)/(14-1*0.45)
              dy1: (y-16-(1-1.5)*0.35-(-0.14)*(x-16))/(2.5+1*0.3)
              a1: (atan2(dy1,dx1)+pi*3+i*0.35+1*0.3)%(2*pi)
              dx2: (x-16)/(14-2*0.45)
              dy2: (y-16-(2-1.5)*0.35-(0.14)*(x-16))/(2.5+2*0.3)
              a2: (atan2(dy2,dx2)+pi*3+i*0.35+2*0.3)%(2*pi)
              dx3: (x-16)/(14-3*0.45)
              dy3: (y-16-(3-1.5)*0.35-(-0.14)*(x-16))/(2.5+3*0.3)
              a3: (atan2(dy3,dx3)+pi*3+i*0.35+3*0.3)%(2*pi)
            expression: max(max(0,1-abs(hypot(dx0,dy0)-1)/(0.035+0*0.008))*clamp(a0/0.7,0,1),max(0,1-abs(hypot(dx1,dy1)-1)/(0.035+1*0.008))*clamp(a1/0.7,0,1),max(0,1-abs(hypot(dx2,dy2)-1)/(0.035+2*0.008))*clamp(a2/0.7,0,1),max(0,1-abs(hypot(dx3,dy3)-1)/(0.035+3*0.008))*clamp(a3/0.7,0,1))
            color: '#DDE5F5'
        out:
          type: output
          inputs:
            image: field.image
  gossamer-trail-wedge:
    quad_font: true
    frames: 1
    size: 128
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables: {}
            expression: if(abs(y-16)<=16*(0.63+0.37*x/32),1,0)
            color: '#FFFFFF'
        out:
          type: output
          inputs:
            image: field.image
  gossamer-echo-back:
    frames: 1
    size: 128
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              xx: 32-x
              d: max(2.8-hypot(xx-20,y-8.5),2.5-seg(xx,y,18,11,12,18.5),1.8-seg(xx,y,12,19,20,22),1.2-seg(xx,y,20,22,24,27),1.6-seg(xx,y,12,19,7,25),1-seg(xx,y,7,25,3,27),1.25-seg(xx,y,17,12,21,17),0.9-seg(xx,y,21,17,25,15),1-seg(xx,y,16,13,12,12),0.8-seg(xx,y,12,12,9,7),1.3-seg(xx,y,11,17,3,20),0.28-seg(xx,y,24,15,31,13.8),0.35-seg(xx,y,7,18.5,16,20))
            expression: if(d<0,0,if(d<0.3,0.9,0.55))
            color: '#AAB4CF'
        out:
          type: output
          inputs:
            image: field.image
  gossamer-echo:
    frames: 1
    size: 128
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              xx: x
              d: max(2.8-hypot(xx-20,y-8.5),2.5-seg(xx,y,18,11,12,18.5),1.8-seg(xx,y,12,19,20,22),1.2-seg(xx,y,20,22,24,27),1.6-seg(xx,y,12,19,7,25),1-seg(xx,y,7,25,3,27),1.25-seg(xx,y,17,12,21,17),0.9-seg(xx,y,21,17,25,15),1-seg(xx,y,16,13,12,12),0.8-seg(xx,y,12,12,9,7),1.3-seg(xx,y,11,17,3,20),0.28-seg(xx,y,24,15,31,13.8),0.35-seg(xx,y,7,18.5,16,20))
            expression: if(d<0,0,if(d<0.3,0.9,0.55))
            color: '#AAB4CF'
        out:
          type: output
          inputs:
            image: field.image
  orrery-impact:
    frames: 4
    size: 128
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              r: hypot(x-16,y-16)
              a: atan2(y-16,x-16)+i*pi/48
              sector: (a*12/pi+48)%1
              outer: if(sector>=0.1,max(0,1-abs(r-12)/1.8),0)
              inner: if(sector>0.18,max(0,0.9-abs(r-9.2)/0.65),0)
              tooth: if(sector>=0.38 && sector<=0.58 && r>=10 && r<=14.8,0.65,0)
            expression: max(outer,inner,tooth)
            color: '#ffb522'
        out:
          type: output
          inputs:
            image: field.image
  orrery-orb:
    frames: 1
    size: 128
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              r: hypot(x-16,y-16)/15
            expression: if(r>1,0,clamp(1-r^4,0,1))
            color: '#ffae24'
        out:
          type: output
          inputs:
            image: field.image
  crimson-link:
    frames: 1
    size: 256
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              mx: if(x>16,32-x,x)
              outer: hypot(mx-10,y-16)
              inner: hypot(mx-12.6,y-16)
            expression: if(outer<7 && inner>6.6,min(1,0.35+min(7-outer,inner-6.6)*0.8),if(abs(x-16)<1.2 && y>=1.5 && y<=30.5,0.2,if(abs(y-16)<1 && x>=5 && x<=27,0.3,0)))
            color: '#e4cdd0'
        out:
          type: output
          inputs:
            image: field.image
  crimson-orbit:
    frames: 1
    size: 256
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables: {}
            expression: max(0,1-abs(hypot(x-16,y-16)-12)/0.65)
            color: '#ef2445'
        out:
          type: output
          inputs:
            image: field.image
  procuration-ribbon:
    frames: 1
    size: 256
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              u: (x-1)/30
              centre: 18-7*sin(pi*u)+2*u
              halfWidth: 2.2*max(0,sin(pi*u))^0.65*(1.2-0.5*u)
              edge: 1-abs(y-centre)/max(0.01,halfWidth)
            expression: if(u<0 || u>1 || edge<=0,0,min(1,0.3+edge*1.5))
            color: '#809de9'
        out:
          type: output
          inputs:
            image: field.image
  procuration-petal-blue:
    frames: 1
    size: 128
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              u: (y-5)/22
              width: 9*max(0,sin(pi*u))^0.4*(0.85+0.12*sin(7*pi*u))
              centre: 16-3*u+sin(2*pi*u)
              edge: 1-abs(x-centre)/max(0.01,width)
            expression: if(u<0 || u>1 || edge<=0,0,0.3+0.4*edge)
            color: '#809de9'
        out:
          type: output
          inputs:
            image: field.image
  procuration-petal:
    frames: 1
    size: 128
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              u: (y-4)/24
              width: 7*max(0,sin(pi*u))^0.65*(0.65+0.65*u)
              centre: 16+3*(u-0.5)+0.8*sin(3*pi*u)
              edge: 1-abs(x-centre)/max(0.01,width)
            expression: if(u<0 || u>1 || edge<=0,0,min(1,0.3+edge*1.4))
            color: '#9cbcff'
        out:
          type: output
          inputs:
            image: field.image
  spark:
    frames: 6
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              scale: if(t<0.3,lerp(0.3,1,ease(t/0.3)),lerp(1,0.12,((t-0.3)/0.7)^0.8))
              r: 14*scale
              dx: x-16
              dy: y-16
              main: 1-star(dx,dy,r,0.5)
              diag: (1-star((dx+dy)*0.7071,(dy-dx)*0.7071,r*0.5,0.5))*0.78
              core: 1-hypot(dx,dy)/(1+3.2*scale)
            expression: max(main,diag,core*1.2)
            color: '#ffe27a'
        out:
          type: output
          inputs:
            image: field.image
  ring:
    frames: 6
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              radius: lerp(3,13.4,ease(t))
              half: lerp(2.3,0.8,t)
              peak: lerp(1,0.62,t)
              d: hypot(x-16,y-16)
              outer: (1-abs(d-radius)/(half+0.35))*peak
              echo: (1-abs(d-radius*0.68)/(half*0.55+0.3))*peak*0.5*(1-t)
            expression: max(outer,echo)
            color: '#7fd6ff'
        out:
          type: output
          inputs:
            image: field.image
  burst:
    frames: 6
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              dx: x-16
              dy: y-16
              e: ease(t)
              width: lerp(1.9,0.9,t)
              tail0: lerp(2,9,e)*1
              head0: min(lerp(5,15.6,e)*1,15.6)
              along0: dx*cos((0*2*pi/8+pi/8))+dy*sin((0*2*pi/8+pi/8))
              across0: abs(-dx*sin((0*2*pi/8+pi/8))+dy*cos((0*2*pi/8+pi/8)))
              f0: (along0-tail0)/max(0.1,head0-tail0)
              tail1: lerp(2,9,e)*0.62
              head1: min(lerp(5,15.6,e)*0.62,15.6)
              along1: dx*cos((1*2*pi/8+pi/8))+dy*sin((1*2*pi/8+pi/8))
              across1: abs(-dx*sin((1*2*pi/8+pi/8))+dy*cos((1*2*pi/8+pi/8)))
              f1: (along1-tail1)/max(0.1,head1-tail1)
              tail2: lerp(2,9,e)*1
              head2: min(lerp(5,15.6,e)*1,15.6)
              along2: dx*cos((2*2*pi/8+pi/8))+dy*sin((2*2*pi/8+pi/8))
              across2: abs(-dx*sin((2*2*pi/8+pi/8))+dy*cos((2*2*pi/8+pi/8)))
              f2: (along2-tail2)/max(0.1,head2-tail2)
              tail3: lerp(2,9,e)*0.62
              head3: min(lerp(5,15.6,e)*0.62,15.6)
              along3: dx*cos((3*2*pi/8+pi/8))+dy*sin((3*2*pi/8+pi/8))
              across3: abs(-dx*sin((3*2*pi/8+pi/8))+dy*cos((3*2*pi/8+pi/8)))
              f3: (along3-tail3)/max(0.1,head3-tail3)
              tail4: lerp(2,9,e)*1
              head4: min(lerp(5,15.6,e)*1,15.6)
              along4: dx*cos((4*2*pi/8+pi/8))+dy*sin((4*2*pi/8+pi/8))
              across4: abs(-dx*sin((4*2*pi/8+pi/8))+dy*cos((4*2*pi/8+pi/8)))
              f4: (along4-tail4)/max(0.1,head4-tail4)
              tail5: lerp(2,9,e)*0.62
              head5: min(lerp(5,15.6,e)*0.62,15.6)
              along5: dx*cos((5*2*pi/8+pi/8))+dy*sin((5*2*pi/8+pi/8))
              across5: abs(-dx*sin((5*2*pi/8+pi/8))+dy*cos((5*2*pi/8+pi/8)))
              f5: (along5-tail5)/max(0.1,head5-tail5)
              tail6: lerp(2,9,e)*1
              head6: min(lerp(5,15.6,e)*1,15.6)
              along6: dx*cos((6*2*pi/8+pi/8))+dy*sin((6*2*pi/8+pi/8))
              across6: abs(-dx*sin((6*2*pi/8+pi/8))+dy*cos((6*2*pi/8+pi/8)))
              f6: (along6-tail6)/max(0.1,head6-tail6)
              tail7: lerp(2,9,e)*0.62
              head7: min(lerp(5,15.6,e)*0.62,15.6)
              along7: dx*cos((7*2*pi/8+pi/8))+dy*sin((7*2*pi/8+pi/8))
              across7: abs(-dx*sin((7*2*pi/8+pi/8))+dy*cos((7*2*pi/8+pi/8)))
              f7: (along7-tail7)/max(0.1,head7-tail7)
            expression: max(max(0,1-hypot(dx,dy)/lerp(6.5,0.5,min(1,t/0.45))),if(along0<tail0 || along0>head0,0,(1-across0/(width*(0.45+0.55*f0)+0.2))*(0.5+0.55*f0)*lerp(1,0.7,t)),if(along1<tail1
              || along1>head1,0,(1-across1/(width*(0.45+0.55*f1)+0.2))*(0.5+0.55*f1)*lerp(1,0.7,t)),if(along2<tail2 || along2>head2,0,(1-across2/(width*(0.45+0.55*f2)+0.2))*(0.5+0.55*f2)*lerp(1,0.7,t)),if(along3<tail3
              || along3>head3,0,(1-across3/(width*(0.45+0.55*f3)+0.2))*(0.5+0.55*f3)*lerp(1,0.7,t)),if(along4<tail4 || along4>head4,0,(1-across4/(width*(0.45+0.55*f4)+0.2))*(0.5+0.55*f4)*lerp(1,0.7,t)),if(along5<tail5
              || along5>head5,0,(1-across5/(width*(0.45+0.55*f5)+0.2))*(0.5+0.55*f5)*lerp(1,0.7,t)),if(along6<tail6 || along6>head6,0,(1-across6/(width*(0.45+0.55*f6)+0.2))*(0.5+0.55*f6)*lerp(1,0.7,t)),if(along7<tail7
              || along7>head7,0,(1-across7/(width*(0.45+0.55*f7)+0.2))*(0.5+0.55*f7)*lerp(1,0.7,t)))
            color: '#ff9a3c'
        out:
          type: output
          inputs:
            image: field.image
  puff:
    frames: 6
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              grow: lerp(0.55,1.35,ease(t))
              d0: ((x-(16+0*grow))^2+(y-(16+2*grow+lerp(0,-4,ease(t))-0*0.4*t*3))^2)/(6*grow)^2
              d1: ((x-(16+-6*grow))^2+(y-(16+4*grow+lerp(0,-4,ease(t))-1*0.4*t*3))^2)/(4.6*grow)^2
              d2: ((x-(16+6*grow))^2+(y-(16+4.5*grow+lerp(0,-4,ease(t))-2*0.4*t*3))^2)/(4.4*grow)^2
              d3: ((x-(16+-2.5*grow))^2+(y-(16+-3*grow+lerp(0,-4,ease(t))-3*0.4*t*3))^2)/(4.6*grow)^2
              d4: ((x-(16+3.5*grow))^2+(y-(16+-2.5*grow+lerp(0,-4,ease(t))-4*0.4*t*3))^2)/(4*grow)^2
              f: if(d0<1,(1-d0)^2,0)+if(d1<1,(1-d1)^2,0)+if(d2<1,(1-d2)^2,0)+if(d3<1,(1-d3)^2,0)+if(d4<1,(1-d4)^2,0)
              density: f*lerp(1,0.45,t)
              tone: clamp(density*0.55+((16-y)/14)*0.28+0.18,0.12,0.78)
            expression: if(density>=0.1 && (density>0.42 || (density-0.1)/0.32>bayer(px,py)),tone,0)
            smooth: false
            color: '#b9bfd0'
        out:
          type: output
          inputs:
            image: field.image
  flame:
    frames: 6
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              phase: i/max(1,n)*2*pi
              height: 21+2.2*sin(phase*2+0.6)
              width: 8.4+1.1*sin(phase*3+1)
              sway: 2.2*sin(phase)
              u: (28-y)/height
              half: width*max(0,sin(pi*min(1,max(0,u)^0.55*0.92)))^0.9*max(0,1-u)^0.35
              cx: 16+sway*u*u*1.4+0.8*sin(phase*2+u*5)*u
              'off': abs(x-cx)
              heat: (1-off/max(0.5,half))*(1-u*0.55)
            expression: if(u<0 || u>1 || off>half,0,min(1,heat*1.15))
            dots:
            - x: 16+(-1)*(3+0*1.3)+1.5*sin(((i/max(1,n)+0/3)%1)*2*pi+0)
              y: 28-14-((i/max(1,n)+0/3)%1)*11
              value: 0.85-((i/max(1,n)+0/3)%1)*0.55
            - x: 16+(1)*(3+1*1.3)+1.5*sin(((i/max(1,n)+1/3)%1)*2*pi+1)
              y: 28-14-((i/max(1,n)+1/3)%1)*11
              value: 0.85-((i/max(1,n)+1/3)%1)*0.55
            - x: 16+(-1)*(3+2*1.3)+1.5*sin(((i/max(1,n)+2/3)%1)*2*pi+2)
              y: 28-14-((i/max(1,n)+2/3)%1)*11
              value: 0.85-((i/max(1,n)+2/3)%1)*0.55
            color: '#ff7a1f'
        out:
          type: output
          inputs:
            image: field.image
  glint:
    frames: 6
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              s: sin(pi*(0.08+0.84*t))^0.7
              rx: 16*s
              ry: 13*s
              dx: x-16
              dy: y-16
              ax: max(abs(dx)-0.5,0)
              ay: max(abs(dy)-0.5,0)
              arms: max(0,1-star(ax,ay*rx/max(ry,0.01),rx,0.5))
              core: 1-hypot(dx,dy)/(0.6+3*s)
              d45: 1-star((dx+dy)*0.7071,(dy-dx)*0.7071,rx*0.34,0.45)
            expression: max(arms,core*1.25,d45*0.7)
            dots:
            - x: 7
              y: 9
              value: 0.5+0.5*(sin(pi*(t+0*0.33))^2)
              when: (sin(pi*(t+0*0.33))^2)>0.55
            - x: 24
              y: 24
              value: 0.5+0.5*(sin(pi*(t+1*0.33))^2)
              when: (sin(pi*(t+1*0.33))^2)>0.55
            - x: 25.5
              y: 7
              value: 0.5+0.5*(sin(pi*(t+2*0.33))^2)
              when: (sin(pi*(t+2*0.33))^2)>0.55
            color: '#e8f6ff'
        out:
          type: output
          inputs:
            image: field.image
  slash:
    frames: 6
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              head: ease(min(1,(t+0.1)/0.55))
              tail: if(t<0.4,0,((t-0.4)/0.6)^1.1)
              s: (atan2(y-1,x-1)-4*pi/180)/(82*pi/180)
              half: 0.4+3.6*max(0,sin(pi*s))^0.8*(1-0.35*tail)
              radial: 1-abs(hypot(x-1,y-1)-22-0.6*(s-0.5))/max(0.000001,half)
              bright: 0.5+0.5*((s-tail)/max(0.05,head-tail))
            expression: if(s<tail || s>head || s<0 || s>1,0,radial*bright*lerp(1,0.8,t)+if(radial>0.6,0.2,0)*bright)
            color: '#d8e4ff'
        out:
          type: output
          inputs:
            image: field.image
  dot:
    frames: 1
    size: 32
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              d: hypot(x-16,y-16)
            expression: if(d>5.2,0,if(d>4.2,0.2,0.62+0.38*(1-d/5.2)))
            color: '#ffffff'
        out:
          type: output
          inputs:
            image: field.image
  line-thin:
    frames: 1
    size: 32
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              dx: abs(x-16)/16
              dy: abs(y-16)
            expression: if(dy>1 || dx>1,0,(1-dx^2.2)*if(dy<0.5,1,0.6))
            color: '#ffffff'
        out:
          type: output
          inputs:
            image: field.image
  sparkle-cross:
    frames: 1
    size: 32
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              dx: abs(x-16)
              dy: abs(y-16)
              line: if(min(dx,dy)<1 && max(dx,dy)<15,(1-max(dx,dy)/15)^0.9,0)
              core: 1-hypot(dx,dy)/3.2
            expression: max(line,core*1.25)
            color: '#ffffff'
        out:
          type: output
          inputs:
            image: field.image
  smoke-puff:
    frames: 4
    size: 32
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              grow: lerp(0.8,1.15,ease(t))
              d0: ((x-(16+0*grow))^2+(y-(16+0*grow))^2)/(9*grow)^2
              d1: ((x-(16+-6*grow))^2+(y-(16+3*grow))^2)/(6*grow)^2
              d2: ((x-(16+6.5*grow))^2+(y-(16+2*grow))^2)/(6.5*grow)^2
              d3: ((x-(16+-2*grow))^2+(y-(16+-6*grow))^2)/(6*grow)^2
              d4: ((x-(16+3*grow))^2+(y-(16+-5*grow))^2)/(5*grow)^2
              f: if(d0<1,(1-d0)^1.6,0)+if(d1<1,(1-d1)^1.6,0)+if(d2<1,(1-d2)^1.6,0)+if(d3<1,(1-d3)^1.6,0)+if(d4<1,(1-d4)^1.6,0)
              density: f*lerp(1,0.6,t)
              tone: clamp(0.2+density*0.32+((16-y)/16)*0.12,0.12,0.7)
            expression: if(density>=0.08 && (density>0.38 || (density-0.08)/0.3>bayer(px,py)),tone,0)
            smooth: false
            color: '#9aa0ad'
        out:
          type: output
          inputs:
            image: field.image
  couture-s2-crescent: { from: couture-s2-crescent, raw: true, frames: 1, size: 256 }
  couture-s2-crescent-core: { from: couture-s2-crescent-core, raw: true, frames: 1, size: 256 }
  couture-s2-streak: { from: couture-s2-streak, raw: true, frames: 1, size: 256 }
  couture-s2-petal-spark: { from: couture-s2-petal-spark, raw: true, frames: 1, size: 256 }
  couture-s2-overhead-slash: { from: couture-s2-overhead-slash, raw: true, frames: 1, size: 256 }
  couture-s2-feather: { from: couture-s2-feather, raw: true, frames: 1, size: 256 }
  couture-s2-feather-warm: { from: couture-s2-feather-warm, raw: true, frames: 1, size: 256 }
  couture-s2-smear: { from: couture-s2-smear, raw: true, frames: 1, size: 256 }
  couture-s2-burst-star: { from: couture-s2-burst-star, raw: true, frames: 1, size: 256 }
  couture-s2-burst-plume: { from: couture-s2-burst-plume, raw: true, frames: 1, size: 256 }
  couture-s2-burst-shard: { from: couture-s2-burst-shard, raw: true, frames: 1, size: 256 }
  couture-s2-burst-soft: { from: couture-s2-burst-soft, raw: true, frames: 1, size: 256 }
  couture-s2-haze-soft: { from: couture-s2-haze-soft, raw: true, frames: 1, size: 256 }
  couture-s2-ring-thin: { from: couture-s2-ring-thin, raw: true, frames: 1, size: 256 }
  couture-s2-petal:
    frames: 1
    size: 128
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              u: (y-4)/24
              width: 7*max(0,sin(pi*u))^0.65*(0.65+0.65*u)
              centre: 16+3*(u-0.5)+0.8*sin(3*pi*u)
              edge: 1-abs(x-centre)/max(0.01,width)
            expression: if(u<0 || u>1 || edge<=0,0,min(1,0.3+edge*1.4))
            color: '#ffffff'
        out:
          type: output
          inputs:
            image: field.image
  couture-s2-burst-flare: { from: couture-s2-burst-flare, raw: true, frames: 1, size: 256 }
  couture-s2-burst-core: { from: couture-s2-burst-core, raw: true, frames: 1, size: 256 }
  couture-s2-shadow-spikes: { from: couture-s2-shadow-spikes, raw: true, frames: 1, size: 256 }
  couture-orbit:
    frames: 1
    size: 128
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              dx: x-16
              dy: y-16
              angle: (atan2(dy,dx)+2*pi)%(2*pi)
              u: angle/(230*pi/180)
              halfWidth: 0.12+1.35*max(0,sin(pi*u))^0.7
            expression: if(u<0 || u>1,0,(1-abs(hypot(dx,dy)-11.5)/halfWidth)*(0.85+0.15*sin(pi*u)))
            color: '#fff4ee'
        out:
          type: output
          inputs:
            image: field.image
  couture-cut:
    frames: 6
    size: 128
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              head: ease(min(1,(t+0.1)/0.55))
              tail: if(t<0.4,0,((t-0.4)/0.6)^1.1)
              s: (atan2(y-1,x-1)-4*pi/180)/(82*pi/180)
              half: 0.4+1.2*max(0,sin(pi*s))^0.8*(1-0.35*tail)
              radial: 1-abs(hypot(x-1,y-1)-22-0.6*(s-0.5))/max(0.000001,half)
              bright: 0.5+0.5*((s-tail)/max(0.05,head-tail))
            expression: if(s<tail || s>head || s<0 || s>1,0,radial*bright*lerp(1,0.8,t)+if(radial>0.6,0.2,0)*bright)
            color: '#fff4ee'
        out:
          type: output
          inputs:
            image: field.image
  bastion-arc:
    frames: 6
    size: 256
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              head: ease(min(1,(t+0.08)/0.5))
              tail: if(t<0.55,0,((t-0.55)/0.45)^1.2)
              a: atan2(y-17,x-16)
              s: (if(a<0,a+2*pi,a)-pi)/pi
              w: clamp((s-tail)/max(0.05,head-tail),0,1)
              half: 0.35+2.7*max(0,sin(pi*w))^0.85*(1-0.3*tail)
              radial: 1-abs(hypot(x-16,y-17)-14.5)/half
              bright: 0.45+0.55*((s-tail)/max(0.05,head-tail))
            expression: if(s<tail || s>head || s<0 || s>1,0,radial*bright+if(radial>0.7,0.25,0)*bright)
            color: '#ffcf3a'
        out:
          type: output
          inputs:
            image: field.image
  bastion-smoke:
    frames: 6
    size: 256
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              head: ease(min(1,(t+0.08)/0.5))
              tail: if(t<0.55,0,((t-0.55)/0.45)^1.2)
              a: atan2(y-17,x-16)
              s: (if(a<0,a+2*pi,a)-pi)/pi
              w: clamp((s-tail)/max(0.05,head-tail),0,1)
              half: 0.35+2.7*max(0,sin(pi*w))^0.85*(1-0.3*tail)
              radial: 1-abs(hypot(x-16,y-17)-14.5)/half
              bright: 0.45+0.55*((s-tail)/max(0.05,head-tail))
            expression: if(s<tail || s>head || s<0 || s>1,0,radial*bright+if(radial>0.7,0.25,0)*bright)
            color: '#8d939e'
        out:
          type: output
          inputs:
            image: field.image
  bastion-ink:
    frames: 6
    size: 256
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              grow: if(t<0.25,ease(t/0.25),1)
              fade: if(t<0.55,1,max(0,1-(t-0.55)/0.45))
              dx: x-16
              dy: y-16
              u0: (dx--2*grow)/max(15.5*grow*fade,0.01)
              wob0: 0.35*sin(dx*0.7+0*2.1+i)
              half0: 1.7*(1-abs(u0)^1.6)*(1-0.3*(1-fade))
              d0: 1-abs(dy-(-9)-wob0)/max(half0,0.01)
              u1: (dx-1*grow)/max(14*grow*fade,0.01)
              wob1: 0.35*sin(dx*0.7+1*2.1+i)
              half1: 2.4*(1-abs(u1)^1.6)*(1-0.3*(1-fade))
              d1: 1-abs(dy-(-5)-wob1)/max(half1,0.01)
              u2: (dx--1*grow)/max(15.8*grow*fade,0.01)
              wob2: 0.35*sin(dx*0.7+2*2.1+i)
              half2: 3*(1-abs(u2)^1.6)*(1-0.3*(1-fade))
              d2: 1-abs(dy-(-1)-wob2)/max(half2,0.01)
              u3: (dx-3*grow)/max(12.5*grow*fade,0.01)
              wob3: 0.35*sin(dx*0.7+3*2.1+i)
              half3: 2.2*(1-abs(u3)^1.6)*(1-0.3*(1-fade))
              d3: 1-abs(dy-(3.5)-wob3)/max(half3,0.01)
              u4: (dx--3*grow)/max(14.5*grow*fade,0.01)
              wob4: 0.35*sin(dx*0.7+4*2.1+i)
              half4: 1.6*(1-abs(u4)^1.6)*(1-0.3*(1-fade))
              d4: 1-abs(dy-(7.5)-wob4)/max(half4,0.01)
              u5: (dx-2*grow)/max(9*grow*fade,0.01)
              wob5: 0.35*sin(dx*0.7+5*2.1+i)
              half5: 1.2*(1-abs(u5)^1.6)*(1-0.3*(1-fade))
              d5: 1-abs(dy-(11)-wob5)/max(half5,0.01)
              core: 1-hypot(dx*0.7,dy*1.2)/(8.5*grow*fade+0.01)
            expression: max(0,if(abs(u0)>=1 || d0<=0,0,if(d0>0.55,0.62,0.42)),if(abs(u1)>=1 || d1<=0,0,if(d1>0.55,0.62,0.42)),if(abs(u2)>=1 || d2<=0,0,if(d2>0.55,0.62,0.42)),if(abs(u3)>=1
              || d3<=0,0,if(d3>0.55,0.62,0.42)),if(abs(u4)>=1 || d4<=0,0,if(d4>0.55,0.62,0.42)),if(abs(u5)>=1 || d5<=0,0,if(d5>0.55,0.62,0.42)),if(core>0 && sin(dx*1.3+dy*0.9+i)>-0.7,if(core>0.45,0.66,0.4),0))
            color: '#ffe36a'
        out:
          type: output
          inputs:
            image: field.image
  bastion-crest:
    frames: 1
    size: 256
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              grow: if(n<=1,1,ease(min(1,t/0.3)))
              dx: (x-16)/(11*grow+0.01)
              dy: (y-16)/(14.5*grow+0.01)
              halfW: if(dy < -0.35,1-0.05*(dy+1),(1-max(0,(dy+0.35)/1.35)^1.6)*0.97)
              outer: if(abs(abs(dx)-halfW)<0.11,0.75,0)
              top: if(dy < -0.92 && abs(dx)<halfW,0.75,0)
              inner: if(abs(abs(dx)-halfW*0.72)<0.06 && dy > -0.8 && dy<0.75,0.5,0)
              spine: if(abs(dx)<0.045 && dy > -0.75 && dy<0.7,0.45,0)
            expression: if(dy < -1 || dy>1 || halfW<=0,0,max(outer,top,inner,spine))
            color: '#ffd25a'
        out:
          type: output
          inputs:
            image: field.image
  bastion-rim:
    frames: 1
    size: 256
    graph:
      nodes:
        field:
          type: shape.field
          params:
            variables:
              a: atan2(y-17,x-16)
              s: (if(a<0,a+2*pi,a)-pi)/pi
              half: 0.3+1.7*max(0,sin(pi*s))^0.85
              radial: 1-abs(hypot(x-16,y-17)-14.5)/half
            expression: if(s<0 || s>1,0,radial*(0.7+0.3*clamp(radial,0,1)))
            color: '#ffcf3a'
        out:
          type: output
          inputs:
            image: field.image

