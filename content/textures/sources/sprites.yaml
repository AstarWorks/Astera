# Custom particle sprites (ADR-0239), tool-only. `./gradlew :tools:item-art:run` writes, per sprite id,
#   textures/generated/sprites/<id>.png   horizontal frame strip
#   fonts/vfx/<id>.json                   bitmap font, frame i = U+E000 + i
#   sprites/<id>.yaml                     runtime metadata (frame count)
# A sprite is `draw: <painter>` (code: spark ring burst puff flame glint slash slice), `from: <sheet>, row: N`
# (first `frames` cells of a sheet row) or `from: <image>, frames: N` (one image split horizontally).
# Optional per sprite: size (32), colors (12), outline (false). Sheets are keyed on their flat background.

sources:
  vfx-v1: { file: sheets/vfx-v1.png, grid: [6, 6] }
  bastion-s1-crescent: { file: images/bastion-s1-crescent.png }
  bastion-s1-ink: { file: images/bastion-s1-ink.png }
  bastion-s1-streak: { file: images/bastion-s1-streak.png }
  bastion-s1-smoke: { file: images/bastion-s1-smoke.png }
  bastion-s1-glint: { file: images/bastion-s1-glint.png }
  bastion-s1-sliver: { file: images/bastion-s1-sliver.png }
  bastion-s1-ring: { file: images/bastion-s1-ring.png }
  bastion-s1-hring: { file: images/bastion-s1-hring.png }
  bastion-s1-hring-b: { file: images/bastion-s1-hring-b.png }
  bastion-s1-ring-b: { file: images/bastion-s1-ring-b.png }
  bastion-s1-spark: { file: images/bastion-s1-spark.png }

sprites:
  gossamer-ribbon: { draw: gossamer_ribbon, frames: 4, size: 128, color: "#DDE5F5" }
  gossamer-trail-wedge: { quad_font: true, draw: gossamer_trail_wedge, frames: 1, size: 128, color: "#FFFFFF" }
  gossamer-echo-back: { draw: gossamer_echo_mirror, frames: 1, size: 128, color: "#AAB4CF" }
  gossamer-echo: { draw: gossamer_echo, frames: 1, size: 128, color: "#AAB4CF" }
  orrery-impact: { draw: orrery_impact, frames: 4, size: 128, color: "#ffb522" }
  orrery-orb: { draw: orb, frames: 1, size: 128, color: "#ffae24" }
  crimson-link: { draw: crimson_link, frames: 1, size: 256, color: "#e4cdd0" }
  crimson-orbit: { draw: crimson_orbit, frames: 1, size: 256, color: "#ef2445" }
  procuration-ribbon: { draw: procuration_ribbon, frames: 1, size: 256, color: "#809de9" }
  procuration-petal-blue: { draw: petal_blue, frames: 1, size: 128, color: "#809de9" }
  procuration-petal: { draw: petal, frames: 1, size: 128, color: "#9cbcff" }
  spark: { draw: spark, frames: 6, color: "#ffe27a" }
  ring: { draw: ring, frames: 6, color: "#7fd6ff" }
  burst: { draw: burst, frames: 6, color: "#ff9a3c" }
  puff: { draw: puff, frames: 6, color: "#b9bfd0" }
  flame: { draw: flame, frames: 6, color: "#ff7a1f" }
  glint: { draw: glint, frames: 6, color: "#e8f6ff" }
  slash: { draw: slash, frames: 6, color: "#d8e4ff" }
  couture-orbit: { draw: orbit, frames: 1, size: 128, color: "#fff4ee" }
  couture-cut: { draw: slice, frames: 6, size: 128, color: "#fff4ee" }
  bastion-arc: { draw: arc, frames: 6, size: 256, color: "#ffcf3a" }
  bastion-smoke: { draw: arc, frames: 6, size: 256, color: "#8d939e" }
  bastion-ink: { draw: ink, frames: 6, size: 256, color: "#ffe36a" }
  bastion-crest: { draw: crest, frames: 1, size: 256, color: "#ffd25a" }
  bastion-rim: { draw: rim, frames: 1, size: 256, color: "#ffcf3a" }

  fire-burst: { from: vfx-v1, row: 0, frames: 6 }
  frost-shatter: { from: vfx-v1, row: 1, frames: 6 }
  arcane-slash: { from: vfx-v1, row: 2, frames: 6 }
  holy-glint: { from: vfx-v1, row: 3, frames: 6 }
  thunder-spark: { from: vfx-v1, row: 4, frames: 6 }
  blood-splash: { from: vfx-v1, row: 5, frames: 6 }
  bastion-s1-crescent: { from: bastion-s1-crescent, raw: true, frames: 6, size: 256 }
  bastion-s1-ink: { from: bastion-s1-ink, raw: true, frames: 2, size: 256 }
  bastion-s1-streak: { from: bastion-s1-streak, raw: true, frames: 1, size: 256 }
  bastion-s1-smoke: { from: bastion-s1-smoke, raw: true, frames: 4, size: 256 }
  bastion-s1-glint: { from: bastion-s1-glint, raw: true, frames: 2, size: 128 }
  bastion-s1-sliver: { from: bastion-s1-sliver, raw: true, frames: 3, size: 128 }
  bastion-s1-ring: { from: bastion-s1-ring, raw: true, frames: 11, size: 256 }
  bastion-s1-ring-b: { from: bastion-s1-ring-b, raw: true, frames: 11, size: 256 }
  bastion-s1-hring: { from: bastion-s1-hring, raw: true, frames: 12, size: 256 }
  bastion-s1-hring-b: { from: bastion-s1-hring-b, raw: true, frames: 12, size: 256 }
  bastion-s1-spark: { from: bastion-s1-spark, raw: true, frames: 4, size: 64 }
