# Wave H 5content-depth (ADR-0125): PvE forest stage.
#
# Forested combat arena with a center clearing for mob spawns.
# Larger footprint than example-arena so the new mob lineup
# (dark-zombie / cave-spider / nether-ghast) can spread out.
# Schema mirrors plugin/match/.../application/config/StageYamlConfig.kt.

id: forest-arena

display_name_key: astera.stage.forest-arena.name

# Axis-aligned bounding boxes (inclusive on both ends; min componentwise <= max).
regions:
  - name: full-arena
    min: { x: -80.0, y: 60.0, z: -80.0 }
    max: { x:  80.0, y: 95.0, z:  80.0 }

  - name: center-clearing
    min: { x: -10.0, y: 64.0, z: -10.0 }
    max: { x:  10.0, y: 70.0, z:  10.0 }

  - name: north-treeline
    min: { x: -80.0, y: 60.0, z:  40.0 }
    max: { x:  80.0, y: 80.0, z:  80.0 }

spawn_points:
  - team: red
    position: { x: -70.0, y: 64.0, z: 0.0 }
    yaw: 90.0
  - team: blue
    position: { x:  70.0, y: 64.0, z: 0.0 }
    yaw: 270.0
  - role: lobby
    position: { x:   0.0, y: 80.0, z: 0.0 }
  - role: spectator
    position: { x:   0.0, y: 95.0, z: 0.0 }
    pitch: 60.0
