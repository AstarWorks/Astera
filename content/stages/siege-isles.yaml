# Siege (objective) arena on sky islands (ADR-0246, replaces siege-flat). One stage serves every siege lane
# (break-core, carry-tnt, capture-wool, steal-jewelry, battle-loyal): each mode reads only the regions it knows by
# name, so they never get in each other's way. The lanes share this stage, so one siege match runs at a time.
#
#                     north outpost (0,274)  wool-a
#                            |
#   red island ---------- centre island ---------- blue island
#   (-33,300)  core(-41)   tnt-spawn (0,294)       (33,300)  core(41)
#   jewelry(-37,307)       wool-b (0,306)                    jewelry(37,307)
#                            |
#                     south outpost (0,326)  wool-c
#
# World `arenas` (void, created by Astera), top layer y=64, players stand at y=65. This stage lives at z=300 so it
# never overlaps the other arenas in the same world.
#
# Region vocabulary (name -> mode):
#   core-<team>      1 block, the team's core, ONE ABOVE the floor (y=65)   (break-core)
#   base-<team>      the team's base zone                (carry-tnt delivery, steal-jewelry deposit)
#   jewelry-<team>   3x3 pedestal zone inside the base   (steal-jewelry)
#   tnt-spawn        where the TNT waits                 (carry-tnt)
#   wool-*           control points, any number          (capture-wool)
# Zones span y 64 (the floor block, which the objective marker replaces) .. 70 so a standing/jumping player is inside.
# The builder puts a pedestal under every anchor; the modes place their markers at match start and remove them at the end.
# Schema mirrors plugin/match/.../application/config/StageYamlConfig.kt.

id: siege-isles

display_name_key: astera.stage.siege-isles.name

world: arenas

layout:
  marker_version: 1
  seed: 20261024
  surface_y: 64
  kill_y: 30
  islands:
    - { id: red, kind: base, team: red, center: { x: -33, z: 300 }, radius: 14.0 }
    - { id: blue, kind: base, team: blue, center: { x: 33, z: 300 }, radius: 14.0 }
    - { id: center, kind: center, center: { x: 0, z: 300 }, radius: 11.0 }
    - { id: north, kind: outpost, center: { x: 0, z: 274 }, radius: 7.0 }
    - { id: south, kind: outpost, center: { x: 0, z: 326 }, radius: 7.0 }
  bridges:
    - { from: red, to: center, width: 3 }
    - { from: blue, to: center, width: 3 }
    - { from: center, to: north, width: 3 }
    - { from: center, to: south, width: 3 }

