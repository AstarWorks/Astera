# Proving Grounds (ADR-0249): the sky-island arena of the `pve-waves` lane (ADR-0246 layout; scaled up after the
# founder's playtest).
#
#            NW (256,-44) r8 ---- north outpost (300,-58) r12 ---- NE (344,-44) r8
#                                          |
#   west outpost (242,0) r12 ------ centre island (300,0) r30 ------ east outpost (358,0) r12
#                                          |
#            SW (256,44) r8 ----- south outpost (300,58) r12 ----- SE (344,44) r8
#
# World `arenas` (void), top layer y=64, players stand
# at y=65. This stage lives at x=300 so it never overlaps the other arenas in the same world (example-arena z=0,
# siege-isles z=300, annihilation z=-300). Players start on the big centre island (stepped hills and ruins to fight
# from); each wave appears on the four outposts (`mob-spawn-*`, y = 65), 58 blocks out, and walks across the bridges.
# The four diagonal islands link neighbouring outposts into a ring, so a wave also reaches the centre round the edge.
# PveWaveGameMode reads only the `mob-spawn-*` regions. Schema mirrors StageYamlConfig.kt.

id: pve-proving-grounds

display_name_key: astera.stage.pve-proving-grounds.name

world: arenas

layout:
  marker_version: 2
  seed: 20261025
  surface_y: 64
  kill_y: 30
  islands:
    - { id: center, kind: center, center: { x: 300, z: 0 }, radius: 30.0 }
    - { id: north, kind: outpost, center: { x: 300, z: -58 }, radius: 12.0 }
    - { id: south, kind: outpost, center: { x: 300, z: 58 }, radius: 12.0 }
    - { id: west, kind: outpost, center: { x: 242, z: 0 }, radius: 12.0 }
    - { id: east, kind: outpost, center: { x: 358, z: 0 }, radius: 12.0 }
    - { id: north-east, kind: outpost, center: { x: 344, z: -44 }, radius: 8.0 }
    - { id: south-east, kind: outpost, center: { x: 344, z: 44 }, radius: 8.0 }
    - { id: south-west, kind: outpost, center: { x: 256, z: 44 }, radius: 8.0 }
    - { id: north-west, kind: outpost, center: { x: 256, z: -44 }, radius: 8.0 }
  bridges:
    - { from: center, to: north, width: 3 }
    - { from: center, to: south, width: 3 }
    - { from: center, to: west, width: 3 }
    - { from: center, to: east, width: 3 }
    - { from: north, to: north-east, width: 3 }
    - { from: north-east, to: east, width: 3 }
    - { from: east, to: south-east, width: 3 }
    - { from: south-east, to: south, width: 3 }
    - { from: south, to: south-west, width: 3 }
    - { from: south-west, to: west, width: 3 }
    - { from: west, to: north-west, width: 3 }
    - { from: north-west, to: north, width: 3 }

regions:
  - name: full-arena
    min: { x: 215.0, y: 20.0, z: -85.0 }
    max: { x: 385.0, y: 140.0, z: 85.0 }

  - name: mob-spawn-north
    min: { x: 299.0, y: 65.0, z: -59.0 }
    max: { x: 301.0, y: 65.0, z: -57.0 }
  - name: mob-spawn-east
    min: { x: 357.0, y: 65.0, z: -1.0 }
    max: { x: 359.0, y: 65.0, z:  1.0 }
  - name: mob-spawn-south
    min: { x: 299.0, y: 65.0, z: 57.0 }
    max: { x: 301.0, y: 65.0, z: 59.0 }
  - name: mob-spawn-west
    min: { x: 241.0, y: 65.0, z: -1.0 }
    max: { x: 243.0, y: 65.0, z:  1.0 }

spawn_points:
  - team: red
    position: { x: 300.5, y: 65.0, z: -2.5 }
    yaw: 0.0
  - team: red
    position: { x: 298.5, y: 65.0, z: 0.5 }
    yaw: 0.0
  - team: red
    position: { x: 302.5, y: 65.0, z: 0.5 }
    yaw: 0.0
  - team: red
    position: { x: 300.5, y: 65.0, z: 2.5 }
    yaw: 0.0
  - team: blue
    position: { x: 300.5, y: 65.0, z: 0.5 }
    yaw: 0.0
  - role: lobby
    position: { x: 300.5, y: 65.0, z: 0.5 }
  - role: spectator
    position: { x: 300.5, y: 100.0, z: 0.5 }
    pitch: 60.0
