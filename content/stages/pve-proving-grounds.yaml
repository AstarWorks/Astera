# Proving Grounds (ADR-0249): the sky-island arena of the `pve-waves` lane (ADR-0246 layout).
#
#                    north outpost (300,-30)
#                            |
#   west outpost ---- centre island ---- east outpost
#   (270,0)             (300,0)             (330,0)
#                            |
#                    south outpost (300,30)
#
# World `arenas` (void), top layer y=64, players stand at y=65. This stage lives at x=300 so it never overlaps the
# other arenas in the same world (example-arena z=0, siege-isles z=300, annihilation z=-300). Players start on the
# centre island; each wave appears on the four outposts (`mob-spawn-*`, y = 65) and walks across the bridges.
# PveWaveGameMode reads only the `mob-spawn-*` regions. Schema mirrors StageYamlConfig.kt.

id: pve-proving-grounds

display_name_key: astera.stage.pve-proving-grounds.name

world: arenas

layout:
  marker_version: 1
  seed: 20261025
  surface_y: 64
  kill_y: 30
  islands:
    - { id: center, kind: center, center: { x: 300, z: 0 }, radius: 18.0 }
    - { id: north, kind: outpost, center: { x: 300, z: -30 }, radius: 7.0 }
    - { id: south, kind: outpost, center: { x: 300, z: 30 }, radius: 7.0 }
    - { id: west, kind: outpost, center: { x: 270, z: 0 }, radius: 7.0 }
    - { id: east, kind: outpost, center: { x: 330, z: 0 }, radius: 7.0 }
  bridges:
    - { from: center, to: north, width: 3 }
    - { from: center, to: south, width: 3 }
    - { from: center, to: west, width: 3 }
    - { from: center, to: east, width: 3 }

regions:
  - name: full-arena
    min: { x: 255.0, y: 20.0, z: -45.0 }
    max: { x: 345.0, y: 140.0, z: 45.0 }

  - name: mob-spawn-north
    min: { x: 299.0, y: 65.0, z: -31.0 }
    max: { x: 301.0, y: 65.0, z: -29.0 }
  - name: mob-spawn-east
    min: { x: 329.0, y: 65.0, z: -1.0 }
    max: { x: 331.0, y: 65.0, z:  1.0 }
  - name: mob-spawn-south
    min: { x: 299.0, y: 65.0, z: 29.0 }
    max: { x: 301.0, y: 65.0, z: 31.0 }
  - name: mob-spawn-west
    min: { x: 269.0, y: 65.0, z: -1.0 }
    max: { x: 271.0, y: 65.0, z:  1.0 }

spawn_points:
  - team: red
    position: { x: 300.5, y: 65.0, z: -2.5 }
    yaw: 0.0
  - team: red
    position: { x: 298.5, y: 65.0, z: 0.5 }
    yaw: 0.0
  - team: red
    position: { x: 302.5, y: 65.0, z: 0.5 }
    yaw: 0.0
  - team: red
    position: { x: 300.5, y: 65.0, z: 2.5 }
    yaw: 0.0
  - team: blue
    position: { x: 300.5, y: 65.0, z: 0.5 }
    yaw: 0.0
  - role: lobby
    position: { x: 300.5, y: 65.0, z: 0.5 }
  - role: spectator
    position: { x: 300.5, y: 85.0, z: 0.5 }
    pitch: 60.0
