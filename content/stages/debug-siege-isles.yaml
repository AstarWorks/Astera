    - { id: blue, kind: base, team: blue, center: { x: 68, z: 300 }, radius: 22.0 }
    - { id: center, kind: center, center: { x: 0, z: 300 }, radius: 22.0 }
    - { id: north, kind: outpost, center: { x: 0, z: 244 }, radius: 14.0 }
    - { id: south, kind: outpost, center: { x: 0, z: 356 }, radius: 14.0 }
  bridges:
