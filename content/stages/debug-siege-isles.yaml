# Siege (objective) arena on sky islands (ADR-0246, replaces siege-flat; scaled up after the founder's playtest). One
# stage serves every siege lane (carry-tnt, capture-wool, steal-jewelry, carry-mini-tnt): each mode reads
# only the regions it knows by name, so they never get in each other's way. The lanes share this stage, so one siege
# match runs at a time.
#
#                       north island (0,-56)  wool-a
#                      /          |          \
#   red island ------ centre island (r22) ------ blue island
#   (-68,0) r22     tnt-spawn (0,-8)          (68,0) r22
#   core(-82,0)     wool-b (0,8)             core(82,0)
#   jewelry(-80,12)                             jewelry(80,12)
#                      \          |          /
#                       south island (0,56)  wool-c
#
# Cores and jewelry sit at the back of each team island behind a wall arc (the builder raises it behind every core);
# the spawn pad and the front lane to the centre stay open. Three routes between the bases: through the centre, or
# round the north / south island.
#
# Stage-local coordinates (the server places the stage in a world slot), top layer y=64, players stand at y=65.
#
# Region vocabulary (name -> mode):
#   base-<team>      the team's base zone                (carry-tnt delivery, steal-jewelry deposit)
#   jewelry-<team>   3x3 pedestal zone inside the base   (steal-jewelry)
#   tnt-spawn        where the TNT waits                 (carry-tnt)
#   wool-*           control points, any number          (capture-wool)
#   basket-<team>    the team's clam basket              (carry-mini-tnt)
#   clam-<n>         clam spawn spots, point-symmetric   (carry-mini-tnt)
# Zones span y 64 (the floor block, which the objective marker replaces) .. 70 so a standing/jumping player is inside.
# The builder puts a pedestal under every anchor; the modes place their markers at match start and remove them at the end.
# Schema mirrors plugin/match/.../application/config/StageYamlConfig.kt.

id: debug-siege-isles

display_name_key: astera.stage.siege-isles.name


layout:
  marker_version: 3
  seed: 20261024
  surface_y: 64
  relief: 0.0
  kill_y: 30
  islands:
    - { id: red, kind: base, team: red, center: { x: -68, z: 0 }, radius: 22.0 }
    - { id: blue, kind: base, team: blue, center: { x: 68, z: 0 }, radius: 22.0 }
    - { id: center, kind: center, center: { x: 0, z: 0 }, radius: 22.0 }
    - { id: north, kind: outpost, center: { x: 0, z: -56 }, radius: 14.0 }
    - { id: south, kind: outpost, center: { x: 0, z: 56 }, radius: 14.0 }
  bridges:
    - { from: red, to: center, width: 3 }
    - { from: blue, to: center, width: 3 }
    - { from: center, to: north, width: 3 }
    - { from: center, to: south, width: 3 }
    - { from: red, to: north, width: 3 }
    - { from: north, to: blue, width: 3 }
    - { from: red, to: south, width: 3 }
    - { from: south, to: blue, width: 3 }

