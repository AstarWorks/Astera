# Wave 7a (ADR-0036): Siege Warfare arena.
#
# Phase 1 PoC stage covering all 6 Siege game modes:
#   BattleLoyal      — free-for-all in the central zone.
#   BreakCore        — destroy the enemy's core block (deep in each base).
#   CarryTNT         — escort the master TNT from center to enemy core.
#   CarryMiniTNT     — collect mini-TNTs from drop points, detonate at enemy core.
#   CaptureWool      — steal the enemy's wool pedestal (each team's deepest base point).
#   StealJewelry     — capture the jewelry pedestal of the opposing base.
#
# Coordinate envelope (block coords; world default = "world"):
#   X axis:  -100 .. +100   (red base = -X, blue base = +X)
#   Y axis:    60 .. +160   (floor 60, ceiling 160 — vertical play headroom)
#   Z axis:  -100 .. +100   (north / south flanks for 8 Star Generators)
#
# Companion content (separate worker territory in Wave 7a):
#   - content/generators/siege-arena.yaml      — 8 Star Generator anchor positions
#                                                (region names below reserve the
#                                                lookup keys: generator_a..h).
#   - content/items/<mode-tokens>.yaml         — TNT / mini-TNT / wool / jewelry
#                                                item content (§C territory).
#   - content/game-modes/<mode>.yaml           — per-mode rules (§B territory).
#
# Schema mirrors plugin/match/.../application/config/StageYamlConfig.kt.
# Region `name` is informational only (Region domain type is a pure AABB);
# the names below are the contract by which other YAMLs reference points in
# this stage (e.g. a generator definition cites region `generator_a`).
#
# Phase 3+ fields (schematic, core HP) are not yet supported by the DTO and
# are intentionally omitted; this stage is hand-built by an admin or pasted
# in via FAWE outside the Astera content pipeline. Per Wave 7b+ scope a
# matching siege-arena.schem will land alongside.

id: siege-arena

display_name_key: astera.stage.siege-arena.name

# ─── Regions ──────────────────────────────────────────────────────────────
# All AABBs are inclusive on both ends; min componentwise <= max
# (Region's init block enforces this; bad coords fail-fast at load time).
regions:
  # ---- Full play volume (used by spectator culling, out-of-bounds checks) ----
  - name: full-arena
    min: { x: -100.0, y:  60.0, z: -100.0 }
    max: { x:  100.0, y: 160.0, z:  100.0 }

  # ---- Central zone (BattleLoyal kill-zone, KOTH capture region) ----
  - name: central-zone
    min: { x:  -15.0, y:  64.0, z:  -15.0 }
    max: { x:   15.0, y:  80.0, z:   15.0 }

  # ---- Team bases ----
  # Red occupies the western quarter; Blue occupies the eastern quarter.
  # Bases include both the surface fighting floor and the inner core room.
  - name: red-base
    min: { x: -100.0, y:  60.0, z:  -50.0 }
    max: { x:  -55.0, y: 100.0, z:   50.0 }
  - name: blue-base
    min: { x:   55.0, y:  60.0, z:  -50.0 }
    max: { x:  100.0, y: 100.0, z:   50.0 }

  # ---- Core block rooms (BreakCore objective volume + barrier-protected per ADR-0157) ----
  # The single block at the centre of each room is the BreakCore target;
  # surrounding region authorises wall placement / removal during a match.
  - name: red-core-room
    min: { x:  -95.0, y:  64.0, z:   -5.0 }
    max: { x:  -85.0, y:  72.0, z:    5.0 }
  - name: blue-core-room
    min: { x:   85.0, y:  64.0, z:   -5.0 }
    max: { x:   95.0, y:  72.0, z:    5.0 }

  # ---- Jewelry pedestals (StealJewelry objective) ----
  # Single-block AABBs at each team's deepest pedestal position.
  - name: jewelry-red
    min: { x:  -90.0, y:  66.0, z:    0.0 }
    max: { x:  -90.0, y:  66.0, z:    0.0 }
  - name: jewelry-blue
    min: { x:   90.0, y:  66.0, z:    0.0 }
    max: { x:   90.0, y:  66.0, z:    0.0 }

  # ---- Wool pedestals (CaptureWool objective) ----
  # Offset from jewelry on the +Z axis so two modes can co-exist on one stage.
  - name: wool-red
    min: { x:  -90.0, y:  66.0, z:   10.0 }
    max: { x:  -90.0, y:  66.0, z:   10.0 }
  - name: wool-blue
    min: { x:   90.0, y:  66.0, z:   10.0 }
    max: { x:   90.0, y:  66.0, z:   10.0 }

  # ---- TNT spawn (CarryTNT — master TNT spawns at central pedestal) ----
  - name: tnt-spawn
    min: { x:   -2.0, y:  68.0, z:   -2.0 }
    max: { x:    2.0, y:  70.0, z:    2.0 }

  # ---- Mini-TNT drop zones (CarryMiniTNT — 5 collection points) ----
  # Spread across the mid-field so neither team has a positional monopoly.
  - name: mini-tnt-zone-a
    min: { x:  -40.0, y:  64.0, z:  -40.0 }
    max: { x:  -30.0, y:  72.0, z:  -30.0 }
  - name: mini-tnt-zone-b
    min: { x:  -40.0, y:  64.0, z:   30.0 }
    max: { x:  -30.0, y:  72.0, z:   40.0 }
  - name: mini-tnt-zone-c
    min: { x:   -5.0, y:  64.0, z:   -5.0 }
    max: { x:    5.0, y:  72.0, z:    5.0 }
  - name: mini-tnt-zone-d
    min: { x:   30.0, y:  64.0, z:  -40.0 }
    max: { x:   40.0, y:  72.0, z:  -30.0 }
  - name: mini-tnt-zone-e
    min: { x:   30.0, y:  64.0, z:   30.0 }
    max: { x:   40.0, y:  72.0, z:   40.0 }

  # ---- Star Generator anchor regions ────────────────────────────────────
  # 8 single-point AABBs reserved for content/generators/siege-arena.yaml
  # (Wave 7a §B). Anchor coords map a generator id 1:1 to a position; the
  # generator YAML cites region name (e.g. `anchor: generator_a`).
  # Layout (top-down):
  #     -Z (north)
  #   A         B          (red side outer corridor)
  #   C         D          (mid-field north)
  #   ─── origin ───
  #   E         F          (mid-field south)
  #   G         H          (blue side outer corridor)
  #     +Z (south)
  - name: generator_a
    min: { x:  -70.0, y:  66.0, z:  -70.0 }
    max: { x:  -70.0, y:  66.0, z:  -70.0 }
  - name: generator_b
    min: { x:   70.0, y:  66.0, z:  -70.0 }
    max: { x:   70.0, y:  66.0, z:  -70.0 }
  - name: generator_c
    min: { x:  -40.0, y:  66.0, z:  -20.0 }
    max: { x:  -40.0, y:  66.0, z:  -20.0 }
  - name: generator_d
    min: { x:   40.0, y:  66.0, z:  -20.0 }
    max: { x:   40.0, y:  66.0, z:  -20.0 }
  - name: generator_e
    min: { x:  -40.0, y:  66.0, z:   20.0 }
    max: { x:  -40.0, y:  66.0, z:   20.0 }
  - name: generator_f
    min: { x:   40.0, y:  66.0, z:   20.0 }
    max: { x:   40.0, y:  66.0, z:   20.0 }
  - name: generator_g
    min: { x:  -70.0, y:  66.0, z:   70.0 }
    max: { x:  -70.0, y:  66.0, z:   70.0 }
  - name: generator_h
    min: { x:   70.0, y:  66.0, z:   70.0 }
    max: { x:   70.0, y:  66.0, z:   70.0 }

  # ---- Barrier regions (ADR-0157 / Wave 5d) ─────────────────────────────
  # Wrap each core room and pedestal in a barrier shell so the BarrierGateway
  # can deny block-edits to non-owning teams during the match. The name is
  # the contract the barrier-policy YAML (Wave 6c §E) joins on.
  - name: barrier-red-core
    min: { x: -100.0, y:  60.0, z:  -10.0 }
    max: { x:  -80.0, y:  80.0, z:   10.0 }
  - name: barrier-blue-core
    min: { x:   80.0, y:  60.0, z:  -10.0 }
    max: { x:  100.0, y:  80.0, z:   10.0 }
  - name: barrier-jewelry-red
    min: { x:  -92.0, y:  64.0, z:   -2.0 }
    max: { x:  -88.0, y:  70.0, z:    2.0 }
  - name: barrier-jewelry-blue
    min: { x:   88.0, y:  64.0, z:   -2.0 }
    max: { x:   92.0, y:  70.0, z:    2.0 }

# ─── Spawn points ─────────────────────────────────────────────────────────
# Role-tagged teleport targets consumed by MatchSpawnUseCase / RespawnUseCase
# (Wave 5o / ADR-0081). Schema: { faction, position, yaw?, pitch?, world? }.
#
# Layout:
#   - attacker (red team) — 8 spawns along the red base front line, facing east (+X), yaw 90.
#   - defender (blue team) — 8 spawns along the blue base front line, facing west (-X), yaw 270.
#   - lobby — single elevated pre-match staging point above central zone.
#   - spectator — single elevated overlook for non-participants.
#
# 6 game modes reuse the same flat list; the spawn selector strategy filters
# by faction and applies mode-specific strategy (FurthestFromEnemies for
# CarryTNT escort, CycleRotation for BattleLoyal, etc.).
spawn_points:
  # ---- Attacker (red team) — yaw 90 (facing +X / blue base) ----
  - faction: attacker
    position: { x: -75.0, y: 65.0, z:   0.0 }
    yaw: 90.0
  - faction: attacker
    position: { x: -75.0, y: 65.0, z: -20.0 }
    yaw: 90.0
  - faction: attacker
    position: { x: -75.0, y: 65.0, z:  20.0 }
    yaw: 90.0
  - faction: attacker
    position: { x: -80.0, y: 65.0, z: -35.0 }
    yaw: 90.0
  - faction: attacker
    position: { x: -80.0, y: 65.0, z:  35.0 }
    yaw: 90.0
  - faction: attacker
    position: { x: -65.0, y: 65.0, z: -10.0 }
    yaw: 90.0
  - faction: attacker
    position: { x: -65.0, y: 65.0, z:  10.0 }
    yaw: 90.0
  - faction: attacker
    position: { x: -90.0, y: 67.0, z:   0.0 }
    yaw: 90.0

  # ---- Defender (blue team) — yaw 270 (facing -X / red base) ----
  - faction: defender
    position: { x:  75.0, y: 65.0, z:   0.0 }
    yaw: 270.0
  - faction: defender
    position: { x:  75.0, y: 65.0, z: -20.0 }
    yaw: 270.0
  - faction: defender
    position: { x:  75.0, y: 65.0, z:  20.0 }
    yaw: 270.0
  - faction: defender
    position: { x:  80.0, y: 65.0, z: -35.0 }
    yaw: 270.0
  - faction: defender
    position: { x:  80.0, y: 65.0, z:  35.0 }
    yaw: 270.0
  - faction: defender
    position: { x:  65.0, y: 65.0, z: -10.0 }
    yaw: 270.0
  - faction: defender
    position: { x:  65.0, y: 65.0, z:  10.0 }
    yaw: 270.0
  - faction: defender
    position: { x:  90.0, y: 67.0, z:   0.0 }
    yaw: 270.0

  # ---- Lobby (pre-match staging) ----
  - faction: lobby
    position: { x: 0.0, y: 100.0, z: 0.0 }
    pitch: 30.0

  # ---- Spectator (overlook camera) ----
  - faction: spectator
    position: { x: 0.0, y: 150.0, z: 0.0 }
    pitch: 75.0
