# Annihilation arena (WP9): 3-team (red / blue / yellow) free-for-all on the
# docker playtest superflat world (grass top y=-61, players stand at y=-60).
# Used by the `annihilation` lane of content/matchmaking/queue.yaml.
#
# Layout: three bases on a triangle of radius ~45 around the origin, each
# facing the centre. Per base: 4 spawns (a small cross, so teammates spread) and
# the 3 Nexus pillars (tier 1 outer .. tier 3 Nexus proper) on the line from
# the base towards the centre, 4 / 6 / 8 blocks forward of the base's first spawn.
# `pillars:` entries are block coordinates in `world`; the match places `block`
# there while the pillar stands (WP10). Tier 3 is the beefier Nexus proper.
# Schema mirrors plugin/match/.../application/config/StageYamlConfig.kt.

id: annihilation-arena

display_name_key: astera.stage.annihilation-arena.name

# Bukkit world (default "world" = the server's main world).
world: world

regions:
  - name: full-arena
    min: { x: -70.0, y: -60.0, z: -70.0 }
    max: { x:  70.0, y: -30.0, z:  70.0 }
  - name: center
    min: { x: -8.0, y: -60.0, z: -8.0 }
    max: { x:  8.0, y: -57.0, z:  8.0 }

pillars:
  - team: red
    tier: 1
    position: { x: 0.0, y: -60.0, z: -41.0 }
    block: minecraft:obsidian
  - team: red
    tier: 2
    position: { x: 0.0, y: -60.0, z: -39.0 }
    block: minecraft:crying_obsidian
  - team: red
    tier: 3
    position: { x: 0.0, y: -60.0, z: -37.0 }
    block: minecraft:beacon
    hp: 800
  - team: blue
    tier: 1
    position: { x: 36.0, y: -60.0, z: 20.0 }
    block: minecraft:obsidian
  - team: blue
    tier: 2
    position: { x: 34.0, y: -60.0, z: 19.0 }
    block: minecraft:crying_obsidian
  - team: blue
    tier: 3
    position: { x: 32.0, y: -60.0, z: 18.0 }
    block: minecraft:beacon
    hp: 800
  - team: yellow
    tier: 1
    position: { x: -36.0, y: -60.0, z: 20.0 }
    block: minecraft:obsidian
  - team: yellow
    tier: 2
    position: { x: -34.0, y: -60.0, z: 19.0 }
    block: minecraft:crying_obsidian
  - team: yellow
    tier: 3
    position: { x: -32.0, y: -60.0, z: 18.0 }
    block: minecraft:beacon
    hp: 800

