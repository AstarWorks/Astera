# Annihilation arena (3 teams: red / blue / yellow) on sky islands (ADR-0246). Used by the `annihilation` lane of
# content/matchmaking/queue.yaml.
#
# Three team islands on a triangle of radius ~33 around the centre island (0,-300); bridges run from each team
# island to the centre. Per base: 4 spawns (behind the pillars) and the 3 Nexus pillars (tier 1 outer .. tier 3
# Nexus proper) on the line from the spawns towards the centre. `pillars:` entries are block coordinates in `world`
# one above the island top (y=65); the match places `block` there while the pillar stands (WP10). The builder lays a
# team-coloured footing under each pillar. Tier 3 is the beefier Nexus proper.
#
# World `arenas` (void, created by Astera), top layer y=64, players stand at y=65. This stage lives at z=-300 so it
# never overlaps the other arenas in the same world.
# Schema mirrors plugin/match/.../application/config/StageYamlConfig.kt.

id: annihilation-arena

display_name_key: astera.stage.annihilation-arena.name

world: arenas

layout:
  marker_version: 1
  seed: 20261025
  surface_y: 64
  kill_y: 30
  islands:
    - { id: red, kind: base, team: red, center: { x: 0, z: -333 }, radius: 13.0 }
    - { id: blue, kind: base, team: blue, center: { x: 29, z: -284 }, radius: 13.0 }
    - { id: yellow, kind: base, team: yellow, center: { x: -29, z: -284 }, radius: 13.0 }
    - { id: center, kind: center, center: { x: 0, z: -300 }, radius: 9.0 }
  bridges:
    - { from: red, to: center, width: 3 }
    - { from: blue, to: center, width: 3 }
    - { from: yellow, to: center, width: 3 }

