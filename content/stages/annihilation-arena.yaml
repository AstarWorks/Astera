# Annihilation arena (3 teams: red / blue / yellow) on sky islands (ADR-0246; scaled up after the founder's playtest).
# Used by the `annihilation` lane of content/matchmaking/queue.yaml.
#
#                        red (0,-364)
#                 /                      \                   Team islands (r22) sit 64 blocks from the centre island
#     yellow-red flank                red-blue flank         (0,-300, r24) on a triangle; a bridge runs from each
#        (-68,-339)                    (68,-339)             base to the centre. Three small flank islands (r11)
#            |                                |              sit between the bases: every pair of teams has a
#   yellow (-55,-268) ---- centre ---- blue (55,-268)        second, longer route past the centre (base - flank -
#                 \       (0,-300)      /                    base).
#                    yellow-blue flank
#                        (0,-222)
#
# Per base: 4 spawns behind the pillars (12 blocks back from the island centre, facing the centre) and the 3 Nexus
# pillars spread across the island: tier 1 and tier 2 (the outer pillars) stand 9 blocks forward and 9 to either
# side of the island centre; tier 3, the Nexus proper (beacon), stands just behind the centre, 14 blocks from each
# of the others. `pillars:` entries are block coordinates in `world` one above the island top (y=65); the match
# places `block` there while the pillar stands (WP10). The builder lays a team-coloured footing under each pillar.
#
# World `arenas` (void, created by Astera), top layer y=64, players stand at y=65. This stage lives at z=-300 so it
# never overlaps the other arenas in the same world.
# Schema mirrors plugin/match/.../application/config/StageYamlConfig.kt.

id: annihilation-arena

display_name_key: astera.stage.annihilation-arena.name

world: arenas

layout:
  marker_version: 2
  seed: 20261025
  surface_y: 64
  kill_y: 30
  islands:
    - { id: red, kind: base, team: red, center: { x: 0, z: -364 }, radius: 22.0 }
    - { id: blue, kind: base, team: blue, center: { x: 55, z: -268 }, radius: 22.0 }
    - { id: yellow, kind: base, team: yellow, center: { x: -55, z: -268 }, radius: 22.0 }
    - { id: center, kind: center, center: { x: 0, z: -300 }, radius: 24.0 }
    - { id: flank-red-blue, kind: outpost, center: { x: 68, z: -339 }, radius: 11.0 }
    - { id: flank-blue-yellow, kind: outpost, center: { x: 0, z: -222 }, radius: 11.0 }
    - { id: flank-yellow-red, kind: outpost, center: { x: -68, z: -339 }, radius: 11.0 }
  bridges:
    - { from: red, to: center, width: 3 }
    - { from: blue, to: center, width: 3 }
    - { from: yellow, to: center, width: 3 }
    - { from: red, to: flank-red-blue, width: 3 }
    - { from: flank-red-blue, to: blue, width: 3 }
    - { from: blue, to: flank-blue-yellow, width: 3 }
    - { from: flank-blue-yellow, to: yellow, width: 3 }
    - { from: yellow, to: flank-yellow-red, width: 3 }
    - { from: flank-yellow-red, to: red, width: 3 }

