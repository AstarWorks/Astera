# Persona weapon #9 (ADR-0230): gold clockwork staff. Charge stack (caster) built by crescents and spins,
# spent by the beam. Four bindings: S1 twin arcs, S2 clockwork spin, S3 beam litany, DEF counter-seal.

id: orrery-staff

material: BREEZE_ROD

name:
  ja: "<gold>天球儀の杖</gold>"
  en: "<gold>Orrery Staff</gold>"
lore:
  ja:
    - "<gray>左クリック: 双弧（2連・充填+2）</gray>"
    - "<gray>右クリック: 時計仕掛けの旋回（3連・充填+3）</gray>"
    - "<gray>スニーク + 右クリック: 連禱の光線（充填を消費）</gray>"
    - "<gray>スニーク + 左クリック: 返しの封印（回避・充填+2）</gray>"
    - "<dark_gray>rarity: epic / level: 4</dark_gray>"
