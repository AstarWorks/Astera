# Wave _items-1 (ADR-0073) — Item-centric demo definition.
# Phase 2 starter: wand archetype, high damage / long CD.

id: example-wand

material: BLAZE_ROD

name:
  ja: "<light_purple>サンプルワンド</light_purple>"
  en: "<light_purple>Example Wand</light_purple>"
lore:
  ja:
    - "<gray>Phase 2 スターター: 魔法アーキタイプ</gray>"
    - "<gray>大威力・長 CD (3 秒)</gray>"
    - "<dark_gray>rarity: rare / level: 3</dark_gray>"
  en:
    - "<gray>Phase 2 starter: wand archetype</gray>"
    - "<gray>High damage, long CD (3s)</gray>"
    - "<dark_gray>rarity: rare / level: 3</dark_gray>"

rarity: rare
level_requirement: 3

attributes:
  attack_damage: 2.0
  attack_speed: 1.0

equip_slot: mainhand

skills:
  - trigger: left_click
    skill_id: example-mana-skill
    # Wave _skills-2 (ADR-0077) demo: the wand cosmetically adds a magic
    # whoosh to the cast phase and an electric splash on hit_entity, so
    # the same example-mana-skill projectile looks distinctly "wand-cast"
    # without forking the skill spec.
    phase_overrides:
      cast_append:
        - type: spawn_particle
          targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 1.4, z: 0.3 } } }
          particle_id: example-burst
      hit_entity_append:
        - type: spawn_particle
          targets: { type: hit_location }
          particle_id: example-burst

pdc_tags:
  astera:rarity: rare
