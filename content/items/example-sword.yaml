# Wave _items-1 (ADR-0073) — Item-centric demo definition.
# 1 file = 1 item. Inline i18n + PvP attributes + skill bindings.

id: example-sword

material: IRON_SWORD
# custom_model_data: 1001     # uncomment when resource pack model is added

name:
  ja: "<gold>サンプルソード</gold>"
  en: "<gold>Example Sword</gold>"
lore:
  ja:
    - "<gray>Phase 1 のテスト用武器</gray>"
    - "<gray>スニーク + 右クリックでバフ</gray>"
    - "<dark_gray>rarity: common / level: 1</dark_gray>"
  en:
    - "<gray>Phase 1 demo weapon</gray>"
    - "<gray>Sneak + right-click to buff</gray>"
    - "<dark_gray>rarity: common / level: 1</dark_gray>"

rarity: common
level_requirement: 1

attributes:
  attack_damage: 8.0
  attack_speed: 1.6

equip_slot: mainhand

skills:
  - trigger: sneak_right
    skill_id: example-charge
    # Wave _skills-2 (ADR-0077) demo: this binding appends an extra
    # particle burst to the buff's cast phase. The skill itself emits one
    # particle; the item-bound override piggybacks a second on top so the
    # sword's authoring choice (more glow) doesn't require editing the
    # shared skill YAML.
    phase_overrides:
      cast_append:
        - type: spawn_particle
          targets: { type: caster }
          particle_id: example-burst

pdc_tags:
  astera:rarity: common
