# Persona weapon (ADR-0230): Vendetta Bayonet -- a crime-boss duelist's rifle used as a polearm.
# Crimson / magenta / orange. Six rounds (the gun skills spend them), the bayonet is free; the
# stack is Tremor on the target. Shift+Q = reload.
#   left-click       S1 Bayonet Triple    dash, 2 crescents + thrust, +2 tremor            (free)
#   right-click      S2 Rack Volley       ghost rifle rack, 8 beams, hop back              (2 rounds)
#   sneak + right    S3 Reckoning Salvo   planted telegraph, 3 beats, eats all tremor     (3 rounds)
#   sneak + left     DEF Hairpin Parry    invulnerable slip-through riposte                (free)

id: vendetta-rifle

material: LEATHER_HORSE_ARMOR

name:
  ja: "<#ff3d7f>報復の銃剣</#ff3d7f>"
  en: "<#ff3d7f>Vendetta Bayonet</#ff3d7f>"
lore:
  ja:
    - "<gray>左クリック: 銃剣の三連（踏み込み・二連斬・零距離突き）</gray>"
    - "<gray>右クリック: 銃架の斉射（弾2発・後方へ跳ぶ）</gray>"
    - "<gray>スニーク + 右クリック: 報復の一斉掃射（弾3発・震動を消費）</gray>"
    - "<gray>スニーク + 左クリック: ヘアピン・パリィ（無敵の反撃）</gray>"
    - "<gray>Shift+Q: リロード</gray>"
    - "<dark_gray>rarity: epic / level: 4</dark_gray>"
  en:
    - "<gray>Left-click: Bayonet Triple (dash, two cuts, point-blank thrust)</gray>"
    - "<gray>Right-click: Rack Volley (2 rounds, hops back)</gray>"
    - "<gray>Sneak + right-click: Reckoning Salvo (3 rounds, eats tremor)</gray>"
    - "<gray>Sneak + left-click: Hairpin Parry (invulnerable riposte)</gray>"
    - "<gray>Shift+Q: reload</gray>"
    - "<dark_gray>rarity: epic / level: 4</dark_gray>"

rarity: epic
level_requirement: 4

attributes:
  attack_damage: 1.0
  attack_speed: 4.0

equip_slot: mainhand

resource_type: ammo
resource_cost_per_use: 1
resource_max_pool: 6
resource_reloadable: true

skills:
  - trigger: left_click
    skill_id: vendetta-rifle-s1
  - trigger: right_click
    skill_id: vendetta-rifle-s2
  - trigger: sneak_right
    skill_id: vendetta-rifle-s3
  - trigger: sneak_left
    skill_id: vendetta-rifle-def
  - trigger: sneak_drop
    skill_id: pistol-reload

pdc_tags:
  astera:rarity: epic
