# WP1 gun roster: right-click = shot, hold = auto-repeat (same shot, throttled
# by the binding's cooldown override), drop key (Q) = reload (the drop is cancelled).
# WP2: 12-round magazine (1 ammo per shot), refilled by the reload skill.

id: pistol

material: IRON_HORSE_ARMOR

name:
  ja: "<aqua>ピストル</aqua>"
  en: "<aqua>Pistol</aqua>"
lore:
  ja:
    - "<gray>右クリック: 射撃</gray>"
    - "<gray>Q: リロード</gray>"
  en:
    - "<gray>Right-click: shoot</gray>"
    - "<gray>Q: reload</gray>"

rarity: common
level_requirement: 1

attributes:
  attack_damage: 1.0
  attack_speed: 4.0

equip_slot: mainhand

# Resource pool (WP2): the pistol spends ammo; the magazine only refills via reload.
resource_type: ammo
resource_cost_per_use: 1
resource_max_pool: 12
resource_reloadable: true

skills:
  - trigger: right_click
    skill_id: pistol-shot
    cooldown_override_ticks: 6    # 0.3s between shots; wins over the skill's own cooldown_ticks
  - trigger: drop
    skill_id: pistol-reload

pdc_tags:
  astera:rarity: common
