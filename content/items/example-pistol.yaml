# Wave _items-1 (ADR-0073) — Item-centric demo definition.
# Phase 2 starter: gun archetype, rapid fire (0.3s cooldown via binding override).

id: example-pistol

material: CROSSBOW
model: example-pistol

name:
  ja: "<aqua>サンプルピストル</aqua>"
  en: "<aqua>Example Pistol</aqua>"
lore:
  ja:
    - "<gray>Phase 2 スターター: 銃アーキタイプ</gray>"
    - "<gray>連射可能 (CD 0.3 秒)</gray>"
    - "<dark_gray>rarity: common / level: 1</dark_gray>"
  en:
    - "<gray>Phase 2 starter: gun archetype</gray>"
    - "<gray>Rapid fire (0.3s cooldown)</gray>"
    - "<dark_gray>rarity: common / level: 1</dark_gray>"

rarity: common
level_requirement: 1

attributes:
  attack_damage: 4.0
  attack_speed: 4.0

equip_slot: mainhand

skills:
  - trigger: left_click
    skill_id: example-blast
    cooldown_override_ticks: 6    # 0.3s @ 20 TPS
    # Wave _skills-2 (ADR-0077) demo: the pistol piles on a short ignite
    # against any victim of example-blast's hit_entity phase, so the
    # base skill stays usable from other bindings without the burn.
    phase_overrides:
      hit_entity_append:
        - type: apply_status
          targets: { kind: target }
          status_id: example-burn
          effect_duration_ticks: { kind: literal, value: 40 }

pdc_tags:
  astera:rarity: common
