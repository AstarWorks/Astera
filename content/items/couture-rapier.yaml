# Persona weapon (ADR-0221): Couturier's Rapier. Poise caster -- the string builds poise (+1 per hit),
# the gilded salvo spends it. Left-click = stitch string, right-click = hemline rush (dash-through),
# sneak + right-click = gilded salvo (finisher), sneak + left-click = fitting step (defence).

id: couture-rapier

material: IRON_SWORD

name:
  ja: "<aqua>仕立屋の細剣</aqua>"
  en: "<aqua>Couturier's Rapier</aqua>"
lore:
  ja:
    - "<gray>左クリック: 縫い針（三連突き・poise +3）</gray>"
    - "<gray>右クリック: 裾払いの突進（無敵の突進・X字斬り）</gray>"
    - "<gray>スニーク + 右クリック: 金糸の連刺（poise を消費する大技）</gray>"
    - "<gray>スニーク + 左クリック: 仮縫いの退歩（後退・poise +2）</gray>"
    - "<dark_gray>rarity: epic / level: 4</dark_gray>"
  en:
    - "<gray>Left-click: basting stitch (3-hit string, +3 poise)</gray>"
    - "<gray>Right-click: hemline rush (invulnerable dash, scissor X)</gray>"
    - "<gray>Sneak + right-click: gilded salvo (spends poise)</gray>"
    - "<gray>Sneak + left-click: fitting step (hop back, +2 poise)</gray>"
    - "<dark_gray>rarity: epic / level: 4</dark_gray>"

rarity: epic
level_requirement: 4

attributes:
  attack_damage: 3.0
  attack_speed: 3.0

equip_slot: mainhand

resource_type: energy
resource_cost_per_use: 8

skills:
  - trigger: left_click
    skill_id: couture-rapier-s1
  - trigger: right_click
    skill_id: couture-rapier-s2
  - trigger: sneak_right
    skill_id: couture-rapier-s3
  - trigger: sneak_left
    skill_id: couture-rapier-def

pdc_tags:
  astera:rarity: epic
