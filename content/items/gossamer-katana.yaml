# Persona weapon (ADR-0221): Gossamer Katana. Bleed -- the cuts leave bleed on the target, the web
# cyclone's last cut spends it. Left-click = thread cut, right-click = unseen line (delayed iaido),
# sneak + right-click = web cyclone (finisher), sneak + left-click = spun ward (defence).

id: gossamer-katana

material: DIAMOND_SWORD

name:
  ja: "<blue>蜘糸の太刀</blue>"
  en: "<blue>Gossamer Katana</blue>"
lore:
  ja:
    - "<gray>左クリック: 糸切り（二連撃・出血）</gray>"
    - "<gray>右クリック: 居合の一筋（20tick 後に全弾着弾）</gray>"
    - "<gray>スニーク + 右クリック: 巣廻し・旋（出血を断ち切る大技）</gray>"
    - "<gray>スニーク + 左クリック: 糸結界（後退・近くの敵を絡め取る）</gray>"
    - "<dark_gray>rarity: epic / level: 4</dark_gray>"
  en:
    - "<gray>Left-click: thread cut (2 hits, bleed)</gray>"
    - "<gray>Right-click: unseen line (delayed draw, all hits at once)</gray>"
    - "<gray>Sneak + right-click: web cyclone (spends bleed)</gray>"
    - "<gray>Sneak + left-click: spun ward (hop back, snag nearby foes)</gray>"
    - "<dark_gray>rarity: epic / level: 4</dark_gray>"

rarity: epic
level_requirement: 4

attributes:
  attack_damage: 3.0
  attack_speed: 3.0

equip_slot: mainhand

resource_type: energy
resource_cost_per_use: 8

skills:
  - trigger: left_click
    skill_id: gossamer-katana-s1
  - trigger: right_click
    skill_id: gossamer-katana-s2
  - trigger: sneak_right
    skill_id: gossamer-katana-s3
  - trigger: sneak_left
    skill_id: gossamer-katana-def

pdc_tags:
  astera:rarity: epic
