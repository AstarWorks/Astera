# Wave 5lobby-content (ADR-0119) — lobby hotbar menu compass.
#
# Placed in hotbar slot 0 on lobby (re-)join by
# `BindCompassOnLobbyJoinListener`. Today the user opens the MainMenu via
# `/astera menu` (Wave 5wireup §G11); Wave 6b will wire a right-click on
# this item to the same GUI via `OpenMainMenuOnCompassClickListener` once
# the BukkitEventAdapter learns to emit the matching event.
#
# Intentionally has no `skills:` block — see the listener's KDoc for why.

