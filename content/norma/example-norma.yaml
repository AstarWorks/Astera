# Wave 2 R1.a starter: Daily-Kills Norma example.
#
# Defines a daily mission ("kill 5 players") that grants STAR currency + XP
# on completion. The Stats plugin emits a MissionCompleted domain event when
# the target counter reaches `count`; Economy / Level plugins subscribe to
# grant the reward.

id: daily-killer-1

# i18n key resolved via :plugin:core's MessageKey lookup.
display_name_key: astera.norma.daily-killer-1.name

# One of: daily | weekly | seasonal (case-insensitive).
period: daily

# Mission target: polymorphic on `type`. Supported variants:
#   - type: kills        count: <Long>
#   - type: damage       amount: <Long>
#   - type: match_wins   count: <Long>
#   - type: xp_gain      amount: <Long>
target:
  type: kills
  count: 5

# Reward granted on completion. currency_id is opaque to Stats — the
# Economy plugin resolves it (e.g. "STAR", "GOLD"). Omit currency_id for
# XP-only rewards.
reward:
  currency_id: STAR
  currency_amount: 50
  xp: 100
