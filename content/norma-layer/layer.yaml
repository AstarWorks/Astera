# The Norma layer: a standard layer of EVERY game mode, not a mode of its own (founder 2026-10-26, MODE-15).
#
# What the layer is (docs/game-design/stars-and-norma.md): star generators pop stars on the stage, a death bursts part of the victim's carried
# stars on the ground and a kill on a leader pays the killer a bounty, every player climbs Norma levels with ONE goal per level chosen in the picker (carry stars
# or make kills), and the level-up is presented to the whole match. Everything is dropped at match end.
#
# These are the DEFAULTS. A game mode overrides any key in its own `default_config` (content/game-modes/<id>.yaml);
# the common override is `time_limit_seconds: "0"` (the mode has its own clock). Norma levels are in-match power
# progression (a level unlocks weapon rarities, `rarity_levels` below; ADR-0292) and never win a match. `norma_layer: "false"` takes a mode
# out of the layer altogether (PvE waves: co-op against mobs, no player-vs-player race).
# Reload: `/astera reload norma-layer`.
defaults:
  # Whether the layer runs in the mode at all.
  norma_layer: "true"

  # Time limit (seconds of ACTIVE time); 0 = no limit (the mode brings its own clock). When it runs out the teams
  # are ranked by: the mode's own objective score (if the mode has one), then the stars
  # carried, then the kills. Still tied = draw.
  time_limit_seconds: "600"

  # Norma levels: every player starts at level 1 and clears each level with ONE goal of their choice
  # (`/astera norma choose star|kill`, STAR by default): carry norma_stars_goal[level] stars (not consumed) or make
  # norma_kills_goal[level] kills at that level. Lists are indexed by the level being cleared.
  # Meeting the goal only makes the player READY (action bar + sidebar); the level rises at the Norma check
  # (automatic on standing in the OWN team base while ready; `/astera norma check` for bots/tests) while the goal still holds (stars lost on a death un-ready).
  # Pace (docs/game-design/stars-and-norma.md "Pace"): the supply grows over the match (star_supply_* below) and the
  # measured per-minute table and level times live in that doc (StarEconomyScenarioTest prints them). Annihilation:
  # Mid waves + small flank and per-team base generators put 100 stars ~7-8 min in for an active team player.
  norma_max_level: "5"
  norma_stars_goal: "10,30,60,100"
  norma_kills_goal: "1,2,3,4"
  # The base zone of the Norma check: blocks (horizontal) around the centroid of the team's spawn points (stage YAML).
  norma_check_radius: "16"

  # Star economy (ADR-0318, founder 2026-11-01; supersedes the 2026-10-29 time-ramp multiplier). The supply is a BUDGET:
  #   budget(t, N) = star_supply_per_player_minute x ramp(t) x N_alive   (stars per minute, whole match)
  # ramp(t) is piecewise linear over minutes ("minute:multiplier,..."). Every source draws from the budget and has its own
  # per-source cap (its star_share_* of the budget; per player per minute for mining / blocks / caches), so 3, 6 or 12 players
  # earn about the same each. Timer generators (flank / base, `spots:`) are a MINOR source (share <= 0.15, enforced by the loader).
  star_supply_per_player_minute: "16"
  star_supply_ramp: "0:0.25,1:0.75,3:1.0,11:1.4,16:1.6"
  star_share_spot: "0.12"
  star_share_mining: "0.22"
  star_share_blocks: "0.20"
  star_share_cache: "0.18"
  star_share_wave: "0.24"
  star_share_bounty: "0.04"
  # Actions: stars per ore-node mine and per listed block break (annihilation matches; Material names).
  star_mining_per_node: "1"
  star_block_per_break: "1"
  star_blocks: "COAL_ORE,DEEPSLATE_COAL_ORE,IRON_ORE,DEEPSLATE_IRON_ORE,GOLD_ORE,LAPIS_ORE,REDSTONE_ORE,GLOWSTONE,OBSIDIAN,OAK_LOG,SPRUCE_LOG,BIRCH_LOG,BARREL,CHEST,CRAFTING_TABLE"

  # Death rule: star_death_ground_share of the victim's carried stars burst on the ground (anyone can pick them up), the
  # victim keeps the rest; nothing is destroyed and nothing goes straight to the killer. Bounty = star_bounty_rate x (victim carried - roster average), capped at
  # star_bounty_cap, paid from the bounty share of the budget (a kill on the leader pays more than one on a trailing player).
  star_death_ground_share: "0.5"
  star_bounty_rate: "1.0"
  star_bounty_cap: "25"

  # F3-5 death / respawn (seconds): death-screen countdown, killer death-cam length, post-respawn invulnerability
  # (ends on attack).
  respawn_delay_seconds: "5"
  death_cam_seconds: "2"
  spawn_protection_seconds: "3"

  # Weapon restriction (RTM-style MAIN + SUB), a layer default so EVERY mode keeps the 2-weapon cap (MODE-15 follow-up):
  # at most 1 weapon per family (gun / sword / staff) and 2 in total. Extra weapons are set aside on match entry
  # (restored at match end) and further pickups are refused. A mode overrides it, or sets "" to lift the cap.
  weapon_limits: "gun:1,sword:1,staff:1,total:2"

  # Weapon rarity gate (ADR-0292): `rarity:level` pairs. A weapon is usable (attacks and every skill) once its holder's
  # in-match Norma level reaches the level its item `rarity:` opens at; below it the use is refused (deny sound, action bar
  # "Lv N で <rarity> 解放") but the weapon stays holdable. Missing rarities keep the default ladder; a mode may override.
  rarity_levels: "common:1,uncommon:2,rare:3,epic:4,legendary:5"
