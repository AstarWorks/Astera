# Queue -> match tuning (WP8). Schema: plugin/match/.../application/config/QueueYamlConfig.kt
# Reload with `/astera reload matchmaking` (edits apply on the next queue check).

# How often the queues are checked (seconds).
check_interval_seconds: 1

# `kind` marks what a lane is for: pvp (default: every team needs a player, no solo
# start), pve or training (a solo start is fine). pvp floors are clamped to >= teams on load.

# Wait between "enough players queued" and forming the match. Restarts when a
# queued player leaves; a full lane (teams x players_per_team) starts at once.
queue_countdown_seconds: 10

# In-arena COUNTDOWN phase length before the match turns ACTIVE.
match_countdown_seconds: 10

lanes:
  # A lane id is a game-mode id and joins as `custom:<id>` (e.g. annihilation). `battle-loyal` is the
  # standard 2-team lane (the default when a call site names no mode).
  # PvP: at least one player per team (never a solo start). The admin
  # force-start in the panel bypasses this floor.

  # Annihilation: 3 teams (red / blue / yellow), one sky island each around a centre island
  # (content/stages/annihilation-arena.yaml). One player per team: three sides, never a solo start.
  - id: annihilation
    stage: annihilation-arena
    teams: 3
    players_per_team: 4
    min_players: 3
    kind: pvp

  # Siege / objective modes (WP11) on sky islands. A stage hosts one match at a time and stages are fixed
  # coordinates in the `arenas` world (no per-match instancing yet), so every siege lane has its OWN copy of
  # siege-isles, 800 blocks apart on z (content/stages/siege-isles-<mode>.yaml): the six lanes run concurrently.
  # Each mode reads its own regions from its stage. break-core runs on the imported CC BY-SA world medieval-village and
  # capture-wool on temple-trouble (ADR-0281, content/stages/NOTICE.md); the siege-isles copies for those two modes stay unrouted.
  - id: break-core
    stage: medieval-village
    teams: 2
    players_per_team: 4
    min_players: 2
    kind: pvp
  - id: carry-tnt
    stage: siege-isles-tnt
    teams: 2
    players_per_team: 4
    min_players: 2
    kind: pvp
  - id: capture-wool
    stage: temple-trouble
    teams: 2
    players_per_team: 4
    min_players: 2
    kind: pvp
  - id: steal-jewelry
    stage: siege-isles-jewelry
    teams: 2
    players_per_team: 4
    min_players: 2
    kind: pvp
  - id: battle-loyal
    stage: siege-isles-loyal
    teams: 2
    players_per_team: 4
    min_players: 2
    kind: pvp
  - id: carry-mini-tnt
    stage: siege-isles-mini-tnt
    teams: 2
    players_per_team: 4
    min_players: 2
    kind: pvp

  # PvE Waves (ADR-0249): a solo / co-op run against waves of real mobs. `kind: pve` means one
  # player is enough and everyone queued fights on the same side (the lane holds
  # players_per_team players; a full lane starts at once, otherwise after the queue countdown).
  - id: pve-waves
    stage: pve-proving-grounds
    teams: 2
    players_per_team: 2
    min_players: 1
    kind: pve
