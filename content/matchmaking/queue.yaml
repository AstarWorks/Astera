# Queue -> match tuning (WP8). Schema: plugin/match/.../application/config/QueueYamlConfig.kt
# Reload with `/astera reload matchmaking` (edits apply on the next queue check).

# How often the queues are checked (seconds).
check_interval_seconds: 1

# Wait between "enough players queued" and forming the match. Restarts when a
# queued player leaves; a full lane (teams x players_per_team) starts at once.
queue_countdown_seconds: 10

# In-arena COUNTDOWN phase length before the match turns ACTIVE.
match_countdown_seconds: 10

lanes:
  # `norma` = the standard 2-team lane. A game-mode id (e.g. annihilation)
  # adds a `custom:<id>` lane.
  - id: norma
    stage: example-arena
    teams: 2
    players_per_team: 4
    # Playtest default: 1 lets you start alone (you land on one team, the other
    # stays empty). Raise to 2+ for real matches.
    min_players: 1

  # Annihilation: 3 teams (red / blue / yellow) on the flat playtest world.
  # min_players 1 so one player can start it alone.
  - id: annihilation
    stage: annihilation-arena
    teams: 3
    players_per_team: 4
    min_players: 1

  # Siege / objective modes (WP11) on the flat playtest world. They share the
  # `siege-flat` stage, so one siege match runs at a time (the next lane waits).
  # Each mode reads its own regions: see content/stages/siege-flat.yaml.
  - id: break-core
    stage: siege-flat
    teams: 2
    players_per_team: 4
    min_players: 1
  - id: carry-tnt
    stage: siege-flat
    teams: 2
    players_per_team: 4
    min_players: 1
  - id: capture-wool
    stage: siege-flat
    teams: 2
    players_per_team: 4
    min_players: 1
  - id: steal-jewelry
    stage: siege-flat
    teams: 2
    players_per_team: 4
    min_players: 1
  - id: battle-loyal
    stage: siege-flat
    teams: 2
    players_per_team: 4
    min_players: 1
