# Queue -> match tuning (WP8). Schema: plugin/match/.../application/config/QueueYamlConfig.kt
# Reload with `/astera reload matchmaking` (edits apply on the next queue check).

# How often the queues are checked (seconds).
check_interval_seconds: 1

# `kind` marks what a lane is for: pvp (default: every team needs a player, no solo
# start), pve or training (a solo start is fine). pvp floors are clamped to >= teams on load.

# Wait between "enough players queued" and forming the match. Restarts when a
# queued player leaves; a full lane (teams x players_per_team) starts at once.
queue_countdown_seconds: 10

# In-arena COUNTDOWN phase length before the match turns ACTIVE.
match_countdown_seconds: 10

lanes:
  # `norma` = the standard 2-team lane. A game-mode id (e.g. annihilation)
  # adds a `custom:<id>` lane.
  - id: norma
    stage: example-arena
    teams: 2
    players_per_team: 4
    # PvP: at least one player per team (never a solo start). The admin
    # force-start in the panel bypasses this floor.
    kind: pvp
    min_players: 2

  # Annihilation: 3 teams (red / blue / yellow) on the flat playtest world.
  # One player per team: three sides, never a solo start.
  - id: annihilation
    stage: annihilation-arena
    teams: 3
    players_per_team: 4
    min_players: 3
    kind: pvp

  # Siege / objective modes (WP11) on the flat playtest world. They share the
  # `siege-flat` stage, so one siege match runs at a time (the next lane waits).
  # Each mode reads its own regions: see content/stages/siege-flat.yaml.
  - id: break-core
    stage: siege-flat
    teams: 2
    players_per_team: 4
    min_players: 2
    kind: pvp
  - id: carry-tnt
    stage: siege-flat
    teams: 2
    players_per_team: 4
    min_players: 2
    kind: pvp
  - id: capture-wool
    stage: siege-flat
    teams: 2
    players_per_team: 4
    min_players: 2
    kind: pvp
  - id: steal-jewelry
    stage: siege-flat
    teams: 2
    players_per_team: 4
    min_players: 2
    kind: pvp
  - id: battle-loyal
    stage: siege-flat
    teams: 2
    players_per_team: 4
    min_players: 2
    kind: pvp

  # PvE Waves (ADR-0249): a solo / co-op run against waves of real mobs. `kind: pve` means one
  # player is enough and everyone queued fights on the same side (the lane holds
  # players_per_team players; a full lane starts at once, otherwise after the queue countdown).
  - id: pve-waves
    stage: pve-proving-grounds
    teams: 2
    players_per_team: 2
    min_players: 1
    kind: pve
