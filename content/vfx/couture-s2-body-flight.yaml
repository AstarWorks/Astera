# S2 coin 2, one of THREE flying objects riding its own real projectile. Muzzle sits at hand height on the thread line; t0-3 the piece dives from its overhead split position onto the line, then flies along hand -> enemy chest height with the thread. No sprites, no particles.
id: couture-s2-body-flight
duration_ticks: 40
orient: look
follow: true
sample_ticks: 1
elements:
- id: body
  kind:
    type: item
    item: shears
    item_model: astera:couture-s2-body
    display_mode: fixed
  brightness: 15
  start_tick: 0
  end_tick: 40
  keyframes:
  - t: 0
    translate:
    - 0.0
    - 0.83
    - 0.1
    rotate: &id001
    - 90
    - 0
    - 0
    scale: &id002
    - 1
    - 1
    - 1
  - t: 3
    translate:
    - 0.0
    - 0.0
    - 0.0
    rotate: *id001
    scale: *id002
  - t: 40
    translate:
    - 0.0
    - 0.0
    - 0.0
    rotate:
    - 90
    - 0
    - 0
    scale:
    - 1
    - 1
    - 1
