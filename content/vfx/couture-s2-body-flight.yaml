# S2 coin 2, one of THREE flying objects (body = couture-shears-linked). Rides its own real projectile (couture-rapier-s2-body), +z = flight, x = lateral offset 0.00 so the three fly side by side. No sprites, no particles.
id: couture-s2-body-flight
duration_ticks: 40
