    translate:
    - 0.0
    - 0
    - 0
    rotate:
    - 90
    - 0
    - 0
    scale:
    - 1
    - 1
    - 1
  - t: 40
    translate:
    - 0.0
    - 0
    - 0
    rotate:
    - 90
    - 0
    - 0
    scale:
    - 1
    - 1
    - 1
