# ADR-0220 demo: a crimson X slash in front of the caster (Limbus-style).
# Two thin glass bars cross, a text glyph flashes at the crossing, a bloom flickers
# around the first bar, an arc of sparks fans out. Cast it with content/skills/vfx-demo-cross.yaml.
# Local axes: x = left, y = up, z = forward. rotate = [yaw, pitch, roll] degrees.

id: demo-cross
duration_ticks: 24
orient: look
follow: false
sample_ticks: 2

elements:
  # First diagonal bar: snaps open (out_expo), holds, swaps to a greyer glass, collapses.
  - id: slash-a
    kind: { type: block, block: red_stained_glass }
    brightness: 15
    glow_color: "#ff2040"
    start_tick: 0
    end_tick: 14
    keyframes:
      - { t: 0, translate: [0.0, 1.2, 3.0], rotate: [0, 0, 45], scale: [0.04, 0.2, 0.04] }
      - { t: 3, scale: [0.08, 5.0, 0.08], ease: out_expo }
      - { t: 9, block: gray_stained_glass }
      - { t: 14, scale: [0.0, 5.0, 0.0], ease: in_quad }

  # Second bar, mirrored, one beat later.
  - id: slash-b
    kind: { type: block, block: red_stained_glass }
    brightness: 15
    glow_color: "#ff2040"
    start_tick: 3
    end_tick: 17
    keyframes:
      - { t: 0, translate: [0.0, 1.2, 3.0], rotate: [0, 0, -45], scale: [0.04, 0.2, 0.04] }
      - { t: 3, scale: [0.08, 5.0, 0.08], ease: out_expo }
      - { t: 9, block: gray_stained_glass }
      - { t: 14, scale: [0.0, 5.0, 0.0], ease: in_quad }

  # Soft glow around the first bar, flickering every tick.
  - id: bloom
    kind: { type: block, block: pink_stained_glass }
    brightness: 15
    start_tick: 1
    end_tick: 12
    keyframes:
      - { t: 0, translate: [0.0, 1.2, 3.0], rotate: [0, 0, 45], scale: [0.12, 4.0, 0.12] }
      - { t: 10, scale: [0.2, 4.5, 0.2], ease: out_quad }
    oscillate: { axis: scale_xz, amplitude: 0.03, period_ticks: 2 }

  # Glyph flash at the crossing; always faces the viewer.
  - id: glyph
    kind: { type: text, text: "<#ff2040><b>斬</b>", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    start_tick: 3
    end_tick: 14
    keyframes:
      - { t: 0, translate: [0.0, 1.2, 2.8], scale: [0.0, 0.0, 0.0] }
      - { t: 2, scale: [4.0, 4.0, 4.0], ease: out_back }
      - { t: 11, scale: [4.5, 4.5, 4.5] }

  # Four spark cubes fanned on an arc, spinning as they pop.
  - id: shard
    kind: { type: block, block: netherite_block }
    count: 4
    start_tick: 3
    end_tick: 15
    formation:
      curve: { type: arc, radius: 1.6, from_deg: -60, to_deg: 60 }
      offset: [0.0, 1.2, 3.0]
      align: outward
      stagger_ticks: 1
    jitter: { position: 0.1, rotation_deg: 20, scale: 0.2 }
    keyframes:
      - { t: 0, scale: [0.05, 0.05, 0.05] }
      - { t: 4, translate: [0.0, 0.0, 1.5], rotate: [0, 0, 360], scale: [0.2, 0.2, 0.2], ease: out_cubic }
      - { t: 12, scale: [0.0, 0.0, 0.0], ease: in_quad }
