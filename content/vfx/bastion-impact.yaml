# Bastion Greatsword shared impact frame (ADR-0230): a butter-yellow star flash, an orange
# shockwave hoop and a burst of spark spikes around the struck body. Anchored on the target;
# play_vfx `scale` makes the finisher versions bigger.
# Local axes: x = left, y = up, z = forward. rotate = [yaw, pitch, roll] degrees.

id: bastion-impact
duration_ticks: 14
orient: yaw
follow: false
sample_ticks: 2

elements:
  # Impact frame: the star pops to full size in one tick, holds, then collapses.
  - id: flash
    kind: { type: text, text: "<#fff6a0><b>✦</b>", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    start_tick: 0
    end_tick: 9
    keyframes:
      - { t: 0, translate: [0.0, 1.1, 0.0], scale: [0.0, 0.0, 0.0] }
      - { t: 1, scale: [6.0, 6.0, 6.0], ease: out_expo }
      - { t: 3, scale: [4.5, 4.5, 4.5] }
      - { t: 9, scale: [0.0, 0.0, 0.0], ease: in_quad }

  # Orange hoop snapping outward; block ladder orange concrete -> orange glass for the fade.
  - id: ring
    kind: { type: block, block: orange_concrete }
    brightness: 15
    glow_color: "#ff7a1a"
    start_tick: 0
    end_tick: 10
    count: 8
    formation:
      curve: { type: circle, radius: 0.25 }
      offset: [0.0, 1.0, 0.0]
      align: outward
    keyframes:
      - { t: 0, scale: [0.12, 0.12, 0.3] }
      - { t: 4, translate: [0.0, 0.0, 1.5], scale: [0.1, 0.1, 0.55], ease: out_expo }
      - { t: 5, block: orange_stained_glass }
      - { t: 10, translate: [0.0, 0.0, 2.0], scale: [0.0, 0.0, 0.0], ease: in_quad }

  # Spark spikes flying out in every direction.
  - id: spark
    kind: { type: block, block: yellow_concrete }
    brightness: 15
    glow_color: "#ffd23a"
    start_tick: 0
    end_tick: 9
    count: 6
    formation:
      curve: { type: sphere, radius: 0.2 }
      offset: [0.0, 1.1, 0.0]
      align: outward
    jitter: { position: 0.08, rotation_deg: 12, scale: 0.25 }
    keyframes:
      - { t: 0, scale: [0.05, 0.05, 0.3] }
      - { t: 3, translate: [0.0, 0.0, 1.3], scale: [0.04, 0.04, 0.7], ease: out_cubic }
      - { t: 9, translate: [0.0, 0.0, 1.9], scale: [0.0, 0.0, 0.0], ease: in_quad }
