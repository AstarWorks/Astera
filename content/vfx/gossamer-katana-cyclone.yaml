# Gossamer Katana S3 cyclone: two interleaved helices (24 bars, ice-blue and white) are drawn up around the
# caster one tick per bar, so the column visibly climbs and spins; a wider deep-blue third helix follows
# as the outer wall. Tangent-aligned bars, block-ladder fade at the end. Follows the caster.

id: gossamer-katana-cyclone
duration_ticks: 34
orient: yaw
follow: true
sample_ticks: 2

elements:
  - id: helix-a
    kind: { type: block, block: light_blue_stained_glass }
    brightness: 15
    start_tick: 0
    slot_lifetime_ticks: 15
    count: 12
    formation:
      curve: { type: helix, radius: 1.8, turns: 1.5, height: 2.4, start_deg: 0 }
      offset: [0.0, 0.0, 0.0]
      align: tangent
      stagger_ticks: 1
    keyframes:
      - { t: 0, scale: [0.04, 0.04, 0.1] }
      - { t: 2, scale: [0.07, 0.07, 0.7], ease: out_expo }
      - { t: 10, block: white_stained_glass }
      - { t: 14, scale: [0.0, 0.0, 0.7], ease: in_quad }
    group_keyframes:
      - { t: 0 }
      - { t: 28, rotate: [540, 0, 0], ease: in_out_quad }

  - id: helix-b
    kind: { type: block, block: white_concrete }
    brightness: 15
    start_tick: 0
    slot_lifetime_ticks: 15
    count: 12
    formation:
      curve: { type: helix, radius: 1.8, turns: 1.5, height: 2.4, start_deg: 180 }
      offset: [0.0, 0.0, 0.0]
      align: tangent
      stagger_ticks: 1
    keyframes:
      - { t: 0, scale: [0.03, 0.03, 0.1] }
      - { t: 2, scale: [0.04, 0.04, 0.65], ease: out_expo }
      - { t: 14, scale: [0.0, 0.0, 0.65], ease: in_quad }
    group_keyframes:
      - { t: 0 }
      - { t: 28, rotate: [540, 0, 0], ease: in_out_quad }

  - id: wall
    kind: { type: block, block: blue_stained_glass }
    brightness: 15
    start_tick: 8
    slot_lifetime_ticks: 12
    count: 8
    formation:
      curve: { type: helix, radius: 2.5, turns: 1.0, height: 2.0, start_deg: 90 }
      offset: [0.0, 0.1, 0.0]
      align: tangent
      stagger_ticks: 1
    keyframes:
      - { t: 0, scale: [0.04, 0.04, 0.1] }
      - { t: 2, scale: [0.07, 0.07, 0.9], ease: out_expo }
      - { t: 9, block: gray_stained_glass }
      - { t: 11, scale: [0.0, 0.0, 0.9], ease: in_quad }
    group_keyframes:
      - { t: 0 }
      - { t: 14, rotate: [-420, 0, 0], ease: in_out_quad }
