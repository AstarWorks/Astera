# S2 coin 2: the flying shears. Played by ProjectileHandler (params.visual.vfx) ANCHORED on the live projectile: it follows the real
# 3D flight every tick and ends the tick the projectile hits / misses / expires. Nothing here is positioned for a camera.
# Local frame: +z = flight direction (the projectile's launch direction), origin = projectile position.
id: couture-s2-shears-flight
duration_ticks: 40
orient: look
follow: true
sample_ticks: 1
elements:
- id: shears
  kind: {type: item, item: shears, item_model: astera:couture-rapier, display_mode: fixed}
  brightness: 15
  start_tick: 0
  end_tick: 40
  keyframes:
  - {t: 0, translate: [0, 0, 0], rotate: [90, 0, 0], scale: [1, 1, 1]}
  - {t: 40, translate: [0, 0, 0], rotate: [90, 0, 0], scale: [1, 1, 1]}
- id: streak
  kind: {type: block, block: white_concrete}
  brightness: 15
  start_tick: 0
  end_tick: 40
  keyframes:
  - {t: 0, translate: [0, 0, -0.9], rotate: [0, 0, 0], scale: [0.06, 0.06, 1.8]}
  - {t: 40, translate: [0, 0, -0.9], rotate: [0, 0, 0], scale: [0.06, 0.06, 1.8]}
- id: trail-spark
  kind: {type: particle, particle_id: couture-s2-p-spark, every_ticks: 1}
  brightness: 15
  start_tick: 0
  end_tick: 40
  keyframes:
  - {t: 0, translate: [0, 0, -0.4]}
