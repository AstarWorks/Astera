# Zwei S3 beat 3b (cast tick 44-58), played at the dash end: sword thrust straight ahead (hand y 1.1), speed lines
# and streak particles along the lane (fading from tick 50), wind arcs behind the target. ~28 displays.
# Local axes: x = left, y = up, z = forward. Rig swing rotate = [yaw, pitch, roll]: yaw + = right; pitch + tips a FORWARD blade
# down but tips a BEHIND blade (yaw ~180) UP, so behind-poses use pitch -; roll 90 turns the blade's wide face from the side to
# the horizontal (sweep). Blade 1.75 long x 0.32 wide x 0.07 thick, solid (no glow outline), pivot = the right hand.

id: bastion-s3-thrust
duration_ticks: 14
orient: yaw
follow: false
sample_ticks: 1

rigs:
  - id: sword
    pivot: [-0.35, 1.1, 0.0]
    rest: [0, 90, 0]
    respect_hit_stop: true
    end_tick: 13
    parts:
      - { id: blade, block: iron_block, offset: [0.0, 1.125, 0.0], size: [0.07, 1.75, 0.32] }
      - { id: edge, block: white_concrete, offset: [0.0, 1.125, 0.145], size: [0.075, 1.75, 0.06] }
      - { id: fuller, block: light_gray_concrete, offset: [0.0, 1.125, 0.0], size: [0.08, 1.5, 0.05] }
      - { id: guard, block: gold_block, offset: [0.0, 0.21, 0.0], size: [0.1, 0.08, 0.5] }
      - { id: grip, block: black_concrete, offset: [0.0, -0.05, 0.0], size: [0.07, 0.35, 0.07] }
      - { id: pommel, block: gold_block, offset: [0.0, -0.25, 0.0], size: [0.1, 0.1, 0.1] }
    swing:
      - { t: 0, rotate: [0, 0, 0] }                           # blade fully forward through the target
      - { t: 12, rotate: [0, 0, 0] }
    emitters:
      - { id: tipglow, particle_id: bastion-s3-ember, point: [0.0, 2.0, 0.0], start_t: 1, end_t: 6 }

elements:
  # Speed lines: a ring of thin white blades along the lane, seen from every side.
  - id: lines-white
    kind: { type: block, block: white_concrete }
    brightness: 15
    start_tick: 4
    end_tick: 12
    count: 8
    formation:
      curve: { type: circle, radius: 1.3 }
      offset: [0.0, 1.1, 0.2]
      tilt: { yaw: 0, pitch: 90, roll: 0 }
      align: none
    jitter: { position: 0.25, rotation_deg: 0, scale: 0.4 }
    keyframes:
      - { t: 0, scale: [0.03, 0.03, 0.4] }
      - { t: 2, translate: [0.0, 0.0, 1.2], scale: [0.03, 0.03, 3.2], ease: out_expo }
      - { t: 6, translate: [0.0, 0.0, 3.0], scale: [0.0, 0.0, 3.2], ease: in_quad }

  - id: lines-gold
    kind: { type: block, block: yellow_concrete }
    brightness: 15
    start_tick: 1
    end_tick: 8
    count: 6
    formation:
      curve: { type: circle, radius: 0.8 }
      offset: [0.0, 1.1, 0.0]
      tilt: { yaw: 0, pitch: 90, roll: 0 }
      align: none
    jitter: { position: 0.2, rotation_deg: 0, scale: 0.4 }
    keyframes:
      - { t: 0, scale: [0.05, 0.05, 0.4] }
      - { t: 2, translate: [0.0, 0.0, 1.5], scale: [0.05, 0.05, 2.6], ease: out_expo }
      - { t: 6, translate: [0.0, 0.0, 3.4], scale: [0.0, 0.0, 2.6], ease: in_quad }

  # Streak particles: trail particles on a ring around the lane fly down to 4.5 blocks ahead.
  - id: streaks
    kind: { type: particle, particle_id: bastion-s3-streak, every_ticks: 1, trail_to: [0.0, 1.1, 4.5] }
    start_tick: 0
    end_tick: 5
    count: 10
    formation:
      curve: { type: circle, radius: 1.5 }
      offset: [0.0, 1.1, 0.4]
      tilt: { yaw: 0, pitch: 90, roll: 0 }
    keyframes:
      - { t: 0, translate: [0.0, 0.0, 0.0] }

  # Wind arcs behind the target: vertical-ish white crescents (the whoosh left after the thrust).
  - id: whoosh
    kind: { type: block, block: white_concrete }
    brightness: 15
    start_tick: 1
    end_tick: 9
    slot_lifetime_ticks: 6
    count: 5
    formation:
      curve: { type: arc, radius: 1.5, from_deg: -70, to_deg: 70 }
      offset: [0.0, 1.0, 3.3]
      tilt: { yaw: 90, pitch: 0, roll: 0 }
      align: tangent
      stagger_ticks: 1
    keyframes:
      - { t: 0, scale: [0.03, 0.03, 0.2] }
      - { t: 2, scale: [0.04, 0.04, 1.1], ease: out_expo }
      - { t: 6, scale: [0.0, 0.0, 1.1], ease: in_quad }
