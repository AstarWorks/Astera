# Vendetta Bayonet: the volley lands. Ten thin red lines burst out of the target's chest in every
# direction (a 3D star), two orange X-slashes cut across the body, and a white flash glyph punctuates
# the first frame. Lines are drawn with out_expo and thin out with in_quad. Anchored on the target.

id: vendetta-beam-cross
duration_ticks: 16
orient: look
follow: false
sample_ticks: 1

elements:
  - id: line
    kind: { type: block, block: red_stained_glass }
    brightness: 15
    glow_color: "#ff2040"
    count: 10
    end_tick: 12
    formation:
      curve: { type: sphere, radius: 0.12 }
      offset: [0.0, 1.2, 0.0]
      align: outward
    jitter: { rotation_deg: 4, scale: 0.25 }
    keyframes:
      - { t: 0, translate: [0.0, 0.0, 0.2], scale: [0.03, 0.03, 0.4] }
      - { t: 2, translate: [0.0, 0.0, 3.6], scale: [0.07, 0.07, 7.2], ease: out_expo }
      - { t: 6, block: magenta_stained_glass }
      - { t: 8, block: gray_stained_glass }
      - { t: 11, scale: [0.0, 0.0, 7.2], ease: in_quad }

  - id: line-core
    kind: { type: block, block: white_concrete }
    brightness: 15
    count: 6
    end_tick: 8
    formation:
      curve: { type: sphere, radius: 0.12 }
      offset: [0.0, 1.2, 0.0]
      align: outward
    keyframes:
      - { t: 0, translate: [0.0, 0.0, 0.2], scale: [0.015, 0.015, 0.4] }
      - { t: 2, translate: [0.0, 0.0, 2.6], scale: [0.025, 0.025, 5.2], ease: out_expo }
      - { t: 7, scale: [0.0, 0.0, 5.2], ease: in_quad }

  - id: x-a
    kind: { type: block, block: orange_stained_glass }
    brightness: 15
    glow_color: "#ff8a1f"
    start_tick: 1
    end_tick: 10
    keyframes:
      - { t: 0, translate: [0.0, 1.2, 0.0], rotate: [0, 0, 40], scale: [0.04, 0.3, 0.04] }
      - { t: 2, scale: [0.12, 5.5, 0.12], ease: out_expo }
      - { t: 8, scale: [0.0, 5.5, 0.0], ease: in_quad }

  - id: x-b
    kind: { type: block, block: orange_stained_glass }
    brightness: 15
    glow_color: "#ff8a1f"
    start_tick: 2
    end_tick: 11
    keyframes:
      - { t: 0, translate: [0.0, 1.2, 0.0], rotate: [0, 0, -40], scale: [0.04, 0.3, 0.04] }
      - { t: 2, scale: [0.12, 5.5, 0.12], ease: out_expo }
      - { t: 8, scale: [0.0, 5.5, 0.0], ease: in_quad }

  - id: flash
    kind: { type: text, text: "<#ffffff>✦", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    end_tick: 8
    keyframes:
      - { t: 0, translate: [0.0, 1.2, 0.0], scale: [0.0, 0.0, 0.0] }
      - { t: 1, scale: [10.0, 10.0, 10.0], ease: out_expo }
      - { t: 6, scale: [0.0, 0.0, 0.0], ease: in_quad }
