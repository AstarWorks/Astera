id: couture-rapier-thread
duration_ticks: 15
orient: yaw
follow: false
sample_ticks: 1
elements:
- id: thread
  kind: {type: block, block: black_concrete}
  brightness: 15
  start_tick: 0
  end_tick: 14
  keyframes:
  - t: 0
    scale: [0.08, 0.025, 0.4]
  - t: 10
    scale: [0.12, 0.025, 1.5]
    ease: out_cubic
  - t: 14
    scale: [0, 0.025, 1.5]
  count: 10
  formation:
    curve: {type: circle, radius: 3.1}
    offset: [0, 0.1, 0]
    align: tangent
