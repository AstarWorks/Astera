# Ember Gauntlet: Inferno Furnace telegraph. A flame column rises out of the floor under the caster
# and breathes (oscillating width, glowing outline) while two flat rings pulse on the floor and sparks
# rise. Reads clearly as "big hit in about a second" for anyone nearby. Anchored on the caster, yaw only.

id: ember-column
duration_ticks: 30
orient: yaw
follow: false
sample_ticks: 1

elements:
  - id: column
    kind: { type: block, block: orange_stained_glass }
    brightness: 15
    end_tick: 28
    keyframes:
      - { t: 0, translate: [0.0, 0.1, 0.0], scale: [0.4, 0.2, 0.4] }
      - { t: 6, translate: [0.0, 1.6, 0.0], scale: [0.9, 3.2, 0.9], ease: out_cubic }
      - { t: 18, block: red_stained_glass }
      - { t: 22, block: orange_stained_glass }
      - { t: 26, translate: [0.0, 2.0, 0.0], scale: [0.3, 4.0, 0.3], ease: in_quad }
    oscillate: { axis: scale_xz, amplitude: 0.14, period_ticks: 4 }

  - id: column-core
    kind: { type: block, block: yellow_concrete }
    brightness: 15
    end_tick: 26
    keyframes:
      - { t: 0, translate: [0.0, 0.1, 0.0], scale: [0.2, 0.2, 0.2] }
      - { t: 6, translate: [0.0, 1.7, 0.0], scale: [0.4, 3.4, 0.4], ease: out_cubic }
      - { t: 24, translate: [0.0, 2.0, 0.0], scale: [0.1, 4.0, 0.1], ease: in_quad }
    oscillate: { axis: scale_xz, amplitude: 0.06, period_ticks: 4 }

  - id: floor-ring
    kind: { type: block, block: orange_stained_glass }
    brightness: 15
    count: 20
    end_tick: 28
    formation:
      curve: { type: circle, radius: 0.5 }
      offset: [0.0, 0.06, 0.0]
      align: tangent
    keyframes:
      - { t: 0, scale: [0.1, 0.03, 0.2] }
      - { t: 6, translate: [-2.1, 0.0, 0.0], scale: [0.12, 0.03, 0.8], ease: out_expo }
      - { t: 14, block: red_stained_glass }
      - { t: 20, block: orange_stained_glass }
      - { t: 26, scale: [0.0, 0.03, 0.8], ease: in_quad }

  - id: inner-ring
    kind: { type: block, block: yellow_stained_glass }
    brightness: 15
    count: 12
    start_tick: 4
    end_tick: 28
    formation:
      curve: { type: circle, radius: 0.4 }
      offset: [0.0, 0.08, 0.0]
      align: tangent
    keyframes:
      - { t: 0, scale: [0.08, 0.03, 0.2] }
      - { t: 6, translate: [-0.9, 0.0, 0.0], scale: [0.08, 0.03, 0.6], ease: out_expo }
      - { t: 20, scale: [0.0, 0.03, 0.6], ease: in_quad }

  - id: embers
    kind: { type: particle, particle_id: fire-cast, every_ticks: 3 }
    start_tick: 2
    end_tick: 28
    keyframes:
      - { t: 0, translate: [0.0, 0.4, 0.0] }
