# Ember Gauntlet: the giant fire spiral. A 270 degree rising helix (radius 4.5, 2.2 blocks of climb) is
# drawn on one segment per tick, an outer orange blade over a yellow core, then cooled down a
# block ladder and thinned out. This is the sweep that "fills the screen" in the finisher's first beat.
# Anchored on the caster, yaw only.

id: ember-spiral
duration_ticks: 34
orient: yaw
follow: false
sample_ticks: 1

elements:
  - id: blade
    kind: { type: block, block: orange_stained_glass }
    brightness: 15
    glow_color: "#ff7a1a"
    count: 20
    end_tick: 12
    formation:
      curve: { type: helix, radius: 4.5, turns: 0.75, height: 2.2, start_deg: 200 }
      offset: [0.0, 0.5, 0.0]
      align: tangent
      stagger_ticks: 1
    keyframes:
      - { t: 0, scale: [0.04, 0.04, 0.1] }
      - { t: 2, scale: [0.3, 0.3, 1.9], ease: out_expo }
      - { t: 6, block: red_stained_glass }
      - { t: 8, block: gray_stained_glass }
      - { t: 11, scale: [0.0, 0.0, 1.9], ease: in_quad }

  - id: core
    kind: { type: block, block: yellow_concrete }
    brightness: 15
    count: 20
    end_tick: 9
    formation:
      curve: { type: helix, radius: 4.5, turns: 0.75, height: 2.2, start_deg: 200 }
      offset: [0.0, 0.5, 0.0]
      align: tangent
      stagger_ticks: 1
    keyframes:
      - { t: 0, scale: [0.02, 0.02, 0.1] }
      - { t: 2, scale: [0.1, 0.1, 1.9], ease: out_expo }
      - { t: 6, scale: [0.1, 0.1, 1.9] }
      - { t: 8, scale: [0.0, 0.0, 1.9], ease: in_quad }

  - id: sparks
    kind: { type: particle, particle_id: fire-impact, every_ticks: 5 }
    count: 4
    start_tick: 4
    end_tick: 14
    formation:
      curve: { type: helix, radius: 4.5, turns: 0.75, height: 2.2, start_deg: 200 }
      offset: [0.0, 0.5, 0.0]
      align: none
      stagger_ticks: 5
    keyframes:
      - { t: 0, translate: [0.0, 0.0, 0.0] }
