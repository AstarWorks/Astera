# Bastion S3 beat 6 (video n57-59, skill t38-41): r4 WORLD-ANCHORED (follow: false) along the dash path. cause of r3 miss: follow:true teleports every element to anchor + offset each tick and the anchor (the server caster) is already at the landing point at t38, so every plate sat at the enemy as one static blob. Now the plates are fixed in the cast frame (+z = dash direction) at z 0.3 / 2.1 / 3.9 (ticks 1 / 2 / 3, the caster covers ~1.8 blocks per tick) and fade FRONT-first (first spawned collapses first), life 5 ticks (t38-42). Black-edged jagged slabs (front+back pair, vertical, side cam) + one flat slab each on the floor (top cam) + gold crescent sweeps ahead of them, pop flash and streaks along the path.
