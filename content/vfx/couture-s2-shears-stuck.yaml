# S2 coin 2 on a REAL hit: the shears stay stuck in the hit entity and move with it (played on the target with follow: true,
# anchored on the entity's feet; offsets are entity-relative). Fades out after ~1.5 s.
id: couture-s2-shears-stuck
duration_ticks: 34
orient: look
follow: true
sample_ticks: 1
elements:
- id: stuck-shears
  kind: {type: item, item: shears, item_model: astera:couture-rapier-thrown-stuck, display_mode: fixed}
  brightness: 15
  start_tick: 0
  end_tick: 34
  keyframes:
  - {t: 0, translate: [0, 1.2, -0.3], rotate: [90, 0, 0], scale: [1.15, 1.15, 1.15]}
  - {t: 2, translate: [0, 1.2, 0.05], rotate: [90, 0, 0], scale: [1, 1, 1], ease: out_back}
  - {t: 28, translate: [0, 1.2, 0.05], rotate: [90, 0, 0], scale: [1, 1, 1]}
  - {t: 34, translate: [0, 1.2, 0.05], rotate: [90, 0, 0], scale: [0, 0, 0], ease: in_quad}
- id: stuck-spark
  kind: {type: particle, particle_id: couture-s2-p-spark, every_ticks: 4}
  brightness: 15
  start_tick: 2
  end_tick: 24
  keyframes:
  - {t: 0, translate: [0, 1.2, 0]}
