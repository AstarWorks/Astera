# Verdict Hammer S3 finisher, "Obsidian Judgment": a 38-tick telegraph (floor hoop = damage radius,
# a gold circuitry web growing across the floor, a colossal hammer rising out of the ground and
# trembling overhead), then the slam at tick 39: 14 T-shaped stakes erupt in two rings, a star
# flash and a shockwave hoop. At tick 60 the stakes collapse with a second flash + hoop (the second
# hit), then a teal afterglow ring lingers. Peak ~54 live displays at tick 40.
# Local axes: x = left, y = up, z = forward. rotate = [yaw, pitch, roll] degrees.

id: verdict-s3-judgment
duration_ticks: 90
orient: yaw
follow: false
sample_ticks: 2

elements:
  # Damage-radius hoop.
  - id: halo
    kind: { type: block, block: yellow_stained_glass }
    brightness: 12
    glow_color: "#ffcc40"
    start_tick: 0
    end_tick: 38
    count: 28
    formation:
      curve: { type: circle, radius: 6.0 }
      offset: [0.0, 0.05, 0.0]
      align: tangent
    keyframes:
      - { t: 0, scale: [0.0, 0.03, 0.0] }
      - { t: 6, scale: [0.18, 0.03, 1.4], ease: out_back }
      - { t: 38, scale: [0.18, 0.03, 1.4] }
    oscillate: { axis: scale_x, amplitude: 0.06, period_ticks: 4 }

  # Circuitry web: two zigzag lines grow across the floor.
  - id: web-a
    kind: { type: block, block: gold_block }
    brightness: 15
    glow_color: "#3fe0e0"
    start_tick: 2
    end_tick: 31
    count: 8
    formation:
      curve: { type: lightning, from: [-5.0, 0.07, -5.0], to: [5.0, 0.07, 5.0], segments: 7, amplitude: 1.0, seed: 5 }
      align: tangent
      stagger_ticks: 1
    keyframes:
      - { t: 0, scale: [0.0, 0.0, 0.0] }
      - { t: 2, scale: [0.08, 0.04, 1.6], ease: out_expo }
      - { t: 27, scale: [0.08, 0.04, 1.6] }
    oscillate: { axis: scale_x, amplitude: 0.03, period_ticks: 2 }

  - id: web-b
    kind: { type: block, block: gold_block }
    brightness: 15
    glow_color: "#3fe0e0"
    start_tick: 2
    end_tick: 31
    count: 8
    formation:
      curve: { type: lightning, from: [5.0, 0.07, -5.0], to: [-5.0, 0.07, 5.0], segments: 7, amplitude: 1.0, seed: 13 }
      align: tangent
      stagger_ticks: 1
    keyframes:
      - { t: 0, scale: [0.0, 0.0, 0.0] }
      - { t: 2, scale: [0.08, 0.04, 1.6], ease: out_expo }
      - { t: 27, scale: [0.08, 0.04, 1.6] }
    oscillate: { axis: scale_x, amplitude: 0.03, period_ticks: 2 }

  # Colossal hammer: out of the ground, hangs trembling, slams forward-down at tick 36-39.
  - id: hammer
    kind: { type: item, item: mace, display_mode: fixed }
    brightness: 15
    glow_color: "#ffcc40"
    start_tick: 0
    end_tick: 58
    keyframes:
      - { t: 0, translate: [0.0, -1.0, 0.5], rotate: [0, 0, 45], scale: [0.0, 0.0, 0.0] }
      - { t: 8, translate: [0.0, 5.2, 0.5], scale: [6.5, 6.5, 6.5], ease: out_back }
      - { t: 36, translate: [0.0, 5.4, 0.5], ease: linear }
      - { t: 39, translate: [0.0, 1.6, 3.2], rotate: [0, 110, 45], ease: in_expo }
      - { t: 48, translate: [0.0, 1.6, 3.2] }
      - { t: 58, scale: [0.0, 0.0, 0.0], ease: in_quad }
    oscillate: { axis: translate_y, amplitude: 0.06, period_ticks: 3 }

  # T-stakes, inner ring (6): shaft + crossbar. Rise at the slam, collapse at tick 60.
  - id: shaft-in
    kind: { type: block, block: gold_block }
    brightness: 15
    glow_color: "#ffcc40"
    start_tick: 39
    end_tick: 62
    count: 6
    formation:
      curve: { type: circle, radius: 2.6 }
      align: none
      stagger_ticks: 1
    keyframes:
      - { t: 0, translate: [0.0, -2.2, 0.0], scale: [0.16, 4.0, 0.16] }
      - { t: 4, translate: [0.0, 1.9, 0.0], ease: out_back }
      - { t: 18, translate: [0.0, 1.9, 0.0] }
      - { t: 21, scale: [0.16, 0.0, 0.16], ease: in_expo }

  - id: cross-in
    kind: { type: block, block: gold_block }
    brightness: 15
    glow_color: "#ffcc40"
    start_tick: 39
    end_tick: 62
    count: 6
    formation:
      curve: { type: circle, radius: 2.6 }
      align: none
      stagger_ticks: 1
    keyframes:
      - { t: 0, translate: [0.0, -0.3, 0.0], scale: [1.0, 0.16, 0.16] }
      - { t: 4, translate: [0.0, 3.7, 0.0], ease: out_back }
      - { t: 18, translate: [0.0, 3.7, 0.0] }
      - { t: 21, scale: [0.0, 0.16, 0.16], ease: in_expo }

  # Outer ring (8), three ticks later.
  - id: shaft-out
    kind: { type: block, block: gold_block }
    brightness: 15
    glow_color: "#ffcc40"
    start_tick: 42
    end_tick: 64
    count: 8
    formation:
      curve: { type: circle, radius: 5.0 }
      align: none
      stagger_ticks: 1
    keyframes:
      - { t: 0, translate: [0.0, -2.2, 0.0], scale: [0.16, 4.0, 0.16] }
      - { t: 4, translate: [0.0, 1.9, 0.0], ease: out_back }
      - { t: 15, translate: [0.0, 1.9, 0.0] }
      - { t: 18, scale: [0.16, 0.0, 0.16], ease: in_expo }

  - id: cross-out
    kind: { type: block, block: gold_block }
    brightness: 15
    glow_color: "#ffcc40"
    start_tick: 42
    end_tick: 64
    count: 8
    formation:
      curve: { type: circle, radius: 5.0 }
      align: none
      stagger_ticks: 1
    keyframes:
      - { t: 0, translate: [0.0, -0.3, 0.0], scale: [1.0, 0.16, 0.16] }
      - { t: 4, translate: [0.0, 3.7, 0.0], ease: out_back }
      - { t: 15, translate: [0.0, 3.7, 0.0] }
      - { t: 18, scale: [0.0, 0.16, 0.16], ease: in_expo }

  - id: flash
    kind: { type: text, text: "<#ffe27a><b>✦</b>", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    start_tick: 39
    end_tick: 48
    keyframes:
      - { t: 0, translate: [0.0, 1.8, 2.5], scale: [0.0, 0.0, 0.0] }
      - { t: 1, scale: [16.0, 16.0, 16.0], ease: out_expo }
      - { t: 4, scale: [12.0, 12.0, 12.0] }
      - { t: 9, scale: [0.0, 0.0, 0.0], ease: in_quad }

  - id: shock
    kind: { type: block, block: gold_block }
    brightness: 15
    glow_color: "#ffcc40"
    start_tick: 40
    end_tick: 50
    count: 18
    formation:
      curve: { type: circle, radius: 0.6 }
      offset: [0.0, 0.15, 0.0]
      align: outward
    keyframes:
      - { t: 0, scale: [0.5, 0.12, 0.16] }
      - { t: 6, translate: [0.0, 0.0, 5.4], scale: [1.1, 0.1, 0.16], ease: out_expo }
      - { t: 10, translate: [0.0, 0.0, 5.9], scale: [0.0, 0.0, 0.16], ease: in_quad }

  # Second hit: the collapse.
  - id: flash-2
    kind: { type: text, text: "<#ffffff><b>✦</b>", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    start_tick: 62
    end_tick: 70
    keyframes:
      - { t: 0, translate: [0.0, 1.8, 0.0], scale: [0.0, 0.0, 0.0] }
      - { t: 1, scale: [13.0, 13.0, 13.0], ease: out_expo }
      - { t: 8, scale: [0.0, 0.0, 0.0], ease: in_quad }

  - id: shock-2
    kind: { type: block, block: white_concrete }
    brightness: 15
    start_tick: 62
    end_tick: 72
    count: 12
    formation:
      curve: { type: circle, radius: 0.6 }
      offset: [0.0, 0.15, 0.0]
      align: outward
    keyframes:
      - { t: 0, scale: [0.6, 0.1, 0.14] }
      - { t: 5, translate: [0.0, 0.0, 5.8], scale: [1.4, 0.08, 0.14], ease: out_expo }
      - { t: 9, block: white_stained_glass }
      - { t: 10, translate: [0.0, 0.0, 6.4], scale: [0.0, 0.0, 0.14], ease: in_quad }

  # Teal afterglow ring: the judged ground cooling off.
  - id: afterglow
    kind: { type: block, block: cyan_stained_glass }
    brightness: 10
    glow_color: "#3fe0e0"
    start_tick: 67
    end_tick: 90
    count: 16
    formation:
      curve: { type: circle, radius: 6.2 }
      offset: [0.0, 0.05, 0.0]
      align: tangent
    keyframes:
      - { t: 0, scale: [0.0, 0.03, 0.0] }
      - { t: 4, scale: [0.2, 0.03, 1.8], ease: out_quad }
      - { t: 15, scale: [0.2, 0.03, 1.8] }
      - { t: 23, scale: [0.0, 0.03, 1.8], ease: in_quad }
