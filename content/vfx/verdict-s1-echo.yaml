# Verdict Hammer S1, beat 2: the echo. A near-vertical gold crescent is drawn top to bottom in two
# arc sections with a star gleam at its heel. Played 17 ticks into the cast so it snaps on the
# damage frame. ~11 live displays.
# Local axes: x = left, y = up, z = forward. rotate = [yaw, pitch, roll] degrees.

id: verdict-s1-echo
duration_ticks: 22
orient: look
follow: false
sample_ticks: 2

elements:
  # Face-on descending crescent (a bezier in the vertical plane in front of the caster) drawn top to bottom.
  - id: crescent
    kind: { type: block, block: gold_block }
    brightness: 15
    glow_color: "#ffcc40"
    start_tick: 2
    end_tick: 12
    slot_lifetime_ticks: 10
    count: 10
    formation:
      curve: { type: bezier, points: [[1.8, 3.4, 2.4], [2.2, 2.2, 3.1], [0.2, 0.8, 3.1], [-1.6, 0.1, 2.3]] }
      align: tangent
      stagger_ticks: 1
    jitter: { position: 0.04, rotation_deg: 2, scale: 0.2 }
    keyframes:
      - { t: 0, scale: [0.05, 0.05, 0.3] }
      - { t: 2, scale: [0.2, 0.2, 1.2], ease: out_expo }
      - { t: 5, block: yellow_stained_glass }
      - { t: 10, scale: [0.0, 0.0, 1.2], ease: in_quad }

  - id: gleam
    kind: { type: text, text: "<#ffe27a><b>✦</b>", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    start_tick: 4
    end_tick: 12
    keyframes:
      - { t: 0, translate: [-1.4, 0.4, 2.5], scale: [0.0, 0.0, 0.0] }
      - { t: 2, scale: [3.5, 3.5, 3.5], ease: out_back }
      - { t: 8, scale: [0.0, 0.0, 0.0], ease: in_quad }
