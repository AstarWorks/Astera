# Sigil Rifle S2 "Dash-Cut": the caster slides ~6 blocks leaving five dark-red afterimage bars on the
# lane (block ladder fade, staggered), a puddle of blood at the end, then a half-circle crescent of twelve
# thin pieces sweeps through the far end (the follow-up cut) with a white star and gold sparks.
# Local axes: x = left, y = up, z = forward.

id: sigil-rifle-dash
duration_ticks: 26
orient: yaw
follow: false
sample_ticks: 2

elements:
  - id: afterimage
    kind: { type: block, block: red_concrete }
    brightness: 8
    start_tick: 0
    end_tick: 14
    count: 5
    formation:
      curve: { type: line, from: [0.0, 0.9, 0.8], to: [0.0, 0.9, 5.2] }
      align: none
      stagger_ticks: 1
    keyframes:
      - { t: 0, scale: [0.5, 1.8, 0.12] }
      - { t: 4, block: red_stained_glass }
      - { t: 8, block: gray_stained_glass }
      - { t: 13, scale: [0.0, 1.8, 0.0], ease: in_quad }

  - id: floor-smear
    kind: { type: block, block: red_concrete }
    brightness: 15
    start_tick: 0
    end_tick: 20
    keyframes:
      - { t: 0, translate: [0.0, 0.04, 0.0], scale: [0.2, 0.02, 0.4] }
      - { t: 3, translate: [0.0, 0.04, 3.0], scale: [0.5, 0.02, 6.0], ease: out_expo }
      - { t: 12, block: red_stained_glass }
      - { t: 20, scale: [0.0, 0.02, 6.0], ease: in_quad }

  # Blood puddle where the dash ends.
  - id: puddle
    kind: { type: block, block: red_concrete_powder }
    start_tick: 3
    end_tick: 24
    keyframes:
      - { t: 0, translate: [0.0, 0.03, 6.0], scale: [0.1, 0.02, 0.1] }
      - { t: 3, scale: [1.3, 0.02, 1.3], ease: out_expo }
      - { t: 14, scale: [1.3, 0.02, 1.3] }
      - { t: 21, scale: [0.0, 0.02, 0.0], ease: in_quad }

  # The follow-up cut: half-circle crescent in front of the landing point, drawn in 4 ticks.
  - id: crescent
    kind: { type: block, block: red_stained_glass }
    brightness: 15
    glow_color: "#ff2a1a"
    start_tick: 6
    end_tick: 16
    count: 12
    formation:
      curve: { type: arc, radius: 2.2, from_deg: 90, to_deg: -90 }
      tilt: { yaw: 0, pitch: 0, roll: 18 }
      offset: [0.0, 1.1, 6.0]
      align: tangent
      stagger_ticks: 0
    keyframes:
      - { t: 0, scale: [0.02, 0.1, 0.5] }
      - { t: 2, scale: [0.05, 0.4, 0.8], ease: out_expo }
      - { t: 5, block: pink_stained_glass }
      - { t: 10, scale: [0.0, 0.2, 0.8], ease: in_quad }

  - id: crescent-core
    kind: { type: block, block: white_concrete }
    brightness: 15
    start_tick: 6
    end_tick: 12
    count: 8
    formation:
      curve: { type: arc, radius: 2.2, from_deg: 90, to_deg: -90 }
      tilt: { yaw: 0, pitch: 0, roll: 18 }
      offset: [0.0, 1.1, 6.0]
      align: tangent
    keyframes:
      - { t: 0, scale: [0.01, 0.04, 0.6] }
      - { t: 2, scale: [0.03, 0.07, 1.0], ease: out_expo }
      - { t: 6, scale: [0.0, 0.04, 1.0], ease: in_quad }

  - id: star
    kind: { type: text, text: "<white>✦</white>", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    start_tick: 6
    end_tick: 16
    keyframes:
      - { t: 0, translate: [0.0, 1.2, 6.0], scale: [0.0, 0.0, 0.0] }
      - { t: 2, scale: [8.0, 8.0, 8.0], ease: out_expo }
      - { t: 10, scale: [0.0, 0.0, 0.0], ease: in_quad }

  - id: spark
    kind: { type: block, block: gold_block }
    brightness: 15
    start_tick: 6
    end_tick: 16
    count: 8
    formation:
      curve: { type: circle, radius: 0.4 }
      offset: [0.0, 1.2, 6.0]
      align: outward
    jitter: { position: 0.1, rotation_deg: 25, scale: 0.4 }
    keyframes:
      - { t: 0, scale: [0.03, 0.03, 0.1] }
      - { t: 3, translate: [0.0, 0.0, 1.6], scale: [0.03, 0.03, 0.7], ease: out_expo }
      - { t: 10, translate: [0.0, 0.0, 2.4], scale: [0.0, 0.0, 0.3], ease: in_quad }
