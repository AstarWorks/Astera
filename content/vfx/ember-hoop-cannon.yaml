# Ember Gauntlet: Hoop Cannon. A flame jet erupts from the knuckles (three nested glass layers,
# flickering) and fires three fire hoops forward, three ticks apart. Each hoop is a vertical
# ring of ten glowing beads that glides ahead of the jet at constant speed, cools down a
# block ladder (orange -> yellow -> red -> gray) and shrinks away. Each hoop is one hit in the skill.
# Hoop beads use align none so keyframe translate is in the anchor frame: +z is straight ahead.
# Anchored on the caster, full look (the cannon follows pitch).

id: ember-hoop-cannon
duration_ticks: 24
orient: look
follow: false
sample_ticks: 1

elements:
  - id: jet
    kind: { type: block, block: orange_stained_glass }
    brightness: 15
    glow_color: "#ff7a1a"
    end_tick: 13
    keyframes:
      - { t: 0, translate: [0.0, 1.3, 1.2], scale: [0.3, 0.3, 0.6] }
      - { t: 2, translate: [0.0, 1.3, 4.2], scale: [0.6, 0.6, 6.5], ease: out_expo }
      - { t: 8, block: red_stained_glass }
      - { t: 10, block: gray_stained_glass }
      - { t: 12, scale: [0.0, 0.0, 6.5], ease: in_quad }
    oscillate: { axis: scale_xz, amplitude: 0.1, period_ticks: 2 }

  - id: jet-mid
    kind: { type: block, block: yellow_stained_glass }
    brightness: 15
    end_tick: 10
    keyframes:
      - { t: 0, translate: [0.0, 1.3, 1.1], scale: [0.15, 0.15, 0.5] }
      - { t: 2, translate: [0.0, 1.3, 3.8], scale: [0.32, 0.32, 5.6], ease: out_expo }
      - { t: 9, scale: [0.0, 0.0, 5.6], ease: in_quad }
    oscillate: { axis: scale_xz, amplitude: 0.05, period_ticks: 2 }

  - id: jet-core
    kind: { type: block, block: white_concrete }
    brightness: 15
    end_tick: 7
    keyframes:
      - { t: 0, translate: [0.0, 1.3, 1.0], scale: [0.06, 0.06, 0.4] }
      - { t: 2, translate: [0.0, 1.3, 3.2], scale: [0.14, 0.14, 4.4], ease: out_expo }
      - { t: 6, scale: [0.0, 0.0, 4.4], ease: in_quad }

  - id: flare
    kind: { type: text, text: "<#ffb020>✦", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    end_tick: 7
    keyframes:
      - { t: 0, translate: [0.0, 1.3, 1.0], scale: [0.0, 0.0, 0.0] }
      - { t: 1, scale: [7.0, 7.0, 7.0], ease: out_expo }
      - { t: 6, scale: [0.0, 0.0, 0.0], ease: in_quad }

  # Hoop 1 -- 2 ticks in.
  - id: hoop-1
    kind: { type: block, block: orange_stained_glass }
    brightness: 15
    glow_color: "#ff7a1a"
    count: 10
    start_tick: 2
    end_tick: 11
    formation:
      curve: { type: circle, radius: 0.8 }
      tilt: { yaw: 0, pitch: 90, roll: 0 }
      offset: [0.0, 1.3, 0.9]
      align: none
    keyframes:
      - { t: 0, translate: [0.0, 0.0, 0.0], scale: [0.0, 0.0, 0.0] }
      - { t: 1, scale: [0.38, 0.38, 0.38], ease: out_back }
      - { t: 3, translate: [0.0, 0.0, 3.4], block: yellow_stained_glass }
      - { t: 6, translate: [0.0, 0.0, 8.5], block: red_stained_glass }
      - { t: 7, block: gray_stained_glass }
      - { t: 8, scale: [0.0, 0.0, 0.0], ease: in_quad }

  # Hoop 2 -- 5 ticks in.
  - id: hoop-2
    kind: { type: block, block: orange_stained_glass }
    brightness: 15
    glow_color: "#ff7a1a"
    count: 10
    start_tick: 5
    end_tick: 14
    formation:
      curve: { type: circle, radius: 0.8 }
      tilt: { yaw: 0, pitch: 90, roll: 0 }
      offset: [0.0, 1.3, 0.9]
      align: none
    keyframes:
      - { t: 0, translate: [0.0, 0.0, 0.0], scale: [0.0, 0.0, 0.0] }
      - { t: 1, scale: [0.38, 0.38, 0.38], ease: out_back }
      - { t: 3, translate: [0.0, 0.0, 3.4], block: yellow_stained_glass }
      - { t: 6, translate: [0.0, 0.0, 8.5], block: red_stained_glass }
      - { t: 7, block: gray_stained_glass }
      - { t: 8, scale: [0.0, 0.0, 0.0], ease: in_quad }

  # Hoop 3 -- 8 ticks in, the biggest bead for the closing hit.
  - id: hoop-3
    kind: { type: block, block: orange_stained_glass }
    brightness: 15
    glow_color: "#ff7a1a"
    count: 10
    start_tick: 8
    end_tick: 17
    formation:
      curve: { type: circle, radius: 0.8 }
      tilt: { yaw: 0, pitch: 90, roll: 0 }
      offset: [0.0, 1.3, 0.9]
      align: none
    keyframes:
      - { t: 0, translate: [0.0, 0.0, 0.0], scale: [0.0, 0.0, 0.0] }
      - { t: 1, scale: [0.44, 0.44, 0.44], ease: out_back }
      - { t: 3, translate: [0.0, 0.0, 3.4], block: yellow_stained_glass }
      - { t: 6, translate: [0.0, 0.0, 8.5], block: red_stained_glass }
      - { t: 7, block: gray_stained_glass }
      - { t: 8, scale: [0.0, 0.0, 0.0], ease: in_quad }

  - id: trail
    kind: { type: particle, particle_id: fire-trail, every_ticks: 2 }
    start_tick: 1
    end_tick: 12
    keyframes:
      - { t: 0, translate: [0.0, 1.3, 2.5] }
