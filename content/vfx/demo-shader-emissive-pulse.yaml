# Playable VFX demo; same engine-v2 schema as skills. Film with make vfx-shot SKILL=demo-shader-emissive-pulse
apiVersion: astera/v2
kind: Skill
id: demo-shader-emissive-pulse
meta:
  name: {ja: "シェーダーデモ・emissive-pulse", en: "Shader demo: emissive-pulse"}
  cooldown_ticks: 100
  resource_cost: 0
  tags: [demo, shader]
frames:
  - {id: surface, kind: point, parent: caster, offset: [0, 1.5, 2]}
presentation:
  timeline:
    - id: show
      at: 0
      do:
        - {id: effect, op: mesh, frame: surface, item: iron-warden-chestplate, scale: 2, tilt_turn: [0, 90, 0], shader_effect: emissive-pulse}
    - id: finish
      at: 100
      do:
        - {id: clear, op: remove, ids: [effect]}
