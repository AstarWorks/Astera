# Crimson Chain-Axe S3 shockwave (tick 34): a white-then-red star impact frame, a petal-shaped ring of 12
# glass shards bursting out to ~9 blocks in 6 ticks (out_expo) with a thin white inner ring, and six
# red crack lines running across the floor. Everything fades on a block ladder.
# Local axes: x = left, y = up, z = forward.

id: crimson-chain-axe-quake
duration_ticks: 26
orient: yaw
follow: false
sample_ticks: 2

elements:
  - id: frame-red
    kind: { type: text, text: "<#c0102a>✦</#c0102a>", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    start_tick: 0
    end_tick: 10
    keyframes:
      - { t: 0, translate: [0.0, 1.4, 0.0], scale: [0.0, 0.0, 0.0] }
      - { t: 2, scale: [26.0, 26.0, 26.0], ease: out_expo }
      - { t: 10, scale: [0.0, 0.0, 0.0], ease: in_quad }

  - id: frame-white
    kind: { type: text, text: "<white>✦</white>", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    start_tick: 0
    end_tick: 6
    keyframes:
      - { t: 0, translate: [0.0, 1.4, 0.1], scale: [0.0, 0.0, 0.0] }
      - { t: 1, scale: [18.0, 18.0, 18.0], ease: out_expo }
      - { t: 6, scale: [0.0, 0.0, 0.0], ease: in_quad }

  - id: petal
    kind: { type: block, block: red_stained_glass }
    brightness: 15
    glow_color: "#c0102a"
    start_tick: 0
    end_tick: 20
    count: 12
    formation:
      curve: { type: circle, radius: 1.0 }
      offset: [0.0, 0.25, 0.0]
      align: outward
    jitter: { position: 0.12, rotation_deg: 6, scale: 0.15 }
    keyframes:
      - { t: 0, scale: [0.3, 0.08, 0.1] }
      - { t: 6, translate: [0.0, 0.0, 8.5], scale: [3.6, 0.55, 0.14], ease: out_expo }
      - { t: 10, block: pink_stained_glass }
      - { t: 20, translate: [0.0, 0.0, 9.5], scale: [0.0, 0.55, 0.0], ease: in_quad }

  - id: ring-inner
    kind: { type: block, block: white_concrete }
    brightness: 15
    start_tick: 0
    end_tick: 12
    count: 8
    formation:
      curve: { type: circle, radius: 1.0 }
      offset: [0.0, 0.3, 0.0]
      align: outward
    keyframes:
      - { t: 0, scale: [0.2, 0.04, 0.04] }
      - { t: 5, translate: [0.0, 0.0, 6.0], scale: [2.2, 0.06, 0.05], ease: out_expo }
      - { t: 12, translate: [0.0, 0.0, 7.0], scale: [0.0, 0.06, 0.0], ease: in_quad }

  # Radial floor cracks, drawn outward in 5 ticks and left glowing.
  - id: crack
    kind: { type: block, block: red_concrete }
    brightness: 15
    start_tick: 1
    end_tick: 25
    count: 6
    formation:
      curve: { type: circle, radius: 0.5 }
      offset: [0.0, 0.03, 0.0]
      align: outward
    jitter: { rotation_deg: 8, scale: 0.2 }
    keyframes:
      - { t: 0, scale: [0.05, 0.02, 0.2] }
      - { t: 5, translate: [0.0, 0.0, 3.4], scale: [0.09, 0.02, 7.0], ease: out_expo }
      - { t: 18, translate: [0.0, 0.0, 3.4], scale: [0.05, 0.02, 7.0] }
      - { t: 24, scale: [0.0, 0.02, 7.0], ease: in_quad }
