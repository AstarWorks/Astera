# S2 coin 1 hit (skill tick 9): orange streak + white star + petals; peaks on effect tick 1 = damage tick (played at delay 9).
id: couture-s2-hit1
duration_ticks: 12
orient: world
follow: false
sample_ticks: 1
elements:
- id: star
  kind: {type: quad, color: '#FFFFFF', alpha: 1.0, see_through: true, glyph: ✷}
  billboard: center
  brightness: 15
  start_tick: 0
  end_tick: 6
  keyframes:
  - t: 0
    translate: [0, 1.2, 0]
    scale: [0.5, 0.5, 1]
  - t: 1
    translate: [0, 1.2, 0]
    scale: [2.6, 2.6, 1]
    ease: out_back
  - t: 6
    translate: [0, 1.2, 0]
    scale: [0.0, 0.0, 1]
    ease: in_quad
    alpha: 0.0
- id: orange-streak
  kind: {type: quad, color: '#FF9B3A', alpha: 0.95, see_through: true}
  billboard: center
  brightness: 15
  start_tick: 0
  end_tick: 5
  keyframes:
  - t: 0
    translate: [0, 1.2, 0]
    rotate: [0, 0, 35]
    scale: [0.06, 0.4, 1]
  - t: 1
    translate: [0, 1.2, 0]
    rotate: [0, 0, 35]
    scale: [0.14, 3.6, 1]
    ease: out_expo
  - t: 5
    translate: [0, 1.2, 0]
    rotate: [0, 0, 35]
    scale: [0.0, 3.6, 1]
    ease: in_quad
- id: p-crit
  kind: {type: particle, particle_id: couture-s2-p-crit, every_ticks: 1}
  brightness: 15
  start_tick: 0
  end_tick: 2
  keyframes:
  - t: 0
    translate: [0, 1.2, 0]
- id: p-orange
  kind: {type: particle, particle_id: couture-s2-p-orange, every_ticks: 1}
  brightness: 15
  start_tick: 0
  end_tick: 3
  keyframes:
  - t: 0
    translate: [0, 1.2, 0]
- id: p-petal
  kind: {type: particle, particle_id: couture-s2-p-petal, every_ticks: 2}
  brightness: 15
  start_tick: 1
  end_tick: 8
  keyframes:
  - t: 0
    translate: [0, 1.8, 0]
- id: p-spark
  kind: {type: particle, particle_id: couture-s2-p-spark, every_ticks: 1}
  brightness: 15
  start_tick: 0
  end_tick: 4
  keyframes:
  - t: 0
    translate: [0, 1.2, 0]
