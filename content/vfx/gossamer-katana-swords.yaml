# Gossamer Katana S3 telegraph: six blue after-image blades blink in on a ring around the caster
# (out_back), then rush inward in_cubic and vanish at the hilt. They glow deep blue and are the signal
# that the cyclone is about to start. Anchored on the caster.

id: gossamer-katana-swords
duration_ticks: 14
orient: yaw
follow: false
sample_ticks: 2

elements:
  - id: blade
    kind: { type: item, item: diamond_sword, display_mode: fixed }
    billboard: vertical
    brightness: 15
    glow_color: "#3fa9ff"
    start_tick: 0
    end_tick: 14
    count: 6
    formation:
      curve: { type: circle, radius: 2.2 }
      offset: [0.0, 1.2, 0.0]
      align: outward
      stagger_ticks: 0
    keyframes:
      - { t: 0, translate: [0.0, 0.0, 0.0], scale: [0.2, 0.2, 0.2] }
      - { t: 3, scale: [1.7, 1.7, 1.7], ease: out_back }
      - { t: 9, translate: [0.0, 0.0, -0.5], scale: [1.4, 1.4, 1.4], ease: linear }
      - { t: 12, translate: [0.0, 0.0, -1.9], scale: [0.6, 0.6, 0.6], ease: in_cubic }
      - { t: 13, scale: [0.0, 0.0, 0.0], ease: in_quad }
