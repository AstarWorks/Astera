# Zwei S3 beat 5 (cast tick 70-95), played ON THE TARGET at tick 70: a white pillar (0.4 x 8, off the top of the frame) with a
# yellow bloom, a horizontal light bar at y 1.05 (4.5 long), 18 tapered two-segment lightning spikes fanned over the upper
# half (two arcs of 9 in the vertical plane along the lane), 8 flat ground cracks and a little grey smoke. Solid emissive
# fills (brightness 15), NO glow outlines. Peak ~48 live displays at tick 71.
# Local axes: x = left, y = up, z = forward. rotate = [yaw, pitch, roll] degrees.

id: bastion-s3-slam
duration_ticks: 28
orient: yaw
follow: false
sample_ticks: 1

elements:
  - id: pillar
    kind: { type: block, block: white_concrete }
    brightness: 15
    start_tick: 0
    end_tick: 12
    keyframes:
      - { t: 0, translate: [-0.05, 0.0, -0.05], scale: [0.1, 1.0, 0.1] }
      - { t: 1, translate: [-0.2, 0.0, -0.2], scale: [0.4, 8.0, 0.4], ease: out_expo }
      - { t: 9, translate: [-0.2, 0.0, -0.2], scale: [0.4, 8.0, 0.4] }
      - { t: 12, translate: [0.0, 0.0, 0.0], scale: [0.0, 8.0, 0.0], ease: in_quad }

  - id: bloom
    kind: { type: block, block: yellow_stained_glass }
    brightness: 15
    start_tick: 0
    end_tick: 12
    keyframes:
      - { t: 0, translate: [-0.2, 0.0, -0.2], scale: [0.4, 1.0, 0.4] }
      - { t: 2, translate: [-0.45, 0.0, -0.45], scale: [0.9, 8.0, 0.9], ease: out_expo }
      - { t: 9, translate: [-0.45, 0.0, -0.45], scale: [0.9, 8.0, 0.9] }
      - { t: 12, translate: [0.0, 0.0, 0.0], scale: [0.0, 8.0, 0.0], ease: in_quad }
    oscillate: { axis: scale_x, amplitude: 0.1, period_ticks: 2 }

  # Light bar along the lane (z) at y 1.05: white core + pale-yellow bloom.
  - id: bar
    kind: { type: block, block: white_concrete }
    brightness: 15
    start_tick: 0
    end_tick: 10
    keyframes:
      - { t: 0, translate: [-0.075, 0.975, -0.3], scale: [0.15, 0.15, 0.6] }
      - { t: 2, translate: [-0.075, 0.975, -2.25], scale: [0.15, 0.15, 4.5], ease: out_expo }
      - { t: 9, translate: [-0.075, 0.975, -2.25], scale: [0.15, 0.15, 4.5] }
      - { t: 10, translate: [-0.075, 1.05, 0.0], scale: [0.15, 0.0, 0.0], ease: in_quad }

  - id: bar-bloom
    kind: { type: block, block: yellow_stained_glass }
    brightness: 15
    start_tick: 0
    end_tick: 10
    keyframes:
      - { t: 0, translate: [-0.2, 0.85, -0.3], scale: [0.4, 0.4, 0.6] }
      - { t: 2, translate: [-0.2, 0.85, -2.25], scale: [0.4, 0.4, 4.5], ease: out_expo }
      - { t: 9, translate: [-0.2, 0.85, -2.25], scale: [0.4, 0.4, 4.5] }
      - { t: 10, translate: [-0.2, 1.05, 0.0], scale: [0.4, 0.0, 0.0], ease: in_quad }

  # Spikes: arc 1 fans from forward (5 deg) up to vertical (85 deg); arc 2 from vertical back to behind. The arc lies in
  # the vertical plane along the lane (roll 90). Segment 1 is wide (0.22), segment 2 thin (0.10) and kinked.
  - id: spike-f1
    kind: { type: block, block: yellow_concrete }
    brightness: 15
    start_tick: 0
    end_tick: 11
    count: 9
    formation:
      curve: { type: arc, radius: 0.9, from_deg: 5, to_deg: 85 }
      offset: [0.0, 1.05, 0.0]
      tilt: { yaw: 0, pitch: 0, roll: 90 }
      align: outward
    jitter: { position: 0.0, rotation_deg: 5, scale: 0.5 }
    keyframes:
      - { t: 0, scale: [0.11, 0.22, 0.3] }
      - { t: 2, scale: [0.11, 0.22, 1.5], ease: out_expo }
      - { t: 4, block: white_concrete }
      - { t: 6, block: yellow_concrete }
      - { t: 8, block: white_concrete }
      - { t: 10, block: yellow_concrete }
      - { t: 11, scale: [0.0, 0.0, 1.5], ease: in_quad }

  - id: spike-f2
    kind: { type: block, block: yellow_concrete }
    brightness: 15
    start_tick: 1
    end_tick: 11
    count: 9
    formation:
      curve: { type: arc, radius: 2.4, from_deg: 5, to_deg: 85 }
      offset: [0.0, 1.05, 0.0]
      tilt: { yaw: 0, pitch: 0, roll: 90 }
      align: outward
    jitter: { position: 0.0, rotation_deg: 20, scale: 0.5 }
    keyframes:
      - { t: 0, scale: [0.05, 0.10, 0.2] }
      - { t: 2, scale: [0.05, 0.10, 1.5], ease: out_expo }
      - { t: 5, block: white_concrete }
      - { t: 8, block: yellow_concrete }
      - { t: 10, scale: [0.0, 0.0, 1.5], ease: in_quad }

  - id: spike-b1
    kind: { type: block, block: yellow_concrete }
    brightness: 15
    start_tick: 0
    end_tick: 11
    count: 9
    formation:
      curve: { type: arc, radius: 0.9, from_deg: 95, to_deg: 175 }
      offset: [0.0, 1.05, 0.0]
      tilt: { yaw: 0, pitch: 0, roll: 90 }
      align: outward
    jitter: { position: 0.0, rotation_deg: 5, scale: 0.5 }
    keyframes:
      - { t: 0, scale: [0.11, 0.22, 0.3] }
      - { t: 2, scale: [0.11, 0.22, 1.5], ease: out_expo }
      - { t: 5, block: white_concrete }
      - { t: 7, block: yellow_concrete }
      - { t: 9, block: white_concrete }
      - { t: 11, scale: [0.0, 0.0, 1.5], ease: in_quad }

  - id: spike-b2
    kind: { type: block, block: yellow_concrete }
    brightness: 15
    start_tick: 1
    end_tick: 11
    count: 9
    formation:
      curve: { type: arc, radius: 2.4, from_deg: 95, to_deg: 175 }
      offset: [0.0, 1.05, 0.0]
      tilt: { yaw: 0, pitch: 0, roll: 90 }
      align: outward
    jitter: { position: 0.0, rotation_deg: 20, scale: 0.5 }
    keyframes:
      - { t: 0, scale: [0.05, 0.10, 0.2] }
      - { t: 2, scale: [0.05, 0.10, 1.5], ease: out_expo }
      - { t: 6, block: white_concrete }
      - { t: 8, block: yellow_concrete }
      - { t: 10, scale: [0.0, 0.0, 1.5], ease: in_quad }

  # Ground cracks: flat, 0.06 wide, radiating; fade from tick 12.
  - id: cracks
    kind: { type: block, block: yellow_concrete }
    brightness: 15
    start_tick: 1
    end_tick: 24
    count: 8
    formation:
      curve: { type: circle, radius: 0.3 }
      offset: [0.0, 0.03, 0.0]
      align: outward
    jitter: { position: 0.0, rotation_deg: 15, scale: 0.5 }
    keyframes:
      - { t: 0, scale: [0.06, 0.03, 0.2] }
      - { t: 3, scale: [0.06, 0.03, 1.0], ease: out_expo }
      - { t: 12, block: white_concrete }
      - { t: 14, block: yellow_concrete }
      - { t: 22, scale: [0.0, 0.03, 1.0], ease: in_quad }

  - id: smoke
    kind: { type: particle, particle_id: bastion-s3-smoke, every_ticks: 2 }
    start_tick: 0
    end_tick: 12
    keyframes:
      - { t: 0, translate: [0.0, 0.2, 0.0] }

  - id: debris
    kind: { type: particle, particle_id: bastion-s3-debris, every_ticks: 2 }
    start_tick: 0
    end_tick: 14
    keyframes:
      - { t: 0, translate: [0.0, 0.2, 0.0] }

  - id: sparks
    kind: { type: particle, particle_id: bastion-s3-glint, every_ticks: 2 }
    start_tick: 8
    end_tick: 24
    keyframes:
      - { t: 0, translate: [0.0, 0.2, 0.0] }
