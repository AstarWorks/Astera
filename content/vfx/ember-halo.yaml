# Ember Gauntlet: burning halo around the target (finisher, second beat). A flat ring of twenty-four
# bars snaps out to radius 3 (out_expo) while twelve upright flame shards shoot up inside it and
# lean in. Block ladder orange -> red -> gray, then shrink. Anchored on the target, yaw only.

id: ember-halo
duration_ticks: 22
orient: yaw
follow: false
sample_ticks: 1

elements:
  - id: ring
    kind: { type: block, block: orange_stained_glass }
    brightness: 15
    glow_color: "#ff7a1a"
    count: 24
    end_tick: 18
    formation:
      curve: { type: circle, radius: 0.4 }
      offset: [0.0, 0.8, 0.0]
      align: tangent
    keyframes:
      - { t: 0, scale: [0.1, 0.1, 0.2] }
      - { t: 5, translate: [-2.7, 0.0, 0.0], scale: [0.18, 0.18, 0.9], ease: out_expo }
      - { t: 10, block: red_stained_glass }
      - { t: 13, block: gray_stained_glass }
      - { t: 17, scale: [0.0, 0.0, 0.9], ease: in_quad }

  - id: shard
    kind: { type: block, block: yellow_stained_glass }
    brightness: 15
    glow_color: "#ffb020"
    count: 12
    start_tick: 2
    end_tick: 18
    formation:
      curve: { type: circle, radius: 1.8 }
      align: outward
    jitter: { position: 0.15, rotation_deg: 4, scale: 0.3 }
    keyframes:
      - { t: 0, translate: [0.0, 0.0, 0.0], rotate: [0, -10, 0], scale: [0.1, 0.2, 0.1] }
      - { t: 3, translate: [0.0, 1.1, 0.0], scale: [0.16, 2.2, 0.16], ease: out_expo }
      - { t: 8, block: orange_stained_glass }
      - { t: 11, block: gray_stained_glass }
      - { t: 15, translate: [0.0, 2.1, 0.0], scale: [0.0, 2.2, 0.0], ease: in_quad }
