# Edict Blade: X-cross claw cut on a struck target (played at the target, facing the caster).
# Two long diagonal white lines snap open one tick apart (out_expo), a thin black thorn line crosses them,
# a pale star flashes at the crossing and sparks spit out. Lines cool white -> glass -> pale blue -> gone.
# Local axes: z points caster -> target; the cut plane is x/y.

id: edict-slash-x
duration_ticks: 14
orient: to_target
sample_ticks: 1

elements:
  - id: line-a
    kind: { type: block, block: white_concrete }
    brightness: 15
    glow_color: "#8fb8ff"
    start_tick: 0
    end_tick: 13
    keyframes:
      - { t: 0, translate: [0.0, 1.0, 0.0], rotate: [0, 0, 40], scale: [0.03, 0.2, 0.03] }
      - { t: 2, scale: [0.07, 4.4, 0.07], ease: out_expo }
      - { t: 5, block: white_stained_glass }
      - { t: 9, block: light_blue_stained_glass }
      - { t: 13, scale: [0.0, 4.4, 0.0], ease: in_quad }

  - id: line-b
    kind: { type: block, block: white_concrete }
    brightness: 15
    glow_color: "#8fb8ff"
    start_tick: 1
    end_tick: 13
    keyframes:
      - { t: 0, translate: [0.0, 1.0, 0.0], rotate: [0, 0, -40], scale: [0.03, 0.2, 0.03] }
      - { t: 2, scale: [0.07, 4.4, 0.07], ease: out_expo }
      - { t: 5, block: white_stained_glass }
      - { t: 9, block: light_blue_stained_glass }
      - { t: 12, scale: [0.0, 4.4, 0.0], ease: in_quad }

  - id: thorn
    kind: { type: block, block: black_concrete }
    start_tick: 1
    end_tick: 12
    keyframes:
      - { t: 0, translate: [0.0, 1.0, 0.0], rotate: [0, 0, 75], scale: [0.02, 0.2, 0.02] }
      - { t: 2, scale: [0.05, 3.4, 0.05], ease: out_expo }
      - { t: 11, scale: [0.0, 3.4, 0.0], ease: in_quad }

  - id: crossing
    kind: { type: text, text: "<#dcebff><b>✧</b>", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    start_tick: 1
    end_tick: 9
    keyframes:
      - { t: 0, translate: [0.0, 1.0, 0.1], scale: [0.0, 0.0, 0.0] }
      - { t: 2, scale: [7.0, 7.0, 7.0], ease: out_back }
      - { t: 8, rotate: [0, 0, 60], scale: [0.0, 0.0, 0.0], ease: in_quad }

  - id: sparks
    kind: { type: particle, particle_id: hit-spark, every_ticks: 2 }
    start_tick: 0
    end_tick: 5
    keyframes:
      - { t: 0, translate: [0.0, 1.0, 0.0] }
