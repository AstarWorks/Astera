# Gossamer Katana S1, second beat: the falling counter-cut, a mirror of `-up` (roll -32) in red-edged
# thread colour so the two-hit string reads blue / red. Eight bars + a white core, three petals.

id: gossamer-katana-slash-down
duration_ticks: 10
orient: look
follow: false
sample_ticks: 1

elements:
  - id: edge
    kind: { type: block, block: blue_stained_glass }
    brightness: 15
    glow_color: "#3fa9ff"
    start_tick: 0
    end_tick: 9
    count: 9
    formation:
      curve: { type: arc, radius: 2.4, from_deg: 62, to_deg: -62 }
      tilt: { yaw: 0, pitch: 0, roll: -32 }
      offset: [0.0, 1.5, 0.0]
      align: tangent
    keyframes:
      - { t: 0, scale: [0.03, 0.03, 0.1] }
      - { t: 2, scale: [0.08, 0.08, 0.85], ease: out_expo }
      - { t: 4, block: red_stained_glass }
      - { t: 6, block: white_stained_glass }
      - { t: 8, scale: [0.0, 0.0, 0.85], ease: in_quad }

  - id: core
    kind: { type: block, block: white_concrete }
    brightness: 15
    start_tick: 0
    end_tick: 7
    count: 9
    formation:
      curve: { type: arc, radius: 2.4, from_deg: 62, to_deg: -62 }
      tilt: { yaw: 0, pitch: 0, roll: -32 }
      offset: [0.0, 1.5, 0.0]
      align: tangent
    keyframes:
      - { t: 0, scale: [0.02, 0.02, 0.1] }
      - { t: 2, scale: [0.03, 0.03, 0.9], ease: out_expo }
      - { t: 7, scale: [0.0, 0.0, 0.9], ease: in_quad }

  - id: petal
    kind: { type: text, text: "<#d01030><b>❖</b>", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    start_tick: 2
    end_tick: 9
    count: 3
    formation:
      curve: { type: arc, radius: 0.3, from_deg: 200, to_deg: 340 }
      offset: [1.9, 0.8, 2.3]
      align: outward
    jitter: { position: 0.08, rotation_deg: 0, scale: 0.2 }
    keyframes:
      - { t: 0, scale: [0.0, 0.0, 0.0] }
      - { t: 2, translate: [0.0, 0.0, 0.5], scale: [2.0, 2.0, 2.0], ease: out_expo }
      - { t: 7, translate: [0.0, 0.0, 1.3], scale: [0.0, 0.0, 0.0], ease: in_quad }
