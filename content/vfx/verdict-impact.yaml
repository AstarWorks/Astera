# Verdict Hammer shared impact frame (ADR-0230): a gold star flash, a gold hoop, teal sparks and
# a handful of black shards edged in gold. Anchored on the target; play_vfx `scale` enlarges it.
# Local axes: x = left, y = up, z = forward. rotate = [yaw, pitch, roll] degrees.

id: verdict-impact
duration_ticks: 14
orient: yaw
follow: false
sample_ticks: 2

elements:
  - id: flash
    kind: { type: text, text: "<#ffe27a><b>✦</b>", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    start_tick: 0
    end_tick: 9
    keyframes:
      - { t: 0, translate: [0.0, 1.1, 0.0], scale: [0.0, 0.0, 0.0] }
      - { t: 1, scale: [6.0, 6.0, 6.0], ease: out_expo }
      - { t: 3, scale: [4.5, 4.5, 4.5] }
      - { t: 9, scale: [0.0, 0.0, 0.0], ease: in_quad }

  - id: ring
    kind: { type: block, block: gold_block }
    brightness: 15
    glow_color: "#ffcc40"
    start_tick: 0
    end_tick: 10
    count: 8
    formation:
      curve: { type: circle, radius: 0.25 }
      offset: [0.0, 1.0, 0.0]
      align: outward
    keyframes:
      - { t: 0, scale: [0.12, 0.12, 0.3] }
      - { t: 4, translate: [0.0, 0.0, 1.5], scale: [0.1, 0.1, 0.55], ease: out_expo }
      - { t: 5, block: yellow_stained_glass }
      - { t: 10, translate: [0.0, 0.0, 2.0], scale: [0.0, 0.0, 0.0], ease: in_quad }

  # Teal sparks in every direction.
  - id: spark
    kind: { type: block, block: cyan_concrete }
    brightness: 15
    glow_color: "#3fe0e0"
    start_tick: 0
    end_tick: 9
    count: 6
    formation:
      curve: { type: sphere, radius: 0.2 }
      offset: [0.0, 1.1, 0.0]
      align: outward
    jitter: { position: 0.08, rotation_deg: 12, scale: 0.25 }
    keyframes:
      - { t: 0, scale: [0.05, 0.05, 0.3] }
      - { t: 3, translate: [0.0, 0.0, 1.3], scale: [0.04, 0.04, 0.7], ease: out_cubic }
      - { t: 9, translate: [0.0, 0.0, 1.9], scale: [0.0, 0.0, 0.0], ease: in_quad }

  # Black shards edged in gold (contrast against the light).
  - id: shard
    kind: { type: block, block: black_concrete }
    glow_color: "#ffcc40"
    start_tick: 0
    end_tick: 12
    count: 4
    formation:
      curve: { type: sphere, radius: 0.3 }
      offset: [0.0, 1.0, 0.0]
      align: outward
    jitter: { position: 0.1, rotation_deg: 40, scale: 0.3 }
    keyframes:
      - { t: 0, scale: [0.08, 0.08, 0.08] }
      - { t: 4, translate: [0.0, 0.0, 1.0], rotate: [0, 0, 200], scale: [0.16, 0.16, 0.16], ease: out_cubic }
      - { t: 12, translate: [0.0, -0.4, 1.6], scale: [0.0, 0.0, 0.0], ease: in_quad }
