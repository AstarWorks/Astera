# Couturier's Rapier S1 stitch: a needle-thin cyan thrust that snaps out of the blade (out_expo),
# a white core riding inside it, a tip flash and a few sparks. Local axes: x = left, y = up, z = forward.
# Played three times per cast (the last one scaled up); `-low` is the off-angle variant.

id: couture-rapier-poke
duration_ticks: 8
orient: look
follow: false
sample_ticks: 1

elements:
  - id: shaft
    kind: { type: block, block: cyan_stained_glass }
    brightness: 15
    glow_color: "#3ff0ff"
    start_tick: 0
    end_tick: 7
    keyframes:
      - { t: 0, translate: [0.0, 1.3, 1.0], scale: [0.03, 0.03, 0.3] }
      - { t: 1, translate: [0.0, 1.3, 2.3], scale: [0.08, 0.08, 2.8], ease: out_expo }
      - { t: 3, translate: [0.0, 1.3, 2.3], scale: [0.08, 0.08, 2.8] }
      - { t: 4, block: light_blue_stained_glass }
      - { t: 6, translate: [0.0, 1.3, 3.2], scale: [0.0, 0.0, 2.8], ease: in_quad }

  - id: core
    kind: { type: block, block: white_concrete }
    brightness: 15
    start_tick: 0
    end_tick: 5
    keyframes:
      - { t: 0, translate: [0.0, 1.3, 1.0], scale: [0.02, 0.02, 0.3] }
      - { t: 1, translate: [0.0, 1.3, 2.5], scale: [0.03, 0.03, 3.2], ease: out_expo }
      - { t: 5, translate: [0.0, 1.3, 3.0], scale: [0.0, 0.0, 3.2], ease: in_quad }

  - id: tip
    kind: { type: text, text: "<#d8fff8><b>✦</b>", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    start_tick: 1
    end_tick: 6
    keyframes:
      - { t: 0, translate: [0.0, 1.3, 3.5], scale: [0.0, 0.0, 0.0] }
      - { t: 1, scale: [3.2, 3.2, 3.2], ease: out_back }
      - { t: 4, scale: [0.0, 0.0, 0.0], ease: in_quad }

  - id: sparks
    kind: { type: particle, particle_id: stab-spark, every_ticks: 2 }
    start_tick: 1
    end_tick: 6
    keyframes:
      - { t: 0, translate: [0.0, 1.3, 3.4] }
