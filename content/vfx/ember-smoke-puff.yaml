# Ember Gauntlet: smoke-puff recoil. Right after a shot the gauntlet vents: seven soot cubes balloon
# out behind the caster (out_quad), tumble, and lighten down a block ladder (black -> gray -> light gray) as
# they drift off. Clear read of the "gun is cooling" gap. Anchored on the caster, yaw only. Slots face
# outward from a small sphere centred just behind the hip, so local +z is away from the vent.

id: ember-smoke-puff
duration_ticks: 26
orient: yaw
follow: false
sample_ticks: 2

elements:
  - id: soot
    kind: { type: block, block: black_stained_glass }
    count: 7
    end_tick: 22
    formation:
      curve: { type: sphere, radius: 0.25 }
      offset: [0.0, 1.0, -0.7]
      align: outward
    jitter: { position: 0.08, rotation_deg: 40, scale: 0.3 }
    keyframes:
      - { t: 0, translate: [0.0, 0.0, 0.0], scale: [0.15, 0.15, 0.15] }
      - { t: 5, translate: [0.0, 0.0, 0.9], rotate: [40, 25, 30], scale: [0.85, 0.85, 0.85], ease: out_quad }
      - { t: 9, block: gray_stained_glass }
      - { t: 14, translate: [0.0, 0.0, 1.3], block: light_gray_stained_glass }
      - { t: 21, translate: [0.0, 0.0, 1.5], scale: [0.0, 0.0, 0.0], ease: in_quad }

  - id: vent
    kind: { type: particle, particle_id: fire-smoke, every_ticks: 2 }
    end_tick: 14
    keyframes:
      - { t: 0, translate: [0.0, 1.0, -0.7] }

  - id: haze
    kind: { type: particle, particle_id: gun-smoke, every_ticks: 3 }
    start_tick: 2
    end_tick: 18
    keyframes:
      - { t: 0, translate: [0.0, 1.1, -1.0] }
