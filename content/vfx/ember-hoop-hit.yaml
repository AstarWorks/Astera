# Ember Gauntlet: cheap per-hit mark (hoop landings, jab knuckles, overdrive, guard shove). A gold glyph
# flare and four short orange needles bursting out of the chest -- 5 displays, so several can overlap
# inside the 60-live-displays-per-cast budget. The big landing uses ember-starburst instead.
# Anchored on the target.

id: ember-hoop-hit
duration_ticks: 11
orient: look
follow: false
sample_ticks: 1

elements:
  - id: flare
    kind: { type: text, text: "<#ffb020>✦", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    end_tick: 8
    keyframes:
      - { t: 0, translate: [0.0, 1.2, 0.0], scale: [0.0, 0.0, 0.0] }
      - { t: 1, scale: [5.0, 5.0, 5.0], ease: out_back }
      - { t: 6, scale: [0.0, 0.0, 0.0], ease: in_quad }

  - id: needle
    kind: { type: block, block: orange_stained_glass }
    brightness: 15
    glow_color: "#ff7a1a"
    count: 4
    end_tick: 9
    formation:
      curve: { type: sphere, radius: 0.1 }
      offset: [0.0, 1.2, 0.0]
      align: outward
    jitter: { rotation_deg: 8, scale: 0.3 }
    keyframes:
      - { t: 0, translate: [0.0, 0.0, 0.1], scale: [0.03, 0.03, 0.2] }
      - { t: 2, translate: [0.0, 0.0, 0.7], scale: [0.09, 0.09, 1.1], ease: out_expo }
      - { t: 4, block: red_stained_glass }
      - { t: 8, scale: [0.0, 0.0, 1.1], ease: in_quad }

  - id: embers
    kind: { type: particle, particle_id: fire-impact, every_ticks: 6 }
    end_tick: 4
    keyframes:
      - { t: 0, translate: [0.0, 1.1, 0.0] }
