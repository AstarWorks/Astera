# Vendetta Bayonet: eight beams fired from the ghost rack (vendetta-rack), two ticks apart, all
# converging on a point ~10 blocks ahead. Same arc formation as the rack; the slots face
# backwards (outward), so each beam is yawed 180 and its centre is pushed along local -z.
# Each beam: snap-open (out_expo), colour ladder white -> red -> gray, thin out. Anchored on the caster, yaw only.

id: vendetta-beam-volley
duration_ticks: 28
orient: yaw
follow: false
sample_ticks: 1

elements:
  - id: beam
    kind: { type: block, block: red_stained_glass }
    brightness: 15
    glow_color: "#ff2040"
    count: 8
    slot_lifetime_ticks: 9
    formation:
      curve: { type: arc, radius: 11.6, from_deg: 194, to_deg: 166 }
      offset: [0.0, 1.9, 10.0]
      align: outward
      stagger_ticks: 2
    keyframes:
      - { t: 0, translate: [0.0, 0.0, -0.3], rotate: [180, 0, 0], scale: [0.04, 0.04, 0.4] }
      - { t: 1, translate: [0.0, 0.0, -6.8], scale: [0.16, 0.16, 13.6], ease: out_expo }
      - { t: 4, block: magenta_stained_glass }
      - { t: 6, block: gray_stained_glass }
      - { t: 8, scale: [0.0, 0.0, 13.6], ease: in_quad }

  - id: core
    kind: { type: block, block: white_concrete }
    brightness: 15
    count: 8
    slot_lifetime_ticks: 6
    formation:
      curve: { type: arc, radius: 11.6, from_deg: 194, to_deg: 166 }
      offset: [0.0, 1.9, 10.0]
      align: outward
      stagger_ticks: 2
    keyframes:
      - { t: 0, translate: [0.0, 0.0, -0.3], rotate: [180, 0, 0], scale: [0.02, 0.02, 0.4] }
      - { t: 1, translate: [0.0, 0.0, -6.8], scale: [0.05, 0.05, 13.6], ease: out_expo }
      - { t: 5, scale: [0.0, 0.0, 13.6], ease: in_quad }

  # One muzzle puff per barrel as it fires.
  - id: muzzle
    kind: { type: particle, particle_id: gun-muzzle-flash, every_ticks: 8 }
    count: 8
    slot_lifetime_ticks: 2
    formation:
      curve: { type: arc, radius: 11.6, from_deg: 194, to_deg: 166 }
      offset: [0.0, 1.9, 10.0]
      align: outward
      stagger_ticks: 2
    keyframes:
      - { t: 0, translate: [0.0, 0.0, -0.8] }
