# Vendetta Bayonet: point-blank muzzle thrust (the heavy third beat of the S1 combo).
# Piercing beam through the target, a white flash glyph, and an orange shock ring.
# Anchored on the target; the beam runs from behind the caster through the body.

id: vendetta-thrust-flash
duration_ticks: 16
orient: look
follow: false
sample_ticks: 1

elements:
  - id: beam
    kind: { type: block, block: orange_stained_glass }
    brightness: 15
    glow_color: "#ff8a1f"
    end_tick: 12
    keyframes:
      - { t: 0, translate: [0.0, 1.2, -0.4], scale: [0.04, 0.04, 0.4] }
      - { t: 1, translate: [0.0, 1.2, -1.6], scale: [0.2, 0.2, 5.0], ease: out_expo }
      - { t: 4, block: red_stained_glass }
      - { t: 7, block: gray_stained_glass }
      - { t: 11, scale: [0.0, 0.0, 5.0], ease: in_quad }

  - id: beam-core
    kind: { type: block, block: white_concrete }
    brightness: 15
    end_tick: 8
    keyframes:
      - { t: 0, translate: [0.0, 1.2, -0.4], scale: [0.02, 0.02, 0.4] }
      - { t: 1, translate: [0.0, 1.2, -1.6], scale: [0.07, 0.07, 5.4], ease: out_expo }
      - { t: 7, scale: [0.0, 0.0, 5.4], ease: in_quad }

  - id: flash
    kind: { type: text, text: "<#ffffff>✦", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    end_tick: 9
    keyframes:
      - { t: 0, translate: [0.0, 1.2, 0.0], scale: [0.0, 0.0, 0.0] }
      - { t: 1, scale: [9.0, 9.0, 9.0], ease: out_expo }
      - { t: 7, scale: [0.0, 0.0, 0.0], ease: in_quad }

  # Shock ring: tangent bars that slide outward (local -x is outward for a tangent-aligned arc slot)
  # and lengthen so the ring stays closed while it grows.
  - id: ring
    kind: { type: block, block: orange_stained_glass }
    brightness: 15
    glow_color: "#ff8a1f"
    count: 14
    start_tick: 1
    end_tick: 12
    formation:
      curve: { type: circle, radius: 0.35 }
      offset: [0.0, 1.1, 0.0]
      align: tangent
    keyframes:
      - { t: 0, scale: [0.08, 0.08, 0.2] }
      - { t: 7, translate: [-2.1, 0.0, 0.0], scale: [0.05, 0.05, 1.0], ease: out_expo }
      - { t: 10, scale: [0.0, 0.0, 1.0], ease: in_quad }

  - id: muzzle
    kind: { type: particle, particle_id: shotgun-muzzle, every_ticks: 4 }
    end_tick: 5
    keyframes:
      - { t: 0, translate: [0.0, 1.2, -1.0] }
