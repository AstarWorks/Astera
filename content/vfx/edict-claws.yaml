# Edict Blade: the claw flurry -- eight long white lines crossing through one point at random angles, all
# appearing inside the same two ticks (jittered rotation, seeded per cast), plus a puff of blue petals.
# Lines cool white -> glass -> pale blue and thin away. Played at the victim. Local axes: z = caster -> target.

id: edict-claws
duration_ticks: 14
orient: to_target
sample_ticks: 1

elements:
  - id: lines
    kind: { type: block, block: white_concrete }
    brightness: 15
    count: 8
    start_tick: 0
    end_tick: 12
    formation:
      curve: { type: arc, radius: 0.01, from_deg: 0, to_deg: 360 }
      offset: [0.0, 1.0, 0.0]
    jitter: { position: 0.35, rotation_deg: 75, scale: 0.25 }
    group_keyframes:
      - { t: 0, rotate: [0, 0, 0] }
      - { t: 2, rotate: [0, 0, 0] }
      - { t: 12, rotate: [0, 0, 28], ease: out_quad }
    keyframes:
      - { t: 0, scale: [0.02, 0.2, 0.02] }
      - { t: 2, scale: [0.06, 6.5, 0.06], ease: out_expo }
      - { t: 4, scale: [0.045, 6.0, 0.045], ease: out_quad }
      - { t: 6, block: white_stained_glass, scale: [0.035, 5.0, 0.035] }
      - { t: 8, block: light_blue_stained_glass, scale: [0.03, 4.0, 0.03] }
      - { t: 10, scale: [0.02, 2.6, 0.02] }
      - { t: 12, scale: [0.0, 1.2, 0.0], ease: in_quad }
    oscillate: { axis: scale_xz, amplitude: 0.01, period_ticks: 2 }

  - id: petals
    kind: { type: block, block: light_blue_concrete }
    brightness: 12
    count: 6
    start_tick: 1
    end_tick: 13
    formation:
      curve: { type: sphere, radius: 0.4 }
      offset: [0.0, 1.0, 0.0]
      align: outward
    jitter: { rotation_deg: 40, scale: 0.3 }
    keyframes:
      - { t: 0, scale: [0.12, 0.12, 0.02] }
      - { t: 8, translate: [0.0, -0.3, 2.2], rotate: [90, 120, 220], scale: [0.18, 0.18, 0.02], ease: out_cubic }
      - { t: 12, translate: [0.0, -0.9, 2.5], scale: [0.0, 0.0, 0.0], ease: in_quad }
