# Bastion S3 beat 11 (video n99-132, pillar peak t66-68): THICK vertical gold light pillar (bastion-s3-pillar: dark rim + gold + white core, 0.9 block wide, 4.6 high, 2 crossing front+back plane pairs) rising at the planted sword (1.4 forward), horizontal cross bar (bastion-s3-bar, 4 planes), radial jagged lightning spikes (bastion-s3-spikes, 2 sizes), then electric gold floor sparks until ~t84.
# r4: spikes = straight BLADE triangles (dark edge, gold core, 9 per frame, 1.5-3 blocks at scale 1, base >= 0.45 block), bar 5.6 x 0.75 block hexagon blade, pillar 1.28 block wide with dark slivers; same 9 peak displays.
# r3: bar = 1 crisp center-billboard bastion-s3-pillar-bar (4+ blocks wide, y 1.4); spikes = bastion-s3-pillar-spikes (UP/outward from the base, 2 sprites); floor electricity = bastion-s3-pillar-crackle (ticks 8-24 = t71-87, 4 frames dense -> sparse) + spark particles to tick 24. Peak displays: 4 pillar + 1 bar + 2 spikes + root flash + crackle = 9.
# Played at skill tick 63: the pillar rises at effect ticks 2-4 (t65-67), holds to tick 10 (t73), narrows out by 13 (t76); bar to tick 7, spikes ticks 2-8; floor sparks end at tick 21.
# Display budget: peak 11 sprite displays (4 pillar planes, 4 bar, 2 spikes, 1 root flash), the rest vanilla particles.
