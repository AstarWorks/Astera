# Edict Blade: the heavy downward cut that closes the dash combo -- one tall white line drops through the
# target (out_expo) and a small eight-spike star pops at the contact point. Played at the target, facing the
# caster. Local axes: x = left, y = up, z = caster -> target.

id: edict-slash-v
duration_ticks: 14
orient: to_target
sample_ticks: 1

elements:
  - id: line
    kind: { type: block, block: white_concrete }
    brightness: 15
    start_tick: 0
    end_tick: 13
    keyframes:
      - { t: 0, translate: [0.0, 2.6, 0.0], scale: [0.04, 0.3, 0.04] }
      - { t: 2, translate: [0.0, 1.0, 0.0], scale: [0.09, 5.4, 0.09], ease: out_expo }
      - { t: 6, block: white_stained_glass }
      - { t: 13, scale: [0.0, 5.4, 0.0], ease: in_quad }

  - id: star
    kind: { type: block, block: white_concrete }
    brightness: 15
    count: 8
    start_tick: 1
    end_tick: 10
    formation:
      curve: { type: arc, radius: 0.15, from_deg: 0, to_deg: 360 }
      tilt: { yaw: 0, pitch: 90, roll: 0 }
      offset: [0.0, 1.0, 0.0]
      align: outward
    jitter: { scale: 0.3 }
    keyframes:
      - { t: 0, scale: [0.04, 0.04, 0.2] }
      - { t: 2, translate: [0.0, 0.0, 0.9], scale: [0.05, 0.05, 1.7], ease: out_expo }
      - { t: 9, translate: [0.0, 0.0, 1.2], scale: [0.0, 0.0, 1.7], ease: in_quad }

  - id: flare
    kind: { type: text, text: "<#ffffff><b>★</b>", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    start_tick: 1
    end_tick: 8
    keyframes:
      - { t: 0, translate: [0.0, 1.0, 0.1], scale: [0.0, 0.0, 0.0] }
      - { t: 1, scale: [11.0, 11.0, 11.0], ease: out_expo }
      - { t: 7, scale: [0.0, 0.0, 0.0], ease: in_quad }
