# Bastion S1 hit1 (video 11.933-12.5s): one tall tilted gold crescent over the shoulder + a thinner white one inside, white waist streaks.
# Rig t0 = 6 ticks before the contact; blade passes the front at t4, the crescent sprite pops at contact-2 and peaks on the contact (t6).

id: bastion-sweep-high
duration_ticks: 24
orient: yaw
follow: false
sample_ticks: 1
rigs:
- id: sword
  pivot: [-0.1, 1.15, 0.2]
  rest: [0, 90, 0]
  tilt: [0, 0, 24]
  respect_hit_stop: true
  end_tick: 23
  parts:
  - id: face
    block: gray_concrete
    offset: [0, 1.55, 0]
    size: [0.46, 1.9, 0.07]
  - id: rim_l
    block: white_concrete
    offset: [0.25, 1.55, 0]
    size: [0.07, 1.9, 0.12]
  - id: rim_r
    block: white_concrete
    offset: [-0.25, 1.55, 0]
    size: [0.07, 1.9, 0.12]
  - id: tip
    block: white_concrete
    offset: [0, 2.5, 0]
    size: [0.58, 0.08, 0.12]
  - id: base
    block: white_concrete
    offset: [0, 0.62, 0]
    size: [0.58, 0.08, 0.12]
  - id: inset
    block: yellow_concrete
    offset: [0, 0.86, 0]
    size: [0.09, 0.2, 0.09]
  - id: guard
    block: black_concrete
    offset: [0, 0.5, 0]
    size: [0.62, 0.1, 0.18]
  - id: grip
    block: black_concrete
    offset: [0, 0.05, 0]
    size: [0.09, 0.8, 0.09]
  swing:
  - t: 0
    rotate: [262, 40, 0]
  - t: 1
    rotate: [266, 40, 0]
  - t: 4
    rotate: [-96, 14, 0]
    ease: linear
  - t: 7
    rotate: [-112, 18, 0]
    ease: out_cubic
  - t: 12
    rotate: [-104, 26, 0]
  - t: 20
    rotate: [180, 42, 0]
    ease: in_out_quad
  trails:
  - id: wind
    from: [0, 0.7, 0]
    to: [0, 2.55, 0]
    start_t: 1
    end_t: 8
    life_ticks: 9
    lag_ticks: 0
    style: soft
    step_deg: 20
    fade_power: 1.0
    bands:
    - from: 0.0
      to: 0.8
      color: '#00FFC040'
      color_to: '#00FFC040'
    - from: 0.8
      to: 0.93
      color: '#C0FFC83A'
      color_to: '#30FFA818'
    - from: 0.93
      to: 1.0
      color: '#FFFFFBE0'
      color_to: '#80FFE070'
    edge:
      block: white_concrete
      width: 0.04
    dark_rim:
      color: '#B0180C04'
      width: 0.16
elements:
- id: streaks
  kind:
    type: block
    block: white_concrete
  brightness: 15
  start_tick: 6
  end_tick: 14
  count: 5
  formation:
    curve:
      type: line
      from: [0.0, 0.9, 0.5]
      to: [0.0, 1.7, 0.5]
  jitter:
    position: 0.12
    scale: 0.45
  keyframes:
  - t: 0
    scale: [0.09, 0.09, 0.3]
  - t: 2
    translate: [0, 0, 2.5]
    scale: [0.09, 0.09, 5.0]
    ease: out_expo
  - t: 7
    translate: [0, 0, 4.5]
    scale: [0, 0, 5.0]
    ease: in_quad
- id: arc0
  kind:
    type: sprite
    sprite: bastion-arc
    frame_ticks: 2
    loop: false
    see_through: true
  billboard: center
  brightness: 15
  start_tick: 3
  end_tick: 15
  keyframes:
  - t: 0
    translate: [0, 0.35, 1.0]
    rotate: [0, 0, -18]
    scale: [1.75, 1.15, 1.0]
- id: arc1
  kind:
    type: sprite
    sprite: bastion-arc
    frame_ticks: 2
    loop: false
    see_through: true
    color: '#FFFFFF'
  billboard: center
  brightness: 15
  start_tick: 3
  end_tick: 15
  keyframes:
  - t: 0
    translate: [0, 0.55, 1.0]
    rotate: [0, 0, -18]
    scale: [1.35, 0.8, 1.0]
- id: flash
  kind:
    type: quad
    glyph: ✦
    color: '#FFEFA0'
    alpha: 1.0
  brightness: 15
  start_tick: 6
  end_tick: 10
  keyframes:
  - t: 0
    translate: [0, 1.2, 2.6]
    scale: [0.135, 0.135, 1.0]
  - t: 1
    scale: [0.9, 0.9, 1.0]
    ease: out_back
  - t: 4
    scale: [0.45, 0.45, 1.0]
    color: '#FF9A30'
    alpha: 0.0
    ease: out_quad
