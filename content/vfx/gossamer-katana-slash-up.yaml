# Gossamer Katana S1, first beat: a rising crescent. Nine bars on a tilted arc grow along their tangent
# (out_expo) into an ice-blue edge with a white core, then a block-ladder fade; four snowflake petals
# scatter off the end of the cut. `-down` is the mirrored falling cut. Local axes: x = left, y = up, z = forward.

id: gossamer-katana-slash-up
duration_ticks: 10
orient: look
follow: false
sample_ticks: 1

elements:
  - id: edge
    kind: { type: block, block: light_blue_stained_glass }
    brightness: 15
    glow_color: "#8fe8ff"
    start_tick: 0
    end_tick: 9
    count: 9
    formation:
      curve: { type: arc, radius: 2.4, from_deg: -62, to_deg: 62 }
      tilt: { yaw: 0, pitch: 0, roll: 32 }
      offset: [0.0, 1.1, 0.0]
      align: tangent
    keyframes:
      - { t: 0, scale: [0.03, 0.03, 0.1] }
      - { t: 2, scale: [0.08, 0.08, 0.85], ease: out_expo }
      - { t: 5, block: white_stained_glass }
      - { t: 8, scale: [0.0, 0.0, 0.85], ease: in_quad }

  - id: core
    kind: { type: block, block: white_concrete }
    brightness: 15
    start_tick: 0
    end_tick: 7
    count: 9
    formation:
      curve: { type: arc, radius: 2.4, from_deg: -62, to_deg: 62 }
      tilt: { yaw: 0, pitch: 0, roll: 32 }
      offset: [0.0, 1.1, 0.0]
      align: tangent
    keyframes:
      - { t: 0, scale: [0.02, 0.02, 0.1] }
      - { t: 2, scale: [0.03, 0.03, 0.9], ease: out_expo }
      - { t: 7, scale: [0.0, 0.0, 0.9], ease: in_quad }

  - id: petal
    kind: { type: text, text: "<#8fe8ff><b>❖</b>", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    start_tick: 2
    end_tick: 9
    count: 4
    formation:
      curve: { type: arc, radius: 0.3, from_deg: 20, to_deg: 160 }
      offset: [-1.9, 1.7, 2.3]
      align: outward
    jitter: { position: 0.08, rotation_deg: 0, scale: 0.2 }
    keyframes:
      - { t: 0, scale: [0.0, 0.0, 0.0] }
      - { t: 2, translate: [0.0, 0.0, 0.5], scale: [2.0, 2.0, 2.0], ease: out_expo }
      - { t: 7, translate: [0.0, 0.0, 1.3], scale: [0.0, 0.0, 0.0], ease: in_quad }
