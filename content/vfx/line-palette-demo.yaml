id: line-palette-demo
duration_ticks: 30
orient: yaw
follow: true
sample_ticks: 1
palette:
  main:
    day: "#FFD36A"
    night: "#7FA8FF"
  accent:
    day: "#FFFFFF"
    night: "#C9B8FF"
elements:
- id: beads
  kind: {type: dotted_line, from: [0, 1.2, 0.5], to: [0, 1.2, 4.5], spacing: 0.3, sprite: dot, color: $main}
  start_tick: 0
  end_tick: 30
  keyframes:
  - {t: 0, alpha: 1}
  - {t: 30, alpha: 0}
- id: wire
  kind: {type: thin_line, from: [0.4, 1.0, 0.5], to: [0.4, 1.8, 4.5], width: 0.04, color: $accent}
  start_tick: 0
  end_tick: 30
  keyframes:
  - {t: 0, alpha: 0.9}
  - {t: 30, alpha: 0}
