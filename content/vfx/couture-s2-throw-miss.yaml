# S2 throw when nothing is in range (ADR-0286): the shears fly to max range and hang there; no chain, no link, no burst.
id: couture-s2-throw-miss
duration_ticks: 30
orient: yaw
follow: false
sample_ticks: 1
elements:
- id: fly-shears
  kind: {type: item, item: shears, item_model: 'astera:couture-rapier', display_mode: fixed}
  brightness: 15
  start_tick: 4
  end_tick: 16
  keyframes:
  - {t: 0, translate: [0.0, 3.6, 0.4], rotate: [90, 0, 0], scale: [1, 1, 1]}
  - {t: 5, translate: [0.0, 1.3, 7.6], rotate: [90, 0, 0], scale: [1, 1, 1], ease: in_out_cubic}
  - {t: 12, translate: [0.0, 1.3, 7.6], rotate: [90, 0, 0], scale: [1, 1, 1]}
- id: loop-d
