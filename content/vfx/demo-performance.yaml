# ADR-0276 demo performance: the skin-rig body (content/animations/performance-demo.yaml) and ONE weapon display (the caster's real
# main-hand stack) hanging from the body's right hand, on one clock. A cut at rig tick 6 (ease: step on body and wrist) makes both
# jump in the same server tick. Cast with `vfx-demo-performance`; freeze = hit-stop window.
id: demo-performance
duration_ticks: 20
orient: yaw
follow: true
attach_to_anchor: true
sample_ticks: 1
replace_group: performance-demo
body: performance-demo
rigs:
- id: sword
  pivot: [0, 0, 0]
  parent: right_hand
  weapon: main_hand
  weapon_tip: [0.0, 1.2, 0.0]
  respect_hit_stop: true
  swing:
  - { t: 0, rotate: [0, 0, 0] }
  - { t: 6, rotate: [0, 70, 0], ease: step }
  - { t: 14, rotate: [0, 70, 0] }
  - { t: 18, rotate: [0, 0, 0], ease: in_out_quad }
