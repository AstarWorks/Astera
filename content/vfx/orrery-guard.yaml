# Orrery Staff: counter-seal guard -- an armillary of three gold hoops (tilted 0 / 60 / 120 degrees)
# draws on around the caster ring-by-ring (stagger), holds while the evade window is open, then collapses.
# A glyph wheel pulses at the chest. Local axes: x = left, y = up, z = forward (yaw only).

id: orrery-guard
duration_ticks: 30
orient: yaw
sample_ticks: 2

elements:
  - id: hoop-a
    kind: { type: block, block: gold_block }
    brightness: 15
    glow_color: "#ffb000"
    count: 8
    start_tick: 0
    slot_lifetime_ticks: 22
    formation:
      curve: { type: arc, radius: 1.35, from_deg: 0, to_deg: 360 }
      tilt: { yaw: 0, pitch: 90, roll: 0 }
      offset: [0.0, 1.0, 0.0]
      align: tangent
      stagger_ticks: 1
    group_keyframes:
      - { t: 0, rotate: [0, 0, 0] }
      - { t: 22, rotate: [160, 0, 0], ease: out_cubic }
    keyframes:
      - { t: 0, scale: [0.07, 0.07, 0.2] }
      - { t: 2, scale: [0.08, 0.08, 1.15], ease: out_expo }
      - { t: 14, block: yellow_stained_glass }
      - { t: 22, scale: [0.08, 0.08, 0.0], ease: in_quad }

  - id: hoop-b
    kind: { type: block, block: gold_block }
    brightness: 15
    count: 8
    start_tick: 2
    slot_lifetime_ticks: 22
    formation:
      curve: { type: arc, radius: 1.35, from_deg: 0, to_deg: 360 }
      tilt: { yaw: 60, pitch: 90, roll: 0 }
      offset: [0.0, 1.0, 0.0]
      align: tangent
      stagger_ticks: 1
      reverse: true
    group_keyframes:
      - { t: 0, rotate: [0, 0, 0] }
      - { t: 22, rotate: [160, 0, 0], ease: out_cubic }
    keyframes:
      - { t: 0, scale: [0.07, 0.07, 0.2] }
      - { t: 2, scale: [0.08, 0.08, 1.15], ease: out_expo }
      - { t: 14, block: yellow_stained_glass }
      - { t: 22, scale: [0.08, 0.08, 0.0], ease: in_quad }

  - id: hoop-c
    kind: { type: block, block: orange_concrete }
    brightness: 15
    count: 8
    start_tick: 4
    slot_lifetime_ticks: 22
    formation:
      curve: { type: arc, radius: 1.35, from_deg: 0, to_deg: 360 }
      tilt: { yaw: 120, pitch: 90, roll: 0 }
      offset: [0.0, 1.0, 0.0]
      align: tangent
      stagger_ticks: 1
    group_keyframes:
      - { t: 0, rotate: [0, 0, 0] }
      - { t: 22, rotate: [160, 0, 0], ease: out_cubic }
    keyframes:
      - { t: 0, scale: [0.07, 0.07, 0.2] }
      - { t: 2, scale: [0.08, 0.08, 1.15], ease: out_expo }
      - { t: 14, block: yellow_stained_glass }
      - { t: 22, scale: [0.08, 0.08, 0.0], ease: in_quad }

  - id: wheel
    kind: { type: text, text: "<#ffb000><b>◎</b>", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    start_tick: 0
    end_tick: 26
    keyframes:
      - { t: 0, translate: [0.0, 1.0, 0.0], rotate: [0, 0, 0], scale: [0.0, 0.0, 0.0] }
      - { t: 4, scale: [7.0, 7.0, 7.0], ease: out_back }
      - { t: 26, rotate: [0, 0, 540], scale: [0.0, 0.0, 0.0], ease: in_out_quad }
