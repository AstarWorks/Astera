# Couturier's Rapier finisher: a gold dome blooms out of the struck target. 20 bars on a Fibonacci sphere
# are flung outward (out_expo) and lengthen into rays, a ring of 12 ground rays races across the floor,
# a pale pillar and a big ✦ mark the centre. Fade is a block ladder (gold -> white -> clear glass).
# Anchored on the target, yaw-oriented so the dome is symmetric.

id: couture-rapier-dome
duration_ticks: 30
orient: yaw
follow: false
sample_ticks: 2

elements:
  - id: shell
    kind: { type: block, block: yellow_stained_glass }
    brightness: 15
    glow_color: "#ffd24a"
    start_tick: 0
    end_tick: 26
    count: 20
    formation:
      curve: { type: sphere, radius: 0.4 }
      offset: [0.0, 1.1, 0.0]
      align: outward
    jitter: { position: 0.03, rotation_deg: 0, scale: 0.15 }
    keyframes:
      - { t: 0, translate: [0.0, 0.0, 0.0], scale: [0.08, 0.08, 0.1] }
      - { t: 4, translate: [0.0, 0.0, 1.8], scale: [0.2, 0.2, 0.9], ease: out_expo }
      - { t: 14, translate: [0.0, 0.0, 2.3], scale: [0.16, 0.16, 0.7], ease: out_quad }
      - { t: 15, block: white_stained_glass }
      - { t: 21, block: glass }
      - { t: 25, translate: [0.0, 0.0, 2.6], scale: [0.0, 0.0, 0.0], ease: in_quad }

  - id: floor-ray
    kind: { type: block, block: yellow_stained_glass }
    brightness: 15
    glow_color: "#ffd24a"
    start_tick: 1
    end_tick: 20
    count: 12
    formation:
      curve: { type: circle, radius: 0.6 }
      offset: [0.0, 0.06, 0.0]
      align: outward
    keyframes:
      - { t: 0, translate: [0.0, 0.0, 0.0], scale: [0.05, 0.03, 0.2] }
      - { t: 4, translate: [0.0, 0.0, 1.8], scale: [0.08, 0.03, 1.5], ease: out_expo }
      - { t: 12, block: white_stained_glass }
      - { t: 18, translate: [0.0, 0.0, 3.0], scale: [0.0, 0.03, 1.5], ease: in_quad }

  - id: pillar
    kind: { type: block, block: white_concrete }
    brightness: 15
    glow_color: "#fff0b0"
    start_tick: 0
    end_tick: 14
    keyframes:
      - { t: 0, translate: [0.0, 4.0, 0.0], scale: [0.1, 8.0, 0.1] }
      - { t: 2, scale: [0.55, 8.0, 0.55], ease: out_expo }
      - { t: 5, block: yellow_stained_glass }
      - { t: 14, scale: [0.0, 8.0, 0.0], ease: in_quad }

  - id: star
    kind: { type: text, text: "<#ffe27a><b>✦</b>", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    start_tick: 0
    end_tick: 12
    keyframes:
      - { t: 0, translate: [0.0, 1.2, 0.0], scale: [0.0, 0.0, 0.0] }
      - { t: 2, scale: [10.0, 10.0, 10.0], ease: out_back }
      - { t: 11, scale: [0.0, 0.0, 0.0], ease: in_quad }
