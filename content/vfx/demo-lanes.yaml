# Per-viewer quality demo: one element per lane (core, accent, ambient). The audience / intensity scenario
# counts which of them each viewer is shown. Cast with content/skills/vfx-demo-lanes-*.yaml.

id: demo-lanes
duration_ticks: 20
orient: yaw
follow: false
sample_ticks: 2

elements:
  - id: core-flash
    lane: core
    kind: { type: block, block: white_stained_glass }
    brightness: 15
    keyframes:
      - { t: 0, translate: [0.0, 1.5, 2.0], scale: [0.4, 0.4, 0.4] }

  - id: accent-ring
    lane: accent
    kind: { type: block, block: yellow_stained_glass }
    brightness: 15
    keyframes:
      - { t: 0, translate: [0.5, 1.5, 2.0], scale: [0.3, 0.3, 0.3] }

  - id: ambient-dust
    lane: ambient
    kind: { type: block, block: gray_stained_glass }
    brightness: 15
    keyframes:
      - { t: 0, translate: [-0.5, 1.5, 2.0], scale: [0.2, 0.2, 0.2] }
