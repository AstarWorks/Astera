apiVersion: astera/v3
kind: Skill
id: demo-shader-dissolve
meta:
  name:
    ja: シェーダーデモ・dissolve
    en: 'Shader demo: dissolve'
  cooldown_ticks: 100
  resource_cost: 0
  tags:
  - demo
  - shader
anchors:
- id: surface
  anchor: caster
  offset:
    up: 1.5
    forward: 2
machine:
  start: show
  states:
    show:
      for: 100
      do:
      - id: surface
        op: display
        kind: item
        anchor: surface
        for: 100
        item: iron-warden-chestplate
        scale:
        - 2
        - 2
        - 2
        rotate:
        - axis: up
          deg: 90
        shader_effect: dissolve
      then: end
    end:
      final: true
