# S1 sword: ONE rig (one set of sword displays) for the whole skill: hold -> swing 1 -> hold -> swing 2 -> hold. No hand-over, no duplicate sword.
# Play at skill tick 0 with follow: true (rides the caster through the dashes), duration 58 (rig visible through tick 57; hide_held_item 57 ticks with NO delay: the runtime stages the rig spawn (view_range 0 until age 1) and hides the held item in the same tick, 78dfd0f4),
# play_vfx freeze: [{ at: 7, ticks: 2 }, { at: 31, ticks: 2 }]  (effect ticks; the hit_stop of both contacts).
# Rig key time l is displayed at effect tick l + 1 (+ frozen ticks before it). Hit 1: e_k (e4 = contact) -> key k+2, contact displayed at effect tick 7.
# Round 6 (founder: the weapon barely moved): both hits are BIG arcs. Hit 1 = overhead chop in a vertical plane tilted 22 deg (top leans to the caster's right):
# lift behind (keys 0-3, ticks 1-4), chop over the head 150+ deg in 3 ticks (keys 3-6, ticks 4-7, blade straight up at key 4), contact held ticks 7-8 (r7: in-plane tip phi 6 pitch -15, tip y 0.11),
# then a floor-level drag to the left and round behind with overshoot (keys 7-17), REST by key 18. Hit 2 = low horizontal ring (plane lowest at phi 60, highest at 240, 14 deg tilt, centre pitch -8):
# pull-back keys 21-22, keys 23-28 ON the plane (r7, vfx ring), 220 deg in 5 ticks, contact key 28 = tick 31 (held 31-32; pitch clamped to -15 where the plane dips under the floor: phi 0-110), follow-through round the left/back with overshoot, REST by key 39.
# Face = plane normal in the chop (edge leads), ~28 deg off vertical in the ring (face visible from the side camera), rolls back to the sideways REST face.
# Round 7: pivot = the held item's fist [-0.348, 0.773, 0.293] (handover_s1.py), so REST / floor keys use pitch -15 (tip y 0.11; -20 would sink under the floor).
# Keys 42-52 lift OUTSIDE the first-person frustum: REST -> up the caster's right side (slerp, keys 42-48, tip right-up phi 270 pitch 52 at key 48 = tick 53)
# -> horizontal wiper in to the held pose (keys 49-52, ticks 54-57); key 52 = held item exactly (0.0 deg, grip offset 0). FP coverage <= 6% (perspective ray-cast).
# Key -> tick: l+1 (l<=6), l+3 (7..28), l+5 (29+).
# Per-key numbers: tools/skill-compare/data/bastion-greatsword-s1/evidence/animator/r7/per-key-tip-face.txt.
# Swing euler values are solved by script from per-tick tip targets (phi, pitch) and edge roll; see deliver/animation-notes.md.
# Anchor frame x=left y=up z=forward. tilt roll -20: the caster's right end of the swing plane is higher.
# Parts: verbatim deliver/rig-parts.yaml (22 parts, round 7: + guard_plate, hilt_flare). Face normal = local Z, edges = +-X, blade = +Y. fx / sprites live in bastion-s1-fx-high/low.yaml.

