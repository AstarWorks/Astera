# pull-back keys 21-22, keys 23-28 ON the plane (r7, vfx ring), 220 deg in 5 ticks, contact key 28 = tick 31 (held 31-32; pitch clamped to -15 where the plane dips under the floor: phi 0-110), follow-through round the left/back with overshoot, REST by key 39.
# Face ~28 deg off the plane normal in both sweeps (edge leads, face still visible from the side cameras), rolls back to the sideways REST face.
# Round 7: pivot = the held item's fist [-0.348, 0.773, 0.293] (handover_s1.py), so REST / floor keys use pitch -15 (tip y 0.11; -20 would sink under the floor).
# Keys 40-46 (r11: same path as r8's 40-50, re-timed 11 -> 7 chunks, max 48 deg) lift OUTSIDE the first-person frustum: REST -> up the caster's right side
# (keys 40-43, tip phi 255 pitch 61 at key 43) -> horizontal wiper in to the held pose (keys 44-46, ticks 49-51); keys 46-52 (ticks 51-57) = held item exactly
