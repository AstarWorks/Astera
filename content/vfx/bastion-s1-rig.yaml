# S1 sword: ONE rig (one set of sword displays) for the whole skill: hold -> swing 1 -> hold -> swing 2 -> hold. No hand-over, no duplicate sword.
# Play at skill tick 0 with follow: true (rides the caster through the dashes), duration 58 (rig visible through tick 57; hide_held_item 57 ticks with NO delay: the runtime stages the rig spawn (view_range 0 until age 1) and hides the held item in the same tick, 78dfd0f4),
# play_vfx freeze: [{ at: 8, ticks: 2 }, { at: 31, ticks: 2 }]  (effect ticks; the hit_stop of both contacts; r9: hit 1 contact moved 7 -> 8).
# Rig key time l is displayed at effect tick l + 1 (+ frozen ticks before it); the real client shows it ~1-2 ticks later (r6/r8). Hit 1 contact = key 7, displayed at effect tick 8.
# Round 10 (reviewer r9: hit-1 PLANE wrong): hit 1 = big TILTED HORIZONTAL SWEEP. Tip plane y = 1.15 + tan(20) * z (anchor; forward end 20 deg higher, as the
#   reference ring's right end on screen): tip y ~2.04 at the front (head), ~1.1-1.25 at the sides (chest), the plane passes the back at ~0.4. Travel: right -> front -> left -> back.
# r10 hit 1: keys 0-1 (ticks 1-2) = held pose; key 2 (tick 3) up the caster's RIGHT side (phi 290, pitch 40: out of the first-person frustum);
#   wind-up extreme keys 3-4 (ticks 4-5) tip back-right raised (phi 230/219, pitch 24/22, 11 deg creep); sweep keys 5-7 ON the plane (phi 262/310/356, chunks 52/49/42),
#   contact key 7 = tick 8 held 8-10 (tip phi 356 pitch 30, tip y 2.04, edge leads 23 deg); follow-through ON the plane keys 8-9 (phi 50/100) then down round the left/back
#   (keys 10-12), overshoot key 13 (phi 206 = 26 deg past REST), settle slerp keys 14-18, REST by key 18 (tick 21), REST hold keys 19-20. Hit 2 = low horizontal ring (unchanged):
# pull-back keys 21-22, keys 23-28 ON the plane (r7, vfx ring), 220 deg in 5 ticks, contact key 28 = tick 31 (held 31-32; pitch clamped to -15 where the plane dips under the floor: phi 0-110), follow-through round the left/back with overshoot, REST by key 39.
# Face ~28 deg off the plane normal in both sweeps (edge leads, face still visible from the side cameras), rolls back to the sideways REST face.
# Round 7: pivot = the held item's fist [-0.348, 0.773, 0.293] (handover_s1.py), so REST / floor keys use pitch -15 (tip y 0.11; -20 would sink under the floor).
# Keys 40-46 (r11: same path as r8's 40-50, re-timed 11 -> 7 chunks, max 48 deg) lift OUTSIDE the first-person frustum: REST -> up the caster's right side
# (keys 40-43, tip phi 255 pitch 61 at key 43) -> horizontal wiper in to the held pose (keys 44-46, ticks 49-51); keys 46-52 (ticks 51-57) = held item exactly
# (0.0 deg yaw/pitch/roll, grip offset 0), held 6 ticks: r8 opponent capture showed the rig at the wiper start (front lean -38 / -33 deg, keys 46-47) until f54 and the
# held item at f55, so the old 2-tick hold never reached the screen in the front view (side/compare do not see the wiper's sideways lean). FP coverage <= 5.9%.
# Key -> tick: l+1 (l<=7), l+3 (8..28), l+5 (29+).
# Per-key numbers: tools/skill-compare/data/bastion-greatsword-s1/evidence/animator/r7/per-key-tip-face.txt (keys 0-6 and 40-52 changed in r8: evidence/animator/r8/per-key-r8.txt; keys 0-20 in r9: evidence/animator/r9/per-key-r9.txt). r10: keys 2-18 in evidence/animator/r10/per-key-r10.txt. r11: keys 39-52 + 3-axis check vs the held item in evidence/animator/r11/per-key-r11.txt.
# Swing euler values are solved by script from per-tick tip targets (phi, pitch) and edge roll; see deliver/animation-notes.md.
# Anchor frame x=left y=up z=forward. tilt roll -20: the caster's right end of the swing plane is higher.
# Parts: verbatim deliver/rig-parts.yaml (22 parts, round 7: + guard_plate, hilt_flare). Face normal = local Z, edges = +-X, blade = +Y. fx / sprites live in bastion-s1-fx-high/low.yaml.

