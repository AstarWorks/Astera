#   the over-the-top drop and the sweep short). Keys 0-1 = held (runtime REVEAL_AGE 2; r24: 1, only key 0). Keys 2-3 lift over the top slightly outward with the broad face kept
#   on the caster's left/right axis (front view: edge-on, lean 6 -> 15 -> 30; compare view: broad silver face), keys 4-5 = low-back coil (tip phi 215
#   pitch -15, tip y 0.11, face to the caster's right; key 5 creeps 21 deg into the sweep), key 6 = contact (the old key-7 pose), one 121 deg chunk 5 -> 6
#   (cap exception: the reference completes the swing between two frames, the fx-high ring is the swing). Chunks 51/46/55/21/121.
#   Comments below that name keys >= 8 refer to the pre-r23 numbering (subtract 1 up to key 20).
#   Numbers: evidence/animator/r23/per-key-r23.txt.
# r24 (director r23: the r23 keys 2-3 lifted the blade OVER THE TOP t3-5 = a raise, not a coil; reference holds it low behind t0-5): keys 0-5 re-keyed,
#   runtime REVEAL_AGE 2 -> 1 (VfxPlayer): only key 0 = held, the rig moves from tick 2. The blade goes DOWN and back round the caster's right side,
#   never above the held pitch (max 52): tip (phi, pitch) 0,52 -> 345,51 -> 315,51 -> 247,33 -> 215,-12 (keys 0-4, tip y 2.78/2.75/2.74/2.16/0.24),
#   chunks 10/19/52/55; low-back coil at key 4 = tick 5, key 5 creeps 28 deg toward the sweep, contact key 6 = tick 7 unchanged, one 120 deg chunk 5 -> 6
#   (approved swing exception). Keys 1-2 move little in the FRONT view (lean 5 -> 20 -> 39) because the client's first rig frame lands up to ~1.5 keys after
#   the reveal under load (r24 60 fps: a 3-chunk path with key 1 at lean 34 popped 45 deg in one frame). FP 0 % from key 3 on. Keys 6-52 untouched.
#   Numbers + captures: evidence/animator/r24/.
# r26 (reviewer r25 #4: one-tick upright blade at t4; #5: recovery lifts ~4 ticks early): keys 2-3 and 40-50 re-keyed, keys 0-1, 4-39, 51-52 untouched.
#   #4: the client shows the 2->3 CHUNK at t4 (compare f10 = mid-chunk tip ~(270,45), long and vertical). Key 2 = tip (315,48), key 3 = (250,20) at chest height
