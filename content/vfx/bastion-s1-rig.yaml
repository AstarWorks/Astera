# S1 sword: ONE rig (one set of sword displays) for the whole skill: hold -> swing 1 -> hold -> swing 2 -> hold. No hand-over, no duplicate sword.
# Play at skill tick 0 with follow: true (rides the caster through the dashes), duration 52,
# play_vfx freeze: [{ at: 7, ticks: 2 }, { at: 31, ticks: 2 }]  (effect ticks; the hit_stop of both contacts).
# Rig key time l is displayed at effect tick l + 1 (+ frozen ticks before it). Hit 1: e_k (e4 = contact) -> key k+2, contact displayed at effect tick 7.
# Hit 2: e_k -> key k+24 (the first 2-tick freeze shifts it), contact displayed at effect tick 31.
# Swing euler values are solved by script from per-tick tip targets (phi, pitch) and edge roll; see deliver/animation-notes.md.
# Anchor frame x=left y=up z=forward. tilt roll -20: the caster's right end of the swing plane is higher.
# Parts: verbatim deliver/rig-parts.yaml (20 parts, round 2). Face normal = local Z, edges = +-X, blade = +Y. fx / sprites live in bastion-s1-fx-high/low.yaml.

