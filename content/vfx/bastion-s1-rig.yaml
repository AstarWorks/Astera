# Bastion S1 (月輪の薙ぎ) weapon: ONE ItemDisplay of the real main-hand stack hanging from the right hand of the skin-rig body
# `bastion-s1-body` (ADR-0276), pose to pose like the reference (series of held poses with CUTS; the swing is never drawn).
# Swing keys are ABSOLUTE wrist rotations in the arm frame (all zero on a body at rest = the vanilla held item); every key after
# t0 is `ease: step`, on the same ticks as the body keys. Beats (rig tick = skill tick):
#   0 coil | 6 follow-through behind the shoulders | 16 overshoot | 19 turned-away rest | 28 coil 2 | 31 extension (contact 2)
#   38 drop | 40 rest (= coil) | 52 hand-back (neutral, exact vanilla held pose).
# Frame: weapon_tip / weapon_edge are the model blade axis (1.75 blocks) and cutting edge AFTER the grip pitch (rotX 72).
# fx files (bastion-s1-fx-high/low) still carry the old absolute-swing choreography and are re-timed in a later pass.
id: bastion-s1-rig
duration_ticks: 58
orient: yaw
follow: true
attach_to_anchor: true
sample_ticks: 1
body: bastion-s1-body
rigs:
- id: sword
  pivot: [0, 0, 0]
  parent: right_hand
  respect_hit_stop: true
  weapon: main_hand
  weapon_tip: [0.0, 1.3789, 1.0769]    # blade tip (1.75 blocks from the grip centre; 1.9 pommel to tip), rig-local
  weapon_root: [0.0, 0.2367, 0.0]
  weapon_edge: [0.0, -0.6155, 0.7881]  # cutting edge direction, rig-local (broad-face normal = rig X)
  swing:
  - { t: 0, rotate: [56.5, -12.1, 98.6] }   # skill 0 coil
  - { t: 2, rotate: [56.5, -12.1, 98.6] }   # skill 3 coil-hold
  - { t: 3, rotate: [115.0, -34.1, 167.3] }   # skill 4 wind-back
  - { t: 4, rotate: [188.0, -19.5, 236.8] }   # skill 5 cut1-a
  - { t: 5, rotate: [263.0, 104.7, 222.4] }   # skill 6 cut1-b
  - { t: 6, rotate: [348.0, 75.0, 146.0] }   # skill 7 cut1-hit
  - { t: 7, rotate: [344.3, 46.7, 161.0] }   # skill 10 follow-a
  - { t: 8, rotate: [441.3, 51.9, 243.2] }   # skill 11 follow-b
  - { t: 9, rotate: [440.7, 45.8, 239.0] }   # skill 12 over
  - { t: 13, rotate: [433.1, 37.5, 236.7] }   # skill 16 over-hold
  - { t: 14, rotate: [343.4, 58.7, 337.1] }   # skill 17 settle-a
  - { t: 15, rotate: [369.0, 61.8, 338.6] }   # skill 18 settle-b
  - { t: 16, rotate: [374.4, 64.3, 348.8] }   # skill 19 rest-away
  - { t: 24, rotate: [374.4, 64.3, 348.8] }   # skill 27 rest-hold
  - { t: 25, rotate: [339.9, 44.4, 326.8] }   # skill 28 crouch2
  - { t: 26, rotate: [335.3, 59.3, 335.7] }   # skill 29 crouch2-hold
  - { t: 27, rotate: [385.1, 106.0, 295.1] }   # skill 30 sweep2
  - { t: 28, rotate: [468.8, 96.4, 219.0] }   # skill 31 thrust2
  - { t: 30, rotate: [463.8, 98.0, 226.0] }   # skill 35 thrust2-mid
  - { t: 31, rotate: [463.7, 97.8, 225.7] }   # skill 36 thrust2-m2
  - { t: 32, rotate: [399.9, 35.3, 147.2] }   # skill 37 thrust2-m3
  - { t: 33, rotate: [400.4, 35.4, 147.6] }   # skill 38 thrust2-hold
  - { t: 34, rotate: [538.4, 23.0, 67.5] }   # skill 39 drop2
  - { t: 35, rotate: [582.0, 13.5, 62.4] }   # skill 40 drop2-b
  - { t: 36, rotate: [606.8, 28.1, 53.2] }   # skill 41 coil-end
