# r10 hit 1 (keys 2-4 superseded by r12): keys 0-1 (ticks 1-2) = held pose; key 2 (tick 3) up the caster's RIGHT side (phi 290, pitch 40: out of the first-person frustum);
#   wind-up extreme keys 3-4 (ticks 4-5) tip back-right raised (phi 230/219, pitch 24/22, 11 deg creep); sweep keys 5-7 ON the plane (phi 262/310/356, chunks 52/49/42),
