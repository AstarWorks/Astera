#   Only key 0 is held now; keys 1-3 re-solved, key 4 (extreme) and keys 5+ unchanged, contact key 7 = tick 8. Key 1 (tick 2) = tip phi 245 pitch 73 (nearly up,
#   slightly back-right: behind the eye plane once the rig lags), key 2 = phi 226 pitch 60, key 3 = phi 228 pitch 48. FP full frame (vfov 90) keys 1-4 <= 0.6 % at
