# S1 sword: ONE rig (one set of sword displays) for the whole skill: hold -> swing 1 -> hold -> swing 2 -> hold. No hand-over, no duplicate sword.
# Play at skill tick 0 with follow: true (rides the caster through the dashes), duration 58 (ADR-0254: the performance claims the hand lease itself; no hide_held_item step; the rig spawns staged, view_range 0 until age 1, and is revealed in the lease bundle),
# play_vfx freeze: [{ at: 7, ticks: 2 }, { at: 31, ticks: 2 }]  (effect ticks; the hit_stop of both contacts; r23: hit 1 contact moved 8 -> 7 = the reference t7).
# Rig key time l is displayed at effect tick l + 1 (+ frozen ticks before it); the real client shows it ~1-2 ticks later (r6/r8). Hit 1 contact = key 6, displayed at effect tick 7.
