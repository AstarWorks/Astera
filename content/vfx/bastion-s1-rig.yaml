#   front lean -5.8 -> -20.0 -> -30.9 -> -37.7 (14/11/7 per tick), face opening 35 -> 56 -> 81 -> 68 (+21/+25: over 2 ticks), chunks 35/59/55. Numbers: evidence/animator/r15/per-key-r15.txt.
