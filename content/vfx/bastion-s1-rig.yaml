# Swing euler values are solved by script from per-tick tip targets (phi, pitch) and edge roll; see deliver/animation-notes.md.
# Anchor frame x=left y=up z=forward. tilt roll -20: the caster's right end of the swing plane is higher.
# Parts (RETIRED by ADR-0254, now one weapon display; history): verbatim deliver/rig-parts.yaml (22 parts; r11 regenerated from the held model: stepped guard, plate + inset, rivets, collar + flares, kelp grip, pommel gold; cast cap 60 = rig 22 + fx 9 + particles 29). Face normal = local Z, edges = +-X, blade = +Y. fx / sprites live in bastion-s1-fx-high/low.yaml.

id: bastion-s1-rig
duration_ticks: 58
orient: yaw
follow: true
# attach_to_anchor: the displays ride the caster as native passengers (client-side vehicle interpolation), so the rig no longer trails the caster's own camera by ~1 tick
# during dash_strike (r16 FP lag); keys 0-1 may hold the held pose again. VfxPlayer skips the per-tick follow teleport for attached displays.
attach_to_anchor: true
sample_ticks: 1
rigs:
- id: sword
  pivot: [-0.348, 0.773, 0.293]
  rest: [0, 90, 0]
  tilt: [0, 0, -20]
  respect_hit_stop: true
  # ADR-0254: ONE ItemDisplay of the caster's real main-hand stack replaces the 22-part block rig (parts deleted, no shim).
  # Key 0 is the vanilla held pose; the swing keys below are rotations away from it about the fist pivot (unchanged numbers).
  weapon: main_hand
  weapon_tip: [0.0, 2.55, 0.0]   # blade tip, rig-local (plan dump / skill-lint only)
  weapon_root: [0.0, 0.345, 0.0]  # top of the guard (fx path tooling)
  weapon_edge: [1.0, 0.0, 0.0]   # cutting edge direction, rig-local (plan dump / skill-lint only)
