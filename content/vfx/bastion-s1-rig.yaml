# held item at f55, so the old 2-tick hold never reached the screen in the front view (side/compare do not see the wiper's sideways lean). FP coverage <= 5.9%.
# Key -> tick (r23): l+1 (l<=6), l+3 (7..28), l+5 (29+).
# r13 (opponent view at rest showed only the gold hilt): both REST holds yawed 18 deg OUTWARD (world Y, tip phi 180 -> 198, toward the caster's right),
