#   #5: low-back REST held through key 43 (tick 48); lift keys 44-51 (ticks 49-56) re-sample the accepted r21 path but go from its over-the-top key (r25 key 43,
#   tip (254,62)) straight into the held pose (no wiper overshoot), ease-out by cost; held pose at keys 51-52. Front steps <= 20, face steps <= 24, max chunk 42,
#   FP <= 7 %. Numbers: evidence/animator/r26/per-key-r26.txt.
# Round 10 (reviewer r9: hit-1 PLANE wrong): hit 1 = big TILTED HORIZONTAL SWEEP. Tip plane y = 1.15 + tan(20) * z (anchor; forward end 20 deg higher, as the
#   reference ring's right end on screen): tip y ~2.04 at the front (head), ~1.1-1.25 at the sides (chest), the plane passes the back at ~0.4. Travel: right -> front -> left -> back.
# r12 (director r10: opponent saw a 45 deg lean jump t2->t3): keys 2-4 re-routed so the FRONT view leans 0 -> 25 -> 42 -> 38 deg (<= 20/tick):
#   key 2 (tick 3) = tip phi 296 pitch 66 (high, slightly right; side view ~vertical), keys 3-4 = raised back-right extreme phi 236/222 pitch 36/26
