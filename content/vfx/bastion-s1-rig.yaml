# Bastion S1 (月輪の薙ぎ) weapon: ONE ItemDisplay of the real main-hand stack hanging from the right hand of the skin-rig body
# `bastion-s1-body` (ADR-0276), pose to pose like the reference (series of held poses with CUTS; the swing is never drawn).
# Swing keys are ABSOLUTE wrist rotations in the arm frame (all zero on a body at rest = the vanilla held item); every key after
# t0 is `ease: step`, on the same ticks as the body keys. Beats (rig tick = skill tick):
#   0 coil | 6 follow-through behind the shoulders | 16 overshoot | 19 turned-away rest | 28 coil 2 | 31 extension (contact 2)
#   38 drop | 40 rest (= coil) | 52 hand-back (neutral, exact vanilla held pose).
# Frame: weapon_tip / weapon_edge are the model blade axis (1.75 blocks) and cutting edge AFTER the grip pitch (rotX 72).
# fx files (bastion-s1-fx-high/low) still carry the old absolute-swing choreography and are re-timed in a later pass.
id: bastion-s1-rig
duration_ticks: 58
orient: yaw
follow: true
attach_to_anchor: true
sample_ticks: 1
body: bastion-s1-body
rigs:
- id: sword
  pivot: [0, 0, 0]
  parent: right_hand
  respect_hit_stop: true
  weapon: main_hand
  weapon_tip: [0.0, 1.3789, 1.0769]    # blade tip (1.75 blocks from the grip centre; 1.9 pommel to tip), rig-local
  weapon_root: [0.0, 0.2367, 0.0]
  weapon_edge: [0.0, -0.6155, 0.7881]  # cutting edge direction, rig-local (broad-face normal = rig X)
  swing:
  - { t: 0, rotate: [37.8, 8.0, 138.9] }   # skill 0 coil
  - { t: 2, rotate: [37.8, 8.0, 138.9] }   # skill 3 coil-hold
  - { t: 3, rotate: [57.3, -8.6, 170.3] }   # skill 4 wind-back
  - { t: 4, rotate: [16.8, -32.7, 200.5] }   # skill 5 cut1-a
  - { t: 5, rotate: [17.0, 16.9, 196.5] }   # skill 6 cut1-b
  - { t: 6, rotate: [16.3, 43.5, 292.0] }   # skill 7 cut1-hit
  - { t: 7, rotate: [27.5, 57.0, 304.3] }   # skill 10 follow-a
  - { t: 8, rotate: [44.5, 54.6, 287.4] }   # skill 11 follow-b
  - { t: 9, rotate: [52.8, 48.0, 275.2] }   # skill 12 over
  - { t: 13, rotate: [52.2, 38.7, 268.8] }   # skill 16 over-hold
  - { t: 14, rotate: [-16.6, 58.7, 337.1] }   # skill 17 settle-a
  - { t: 15, rotate: [9.0, 61.8, 338.7] }   # skill 18 settle-b
  - { t: 16, rotate: [14.4, 64.3, 348.8] }   # skill 19 rest-away
  - { t: 24, rotate: [14.4, 64.3, 348.8] }   # skill 27 rest-hold
  - { t: 25, rotate: [23.2, 65.8, 293.4] }   # skill 28 crouch2
  - { t: 26, rotate: [18.5, 77.6, 302.5] }   # skill 29 crouch2-hold
  - { t: 27, rotate: [-57.2, 74.6, 375.8] }   # skill 30 sweep2
  - { t: 28, rotate: [-71.5, 83.6, 399.3] }   # skill 31 thrust2
  - { t: 33, rotate: [-77.5, 80.4, 409.8] }   # skill 38 thrust2-hold
  - { t: 34, rotate: [12.6, -31.3, 460.9] }   # skill 39 drop2
  - { t: 35, rotate: [44.3, -13.3, 496.1] }   # skill 40 drop2-b
  - { t: 36, rotate: [37.8, 8.0, 498.8] }   # skill 41 coil-end
  - { t: 47, rotate: [0.0, 0.0, 0.0], ease: step }   # skill 52 hand-back
