# S2 throw (ADR-0286): everything that travels from the caster to the enemy, played at skill tick 30 on the caster inside for_each_target with
# track_bound_target. The authored target stands 5.4 blocks ahead; target_track / target_line move each element to the real target (any distance).
# Fixed anchor (the caster does not move during the throw): the overhead crescents, the flying shears, the shears stuck in the target, the chain.
id: couture-s2-throw
duration_ticks: 34
orient: yaw
follow: false
sample_ticks: 1
target_reference: [0, 0, 5.4]
elements:
- id: fly-shears
  kind: {type: item, item: shears, item_model: 'astera:couture-rapier', display_mode: fixed}
  brightness: 15
  start_tick: 4
  end_tick: 16
  keyframes:
  - {t: 0, translate: [0.0, 3.6, 0.4], rotate: [90, 0, 0], scale: [1, 1, 1]}
  - {t: 5, translate: [0.0, 1.3, 5.0], rotate: [90, 0, 0], scale: [1, 1, 1], ease: in_out_cubic}
  - {t: 12, translate: [0.0, 1.3, 5.0], rotate: [90, 0, 0], scale: [1, 1, 1]}
  target_track:
  - {t: 0, weight: 0}
  - {t: 5, weight: 1}
- id: linked-shears
  kind: {type: item, item: shears, item_model: 'astera:couture-shears-linked', display_mode: fixed}
  brightness: 8
  start_tick: 16
  end_tick: 28
  keyframes:
  - {t: 0, translate: [0.0, 1.25, 5.4], rotate: [90, 0, -110], scale: [0.5, 0.5, 0.5]}
  - {t: 1, translate: [0.0, 1.25, 5.4], rotate: [90, 0, -110], scale: [1.3, 1.3, 1.3], ease: out_expo}
  - {t: 10, translate: [0.0, 1.25, 5.4], rotate: [90, 0, -110], scale: [1.3, 1.3, 1.3]}
  - {t: 12, translate: [0.0, 1.25, 5.4], rotate: [90, 0, -110], scale: [0.8, 0.8, 0.8]}
  target_track:
  - {t: 0, weight: 1}
  - {t: 12, weight: 1}
- id: chain
  kind: {type: block, block: white_concrete}
  brightness: 15
  start_tick: 10
  end_tick: 30
  keyframes:
  - {t: 0, translate: [-0.025, 1.275, 0.0], rotate: [0, 0, 0], scale: [0.05, 0.05, 5.4]}
  - {t: 18, translate: [-0.045, 1.255, 0.0], rotate: [0, 0, 0], scale: [0.09, 0.09, 5.4]}
  - {t: 20, translate: [-0.015, 1.285, 0.0], rotate: [0, 0, 0], scale: [0.03, 0.03, 5.4]}
  target_line: true
