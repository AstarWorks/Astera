# Verdict Hammer S1, beat 1: the gavel. A giant hammer pops in floating above the caster's head
# (the telegraph), hangs for 3 ticks, then slams forward; a gold crescent is drawn in two arc
# sections as it lands, a stake glyph flashes at the strike point and a gold circuitry zigzag
# crackles behind the caster. ~28 live displays.
# Local axes: x = left, y = up, z = forward. rotate = [yaw, pitch, roll] degrees.

id: verdict-s1-gavel
duration_ticks: 27
orient: look
follow: false
sample_ticks: 2

elements:
  - id: hammer
    kind: { type: item, item: mace, display_mode: fixed }
    brightness: 15
    glow_color: "#ffcc40"
    start_tick: 0
    end_tick: 20
    keyframes:
      - { t: 0, translate: [0.3, 3.1, 0.2], rotate: [0, 0, 45], scale: [0.0, 0.0, 0.0] }
      - { t: 4, translate: [0.3, 3.4, 0.2], scale: [3.6, 3.6, 3.6], ease: out_back }
      - { t: 7, translate: [0.3, 3.5, 0.2], ease: linear }
      - { t: 10, translate: [0.0, 1.3, 2.4], rotate: [0, 105, 45], ease: in_expo }
      - { t: 16, translate: [0.0, 1.3, 2.4] }
      - { t: 20, scale: [0.0, 0.0, 0.0], ease: in_quad }

  - id: crescent-a
    kind: { type: block, block: gold_block }
    brightness: 15
    glow_color: "#ffcc40"
    start_tick: 10
    end_tick: 20
    slot_lifetime_ticks: 10
    count: 7
    formation:
      curve: { type: arc, radius: 3.6, from_deg: -75, to_deg: 0 }
      offset: [0.0, 1.2, 0.0]
      tilt: { yaw: 0, pitch: 0, roll: 35 }
      align: tangent
      stagger_ticks: 1
    jitter: { position: 0.05, rotation_deg: 3, scale: 0.2 }
    keyframes:
      - { t: 0, scale: [0.05, 0.05, 0.25] }
      - { t: 2, scale: [0.16, 0.16, 0.85], ease: out_expo }
      - { t: 6, block: yellow_stained_glass }
      - { t: 10, scale: [0.0, 0.0, 0.85], ease: in_quad }

  - id: crescent-b
    kind: { type: block, block: gold_block }
    brightness: 15
    glow_color: "#ffcc40"
    start_tick: 11
    end_tick: 21
    slot_lifetime_ticks: 10
    count: 7
    formation:
      curve: { type: arc, radius: 3.6, from_deg: 0, to_deg: 75 }
      offset: [0.0, 1.2, 0.0]
      tilt: { yaw: 0, pitch: 0, roll: 35 }
      align: tangent
      stagger_ticks: 1
    jitter: { position: 0.05, rotation_deg: 3, scale: 0.2 }
    keyframes:
      - { t: 0, scale: [0.05, 0.05, 0.25] }
      - { t: 2, scale: [0.16, 0.16, 0.85], ease: out_expo }
      - { t: 6, block: yellow_stained_glass }
      - { t: 10, scale: [0.0, 0.0, 0.85], ease: in_quad }

  # Stake glyph punched into the strike point.
  - id: glyph
    kind: { type: text, text: "<#ffcc40><b>杭</b>", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    start_tick: 10
    end_tick: 18
    keyframes:
      - { t: 0, translate: [0.0, 1.7, 2.6], scale: [0.0, 0.0, 0.0] }
      - { t: 2, scale: [5.0, 5.0, 5.0], ease: out_back }
      - { t: 8, scale: [0.0, 0.0, 0.0], ease: in_quad }

  # Circuitry zigzag behind the caster, flickering.
  - id: circuit
    kind: { type: block, block: gold_block }
    brightness: 15
    glow_color: "#3fe0e0"
    start_tick: 0
    end_tick: 16
    count: 12
    formation:
      curve: { type: lightning, from: [-2.2, 0.2, -1.0], to: [2.2, 2.8, -1.0], segments: 6, amplitude: 0.35, seed: 7 }
      align: tangent
      stagger_ticks: 0
    keyframes:
      - { t: 0, scale: [0.0, 0.0, 0.0] }
      - { t: 3, scale: [0.05, 0.05, 0.75], ease: out_expo }
      - { t: 12, scale: [0.05, 0.05, 0.75] }
      - { t: 16, scale: [0.0, 0.0, 0.75], ease: in_quad }
    oscillate: { axis: scale_xz, amplitude: 0.025, period_ticks: 2 }
