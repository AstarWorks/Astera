# Zwei S3 beat 3 (cast tick 43-51), played at the dash start: a yellow brush-smear along the 3-block
# lunge (a gold quad 0.9 tall stretched along the path, a white core and a dark underlay for contrast)
# that fades over ~4 ticks. 6 live displays.
# Local axes: x = left, y = up, z = forward. rotate = [yaw, pitch, roll] degrees.

id: bastion-s3-dash
duration_ticks: 8
orient: yaw
follow: false
sample_ticks: 1

elements:
  - id: under
    kind: { type: quad, color: "#201000", alpha: 0.35 }
    billboard: fixed
    brightness: 4
    start_tick: 1
    end_tick: 7
    keyframes:
      - { t: 0, translate: [0.0, 0.92, 1.0], rotate: [90, 0, 0], scale: [0.6, 1.0, 1.0] }
      - { t: 2, translate: [0.0, 0.92, 1.9], scale: [3.6, 1.1, 1.0], ease: out_expo }
      - { t: 6, alpha: 0.0, ease: in_quad }

  - id: smear
    kind: { type: quad, color: "#ffd23a", alpha: 0.9 }
    billboard: fixed
    brightness: 15
    start_tick: 1
    end_tick: 6
    keyframes:
      - { t: 0, translate: [0.0, 0.9, 1.0], rotate: [90, 0, 0], scale: [0.6, 0.9, 1.0] }
      - { t: 2, translate: [0.0, 0.9, 1.8], scale: [3.4, 0.9, 1.0], ease: out_expo }
      - { t: 5, alpha: 0.0, scale: [3.4, 0.4, 1.0], ease: in_quad }

  - id: core
    kind: { type: quad, color: "#ffffff", alpha: 1.0 }
    billboard: fixed
    brightness: 15
    start_tick: 1
    end_tick: 4
    keyframes:
      - { t: 0, translate: [0.0, 0.9, 1.0], rotate: [90, 0, 0], scale: [0.6, 0.2, 1.0] }
      - { t: 2, translate: [0.0, 0.9, 1.9], scale: [3.6, 0.2, 1.0], ease: out_expo }
      - { t: 3, alpha: 0.0, ease: in_quad }
