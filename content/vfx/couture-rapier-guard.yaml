# Couturier's Rapier fitting-step guard: seven vertical white pins spring up in a fan in front of the
# caster (staggered, out_back) and fold down again, with a small red ✦ at the middle pin where a parry
# would meet the blade. Anchored on the caster's start position.

id: couture-rapier-guard
duration_ticks: 16
orient: yaw
follow: false
sample_ticks: 1

elements:
  - id: pin
    kind: { type: block, block: white_concrete }
    brightness: 15
    glow_color: "#d8fff8"
    start_tick: 0
    slot_lifetime_ticks: 11
    count: 7
    formation:
      curve: { type: arc, radius: 1.3, from_deg: -55, to_deg: 55 }
      offset: [0.0, 0.0, 0.0]
      align: none
      stagger_ticks: 1
    keyframes:
      - { t: 0, translate: [0.0, 0.0, 0.0], scale: [0.04, 0.05, 0.04] }
      - { t: 2, translate: [0.0, 0.9, 0.0], scale: [0.05, 1.8, 0.05], ease: out_back }
      - { t: 6, block: cyan_stained_glass }
      - { t: 10, translate: [0.0, 0.0, 0.0], scale: [0.0, 0.05, 0.0], ease: in_quad }

  - id: parry-spark
    kind: { type: text, text: "<#ff3b4a><b>✦</b>", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    start_tick: 2
    end_tick: 9
    keyframes:
      - { t: 0, translate: [0.0, 1.2, 1.4], scale: [0.0, 0.0, 0.0] }
      - { t: 1, scale: [3.5, 3.5, 3.5], ease: out_back }
      - { t: 5, scale: [0.0, 0.0, 0.0], ease: in_quad }
