# S2 coin 2 on a MISS (hit_block / expire): a small spark pop where the shears actually ended. Placed at the real end point.
id: couture-s2-shears-miss
duration_ticks: 8
orient: world
follow: false
sample_ticks: 1
elements:
- id: miss-spark
  kind: {type: particle, particle_id: couture-s2-p-spark, every_ticks: 1}
  brightness: 15
  start_tick: 0
  end_tick: 4
  keyframes:
  - {t: 0, translate: [0, 0, 0]}
- id: miss-orange
  kind: {type: particle, particle_id: couture-s2-p-orange, every_ticks: 1}
  brightness: 15
  start_tick: 0
  end_tick: 2
  keyframes:
  - {t: 0, translate: [0, 0, 0]}
