# ADR-0220 display particles demo: a golden ember burst of coloured, translucent quads (TextDisplays).
# 24 sparks fly up and out of a point 1.5 blocks in front of the caster, fall under gravity and fade
# orange -> red -> transparent. A glyph flash (a coloured "✦" with text_opacity) pops at the origin.
# Cast it with content/skills/vfx-demo-quad-sparks.yaml. Quad size is in blocks (see VfxQuad).

id: demo-quad-sparks
duration_ticks: 40
orient: yaw
follow: false
sample_ticks: 2

elements:
  - id: embers
    kind: { type: quad, color: "#ffd24a", alpha: 1.0 }
    brightness: 15
    start_tick: 0
    keyframes:
      - { t: 0, translate: [0.0, 1.2, 1.5] }
    emit:
      count: 24
      speed: [0.12, 0.32]
      direction: up
      spread_deg: 55
      gravity: 0.025
      drag: 0.04
      life_ticks: [22, 34]
      size: [0.05, 0.12]
      size_over_life: [{ t: 0, v: 1.0 }, { t: 1, v: 0.3 }]
      color_over_life: [{ t: 0, v: "#ffd24a" }, { t: 0.5, v: "#ff7a18" }, { t: 1, v: "#d02010" }]
      alpha_over_life: [{ t: 0, v: 1.0 }, { t: 0.5, v: 0.9 }, { t: 1, v: 0.0 }]
      spin_over_life: [{ t: 0, v: 12 }]

  # Animated colour / alpha by keyframes: a glyph flash that swells and fades.
  - id: flash
    kind: { type: quad, glyph: "✦", color: "#fff2b0", alpha: 1.0 }
    brightness: 15
    start_tick: 0
    end_tick: 10
    keyframes:
      - { t: 0, translate: [0.0, 1.2, 1.5], scale: [0.3, 0.3, 1.0] }
      - { t: 8, scale: [1.2, 1.2, 1.0], color: "#ff9a30", alpha: 0.0, ease: out_quad }
