# Edict Blade: a ghost sword projected over the dive point (S2). It materialises 8 blocks up while the
# caster is airborne (blade, crossguard, grip in block shapes -- a quartz blade with a black guard), hangs
# trembling, then plunges point-first on in_cubic into the ground 7 blocks ahead of the caster, flashing
# as it lands and cooling to blue glass. Local axes: yaw only; x = left, y = up, z = forward.

id: edict-sky-sword
duration_ticks: 36
orient: yaw
sample_ticks: 1

elements:
  - id: blade
    kind: { type: block, block: quartz_block }
    brightness: 15
    start_tick: 0
    end_tick: 34
    keyframes:
      - { t: 0, translate: [0.0, 8.0, 7.0], scale: [0.0, 0.0, 0.0] }
      - { t: 4, translate: [0.0, 8.0, 7.0], scale: [0.14, 3.6, 0.44], ease: out_back }
      - { t: 12, translate: [0.0, 7.8, 7.0] }
      - { t: 15, translate: [0.0, 2.0, 7.0], ease: in_cubic }
      - { t: 17, block: white_stained_glass }
      - { t: 24, block: light_blue_stained_glass }
      - { t: 34, scale: [0.0, 3.6, 0.0], ease: in_quad }
    oscillate: { axis: translate_x, amplitude: 0.04, period_ticks: 2 }

  - id: guard
    kind: { type: block, block: black_concrete }
    start_tick: 0
    end_tick: 34
    keyframes:
      - { t: 0, translate: [0.0, 9.9, 7.0], scale: [0.0, 0.0, 0.0] }
      - { t: 4, translate: [0.0, 9.9, 7.0], scale: [1.1, 0.16, 0.3], ease: out_back }
      - { t: 12, translate: [0.0, 9.7, 7.0] }
      - { t: 15, translate: [0.0, 3.9, 7.0], ease: in_cubic }
      - { t: 34, scale: [0.0, 0.16, 0.0], ease: in_quad }

  - id: grip
    kind: { type: block, block: black_concrete }
    start_tick: 0
    end_tick: 34
    keyframes:
      - { t: 0, translate: [0.0, 10.8, 7.0], scale: [0.0, 0.0, 0.0] }
      - { t: 4, translate: [0.0, 10.8, 7.0], scale: [0.16, 1.6, 0.16], ease: out_back }
      - { t: 12, translate: [0.0, 10.6, 7.0] }
      - { t: 15, translate: [0.0, 4.8, 7.0], ease: in_cubic }
      - { t: 34, scale: [0.0, 1.6, 0.0], ease: in_quad }

  # Light beam the sword drops along.
  - id: beam
    kind: { type: block, block: white_stained_glass }
    brightness: 15
    start_tick: 3
    end_tick: 20
    keyframes:
      - { t: 0, translate: [0.0, 5.0, 7.0], scale: [0.0, 10.0, 0.0] }
      - { t: 3, scale: [0.35, 10.0, 0.35], ease: out_expo }
      - { t: 16, scale: [0.0, 10.0, 0.0], ease: in_quad }
