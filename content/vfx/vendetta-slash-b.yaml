id: vendetta-slash-b
duration_ticks: 20
orient: yaw
follow: false
sample_ticks: 1
rigs:
- id: bayonet
  pivot: [0.35, 1.05, 0.25]
  rest: [0, 90, 0]
  tilt: [0, 0, 25]
  respect_hit_stop: true
  end_tick: 8
  parts:
  - {id: heel, block: nether_bricks, offset: [0, 0.4, 0], size: [0.2, 0.8, 0.16]}
  - {id: spine, block: nether_bricks, offset: [-0.03, 1.0, 0], size: [0.24, 0.5, 0.16], rotate: [0, 0, 5]}
  - {id: tip, block: nether_bricks, offset: [-0.11, 1.35, 0], size: [0.24, 0.35, 0.16], rotate: [0, 0, 18]}
  - {id: grip, block: black_concrete, offset: [0, -0.2, 0], size: [0.13, 0.4, 0.13]}
  - {id: rib-0, block: bone_block, offset: [0.0, 0.22, 0], size: [0.28, 0.045, 0.18], brightness: 15}
  - {id: rib-1, block: bone_block, offset: [0.0, 0.41, 0], size: [0.28, 0.045, 0.18], brightness: 15}
  - {id: rib-2, block: bone_block, offset: [0.0, 0.6, 0], size: [0.28, 0.045, 0.18], brightness: 15}
  - {id: rib-3, block: bone_block, offset: [-0.019, 0.79, 0], size: [0.28, 0.045, 0.18], brightness: 15}
  - {id: rib-4, block: bone_block, offset: [-0.038, 0.98, 0], size: [0.28, 0.045, 0.18], brightness: 15}
  - {id: rib-5, block: bone_block, offset: [-0.057, 1.17, 0], size: [0.28, 0.045, 0.18], brightness: 15}
  - {id: rib-6, block: bone_block, offset: [-0.076, 1.36, 0], size: [0.28, 0.045, 0.18], brightness: 15}
  swing:
  - {t: 0, rotate: [-100, 0, 0]}
  - {t: 1, rotate: [-115, 0, 0]}
  - {t: 5, rotate: [85, 0, 0], ease: out_quad}
  - {t: 9, rotate: [100, 0, 0], ease: out_cubic}
  - {t: 16, rotate: [0, -55, 0], ease: in_out_quad}
  trails:
  - id: cut
    from: [0, 0.55, 0]
    to: [0, 2.1, 0]
    start_t: 1
    end_t: 5
    life_ticks: 6
    style: crisp
    step_deg: 30
    bands:
    - from: 0.75
      to: 1
      color: '#FFFF8A28'
      color_to: '#80491A23'
      block: orange_concrete
    - from: 0.68
      to: 0.75
      color: '#FF2C0714'
      block: black_concrete
    edge: {block: yellow_concrete, width: 0.055}
    fade_power: 0.15
elements:
- id: contact
  kind: {type: particle, particle_id: gun-impact, every_ticks: 2}
  start_tick: 5
  end_tick: 8
  keyframes:
  - {t: 0, translate: [0, 1.1, 2.1]}
- id: petals
  kind: {type: particle, particle_id: vendetta-petals, every_ticks: 3}
  start_tick: 5
  end_tick: 10
  keyframes:
  - {t: 0, translate: [0, 1.1, 2.1]}
