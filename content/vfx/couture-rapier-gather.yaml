# Couturier's Rapier S3 telegraph: a ring of cyan motes in front of the blade pulls inward (in_cubic) while
# a ✦ swells at the tip. The 12-tick charge is the opponent's window to react. Anchored on the caster.

id: couture-rapier-gather
duration_ticks: 14
orient: look
follow: false
sample_ticks: 2

elements:
  - id: mote
    kind: { type: block, block: cyan_stained_glass }
    brightness: 15
    glow_color: "#3ff0ff"
    start_tick: 0
    end_tick: 12
    count: 12
    formation:
      curve: { type: circle, radius: 1.5 }
      tilt: { yaw: 0, pitch: 90, roll: 0 }
      offset: [0.0, 1.3, 1.3]
      align: outward
    keyframes:
      - { t: 0, translate: [0.0, 0.0, 0.0], scale: [0.04, 0.04, 0.3] }
      - { t: 10, translate: [0.0, 0.0, -1.35], scale: [0.07, 0.07, 0.7], ease: in_quad }
      - { t: 12, translate: [0.0, 0.0, -1.5], scale: [0.0, 0.0, 0.0], ease: in_quad }

  - id: swell
    kind: { type: text, text: "<#d8fff8><b>✦</b>", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    start_tick: 2
    end_tick: 14
    keyframes:
      - { t: 0, translate: [0.0, 1.3, 1.3], scale: [0.0, 0.0, 0.0] }
      - { t: 9, scale: [5.5, 5.5, 5.5], ease: in_quad }
      - { t: 11, scale: [0.0, 0.0, 0.0], ease: out_expo }
