# Ember Gauntlet: overdrive hoop. When the caster holds enough Charge, Hoop Cannon adds one bigger
# white-gold hoop (fourteen beads, 1.3 block radius) behind the first three. Same glide as
# ember-hoop-cannon (align none: translate is in the anchor frame, +z straight ahead). Anchored on the
# caster, full look.

id: ember-hoop-overdrive
duration_ticks: 16
orient: look
follow: false
sample_ticks: 1

elements:
  - id: hoop
    kind: { type: block, block: yellow_stained_glass }
    brightness: 15
    glow_color: "#ffd24a"
    count: 14
    end_tick: 9
    formation:
      curve: { type: circle, radius: 1.3 }
      tilt: { yaw: 0, pitch: 90, roll: 0 }
      offset: [0.0, 1.3, 0.9]
      align: none
    keyframes:
      - { t: 0, translate: [0.0, 0.0, 0.0], scale: [0.0, 0.0, 0.0] }
      - { t: 1, scale: [0.46, 0.46, 0.46], ease: out_back }
      - { t: 3, translate: [0.0, 0.0, 3.6], block: white_stained_glass }
      - { t: 6, translate: [0.0, 0.0, 9.0], block: orange_stained_glass }
      - { t: 7, block: gray_stained_glass }
      - { t: 8, scale: [0.0, 0.0, 0.0], ease: in_quad }

  - id: flare
    kind: { type: text, text: "<#fff0a0>✦", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    end_tick: 8
    keyframes:
      - { t: 0, translate: [0.0, 1.3, 1.0], scale: [0.0, 0.0, 0.0] }
      - { t: 1, scale: [11.0, 11.0, 11.0], ease: out_expo }
      - { t: 7, scale: [0.0, 0.0, 0.0], ease: in_quad }
