# Crimson Chain-Axe DEF "Chain Ward": a ring of eight axe-head links snaps out round the caster and
# whips once (the counter pulse), with a red glass hoop and a floor ring that follow the caster for the
# length of the guard. Link spin sells the whip; the hoop swells at the pulse and fades.
# Local axes: x = left, y = up, z = forward.

id: crimson-chain-axe-ward
duration_ticks: 22
orient: yaw
follow: true
sample_ticks: 2

elements:
  - id: link
    kind: { type: item, item: iron_axe, display_mode: fixed }
    brightness: 15
    glow_color: "#c0102a"
    start_tick: 0
    end_tick: 20
    count: 8
    formation:
      curve: { type: circle, radius: 1.5 }
      offset: [0.0, 1.0, 0.0]
      align: tangent
      stagger_ticks: 0
    keyframes:
      - { t: 0, scale: [0.1, 0.1, 0.1] }
      - { t: 3, rotate: [0, 0, 180], scale: [0.7, 0.7, 0.7], ease: out_back }
      - { t: 8, translate: [0.0, 0.0, 1.6], rotate: [0, 0, 360], scale: [0.9, 0.9, 0.9], ease: out_expo }
      - { t: 12, translate: [0.0, 0.0, 0.0], rotate: [0, 0, 540], scale: [0.7, 0.7, 0.7], ease: in_out_quad }
      - { t: 20, rotate: [0, 0, 900], scale: [0.0, 0.0, 0.0], ease: in_quad }

  - id: hoop
    kind: { type: block, block: red_stained_glass }
    brightness: 15
    start_tick: 0
    end_tick: 20
    count: 12
    formation:
      curve: { type: circle, radius: 1.7 }
      tilt: { yaw: 0, pitch: 0, roll: 12 }
      offset: [0.0, 1.0, 0.0]
      align: tangent
    keyframes:
      - { t: 0, scale: [0.0, 0.0, 0.0] }
      - { t: 3, scale: [0.04, 0.12, 1.0], ease: out_expo }
      - { t: 8, translate: [0.0, 0.0, 1.2], scale: [0.06, 0.3, 1.4], ease: out_expo }
      - { t: 9, block: pink_stained_glass }
      - { t: 20, translate: [0.0, 0.0, 1.5], scale: [0.0, 0.3, 1.4], ease: in_quad }

  - id: floor
    kind: { type: block, block: red_concrete }
    brightness: 15
    start_tick: 0
    end_tick: 22
    count: 12
    formation:
      curve: { type: circle, radius: 2.0 }
      offset: [0.0, 0.05, 0.0]
      align: tangent
    keyframes:
      - { t: 0, scale: [0.0, 0.02, 0.0] }
      - { t: 4, scale: [0.12, 0.03, 1.1], ease: out_expo }
      - { t: 22, scale: [0.0, 0.03, 1.1], ease: in_quad }

  - id: star
    kind: { type: text, text: "<white>✦</white>", background: "#00000000", shadow: false, see_through: true }
    billboard: center
    brightness: 15
    start_tick: 8
    end_tick: 16
    keyframes:
      - { t: 0, translate: [0.0, 1.2, 0.0], scale: [0.0, 0.0, 0.0] }
      - { t: 2, scale: [5.0, 5.0, 5.0], ease: out_expo }
      - { t: 8, scale: [0.0, 0.0, 0.0], ease: in_quad }
