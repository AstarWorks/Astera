# ADR-0248 — the Play gate NPC. Stands under the quartz arch two blocks in front of the spawn tile
# (generated by LobbyIslandGenerator.playGate; LobbyWorldContentTest keeps the two in sync).
# Right-click opens the mode picker; the "Play / プレイ" hologram above is spawned by core
# (PaperPlayGateHologram) from the same plan spot.

id: play-npc
display_name: astera.lobby.npc.play.name

type: display_entity

spawn:
  world: world
  x: 0.5
  y: 65.0
  z: 4.5
  yaw: 0.0
  pitch: 0.0

interaction:
  right_click_intent: lobby.queue.show
  left_click_intent: lobby.queue.show
