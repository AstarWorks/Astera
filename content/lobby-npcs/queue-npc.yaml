# Wave 5lobby-content (ADR-0119) — queue NPC.
#
# Forward-looking content artifact: no loader is wired in this wave (the
# `content/lobby-npcs/` schema lands alongside Wave 5l's
# `INpcAdapter` content-driven spawner). When the loader is wired it
# walks `content/lobby-npcs/*.yaml`, spawns each NPC via
# `IEntitySpawner.spawn(...)` and binds the right-click intent via
# `INpcInteractionRouter.bindRightClick(handle, GuiIntent(intent_key))`.
#
# `type: display_entity` uses Wave 5l's MinimalNpcAdapter (vanilla
# Display family) so the NPCs render without Citizens. When Citizens is
# present and `type: citizens` is set, CitizensNpcAdapter takes over.

id: queue-npc
display_name: astera.lobby.npc.queue.name

type: display_entity

spawn:
  world: world
  x: 2.5
  y: 65.0
  z: 50.5
  yaw: 180.0
  pitch: 0.0

interaction:
  right_click_intent: lobby.queue.show
