# repeater-bolt: rapid light bolts, in the frame grammar (ADR-0314, ADR-0315). `bow` is rooted in the caster's right hand (the `crossbow-aim` body pose, v = aim, s = right,
# w = s x v), so the bolt leaves the crossbow's muzzle 0.35 ahead of the hand along the aim, not the head. The hand pose stays the body clip (the crossbow
# has no 3D model to rig). Cast sound at the hand; the bolt display and trail ride the body; `hit` one per victim at its centre, `blk` one per block
# contact, v the way the bolt came in; the sparks sit at v -0.2 of them. The state lasts exactly the flight (life) and also ends on the body end.
apiVersion: astera/v3
kind: Skill
id: repeater-bolt
item: repeater-crossbow
meta:
  name: {ja: "連射ボルト", en: "Repeater Bolt"}
  description: {ja: "軽いボルトを連続で撃つ。", en: "Rapid light bolts."}
  cooldown_ticks: 6
  resource_cost: 2
  tags: [ranged, physical]
params:
  dmg:   {type: number, default: 7.5}
  speed: {type: number, default: 3.0}
  life:  {type: ticks, default: 35}
frames:
  - id: bow
    origin: caster.hand_r
    v: aim
    w: s x v
    s: right
  - id: hit
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
  - id: blk
    on: event.block
    each: true
    origin: contact
    v: incoming
    w: up
    s: v x w
  - id: body
    origin: bolt
    v: forward
    w: up
    s: v x w
lines:
  trail: {frame: body, from: {v: -0.4}, to: {v: 0}}
machine:
  start: fire
  tail: 14
  states:
    fire:
      for: "${life}"
      then: end
      on:
        - {event: bolt.end, to: end}
      do:
        - {id: draw, op: body, target: caster, anim: crossbow-aim, speed: 1.0, at: 0, for: 14, detach: true}
        - {id: snd, op: sound, at: 0, sound: "item.crossbow.shoot", frame: bow, volume: 0.6, pitch: 1.3}
        - id: bolt
          op: projectile
          frame: bow
          pos: {v: 0.35}
          velocity: "= look(caster) * ${speed}"
          for: "${life}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg}"}}
              - {id: snd_hit, op: sound, sound: "astera:weapons/gun-impact", frame: hit, volume: 0.6, pitch: 1.2, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, frame: hit, pos: {v: -0.2}, detach: true}
            block:
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", frame: blk, volume: 0.5, pitch: 1.5, detach: true}
              - {id: fx_blk, op: particle_def, def: hit-spark, frame: blk, pos: {v: -0.2}, detach: true}
        - {id: slug, op: display, kind: item, item: "minecraft:arrow", context: fixed, anchor: bolt, scale: [0.6, 0.6, 0.6], at: 0, until: bolt.end}
        - {id: trail0, op: particle, particle: crit, along: trail, samples: 2, count: 1, offset: [0.03, 0.03, 0.03], at: 0, every: 1, until: bolt.end}
        - {id: trail1, op: particle, particle: dust, along: trail, samples: 2, count: 1, color: "#aa9678", size: 0.8, at: 0, every: 1, until: bolt.end}
    end: {final: true}
