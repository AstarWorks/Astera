# WP7: verdant staff right-click. Earth-element poke that poisons. Low burst,
# the support staff's way to finish a fight while the allies it heals do the rest.

id: thorn-bolt

name:
  ja: "茨の矢"
  en: "Thorn Bolt"
description:
  ja: "土属性の茨を放ち、対象を毒状態にする。"
  en: "Looses a thorn of earth that poisons its target."

archetype: projectile
cooldown_ticks: 24
resource_cost: 6               # energy
tags: [ ranged, earth-family, poison ]

params:
  type: projectile
  launch_speed: 2.4
  max_lifetime_ticks: 50
  visual:
    trail:
      - type: point
        particles:
          - { id: happy_villager, offset: { x: 0.08, y: 0.08, z: 0.08 } }
          - { id: composter, count: 2, offset: { x: 0.1, y: 0.1, z: 0.1 } }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: block.grass.break
      volume: { type: literal, value: 0.9 }
      pitch: { type: literal, value: 1.4 }
    - type: play_sound
      targets: { type: caster }
      sound_id: item.crossbow.shoot
      volume: { type: literal, value: 0.35 }
      pitch: { type: literal, value: 1.7 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.0, height: -0.2 }
      particle_id: verdant-cast
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 5.0 }
          attribute: earth
    - type: apply_status
      targets: { type: target }
      status_id: poison
      effect_duration_ticks: { type: literal, value: 160 }
    - type: play_sound
      targets: { type: target }
      sound_id: block.grass.break
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 0.7 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.0, z: 0.0 } } }
      particle_id: verdant-impact
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.0, z: 0.0 } } }
      particle_id: verdant-impact-sparkle
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.arrow.hit_player
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.2 }
  hit_block:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: block.grass.break
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 0.8 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: verdant-impact
  miss: []
  expire:
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: verdant-impact-sparkle
