# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: repeater-bolt

name:
  ja: "連射ボルト"
  en: "Repeater Bolt"
description:
  ja: "軽いボルトを連続で撃つ。"
  en: "Rapid light bolts."

archetype: projectile
cooldown_ticks: 6
resource_cost: 2
tags: [ ranged, physical ]

params:
  type: projectile
  launch_speed: 3.0
  max_lifetime_ticks: 35
  visual:
    trail_spacing: 0.4
    trail:
      - type: point
        particles:
          - { id: crit, offset: { x: 0.03, y: 0.03, z: 0.03 } }
          - { id: dust, color: { r: 170, g: 150, b: 120 }, scale: 0.8 }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: item.crossbow.shoot
      volume: { type: literal, value: 0.6 }
      pitch: { type: literal, value: 1.3 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 0.9, height: -0.25 }
      particle_id: gun-muzzle-flash
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 7.5 }
          attribute: physical
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/gun-impact
      volume: { type: literal, value: 0.6 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
  hit_block:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: astera:weapons/gun-impact-block
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.5 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: hit-spark
  miss: []
  expire: []
