# Audience demo (others): plays content/vfx/demo-lanes.yaml for viewers: others. Not bound to any item.

id: vfx-demo-lanes-others

name:
  ja: "デモ・レーン (others)"
  en: "Demo Lanes (others)"
description:
  ja: "レーン別の表示エンティティを viewers=others で再生するデモ。"
  en: "Plays one display per VFX lane with viewers=others."

archetype: sequence
cooldown_ticks: 20
tags: [ demo, vfx ]

params:
  type: sequence

phases:
  type: sequence
  cast:
    - type: play_vfx
      targets: { type: caster }
      vfx_id: demo-lanes
      viewers: others
