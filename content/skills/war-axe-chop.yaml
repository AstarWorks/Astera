# Match arsenal (wp/match-arsenal): simple PvP skill. One cast sound, a few particles.

id: war-axe-chop

name:
  ja: "重い一撃"
  en: "Heavy Chop"
description:
  ja: "範囲は狭いが重い一撃を叩き込む。"
  en: "A slow, heavy chop with a short arc."

archetype: melee
cooldown_ticks: 22
resource_cost: 10
tags: [ melee, physical ]

params:
  type: melee
  range: 3.0
  arc_degrees: 80.0
  knockback: 0.6
  damage:
    - base: { type: literal, value: 55.0 }
      attribute: physical

phases:
  type: melee
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/blade-heavy-swing
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 0.9 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.4, height: -0.2 }
      particle_id: slash-sweep
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/blade-crit
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
  miss: []
