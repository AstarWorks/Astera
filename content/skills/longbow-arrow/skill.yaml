apiVersion: astera/v3
kind: Skill
id: longbow-arrow
item: longbow
meta:
  name: {ja: "長弓の矢", en: "Longbow Shot"}
  description: {ja: "遠くまで届く矢を放つ。", en: "A long-range arrow."}
  cooldown_ticks: 30
  resource_cost: 8
  tags: [ranged, physical]
params:
  launch_speed: {type: number, default: 3.4}
  max_lifetime_ticks: {type: ticks, default: 60}
  dmg_physical: {type: number, default: 24.0}
anchors:
  - {id: origin, anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}       # was pt_aim_0_0_0p5
  - {id: muzzle, anchor: caster, offset: {up: -0.25, forward: 0.9}, mode: snapshot}   # was pt_caster_0_m0p25_0p9 (feet, yaw-only)
  - {id: heart, anchor: victim.root, offset: {up: 1.2}}                            # was pt_enemy_0_1p2_0
machine:
  start: fly
  states:
    fly:
      on:
        - {event: bolt.end, to: end}
      enter:
        - id: bolt
          op: projectile
          origin: origin
          velocity: "= look(caster) * ${launch_speed}"
          for: "${max_lifetime_ticks}"
          radius: 0.5
          hit: {targets: enemies, once: true}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg_physical}"}}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.2}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
            block:
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact, volume: 0.5, pitch: 1.5}
              - {id: fx_blk, op: particle_def, def: hit-spark, anchor: contact}
      do:
        - {id: snd_cast, op: sound, sound: "astera:weapons/sword-swing", anchor: caster, at: 0, volume: 0.8, pitch: 0.9}
        - {id: fx_cast, op: particle_def, def: gun-muzzle-smoke, anchor: muzzle, at: 0}
        - {id: tr0, op: particle, anchor: {of: bolt, sweep: 0.4}, particle: crit, count: 1, offset: [0.04, 0.04, 0.04], extra: 0, at: 0, every: 1, until: bolt.end}
        - {id: tr1, op: particle, anchor: {of: bolt, sweep: 0.4}, particle: dust, count: 1, offset: [0, 0, 0], extra: 0, color: "#c8aa6e", size: 1.0, at: 0, every: 1, until: bolt.end}
    end: {final: true}
