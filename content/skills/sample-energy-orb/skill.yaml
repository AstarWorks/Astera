      - id: surface
        op: display
        kind: item
        anchor: surface
        for: 40
        item: sample-energy-orb
        scale:
        - 4
        - 4
        - 4
        rotate:
        - axis: up
          deg: 90
        shader_effect: emissive-pulse
      then: end
    end:
      final: true
