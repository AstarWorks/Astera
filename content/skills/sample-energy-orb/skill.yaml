apiVersion: astera/v3
kind: Skill
id: sample-energy-orb
meta:
  name:
    en: sample-energy-orb
    ja: sample-energy-orb
  description:
    en: 'Sprite gallery demo: 4 block animated mesh; shader effect emissive-pulse.'
    ja: ギャラリー用。4ブロック四方、1 tick/フレーム。
  cooldown_ticks: 0
  resource_cost: 0
  tags:
