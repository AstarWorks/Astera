# smg-rush: a short swift buff with a dash cloud, in the frame grammar (ADR-0314). `me` is rooted at the caster's feet (v = forward, w = up): the
# whoosh and the cloud are points of it, 0.2 above the feet.
apiVersion: astera/v3
kind: Skill
id: smg-rush
item: smg
meta:
  name: {ja: "ダッシュ", en: "Rush"}
  description: {ja: "一時的に素早く動けるようになる。", en: "A short burst of speed."}
  cooldown_ticks: 200
  resource_cost: 0
  tags: [gun, movement]
params:
  swift_ticks: {type: ticks, default: 50}
frames:
  - id: me
    origin: caster.feet
    v: forward
    w: up
    s: v x w
machine:
  start: main
  states:
    main:
      for: 1
      then: end
      do:
        - {id: buff, op: status, target: caster, status: swift, stacks: 1, for: "${swift_ticks}"}
        - {id: snd, op: sound, sound: "astera:weapons/dash-whoosh", frame: me, volume: 0.7, pitch: 1.2}
        - {id: puff, op: particle_def, def: dash-cloud, frame: me, pos: {w: 0.2}}
    end: {final: true}
