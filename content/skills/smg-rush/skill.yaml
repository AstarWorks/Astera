# smg-rush: a short swift buff with a dash cloud.
apiVersion: astera/v3
kind: Skill
id: smg-rush
item: smg
meta:
  name: {ja: "ダッシュ", en: "Rush"}
  description: {ja: "一時的に素早く動けるようになる。", en: "A short burst of speed."}
  cooldown_ticks: 200
  resource_cost: 0
  tags: [gun, movement]
params:
  swift_ticks: {type: ticks, default: 50}
anchors:
  - {id: puff_pt, anchor: caster, offset: {up: 0.2}, mode: follow}
machine:
  start: main
  states:
    main:
      for: 1
      then: end
      do:
        - {id: buff, op: status, target: caster, status: swift, stacks: 1, for: "${swift_ticks}"}
        - {id: snd, op: sound, sound: "astera:weapons/dash-whoosh", anchor: caster, volume: 0.7, pitch: 1.2}
        - {id: puff, op: particle_def, def: dash-cloud, anchor: puff_pt}
    end: {final: true}
