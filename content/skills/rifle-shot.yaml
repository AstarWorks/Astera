# WP7: rifle right-click. Slower and harder-hitting than the pistol, long reach.
# Players have 20-tick invulnerability frames (PaperDamageGateway), so a hit
# lands at most once a second on a player: damage per hit is the lever, not fire rate.

# V-2a visuals. Per-cast particle budget (trail excluded): muzzle 21, entity impact 24, block impact 21.
# Trail: 2 per tick of flight (<= 80 over 40 ticks).
id: rifle-shot

name:
  ja: "ライフル射撃"
  en: "Rifle Shot"
description:
  ja: "高速で遠くまで届く、重い一発を撃つ。"
  en: "Fires a fast, long-range, hard-hitting round."

archetype: projectile
cooldown_ticks: 14
resource_cost: 1               # one round; resource type comes from the rifle (ammo)
tags: [ ranged, gun, sustain ]

params:
  type: projectile
  launch_speed: 4.5
  max_lifetime_ticks: 40
  visual:
    trail:
      - type: point
        particles:
          - { id: end_rod }
          - { id: electric_spark, extra: 0.02 }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.firework_rocket.blast
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 0.7 }
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.generic.explode
      volume: { type: literal, value: 0.25 }
      pitch: { type: literal, value: 1.8 }
    - type: schedule_particle_animation
      targets: { type: caster_forward, distance: 1.0, height: -0.25 }
      animation:
        - type: point
          particles:
            - { id: flame, count: 10, extra: 0.16 }
            - { id: electric_spark, count: 8, extra: 0.4 }
            - { id: end_rod, count: 3, extra: 0.25 }
            - { id: white_smoke, count: 4, extra: 0.03, delay_ticks: 1 }
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 8.0 }
          attribute: physical
    - type: schedule_particle_animation
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      animation:
        - type: point
          particles:
            - { id: crit, count: 12, extra: 0.4 }
            - { id: electric_spark, count: 8, extra: 0.3 }
            - { id: dust, count: 2, color: { r: 200, g: 40, b: 40 }, scale: 1.2 }
            - { id: white_smoke, count: 2, extra: 0.04 }
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.arrow.hit_player
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.2 }
  hit_block:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: block.stone.hit
      volume: { type: literal, value: 0.6 }
      pitch: { type: literal, value: 1.6 }
    - type: schedule_particle_animation
      targets: { type: hit_location }
      animation:
        - type: point
          particles:
            - { id: crit, count: 8, extra: 0.35 }
            - { id: electric_spark, count: 6, extra: 0.3 }
            - { id: dust, count: 3, color: { r: 150, g: 140, b: 130 }, scale: 1.6 }
            - { id: smoke, count: 4, extra: 0.03 }
  miss: []
  expire: []
