# WP7: rifle right-click. Slower and harder-hitting than the pistol, long reach.
# Players have 20-tick invulnerability frames (PaperDamageGateway), so a hit
# lands at most once a second on a player: damage per hit is the lever, not fire rate.

id: rifle-shot

name:
  ja: "ライフル射撃"
  en: "Rifle Shot"
description:
  ja: "高速で遠くまで届く、重い一発を撃つ。"
  en: "Fires a fast, long-range, hard-hitting round."

archetype: projectile
cooldown_ticks: 14
resource_cost: 1               # one round; resource type comes from the rifle (ammo)
tags: [ ranged, gun, sustain ]

params:
  type: projectile
  launch_speed: 4.5
  max_lifetime_ticks: 40

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.firework_rocket.blast
      pitch: { type: literal, value: 0.7 }
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 8.0 }
          attribute: physical
  hit_block: []
  miss: []
  expire: []
