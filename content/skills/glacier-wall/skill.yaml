apiVersion: "astera/v3"
kind: Skill
id: glacier-wall
item: glacier-wand
meta:
  name: {ja: "氷壁", en: "Ice Wall"}
  description: {ja: "目の前に氷の壁を張る。しばらくすると溶ける。", en: "Raises an ice wall ahead that melts after a while."}
  cooldown_ticks: 200
  resource_cost: 20
  tags: [magic, water, cover]
anchors:
  cast_fx: {anchor: caster.eye, offset: {up: 0.2, forward: 2.0}, mode: snapshot}
presentation:
  timeline:
    - at: 0
      do:
        - {id: snd, op: sound, sound: "astera:skills/frost-cast", anchor: caster, volume: 1.0, pitch: 1.0}
        - {id: fx, op: particle_def, def: frost-cast, anchor: cast_fx}
gameplay:
  timeline:
    - at: 0
      do:
        - {id: place, op: place_shape, at: 0, anchor: caster, shape: {wall: {width: 3, height: 3}}, block: "astera:tempered_glass", consume: none, ripple: 29, revert: 160, outside_arena: false}
