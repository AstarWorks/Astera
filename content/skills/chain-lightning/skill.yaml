apiVersion: astera/v3
kind: Skill
id: chain-lightning
item: chain-rod
meta:
  name: {ja: 連鎖雷, en: Chain Lightning}
  description: {ja: "着弾点から周囲の敵へ雷が走る。", en: "Lightning arcs from the impact to nearby enemies."}
  cooldown_ticks: 90
  resource_cost: 18
  tags: [ranged, electric, magic]
params:
  launch_speed:       {type: number, default: 2.6}
  max_lifetime_ticks: {type: ticks, default: 40}
  radius:             {type: blocks, default: 4.5}
  dmg_electric:       {type: number, default: 18}
  shock_ticks:        {type: ticks, default: 20}
anchors:
  - {id: muzzle, anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: fx, anchor: caster, offset: {forward: 1.0, up: -0.2}}
  - {id: heart, anchor: victim.root, offset: {up: 1.2}}
machine:
  start: cast
  states:
    cast:
      on:
        - {event: bolt.end, to: done}
      enter:
        - {id: snd, op: sound, sound: "astera:skill/wand/cast", anchor: caster, volume: 0.5, pitch: 1.7}
        - {id: fx1, op: particle_def, def: thunder-cast, anchor: fx}
      do:
        - id: bolt
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * ${launch_speed}"
          speed: "${launch_speed}"
          for: "${max_lifetime_ticks}"
          radius: 0.5
          hit: {targets: enemies, once: true}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: {kind: enemies, around: heart, radius: "${radius}", max_count: all}, damage: {electric: "${dmg_electric}"}}  # GAP(Q1): max_count spelling; v2 had no cap
              - {id: shock, op: status, target: event.victim, status: shock, stacks: 1, for: "${shock_ticks}", when: "= rand() < 0.4"}
              - {id: snd_hit, op: sound, sound: "astera:skills/lightning-impact", anchor: contact, volume: 0.7, pitch: 1.2}
              - {id: imp, op: particle_def, def: thunder-impact, anchor: heart}
            block:
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact, volume: 0.5, pitch: 1.5}
              - {id: spark, op: particle_def, def: hit-spark, anchor: contact}
        - {id: t1, op: particle, particle: electric_spark, anchor: {of: bolt, sweep: 0.4}, count: 3, offset: [0.12, 0.12, 0.12], extra: 0.05, at: 0, every: 1, until: bolt.end}
        - {id: t2, op: particle, particle: end_rod, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.02, 0.02, 0.02], extra: 0, at: 0, every: 1, until: bolt.end}
    done: {final: true}
