# chain-lightning: a bolt whose impact arcs to every enemy near the victim in one tick. Written from zero on the rev4.10 grammar.
# The bolt hits its victim, then the arc jumps 3 times (every 3 ticks) to the nearest enemy not yet hit; each hop deals less (decay) and shocks for less.
# Each hop draws a line ribbon from the previous victim (from) to the new one; the ribbon reads both bodies live for its 3 ticks.
apiVersion: astera/v3
kind: Skill
id: chain-lightning
item: chain-rod
meta:
  name: {ja: 連鎖雷, en: Chain Lightning}
  description: {ja: "着弾点から周囲の敵へ雷が走る。", en: "Lightning arcs from the impact to nearby enemies."}
  cooldown_ticks: 90
  resource_cost: 18
  tags: [ranged, electric, magic]
params:
  launch_speed:       {type: number, default: 2.6}
  max_lifetime_ticks: {type: ticks,  default: 40}
  decay:              {type: number, default: 0.7}
  dmg_electric:       {type: number, default: 18}
  shock_ticks:        {type: ticks,  default: 20}
  shock_chance:       {type: number, default: 0.4}
anchors:
  - {id: muzzle, anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: fx,     anchor: caster, offset: {forward: 1.0, up: -0.2}, mode: follow}
  - {id: heart,  anchor: victim.root, offset: {up: 1.2}, mode: follow}
fragments:
  arc:
    frames_in: {spot: anchor}
    params:
      dmg:   {type: number, required: true}
      decay: {type: number, required: true}
      shock: {type: ticks,  required: true}
    do:
      - {id: dmg,   op: damage, target: victim, damage: {electric: "= dmg * pow(decay, hop)"}}
      - {id: shock, op: status, target: victim, status: shock, stacks: 1, for: "= shock - 4 * hop"}
      - {id: arc,   op: ribbon, from: from.center, to: victim.center, thickness: 0.14, color: "#b8e0ff", at: 0, for: 3, detach: true}
      - {id: spark, op: particle, particle: electric_spark, anchor: spot, count: 12, offset: [0.3, 0.6, 0.3], extra: 0.2, at: 0, detach: true}
      - {id: snd,   op: sound, sound: "astera:skills/lightning-impact", anchor: spot, volume: "= 0.8 * pow(0.85, hop - 1)", pitch: "= 1.0 + 0.1 * hop", detach: true}
  impact:
    frames_in: {spot: anchor}
    do:
      - {id: ring, op: particle, particle: electric_spark, anchor: spot, times: 16, at: 0, count: 0, offset: "= vec(cos(i * 2 * pi / 16), 0.0, sin(i * 2 * pi / 16))", extra: 0.35}
      - {id: ring_up, op: particle, particle: electric_spark, anchor: spot, times: 8, at: 0, count: 0, offset: "= vec(0.7 * cos(i * 2 * pi / 8), 0.7, 0.7 * sin(i * 2 * pi / 8))", extra: 0.28}
      - {id: pop, op: particle, particle: end_rod, anchor: spot, count: 6, offset: [0.15, 0.15, 0.15], extra: 0.12, at: 0}
machine:
  start: cast
  tail: 12
  states:
    cast:
      on:
        - {event: bolt.end, to: done}
      enter:
        - {id: snd, op: sound, sound: "astera:skill/wand/cast", anchor: caster, volume: 0.5, pitch: 1.7}
        - {id: fx1, op: particle_def, def: thunder-cast, anchor: fx}
      do:
        - id: bolt
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * ${launch_speed}"
          speed: "${launch_speed}"
          for: "${max_lifetime_ticks}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {electric: "${dmg_electric}"}}
              - {id: shock, op: status, target: event.victim, status: shock, stacks: 1, for: "${shock_ticks}", when: "= rand() < ${shock_chance}"}
              - {id: snd_hit, op: sound, sound: "astera:skills/lightning-impact", anchor: contact, volume: 0.7, pitch: 1.2}
              - {id: imp, op: particle_def, def: thunder-impact, anchor: heart}
              - {id: jump, op: use, use: "fragment:arc", chain: {hops: 3, every: 3, pick: {kind: enemies, around: from, radius: 4.5, nearest: 1, exclude: chain}}, frames: {spot: heart}, with: {dmg: "${dmg_electric}", decay: "${decay}", shock: "${shock_ticks}"}}
              - {op: use, use: "fragment:impact", frames: {spot: heart}}
            block:
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact, volume: 0.5, pitch: 1.5}
              - {id: spark, op: particle_def, def: hit-spark, anchor: contact}
              - {op: use, use: "fragment:impact", frames: {spot: contact}}
        - id: core
          op: display
          kind: sprite
          sprite: thunder-spark
          anchor: bolt
          size: [0.7, 0.7]
          color: "#b8e0ff"
          billboard: center
          brightness: {block: 15, sky: 15}
          flipbook: {frames: 6, every: 1, loop: true}
          at: 0
          until: bolt.end
          motion:
            - {law: spin, axis: forward, deg_per_tick: 24, at: 0, for: 39}
        - id: trail
          at: 0
          every: 1
          until: bolt.end
          do:
            - {id: t1, op: particle, particle: electric_spark, anchor: {of: bolt, sweep: 0.4}, count: 3, offset: [0.12, 0.12, 0.12], extra: 0.05}
            - {id: t2, op: particle, particle: end_rod, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.02, 0.02, 0.02]}
    done: {final: true}
