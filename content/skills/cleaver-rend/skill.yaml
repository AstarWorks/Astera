apiVersion: astera/v3
kind: Skill
id: cleaver-rend
item: cleaver
meta:
  name: {ja: 引き裂き, en: Rend}
  description: {ja: "傷口を広げ、出血させる。", en: "Tears the wound open for bleeding."}
  cooldown_ticks: 120
  resource_cost: 12
  tags: [melee, physical]
params:
  arc_deg:      {type: number, default: 60}
  range:        {type: blocks, default: 2.8}
  dmg_physical: {type: number, default: 24}
  knockback:    {type: number, default: 0.1}
  bleed_ticks:  {type: ticks, default: 100}
anchors:
  - {id: fx, anchor: caster, offset: {forward: 1.3, up: -0.1}, mode: follow}
  - {id: heart, anchor: victim.center, mode: follow}
machine:
  start: cast
  states:
    cast:
      start: strike
      do:
        - {id: snd, op: sound, sound: "entity.player.attack.sweep", anchor: caster, volume: 1.0, pitch: 0.7, at: 0}
        - {id: fx1, op: particle_def, def: stab-spark, anchor: fx, at: 0}
      on:
        - {event: end, to: done}
      states:
        strike:
          for: 1
          then: recover
          enter:
            - id: strike
              op: hit
              anchor: caster.eye
              at: 0
              shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
              targets: enemies
              window: once
              ignore_invulnerability: false
              damage: {physical: "${dmg_physical}"}
              on:
                hit:
                  - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: "${knockback}"}
                  - {id: bleed, op: status, target: event.victim, status: bleed, stacks: 1, for: "${bleed_ticks}"}
                  - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.2}
                  - {id: spark, op: particle_def, def: hit-spark, anchor: heart}
        recover: {final: true}
    done: {final: true}
