apiVersion: astera/v3
kind: Skill
id: cleaver-rend
item: cleaver
meta:
  name: {ja: 引き裂き, en: Rend}
  description: {ja: "傷口を広げ、出血させる。", en: "Tears the wound open for bleeding."}
  cooldown_ticks: 120
  resource_cost: 12
  tags: [melee, physical]
params:
  arc_deg:      {type: degrees, default: 60}
  range:        {type: blocks, default: 2.8}
  dmg_physical: {type: number, default: 24}
  bleed_ticks:  {type: ticks, default: 100}
anchors:
  - {id: fx, anchor: caster.eye, offset: {forward: 1.3, up: -0.1}}
  - {id: enemy, anchor: victim.body, offset: {up: 1.2}}
presentation:
  timeline:
    - id: swing
      at: 0
      do:
        - {id: snd, op: sound, sound: "entity.player.attack.sweep", anchor: caster, volume: 1.0, pitch: 0.7}
        - {id: fx1, op: emit, effect: stab-spark, anchor: fx}
  "on":
    hit:
      - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: enemy, volume: 0.7, pitch: 1.2}
      - {id: spark, op: emit, effect: hit-spark, anchor: enemy}
machine:
  start: cast
  states:
    cast:
      for: 1
      then: done
      enter:
        # GAP: v2 sector height 2.0 -> v3 sector has no vertical limit (F8), none
        - id: strike
          op: hit
          anchor: caster.eye
          shape: {kind: sector, deg: "${arc_deg}", range: "${range}"}
          targets: enemies
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: bleed, op: status, target: event.victim, status: bleed, stacks: 1, for: "${bleed_ticks}"}
    done: {final: true}
