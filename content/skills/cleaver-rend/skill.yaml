# cleaver-rend: wind-up 6 ticks (rule round(5 / attack_speed)), hit at tick 6. Tearing diagonal: raised on the left, ripped down across to the right.
apiVersion: astera/v3
kind: Skill
id: cleaver-rend
item: cleaver
meta:
  name: {ja: 引き裂き, en: Rend}
  description: {ja: "傷口を広げ、出血させる。", en: "Tears the wound open for bleeding."}
  cooldown_ticks: 120
  resource_cost: 12
  tags: [melee, physical]
params:
  arc_deg:      {type: number, default: 60}
  range:        {type: blocks, default: 2.8}
  dmg_physical: {type: number, default: 24}
  knockback:    {type: number, default: 0.1}
  bleed_ticks:  {type: ticks, default: 100}
anchors:
  - {id: fx, anchor: caster, offset: {forward: 1.3, up: -0.1}, mode: follow}
  - {id: heart, anchor: victim.center, mode: follow}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 6
      then: strike
      do:
        - {id: snd_windup, op: sound, sound: item.armor.equip_iron, anchor: caster, volume: 0.5, pitch: 0.7}
        # weapon rig: tearing diagonal slash. One performance in the windup state, detached so it plays on through the strike and the tail:
        # drawn back over 5 ticks, the cut starts at tick 5 so the blade crosses the target zone at the hit (tick 6), then 6 ticks of follow-through.
        - id: rig
          op: rig
          parent: caster
          mount: caster.hand_r
          part: held_hand
          rest: [{axis: left, deg: 72}]
          detach: true
          for: 14
          swing:
            - {at: 0, for: 5, from: {left: 0.000, up: 0.507, forward: 0.862}, to: {left: 0.647, up: 0.755, forward: 0.108}, edge: trailing, roll: 0, ease: out_quad}
            - {at: 5, for: 3, to: {left: -0.503, up: -0.503, forward: 0.704}, edge: leading, roll: 0, ease: out_cubic}
            - {at: 8, for: 6, to: {left: -0.775, up: -0.498, forward: 0.388}, edge: leading, roll: 0, ease: out_cubic}
    strike:
      for: 1
      then: end
      do:
        - id: strike
          op: hit
          anchor: caster.eye
          at: 0
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: "${knockback}"}
              - {id: bleed, op: status, target: event.victim, status: bleed, stacks: 1, for: "${bleed_ticks}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.2, detach: true}
              - {id: spark, op: particle_def, def: hit-spark, anchor: heart, detach: true}
        - {id: snd, op: sound, sound: "entity.player.attack.sweep", anchor: caster, volume: 1.0, pitch: 0.7, detach: true}
        - {id: fx1, op: particle_def, def: stab-spark, anchor: fx, detach: true}
        - {id: trail, op: particle, particle: crit, anchor: {of: /windup/rig.root, to: /windup/rig.tip, samples: 6}, count: 1, extra: 0.04, at: 0, every: 1, for: 8, detach: true}
    end: {final: true}
