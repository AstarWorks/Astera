# cleaver-rend: tearing diagonal of the cleaver, raised on the left, ripped down to the right (wind-up 6 ticks, hit at tick 6).
# Frames (ADR-0314, ADR-0315), the gameplay (hit tick, shape, damage, knockback, cooldown, cast length) is unchanged:
#   blade  - the cleaver. Origin at the caster feet, moved along a hand path (guard -> raised at the left -> ripped down across to the right -> guard). Long axis along v (grip at the origin, tip at v 0.63),
#            edge along w. Roll +135 about v lays the edge on the diagonal that falls to the right, the rip is a turn about s (v moves towards w): the edge leads. The wind-up
#            tips the point back (-55), the rip drives it through (+85, hit while the blade crosses the middle), `reset` eases back.
#            The engine pins the right hand to the origin, so every `move:` point lies inside the 0.60 reach of the right shoulder (v 0 / w 1.29 / s 0.29).
#   body   - the caster's feet, v forward / w up / s right: sounds and the cast fx.
#   wound  - one per victim at the victim's centre, v the way the blow came in: the hit sound and the hit spark.
#   edge   - line along the blade from the guard to the tip (v 0.3 .. 0.63), what the trail rows draw along.
apiVersion: astera/v3
kind: Skill
id: cleaver-rend
item: cleaver
meta:
  name: {ja: 引き裂き, en: Rend}
  description: {ja: "傷口を広げ、出血させる。", en: "Tears the wound open for bleeding."}
  cooldown_ticks: 120
  resource_cost: 12
  tags: [melee, physical]
params:
  arc_deg:      {type: number, default: 60}
  range:        {type: blocks, default: 2.8}
  dmg_physical: {type: number, default: 24}
  knockback:    {type: number, default: 0.1}
  bleed_ticks:  {type: ticks, default: 100}
frames:
  - id: blade
    origin: caster
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: 0.48, w: 0.93, s: 0.25}}  # guard
      - {at: 0, for: 1, to: {v: 0.49, w: 0.95, s: 0.23}}
      - {at: 1, for: 1, to: {v: 0.37, w: 0.9, s: 0.02}}
      - {at: 2, for: 1, to: {v: 0.16, w: 1.27, s: -0.29}}
      - {at: 3, for: 1, to: {v: 0.09, w: 1.53, s: -0.25}}
      - {at: 4, for: 1, to: {v: 0.07, w: 1.57, s: -0.23}}
      - {at: 5, for: 1, to: {v: 0.48, w: 0.97, s: 0.45}}
      - {at: 6, for: 1, to: {v: 0.41, w: 0.96, s: 0.58}}
      - {at: 7, for: 1, to: {v: 0.4, w: 0.96, s: 0.59}}
      - {at: 8, for: 1, to: {v: 0.41, w: 0.96, s: 0.57}}
      - {at: 9, for: 1, to: {v: 0.44, w: 0.94, s: 0.51}}
      - {at: 10, for: 1, to: {v: 0.46, w: 0.93, s: 0.42}}
      - {at: 11, for: 1, to: {v: 0.47, w: 0.92, s: 0.33}}
      - {at: 12, for: 1, to: {v: 0.47, w: 0.92, s: 0.27}}
      - {at: 13, for: 1, to: {v: 0.48, w: 0.93, s: 0.25}}
    rotate:
      - {at: 0, for: 0, about: v, to: 135}  # roll the edge into the cut plane
      - {at: 0, for: 5, about: s, to: -55, ease: in_out_sine}  # wind-up turn
      - {at: 5, for: 3, about: s, to: 85, ease: out_cubic}  # the cut, edge first
      - {at: 8, for: 6, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: wound
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
lines:
  edge: {frame: blade, from: {v: 0.3}, to: {v: 0.63}}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 6
      then: strike
      do:
        - {id: snd_windup, op: sound, sound: item.armor.equip_iron, frame: body, volume: 0.5, pitch: 0.7}
        # weapon rig: tearing diagonal slash. One performance in the windup state, detached so it plays on through the strike and the tail:
        # drawn back over 5 ticks, the cut starts at tick 5 so the blade crosses the target zone at the hit (tick 6), then 6 ticks of follow-through.
        - {id: rig, op: rig, frame: blade, for: 14, detach: true}
    strike:
      for: 1
      then: end
      do:
        - id: strike
          op: hit
          anchor: caster.eye
          at: 0
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: react, op: react, target: event.victim, flinch: true, for: 6}
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: "${knockback}"}
              - {id: bleed, op: status, target: event.victim, status: bleed, stacks: 1, for: "${bleed_ticks}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", frame: wound, volume: 0.7, pitch: 1.2, detach: true}
              - {id: spark, op: particle_def, def: hit-spark, frame: wound, pos: {w: 0.2}, detach: true}
        - {id: snd, op: sound, sound: "entity.player.attack.sweep", frame: body, volume: 1.0, pitch: 0.7, detach: true}
        - {id: fx1, op: particle, particle: crit, frame: body, pos: {v: 1.3, w: 1.52}, count: 4, offset: [0.1, 0.1, 0.1], extra: 0.25, detach: true}
        - {id: trail, op: particle, particle: crit, along: edge, samples: 3, count: 1, extra: 0.04, at: 0, every: 1, for: 3, detach: true}
    end: {final: true}
