# Wave H 5content-depth (ADR-0125): electric-family burst projectile.
#
# Electric single-target with high damage + shock chance — the
# "high-risk high-reward" answer to frost-shard's reliable slow.
# 3.5s cooldown and 30 energy discourage spam.

id: lightning-bolt

name:
  ja: "稲妻"
  en: "Lightning Bolt"
description:
  ja: "電撃の閃光を一直線に放ち、対象を麻痺させる。"
  en: "Hurls a crackling bolt of lightning that can paralyze the target."

archetype: projectile
cooldown_ticks: 70
resource_cost: 30              # energy: the shared pool (100) fits three bolts
tags: [ ranged, electric-family, stun ]

params:
  type: projectile
  launch_speed: 3.0
  max_lifetime_ticks: 40

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.blaze.shoot
    - type: spawn_particle
      targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 1.7, z: 0.5 } } }
      particle_id: example-burst
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 14.0 }
          attribute: electric
    - type: apply_status
      targets: { type: target }
      status_id: shock
      effect_duration_ticks: { type: literal, value: 30 }
      chance: { type: literal, value: 0.60 }
  hit_block:
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: example-burst
  miss:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.sweep
  expire: []
