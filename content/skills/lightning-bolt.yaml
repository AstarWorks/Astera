# Wave H 5content-depth (ADR-0125): electric-family burst projectile.
#
# Electric single-target with high damage + shock chance — the
# "high-risk high-reward" answer to frost-shard's reliable slow.
# 3.5s cooldown and 30 energy discourage spam.

id: lightning-bolt

name:
  ja: "稲妻"
  en: "Lightning Bolt"
description:
  ja: "電撃の閃光を一直線に放ち、対象を麻痺させる。"
  en: "Hurls a crackling bolt of lightning that can paralyze the target."

archetype: projectile
cooldown_ticks: 70
resource_cost: 30              # energy: the shared pool (100) fits three bolts
tags: [ ranged, electric-family, stun ]

params:
  type: projectile
  launch_speed: 3.0
  max_lifetime_ticks: 40
  visual:
    trail:
      - type: point
        particles:
          - { id: electric_spark, count: 3, extra: 0.02, offset: { x: 0.1, y: 0.1, z: 0.1 } }
          - { id: end_rod, offset: { x: 0.02, y: 0.02, z: 0.02 } }
    display: { variant: item, material: minecraft:end_rod, scale: 0.8 }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.lightning_bolt.impact
      volume: { type: literal, value: 0.45 }
      pitch: { type: literal, value: 1.8 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.0, height: -0.2 }
      particle_id: thunder-cast
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 14.0 }
          attribute: electric
    - type: apply_status
      targets: { type: target }
      status_id: shock
      effect_duration_ticks: { type: literal, value: 30 }
      chance: { type: literal, value: 0.60 }
    - type: play_sound
      targets: { type: target }
      sound_id: entity.lightning_bolt.impact
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.3 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.0, z: 0.0 } } }
      particle_id: thunder-impact
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.0, z: 0.0 } } }
      particle_id: thunder-impact-glow
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.arrow.hit_player
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.2 }
  hit_block:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: entity.lightning_bolt.impact
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.6 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: thunder-impact
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: thunder-impact-glow
  miss: []
  expire:
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: thunder-impact-glow
