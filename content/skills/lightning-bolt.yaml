# Wave H 5content-depth (ADR-0125): electric-family burst projectile.
#
# Electric single-target with high damage + shock chance — the
# "high-risk high-reward" answer to frost-shard's reliable slow.
# 3.5s cooldown and 30 energy discourage spam.

id: lightning-bolt

name:
  ja: "稲妻"
  en: "Lightning Bolt"
description:
  ja: "電撃の閃光を一直線に放ち、対象を麻痺させる。"
  en: "Hurls a crackling bolt of lightning that can paralyze the target."

archetype: projectile
cooldown_ticks: 70
resource_cost: 30              # energy: the shared pool (100) fits three bolts
tags: [ ranged, electric-family, stun ]

params:
  type: projectile
  launch_speed: 3.0
  max_lifetime_ticks: 40
  visual:
    # Budget: per 0.5-block sample 4 sparks + a jagged 0.8-block arc (~9 pts x 2) => ~25; at 3 blocks/tick => ~150/tick.
    trail_spacing: 0.5
    trail:
      - type: point
        particles:
          - { id: electric_spark, count: 4, extra: 0.05, offset: { x: 0.15, y: 0.15, z: 0.15 } }
          - { id: end_rod, offset: { x: 0.02, y: 0.02, z: 0.02 } }
      - type: line
        angle: random
        length: 0.9
        segments: 3
        jitter: 0.25
        points_per_segment: 3
        particles:
          - { id: electric_spark }
          - { id: end_rod }
    display: { variant: item, material: minecraft:end_rod, scale: 0.8 }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:skill/wand/cast
      volume: { type: literal, value: 0.45 }
      pitch: { type: literal, value: 1.8 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.0, height: -0.2 }
      particle_id: thunder-cast
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 14.0 }
          attribute: electric
    - type: apply_status
      targets: { type: target }
      status_id: shock
      effect_duration_ticks: { type: literal, value: 30 }
      chance: { type: literal, value: 0.60 }
    - type: play_sound
      targets: { type: target }
      sound_id: entity.lightning_bolt.impact
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.3 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.0, z: 0.0 } } }
      particle_id: thunder-impact
    # A real bolt from the sky (jagged 8-block line + visual-only lightning) and a flat shockwave ring.
    - type: summon_lightning
      targets: { type: target }
      visual_only: { type: literal, value: true }
    - type: schedule_particle_animation
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 8.0, z: 0.0 } } }
      animation:
        - type: line
          angle: down
          amount: 2
          length: 8.0
          segments: 10
          jitter: 0.6
          points_per_segment: 4
          particles:
            - { id: electric_spark }
            - { id: end_rod }
    - type: schedule_particle_animation
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 0.2, z: 0.0 } } }
      animation:
        - type: point
          particles:
            - { id: electric_spark, count: 40, extra: 0.35 }
            - { id: end_rod, count: 12, extra: 0.25 }
        - type: ring
          period_ticks: 4
          points: 14
          start_radius: 0.5
          end_radius: 2.5
          particles:
            - { id: electric_spark, count: 0, extra: 0.1 }
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.arrow.hit_player
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.2 }
  hit_block:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: entity.lightning_bolt.impact
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.6 }
    - type: schedule_particle_animation
      targets: { type: hit_location }
      animation:
        - type: point
          particles:
            - { id: electric_spark, count: 40, extra: 0.35 }
            - { id: end_rod, count: 12, extra: 0.25 }
        - type: ring
          period_ticks: 4
          points: 14
          start_radius: 0.5
          end_radius: 2.5
          particles:
            - { id: electric_spark, count: 0, extra: 0.1 }
  miss: []
  expire:
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: thunder-impact-glow
