# Wind-up W = 2 ticks (round_half_up(5 / attack_speed 2.5)): the rapier is drawn back, the thrust hits at tick 2, the cast ends one tick later.
# The rig is the tip's travel (back -> straight forward, edge leading); rig, trail and spark are detach: true.
apiVersion: astera/v3
kind: Skill
id: rapier-thrust
item: rapier
meta: {name: {ja: "レイピアの突き", en: "Rapier Thrust"}, description: {ja: "細い突きを素早く繰り出す。", en: "A fast, precise thrust."}, cooldown_ticks: 9, resource_cost: 5, tags: [melee, physical]}
params:
  arc_deg:      {type: number, default: 20}
  range:        {type: blocks, default: 3.6}
  dmg_physical: {type: number, default: 24}
  knockback:    {type: number, default: 0.1}
anchors:
  - {id: muzzle, anchor: caster, offset: {up: -0.1, forward: 1.5}, mode: snapshot}
  - {id: heart, anchor: victim.root, offset: {up: 1.2}, mode: follow}
machine:
  start: cast
  tail: 9
  states:
    cast:
      start: windup
      on:
        - {event: end, to: done}
      do:
        - id: rig
          op: rig
          parent: caster
          mount: caster.hand_r
          part: held_hand
          rest: [{axis: left, deg: 72}]
          for: 11
          detach: true
          swing:
            - {at: 0, for: 2, from: {left: 0.1, up: 0.1, forward: 0.95}, to: {left: -0.25, up: -0.3, forward: 0.4}, edge: trailing, ease: in_out_sine}
            - {at: 2, for: 3, to: {left: 0.0, up: 0.0, forward: 1.0}, edge: leading, ease: out_cubic}
            - {at: 5, for: 6, to: {left: -0.1, up: 0.25, forward: 0.9}, edge: trailing, ease: in_out_sine}
        - {id: snd, op: sound, sound: "astera:weapons/sword-swing", anchor: caster, volume: 0.9, pitch: 1.7, at: 2, detach: true}
        - {id: fx, op: particle_def, def: stab-spark, anchor: muzzle, at: 2, detach: true}
        - id: trail
          op: group
          at: 1
          detach: true
          do:
            - {id: trail_fx, op: particle, particle: crit, anchor: {of: rig.root, to: rig.tip, samples: 6}, count: 1, extra: 0.03, every: 1, for: 6}
      states:
        windup: {for: 2, then: strike}
        strike:
          for: 1
          then: recover
          enter:
            - id: swing
              op: hit
              at: 0
              anchor: caster.eye
              shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
              targets: enemies
              window: once
              ignore_invulnerability: false
              damage: {physical: "${dmg_physical}"}
              on:
                hit:
                  - {id: kb, op: knockback, target: event.victim, direction: "= normalize(event.victim - pos(caster))", strength: "${knockback}"}
                  - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.2, detach: true}
                  - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart, detach: true}
        recover: {final: true}
    done: {final: true}
