# rapier-thrust: rapier thrust, point first (wind-up 2 ticks, hit at tick 2).
# Frames (ADR-0314, ADR-0315), the gameplay (hit tick, shape, damage, knockback, cooldown, cast length) is unchanged:
#   arm    - the right arm, rotate keys only. Origin = the right shoulder (`caster.shoulder_r`); the arm is one rigid 0.60 bone, so the hand travels on a sphere about it and a turn of this frame is that travel (about w left/right, about s up/down). Hand path: guard -> pulled back -> driven forward -> guard.
#   blade  - the rapier. Origin = the hand, 0.60 along the arm frame (the hand path is the arm's turn: guard -> drawn back -> thrust straight ahead along v -> guard). Long axis along v (grip at the origin, tip at v 1.07),
#            edge along w. The thrust is the hand swinging forward on the arm, the point leads by construction; the wind-up aims the point slightly (-8), `reset` eases back to guard.
#            The engine pins the right hand to the origin; the origin sits exactly on the 0.60 reach sphere of the shoulder by construction.
#   body   - the caster's feet, v forward / w up / s right: sounds and the cast fx.
#   wound  - one per victim at the victim's centre, v the way the blow came in: the hit sound and the hit spark.
#   edge   - line along the blade (v 0.56 .. 1.07), what the trail rows draw along.
apiVersion: astera/v3
kind: Skill
id: rapier-thrust
item: rapier
meta: {name: {ja: "レイピアの突き", en: "Rapier Thrust"}, description: {ja: "細い突きを素早く繰り出す。", en: "A fast, precise thrust."}, cooldown_ticks: 9, resource_cost: 5, tags: [melee, physical]}
params:
  arc_deg:      {type: number, default: 20}
  range:        {type: blocks, default: 3.6}
  dmg_physical: {type: number, default: 24}
  knockback:    {type: number, default: 0.1}
frames:
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: w, to: -16}   # guard
      - {at: 0, for: 1, about: w, to: -90, ease: in_out_sine}   # pull the hand back to the right hip
      - {at: 1, for: 3, about: w, to: -12, ease: out_cubic}   # the thrust: the hand drives forward
      - {at: 4, for: 7, about: w, to: -16, ease: in_out_sine}   # back to guard
      - {at: 0, for: 0, about: s, to: -33}
      - {at: 0, for: 1, about: s, to: -60, ease: in_out_sine}
      - {at: 1, for: 3, about: s, to: -14, ease: out_cubic}
      - {at: 4, for: 7, about: s, to: -33, ease: in_out_sine}
  - id: blade
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 1, about: s, to: -8, ease: in_out_sine}  # aim while drawing
      - {at: 1, for: 3, about: s, to: 0, ease: out_cubic}  # level on the target
      - {at: 4, for: 7, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: wound
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
lines:
  edge: {frame: blade, from: {v: 0.56}, to: {v: 1.07}}
machine:
  start: windup
  tail: 9
  states:
    windup:
      for: 2
      then: strike
      do:
        - {id: rig, op: rig, frame: blade, for: 11, detach: true}
    strike:
      for: 1
      then: end
      enter:
        - id: swing
          op: hit
          at: 0
          frame: blade
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(event.victim - pos(caster))", strength: "${knockback}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", frame: wound, volume: 0.7, pitch: 1.2, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, frame: wound, pos: {w: 0.2}, detach: true}
        - {id: snd, op: sound, sound: "astera:weapons/sword-swing", frame: body, volume: 0.9, pitch: 1.7, at: 0, detach: true}
        - {id: fx, op: particle_def, def: stab-spark, frame: body, pos: {v: 1.5, w: 1.52}, at: 0, detach: true}
        - {id: trail_fx, op: particle, particle: crit, along: edge, samples: 3, count: 1, extra: 0.03, at: 0, every: 1, for: 3, detach: true}
    end: {final: true}
