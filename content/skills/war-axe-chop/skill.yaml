apiVersion: astera/v3
kind: Skill
id: war-axe-chop
item: war-axe
meta:
  name: {ja: "重い一撃", en: "Heavy Chop"}
  description: {ja: "重い一撃を叩き込む。", en: "A heavy overhead chop."}
  cooldown_ticks: 22
  resource_cost: 10
  tags: [melee, physical]
# GAP: gameplay.expose (damage <- dmg_physical, arc_deg, range) -> none (inline literals)
anchors:
  - {id: sweep_pt, anchor: caster.eye, offset: {up: -0.2, forward: 1.4}}
  - {id: foe,   anchor: victim.root}
  - {id: heart, anchor: victim.root, offset: {up: 1.2}}
machine:
  start: swing
  states:
    swing:
      for: 1
      then: end
      do:
        - id: swing
          op: hit
          at: 0
          anchor: caster.eye
          shape: {sector: {deg: 80, range: 3.0, height: 2.0}}
          targets: enemies
          damage: {physical: 55.0}
          window: once
          on:
            hit:
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-crit", anchor: foe, volume: 0.7, pitch: 1.2}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 1.0, pitch: 0.9}
        - {id: fx, op: particle_def, def: slash-sweep, anchor: sweep_pt}
    end: {final: true}
