apiVersion: astera/v3
kind: Skill
id: war-axe-chop
item: war-axe
meta:
  name: {ja: "重い一撃", en: "Heavy Chop"}
  description: {ja: "範囲は狭いが重い一撃を叩き込む。", en: "A slow, heavy chop with a short arc."}
  cooldown_ticks: 22
  resource_cost: 10
  tags: [melee, physical]
params:
  arc_deg:      {type: number, default: 80}
  range:        {type: blocks, default: 3.0}
  dmg_physical: {type: number, default: 55}
  knockback:    {type: number, default: 0.6}
anchors:
  - {id: sweep_pt, anchor: caster, offset: {up: -0.2, forward: 1.4}, mode: follow}
  - {id: heart, anchor: victim.center, mode: follow}
machine:
  start: swing
  states:
    swing:
      for: 1
      then: end
      do:
        - id: swing
          op: hit
          at: 0
          anchor: caster.eye
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          window: once
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: "${knockback}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-crit", anchor: contact, volume: 0.7, pitch: 1.2}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 1.0, pitch: 0.9}
        - {id: fx, op: particle_def, def: slash-sweep, anchor: sweep_pt}
    end: {final: true}
