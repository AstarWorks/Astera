apiVersion: astera/v3
kind: Skill
id: war-axe-chop
item: war-axe
meta:
  name: {ja: "重い一撃", en: "Heavy Chop"}
  description: {ja: "範囲は狭いが重い一撃を叩き込む。", en: "A slow, heavy chop with a short arc."}
  cooldown_ticks: 22
  resource_cost: 10
  tags: [melee, physical]
anchors:
  - {id: sweep_pt, anchor: caster, offset: {up: -0.2, forward: 1.4}}
  - {id: heart, anchor: victim.root, offset: {up: 1.2}}   # was pt_enemy_0_1p2_0 (v2 enemy frame = victim feet)
machine:
  start: swing
  states:
    swing:
      for: 1
      then: end
      do:
        - id: swing
          op: hit
          at: 0
          anchor: caster.eye
          shape: {sector: {deg: 80, range: 3.0, height: 2.0, forward: look}}
          targets: enemies
          max_count: all  # GAP(Q1): spelling A (required, `all` = v2 unlimited); under B delete this line
          ignore_invulnerability: false
          damage: {physical: 55.0}
          window: once
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: 0.6}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-crit", anchor: contact, volume: 0.7, pitch: 1.2}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 1.0, pitch: 0.9}
        - {id: fx, op: particle_def, def: slash-sweep, anchor: sweep_pt}
    end: {final: true}
