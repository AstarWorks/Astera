apiVersion: astera/v3
kind: Skill
id: frost-nova
item: frost-staff
meta:
  name: {ja: "フロストノヴァ", en: "Frost Nova"}
  description: {ja: "周囲の敵に氷属性ダメージを与え、動きを鈍らせる。", en: "Blasts nearby enemies with ice and slows them."}
  cooldown_ticks: 160
  resource_cost: 25
  tags: [magic, ice-family, aoe]
anchors:
  - {id: cast_body, anchor: caster, offset: {up: 0.15}, mode: snapshot}
  - {id: foe_pt, anchor: victim.root, offset: {up: 0.9}}   # v2 pt_enemy_0_0p9_0 (victim feet, yaw-only)
machine:
  start: cast
  states:
    cast:
      start: burst
      do:
        - {id: snd, op: sound, sound: "astera:skills/frost-cast", anchor: caster, volume: 1.0, pitch: 0.9, at: 0}
        - {id: snd_2, op: sound, sound: "astera:skills/frost-impact", anchor: caster, volume: 0.7, pitch: 1.0, at: 0}
        - {id: fx_burst, op: particle, particle: snowflake, anchor: cast_body, count: 40, extra: 0.12, at: 0}
        - {id: fx_snow, op: particle, particle: snowflake, anchor: cast_body, count: 0, extra: 0.03, at: 0}
        - {id: fx_dust, op: particle, particle: dust, anchor: cast_body, count: 1, color: "#c8ebff", size: 1.6, at: 0}
        - {id: fx_rod, op: particle, particle: end_rod, anchor: cast_body, count: 0, extra: 0.02, at: 0}
        - {id: fx_snow2, op: particle, particle: snowflake, anchor: cast_body, count: 2, offset: [0.0, 0.5, 0.0], extra: 0.02, at: 2}
      on:
        - {event: end, to: done}
      states:
        burst:
          for: 3      # v2 cast ends after its last presentation row (tick 2) -> 3 ticks
          then: recover
          enter:
            - id: burst
              op: hit
              at: 0
              anchor: caster
              targets: enemies
              shape: {sphere: 5.0}
              window: once
              ignore_invulnerability: false
              damage: {water: "= 25.0 * (1.0 - 0.5 * dist(pos(caster), pos(event.victim)) / 5.0)"}
              on:
                hit:
                  - {id: st_freeze, op: status, target: event.victim, status: freeze, stacks: 1, for: 60}
                  - {id: snd_hit, op: sound, sound: "astera:skills/frost-impact", anchor: contact, volume: 1.0, pitch: 1.0}
                  - {id: fx_snow, op: particle, particle: snowflake, anchor: foe_pt, count: 30, offset: [0.4, 0.8, 0.4], extra: 0.02}
                  - {id: fx_dust, op: particle, particle: dust, anchor: foe_pt, count: 20, offset: [0.4, 0.8, 0.4], color: "#aae1ff", size: 1.4}
                  - {id: fx_rod, op: particle, particle: end_rod, anchor: foe_pt, count: 10, offset: [0.35, 0.8, 0.35], extra: 0.02}
                  - {id: fx_rod2, op: particle, particle: end_rod, anchor: foe_pt, count: 0, extra: 0.01}
            - {id: chip, op: break_area, at: 0, anchor: caster, shape: {sphere: {radius: 2.5, ahead: 4.0}}, tool: none, block_damage: 20, ripple: 29, revert: 200, outside_arena: false}
        recover: {final: true}
    done: {final: true}
