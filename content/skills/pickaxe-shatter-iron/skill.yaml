apiVersion: astera/v3
kind: Skill
id: pickaxe-shatter-iron
item: iron-pickaxe
meta:
  name: {ja: "鉄の粉砕", en: "Iron Shatter"}
  description: {ja: "視線の先のブロックを球状に砕く。", en: "Shatters blocks in a sphere where you look."}
  cooldown_ticks: 200
  resource_cost: 0
  tags: [tool, cover]
anchors:
  - {id: dust, anchor: caster, offset: {forward: 2.0}, mode: snapshot}
machine:
  start: cast
  states:
    cast:
      for: 1
      then: end
      do:
        - {id: shatter, use: pickaxe-shatter, with: {radius: 3, tier: 2, stone_pitch: 0.7, thud_vol: 0.7, thud_pitch: 1.2}, frames: {spot: dust}}
    end: {final: true}
