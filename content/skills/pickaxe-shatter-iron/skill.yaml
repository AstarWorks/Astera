# v3 hand port of the v2 skill (ADR-0303 rev4.2). one break_area at tick 0, kept field for field.
apiVersion: astera/v3
kind: Skill
id: pickaxe-shatter-iron
item: iron-pickaxe
meta: {name: {ja: "鉄の粉砕", en: "Iron Shatter"}, description: {ja: "視線の先のブロックを球状に砕く。", en: "Shatters blocks in a sphere where you look."}, cooldown_ticks: 200, resource_cost: 0, tags: [tool, cover]}
# v2 params: radius 3, block_damage 300, power 2, length 6.0, width 3.0, height 3.0 (all kept as literals on the op).
anchors:
  - {id: eye,   anchor: caster.eye}                                   # was aim
  - {id: spark, anchor: caster.eye, offset: {forward: 2.0}, mode: snapshot}   # was pt_aim_0_0_2
machine:
  start: smash
  states:
    smash:
      for: 1                         # RISK: the break ripple (ADR-0297) may outlive this state; verify on dev
      then: end
      enter:
        - {id: snd, op: sound, sound: "astera:weapons/gun-impact-block", anchor: caster, volume: 1.0, pitch: 0.4}
        - {id: fx, op: particle_def, def: hit-spark, anchor: spark}
      do:
        # GAP: break_area -> none (no v3 op in ADR-0303 10.1b); every v2 field kept, `at: aim` -> `anchor: eye`.
        - {id: break, op: break_area, shape: sphere, radius: 3, length: 6.0, width: 3.0, height: 3.0, tool_class: PICKAXE, block_damage: 300, power: 2, anchor: eye, at: 0}
    end: {final: true}
