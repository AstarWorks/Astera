# v3 hand port of the v2 skill (ADR-0303 rev4.2). one break_area at tick 0, kept field for field.
apiVersion: astera/v3
kind: Skill
id: pickaxe-shatter-iron
item: iron-pickaxe
meta: {name: {ja: "鉄の粉砕", en: "Iron Shatter"}, description: {ja: "視線の先のブロックを球状に砕く。", en: "Shatters blocks in a sphere where you look."}, cooldown_ticks: 200, resource_cost: 0, tags: [tool, cover]}
anchors:
  - {id: spark, anchor: caster, offset: {forward: 2.0}, mode: snapshot}   # was pt_caster_0_0_2 (feet, yaw-only)
machine:
  start: smash
  states:
    smash:
      for: 1                         # RISK: the break ripple (ADR-0297) may outlive this state; verify on dev
      then: end
      enter:
        - {id: snd, op: sound, sound: block.stone.break, anchor: caster, volume: 1.0, pitch: 0.7}
        - {id: snd_2, op: sound, sound: item.trident.hit_ground, anchor: caster, volume: 0.7, pitch: 1.2}
        - {id: fx, op: particle_def, def: tool-pick-iron, anchor: spark}
      do:
        - {id: break, op: break_area, at: 0, anchor: caster, shape: {sphere: {radius: 3, ahead: 4.0}}, tool: pickaxe, block_damage: 100, ripple: 29, revert: 200, outside_arena: false}
    end: {final: true}
