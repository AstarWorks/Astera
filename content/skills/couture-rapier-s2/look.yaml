# Coin 2 presentation half. A skin patch may touch only presentation.* (see patches/crimson.yaml).
apiVersion: astera/v2
kind: Skill
id: couture-rapier-s2
presentation:
  params: {thread_color: "#ff5fa2", thread_thick: 0.06, spark_count: 14, spark_particle: crit}
  timeline:
    - id: raise_fx
      at: 0
      do:
        # v1 couture-s2-rig body: the skin-rig performance (overhead spin to t34, throw thrust t34-58); ends by itself, stops if the cast is cancelled
        - {id: body_anim, op: caster_anim, anim: couture-s2-body}
        - {id: mesh_held, op: mesh, frame: shears, item: couture-rapier, part: held}
        - {id: raise_snd, op: sound, sound: couture.raise, at: shears.tip, volume: 0.6}
    - id: spin_fx
      at: 4
      do:
        # from here the shears show as three real pieces
        - {id: held_off, op: remove, ids: [mesh_held]}
        - {id: mesh_body, op: mesh, frame: body, item: couture-rapier, part: body}
        - {id: mesh_a, op: mesh, frame: blade_a, item: couture-rapier, part: blade_a}
        - {id: mesh_b, op: mesh, frame: blade_b, item: couture-rapier, part: blade_b}
        - {id: trail_a, op: trail, of: blade_a.tip, root: blade_a.root, ticks: 6, width_frac: 0.6, color: "${thread_color}", alpha: 0.35, until: release}
        - {id: trail_b, op: trail, of: blade_b.tip, root: blade_b.root, ticks: 6, width_frac: 0.6, color: "${thread_color}", alpha: 0.35, until: release}
        - {id: whoosh, op: sound, sound: couture.whoosh, at: shears.tip, every: 4, until: release,
           volume: "= clamp(speed(shears.tip) / 1.5, 0.2, 1.0)", pitch: "= 0.9 + 0.3 * clamp(speed(shears.tip) / 2.0, 0.0, 1.0)"}
  on:
    release:
      # pink thread palm -> each piece. Both ends are frame points, so it follows the target and shortens with range debuffs.
      - {id: thread_a, op: line, from: palm, to: blade_a.root, thickness: "${thread_thick}", color: &thread_col "${thread_color}", face: &thread_face {viewer: axis, axis: line.along}}
      - {id: thread_b, op: line, from: palm, to: blade_b.root, thickness: "${thread_thick}", color: *thread_col, face: *thread_face}
      - {id: thread_body, op: line, from: palm, to: body.pivot, thickness: "${thread_thick}", color: *thread_col, face: *thread_face}
      - {id: flight_fan, op: plate, parent: volley, face: {plane: {frame: volley, axes: [axis, up]}}, sprite: couture-s2-crescent, size: 1.9, alpha: 0.5}
      - {id: throw_snd, op: sound, sound: couture.throw, at: palm, pitch: 1.1}
      - {id: puff, op: emit, at: palm, particle: dust, data: "${thread_color}", count: 6, dir: "= -forward(volley)", spread_deg: 20, inherit_velocity: 0.5}
    hit:
      - {id: sparks, op: emit, when: &on_throw "= event.source == 'throw_hit'", at: contact.point, particle: "${spark_particle}", count: "${spark_count}",
         dir: "= contact.normal", spread_deg: 35, speed: "= 0.4 + 0.3 * rand('sparks')", seed: sparks}
      - {id: stagger, op: victim_anim, when: *on_throw, target: victim, anim: stagger_back, strength: "= clamp(length(contact.rel_velocity) / 2.0, 0.3, 1.0)"}
      - {id: stab_snd, op: sound, when: *on_throw, sound: couture.stab, at: contact.point, pitch: "= 1.2 - 0.2 * clamp(length(contact.rel_velocity) / 2.0, 0.0, 1.0)"}
      - {id: fan_off, op: remove, when: *on_throw, ids: [flight_fan]}
      - {id: reel_sparks, op: emit, when: &on_reel "= event.source == 'reel_hit'", at: contact.point, particle: "${spark_particle}", count: 6, dir: "= contact.normal"}
      - {id: slash_snd, op: sound, when: *on_reel, sound: couture.slash_light, at: contact.point}
    block:
      - {id: crumb, op: emit, at: contact.point, particle: couture-s2-p-crumb, count: 8, dir: "= contact.normal"}
      - {id: wall_snd, op: sound, sound: couture.stab_wall, at: contact.point}
      - {id: fan_off_w, op: remove, ids: [flight_fan]}
    reel:
      - {id: reel_snd, op: sound, sound: couture.reel, at: volley.root, every: 3, until: arrive,
         pitch: "= 1.0 + 0.4 * (1.0 - dist(pos(volley), pos(palm)) / throw_range)"}
    arrive:
      - {id: thread_off, op: remove, ids: [thread_a, thread_b, thread_body]}
      - {id: pieces_off, op: remove, ids: [mesh_body, mesh_a, mesh_b]}
      - {id: mesh_held_back, op: mesh, frame: shears, item: couture-rapier, part: held}
      - {id: catch_snd, op: sound, sound: couture.catch, at: palm}
