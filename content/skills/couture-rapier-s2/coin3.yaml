# Coin 3 (back-turned dash through the enemy, 50 dmg) and its hit burst. Starts when the shears arrive back in the hand (event coin3_start, see skill.yaml);
# timings are the v1 offsets from the rig-b start (clip couture-s2-body-b at +0, dash at +9). Ported from d41b82f1e with tools/skill-convert.
apiVersion: "astera/v2"
kind: Skill
id: couture-rapier-s2
frames:
  - {id: fx8_couture_s2_dash, kind: body, parent: caster}
  - {id: dash_hit_anchor, kind: point, parent: caster, offset: [0, 0.9, 1.3]}
  - {id: fx2_couture_s2_hit3, kind: body, parent: world, inactive: true}
gameplay:
  params: {c3_dash_distance: 9, c3_dmg: 50}
  timeline:
    - id: c3_dash
      at: "coin3_start+9"
      do:
        - id: dash
          op: dash_strike
          distance: "${c3_dash_distance}"
          ticks: 3
          radius: 0.8
          hit_once: true
          invulnerable: false
          stop_on_block: true
          follow_pitch: false
          stop_before_target: 1.0
          on_hit:
            - {id: c3_damage, op: damage, components: [{kind: physical, amount: "${c3_dmg}"}], target: victim, ignore_invulnerability: true}
            - {id: c3_place, op: place, frame: fx2_couture_s2_hit3, like: dash_hit_anchor}
            - {id: c3_hit_evt, op: event, name: dash_hit}
