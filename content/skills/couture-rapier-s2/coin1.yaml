# Coin 1 (t8 white crescent ring + thin line, 30 dmg on whoever stands in the 30 deg / 9 block cone), haze, arm-raise trail and the overhead spin slashes.
# Ported from the v1 skill (d41b82f1e) with tools/skill-convert; the file composes into couture-rapier-s2 with skill.yaml and look.yaml (strategic merge by id).
apiVersion: "astera/v2"
kind: Skill
id: couture-rapier-s2
frames:
  - {id: fx1_couture_s2_rig, kind: body, parent: caster}
  - {id: fx3_couture_s2_coin1, kind: body, parent: caster}
  - {id: fx4_couture_s2_hit1, kind: body, parent: world, inactive: true}
  - {id: fx6_couture_s2_haze, kind: body, parent: caster}
  - {id: fx7_couture_s2_trail, kind: body, parent: caster}
  - {id: snap, kind: body, parent: world, inactive: true}
gameplay:
  params: {c1_arc_deg: 30, c1_reach: 9, c1_dmg: 30}
  timeline:
    - id: c1_t8
      at: 8
      do:
        - {id: place_snap, op: place, frame: snap, like: caster}
        - {id: sel, op: hit, frames: [snap], sector: {frame: snap, forward: snap.forward, left: snap.left, angle_deg: "${c1_arc_deg}", range: "${c1_reach}", height: 2.0}, max_count: 1, window: once}
  "on":
    hit:
      - id: c1_delay
        op: delay
        after: 1
        do:
          - {id: c1_damage, op: damage, components: [{kind: physical, amount: "${c1_dmg}"}], target: victim, ignore_invulnerability: true}
        when: "= event.source == 'sel'"
      - {id: c1_place_hit, op: place, frame: fx4_couture_s2_hit1, like: enemy, when: "= event.source == 'sel'"}
      - {id: c1_hit_end, op: schedule, after: 6, event: c1_hit_end, when: "= event.source == 'sel'"}
