# Pattern Trim in the frame grammar (ADR-0314): a whirling overhead cut, the shears thrown to stick and reeled back, then a dash through the target.
# A caster frame has v = forward, w = up, s = v x w (to the right). The whirl and the flight frames stand the shears up: v = up, w = forward, s = left.
#   body    - the caster's feet; the looks that follow the caster hang on it.
#   pre     - the caster at tick 2 (held in the world): the white line and the lavender haze. c1 / wisp - the caster at ticks 7 and 15: the coin1 cut.
#   raise   - the right hand, lifted 0.9 over 6 ticks: the held shears go overhead before they come apart.
#   spin    - the whirl centre: 2.0 ahead of the right hand along the look (so the circle clears the eye by 0.8 or more at every tick; at the hand it passed within 0.24); the body piece whirls about s (54 degrees a tick, ticks 4..34; one turn is 360, so 30 ticks make 4.5 turns).
#   spin_a / spin_b - the same whirl, with the blade opening listed AFTER the s sweep so it turns about the swept edge (w): 35 / -35 degrees over ticks 4..8.
#             The body rides plain `spin`. (The whoosh volume and pitch read the tip speed spin_dpt x 0.0175 (radians) x the 0.77 tip radius: Paper gives a
#             frame no live velocity, only caster / victim / target, so the old speed(piece_a.tip) had no frame equivalent; it varied only with the hand.)
#   hand    - the right hand again, unrotated (kept for the whirl; the threads start on `body` at the right hip, 0.2 ahead, 1.0 up: in first person that is below the eye, so they read as lines going away, not a wedge at the camera).
#   over_a / over_b - 2.5 above and 2.2 ahead of the caster (in the world, never at the camera): the overhead slash loops (three sprites each, 0.1 apart) turn about v (+-600 degrees, ticks 22..32).
#   shot    - the thrown volley (release at tick 34), upright: the flight fan and the tip glints. vol - the same, but it spins about v by 378 degrees
#             (ticks 38..45, release + 4..11): the three pieces ride it at +-0.35 (the old lane). Keys count from the cast start, so these two are
#             exact only because the release is always tick 34.
#   flash / blow - one per victim: the coin1 feathers (victim feet) and the coin3 burst (victim centre). Keyless, so every blow on that victim shares them.
#   hit2    - born on entry to the stuck state, rooted on the volley (the contact point), held in the world at tick 2: the pink burst and the shadow spikes.
#   dashf   - born on entry to coin3, the caster held in the world at tick 9 (the dash start): the smears and the pink crescent.
# hit2 and dashf count from their own state (the event clock), so they do not care how long the stuck / reel lasted.
# Gameplay (every hit, damage, status, impulse, dash, reel, state length) is unchanged.
apiVersion: astera/v3
kind: Skill
id: couture-rapier-s2
item: couture-rapier
meta: {name: {ja: "型紙裁ち", en: "Pattern Trim"}, description: {ja: "突進して切り、続けてもう一撃。", en: "Dash through with a cut, then strike again."}, cooldown_ticks: 125, resource_cost: 18}
params:
  throw_speed: {type: number, default: 1.7}
  throw_range: {type: blocks, default: 7.0}
  spin_dpt: {type: number, default: 54}
  open_deg: {type: number, default: 70}
  lane: {type: number, default: 0.35}
  stick_ticks: {type: ticks, default: 28}
  root_ticks: {type: ticks, default: 9}
  reel_speed: {type: number, default: 0.45}
  dmg_coin1: {type: number, default: 30}
  dmg_throw: {type: number, default: 18}
  dmg_reel: {type: number, default: 6}
  bleed_stacks: {type: number, default: 2}
  bleed_ticks: {type: ticks, default: 60}
  dmg_coin3: {type: number, default: 50}
  c1_arc_deg: {type: number, default: 30}
  c1_reach: {type: blocks, default: 9}
  c3_dash_distance: {type: blocks, default: 9}
  thread_thick: {type: number, default: 0.06}
  spark_count: {type: number, default: 14}
  thread_color: {type: string, default: "#ff5fa2"}
  trail_color: {type: string, default: "#59ff5fa2"}
  spark_particle: {type: string, default: crit}
frames:
  - {id: body, origin: caster, v: forward, w: up, s: v x w}
  - {id: pre, origin: caster, v: forward, w: up, s: v x w, snapshot: 2}
  - {id: c1, origin: caster, v: forward, w: up, s: v x w, snapshot: 7}
  - {id: wisp, origin: caster, v: forward, w: up, s: v x w, snapshot: 15}
  - id: raise
    origin: body_anim.hand_r
    v: up
    w: forward
    s: v x w
    move:
      - {at: 0, for: 6, to: {v: 0.9}, ease: out_quad}
  - {id: hand, origin: body_anim.hand_r, v: forward, w: up, s: v x w}
  - id: spin
    origin: {frame: hand, pos: {v: 2.0}}
    v: up
    w: forward
    s: v x w
    rotate:
      - {at: 4, for: 30, about: s, to: 1620}
  - id: spin_a
    origin: {frame: hand, pos: {v: 2.0}}
    v: up
    w: forward
    s: v x w
    rotate:
      - {at: 4, for: 30, about: s, to: 1620}
      - {at: 4, for: 4, about: w, to: 35}
  - id: spin_b
    origin: {frame: hand, pos: {v: 2.0}}
    v: up
    w: forward
    s: v x w
    rotate:
      - {at: 4, for: 30, about: s, to: 1620}
      - {at: 4, for: 4, about: w, to: -35}
  - id: over_a
    origin: {frame: body, pos: {w: 2.5, v: 2.2}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 22, for: 10, about: v, to: -600}
  - id: over_b
    origin: {frame: body, pos: {w: 2.5, v: 2.2}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 22, for: 10, about: v, to: 600}
  - {id: shot, origin: volley, v: up, w: forward, s: v x w}
  - id: vol
    origin: volley
    v: up
    w: forward
    s: v x w
    rotate:
      - {at: 0, for: 1, about: s, to: 180}
      - {at: 34, for: 3, reset: true, ease: out_cubic}
      - {at: 38, for: 7, about: v, to: 378}
  - {id: flash, on: event.victim, each: true, origin: victim.feet, v: forward, w: up, s: v x w}
  - {id: blow, on: event.victim, each: true, origin: victim.center, v: forward, w: up, s: v x w}
  - {id: hit2, on: state.stuck, origin: volley, v: forward, w: up, s: v x w, snapshot: 2}
  - {id: dashf, on: state.coin3, origin: caster, v: forward, w: up, s: v x w, snapshot: 9}
# Four hits: coin1 30 (sector 30 deg, 9 blocks, height 2.0), throw 18 + bleed 2x60, reel 6, coin3 50 (dash 9 blocks, 3 ticks).
anchors:
  - {id: shears, anchor: body_anim.hand_r, mode: follow}
  - {id: palm, anchor: body_anim.hand_r, mode: follow}
  - {id: body_c, anchor: caster, offset: {up: 0.9}, mode: follow}
machine:
  start: windup
  tail: 4
  # The body anim (lastTick 63) is longer than windup (34), so it lives in the machine-wide world list.
  world:
    - {id: body_anim, op: body, target: caster, anim: couture-s2-body, speed: 1.0, for: 63}
    # couture-s2-rig.yaml:45-50 weapon_model: couture-rapier-hidden from t20 to t57 (then couture-rapier again).
    - {id: hide_held, op: held_model, at: 20, model: "astera:couture-rapier-hidden", for: 37}
    # The volley outlives its spawning state (flies for 7, sticks for stick_ticks): ADR-0303 10.1 "owner": a machine-level world: list owns things for the whole machine. It is released at tick 34 (= windup length).
    - id: volley
      at: 34
      op: projectile
      origin: shears
      velocity: "= normalize(aim_point(caster, throw_range) - pos(shears))"
      speed: "= throw_speed"
      range: "= throw_range"
      part: held
      radius: 0.22
      # hit shape: radius 0.22 around the volley's own held part (a rider frame of another state cannot carry a shape: it must be a sibling of the projectile).
      hit: {targets: enemies, once: true, attach: {for: "= stick_ticks"}}
      block: {mode: stick, for: "= stick_ticks"}
      # align: the long axis stands up (ease out) with heading caster.forward, then the volley spins about it for 7 ticks (one turn at spin_dpt 54). One turn channel, so the two laws run one after the other; the three riders (fly_a / fly_b / fly_body) carry the volley laws and run the spin for its own length, past the 7-tick throw state (the hit leaves the throw early; machine.tail covers the rest).
      motion:
        - {law: align, axis: long, to: world.up, up: caster.forward, at: 0, for: 3, ease: out_cubic}
        - {law: spin, axis: long, deg_per_tick: "${spin_dpt}", at: 4, for: 7}
      on:
        hit:
          - {id: throw_react, op: react, target: event.victim, flinch: true, for: 6}
          - {id: throw_dmg, op: damage, at: 0, target: event.victim, damage: {physical: "= dmg_throw"}}
          - {id: bleed, op: status, at: 0, target: event.victim, status: bleed, stacks: "= bleed_stacks", for: "= bleed_ticks"}
          - {id: root, op: status, at: 0, target: event.victim, status: root, stacks: 1, for: "= root_ticks"}
          - {id: push, op: impulse, at: 0, target: event.victim, vector: "= -contact.normal * 0.35 + vec(0, 0.12, 0)"}
          - {id: hitstop, op: freeze, at: 0, ticks: 2, scope: [caster, volley]}
          - {id: stab_snd, op: sound, sound: couture.stab, anchor: contact, pitch: "= 1.2 - 0.2 * clamp(length(velocity(volley) - velocity(victim)) / 2.0, 0.0, 1.0)", detach: true}
          - {id: sparks, op: particle, particle: "= spark_particle", anchor: contact, count: "= spark_count", offset: [0.4, 0.4, 0.4], extra: 0.4, detach: true}
        block:
          - {id: crumb, op: particle_def, def: couture-s2-p-crumb, anchor: contact, detach: true}
          - {id: wall_snd, op: sound, sound: couture.stab_wall, anchor: contact, detach: true}
    # tip glints (couture-s2-*-flight), ticks 3..10 after the release: world-owned so they follow the flight whichever state it is in.
    - {id: tip_glint_a, op: particle_def, def: couture-s2-p-tip, frame: shot, pos: {s: -0.6, v: 0.12, w: 0.05}, at: 37, every: 1, times: 8}
    - {id: tip_glint_b, op: particle_def, def: couture-s2-p-tip, frame: shot, pos: {s: 0.6, v: -0.1, w: 0.95}, at: 37, every: 1, times: 8}
    - {id: tip_glint_body, op: particle_def, def: couture-s2-p-tip, frame: shot, pos: {w: 0.45}, at: 37, every: 1, times: 8}
  states:
    windup:
      # coin1 (hit at 8) runs inside the overhead spin; the release event fires at tick 34.
      for: 34
      then: throw
      enter:
        - {id: raise_snd, op: sound, sound: couture.raise, anchor: shears, volume: 0.6}
      do:
        # the held shears rise overhead for 4 ticks, then the three real pieces whirl on `spin`
        - {id: held_m, op: display, kind: item, item: "astera:couture-rapier", part: held, frame: raise, for: 4}
        - {id: piece_body_m, op: display, kind: item, item: "astera:couture-rapier", part: body, frame: spin, at: 4, for: 30}
        - {id: piece_a_m, op: display, kind: item, item: "astera:couture-rapier", part: blade_a, frame: spin_a, at: 4, for: 30}
        - {id: piece_b_m, op: display, kind: item, item: "astera:couture-rapier", part: blade_b, frame: spin_b, at: 4, for: 30}
        # trails: the blade tip (0.77 up, 0.54 to the side) behind the root; alpha 0.35 = byte 0x59 of the colour, fade 1.5
        - {id: trail_a, op: ribbon, of: {frame: spin_a, pos: {v: 0.77, s: -0.54}}, root: {frame: spin_a, pos: {v: -0.06}}, history: 6, style: soft, width_frac: 0.6, fade: 1.5, color: "= trail_color", at: 4, for: 30}
        - {id: trail_b, op: ribbon, of: {frame: spin_b, pos: {v: 0.77, s: 0.54}}, root: {frame: spin_b, pos: {v: -0.06}}, history: 6, style: soft, width_frac: 0.6, fade: 1.5, color: "= trail_color", at: 4, for: 30}
        - {id: whoosh, op: sound, sound: couture.whoosh, anchor: shears, at: 4, every: 4, for: 30, volume: "= clamp(spin_dpt * 0.0175 * 0.77 / 1.5, 0.2, 1.0)", pitch: "= 0.9 + 0.3 * clamp(spin_dpt * 0.0175 * 0.77 / 2.0, 0.0, 1.0)"}
        # coin1: 30 degree / 9 block cone around the caster pose of tick 8; damage lands one tick after the selector (delay op)
        - {id: slash, op: frame, anchor: caster, mode: snapshot, at: 8, for: 1}
        - id: c1_hit
          op: hit
          at: 8
          anchor: slash
          targets: enemies
          shape: {sector: {deg: = c1_arc_deg, range: = c1_reach, height: 2.0, forward: yaw}}
          max_count: 1
          window: once
          ignore_invulnerability: false
          on:
            hit:
              - {id: c1_react, op: react, target: event.victim, flinch: true, for: 6}
              - {id: c1_damage, op: damage, at: 1, target: event.victim, damage: {physical: "= dmg_coin1"}, ignore_invulnerability: true}
              # hit1 flash: four feather bars (0/45/90/135 deg) swell and fade over the victim, orange/crit sparks
              - {id: h1_feather, op: display, kind: sprite, sprite: couture-s2-feather, frame: flash, pos: {w: 1.2}, at: 0, for: 6, times: 4, rotate: [{axis: v, deg: "= 45 * i"}], size: [0.65, 0.1], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 1, scale: [8.67, 13, 1], alpha: 0.7, ease: out_expo}, {t: 6, scale: [11.22, 0.5, 1], alpha: 0, ease: in_quad}]}]}
              - {id: h1_orange, op: particle_def, def: couture-s2-p-orange, frame: flash, every: 1, times: 3, detach: true}
              - {id: h1_spark, op: particle_def, def: couture-s2-p-spark, frame: flash, every: 3, times: 2, detach: true}
              - {id: h1_crit, op: particle_def, def: couture-s2-p-crit, frame: flash, detach: true}
        # max_count: 1 = the nearest 1 target (hit cap; founder 10/28 ruling).
        - {id: snd_5, op: sound, sound: entity.player.attack.sweep, anchor: caster, at: 0, volume: 0.5, pitch: 0.6}
        - {id: snd_6, op: sound, sound: item.armor.equip_chain, anchor: caster, at: 0, volume: 0.6, pitch: 1.4}
        - {id: snd_7, op: sound, sound: block.amethyst_block.resonate, anchor: caster, at: 3, volume: 0.5, pitch: 1.6}
        - {id: snd_8, op: sound, sound: entity.player.attack.sweep, anchor: caster, at: 9, volume: 0.9, pitch: 1.3}
        - {id: snd_9, op: sound, sound: entity.sheep.shear, anchor: caster, at: 9, volume: 1, pitch: 1}
        - {id: snd_10, op: sound, sound: block.amethyst_cluster.break, anchor: caster, at: 11, volume: 0.5, pitch: 1.5}
        - {id: snd_11, op: sound, sound: item.trident.throw, anchor: caster, at: 18, volume: 0.5, pitch: 1.2}
        - {id: snd_13, op: sound, sound: block.amethyst_block.chime, anchor: caster, at: 33, volume: 0.6, pitch: 0.7}

        # --- tick 2..: a white line draws in front of the caster (14 degrees up) and a lavender haze gathers
        - {id: line, op: display, kind: block, block: white_concrete, frame: pre, pos: {w: 0.8}, rotate: [{axis: s, deg: 14}], at: 2, for: 9, scale: [0.05, 0.05, 9], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 0.01]}, {t: 1, scale: [1, 1, 1], ease: out_expo}, {t: 9, scale: [0, 0, 1], ease: in_quad}]}]}
        - {id: haze, op: display, kind: sprite, sprite: couture-s2-haze-soft, color: "#8A5CFF", frame: pre, pos: {w: 0.9, v: -0.1}, at: 3, for: 8, size: [2.56, 2.56], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 4, scale: [1.5, 1.5, 1], alpha: 0.3}, {t: 8, scale: [2, 2, 1], alpha: 0}]}]}

        # --- tick 7..17: coin1 cut. Five streaks fly out along the arc, a crescent core flashes, white/orange sparks and 30 petal sparks scatter
        - {id: streak_a, op: display, kind: sprite, sprite: couture-s2-streak, frame: c1, pos: {v: 0.8, w: 0.9}, at: 7, for: 6, rotate: [{axis: v, deg: 6}], size: [1.28, 1.28], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 1, scale: [2.5, 1, 1], alpha: 1, ease: out_expo}, {t: 5, scale: [1.5, 0.6, 1], alpha: 0, ease: in_quad}]}, {law: move, velocity: {v: 1.3}, at: 0, for: 5}]}
        - {id: streak_b, op: display, kind: sprite, sprite: couture-s2-streak, frame: c1, pos: {v: 1.4, w: 1.3}, at: 7, for: 6, rotate: [{axis: v, deg: -4}], size: [1.28, 1.28], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 1, scale: [2.5, 1, 1], alpha: 1, ease: out_expo}, {t: 5, scale: [1.5, 0.6, 1], alpha: 0, ease: in_quad}]}, {law: move, velocity: {v: 1.3}, at: 0, for: 5}]}
        - {id: streak_c, op: display, kind: sprite, sprite: couture-s2-streak, frame: c1, pos: {v: 0.6, w: 1.7}, at: 7, for: 6, rotate: [{axis: v, deg: 10}], size: [1.28, 1.28], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 1, scale: [2.5, 1, 1], alpha: 1, ease: out_expo}, {t: 5, scale: [1.5, 0.6, 1], alpha: 0, ease: in_quad}]}, {law: move, velocity: {v: 1.3}, at: 0, for: 5}]}
        - {id: streak_d, op: display, kind: sprite, sprite: couture-s2-streak, frame: c1, pos: {v: 1.2, w: 2.1}, at: 7, for: 6, rotate: [{axis: v, deg: -8}], size: [1.28, 1.28], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 1, scale: [2.5, 1, 1], alpha: 1, ease: out_expo}, {t: 5, scale: [1.5, 0.6, 1], alpha: 0, ease: in_quad}]}, {law: move, velocity: {v: 1.3}, at: 0, for: 5}]}
        - {id: streak_e, op: display, kind: sprite, sprite: couture-s2-streak, frame: c1, pos: {v: 0.9, w: 2.5}, at: 7, for: 6, rotate: [{axis: v, deg: 3}], size: [1.28, 1.28], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 1, scale: [2.5, 1, 1], alpha: 1, ease: out_expo}, {t: 5, scale: [1.5, 0.6, 1], alpha: 0, ease: in_quad}]}, {law: move, velocity: {v: 1.3}, at: 0, for: 5}]}
        - {id: core, op: display, kind: sprite, sprite: couture-s2-crescent-core, frame: c1, pos: {v: -0.2, w: 1}, at: 7, for: 8, size: [3.2, 2.56], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [0.6, 0.6, 1], alpha: 0}, {t: 1, scale: [1, 1, 1], alpha: 1, ease: out_expo}, {t: 8, scale: [1.3, 1.3, 1], alpha: 0, ease: in_quad}]}]}
        - {id: white_spark, op: particle_def, def: couture-s2-p-white, frame: c1, at: 7, every: 1, times: 7}
        - {id: orange_spark, op: particle_def, def: couture-s2-p-orange, frame: c1, at: 7, every: 1, times: 6}
        # 30 petal sparks on the golden-angle fan in front of the caster (explicit rows: v = 0.6 + 0.04 i, w = 1.3 + 0.7 cos(77 i), s = -0.9 sin(137.5 i); six per tick from 8)
        - {id: petal_0, op: display, kind: sprite, sprite: couture-s2-petal-spark, frame: c1, pos: {v: 0.6, w: 2}, at: 8, for: 6, rotate: [{axis: v, deg: 40}], size: [0.22, 0.22], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 2, scale: [1, 1, 1], alpha: 1}, {t: 6, scale: [0.4, 0.4, 1], alpha: 0, ease: in_quad}]}, {law: move, velocity: {v: 0.4}, at: 0, for: 4}]}
        - {id: petal_1, op: display, kind: sprite, sprite: couture-s2-petal-spark, frame: c1, pos: {v: 0.64, w: 1.46, s: -0.61}, at: 8, for: 6, rotate: [{axis: v, deg: 40}], size: [0.22, 0.22], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 2, scale: [1, 1, 1], alpha: 1}, {t: 6, scale: [0.4, 0.4, 1], alpha: 0, ease: in_quad}]}, {law: move, velocity: {v: 0.4}, at: 0, for: 4}]}
        - {id: petal_2, op: display, kind: sprite, sprite: couture-s2-petal-spark, frame: c1, pos: {v: 0.68, w: 0.67, s: 0.9}, at: 8, for: 6, rotate: [{axis: v, deg: 40}], size: [0.22, 0.22], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 2, scale: [1, 1, 1], alpha: 1}, {t: 6, scale: [0.4, 0.4, 1], alpha: 0, ease: in_quad}]}, {law: move, velocity: {v: 0.4}, at: 0, for: 4}]}
        - {id: petal_3, op: display, kind: sprite, sprite: couture-s2-petal-spark, frame: c1, pos: {v: 0.72, w: 0.86, s: -0.71}, at: 8, for: 6, rotate: [{axis: v, deg: 40}], size: [0.22, 0.22], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 2, scale: [1, 1, 1], alpha: 1}, {t: 6, scale: [0.4, 0.4, 1], alpha: 0, ease: in_quad}]}, {law: move, velocity: {v: 0.4}, at: 0, for: 4}]}
        - {id: petal_4, op: display, kind: sprite, sprite: couture-s2-petal-spark, frame: c1, pos: {v: 0.76, w: 1.73, s: 0.16}, at: 8, for: 6, rotate: [{axis: v, deg: 40}], size: [0.22, 0.22], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 2, scale: [1, 1, 1], alpha: 1}, {t: 6, scale: [0.4, 0.4, 1], alpha: 0, ease: in_quad}]}, {law: move, velocity: {v: 0.4}, at: 0, for: 4}]}
