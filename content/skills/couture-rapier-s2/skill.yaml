        - {id: over_b2_m, op: display, kind: sprite, sprite: couture-s2-overhead-slash, frame: over_b, at: 22, for: 10, size: [1.65, 1.65], billboard: fixed, pos: {w: 0}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 2, scale: [1, 1, 1], alpha: 0.9}, {t: 10, scale: [0.4, 0.4, 1], alpha: 0, ease: in_quad}]}]}
    throw:
      # release: volley placed at the shears, fly tip-first at throw_speed, gravity 0, drag 0, max_ticks = ceil(range / speed) + 2
      for: 7   # = ceil(throw_range / throw_speed) + 2 = ceil(7 / 1.7) + 2 = 5 + 2 = 7 with the current params (C5: for is a compile-time tick count)
      then: reel
      enter:
        # the three flying pieces ride `vol` (the spin about v is its rotate key): body in the middle, blade_a / blade_b 0.35 either side
        - {id: fly_body_m, op: display, kind: item, item: "astera:couture-rapier", part: body, frame: vol, until: reel.end}
        - {id: fly_a_m, op: display, kind: item, item: "astera:couture-rapier", part: blade_a, frame: vol, pos: {s: 0.35}, rotate: [{axis: edge, deg: 35}], until: reel.end}
        - {id: fly_b_m, op: display, kind: item, item: "astera:couture-rapier", part: blade_b, frame: vol, pos: {s: -0.35}, rotate: [{axis: edge, deg: -35}], until: reel.end}
        # fly_a stays a frame op: the reel_hit capsule reads its root and tip (gameplay, `lane` is its offset)
        - {id: fly_a, op: frame, anchor: /windup/volley, offset: {left: "= lane * fly_a.length"}, turn: [{axis: edge, deg: 35}], part: blade_a, until: reel.end}
        - {id: throw_snd, op: sound, sound: couture.throw, anchor: shears, pitch: 1.1}
        # dust: vanilla directed form (R34); speed 0 so the velocity is only inherit_velocity 0.5 x the volley velocity.
        - {id: puff, op: particle, particle: dust, anchor: palm, times: 6, count: 0, offset: "= velocity(volley) * 0.5", extra: 1.0, color: "= thread_color", size: 1.0}
        # palm_f stays: the reel flies the volley back to it. The three threads run from the hand to each piece's root.
        - {id: palm_f, op: frame, anchor: palm, until: reel.end}
        # the reel ends on arrival (a runtime distance), so the threads have no static length: until: reel.end ends them the tick the reel lands.
        - {id: thread_a, op: ribbon, from: {frame: body, pos: {v: 0.2, w: 1.0, s: 0.45}}, to: {frame: vol, pos: {s: 0.35, v: -0.06}}, thickness: "= thread_thick", color: "= thread_color", until: reel.end}
        - {id: thread_b, op: ribbon, from: {frame: body, pos: {v: 0.2, w: 1.0, s: 0.45}}, to: {frame: vol, pos: {s: -0.35, v: -0.06}}, thickness: "= thread_thick", color: "= thread_color", until: reel.end}
        - {id: thread_body, op: ribbon, from: {frame: body, pos: {v: 0.2, w: 1.0, s: 0.45}}, to: {frame: vol, pos: {}}, thickness: "= thread_thick", color: "= thread_color", until: reel.end}
        # the flight fan: the crescent lies in the plane of the flight direction (w) and up (v), alpha 0.5, size 6.4 x 0.15625 = 1.0 rendered
        - {id: flight_fan, op: display, kind: sprite, sprite: couture-s2-crescent, size: [6.4, 6.4], color: "#80ffffff", frame: shot, plane: [w, v], billboard: fixed, for: 7}
      on:
        - {event: volley.hit, to: stuck}
        - {event: volley.block, to: stuck}
    stuck:
      for: "= stick_ticks"
      then: reel
      do:
        # stick-spark / stick-pink (couture-s2-*-stuck): ticks 0..2 per piece, 1.48 up the piece (v) at its lane (s)
        - {id: stick_a_stick, op: particle_def, def: couture-s2-p-stick, frame: shot, pos: {s: -0.6, v: 1.48, w: 0.05}, at: 0, every: 1, times: 3}
        - {id: stick_a_stick_pink, op: particle_def, def: couture-s2-p-stick-pink, frame: shot, pos: {s: -0.6, v: 1.48, w: 0.05}, at: 0, every: 1, times: 3}
        - {id: stick_b_stick, op: particle_def, def: couture-s2-p-stick, frame: shot, pos: {s: 0.6, v: 1.48, w: 0.05}, at: 0, every: 1, times: 3}
        - {id: stick_b_stick_pink, op: particle_def, def: couture-s2-p-stick-pink, frame: shot, pos: {s: 0.6, v: 1.48, w: 0.05}, at: 0, every: 1, times: 3}
        - {id: stick_body_stick, op: particle_def, def: couture-s2-p-stick, frame: shot, pos: {v: 1.48, w: 0.05}, at: 0, every: 1, times: 3}
        - {id: stick_body_stick_pink, op: particle_def, def: couture-s2-p-stick-pink, frame: shot, pos: {v: 1.48, w: 0.05}, at: 0, every: 1, times: 3}
        # --- hit2 burst at the volley (the contact), ticks 2..: pink plumes / stars / shards / flares swell and collapse, embers and sparks, then a shadow spike ring
