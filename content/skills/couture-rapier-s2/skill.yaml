                      - {law: keys, keys: [{t: 0, offset: {left: 0, up: 1.2, forward: 0}, scale: {left: 1, up: 1, forward: 1.0}, pose: [{axis: forward, deg: 45}], alpha: 0}, {t: 1, offset: {left: 0, up: 1.2, forward: 0}, scale: {left: 8.66667, up: 13, forward: 1.0}, pose: [{axis: forward, deg: 45}], alpha: 0.7, ease: out_expo}, {t: 6, offset: {left: 0, up: 1.2, forward: 0}, scale: {left: 11.21569, up: 0.5, forward: 1.0}, pose: [{axis: forward, deg: 45}], alpha: 0, ease: in_quad}]}
