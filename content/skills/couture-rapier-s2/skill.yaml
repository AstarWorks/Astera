              - {id: h3_petal_3, op: display, kind: sprite, sprite: couture-s2-petal, frame: blow, pos: {w: 0.94, s: -0.39}, at: 1, for: 9, rotate: [{axis: v, deg: -100}], size: [0.16, 0.1], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 1, scale: [1, 1, 1], alpha: 1}, {t: 9, scale: [0.5, 0.5, 1], alpha: 0, ease: in_quad}]}, {law: move, velocity: {w: -0.05}, at: 0, for: 9}]}
              - {id: h3_petal_4, op: display, kind: sprite, sprite: couture-s2-petal, frame: blow, pos: {w: 0.85}, at: 1, for: 9, rotate: [{axis: v, deg: -70}], size: [0.16, 0.1], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 1, scale: [1, 1, 1], alpha: 1}, {t: 9, scale: [0.5, 0.5, 1], alpha: 0, ease: in_quad}]}, {law: move, velocity: {w: -0.05}, at: 0, for: 9}]}
              - {id: h3_petal_5, op: display, kind: sprite, sprite: couture-s2-petal, frame: blow, pos: {w: 0.94, s: 0.39}, at: 1, for: 9, rotate: [{axis: v, deg: -40}], size: [0.16, 0.1], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 1, scale: [1, 1, 1], alpha: 1}, {t: 9, scale: [0.5, 0.5, 1], alpha: 0, ease: in_quad}]}, {law: move, velocity: {w: -0.05}, at: 0, for: 9}]}
              - {id: h3_petal_6, op: display, kind: sprite, sprite: couture-s2-petal, frame: blow, pos: {w: 1.15, s: 0.55}, at: 1, for: 9, rotate: [{axis: v, deg: -10}], size: [0.16, 0.1], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 1, scale: [1, 1, 1], alpha: 1}, {t: 9, scale: [0.5, 0.5, 1], alpha: 0, ease: in_quad}]}, {law: move, velocity: {w: -0.05}, at: 0, for: 9}]}
              - {id: h3_petal_7, op: display, kind: sprite, sprite: couture-s2-petal, frame: blow, pos: {w: 1.36, s: 0.39}, at: 1, for: 9, rotate: [{axis: v, deg: 20}], size: [0.16, 0.1], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 1, scale: [1, 1, 1], alpha: 1}, {t: 9, scale: [0.5, 0.5, 1], alpha: 0, ease: in_quad}]}, {law: move, velocity: {w: -0.05}, at: 0, for: 9}]}
              - {id: h3_debris_0, op: display, kind: sprite, sprite: couture-s2-burst-shard, frame: blow, pos: {w: 0.88, s: -1.14}, at: 6, for: 19, rotate: [{axis: v, deg: 4}], size: [0.77, 1.79], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 2, scale: [1, 1, 1], alpha: 1}, {t: 19, scale: [0.3, 0.3, 1], alpha: 0, ease: in_quad}]}, {law: move, velocity: {w: -0.03}, at: 0, for: 19}]}
              - {id: h3_debris_1, op: display, kind: sprite, sprite: couture-s2-burst-shard, frame: blow, pos: {w: 1.45, s: -0.75}, at: 6, for: 19, rotate: [{axis: v, deg: 44}], size: [0.77, 1.79], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 2, scale: [1, 1, 1], alpha: 1}, {t: 19, scale: [0.3, 0.3, 1], alpha: 0, ease: in_quad}]}, {law: move, velocity: {w: -0.03}, at: 0, for: 19}]}
              - {id: h3_debris_2, op: display, kind: sprite, sprite: couture-s2-burst-shard, frame: blow, pos: {w: 1.13, s: -0.11}, at: 6, for: 19, rotate: [{axis: v, deg: 85}], size: [0.77, 1.79], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 2, scale: [1, 1, 1], alpha: 1}, {t: 19, scale: [0.3, 0.3, 1], alpha: 0, ease: in_quad}]}, {law: move, velocity: {w: -0.03}, at: 0, for: 19}]}
