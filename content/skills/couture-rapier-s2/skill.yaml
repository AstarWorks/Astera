# v3 draft (wave 2, w2-couture). Hand-ported from the v2 skill.yaml + look.yaml; per-tick values come from the v2 tracks.
# Each linear run of a v2 track channel is one law (laws sum and hold).
apiVersion: astera/v3
kind: Skill
id: couture-rapier-s2
item: couture-rapier
meta: {name: {ja: "型紙裁ち", en: "Pattern Trim"}, description: {ja: "突進して切り、続けてもう一撃。", en: "Dash through with a cut, then strike again."}, cooldown_ticks: 125, resource_cost: 18}
params:
  throw_speed: {type: number, default: 1.7}
  throw_range: {type: blocks, default: 7.0}
  spin_dpt: {type: number, default: 54}
  open_deg: {type: number, default: 70}
  lane: {type: number, default: 0.35}
  stick_ticks: {type: ticks, default: 28}
  reel_speed: {type: number, default: 0.45}
  dmg_coin1: {type: number, default: 30}
  dmg_throw: {type: number, default: 18}
  dmg_reel: {type: number, default: 6}
  bleed_stacks: {type: number, default: 2}
  bleed_ticks: {type: ticks, default: 60}
  dmg_coin3: {type: number, default: 50}
  c1_arc_deg: {type: number, default: 30}
  c1_reach: {type: blocks, default: 9}
  c3_dash_distance: {type: blocks, default: 9}
  thread_color: {type: string, default: "#ff5fa2"}
  thread_thick: {type: number, default: 0.06}
  spark_count: {type: number, default: 14}
  spark_particle: {type: string, default: crit}
# Four hits: coin1 30 (sector 30 deg, 9 blocks, height 2.0), throw 18 + bleed 2x60, reel 6, coin3 50 (dash 9 blocks, 3 ticks).
anchors:
  - {id: shears, anchor: caster.hand_r, mount: caster}
machine:
  start: windup
  states:
    windup:
      # v2: coin1 (hit at 8) runs inside the overhead spin; the release event fires at tick 34.
      for: 34
      then: throw
      enter:
        - {id: body_anim, op: body, anim: couture-s2-body, speed: 1.0, for: 63}
        - {id: raise_snd, op: sound, sound: couture.raise, anchor: shears, volume: 0.6}
      do:
        # v2 mesh_held (held part of the shears) shown ticks 0-4, then the three real pieces; raise 0-6: shears overhead (+0.9 up), long axis to world up, ease_out
        # frames carry the model part (content/frames/couture-rapier.yaml), the item displays ride on them.
        - {id: held, op: frame, anchor: shears, part: held, for: 4, motion: [{law: move, velocity: {up: 0.9}, at: 0, for: 6, ease: out_quad}]}
            # GAP: v2 pose align {axis: shears.axis, to: world.up, up: caster.forward} over 6 ticks (ease_out) -> none (rotation to a world axis; the amount follows the hand pose)
        - {id: held_m, op: display, kind: item, item: "astera:couture-rapier", anchor: held, for: 4}
        - {id: piece_body, op: frame, anchor: shears, part: body, at: 4, for: 30, motion: [{law: spin, axis: left, deg_per_tick: "${spin_dpt}", at: 0, for: 30}]}
        - {id: piece_body_m, op: display, kind: item, item: "astera:couture-s2-body", anchor: piece_body, at: 4, for: 30}
        - id: piece_a
          op: frame
          anchor: shears
          part: blade_a
          at: 4
          for: 30
          motion:
            - {law: spin, axis: left, deg_per_tick: "${spin_dpt}", at: 0, for: 30}
            - {law: keys, keys: [{t: 0, pose: []}, {t: 4, pose: [{axis: edge, deg: 35}]}]}      # open_deg / 2
        - {id: piece_a_m, op: display, kind: item, item: "astera:couture-rapier-blade-a", anchor: piece_a, at: 4, for: 30}
        - id: piece_b
          op: frame
          anchor: shears
          part: blade_b
          at: 4
          for: 30
          motion:
            - {law: spin, axis: left, deg_per_tick: "${spin_dpt}", at: 0, for: 30}
            - {law: keys, keys: [{t: 0, pose: []}, {t: 4, pose: [{axis: edge, deg: -35}]}]}     # -open_deg / 2
        - {id: piece_b_m, op: display, kind: item, item: "astera:couture-rapier-blade-b", anchor: piece_b, at: 4, for: 30}
        # v2 spin op on the shears frame (54 deg/tick about caster.left, ticks 4-34): carried by the spin law on each piece above (R34: laws live on displays / the projectile body, never on an anchor).
        - {id: trail_a, op: ribbon, of: piece_a.tip, root: piece_a.root, lasts: 6, color: "= thread_color", at: 4, for: 30}
        - {id: trail_b, op: ribbon, of: piece_b.tip, root: piece_b.root, lasts: 6, color: "= thread_color", at: 4, for: 30}
        - {id: whoosh, op: sound, sound: couture.whoosh, anchor: shears, at: 4, every: 4, for: 30, volume: "= clamp(speed(shears.tip) / 1.5, 0.2, 1.0)", pitch: "= 0.9 + 0.3 * clamp(speed(shears.tip) / 2.0, 0.0, 1.0)"}
        # coin1: 30 degree / 9 block cone around the caster pose of tick 8; damage lands one tick after the selector (v2 delay op)
        - {id: slash, op: frame, anchor: caster, mode: snapshot, at: 8, for: 1}
        - id: c1_hit
          op: hit
          at: 8
          anchor: slash
          targets: enemies
          shape: {sector: {deg: = c1_arc_deg, range: = c1_reach, height: 2.0, forward: yaw}}
          max_count: 1
          window: once
          ignore_invulnerability: false
          on:
            hit:
              - {id: c1_damage, op: damage, at: 1, target: event.victim, damage: {physical: "= dmg_coin1"}, ignore_invulnerability: true}
              - id: h0
                op: group
                at: 0
                do:
                  - id: fx4_couture_s2_hit1
                    op: frame
                    anchor: victim
                    axes: caster
                    mode: snapshot
                    for: 6
                  - id: fx4_couture_s2_hit1_p_orange
                    op: particle_def
                    def: couture-s2-p-orange
                    anchor: fx4_couture_s2_hit1
                    every: 1
                    times: 3
                  - id: fx4_couture_s2_hit1_p_spark
                    op: particle_def
                    def: couture-s2-p-spark
                    anchor: fx4_couture_s2_hit1
                    every: 3
