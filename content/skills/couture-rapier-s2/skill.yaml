        - {id: wisp, op: display, kind: sprite, sprite: couture-s2-crescent-core, frame: wisp, pos: {v: -1.6, w: 1.3}, at: 15, for: 6, size: [0.51, 3.2], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 1, scale: [1, 1, 1], alpha: 0.8, ease: out_expo}, {t: 6, scale: [1.4, 0.6, 1], alpha: 0, ease: in_quad}]}]}

