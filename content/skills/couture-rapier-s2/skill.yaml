# Pattern Trim: a whirling overhead cut, the shears thrown to stick and reeled back, then a dash through the target.
# Written in the ADR-0303 high-level form: one op per visual object, copies as `times:` families, shape as laws and keys.
apiVersion: astera/v3
kind: Skill
id: couture-rapier-s2
item: couture-rapier
meta: {name: {ja: "型紙裁ち", en: "Pattern Trim"}, description: {ja: "突進して切り、続けてもう一撃。", en: "Dash through with a cut, then strike again."}, cooldown_ticks: 125, resource_cost: 18}
params:
  throw_speed: {type: number, default: 1.7}
  throw_range: {type: blocks, default: 7.0}
  spin_dpt: {type: number, default: 54}
  open_deg: {type: number, default: 70}
  lane: {type: number, default: 0.35}
  stick_ticks: {type: ticks, default: 28}
  reel_speed: {type: number, default: 0.45}
  dmg_coin1: {type: number, default: 30}
  dmg_throw: {type: number, default: 18}
  dmg_reel: {type: number, default: 6}
  bleed_stacks: {type: number, default: 2}
  bleed_ticks: {type: ticks, default: 60}
  dmg_coin3: {type: number, default: 50}
  c1_arc_deg: {type: number, default: 30}
  c1_reach: {type: blocks, default: 9}
  c3_dash_distance: {type: blocks, default: 9}
  thread_thick: {type: number, default: 0.06}
  spark_count: {type: number, default: 14}
  thread_color: {type: string, default: "#ff5fa2"}
  trail_color: {type: string, default: "#59ff5fa2"}
  spark_particle: {type: string, default: crit}
# Four hits: coin1 30 (sector 30 deg, 9 blocks, height 2.0), throw 18 + bleed 2x60, reel 6, coin3 50 (dash 9 blocks, 3 ticks).
anchors:
  - {id: shears, anchor: body_anim.hand_r, mode: follow}
  - {id: palm, anchor: body_anim.hand_r, mode: follow}
  - {id: body_c, anchor: caster, offset: {up: 0.9}, mode: follow}
machine:
  start: windup
  tail: 4
  # The body anim (lastTick 63) is longer than windup (34), so it lives in the machine-wide world list.
  world:
    - {id: body_anim, op: body, target: caster, anim: couture-s2-body, speed: 1.0, for: 63}
    # couture-s2-rig.yaml:45-50 weapon_model: couture-rapier-hidden from t20 to t57 (then couture-rapier again).
    - {id: hide_held, op: held_model, at: 20, model: "astera:couture-rapier-hidden", for: 37}
    # The volley outlives its spawning state (flies for 7, sticks for stick_ticks): ADR-0303 10.1 "owner": a machine-level world: list owns things for the whole machine. It is released at tick 34 (= windup length).
    - id: volley
      at: 34
      op: projectile
      origin: shears
      velocity: "= normalize(aim_point(caster, throw_range) - pos(shears))"
      speed: "= throw_speed"
      range: "= throw_range"
      part: held
      radius: 0.22
      # v2 hit shape: radius 0.22 around the volley's own held part (a rider frame of another state cannot carry a shape: it must be a sibling of the projectile).
      hit: {targets: enemies, once: true, attach: {for: "= stick_ticks"}}
      block: {mode: stick, for: "= stick_ticks"}
      # v2 align: the long axis stands up (ease out) with heading caster.forward, then the volley spins about it for 7 ticks (one turn at spin_dpt 54). One turn channel, so the two laws run one after the other; the three riders (fly_a / fly_b / fly_body) carry the volley laws and run the spin for its own length, past the 7-tick throw state (the hit leaves the throw early; machine.tail covers the rest).
      motion:
        - {law: align, axis: long, to: world.up, up: caster.forward, at: 0, for: 3, ease: out_cubic}
        - {law: spin, axis: long, deg_per_tick: "${spin_dpt}", at: 4, for: 7}
      on:
        hit:
          - {id: throw_dmg, op: damage, at: 0, target: event.victim, damage: {physical: "= dmg_throw"}}
          - {id: bleed, op: status, at: 0, target: event.victim, status: bleed, stacks: "= bleed_stacks", for: "= bleed_ticks"}
          - {id: push, op: impulse, at: 0, target: event.victim, vector: "= -contact.normal * 0.35 + vec(0, 0.12, 0)"}
          - {id: hitstop, op: freeze, at: 0, ticks: 2, scope: [caster, volley]}
          - {id: stab_snd, op: sound, sound: couture.stab, anchor: contact, pitch: "= 1.2 - 0.2 * clamp(length(velocity(volley) - velocity(victim)) / 2.0, 0.0, 1.0)", detach: true}
          - {id: sparks, op: particle, particle: "= spark_particle", anchor: contact, count: "= spark_count", offset: [0.4, 0.4, 0.4], extra: 0.4, detach: true}
        block:
          - {id: crumb, op: particle_def, def: couture-s2-p-crumb, anchor: contact, detach: true}
          - {id: wall_snd, op: sound, sound: couture.stab_wall, anchor: contact, detach: true}
    # tip-glint (couture-s2-*-flight): ticks 3..10 of the flight rig clock, i.e. from the release at 34: world-owned so they follow the flight whichever state it is in.
    - {id: tip_glint_a, op: particle_def, def: couture-s2-p-tip, anchor: {of: volley, offset: {left: -0.6, up: 0.12, forward: 0.05}}, at: 37, every: 1, times: 8}
    - {id: tip_glint_b, op: particle_def, def: couture-s2-p-tip, anchor: {of: volley, offset: {left: 0.6, up: -0.1, forward: 0.95}}, at: 37, every: 1, times: 8}
    - {id: tip_glint_body, op: particle_def, def: couture-s2-p-tip, anchor: {of: volley, offset: {left: 0.0, up: 0.0, forward: 0.45}}, at: 37, every: 1, times: 8}
  states:
    windup:
      # coin1 (hit at 8) runs inside the overhead spin; the release event fires at tick 34.
      for: 34
      then: throw
      enter:
        - {id: raise_snd, op: sound, sound: couture.raise, anchor: shears, volume: 0.6}
      do:
        # mesh_held (held part of the shears) shown ticks 0-4, then the three real pieces; raise 0-6: shears overhead (+0.9 up), long axis to world up, ease_out
        # frames carry the model part (content/frames/couture-rapier.yaml), the item displays ride on them.
        - {id: held, op: frame, anchor: shears, part: held, for: 4, motion: [{law: move, velocity: {up: 0.9}, at: 0, for: 6, ease: out_quad}, {law: align, axis: long, to: world.up, up: caster.forward, at: 0, for: 6, ease: out_cubic}]}
        - {id: held_m, op: display, kind: item, item: "astera:couture-rapier", anchor: held, for: 4}
        # look/skill: spin was one op on frame `shears`; open_a/open_b (pose on blade_a/blade_b) were children of it. Spin lives on its own frame, the part frames hang under it (spin x pose).
        - {id: spin_frame, op: frame, anchor: shears, at: 4, for: 30, motion: [{law: spin, axis: left, deg_per_tick: "${spin_dpt}", at: 0, for: 30}]}
        - {id: piece_body, op: frame, anchor: spin_frame, part: body, at: 4, for: 30}
        - {id: piece_body_m, op: display, kind: item, item: "astera:couture-s2-body", anchor: piece_body, at: 4, for: 30}
        - id: piece_a
          op: frame
          anchor: spin_frame
          part: blade_a
          at: 4
          for: 30
          motion:
            - {law: spin, axis: edge, deg_per_tick: 8.75, at: 0, for: 4}      # opens to open_deg / 2 = 35 over 4 ticks (a rate law composes with the frame spin; a key tick inside that spin window is a load error)
        - {id: piece_a_m, op: display, kind: item, item: "astera:couture-rapier-blade-a", anchor: piece_a, at: 4, for: 30}
        - id: piece_b
          op: frame
          anchor: spin_frame
          part: blade_b
          at: 4
          for: 30
          motion:
            - {law: spin, axis: edge, deg_per_tick: -8.75, at: 0, for: 4}     # -open_deg / 2
        - {id: piece_b_m, op: display, kind: item, item: "astera:couture-rapier-blade-b", anchor: piece_b, at: 4, for: 30}
        # spin op on the shears frame (54 deg/tick about caster.left, ticks 4-34): carried by the spin law on each piece above (R34: laws live on displays / the projectile body, never on an anchor).
        # trail: ticks 6, width_frac 0.6, alpha 0.35 = byte 0x59 of the colour (ribbon opacity is the colour alpha byte), fade_power default 1.5 (ADR-0303 s.260); the colour is a literal (ribbon colour takes no param), crimson patches it.
        - {id: trail_a, op: ribbon, of: piece_a.tip, root: piece_a.root, history: 6, style: soft, width_frac: 0.6, fade: 1.5, color: "= trail_color", at: 4, for: 30}
        - {id: trail_b, op: ribbon, of: piece_b.tip, root: piece_b.root, history: 6, style: soft, width_frac: 0.6, fade: 1.5, color: "= trail_color", at: 4, for: 30}
        # volume / pitch read the tip speed: piece_a.tip (frame-op point, ADR-0303 3.5).
        - {id: whoosh,op: sound, sound: couture.whoosh, anchor: shears, at: 4, every: 4, for: 30, volume: "= clamp(speed(piece_a.tip) / 1.5, 0.2, 1.0)", pitch: "= 0.9 + 0.3 * clamp(speed(piece_a.tip) / 2.0, 0.0, 1.0)"}
        # coin1: 30 degree / 9 block cone around the caster pose of tick 8; damage lands one tick after the selector (delay op)
        - {id: slash, op: frame, anchor: caster, mode: snapshot, at: 8, for: 1}
        - id: c1_hit
          op: hit
          at: 8
          anchor: slash
          targets: enemies
          shape: {sector: {deg: = c1_arc_deg, range: = c1_reach, height: 2.0, forward: yaw}}
          max_count: 1
          window: once
          ignore_invulnerability: false
          on:
            hit:
              - {id: c1_damage, op: damage, at: 1, target: event.victim, damage: {physical: "= dmg_coin1"}, ignore_invulnerability: true}
              # hit1 flash: four feather bars (0/45/90/135 deg) swell and fade over the victim, orange/crit sparks
              - {id: h1_frame, op: frame, anchor: victim, axes: caster, mode: snapshot, at: 0, for: 6}
              - {id: h1_feather, op: display, kind: sprite, sprite: couture-s2-feather, anchor: h1_frame, at: 0, for: 6, times: 4, offset: {up: 1.2}, rotate: [[{axis: forward, deg: 0}], [{axis: forward, deg: 45}], [{axis: forward, deg: 90}], [{axis: forward, deg: 135}]], size: [0.6528, 0.1024], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 1, scale: [8.66667, 13, 1], alpha: 0.7, ease: out_expo}, {t: 6, scale: [11.21569, 0.5, 1], alpha: 0, ease: in_quad}]}]}
              - {id: h1_orange, op: particle_def, def: couture-s2-p-orange, anchor: h1_frame, every: 1, times: 3, detach: true}
              - {id: h1_spark, op: particle_def, def: couture-s2-p-spark, anchor: h1_frame, every: 3, times: 2, detach: true}
              - {id: h1_crit, op: particle_def, def: couture-s2-p-crit, anchor: h1_frame, detach: true}
        # max_count: 1 = the nearest 1 target (hit cap; founder 10/28 ruling, TablePlayer.kt:933-935 sorts nearest-first then takes N).
        - {id: snd_5, op: sound, sound: entity.player.attack.sweep, anchor: caster, at: 0, volume: 0.5, pitch: 0.6}
        - {id: snd_6, op: sound, sound: item.armor.equip_chain, anchor: caster, at: 0, volume: 0.6, pitch: 1.4}
        - {id: snd_7, op: sound, sound: block.amethyst_block.resonate, anchor: caster, at: 3, volume: 0.5, pitch: 1.6}
        - {id: snd_8, op: sound, sound: entity.player.attack.sweep, anchor: caster, at: 9, volume: 0.9, pitch: 1.3}
        - {id: snd_9, op: sound, sound: entity.sheep.shear, anchor: caster, at: 9, volume: 1, pitch: 1}
        - {id: snd_10, op: sound, sound: block.amethyst_cluster.break, anchor: caster, at: 11, volume: 0.5, pitch: 1.5}
        - {id: snd_11, op: sound, sound: item.trident.throw, anchor: caster, at: 18, volume: 0.5, pitch: 1.2}
        - {id: snd_13, op: sound, sound: block.amethyst_block.chime, anchor: caster, at: 33, volume: 0.6, pitch: 0.7}

        # --- tick 2..: a lavender haze gathers and a white line draws in front of the caster
        - {id: pre_f, op: frame, anchor: caster, mode: snapshot, at: 2, for: 22}
        - {id: line, op: display, kind: block, block: white_concrete, anchor: pre_f, at: 2, for: 9, offset: {up: 0.8}, rotate: [{axis: left, deg: -14}], scale: [0.05, 0.05, 9], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [0.05, 0.05, 0.01]}, {t: 1, scale: [0.05, 0.05, 9], ease: out_expo}, {t: 9, scale: [0, 0, 9], ease: in_quad}]}]}
        - {id: haze, op: display, kind: sprite, sprite: couture-s2-haze-soft, color: "#8A5CFF", anchor: pre_f, at: 3, for: 8, offset: {up: 0.9, forward: -0.1}, size: [2.56, 2.56], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 4, scale: [1.5, 1.5, 1], alpha: 0.3}, {t: 8, scale: [2, 2, 1], alpha: 0}]}]}

        # --- tick 7..17: coin1 cut. Five streaks fly out along the arc, a crescent core flashes, white/orange sparks and 30 petal sparks scatter
        - {id: c1_f, op: frame, anchor: caster, mode: snapshot, at: 7, for: 11}
        - id: streak
          op: display
          kind: sprite
          sprite: couture-s2-streak
          anchor: c1_f
          at: 7
          for: 6
          times: 5
          offset: [{up: 0.9, forward: 0.8}, {up: 1.3, forward: 1.4}, {up: 1.7, forward: 0.6}, {up: 2.1, forward: 1.2}, {up: 2.5, forward: 0.9}]
          rotate: [[{axis: forward, deg: 6}], [{axis: forward, deg: -4}], [{axis: forward, deg: 10}], [{axis: forward, deg: -8}], [{axis: forward, deg: 3}]]
          size: [1.28, 1.28]
          billboard: center
          motion:
            - {law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 1, scale: [2.5, 1, 1], alpha: 1, ease: out_expo}, {t: 5, scale: [1.5, 0.6, 1], alpha: 0, ease: in_quad}]}
            - {law: move, velocity: {forward: 1.3}, at: 0, for: 5}
        - {id: core, op: display, kind: sprite, sprite: couture-s2-crescent-core, anchor: c1_f, at: 7, for: 8, offset: {up: 1, forward: -0.2}, size: [3.2, 2.56], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [0.6, 0.6, 1], alpha: 0}, {t: 1, scale: [1, 1, 1], alpha: 1, ease: out_expo}, {t: 8, scale: [1.3, 1.3, 1], alpha: 0, ease: in_quad}]}]}
        - {id: white_spark, op: particle_def, def: couture-s2-p-white, anchor: c1_f, at: 7, every: 1, times: 7}
        - {id: orange_spark, op: particle_def, def: couture-s2-p-orange, anchor: c1_f, at: 7, every: 1, times: 6}
        # 30 petal sparks over ticks 8-12 (6 per tick), spread on a golden-angle fan in front of the caster
        - id: petal
          op: display
          kind: sprite
          sprite: couture-s2-petal-spark
          anchor: c1_f
          at: "= 8 + floor(i / 6)"
          for: 6
          times: 30
          offset: {left: "= 0.9 * sin(rad(137.5 * i))", up: "= 1.3 + 0.7 * cos(rad(77 * i))", forward: "= 0.6 + 0.04 * i"}
          rotate: [{axis: forward, deg: 40}]
          size: [0.22, 0.22]
          billboard: center
          motion:
            - {law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 2, scale: [1, 1, 1], alpha: 1}, {t: 6, scale: [0.4, 0.4, 1], alpha: 0, ease: in_quad}]}
            - {law: move, velocity: {forward: 0.4}, at: 0, for: 4}
        - {id: wisp_f, op: frame, anchor: caster, mode: snapshot, at: 15, for: 6}
        - {id: wisp, op: display, kind: sprite, sprite: couture-s2-crescent-core, anchor: wisp_f, at: 15, for: 6, offset: {up: 1.3, forward: -1.6}, size: [0.512, 3.2], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 1, scale: [1, 1, 1], alpha: 0.8, ease: out_expo}, {t: 6, scale: [1.4, 0.6, 1], alpha: 0, ease: in_quad}]}]}

        # --- tick 22..32: overhead slash loops spin about the caster's forward axis, one family each way, shrinking away
        - {id: over_f, op: frame, anchor: caster, mode: follow, at: 22, for: 10}
        - id: over_a
          op: display
          kind: sprite
          sprite: couture-s2-overhead-slash
          anchor: over_f
          at: 22
          for: 10
          times: 3
          offset: [{up: 2.6}, {up: 2.4}, {up: 2.5}]
          size: [1.65, 1.65]
          billboard: fixed
          motion:
            - {law: spin, axis: forward, deg_per_tick: -60, at: 0, for: 10}
            - {law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 2, scale: [1, 1, 1], alpha: 0.9}, {t: 10, scale: [0.4, 0.4, 1], alpha: 0, ease: in_quad}]}
        - id: over_b
          op: display
          kind: sprite
          sprite: couture-s2-overhead-slash
          anchor: over_f
          at: 22
          for: 10
          times: 3
          offset: [{up: 2.6}, {up: 2.4}, {up: 2.5}]
          size: [1.65, 1.65]
          billboard: fixed
          motion:
            - {law: spin, axis: forward, deg_per_tick: 60, at: 0, for: 10}
            - {law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 2, scale: [1, 1, 1], alpha: 0.9}, {t: 10, scale: [0.4, 0.4, 1], alpha: 0, ease: in_quad}]}
    throw:
      # release: volley placed at the shears, pieces reparented, fly tip-first at throw_speed, gravity 0, drag 0, max_ticks = ceil(range / speed) + 2
      for: 7   # = ceil(throw_range / throw_speed) + 2 = ceil(7 / 1.7) + 2 = 5 + 2 = 7 with the current params (C5: for is a compile-time tick count)
      then: reel
      enter:
        # flying pieces (R34): displays on the volley, spin inherited from the projectile body `motion`, kept through stuck and reel until the reel ends.
        - {id: fly_body, op: frame, anchor: /windup/volley, part: body, until: reel.end}
        - {id: fly_body_m, op: display, kind: item, item: "astera:couture-s2-body", anchor: fly_body, until: reel.end}
        - {id: fly_a, op: frame, anchor: /windup/volley, offset: {left: "= lane * fly_a.length"}, turn: [{axis: edge, deg: 35}], part: blade_a, until: reel.end}
        - {id: fly_a_m, op: display, kind: item, item: "astera:couture-rapier-blade-a", anchor: fly_a, until: reel.end}
        - {id: fly_b, op: frame, anchor: /windup/volley, offset: {left: "= -lane * fly_b.length"}, turn: [{axis: edge, deg: -35}], part: blade_b, until: reel.end}
        - {id: fly_b_m, op: display, kind: item, item: "astera:couture-rapier-blade-b", anchor: fly_b, until: reel.end}
        - {id: throw_snd, op: sound, sound: couture.throw, anchor: shears, pitch: 1.1}
        # dust: vanilla directed form (R34); speed 0 so the velocity is only inherit_velocity 0.5 x the volley velocity.
        - {id: puff, op: particle, particle: dust, anchor: palm, times: 6, count: 0, offset: "= velocity(volley) * 0.5", extra: 1.0, color: "= thread_color", size: 1.0}
        # thread lines palm -> blade_a.root / blade_b.root / body.pivot (R34: live ribbons).
        - {id: palm_f, op: frame, anchor: palm, until: reel.end}   # ribbon ends resolve frame-op ids only (RibbonOpSpec.anchorOf), not document anchors
        # the reel ends on arrival (a runtime distance), so the threads have no static length: until: reel.end ends them the tick the reel lands.
        - {id: thread_a, op: ribbon, from: palm_f, to: fly_a.root, thickness: "= thread_thick", color: "= thread_color", until: reel.end}
        - {id: thread_b, op: ribbon, from: palm_f, to: fly_b.root, thickness: "= thread_thick", color: "= thread_color", until: reel.end}
        - {id: thread_body, op: ribbon, from: palm_f, to: fly_body.pivot, thickness: "= thread_thick", color: "= thread_color", until: reel.end}
        # plate flight_fan: slash_fan (= couture-s2-crescent) in the plane [axis, up] of the volley, alpha 0.5, removed on hit/block (the throw state ends then). Size 6.4 (x0.15625 flight_fan factor = 1.0 rendered; keeps pre-PoseCompose-fix look). ASSUMPTION: a fixed sprite faces +forward, so up 90 lays its x axis along the flight axis.
        - {id: flight_fan, op: display, kind: sprite, sprite: couture-s2-crescent, size: [6.4, 6.4], color: "#80ffffff", anchor: /windup/volley, billboard: fixed, rotate: [{axis: up, deg: 90}], for: 7}
        # tip-glint (couture-s2-*-flight): couture-s2-p-tip every tick, ticks 3..10, per piece, at the vfx-local lane point: x = left, y = up, z = forward, so offsets are copied unchanged.
      on:
        - {event: volley.hit, to: stuck}
        - {event: volley.block, to: stuck}
    stuck:
      for: "= stick_ticks"
      then: reel
      do:
        # stick-spark / stick-pink (couture-s2-*-stuck): ticks 0..2 per piece at the vfx-local point (x lane, y 1.48, z 0.05). same axis mapping as tip-glint; the anchor is the volley, not the hit point.
        - {id: stick_a_stick, op: particle_def, def: couture-s2-p-stick, anchor: {of: /windup/volley, offset: {left: -0.6, up: 1.48, forward: 0.05}}, at: 0, every: 1, times: 3}
        - {id: stick_a_stick_pink, op: particle_def, def: couture-s2-p-stick-pink, anchor: {of: /windup/volley, offset: {left: -0.6, up: 1.48, forward: 0.05}}, at: 0, every: 1, times: 3}
        - {id: stick_b_stick, op: particle_def, def: couture-s2-p-stick, anchor: {of: /windup/volley, offset: {left: 0.6, up: 1.48, forward: 0.05}}, at: 0, every: 1, times: 3}
        - {id: stick_b_stick_pink, op: particle_def, def: couture-s2-p-stick-pink, anchor: {of: /windup/volley, offset: {left: 0.6, up: 1.48, forward: 0.05}}, at: 0, every: 1, times: 3}
        - {id: stick_body_stick, op: particle_def, def: couture-s2-p-stick, anchor: {of: /windup/volley, offset: {left: 0.0, up: 1.48, forward: 0.05}}, at: 0, every: 1, times: 3}
        - {id: stick_body_stick_pink, op: particle_def, def: couture-s2-p-stick-pink, anchor: {of: /windup/volley, offset: {left: 0.0, up: 1.48, forward: 0.05}}, at: 0, every: 1, times: 3}
        # --- hit2 burst at the contact point, ticks 2..: pink plumes/stars/shards/flares swell and collapse, embers and sparks, then a shadow spike ring on the ground
        - {id: hit2_f, op: frame, anchor: contact, mode: snapshot, at: 2, for: 25}
        - {id: burst_soft, op: display, kind: sprite, sprite: couture-s2-burst-soft, color: "#FFB8D8", anchor: hit2_f, at: 2, for: 6, offset: {left: 0.1, up: 1.3}, rotate: [{axis: forward, deg: 170}], size: [0.45568, 0.5472], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 1, scale: [2.0014, 1.66667, 1], ease: out_expo}, {t: 3, scale: [2.20225, 1.50058, 1]}, {t: 5, scale: [0.80056, 0.16725, 1], ease: in_quad}]}]}
        - id: burst_plume
          op: display
          kind: sprite
          sprite: couture-s2-burst-plume
          color: "#FFB8D8"
          anchor: hit2_f
          at: 2
          for: 6
          times: 5
          offset: {left: "= 0.25 * sin(rad(72 * i))", up: "= 1.3 + 0.2 * cos(rad(72 * i))"}
          rotate: [[{axis: forward, deg: 168}], [{axis: forward, deg: 100}], [{axis: forward, deg: 30}], [{axis: forward, deg: -40}], [{axis: forward, deg: -110}]]
          size: [1.2352, 1.0112]
          billboard: center
          motion:
            - {law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 1, scale: [1.81865, 1.77722, 1], ease: out_expo}, {t: 2, scale: [2.00052, 1.55506, 1]}, {t: 4, scale: [0.5456, 0.06709, 1], ease: in_quad}]}
        - id: burst_star
          op: display
          kind: sprite
          sprite: couture-s2-burst-star
          color: "#FFB8D8"
          anchor: hit2_f
          at: 2
          for: 6
          times: 2
          offset: [{left: -0.2, up: 1.5}, {left: 0.25, up: 1.1}]
          rotate: [[{axis: forward, deg: 0}], [{axis: forward, deg: 6}]]
          size: [0.1728, 0.1728]
          billboard: center
          motion:
            - {law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 1, scale: [1.66667, 1.66667, 1], ease: out_expo}, {t: 3, scale: [1.75185, 1.75185, 1]}, {t: 5, scale: [0.24815, 0.24815, 1], ease: in_quad}]}
        - id: burst_shard
          op: display
          kind: sprite
          sprite: couture-s2-burst-shard
          color: "#FFB8D8"
          anchor: hit2_f
          at: 2
          for: 5
          times: 8
          offset: {left: "= 0.45 * sin(rad(45 * i))", up: "= 1.3 + 0.45 * cos(rad(45 * i))"}
          rotate: [[{axis: forward, deg: 170}], [{axis: forward, deg: 125}], [{axis: forward, deg: 80}], [{axis: forward, deg: 35}], [{axis: forward, deg: -10}], [{axis: forward, deg: -55}], [{axis: forward, deg: -100}], [{axis: forward, deg: -145}]]
          size: [0.2016, 0.28224]
          billboard: center
          motion:
            - {law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 1, scale: [2, 1.28571, 1], ease: out_expo}, {t: 4, scale: [0.4, 0.14286, 1], ease: in_quad}]}
        - {id: burst_core, op: display, kind: sprite, sprite: couture-s2-haze-soft, color: "#FFB8D8", anchor: hit2_f, at: 2, for: 6, offset: {up: 1.3}, size: [0.2304, 0.2304], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 1, scale: [1.83333, 1.83333, 1], ease: out_expo}, {t: 3, scale: [2, 2, 1]}, {t: 5, scale: [0.4, 0.4, 1], ease: in_quad}]}]}
        - id: burst_flare
          op: display
          kind: sprite
          sprite: couture-s2-burst-flare
          color: "#FFB8D8"
          anchor: hit2_f
          at: 3
          for: 5
          times: 2
          offset: [{left: -0.15, up: 1.4}, {left: 0.15, up: 1.2}]
          rotate: [[{axis: forward, deg: 0}], [{axis: forward, deg: 8}]]
          size: [0.31872, 0.31872]
          billboard: center
          motion:
            - {law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 1, scale: [2.28916, 2.28916, 1], ease: out_expo}, {t: 2, scale: [2.1747, 2.1747, 1]}, {t: 4, scale: [0.6004, 0.6004, 1], ease: in_quad}]}
        - {id: burst_ember, op: particle_def, def: couture-s2-burst-ember, anchor: hit2_f, at: 2, every: 1, times: 9}
        - {id: hit2_orange, op: particle_def, def: couture-s2-p-orange, anchor: hit2_f, at: 2, every: 1, times: 3}
        - {id: hit2_spark, op: particle_def, def: couture-s2-p-spark, anchor: hit2_f, at: 2, every: 3, times: 2}
        - {id: shadow, op: display, kind: sprite, sprite: couture-s2-shadow-spikes, anchor: hit2_f, at: 8, for: 19, offset: {up: 0.02}, rotate: [{axis: up, deg: -90}], size: [0.096, 0.096], billboard: fixed, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 2, scale: [32, 11, 1], ease: out_expo}, {t: 17, scale: [32.93333, 11.33333, 1]}, {t: 19, scale: [29.46667, 1.13333, 1], ease: in_quad}]}]}
    reel:
      # reel: volley flies back to the palm at reel_speed 0.45 with ease_in; reel_hit capsule (radius 0.2) 6 dmg once; ends on arrive (runtime distance)
      for: 16
      then: coin3
      do:
        - {id: reel, op: reel, anchor: /windup/volley, to: /throw/palm_f, speed: "= reel_speed", ease: in}
        # ignore_invulnerability: false is the vanilla default (reel_hit had no flag).
        - {id: reel_hit, op: hit, anchor: /throw/fly_a, targets: enemies, shape: {capsule: 0.2, from: root, to: tip}, window: once, ignore_invulnerability: false, damage: {physical: "= dmg_reel"}, on: {hit: [{id: pull, op: impulse, target: event.victim, vector: "= normalize(pos(palm) - pos(event.victim)) * 0.25"}, {id: reel_sparks, op: particle, particle: crit, anchor: contact, count: 6}, {id: slash_snd, op: sound, sound: couture.slash_light, anchor: contact}]}}
        - {id: reel_snd, op: sound, sound: couture.reel, anchor: /windup/volley, every: 3, for: 16, volume: 1.0, pitch: "= 1.0 + 0.4 * (1 - dist(volley, palm) / throw_range)"}
        - {id: catch_snd, op: sound, sound: couture.catch, anchor: shears, at: 15}
      on:
        - {event: reel.end, to: coin3}
    coin3:
      # starts on the coin3_start event (caster_anim body-b at +0, dash at +9, 3 ticks, radius 0.8, hit_once, stop_before_target 1.0)
      for: 37
      then: end
      enter:
        - {id: dash, op: dash, at: 9, speed: "= c3_dash_distance / 3", for: 3, until: c3_hit.hit, direction: {forward: 1.0}, follow_pitch: false, stop_on_block: true, invulnerable: false, face_movement: false}
        # dash_strike radius 0.8 + stop_before_target 1.0: the corridor sphere reaches 0.8 + 1.0 and its first victim ends the dash (R9).
        - id: c3_hit
          op: hit
          at: 9
          every: 1
          for: 3
          anchor: body_c
          targets: enemies
          shape: {sphere: 0.8}   # dash_strike radius 0.8, hit_once: true (9d4c4a3db content/skills/couture-rapier-s2/coin3.yaml:20-21); window: once = hit_once
          window: once
          damage: {physical: = dmg_coin3}
          ignore_invulnerability: true
          on:
            hit:
              # hit3: pink sparks, three feather flashes (0/60/120 deg), an X cut, falling petals and shard debris around the dash end point
              - {id: h3_frame, op: frame, anchor: caster, offset: {up: 0.9, forward: 1.3}, mode: snapshot, at: 0, for: 25}
              - {id: h3_pink, op: particle_def, def: couture-s2-p-pink, anchor: h3_frame, every: 1, times: 4, detach: true}
              - {id: h3_spark, op: particle_def, def: couture-s2-p-spark, anchor: h3_frame, every: 3, times: 2, detach: true}
              - {id: h3_feather, op: display, kind: sprite, sprite: couture-s2-feather, anchor: h3_frame, at: 0, for: 5, times: 3, offset: {up: 1.2}, rotate: [[{axis: forward, deg: 0}], [{axis: forward, deg: 60}], [{axis: forward, deg: 120}]], size: [0.816, 0.128], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 1, scale: [8, 12, 1], alpha: 0.8, ease: out_expo}, {t: 5, scale: [10, 0.5, 1], alpha: 0, ease: in_quad}]}]}
              - {id: h3_cut, op: display, kind: text, text: " ", background: "#FFFFFF", anchor: h3_frame, at: 1, for: 6, times: 2, offset: {up: 1.2}, rotate: [[{axis: forward, deg: 48}], [{axis: forward, deg: -48}]], scale: [0.06, 6, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, alpha: 0.9, scale: [0.06, 0.2, 1]}, {t: 1, alpha: 0.9, scale: [0.06, 6, 1], ease: out_expo}, {t: 6, alpha: 0, scale: [0, 6, 1], ease: in_quad}]}]}
              - id: h3_petal
                op: display
                kind: sprite
                sprite: couture-s2-petal
                anchor: h3_frame
                at: 1
                for: 9
                times: 8
                offset: {left: "= 0.55 * sin(rad(45 * i))", up: "= 1.15 + 0.3 * cos(rad(45 * i))"}
                rotate: [[{axis: forward, deg: -178}], [{axis: forward, deg: -157}], [{axis: forward, deg: -130}], [{axis: forward, deg: -100}], [{axis: forward, deg: -70}], [{axis: forward, deg: -40}], [{axis: forward, deg: -10}], [{axis: forward, deg: 20}]]
                size: [0.16, 0.096]
                billboard: center
                motion:
                  - {law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 1, scale: [1, 1, 1], alpha: 1}, {t: 9, scale: [0.5, 0.5, 1], alpha: 0, ease: in_quad}]}
                  - {law: move, velocity: {up: -0.05}, at: 0, for: 9}
              - id: h3_debris
                op: display
                kind: sprite
                sprite: couture-s2-burst-shard
                anchor: h3_frame
                at: 6
                for: 19
                times: 4
                offset: [{left: 1.14, up: 0.88}, {left: 0.75, up: 1.45}, {left: 0.11, up: 1.13}, {left: -0.78, up: 1.68}]
                rotate: [[{axis: forward, deg: 3.6}], [{axis: forward, deg: 44.1}], [{axis: forward, deg: 84.9}], [{axis: forward, deg: 139.6}]]
                size: [0.768, 1.792]
                billboard: center
                motion:
                  - {law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 2, scale: [1, 1, 1], alpha: 1}, {t: 19, scale: [0.3, 0.3, 1], alpha: 0, ease: in_quad}]}
                  - {law: move, velocity: {up: -0.03}, at: 0, for: 19}
              - {id: c3_snd_0, op: sound, sound: entity.player.attack.sweep, anchor: victim, volume: 1, pitch: 0.55, detach: true}
              - {id: c3_snd_1, op: sound, sound: entity.sheep.shear, anchor: victim, volume: 1, pitch: 0.7, detach: true}
              - {id: c3_snd_2, op: sound, sound: item.trident.riptide_1, anchor: victim, volume: 0.8, pitch: 1.5, detach: true}
              - {id: c3_snd_3, op: sound, sound: entity.player.attack.crit, anchor: victim, volume: 1, pitch: 0.6, detach: true}
              - {id: c3_snd_4, op: sound, sound: block.anvil.land, anchor: victim, volume: 0.5, pitch: 1.4, detach: true}
      do:
        - {id: canim_2, op: body, target: caster, anim: couture-s2-body-b, speed: 1.0, at: 0, for: 35}
        - {id: snd_15, op: sound, sound: block.amethyst_block.resonate, anchor: caster, at: 3, volume: 0.6, pitch: 0.6}
        - {id: snd_16, op: sound, sound: item.armor.equip_iron, anchor: caster, at: 7, volume: 0.5, pitch: 0.8}
        - {id: snd_17, op: sound, sound: entity.player.attack.sweep, anchor: caster, at: 10, volume: 0.7, pitch: 0.5}
        - {id: snd_18, op: sound, sound: block.amethyst_cluster.break, anchor: caster, at: 17, volume: 0.5, pitch: 1}
        # --- dash visuals: nine smear streaks (three per tick, ticks 9/10/11) race ahead of the caster, pink sparks, a pink crescent trails behind
        - {id: dash_f, op: frame, anchor: caster, mode: snapshot, at: 9, for: 26}
        - id: smear_a
          op: display
          kind: sprite
          sprite: couture-s2-smear
          anchor: dash_f
          at: 9
          for: 3
          times: 3
          offset: [{up: 0.1, forward: -1.5}, {up: 1.3, forward: -1.5}, {up: 2.1, forward: -1.5}]
          rotate: [{axis: forward, deg: 2}]
          size: [76.8, 0.5504]
          billboard: center
          motion:
            - {law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 1, scale: [2.5, 5, 1], ease: out_expo}, {t: 3, scale: [2.5, 0.2, 1], ease: in_quad}]}
            - {law: move, velocity: {forward: 4.2}, at: 0, for: 3}
        - id: smear_b
          op: display
          kind: sprite
          sprite: couture-s2-smear
          anchor: dash_f
          at: 10
          for: 3
          times: 3
          offset: [{up: 0.5, forward: -1.5}, {up: 0.9, forward: -1.5}, {up: 1.7, forward: -1.5}]
          rotate: [{axis: forward, deg: 2}]
          size: [76.8, 0.5504]
          billboard: center
          motion:
            - {law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 1, scale: [2.5, 5, 1], ease: out_expo}, {t: 3, scale: [2.5, 0.2, 1], ease: in_quad}]}
            - {law: move, velocity: {forward: 4.2}, at: 0, for: 3}
        - id: smear_c
          op: display
          kind: sprite
          sprite: couture-s2-smear
          anchor: dash_f
          at: 11
          for: 3
          times: 3
          offset: [{up: 0.3, forward: -1.5}, {up: 1.1, forward: -1.5}, {up: 1.9, forward: -1.5}]
          rotate: [{axis: forward, deg: 2}]
          size: [76.8, 0.5504]
          billboard: center
          motion:
            - {law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 1, scale: [2.5, 5, 1], ease: out_expo}, {t: 3, scale: [2.5, 0.2, 1], ease: in_quad}]}
            - {law: move, velocity: {forward: 4.2}, at: 0, for: 3}
        - {id: dash_pink, op: particle_def, def: couture-s2-p-pink, anchor: dash_f, at: 11, every: 1, times: 4}
        - {id: pink_crescent, op: display, kind: sprite, sprite: couture-orbit, color: "#FFC8DC", anchor: dash_f, at: 15, for: 20, offset: {up: 1.1, forward: -1.6}, rotate: [{axis: left, deg: 90}], size: [5.76, 5.76], billboard: fixed, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 18, scale: [1.11111, 1.11111, 1], ease: out_quad}]}, {law: move, velocity: {forward: -0.033}, at: 0, for: 18}]}
    end: {final: true}
