# Couturier's Shears S2, coin 2 (shears throw), gameplay half. Presentation lives in look.yaml (same Skill, split across files).
# No absolute coordinates: frame-relative offsets, point refs, params and CEL ("= ...") only.
# Points (grip/pivot/root/tip) and axes (long/edge) come from content/frames/couture-rapier.yaml (parts held, body, blade_a, blade_b).
apiVersion: astera/v2
kind: Skill
id: couture-rapier-s2
item: couture-rapier
importance: 8

frames:
  - {id: shears,  kind: item, parent: caster.right_hand, model: couture-rapier, part: held}
  - {id: body,    kind: part, parent: shears, model: couture-rapier, part: body}
  - {id: blade_a, kind: part, parent: shears, model: couture-rapier, part: blade_a}
  - {id: blade_b, kind: part, parent: shears, model: couture-rapier, part: blade_b}
  - {id: volley,  kind: body, parent: world, inactive: true}
  - {id: palm,    kind: point, parent: caster.right_hand, offset: [0, 0, 0]}

gameplay:
  params: {throw_speed: 1.7, throw_range: 7.0, spin_dpt: 54, open_deg: 70, lane: 0.35,
           stick_ticks: 10, reel_speed: 2.2, dmg_throw: 18, dmg_reel: 6, bleed_stacks: 2, bleed_ticks: 60}
  expose:
    - {id: range, param: throw_range, min: 2.0, max: 12.0}
    - {id: flight_speed, param: throw_speed, min: 0.8, max: 3.0}
    - {id: damage, param: dmg_throw}
  timeline:
    - id: raise
      at: 0
      do:
        # shears overhead: long axis up, blade faces toward the throw direction
        - {id: raise_pose, op: pose, frame: shears,
           keys: [{t: 0}, {t: 6, align: {axis: shears.axis, to: world.up, up: caster.forward}, ease: ease_out}]}
    - id: spin_up
      at: 4
      do:
        # spin about the horizontal axis perpendicular to the throw: the ring lies in the vertical plane through the throw direction
        - {id: spin_shears, op: spin, frame: shears, axis: caster.left, deg_per_tick: "${spin_dpt}", until: release}
        - {id: open_a, op: pose, frame: blade_a, keys: [{t: 0}, {t: 4, rotate: {axis: blade_a.edge, deg: "= open_deg / 2.0"}}]}
        - {id: open_b, op: pose, frame: blade_b, keys: [{t: 0}, {t: 4, rotate: {axis: blade_b.edge, deg: "= -open_deg / 2.0"}}]}
    - id: let_go
      at: 8
      do:
        - {id: raise_release, op: event, name: release}
  on:
    release:
      # volley must sit at the shears BEFORE the pieces move under it
      - {id: place_volley, op: place, frame: volley, like: shears}
      - {id: take_off, op: reparent, frames: [body, blade_a, blade_b], to: volley, keep_world: true}
      # tip-first: the volley's forward axis follows the velocity
      - {id: fly, op: fly, frame: volley, velocity: "= normalize(aim_point(caster, throw_range) - pos(volley)) * throw_speed",
         gravity: 0.0, drag: 0.0, align: {axis: velocity, up: world.up}, max_ticks: "= ceil(throw_range / throw_speed) + 2"}
      - {id: spin_volley, op: spin, frame: volley, axis: volley.left, deg_per_tick: "${spin_dpt}"}
      - {id: lane_a, op: pose, frame: blade_a, keys: [{t: 0, offset: "= left(volley) * blade_len(blade_a) * lane"}]}
      - {id: lane_b, op: pose, frame: blade_b, keys: [{t: 0, offset: "= left(volley) * blade_len(blade_b) * -lane"}]}
      - {id: throw_hit, op: hit, frames: [blade_a, blade_b], capsule: {from: self.root, to: self.tip, radius: 0.22}, window: once}
    hit:
      - {id: dmg, op: damage, when: &on_throw "= event.source == 'throw_hit'", target: victim,
         components: [{kind: physical, amount: "${dmg_throw}"}]}
      - {id: bleed, op: status, when: *on_throw, target: victim, status: bleed, stacks: "${bleed_stacks}", duration_ticks: "${bleed_ticks}"}
      - {id: stab, op: reparent, when: *on_throw, frames: [volley], to: contact, snap: {point: blade_a.tip, depth: 0.25}}
      - {id: stuck, op: stick, when: *on_throw, frame: volley, parent: contact}
      - {id: push, op: impulse, when: *on_throw, target: victim, vector: "= -contact.normal * 0.35 + world.up * 0.12"}
      - {id: stop, op: freeze, when: *on_throw, ticks: 2, scope: [volley, caster]}
      - {id: reel_later, op: schedule, when: *on_throw, after: "${stick_ticks}", event: reel}
      - {id: reel_dmg, op: damage, when: &on_reel "= event.source == 'reel_hit'", target: victim,
         components: [{kind: physical, amount: "${dmg_reel}"}]}
      - {id: pull, op: impulse, when: *on_reel, target: victim, vector: "= normalize(pos(palm) - pos(victim)) * 0.25"}
    block:
      - {id: stab_wall, op: reparent, frames: [volley], to: contact, snap: {point: blade_a.tip, depth: 0.3}}
      - {id: reel_later_w, op: schedule, after: "${stick_ticks}", event: reel}
    expire:
      - {id: reel_soon, op: schedule, after: 2, event: reel}
    reel:
      - {id: unstick, op: reparent, frames: [volley], to: world, keep_world: true}
      - {id: reel, op: reel, frame: volley, to: palm, speed: "${reel_speed}", ease: ease_in, align: {axis: "= -vel(volley)", up: world.up}}
      - {id: reel_hit, op: hit, frames: [blade_a, blade_b], capsule: {from: self.root, to: self.tip, radius: 0.2}, window: once}
    arrive:
      - {id: rejoin, op: reparent, frames: [body, blade_a, blade_b], to: shears, snap: {point: self.pivot}}
      - {id: close_a, op: pose, frame: blade_a, keys: [{t: 0}, {t: 2, rotate: {axis: blade_a.edge, deg: 0}}]}
      - {id: close_b, op: pose, frame: blade_b, keys: [{t: 0}, {t: 2, rotate: {axis: blade_b.edge, deg: 0}}]}
      - {id: next, op: event, name: coin3_start}
