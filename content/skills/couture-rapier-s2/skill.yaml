                  - id: fx4_couture_s2_hit1_star_0
                    op: display
                    kind: sprite
                    sprite: couture-s2-feather
                    anchor: fx4_couture_s2_hit1
                    offset: {left: 0, up: 1.2, forward: 0}
                    size: [0.6528, 0.1024]
                    billboard: center
                    for: 6
                    motion:
                      - {law: grow, per_tick: {left: 5.0048, up: 1.2288, forward: 0}, at: 0, for: 1}
                      - {law: grow, per_tick: {left: 0.3328, up: -0.256, forward: 0}, at: 1, for: 5}
                  - id: fx4_couture_s2_hit1_star_1
