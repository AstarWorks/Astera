        # GAP(Q4): trigger-only hit (damage omitted, R24); the 30 lands in the c1_hit.hit handler.
        # GAP(Q6): v2 delay 1 between hit and damage is the handler row `at: 1` (option A); option B would be `damage_delay: 1` on the hit.
