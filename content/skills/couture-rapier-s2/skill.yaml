    throw:
      # v2 release: volley placed at the shears, pieces reparented, fly tip-first at throw_speed, gravity 0, drag 0, max_ticks = ceil(range / speed) + 2
      for: "= ceil(throw_range / throw_speed) + 2"
      then: reel
      enter:
        - id: volley
          op: projectile
          origin: shears
          velocity: "= normalize(aim_point(caster, throw_range) - pos(shears))"
          speed: "= throw_speed"
          range: "= throw_range"
          radius: 0.22
          hit: {targets: enemies, once: true}
          block: {mode: stick, for: "= stick_ticks"}
          # GAP: v2 hit shape is a capsule root->tip of both blades (radius 0.22), window once -> projectile capsule radius 0.22 (axis follows velocity)
          # GAP: v2 lane_a/lane_b blade offsets +-left * blade_len * lane -> none (blade_len is a frame-table value)
          # GAP: v2 align velocity axis with world.up reference -> default
          motion:
            - {law: spin, axis: left, deg_per_tick: 54, at: 0, for: 7}   # ENGINE: projectile motion lowers without params; 54 = spin_dpt, 7 = ceil(throw_range / throw_speed) + 2
          on:
            hit:
              - {id: throw_dmg, op: damage, at: 0, target: event.victim, damage: {physical: "= dmg_throw"}}
              - {id: bleed, op: status, at: 0, target: event.victim, status: bleed, stacks: "= bleed_stacks", for: "= bleed_ticks"}
              - {id: push, op: impulse, at: 0, target: event.victim, vector: "= -contact.normal * 0.35 + vec(0, 0.12, 0)"}
              - {id: hitstop, op: freeze, at: 0, ticks: 2, scope: [caster, volley]}
              - {id: stab_snd, op: sound, sound: couture.stab, anchor: contact, pitch: "= 1.2 - 0.2 * clamp(length(velocity(volley) - velocity(event.victim)) / 2.0, 0.0, 1.0)"}
              # GAP: v2 victim_anim stagger_back (strength = clamp(|rel_velocity| / 2, 0.3, 1.0)) has no victim body op (R41 covers the caster only)
              - {id: sparks, op: particle, particle: "= spark_particle", anchor: contact, count: "= spark_count", offset: 0.4, extra: 0.4}
            block:
              - {id: crumb, op: particle_def, def: couture-s2-p-crumb, anchor: contact}
              - {id: wall_snd, op: sound, sound: couture.stab_wall, anchor: contact}
        # v2 flying pieces (R34): displays on the volley, spin inherited from the projectile body `motion`, kept through stuck and reel until the reel ends.
        - {id: fly_body, op: frame, anchor: volley, part: body, until: reel.end}
        - {id: fly_body_m, op: display, kind: item, item: "astera:couture-s2-body", anchor: fly_body, until: reel.end}
        - {id: fly_a, op: frame, anchor: volley, part: blade_a, until: reel.end, motion: [{law: keys, keys: [{t: 0, pose: [{axis: edge, deg: 35}]}]}]}
        - {id: fly_a_m, op: display, kind: item, item: "astera:couture-rapier-blade-a", anchor: fly_a, until: reel.end}
        - {id: fly_b, op: frame, anchor: volley, part: blade_b, until: reel.end, motion: [{law: keys, keys: [{t: 0, pose: [{axis: edge, deg: -35}]}]}]}
        - {id: fly_b_m, op: display, kind: item, item: "astera:couture-rapier-blade-b", anchor: fly_b, until: reel.end}
        - {id: throw_snd, op: sound, sound: couture.throw, anchor: shears, pitch: 1.1}
        # v2 dust: vanilla directed form (R34); v2 speed 0 so the velocity is only inherit_velocity 0.5 x the volley velocity.
        - {id: puff, op: particle, particle: dust, anchor: caster.palm, times: 6, count: 0, offset: "= velocity(volley) * 0.5", extra: 1.0, color: "= thread_color", size: 1.0}
        # v2 thread lines palm -> blade_a.root / blade_b.root / body.pivot (R34: live ribbons).
        - {id: thread_a, op: ribbon, from: {of: caster, offset: palm}, to: fly_a.root, thickness: "= thread_thick", color: "#ff5fa2", until: reel.end}
        - {id: thread_b, op: ribbon, from: {of: caster, offset: palm}, to: fly_b.root, thickness: "= thread_thick", color: "#ff5fa2", until: reel.end}
        - {id: thread_body, op: ribbon, from: {of: caster, offset: palm}, to: fly_body.pivot, thickness: "= thread_thick", color: "#ff5fa2", until: reel.end}
        # v1 plate flight_fan: slash_fan (= couture-s2-crescent) in the plane [axis, up] of the volley, alpha 0.5, removed on hit/block (the throw state ends then). Size 1.9 is the v2 value. ASSUMPTION: a fixed sprite faces +forward, so up 90 lays its x axis along the flight axis.
        - {id: flight_fan, op: display, kind: sprite, sprite: couture-s2-crescent, size: [1.9, 1.9], color: "#80ffffff", anchor: volley, billboard: fixed, rotate: [{axis: up, deg: 90}], for: 7}
        # v1 tip-glint (couture-s2-*-flight): couture-s2-p-tip every tick, ticks 3..10, per piece, at the v1 vfx-local lane point. v1 VfxDefinition.kt:372 documents x = left, y = up, z = forward, so offsets are copied unchanged.
        - {id: tip_glint_a, op: particle_def, def: couture-s2-p-tip, anchor: volley, offset: {left: -0.6, up: 0.12, forward: 0.05}, at: 3, every: 1, times: 8}
        - {id: tip_glint_b, op: particle_def, def: couture-s2-p-tip, anchor: volley, offset: {left: 0.6, up: -0.1, forward: 0.95}, at: 3, every: 1, times: 8}
        - {id: tip_glint_body, op: particle_def, def: couture-s2-p-tip, anchor: volley, offset: {left: 0.0, up: 0.0, forward: 0.45}, at: 3, every: 1, times: 8}
      on:
        - {event: volley.hit, to: stuck}
        - {event: volley.block, to: stuck}
    stuck:
      for: "= stick_ticks"
      then: reel
      do:
