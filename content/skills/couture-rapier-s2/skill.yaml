                  - id: fx4_couture_s2_hit1_ps_orange_2
                    op: particle_def
                    def: couture-s2-p-orange
                    anchor: fx4_couture_s2_hit1
                    every: 1
                    times: 3
                  - id: fx4_couture_s2_hit1_ps_orange_3
                    op: particle_def
