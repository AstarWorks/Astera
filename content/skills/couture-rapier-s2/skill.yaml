    reel:
      # reel: volley flies back to the palm at reel_speed 0.45 with ease_in; reel_hit capsule (radius 0.2) 6 dmg once; ends on arrive (runtime distance)
      for: 16
      then: coin3
      do:
        - {id: reel, op: reel, anchor: /windup/volley, to: /throw/palm_f, speed: "= reel_speed", ease: in}
        # ignore_invulnerability: false is the vanilla default (reel_hit had no flag).
        - {id: reel_hit, op: hit, anchor: /throw/fly_a, targets: enemies, shape: {capsule: 0.2, from: root, to: tip}, window: once, ignore_invulnerability: false, damage: {physical: "= dmg_reel"}, on: {hit: [{id: reel_react, op: react, target: event.victim, flinch: true, for: 6}, {id: pull, op: impulse, target: event.victim, vector: "= normalize(pos(palm) - pos(event.victim)) * 0.25"}, {id: reel_sparks, op: particle, particle: crit, anchor: contact, count: 6}, {id: slash_snd, op: sound, sound: couture.slash_light, anchor: contact}]}}
        - {id: reel_snd, op: sound, sound: couture.reel, anchor: /windup/volley, every: 3, for: 16, volume: 1.0, pitch: "= 1.0 + 0.4 * (1 - dist(volley, palm) / throw_range)"}
        - {id: catch_snd, op: sound, sound: couture.catch, anchor: shears, at: 15}
      on:
        - {event: reel.end, to: coin3}
    coin3:
      # starts on the coin3_start event (caster_anim body-b at +0, dash at +9, 3 ticks, radius 0.8, hit_once, stop_before_target 1.0)
      for: 37
      then: end
      enter:
        - {id: dash, op: dash, at: 9, speed: "= c3_dash_distance / 3", for: 3, until: c3_hit.hit, direction: {forward: 1.0}, follow_pitch: false, stop_on_block: true, invulnerable: false, face_movement: false}
        # dash_strike radius 0.8 + stop_before_target 1.0: the corridor sphere reaches 0.8 + 1.0 and its first victim ends the dash (R9).
        - id: c3_hit
          op: hit
          at: 9
          every: 1
          for: 3
          anchor: body_c
          targets: enemies
          shape: {sphere: 0.8}   # dash_strike radius 0.8, hit_once: true (9d4c4a3db content/skills/couture-rapier-s2/coin3.yaml:20-21); window: once = hit_once
          window: once
          damage: {physical: = dmg_coin3}
          ignore_invulnerability: true
          on:
            hit:
              - {id: c3_react, op: react, target: event.victim, flinch: true, for: 6}
              # hit3: pink sparks, three feather flashes (0/60/120 deg), an X cut, eight falling petals and shard debris around the victim
              - {id: h3_pink, op: particle_def, def: couture-s2-p-pink, frame: blow, every: 1, times: 4, detach: true}
              - {id: h3_spark, op: particle_def, def: couture-s2-p-spark, frame: blow, every: 3, times: 2, detach: true}
              - {id: h3_feather, op: display, kind: sprite, sprite: couture-s2-feather, frame: blow, pos: {w: 1.2}, at: 0, for: 5, times: 3, rotate: [{axis: v, deg: "= 60 * i"}], size: [0.82, 0.13], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 1, scale: [8, 12, 1], alpha: 0.8, ease: out_expo}, {t: 5, scale: [10, 0.5, 1], alpha: 0, ease: in_quad}]}]}
              - {id: h3_cut, op: display, kind: text, text: " ", background: "#FFFFFF", frame: blow, pos: {w: 1.2}, at: 1, for: 6, times: 2, rotate: [{axis: v, deg: "= 48 - 96 * i"}], scale: [0.06, 6, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, alpha: 0.9, scale: [1, 0.03, 1]}, {t: 1, alpha: 0.9, scale: [1, 1, 1], ease: out_expo}, {t: 6, alpha: 0, scale: [0, 1, 1], ease: in_quad}]}]}
              - {id: h3_petal_0, op: display, kind: sprite, sprite: couture-s2-petal, frame: blow, pos: {w: 1.45}, at: 1, for: 9, rotate: [{axis: v, deg: -178}], size: [0.16, 0.1], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 1, scale: [1, 1, 1], alpha: 1}, {t: 9, scale: [0.5, 0.5, 1], alpha: 0, ease: in_quad}]}, {law: move, velocity: {w: -0.05}, at: 0, for: 9}]}
              - {id: h3_petal_1, op: display, kind: sprite, sprite: couture-s2-petal, frame: blow, pos: {w: 1.36, s: -0.39}, at: 1, for: 9, rotate: [{axis: v, deg: -157}], size: [0.16, 0.1], billboard: center, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0}, {t: 1, scale: [1, 1, 1], alpha: 1}, {t: 9, scale: [0.5, 0.5, 1], alpha: 0, ease: in_quad}]}, {law: move, velocity: {w: -0.05}, at: 0, for: 9}]}
