    reel:
      # v2 reel: volley flies back to the palm at reel_speed 0.45 with ease_in; reel_hit capsule (radius 0.2) 6 dmg once; ends on arrive (runtime distance)
      for: 16
      then: coin3
      do:
        - {id: reel, op: reel, anchor: volley, to: caster.palm, speed: "= reel_speed", ease: in}
        - {id: reel_hit, op: hit, anchor: volley, targets: enemies, shape: {capsule: 0.2, from: root, to: tip}, window: once, damage: {physical: "= dmg_reel"}}
        - {id: reel_snd, op: sound, sound: couture.reel, anchor: volley, every: 3, for: 16, volume: 1.0, pitch: "= 1.0 + 0.4 * (1 - dist(volley, caster.palm) / throw_range)"}
        - {id: catch_snd, op: sound, sound: couture.catch, anchor: shears, at: 15}
      on:
        - {event: reel.end, to: coin3}
        - {event: reel_hit.hit, do: [{id: pull, op: impulse, target: event.victim, vector: "= normalize(pos(caster.palm) - pos(event.victim)) * 0.25"}, {id: reel_sparks, op: particle, particle: "= spark_particle", anchor: contact, count: 6}, {id: slash_snd, op: sound, sound: couture.slash_light, anchor: contact}]}
    coin3:
      # v2: starts on the coin3_start event (caster_anim body-b at +0, dash at +9, 3 ticks, radius 0.8, hit_once, stop_before_target 1.0)
      for: 37
      then: end
      enter:
        - {id: dash, op: dash, at: 9, speed: "= c3_dash_distance / 3", for: 3, until: c3_hit.hit, direction: forward, follow_pitch: false, stop_on_block: true, invulnerable: false, face_movement: false}
        # v2 dash_strike radius 0.8 + stop_before_target 1.0: the corridor sphere reaches 0.8 + 1.0 and its first victim ends the dash (R9).
        - {id: c3_hit, op: hit, at: 9, every: 1, for: 3, anchor: caster, targets: enemies, shape: {sphere: {center: caster.body, radius: 1.8}}, window: once, damage: {physical: "= dmg_coin3"}, ignore_invulnerability: true}
