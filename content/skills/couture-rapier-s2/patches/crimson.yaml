# Skin variant couture-rapier-s2@crimson: crimson thread colour, flame sparks, the second blade trail dropped (R35 ops: rows addressed by id).
# Params are not presentation rows, so the colour / particle are patched on the presentation rows that read them.
# The reel_sparks row sits in an `on` event list of the reel state (not reachable by a skin path), so it keeps the base spark particle.
apiVersion: astera/v3
kind: Patch
id: couture-rapier-s2-crimson
target: couture-rapier-s2
variant: crimson
patchKind: skin
ops:
  - {path: "machine.states.windup.do[trail_b]", $patch: delete}
  - {path: "machine.states.windup.do[trail_a].color", $patch: replace, value: "#d0203a"}
  - {path: "machine.states.throw.do[puff].color", $patch: replace, value: "#d0203a"}
  - {path: "machine.states.throw.do[thread_a].color", $patch: replace, value: "#d0203a"}
  - {path: "machine.states.throw.do[thread_b].color", $patch: replace, value: "#d0203a"}
  - {path: "machine.states.throw.do[thread_body].color", $patch: replace, value: "#d0203a"}
  - {path: "machine.states.throw.enter[volley].on.hit[sparks].particle", $patch: replace, value: flame}
