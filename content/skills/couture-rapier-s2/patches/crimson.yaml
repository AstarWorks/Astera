# Skin variant couture-rapier-s2@crimson: colours and particle only, and the second blade trail is dropped.
apiVersion: astera/v3
kind: Patch
target: couture-rapier-s2
variant: crimson
patchKind: skin
params: {thread_color: "#d0203a", spark_particle: flame}
# GAP: v2 patched presentation.params and deleted the timeline item trail_b by id ($patch: delete). In v3 the ribbon trail_b lives inside the windup state's `do`
# (machine.states.windup.do[trail_b]); the Patch addressing form for state-owned ops is not specified in ADR-0303 rev4.2 -> closest: delete by id.
machine:
  states:
    windup:
      do:
        - {id: trail_b, $patch: delete}
