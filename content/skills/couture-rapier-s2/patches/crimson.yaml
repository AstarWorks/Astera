# Skin variant couture-rapier-s2@crimson: colours and particle only, and the second blade trail is dropped.
apiVersion: astera/v3
kind: Patch
id: couture-rapier-s2.crimson
target: couture-rapier-s2
variant: crimson
ops:
  - {path: params.thread_color, $patch: replace, value: "#d0203a"}
  - {path: params.spark_particle, $patch: replace, value: flame}
  - {path: "machine.states.windup.do[trail_b]", $patch: delete}
