# Skin variant couture-rapier-s2@crimson: crimson thread colour, flame sparks, the second blade trail dropped (R35 ops).
# The shared colours / particle id are params the presentation rows read ("= thread_color"), so the patch changes each once.
apiVersion: astera/v3
kind: Patch
id: couture-rapier-s2-crimson
target: couture-rapier-s2
variant: crimson
patchKind: skin
ops:
  - {path: "machine.states.windup.do[trail_b]", $patch: delete}
  - {path: "params.trail_color.default", $patch: replace, value: "#59d0203a"}
  - {path: "params.thread_color.default", $patch: replace, value: "#d0203a"}
  - {path: "params.spark_particle.default", $patch: replace, value: flame}
