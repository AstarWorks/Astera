# Hand-authored tool presentation. Mechanical shape / timing / damage / cooldown stay unchanged.
# Dust uses typical tool material; no per-cell surface data is exposed to presentation rows.
apiVersion: astera/v3
kind: Skill
id: pickaxe-bore-stone
item: stone-pickaxe
meta:
  name: {ja: "石の掘削", en: "Stone Bore"}
  description: {ja: "正面に3x3のトンネルを掘り進む。", en: "Bores a 3x3 tunnel straight ahead."}
  cooldown_ticks: 160
  resource_cost: 0
  tags: [tool, cover]
params:
  length: {type: number, default: 4}
  trail_span: {type: number, default: 6}
  chips: {type: number, default: 3}
  core_color: {type: string, default: "#777777"}
  core_size: {type: number, default: 0.3}
  bright: {type: bool, default: false}
frames:
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: w, to: 0}
      - {at: 0, for: 3, about: w, to: -90, ease: out_cubic}
      - {at: 3, for: 3, about: w, to: 0, ease: out_cubic}
      - {at: 0, for: 0, about: s, to: -30}
      - {at: 0, for: 3, about: s, to: 80, ease: out_quad}
      - {at: 3, for: 3, about: s, to: -5, ease: out_cubic}
      - {at: 6, for: 3, about: s, to: -25, ease: out_cubic}
      - {at: 9, for: 3, about: s, to: -30, ease: in_out_sine}
  - id: tool
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 3, about: s, to: 110, ease: out_quad}
      - {at: 3, for: 3, about: s, to: -30, ease: out_cubic}
      - {at: 6, for: 3, about: s, to: -55, ease: out_cubic}
      - {at: 9, for: 3, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
lines:
  edge: {frame: tool, from: {v: 0.5}, to: {v: 0.9}}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 4
      then: cast
      do:
        - {id: rig, op: rig, frame: tool, for: 12, detach: true}
        # First blade sample precedes impact; remaining samples belong to cast.
        - {id: trail, op: particle, particle: dust, along: edge, samples: 5, count: 1, color: "#999999", size: 0.35, extra: 0, at: 3}
    cast:
      for: 1
      then: end
      do:
        - {id: break, op: break_area, frame: body, shape: {line: {length: "${length}", width: 3, height: 3}}, tool: pickaxe, block_damage: 100, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, sound: block.stone.break, frame: body, volume: 1.0, pitch: 1.0}
        - {id: wave_0, op: particle, particle: block, block: minecraft:stone, anchor: {of: caster, offset: {forward: "= 1 + (0 / 2.0) * (${length} - 1)", up: 0, left: "= i - 1"}}, times: 3, count: 0, offset: {forward: 0.8, up: 0.08, left: 0.15}, extra: 0.32, at: 0}
        - {id: chips_0, op: particle, particle: block, block: minecraft:stone, frame: body, pos: {v: "= 1 + (0 / 2.0) * (${length} - 1)", w: 0, s: "= i - 1"}, times: 3, count: 6, offset: [0.12, 0.04, 0.12], extra: .14, at: 0}
        - {id: wave_1, op: particle, particle: block, block: minecraft:stone, anchor: {of: caster, offset: {forward: "= 1 + (1 / 2.0) * (${length} - 1)", up: 0, left: "= i - 1"}}, times: 3, count: 0, offset: {forward: 0.8, up: 0.08, left: 0.15}, extra: 0.32, at: 2, detach: true}
        - {id: chips_1, op: particle, particle: block, block: minecraft:deepslate, frame: body, pos: {v: "= 1 + (1 / 2.0) * (${length} - 1)", w: 0, s: "= i - 1"}, times: 3, count: 6, offset: [0.12, 0.04, 0.12], extra: .14, at: 2, detach: true}
        - {id: wave_2, op: particle, particle: block, block: minecraft:stone, anchor: {of: caster, offset: {forward: "= 1 + (2 / 2.0) * (${length} - 1)", up: 0, left: "= i - 1"}}, times: 3, count: 0, offset: {forward: 0.8, up: 0.08, left: 0.15}, extra: 0.32, at: 4, detach: true}
        - {id: chips_2, op: particle, particle: block, block: minecraft:stone, frame: body, pos: {v: "= 1 + (2 / 2.0) * (${length} - 1)", w: 0, s: "= i - 1"}, times: 3, count: 6, offset: [0.12, 0.04, 0.12], extra: .14, at: 4, detach: true}
        - {id: wave_quarter, op: particle, particle: block, block: minecraft:stone, anchor: {of: caster, offset: {forward: "= 1 + (0.5 / 2.0) * (${length} - 1)", up: 0, left: "= i - 1"}}, times: 3, count: 0, offset: {forward: 0.8, up: 0.08, left: 0.15}, extra: 0.32, at: 1, detach: true}
        - {id: chips_quarter, op: particle, particle: block, block: minecraft:stone, frame: body, pos: {v: "= 1 + (0.5 / 2.0) * (${length} - 1)", w: 0, s: "= i - 1"}, times: 3, count: 6, offset: [0.12, 0.04, 0.12], extra: .14, at: 1, detach: true}
        - {id: wave_three_quarters, op: particle, particle: block, block: minecraft:stone, anchor: {of: caster, offset: {forward: "= 1 + (1.5 / 2.0) * (${length} - 1)", up: 0, left: "= i - 1"}}, times: 3, count: 0, offset: {forward: 0.8, up: 0.08, left: 0.15}, extra: 0.32, at: 3, detach: true}
        - {id: chips_three_quarters, op: particle, particle: block, block: minecraft:deepslate, frame: body, pos: {v: "= 1 + (1.5 / 2.0) * (${length} - 1)", w: 0, s: "= i - 1"}, times: 3, count: 6, offset: [0.12, 0.04, 0.12], extra: .14, at: 3, detach: true}
        - {id: wave_0_core, op: particle, particle: electric_spark, frame: body, pos: {v: "= 1 + (0 / 2.0) * (${length} - 1)", w: 0, s: "= i - 1"}, times: 3, count: 2, offset: [0.06, 0.03, 0.06], extra: 0.02}
        - {id: wave_0_ore, op: particle, particle: dust, frame: body, pos: {v: "= 1 + (0 / 2.0) * (${length} - 1)", w: 0, s: "= i - 1"}, times: 3, count: "${chips}", color: "${core_color}", size: "${core_size}", extra: 0}
        - {id: wave_0_cyan, op: particle, particle: dust, frame: body, pos: {v: "= 1 + (0 / 2.0) * (${length} - 1)", w: 0, s: "= i - 1"}, times: 3, count: 4, color: "#64f5ef", size: "${core_size}", extra: 0, when: "= ${bright}"}
        - {id: wave_1_core, op: particle, particle: electric_spark, frame: body, pos: {v: "= 1 + (1 / 2.0) * (${length} - 1)", w: 0, s: "= i - 1"}, times: 3, count: 2, offset: [0.06, 0.03, 0.06], extra: 0.02, at: 2, detach: true}
        - {id: wave_1_ore, op: particle, particle: dust, frame: body, pos: {v: "= 1 + (1 / 2.0) * (${length} - 1)", w: 0, s: "= i - 1"}, times: 3, count: "${chips}", color: "${core_color}", size: "${core_size}", extra: 0, at: 2, detach: true}
        - {id: wave_1_cyan, op: particle, particle: dust, frame: body, pos: {v: "= 1 + (1 / 2.0) * (${length} - 1)", w: 0, s: "= i - 1"}, times: 3, count: 4, color: "#64f5ef", size: "${core_size}", extra: 0, when: "= ${bright}", at: 2, detach: true}
        - {id: wave_2_core, op: particle, particle: electric_spark, frame: body, pos: {v: "= 1 + (2 / 2.0) * (${length} - 1)", w: 0, s: "= i - 1"}, times: 3, count: 2, offset: [0.06, 0.03, 0.06], extra: 0.02, at: 4, detach: true}
        - {id: wave_2_ore, op: particle, particle: dust, frame: body, pos: {v: "= 1 + (2 / 2.0) * (${length} - 1)", w: 0, s: "= i - 1"}, times: 3, count: "${chips}", color: "${core_color}", size: "${core_size}", extra: 0, at: 4, detach: true}
        - {id: wave_2_cyan, op: particle, particle: dust, frame: body, pos: {v: "= 1 + (2 / 2.0) * (${length} - 1)", w: 0, s: "= i - 1"}, times: 3, count: 4, color: "#64f5ef", size: "${core_size}", extra: 0, when: "= ${bright}", at: 4, detach: true}
        - {id: trail, op: particle, particle: dust, along: edge, samples: 5, count: 1, color: "#999999", size: 0.35, extra: 0, at: 1, every: 2, for: "= ${trail_span} - 2", detach: true}
    end: {final: true}
