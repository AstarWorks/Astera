id: couture-rapier-s2-shears
name: {ja: 型紙裁ち (鋏), en: Pattern Trim shears}
description: {ja: S2 の 2 発目、3 つの投射体のうち鋏の本体 (花飾り+ピボット)。他の 2 つは単独の刃 couture-rapier-s2-blade-a / -b。, en: "S2 coin 2, one of three projectiles: the shears body (flower pivot). The other two are the separate blades couture-rapier-s2-blade-a / -b."}
archetype: projectile
cooldown_ticks: 0
resource_cost: 0
tags: [ranged]
params:
  type: projectile
  # Real 3D flight: 1.0 block/tick (about 5 visible ticks). The muzzle sits at hand height (eye -0.2) and aims at the enemy chest (aim_distance 5.4) so the piece rides the thread line hand -> enemy; the overhead-to-line dive is authored in the flight VFX.
  launch_speed: 1.0
  max_lifetime_ticks: 16
  hit_radius: 1.0
  muzzle_forward: 0.3
  muzzle_up: -0.2
  aim_distance: 5.4
  visual:
    vfx: couture-s2-body-flight
phases:
  type: projectile
  cast: []
  hit_entity:
  - {type: damage, targets: {type: target}, ignore_invulnerability: {type: literal, value: true}, components: [{base: {type: literal, value: 35}, attribute: physical}], delay_ticks: {type: literal, value: 2}}
  - {type: play_vfx, targets: {type: target}, vfx_id: couture-s2-hit2, follow: {type: literal, value: true}}
  - {type: play_vfx, targets: {type: target}, vfx_id: couture-s2-body-stuck, follow: {type: literal, value: true}}
  - {type: play_sound, targets: {type: target}, sound_id: entity.player.attack.sweep, volume: {type: literal, value: 0.9}, pitch: {type: literal, value: 1.3}}
  - {type: play_sound, targets: {type: target}, sound_id: entity.sheep.shear, volume: {type: literal, value: 1.0}, pitch: {type: literal, value: 0.9}}
  hit_block:
  - {type: play_vfx, targets: {type: hit_location}, vfx_id: couture-s2-shears-miss}
  - {type: play_sound, targets: {type: hit_location}, sound_id: block.amethyst_cluster.break, volume: {type: literal, value: 0.6}, pitch: {type: literal, value: 1.3}}
  miss: []
  expire:
  - {type: play_vfx, targets: {type: projectile_position}, vfx_id: couture-s2-shears-miss}
