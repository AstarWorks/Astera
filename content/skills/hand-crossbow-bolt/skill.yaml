# hand-crossbow-bolt: a quick straight bolt; the cast ends when the bolt body ends. Rewritten from zero on the rev4.10 grammar (ADR-0303):
# a visible item display riding the projectile body, the impact as one skill-local fragment, the trail as one rider group.
# Straight flight on purpose (no gravity): the hit tick is balance. Randomness: none. Visuals need a founder look on skill-compare.
apiVersion: astera/v3
kind: Skill
id: hand-crossbow-bolt
item: hand-crossbow
meta: {name: {ja: "クロスボウの矢", en: "Crossbow Bolt"}, description: {ja: "素早く矢を撃つ。", en: "A quick bolt."}, cooldown_ticks: 12, resource_cost: 5, tags: [ranged, physical]}
params:
  launch_speed: {type: number, default: 3.0}
  dmg_physical: {type: number, default: 15}
  max_lifetime_ticks: {type: ticks, default: 40}
anchors:
  - {id: muzzle,  anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: cast_fx, anchor: caster.eye, offset: {forward: 0.9, left: -0.35, up: -0.5}, mode: snapshot}
  - {id: heart,   anchor: victim.root, offset: {up: 1.2}, mode: follow}
machine:
  start: fly
  tail: 14
  states:
    fly:
      on:
        - {event: bolt.end, to: end}
      do:
        - {id: draw, op: body, target: caster, anim: crossbow-aim, speed: 1.0, at: 0, for: 14, detach: true}
        - {id: snd, op: sound, at: 0, sound: "astera:weapons/gun-shot", anchor: caster, volume: 0.8, pitch: 1.5}
        - {id: fx, op: particle_def, at: 0, def: gun-muzzle-flash, anchor: cast_fx}
        - id: bolt
          op: projectile
          at: 0
          origin: muzzle
          velocity: "= look(caster) * ${launch_speed}"
          for: "${max_lifetime_ticks}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg_physical}"}}
              - {id: hit_fx, use: strike-impact, with: {snd: "astera:weapons/gun-impact", color: "#d2d2d2"}, frames: {spot: heart}}
            block:
              - {id: block_snd, op: sound, at: 0, sound: "astera:weapons/gun-impact-block", anchor: contact.point, volume: 0.5, pitch: 1.5}
              - {id: block_fx, op: particle_def, at: 0, def: hit-spark, anchor: contact.point}
        - {id: shaft, op: display, kind: item, item: "minecraft:arrow", context: fixed, anchor: bolt, scale: [0.8, 0.8, 0.8], at: 0, until: bolt.end}
        - id: trail
          op: group
          at: 0
          every: 1
          until: bolt.end
          do:
            - {id: wake, op: particle, particle: crit, count: 1, offset: [0.04, 0.04, 0.04], anchor: {of: bolt, sweep: 0.4}, at: 0}
            - {id: dust, op: particle, particle: dust, count: 1, color: "#d2d2d2", size: 0.5, anchor: {of: bolt, sweep: 0.4}, at: 0}
    end: {final: true}
