# ADR-0220 display-particle demo: plays content/vfx/demo-quad-sparks.yaml in front of the caster.
# Not bound to any item; cast it with `caster.cast(...)` in the simulator.

id: vfx-demo-quad-sparks

name:
  ja: "デモ・火の粉"
  en: "Demo Ember Sparks"
description:
  ja: "表示エンティティの板ポリ粒子（色・半透明）で火の粉を散らすデモ。"
  en: "Plays a display-particle choreography: a burst of coloured, fading quad embers."

archetype: aoe
cooldown_ticks: 60
tags: [ demo, vfx ]

params:
  type: aoe
  radius: 4.0
  falloff: linear
  damage:
    - base: { type: literal, value: 2.5 }
      attribute: physical

phases:
  type: aoe
  cast:
    - type: play_vfx
      targets: { type: caster }
      vfx_id: demo-quad-sparks
  hit_entity: []
  expire: []
