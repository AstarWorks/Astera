apiVersion: astera/v3
kind: Skill
id: halberd-sweep
item: halberd
meta: {name: {ja: "薙ぎ払い", en: "Halberd Sweep"}, description: {ja: "広い弧で前方を薙ぎ払う。", en: "A wide sweeping arc."}, cooldown_ticks: 24, resource_cost: 12, tags: [melee, physical]}
params:
  arc_deg:      {type: number, default: 160}
  range:        {type: blocks, default: 3.8}
  dmg_physical: {type: number, default: 38}
  knockback:    {type: number, default: 0.6}
anchors:
  - {id: fx, anchor: caster, offset: {up: -0.1, forward: 1.6}}
  - {id: heart, anchor: victim.root, offset: {up: 1.2}}
machine:
  start: cast
  states:
    cast:
      for: 1
      then: done
      do:
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 1.0, pitch: 0.9, at: 0}
        - {id: fx1, op: particle_def, def: slash-sweep, anchor: fx, at: 0}
        - id: swing
          op: hit
          anchor: caster.eye
          at: 0
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          max_count: all       # GAP(Q1): v2 had no cap
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(event.victim - pos(caster))", strength: "${knockback}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.2}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
    done: {final: true}
