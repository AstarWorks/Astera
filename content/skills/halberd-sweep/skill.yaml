# halberd-sweep: wind-up 5 ticks (rule round(5 / attack_speed)), hit at tick 5. Wide horizontal sweep: drawn back to the right, swept across the front to the left.
apiVersion: astera/v3
kind: Skill
id: halberd-sweep
item: halberd
meta: {name: {ja: "薙ぎ払い", en: "Halberd Sweep"}, description: {ja: "広い弧で前方を薙ぎ払う。", en: "A wide sweeping arc."}, cooldown_ticks: 24, resource_cost: 12, tags: [melee, physical]}
params:
  arc_deg:      {type: number, default: 160}
  range:        {type: blocks, default: 3.8}
  dmg_physical: {type: number, default: 38}
  knockback:    {type: number, default: 0.6}
anchors:
  - {id: fx, anchor: caster.eye, offset: {up: -0.1, forward: 1.6}, mode: follow}
  - {id: heart, anchor: victim.center, mode: follow}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 5
      then: strike
      do:
        - {id: snd_windup, op: sound, sound: item.armor.equip_iron, anchor: caster, volume: 0.5, pitch: 0.7}
        # weapon rig: wide sweep. One performance in the windup state, detached so it plays on through the strike and the tail:
        # drawn back over 4 ticks, the cut starts at tick 4 so the blade crosses the target zone at the hit (tick 5), then 6 ticks of follow-through.
        - id: rig
          op: rig
          parent: caster
          mount: caster.hand_r
          rest: [{axis: left, deg: 72}]
          detach: true
          for: 13
          swing:
            - {at: 0, for: 4, from: {left: 0.000, up: 0.507, forward: 0.862}, to: {left: -0.958, up: 0.202, forward: -0.202}, edge: trailing, roll: 0, ease: out_quad}
            - {at: 4, for: 3, to: {left: 0.909, up: -0.101, forward: 0.404}, edge: leading, roll: 0, ease: out_cubic}
            - {at: 7, for: 6, to: {left: 0.834, up: 0.152, forward: -0.531}, edge: leading, roll: 0, ease: out_cubic}
    strike:
      for: 1
      then: end
      do:
        - id: swing
          op: hit
          anchor: caster.eye
          at: 0
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: react, op: react, target: event.victim, flinch: true, for: 6}
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(event.victim - pos(caster))", strength: "${knockback}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.2, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart, detach: true}
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 1.0, pitch: 0.9, detach: true}
        - {id: fx1, op: particle_def, def: slash-sweep, anchor: fx, detach: true}
        - {id: trail, op: particle, particle: crit, anchor: {of: /windup/rig.root, to: /windup/rig.tip, samples: 6}, count: 1, extra: 0.04, at: 0, every: 1, for: 8, detach: true}
    end: {final: true}
