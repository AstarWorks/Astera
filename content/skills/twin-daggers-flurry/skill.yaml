# twin-daggers-flurry: two-blade flurry: cut left, back-cut right (wind-up 2 ticks, hit at tick 2).
# Frames (ADR-0314, ADR-0315), the gameplay (hit tick, shape, damage, knockback, cooldown, cast length) is unchanged:
#   arm    - the right arm, rotate keys only. Origin = the right shoulder (`caster.shoulder_r`); the arm is one rigid 0.60 bone, so the hand travels on a sphere about it and a turn of this frame is that travel (about w left/right, about s up/down). Right-hand path: guard -> drawn back -> across to the left -> back to the right -> guard. `arm_off` mirrors it for the left hand.
#   arm_off - the left arm, the mirror of `arm` (origin `caster.shoulder_l`).
#   blade  - the twin daggers, one frame per hand (blade = right/main hand, blade_off = left hand, `hand: off` on its rig). Origin = the hand, 0.60 along the arm frame (the hand path is the arm's turn: guard -> drawn back high on the own side ->
#            cut across to the other side -> back-cut -> guard); the off hand is the mirror image of the main hand (s negated, the roll about v negated). Long axis along v (grip at the origin, tip at v 0.62),
#            edge along w. Roll -80 (main) / +80 (off) about v lays the edge across the cut, the cut is a turn about s (v moves towards w): the edge leads. The back-cut turns the blade over
#            about v (+160 / -160) so the other edge leads on the way back.
#            The engine pins the right hand to the origin; the origin sits exactly on the 0.60 reach sphere of the shoulder by construction.
#   body   - the caster's feet, v forward / w up / s right: sounds and the cast fx.
#   wound  - one per victim at the victim's centre, v the way the blow came in: the hit sound and the hit spark.
#   edge, edge_off - line along each blade, outer half (v 0.40 .. 0.62), what the trail rows draw along.
apiVersion: astera/v3
kind: Skill
id: twin-daggers-flurry
item: twin-daggers
meta:
  name: {ja: "連続斬り", en: "Flurry"}
  description: {ja: "素早い連続斬り。出血を与えることがある。", en: "Rapid slashes that may cause bleeding."}
  cooldown_ticks: 6
  resource_cost: 4
  tags: [melee, physical]
frames:
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: w, to: -30}   # guard
      - {at: 0, for: 1, about: w, to: -87, ease: in_out_sine}   # draw the right dagger back
      - {at: 1, for: 3, about: w, to: 95, ease: out_cubic}   # first stroke: across to the left
      - {at: 4, for: 3, about: w, to: -85, ease: out_cubic}   # second stroke: back to the right
      - {at: 7, for: 4, about: w, to: -30, ease: in_out_sine}   # back to guard
      - {at: 0, for: 0, about: s, to: -50}
      - {at: 0, for: 1, about: s, to: -18, ease: in_out_sine}
      - {at: 1, for: 3, about: s, to: -30, ease: out_cubic}
      - {at: 4, for: 3, about: s, to: -45, ease: out_cubic}
      - {at: 7, for: 4, about: s, to: -50, ease: in_out_sine}
  - id: blade
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: v, to: -80}                        # edge to the left
      - {at: 0, for: 1, about: s, to: -50, ease: in_out_sine}    # point away from the cut side
      - {at: 1, for: 3, about: s, to: 75, ease: out_cubic}       # the cut, edge first
      - {at: 4, for: 3, about: s, to: -45, ease: out_cubic}      # the back-cut returns the point
      - {at: 4, for: 3, about: v, to: 80, ease: out_cubic}       # the blade turns over: the other edge leads the back-cut
      - {at: 7, for: 4, reset: true, ease: in_out_sine}
  - id: arm_off
    origin: caster.shoulder_l
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: w, to: 30}   # guard
      - {at: 0, for: 1, about: w, to: 87, ease: in_out_sine}   # draw the left dagger back
      - {at: 1, for: 3, about: w, to: -95, ease: out_cubic}   # first stroke: across to the right
      - {at: 4, for: 3, about: w, to: 85, ease: out_cubic}   # second stroke: back to the left
      - {at: 7, for: 4, about: w, to: 30, ease: in_out_sine}   # back to guard
      - {at: 0, for: 0, about: s, to: -50}
      - {at: 0, for: 1, about: s, to: -18, ease: in_out_sine}
      - {at: 1, for: 3, about: s, to: -30, ease: out_cubic}
      - {at: 4, for: 3, about: s, to: -45, ease: out_cubic}
      - {at: 7, for: 4, about: s, to: -50, ease: in_out_sine}
  - id: blade_off
    origin: {frame: arm_off, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: v, to: 80}                        # edge to the right
      - {at: 0, for: 1, about: s, to: -50, ease: in_out_sine}    # point away from the cut side
      - {at: 1, for: 3, about: s, to: 75, ease: out_cubic}       # the cut, edge first
      - {at: 4, for: 3, about: s, to: -45, ease: out_cubic}      # the back-cut returns the point
      - {at: 4, for: 3, about: v, to: -80, ease: out_cubic}       # the blade turns over: the other edge leads the back-cut
      - {at: 7, for: 4, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: wound
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
lines:
  edge: {frame: blade, from: {v: 0.40}, to: {v: 0.62}}
  edge_off: {frame: blade_off, from: {v: 0.40}, to: {v: 0.62}}
machine:
  start: windup
  tail: 9
  states:
    windup:
      for: 2
      then: strike
      do:
        - {id: rig, op: rig, frame: blade, for: 11, detach: true}
        - {id: rig_off, op: rig, frame: blade_off, hand: off, for: 11, detach: true}
    strike:
      for: 1
      then: end
      enter:
        - id: swing
          op: hit
          at: 0
          anchor: caster.eye
          shape: {sector: {deg: 70, range: 2.5, height: 2.0, forward: look}}
          targets: enemies
          ignore_invulnerability: false
          damage: {physical: 18.0}
          window: once
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: 0.1}
              - {id: bleed, op: status, target: event.victim, status: bleed, stacks: 1, for: 80, when: "= rand() < 0.4"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", frame: wound, volume: 0.7, pitch: 1.2, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, frame: wound, pos: {w: 0.2}, detach: true}
        - {id: snd, op: sound, sound: "astera:weapons/sword-swing", frame: body, volume: 1.0, pitch: 1.7, at: 0, detach: true}
        - {id: fx, op: particle_def, def: stab-spark, frame: body, pos: {v: 1.6, w: 1.42}, at: 0, detach: true}
        - {id: trail_fx, op: particle, particle: crit, along: edge, samples: 2, count: 1, extra: 0.04, at: 0, every: 1, for: 2, detach: true}
        - {id: trail_off_fx, op: particle, particle: crit, along: edge_off, samples: 2, count: 1, extra: 0.04, at: 3, every: 1, for: 3, detach: true}
    end: {final: true}
