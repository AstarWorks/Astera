apiVersion: astera/v3
kind: Skill
id: twin-daggers-flurry
item: twin-daggers
meta:
  name: {ja: "連続斬り", en: "Flurry"}
  description: {ja: "素早い連続斬り。出血を与えることがある。", en: "Rapid slashes that may cause bleeding."}
  cooldown_ticks: 6
  resource_cost: 4
  tags: [melee, physical]
# GAP: gameplay.expose (damage <- dmg_physical, arc_deg, range, bleed_ticks) -> none (inline literals)
anchors:
  - {id: stab_pt, anchor: caster.eye, offset: {up: -0.2, forward: 1.4}}
  - {id: foe,   anchor: victim.root}
  - {id: heart, anchor: victim.root, offset: {up: 1.2}}
machine:
  start: swing
  states:
    swing:
      for: 1
      then: end
      do:
        - id: swing
          op: hit
          at: 0
          anchor: caster.eye
          shape: {sector: {deg: 70, range: 2.5, height: 2.0}}
          targets: enemies
          damage: {physical: 18.0}
          window: once
          on:
            hit:
              # v2 status bleed chance 0.4 -> rand() gate (chance field removed in v3)
              - {id: bleed, op: status, target: event.victim, status: bleed, stacks: 1, for: 80, when: "= rand() < 0.4"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: foe, volume: 0.7, pitch: 1.2}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
        - {id: snd, op: sound, sound: "astera:weapons/sword-swing", anchor: caster, volume: 1.0, pitch: 1.7}
        - {id: fx, op: particle_def, def: stab-spark, anchor: stab_pt}
    end: {final: true}
