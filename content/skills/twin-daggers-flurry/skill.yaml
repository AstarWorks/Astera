# Wind-up W = 2 ticks (round_half_up(5 / attack_speed 3.0)): both blades are drawn to the right, the flurry hits at tick 2, the cast ends one tick later.
# The rig is written in the blade's travel direction (cut to the left, then the back-cut to the right, edge leading); rig and trail are detach: true.
apiVersion: astera/v3
kind: Skill
id: twin-daggers-flurry
item: twin-daggers
meta:
  name: {ja: "連続斬り", en: "Flurry"}
  description: {ja: "素早い連続斬り。出血を与えることがある。", en: "Rapid slashes that may cause bleeding."}
  cooldown_ticks: 6
  resource_cost: 4
  tags: [melee, physical]
anchors:
  - {id: stab_pt, anchor: caster.eye, offset: {up: -0.2, forward: 1.4}, mode: follow}
  - {id: heart, anchor: victim.root, offset: {up: 1.2}, mode: follow}
machine:
  start: windup
  tail: 9
  states:
    windup:
      for: 2
      then: strike
      do:
        - id: rig
          op: rig
          parent: caster
          mount: caster.hand_r
          rest: [{axis: left, deg: 72}]
          for: 11
          detach: true
          swing:
            - {at: 0, for: 2, from: {left: 0.1, up: 0.5, forward: 0.8}, to: {left: -0.8, up: 0.35, forward: 0.4}, edge: trailing, ease: in_out_sine}
            - {at: 2, for: 3, to: {left: 0.85, up: -0.1, forward: 0.5}, edge: leading, roll: 15, ease: out_cubic}
            - {at: 5, for: 3, to: {left: -0.7, up: 0.2, forward: 0.65}, edge: trailing, ease: out_cubic}
            - {at: 8, for: 3, to: {left: 0.0, up: 0.5, forward: 0.8}, edge: trailing, ease: in_out_sine}
    strike:
      for: 1
      then: end
      enter:
        - id: swing
          op: hit
          at: 0
          anchor: caster.eye
          shape: {sector: {deg: 70, range: 2.5, height: 2.0, forward: look}}
          targets: enemies
          ignore_invulnerability: false
          damage: {physical: 18.0}
          window: once
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: 0.1}
              - {id: bleed, op: status, target: event.victim, status: bleed, stacks: 1, for: 80, when: "= rand() < 0.4"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.2, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart, detach: true}
        - {id: snd, op: sound, sound: "astera:weapons/sword-swing", anchor: caster, volume: 1.0, pitch: 1.7, at: 0, detach: true}
        - {id: fx, op: particle_def, def: stab-spark, anchor: stab_pt, at: 0, detach: true}
        - {id: trail_fx, op: particle, particle: crit, anchor: {of: /windup/rig.root, to: /windup/rig.tip, samples: 5}, count: 1, extra: 0.04, at: 0, every: 1, for: 6, detach: true}
    end: {final: true}
