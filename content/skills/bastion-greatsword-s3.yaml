# Zwei West Section 3 Ishmael, Ward (video 18.9-23.7): backhand sweep, floor scrape, dash-thrust, upright planted slam. Rebuilt from fresh
# observation (tools/skill-compare/data/bastion-greatsword-s3/notes.md). Caster movement: 3-tick dash that closes the gap to about 1.5 blocks.
