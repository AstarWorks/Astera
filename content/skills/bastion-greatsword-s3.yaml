# Zwei West Section 3 Ward (video 18.9-23.7): ring, floor drag, dash-thrust, overhead slam. Built on the S2 pattern (beat sheet r2 gate 1 passed: tools/skill-compare/data/bastion-greatsword-s3/beat-sheet/beat-sheet.md).
# ONE rig (bastion-s3-rig, real main-hand stack) with freezes at the contacts 10 / 40 / 63. Fx: ring played at 6 (contact = effect tick 4 = t10), scrape 27, dash 37, thrust 36 (contact t40), slam 59 (contact t63), pillar 63 (peak t66-68). Every VFX follows the caster.
# Hit areas = the visual reach: ring = radius 3.0 gold crescent round the caster; thrust = forward cone 50 deg / 3.6 (the horizontal blade beam); slam = forward cone 90 deg / 3.6 (overhead crescent + pillar). Navy streaks are afterimages with no hit.
# Travel: 5.4 block hard-stop dash t37-39 (founder Q3), stop_before_target small (0.7) so the full step happens. Sounds: all vanilla, layered and pitched low; contact 3 is the heaviest stack. Charge: +0.5 per stack on every hit, spent by the slam.
id: bastion-greatsword-s3
name: {ja: 巨剣墜つ, en: Colossus Fall}
description: {ja: 背負った巨剣で輪を描いて薙ぎ、床を引きずって突進で貫き、頭上から叩きつける三連の奥義。溜めを消費して最後の一撃が重くなる。, en: 'Sweep a ring with the shouldered blade, drag it, dash through, then slam it down from overhead. Spends charge for the final blow.'}
