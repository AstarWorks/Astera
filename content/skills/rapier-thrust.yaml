# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: rapier-thrust

name:
  ja: "レイピアの突き"
  en: "Rapier Thrust"
description:
  ja: "細い突きを素早く繰り出す。"
  en: "A fast, precise thrust."

archetype: melee
cooldown_ticks: 9
resource_cost: 5
tags: [ melee, physical ]

params:
  type: melee
  range: 3.6
  arc_degrees: 20.0
  knockback: 0.1
  damage:
    - base: { type: literal, value: 24.0 }
      attribute: physical

phases:
  type: melee
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/sword-swing
      volume: { type: literal, value: 0.9 }
      pitch: { type: literal, value: 1.7 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.5, height: -0.1 }
      particle_id: stab-spark
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/blade-hit
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
  miss: []
