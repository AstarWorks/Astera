# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: gale-gust

name:
  ja: "突風"
  en: "Gust"
description:
  ja: "前方の敵を強く押し返す。"
  en: "Blows enemies in front of you away."

archetype: sequence
cooldown_ticks: 70
resource_cost: 12
tags: [ magic, wind, control ]

params:
  type: sequence

phases:
  type: sequence
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.breeze.wind_burst
      volume: { type: literal, value: 0.9 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.5, height: 0.0 }
      particle_id: dash-cloud
    - type: knockback
      targets:
        type: cone
        from: { type: caster }
        direction: { type: from_caster }
        distance: { type: literal, value: 6.0 }
        angle_degrees: { type: literal, value: 80 }
      direction: { type: away_from_caster, vertical: 0.2 }
      strength: { type: literal, value: 1.6 }
    - type: damage
      targets:
        type: cone
        from: { type: caster }
        direction: { type: from_caster }
        distance: { type: literal, value: 6.0 }
        angle_degrees: { type: literal, value: 80 }
      components:
        - base: { type: literal, value: 10.0 }
          attribute: physical
