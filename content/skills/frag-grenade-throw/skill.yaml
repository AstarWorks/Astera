apiVersion: "astera/v3"
kind: Skill
id: frag-grenade-throw
item: frag-grenade
meta:
  name: {ja: "破片手榴弾", en: "Frag Grenade"}
  description: {ja: "投げつけると破片をまき散らし、周囲を少し傷つける。", en: "Bursts into shrapnel and chips nearby blocks."}
  cooldown_ticks: 140
  resource_cost: 0
  tags: [ranged, explosive, physical]
anchors:
  muzzle: {anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  cast_fx: {anchor: caster.eye, offset: {up: -0.25, forward: 0.9}, mode: snapshot}
  heart: {anchor: victim.body, offset: {up: 0.4}}
# anchor note: v2 enemy point offset Y minus 0.8 (example b maps 1.0 -> up 0.2)
presentation:
  timeline:
    - at: 0
      do:
        - {id: snd, op: sound, sound: "entity.snowball.throw", anchor: caster, volume: 0.9, pitch: 0.7}
        - {id: fx, op: particle_def, def: gun-muzzle-smoke, anchor: cast_fx}
    - {at: 0, every: 1, until: bolt.end, do: [{op: particle, particle: smoke, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.04, 0.04, 0.04]}]}
    - {at: 0, every: 1, until: bolt.end, do: [{op: particle, particle: crit, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.04, 0.04, 0.04]}]}
gameplay:
  timeline:
    - at: 0
      do:
        - id: bolt
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * 1.4"
          for: 60
          radius: 0.5
          hit: {targets: enemies, once: true}
          block: {mode: despawn}
          on:
            hit:
              # GAP: explode (power 1.3, radius 3.5, break_blocks false, physical 35) -> none in v3 gameplay ops; kept verbatim
              - {id: boom, op: explode, target: event.victim, power: 1.3, break_blocks: false, radius: 3.5, components: [{kind: physical, amount: 35.0}]}
              # GAP: max_count 64 is invented (v3 area targets require max_count; v2 had no cap) -> none
              - {id: st_bleed, op: status, target: {kind: enemies, around: heart, radius: 3.5, max_count: 64, include_self: false}, status: bleed, stacks: 1, for: 20}
              # GAP: break_area (sphere r1.5, block_damage 35, breaks true, staged false, length 0.0) -> none; v3 has no world-damage op, kept verbatim (flat strike per cell, 054769350)
              - {op: break_area, shape: sphere, radius: 1.5, block_damage: 35, breaks: true, staged: false, length: 0.0, id: chip, at: contact.point}
              - {id: snd_hit, op: sound, sound: "entity.generic.explode", anchor: heart, volume: 0.7, pitch: 1.2}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
            block:
              # GAP: explode at contact.point (power 1.3, radius 3.5, physical 35) -> none in v3 gameplay ops; kept verbatim
              - {id: boom_2, op: explode, anchor: contact.point, power: 1.3, break_blocks: false, radius: 3.5, components: [{kind: physical, amount: 35.0}]}
              # GAP: max_count 64 is invented -> none
              - {id: st_bleed_2, op: status, target: {kind: enemies, around: contact.point, radius: 3.5, max_count: 64, include_self: false}, status: bleed, stacks: 1, for: 20}
              # GAP: break_area (sphere r1.5, block_damage 35, breaks true, staged false, length 0.0) -> none; v3 has no world-damage op, kept verbatim (flat strike per cell, 054769350)
              - {op: break_area, shape: sphere, radius: 1.5, block_damage: 35, breaks: true, staged: false, length: 0.0, id: chip_2, at: contact.point}
              - {id: snd_blk, op: sound, sound: "entity.generic.explode", anchor: contact.point, volume: 0.7, pitch: 1.2}
              - {id: fx_blk, op: particle_def, def: hit-spark, anchor: contact.point}
