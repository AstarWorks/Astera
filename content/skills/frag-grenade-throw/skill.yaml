# Frag grenade: a lobbed body (thrown up and forward, so it flies a parabola) that bounces off the floor and walls, passes enemies
# without touching them, and bursts at a fixed fuse tick after the throw (fuse_ticks = the projectile `for`, fixed at load). One skill-local fragment is the blast, called on the body end with the
# burst centre bound as `spot`. Schedule: the cast ends at the fuse tick.
apiVersion: astera/v3
kind: Skill
id: frag-grenade-throw
item: frag-grenade
meta:
  name: {ja: "破片手榴弾", en: "Frag Grenade"}
  description: {ja: "投げつけると破片をまき散らし、周囲を少し傷つける。", en: "Bursts into shrapnel and chips nearby blocks."}
  cooldown_ticks: 140
  resource_cost: 0
  tags: [ranged, explosive, physical]
params:
  launch_speed: {type: number, default: 0.75}
  lift:         {type: number, default: 0.3}
  fuse_ticks:   {type: ticks, default: 36}
  blast_radius: {type: blocks, default: 3.5}
  blast_damage: {type: number, default: 35.0}
  bleed_ticks:  {type: ticks, default: 20}
anchors:
  - {id: muzzle,  anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: cast_fx, anchor: caster.eye, offset: {up: -0.25, forward: 0.9}, mode: snapshot}
fragments:
  blast:
    params:
      radius: {type: blocks, required: true}
      damage: {type: number, required: true}
      bleed:  {type: ticks, required: true}
    frames_in: {spot: anchor}
    do:
      - {id: boom, op: explode, at: 0, anchor: spot, power: 1.3, break_blocks: false, fire: false}
      - {id: dmg, op: damage, target: {kind: enemies, around: spot, radius: "${radius}"}, damage: {physical: "${damage}"}}
      - {id: bleed, op: status, target: {kind: enemies, around: spot, radius: "${radius}"}, status: bleed, stacks: 1, for: "${bleed}"}
      - {id: chip, op: break_area, at: 0, anchor: spot, shape: {sphere: {radius: 1.5}}, tool: none, block_damage: 35, ripple: 29, revert: 200, outside_arena: false}
      - {id: snd, op: sound, sound: "entity.generic.explode", anchor: spot, volume: 0.7, pitch: 1.2, detach: true}
machine:
  start: throw
  tail: 2
  states:
    throw:
      for: "= fuse_ticks"
      then: end
      do:
        - {id: snd, op: sound, sound: "entity.snowball.throw", anchor: caster, volume: 0.9, pitch: 0.7, at: 0}
        - {id: fx, op: particle_def, def: gun-muzzle-smoke, anchor: cast_fx, at: 0}
        - id: bolt
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * ${launch_speed} + vec(0, ${lift}, 0)"
          for: "${fuse_ticks}"
          gravity: 0.04
          radius: 0.5
          hit: {targets: blocks_only, once: true, attach: false}
          block: {mode: bounce, restitution: 0.45, friction: 0.15, times: 3}
          on:
            bounce:
              - {id: fx_blk, op: particle_def, def: hit-spark, anchor: contact.point, detach: true}
            end:
              - {op: use, use: "fragment:blast", with: {radius: "${blast_radius}", damage: "${blast_damage}", bleed: "${bleed_ticks}"}, frames: {spot: bolt}}
        - {id: shell, op: display, kind: item, item: "minecraft:firework_star", context: fixed, anchor: bolt, scale: [0.5, 0.5, 0.5], at: 0, until: bolt.end}
        - {id: smoke, op: particle, particle: smoke, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.04, 0.04, 0.04], at: 0, every: 1, until: bolt.end}
        - {id: spark, op: particle, particle: crit, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.04, 0.04, 0.04], at: 0, every: 1, until: bolt.end}
    end: {final: true}
