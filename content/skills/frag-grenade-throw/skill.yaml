apiVersion: astera/v3
kind: Skill
id: frag-grenade-throw
item: frag-grenade
meta:
  name: {ja: "破片手榴弾", en: "Frag Grenade"}
  description: {ja: "投げつけると破片をまき散らし、周囲を少し傷つける。", en: "Bursts into shrapnel and chips nearby blocks."}
  cooldown_ticks: 140
  resource_cost: 0
  tags: [ranged, explosive, physical]
anchors:
  - {id: muzzle,  anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: cast_fx, anchor: caster, offset: {up: -0.25, forward: 0.9}, mode: snapshot}
  - {id: heart,   anchor: victim.root, offset: {up: 1.2}}   # v2 pt_enemy_0_1p2_0
machine:
  start: throw
  states:
    throw:
      on:
        - {event: bolt.end, to: end}    # manager ruling 2026-10-29: the cast ends when the projectile body ends (v2)
      do:
        - {id: snd, op: sound, sound: "entity.snowball.throw", anchor: caster, volume: 0.9, pitch: 0.7, at: 0}
        - {id: fx, op: particle_def, def: gun-muzzle-smoke, anchor: cast_fx, at: 0}
        - id: bolt
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * 1.4"
          for: 60
          radius: 0.5
          hit: {targets: enemies, once: true}
          block: {mode: despawn}
          on:
            hit:
              - {id: boom, op: explode, at: 0, anchor: victim.root, power: 1.3, break_blocks: false, fire: false}
              - {id: boom_dmg, op: damage, target: {kind: enemies, around: victim.root, radius: 3.5, max_count: all}, damage: {physical: 35.0}}   # GAP(Q1): v2 had no cap
              - {id: st_bleed, op: status, target: {kind: enemies, around: victim.root, radius: 3.5, max_count: all}, status: bleed, stacks: 1, for: 20}
              - {id: chip, op: break_area, at: 0, anchor: contact, shape: {sphere: {radius: 1.5, ahead: 4.0}}, tool: none, block_damage: 35, ripple: 29, revert: 200, outside_arena: false}
              - {id: snd_hit, op: sound, sound: "entity.generic.explode", anchor: contact, volume: 0.7, pitch: 1.2}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
            block:
              - {id: boom_2, op: explode, at: 0, anchor: contact, power: 1.3, break_blocks: false, fire: false}
              - {id: boom_dmg_2, op: damage, target: {kind: enemies, around: contact, radius: 3.5, max_count: all}, damage: {physical: 35.0}}
              - {id: st_bleed_2, op: status, target: {kind: enemies, around: contact, radius: 3.5, max_count: all}, status: bleed, stacks: 1, for: 20}
              - {id: chip_2, op: break_area, at: 0, anchor: contact, shape: {sphere: {radius: 1.5, ahead: 4.0}}, tool: none, block_damage: 35, ripple: 29, revert: 200, outside_arena: false}
              - {id: snd_blk, op: sound, sound: "entity.generic.explode", anchor: contact, volume: 0.7, pitch: 1.2}
              - {id: fx_blk, op: particle_def, def: hit-spark, anchor: contact}
        - {id: trail0, op: particle, particle: smoke, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.04, 0.04, 0.04], extra: 0, at: 0, every: 1, until: bolt.end}
        - {id: trail1, op: particle, particle: crit, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.04, 0.04, 0.04], extra: 0, at: 0, every: 1, until: bolt.end}
    end: {final: true}
