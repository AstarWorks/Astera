# Wave 2 v3 draft (basic-ac): ported 1:1 from the v2 skill.yaml + look.yaml. GAP comments mark what v3 cannot spell yet.
apiVersion: astera/v3
kind: Skill
id: hand-crossbow-venom
item: hand-crossbow
meta:
  name: {ja: "毒矢", en: "Venom Bolt"}
  description: {ja: "対象を毒状態にする矢。", en: "A bolt that poisons the target."}
  cooldown_ticks: 60
  resource_cost: 10
  tags: [ranged, physical]
params:
  launch_speed: {type: number, default: 2.8}
  max_lifetime_ticks: {type: ticks, default: 40}
  dmg_physical: {type: number, default: 10.0}
  poison_ticks: {type: ticks, default: 60}
anchors:
  - {id: origin, anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}       # was pt_aim_0_0_0p5
  - {id: muzzle, anchor: caster, offset: {up: -0.25, forward: 0.9}, mode: snapshot}   # was pt_caster_0_m0p25_0p9 (v2 caster frame)
  - {id: heart, anchor: victim.root, offset: {up: 1.2}}                            # was pt_enemy_0_1p2_0 ; GAP(Q2): v2 enemy frame origin = feet+0.8 (victim.root = feet)
machine:
  start: fly
  states:
    fly:
      for: "= max_lifetime_ticks"
      then: end
      on:
        - {event: bolt.end, to: end}
      enter:
        - id: bolt
          op: projectile
          origin: origin
          velocity: "= look(caster) * launch_speed"
          for: "= max_lifetime_ticks"
          radius: 0.5
          hit: {targets: enemies, once: true}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "= dmg_physical"}}
              - {id: st_poison, op: status, target: event.victim, status: poison, stacks: 1, for: "= poison_ticks"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/gun-impact", anchor: contact, volume: 0.7, pitch: 1.2}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
            block:
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact, volume: 0.5, pitch: 1.5}
              - {id: fx_blk, op: particle_def, def: hit-spark, anchor: contact}
      do:
        - {id: snd_cast, op: sound, sound: "astera:weapons/gun-shot", anchor: caster, at: 0, volume: 0.8, pitch: 1.3}
        - {id: fx_cast, op: particle_def, def: gun-muzzle-flash, anchor: muzzle, at: 0}
        - {id: tr0, op: particle, anchor: {of: bolt, sweep: 0.4}, particle: happy_villager, count: 1, offset: [0.04, 0.04, 0.04], extra: 0, at: 0, every: 1, until: bolt.end}
        - {id: tr1, op: particle, anchor: {of: bolt, sweep: 0.4}, particle: dust, count: 1, offset: [0, 0, 0], extra: 0, color: "#46aa3c", size: 1.0, at: 0, every: 1, until: bolt.end}
    end: {final: true}
