# hand-crossbow-venom: a poisoned crossbow bolt, in the frame grammar (ADR-0314, ADR-0315). `bow` is rooted in the caster's right hand (the bow arm of the `crossbow-aim` pose, v = aim, s = right,
# w = s x v), so the arrow leaves the nock 0.35 ahead of the hand along the aim, where the string is drawn, not the head. The hand pose stays the body clip
# (a bow has no 3D model to rig). Cast sound at the hand; the arrow display and its wake ride the body (part projectile-body); `hit` one per victim at
# its centre, `blk` one per block contact, v the way the arrow came in; the sparks sit at v -0.2 of them.
# Straight flight on purpose (no gravity): the hit tick is balance. Randomness: none.
apiVersion: astera/v3
kind: Skill
id: hand-crossbow-venom
item: hand-crossbow
meta: {name: {ja: "毒矢", en: "Venom Bolt"}, description: {ja: "対象を毒状態にする矢。", en: "A bolt that poisons the target."}, cooldown_ticks: 60, resource_cost: 10, tags: [ranged, physical]}
params:
  launch_speed: {type: number, default: 2.8}
  dmg_physical: {type: number, default: 10}
  poison_ticks: {type: ticks, default: 60}
  max_lifetime_ticks: {type: ticks, default: 40}
frames:
  - id: bow
    origin: caster.hand_r
    v: aim
    w: s x v
    s: right
  - id: hit
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
  - id: blk
    on: event.block
    each: true
    origin: contact
    v: incoming
    w: up
    s: v x w
machine:
  start: fly
  tail: 14
  states:
    fly:
      for: "${max_lifetime_ticks}"
      then: end
      on:
        - {event: bolt.end, to: end}
      do:
        - {id: draw, op: body, target: caster, anim: crossbow-aim, speed: 1.0, at: 0, for: 14, detach: true}
        - {id: snd, op: sound, at: 0, sound: "astera:weapons/gun-shot", frame: bow, pitch: 1.3}
        - id: bolt
          op: projectile
          at: 0
          frame: bow
          pos: {v: 0.35}
          velocity: "= look(caster) * ${launch_speed}"
          for: "${max_lifetime_ticks}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg_physical}"}}
              - {id: st_poison, op: status, target: event.victim, status: poison, stacks: 1, for: "${poison_ticks}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/gun-impact", frame: hit, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, frame: hit, pos: {v: -0.2}, detach: true}
            block:
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", frame: blk, volume: 0.5, pitch: 1.5, detach: true}
              - {id: fx_blk, op: particle_def, def: hit-spark, frame: blk, pos: {v: -0.2}, detach: true}
        - {id: shaft, use: projectile-body, with: {item: "minecraft:tipped_arrow", scale: 0.8, color: "#46aa3c", wake: happy_villager}, frames: {body: bolt}, events: {body_end: bolt.end}}
    end: {final: true}
