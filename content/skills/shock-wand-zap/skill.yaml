# shock-wand-zap: a quick electric bolt that sometimes stuns, on the frame grammar (ADR-0314).
#   tip - the wand head on the caster's eye/aim basis (cast puff, sound and the bolt leave it); head - the bolt body (core + trail segment 3.2 long);
#   hit / blk - one frame per victim / block contact; the impact (spark, spark rings, pop) is drawn on them. Gameplay unchanged.
apiVersion: astera/v3
kind: Skill
id: shock-wand-zap
item: shock-wand
meta:
  name: {ja: "電撃", en: Zap}
  description: {ja: "素早い電撃。麻痺させることがある。", en: "A quick bolt of electricity that can stun."}
  cooldown_ticks: 18
  resource_cost: 6
  tags: [ranged, electric]
params:
  speed:        {type: number, default: 3.2}
  flight_ticks: {type: ticks,  default: 40}
  dmg_electric: {type: number, default: 16.0}
  shock_ticks:  {type: ticks,  default: 8}
frames:
  - {id: tip, origin: caster.eye, v: aim, w: s x v, s: right, move: [{at: 0, for: 0, to: {v: 1.3, w: -0.3, s: 0.25}}]}
  - {id: head, origin: bolt, v: velocity, w: up, w_fallback: [1, 0, 0], s: v x w}
  - {id: hit, on: event.victim, each: true, origin: victim.center, v: incoming, w: up, w_fallback: [1, 0, 0], s: v x w}
  - {id: blk, on: event.block, each: true, origin: contact, v: incoming, w: up, w_fallback: [1, 0, 0], s: v x w}
machine:
  start: fly
  tail: 2
  states:
    fly:
      for: 40                       # literal: state `for` does not take ${param} yet (= flight_ticks)
      then: end
      on:
        - {event: bolt.end, to: end}
      do:
        - {id: snd, op: sound, sound: "astera:skill/wand/cast", frame: tip, volume: 0.8, pitch: 1.4}
        - {id: fx, op: particle_def, def: thunder-cast, frame: tip}
        - id: bolt
          op: projectile
          frame: tip
          velocity: "= look(caster) * ${speed}"
          for: "${flight_ticks}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {electric: "${dmg_electric}"}}
              - {id: st_shock, op: status, target: event.victim, status: shock, stacks: 1, for: "${shock_ticks}"}
              - {id: snd_hit, op: sound, sound: "astera:skills/lightning-impact", frame: hit, volume: 0.7, pitch: 1.2, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, frame: hit, detach: true}
              - {id: ring, op: particle, particle: electric_spark, frame: hit, times: 16, count: 0, offset: "= vec(cos(i * 2 * pi / 16), 0.0, sin(i * 2 * pi / 16))", extra: 0.25, detach: true}
              - {id: ring_up, op: particle, particle: electric_spark, frame: hit, times: 8, count: 0, offset: "= vec(0.7 * cos(i * 2 * pi / 8), 0.7, 0.7 * sin(i * 2 * pi / 8))", extra: 0.2, detach: true}
              - {id: pop, op: particle, particle: electric_spark, frame: hit, count: 4, offset: [0.15, 0.15, 0.15], extra: 0.12, detach: true}
            block:
              - {id: snd_block, op: sound, sound: "astera:weapons/gun-impact-block", frame: blk, volume: 0.5, pitch: 1.5, detach: true}
              - {id: fx_block, op: particle_def, def: hit-spark, frame: blk, detach: true}
              - {id: ring_blk, op: particle, particle: electric_spark, frame: blk, times: 16, count: 0, offset: "= vec(cos(i * 2 * pi / 16), 0.0, sin(i * 2 * pi / 16))", extra: 0.25, detach: true}
              - {id: ring_up_blk, op: particle, particle: electric_spark, frame: blk, times: 8, count: 0, offset: "= vec(0.7 * cos(i * 2 * pi / 8), 0.7, 0.7 * sin(i * 2 * pi / 8))", extra: 0.2, detach: true}
              - {id: pop_blk, op: particle, particle: electric_spark, frame: blk, count: 4, offset: [0.15, 0.15, 0.15], extra: 0.12, detach: true}
        - id: core
          op: display
          kind: sprite
          sprite: thunder-spark
          frame: head
          size: [0.5, 0.5]
          color: "#fff6a0"
          billboard: center
          brightness: {block: 15, sky: 15}
          flipbook: {frames: 6, every: 1, loop: true}
          at: 0
          for: 40
          motion:
            - {law: spin, axis: forward, deg_per_tick: 24, at: 0, for: 40}
        - id: trail
          at: 2
          every: 1
          until: bolt.end
          do:
            - {id: trail_spark, op: particle, particle: electric_spark, frame: head, pos: {v: 0}, to: {v: -3.2}, samples: 4, count: 1, offset: [0.04, 0.04, 0.04]}
            - {id: trail_dust, op: particle, particle: dust, frame: head, pos: {v: 0}, to: {v: -3.2}, samples: 4, count: 1, color: "#fff078", size: 1.0}
    end: {final: true}
