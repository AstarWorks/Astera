apiVersion: astera/v3
kind: Skill
id: cleaver-chop
item: cleaver
meta:
  name: {ja: 大鉈の一撃, en: Cleaver Chop}
  description: {ja: "重い一撃を叩き込む。", en: "A heavy chop."}
  cooldown_ticks: 30
  resource_cost: 14
  tags: [melee, physical]
params:
  arc_deg:       {type: number, default: 90}
  range:         {type: blocks, default: 2.8}
  dmg_physical:  {type: number, default: 62}
  knockback:     {type: number, default: 0.5}
  bleed_ticks:   {type: ticks, default: 60}
anchors:
  - {id: fx, anchor: caster, offset: {forward: 1.3, up: -0.1}}
machine:
  start: cast
  states:
    cast:
      start: strike
      do:
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 1.0, pitch: 0.8, at: 0}
        - {id: fx1, op: particle_def, def: slash-sweep, anchor: fx, at: 0}
      on:
        - {event: end, to: done}
      states:
        strike:
          for: 1
          then: recover
          enter:
            - id: strike
              op: hit
              anchor: caster.eye
              at: 0
              shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
              targets: enemies
              max_count: all       # GAP(Q1): max_count spelling (A required int|all / B omit) is a founder question; v2 had no cap
              window: once
              ignore_invulnerability: false
              damage: {physical: "${dmg_physical}"}
              on:
                hit:
                  - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: "${knockback}"}
                  - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.2}
                  - {id: spark, op: particle_def, def: hit-spark, anchor: contact}
                  - {id: bleed, op: status, target: event.victim, status: bleed, stacks: 1, for: "${bleed_ticks}", when: "= rand() < 0.5"}
        recover: {final: true}
    done: {final: true}
