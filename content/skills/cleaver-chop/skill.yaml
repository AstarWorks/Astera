# cleaver-chop: overhead chop of the cleaver (wind-up 6 ticks, hit at tick 6).
# Frames (ADR-0314, ADR-0315), the gameplay (hit tick, shape, damage, knockback, cooldown, cast length) is unchanged:
#   arm    - the right arm, rotate keys only. Origin = the right shoulder (`caster.shoulder_r`); the arm is one rigid 0.60 bone, so the hand travels on a sphere about it and a turn of this frame is that travel (about w left/right, about s up/down). Hand path: guard -> raised high at the right -> chopped down in front -> guard.
#   blade  - the cleaver. Origin = the hand, 0.60 along the arm frame (the hand path is the arm's turn: guard -> raised overhead -> down in front -> guard). Long axis along v (grip at the origin,
#            tip at v 0.63), edge along w. Roll 180 about v turns the edge down, the chop is then a turn about s that brings the tip down edge first. The wind-up raises the point behind the head (-110), the chop
#            drives it down in front (+55, hit while the head passes the target), `reset` eases back to guard.
#            The engine pins the right hand to the origin; the origin sits exactly on the 0.60 reach sphere of the shoulder by construction.
#   body   - the caster's feet, v forward / w up / s right: sounds and the cast fx.
#   wound  - one per victim at the victim's centre, v the way the blow came in: the hit sound and the hit spark.
#   edge   - line along the blade from the guard to the tip (v 0.3 .. 0.63), what the trail rows draw along.
apiVersion: astera/v3
kind: Skill
id: cleaver-chop
item: cleaver
meta:
  name: {ja: 大鉈の一撃, en: Cleaver Chop}
  description: {ja: "重い一撃を叩き込む。", en: "A heavy chop."}
  cooldown_ticks: 30
  resource_cost: 14
  tags: [melee, physical]
params:
  arc_deg:       {type: number, default: 90}
  range:         {type: blocks, default: 2.8}
  dmg_physical:  {type: number, default: 62}
  knockback:     {type: number, default: 0.5}
  bleed_ticks:   {type: ticks, default: 60}
frames:
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: w, to: -1}   # guard
      - {at: 0, for: 5, about: w, to: -90, ease: in_out_sine}   # raise the cleaver high at the right
      - {at: 5, for: 3, about: w, to: 0, ease: out_cubic}   # the chop: down in front
      - {at: 8, for: 6, about: w, to: -1, ease: in_out_sine}   # back to guard
      - {at: 0, for: 0, about: s, to: -33}
      - {at: 0, for: 5, about: s, to: 55, ease: in_out_sine}
      - {at: 5, for: 3, about: s, to: -35, ease: out_cubic}
      - {at: 8, for: 6, about: s, to: -33, ease: in_out_sine}
  - id: blade
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: v, to: 180}  # edge down
      - {at: 0, for: 5, about: s, to: -110, ease: in_out_sine}  # raise the point behind the head
      - {at: 5, for: 3, about: s, to: 55, ease: out_cubic}  # the cut, edge first
      - {at: 8, for: 6, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: wound
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    w_fallback: [1, 0, 0]
    s: v x w
lines:
  edge: {frame: blade, from: {v: 0.3}, to: {v: 0.63}}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 6
      then: strike
      do:
        - {id: snd_windup, op: sound, sound: item.armor.equip_iron, frame: body, volume: 0.5, pitch: 0.6}
        # weapon rig: overhead chop. One performance in the windup state, detached so it plays on through the strike and the tail:
        # drawn back over 5 ticks, the cut starts at tick 5 so the blade crosses the target zone at the hit (tick 6), then 6 ticks of follow-through.
        - {id: rig, op: rig, frame: blade, for: 14, detach: true}
    strike:
      for: 1
      then: end
      do:
        - id: strike
          op: hit
          anchor: caster.eye
          at: 0
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: react, op: react, target: event.victim, flinch: true, for: 6}
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: "${knockback}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", frame: wound, volume: 0.7, pitch: 1.2, detach: true}
              - {id: spark, op: particle_def, def: hit-spark, frame: wound, pos: {w: 0.2}, detach: true}
              - {id: bleed, op: status, target: event.victim, status: bleed, stacks: 1, for: "${bleed_ticks}", when: "= rand() < 0.5"}
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", frame: body, volume: 1.0, pitch: 0.8, detach: true}
        - {id: fx1, op: particle_def, def: slash-sweep, frame: body, pos: {v: 1.3, w: 1.52}, detach: true}
        - {id: trail, op: particle, particle: crit, along: edge, samples: 3, count: 1, extra: 0.04, at: 0, every: 1, for: 3, detach: true}
    end: {final: true}
