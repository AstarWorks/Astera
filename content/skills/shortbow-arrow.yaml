# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: shortbow-arrow

name:
  ja: "短弓の矢"
  en: "Shortbow Shot"
description:
  ja: "素早く放てる軽い矢。"
  en: "A light, quick arrow."

archetype: projectile
cooldown_ticks: 12
resource_cost: 4
tags: [ ranged, physical ]

params:
  type: projectile
  launch_speed: 2.6
  max_lifetime_ticks: 40
  visual:
    trail_spacing: 0.4
    trail:
      - type: point
        particles:
          - { id: crit, offset: { x: 0.04, y: 0.04, z: 0.04 } }
          - { id: dust, color: { r: 190, g: 160, b: 100 }, scale: 0.9 }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/sword-swing
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.3 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 0.9, height: -0.25 }
      particle_id: gun-muzzle-smoke
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 28 }
          attribute: physical
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/blade-hit
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
  hit_block:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: astera:weapons/gun-impact-block
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.5 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: hit-spark
  miss: []
  expire: []
