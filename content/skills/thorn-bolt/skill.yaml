# thorn-bolt: an earth thorn that poisons its target, on the frame grammar (ADR-0314).
#   tip - the staff head on the caster's eye/aim basis (cast puff, sound and the thorn leave it); head - the thorn body (item display + trail segment 2.4 long);
#   hit / blk - one frame per victim / block contact (the verdant impact is drawn on them). Gameplay unchanged.
# The body lives 50 ticks; the cast ends one tick after the body ends (manager ruling 10/29). Straight flight on purpose.
apiVersion: astera/v3
kind: Skill
id: thorn-bolt
item: verdant-staff
meta: {name: {ja: "茨の矢", en: "Thorn Bolt"}, description: {ja: "土属性の茨を放ち、対象を毒状態にする。", en: "Looses a thorn of earth that poisons its target."}, cooldown_ticks: 24, resource_cost: 6, tags: [ranged, earth-family, poison]}
params:
  launch_speed:       {type: number, default: 2.4}
  max_lifetime_ticks: {type: ticks, default: 50}
  dmg_earth:          {type: number, default: 23.5}
  poison_ticks:       {type: ticks, default: 80}
frames:
  - {id: tip, origin: caster.eye, v: aim, w: s x v, s: right, move: [{at: 0, for: 0, to: {v: 1.3, w: -0.3, s: 0.25}}]}
  - {id: head, origin: bolt, v: velocity, w: up, w_fallback: [1, 0, 0], s: v x w}
  - {id: hit, on: event.victim, each: true, origin: victim.center, v: incoming, w: up, w_fallback: [1, 0, 0], s: v x w}
  - {id: blk, on: event.block, each: true, origin: contact, v: incoming, w: up, w_fallback: [1, 0, 0], s: v x w}
machine:
  start: fly
  states:
    fly:
      for: 51      # = max_lifetime_ticks + 1 (a state `for` cannot read a param yet)
      then: end
      on:
        - {event: bolt.end, to: end}
      do:
        - {id: snd, op: sound, at: 0, sound: "astera:skill/wand/cast", frame: tip, volume: 0.9, pitch: 1.4}
        - {id: puff, op: particle_def, at: 0, def: verdant-cast, frame: tip}
        - id: bolt
          op: projectile
          at: 0
          frame: tip
          velocity: "= look(caster) * ${launch_speed}"
          for: "${max_lifetime_ticks}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {earth: "${dmg_earth}"}}
              - {id: st_poison, op: status, target: event.victim, status: poison, stacks: 1, for: "${poison_ticks}"}
              - {id: snd_hit, op: sound, at: 0, sound: "astera:skills/nature-impact", frame: hit, volume: 1.0, pitch: 0.7}
              - {id: burst, op: particle_def, at: 0, def: verdant-impact, frame: hit}
              - {id: sparkle, op: particle_def, at: 0, def: verdant-impact-sparkle, frame: hit}
              - {id: hit_dust, op: particle, at: 0, particle: dust, frame: hit, count: 1, color: "#3c9632", size: 1.2}
            block:
              - {id: snd_blk, op: sound, at: 0, sound: "astera:skills/nature-impact", frame: blk, volume: 0.8, pitch: 0.8}
              - {id: burst_blk, op: particle_def, at: 0, def: verdant-impact, frame: blk}
              - {id: sparkle_blk, op: particle_def, at: 0, def: verdant-impact-sparkle, frame: blk}
            expire:
              - {id: expire_fx, op: particle_def, at: 0, def: verdant-impact-sparkle, frame: head}
        - {id: thorn, op: display, kind: item, item: "minecraft:sweet_berries", context: fixed, frame: head, scale: [0.8, 0.8, 0.8], at: 0, until: bolt.end}
        - id: trail
          op: group
          at: 2   # past the caster eye view volume (CasterEyeClutter); the bolt is 2.9 blocks out by tick 1
          every: 1
          until: bolt.end
          do:
            - {id: leaf, op: particle, particle: happy_villager, frame: head, pos: {v: 0}, to: {v: -2.4}, samples: 3, count: 1, offset: [0.08, 0.08, 0.08], at: 0}
            - {id: spore, op: particle, particle: composter, frame: head, pos: {v: 0}, to: {v: -2.4}, samples: 3, count: 2, offset: [0.1, 0.1, 0.1], at: 0}
            - {id: green, op: particle, particle: dust, frame: head, pos: {v: 0}, to: {v: -2.4}, samples: 3, count: 2, offset: [0.08, 0.08, 0.08], color: "#46aa3c", size: 1.2, at: 0}
            - {id: dark, op: particle, particle: dust, frame: head, pos: {v: 0}, to: {v: -2.4}, samples: 3, count: 1, color: "#287828", size: 0.9, at: 0}
    end: {final: true}
