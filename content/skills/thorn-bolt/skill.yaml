apiVersion: astera/v3
kind: Skill
id: thorn-bolt
item: verdant-staff
meta:
  name: {ja: "茨の矢", en: "Thorn Bolt"}
  description: {ja: "土属性の茨を放ち、対象を毒状態にする。", en: "Looses a thorn of earth that poisons its target."}
  cooldown_ticks: 24
  resource_cost: 6
  tags: [ranged, earth-family, poison]
# GAP: gameplay.expose (damage <- dmg_earth, flight_speed <- launch_speed) -> none (inline literals)
# GAP: v2 vanilla emit without speed (trails happy_villager, composter) -> extra: 0 (v3 identity); v2 default not recoverable
anchors:
  - {id: muzzle, anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: flash,  anchor: caster.eye, offset: {up: -0.2, forward: 1.0}}
  - {id: foe,    anchor: victim.root}
  - {id: chest,  anchor: victim.root, offset: {up: 1.0}}
machine:
  start: fly
  states:
    fly:
      for: 55      # max flight 50 + 4 ring ticks + 1
      then: end
      do:
        - {id: snd, op: sound, sound: "astera:skill/wand/cast", anchor: caster, volume: 0.9, pitch: 1.4}
        - {id: puff, op: particle_def, def: verdant-cast, anchor: flash}
        - id: bolt
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * 2.4"
          for: 50
          radius: 0.5
          hit: {targets: enemies, once: true}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, components: [{kind: earth, amount: 23.5}]}
              - {id: st_poison, op: status, target: event.victim, status: poison, stacks: 1, for: 80}
              - {id: snd_hit, op: sound, sound: "astera:skills/nature-impact", anchor: foe, volume: 1.0, pitch: 0.7}
              - {id: fx_hit, op: particle_def, def: verdant-impact, anchor: chest}
              - {id: fx_hit_2, op: particle_def, def: verdant-impact-sparkle, anchor: chest}
              # GAP: four jagged dust lines #3c9632 size 1.2, length 1.4, 10 points each, random axis per cast and +-0.2 jitter per point (roll/draw_unit/plane_a/plane_b) -> none (no per-cast shared random axis)
              # expanding composter ring at ticks 0..3 after the hit, radius 0.3 + (1.3 / 3) * k, 10 emits
              # GAP: v2 ring plane is a random per-cast axis (draw_unit) with random phase (draw) and `shift` position -> horizontal plane, phase 0, anchor {of, offset}
              - id: ring
                at: 0
                every: 1
                times: 4
                do:
                  - {id: spray, op: particle, particle: composter, times: 10, at: 0, count: 0, offset: "= [cos(6.283185307179586 * i / 10), 0.0, -sin(6.283185307179586 * i / 10)]", extra: 0.04, anchor: {of: chest, offset: {left: "= (0.3 + 1.3 / 3 * parent.i) * cos(6.283185307179586 * i / 10)", forward: "= -(0.3 + 1.3 / 3 * parent.i) * sin(6.283185307179586 * i / 10)"}}}
            block:
              - {id: snd_blk, op: sound, sound: "astera:skills/nature-impact", anchor: contact.point, volume: 0.8, pitch: 0.8}
              - {id: fx_blk, op: particle_def, def: verdant-impact, anchor: contact.point}
            expire:
              - {id: fx_exp, op: particle_def, def: verdant-impact-sparkle, anchor: contact.point}
        - {id: trail,   op: particle, particle: happy_villager, anchor: {of: bolt, sweep: 0.3}, count: 1, offset: [0.08, 0.08, 0.08], at: 0, every: 1, until: bolt.end}
        - {id: trail_2, op: particle, particle: composter,      anchor: {of: bolt, sweep: 0.3}, count: 2, offset: [0.1, 0.1, 0.1], at: 0, every: 1, until: bolt.end}
        - {id: trail_3, op: particle, particle: dust,           anchor: {of: bolt, sweep: 0.3}, count: 2, offset: [0.08, 0.08, 0.08], color: "#46aa3c", size: 1.2, at: 0, every: 1, until: bolt.end}
        # GAP: trail jagged dust line #287828 size 0.9 (7 points per tick, length 0.7, random axis per tick, +-0.15 jitter; roll/roll_unit/plane_a/plane_b) -> none
    end: {final: true}
