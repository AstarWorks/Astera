# Sigil Rifle S2 (right-click) "Dash-Cut": the sniper's close-range answer. A 6-block invulnerable slide
# leaving dark afterimages; the first enemy touched takes a cut on contact (4) and the crescent follow-up
# 6 ticks later (5, ignores i-frames). Each cut leaves a Sinking stack (+0.8 per stack already there).
# ~9 phys total; the slide is the mobility and the stacks feed S3.

id: sigil-rifle-s2

name:
  ja: "刻印の滑走斬り"
  en: "Dash-Cut"
description:
  ja: "残像を引いて滑り込み、最初に触れた敵を二段で斬る。斬られた敵には沈降の刻印が残る。"
  en: "Slide through leaving afterimages and cut the first enemy touched twice, leaving Sinking sigils."

archetype: buff
cooldown_ticks: 80
resource_cost: 25              # energy
tags: [ buff, movement, physical, sinking ]

params:
  type: buff
  status_effect_id: evasive
  duration_ticks: 12

phases:
  type: buff
  cast:
    - type: play_vfx
      targets: { type: caster }
      vfx_id: sigil-rifle-dash
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.sweep
      pitch: { type: literal, value: 1.2 }
    - type: dash_strike
      distance: 6.0
      ticks: 4
      radius: 1.2
      hit_once: true
      invulnerable: true
      stop_on_block: true
      on_hit:
        - type: damage
          targets: { type: target }
          components:
            - base: { type: literal, value: 4.0 }
              attribute: physical
              per_stack: { status_id: sinking, amount: 0.8, on: target }
        - type: apply_status
          targets: { type: target }
          status_id: sinking
          effect_duration_ticks: { type: literal, value: 160 }
        - type: play_vfx
          targets: { type: target }
          vfx_id: sigil-rifle-mark
        - type: play_sound
          targets: { type: target }
          sound_id: entity.player.attack.crit
          pitch: { type: literal, value: 1.3 }
        # follow-up crescent, six ticks later
        - type: damage
          targets: { type: target }
          ignore_invulnerability: { type: literal, value: true }
          delay_ticks: { type: literal, value: 6 }
          components:
            - base: { type: literal, value: 5.0 }
              attribute: physical
              per_stack: { status_id: sinking, amount: 0.8, on: target }
        - type: apply_status
          targets: { type: target }
          status_id: sinking
          effect_duration_ticks: { type: literal, value: 160 }
          delay_ticks: { type: literal, value: 6 }
        - type: hit_stop
          targets: { type: target }
          ticks: 3
          include_caster: true
          delay_ticks: { type: literal, value: 6 }
        - type: camera_shake
          targets: { type: caster }
          intensity: { type: literal, value: 0.3 }
          ticks: { type: literal, value: 4 }
          delay_ticks: { type: literal, value: 6 }
        - type: play_sound
          targets: { type: target }
          sound_id: entity.player.attack.sweep
          pitch: { type: literal, value: 0.9 }
          delay_ticks: { type: literal, value: 6 }
  expire: []
  removed: []
