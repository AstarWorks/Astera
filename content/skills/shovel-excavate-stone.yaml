# Match arsenal (wp/match-arsenal): simple PvP skill. One cast sound, a few particles.

id: shovel-excavate-stone

name:
  ja: "石の掘削"
  en: "Stone Excavate"
description:
  ja: "目の前の柔らかいブロックを箱形にえぐる。"
  en: "Digs out a box of soft blocks in front of you."

archetype: sequence
cooldown_ticks: 140
resource_cost: 0
tags: [ tool, cover ]

params:
  type: sequence

phases:
  type: sequence
  cast:
    - type: break_area
      shape: box
      width: 3
      height: 2
      length: 3
      power: 1
      tool_class: SHOVEL
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/gun-impact-block
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 0.7 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 2.0, height: 0.0 }
      particle_id: hit-spark
