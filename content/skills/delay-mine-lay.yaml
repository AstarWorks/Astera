# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: delay-mine-lay

name:
  ja: "地雷設置"
  en: "Lay Mine"
description:
  ja: "目の前に地雷を置く。少し後に爆発する。"
  en: "Plants a mine ahead that detonates after a short delay."

archetype: sequence
cooldown_ticks: 160
resource_cost: 10
tags: [ utility, explosive, zone ]

params:
  type: sequence

phases:
  type: sequence
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: block.stone_pressure_plate.click_on
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 0.8 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 2.5, height: 0.1 }
      particle_id: gun-smoke
    - type: explode
      targets: { type: caster_forward, distance: 2.5, height: 0.0 }
      power: { type: literal, value: 1.0 }
      radius: { type: literal, value: 2.5 }
      break_blocks: { type: literal, value: false }
      delay_ticks: { type: literal, value: 50 }
      snapshot_pose: true
      components:
        - base: { type: literal, value: 55.0 }
          attribute: physical
