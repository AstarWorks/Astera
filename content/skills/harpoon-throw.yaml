# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: harpoon-throw

name:
  ja: "銛"
  en: "Harpoon"
description:
  ja: "銛を投げ、当たった相手を引き寄せる。"
  en: "Hurls a harpoon and reels the target in."

archetype: projectile
cooldown_ticks: 100
resource_cost: 10
tags: [ ranged, physical, control ]

params:
  type: projectile
  launch_speed: 2.2
  max_lifetime_ticks: 40
  visual:
    trail_spacing: 0.4
    trail:
      - type: point
        particles:
          - { id: crit, offset: { x: 0.03, y: 0.03, z: 0.03 } }
          - { id: dust, color: { r: 90, g: 190, b: 200 }, scale: 1.0 }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: item.trident.throw
      volume: { type: literal, value: 0.9 }
      pitch: { type: literal, value: 1.0 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 0.9, height: -0.25 }
      particle_id: hit-spark
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 18 }
          attribute: physical
    - type: knockback
      targets: { type: target }
      direction: { type: toward_caster, vertical: 0.2 }
      strength: { type: literal, value: 1.4 }
    - type: play_sound
      targets: { type: target }
      sound_id: item.trident.hit
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 1.0 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
  hit_block:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: astera:weapons/gun-impact-block
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.5 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: hit-spark
  miss: []
  expire: []
