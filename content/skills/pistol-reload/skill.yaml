# v3 hand port of the v2 skill (ADR-0303 rev4.2). v2 params {reloading_ticks: 30}; v2 `schedule after 30 event buff_end` is the state timer.
apiVersion: astera/v3
kind: Skill
id: pistol-reload
item: pistol
meta: {name: {ja: "リロード", en: Reload}, description: {ja: "銃を再装填する。短時間動きが鈍る。", en: "Reloads the gun. Slows you briefly."}, cooldown_ticks: 30, resource_cost: 0, reload_ticks: 30, tags: [gun, reload]}
# GAP: v2 expose {duration <- reloading_ticks} -> none (no expose spelling for cast skills); literal 30 inlined.
# NOTE: meta.reload_ticks is kept as in v2 (no v3 spec for it).
anchors:
  - {id: click, anchor: caster.eye, offset: {up: -0.3, forward: 0.7}, mode: snapshot}   # was pt_aim_0_m0p3_0p7
machine:
  start: reloading
  states:
    reloading:
      for: 30                        # was status duration 30 + schedule after 30 -> buff_end
      then: ready
      enter:
        - {id: buff, op: status, target: caster, status: reloading, stacks: 1, for: 30}   # stacks: 1 assumed (v2 had no stacks field)
        - {id: snd, op: sound, sound: "astera:weapons/gun-reload-start", anchor: caster, volume: 0.7, pitch: 1.3}
        - {id: click0, op: particle_def, def: reload-click, anchor: click}
    ready:                           # was on buff_end
      for: 1
      then: end
      enter:
        - {id: snd_end, op: sound, sound: "astera:weapons/gun-reload-end", anchor: caster, volume: 0.5, pitch: 1.7}
        - {id: click1, op: particle_def, def: reload-click, anchor: click}
    end: {final: true}
