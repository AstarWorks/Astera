# pistol-reload: a 30-tick reload window (the reloading status and the state share the length; state "for" takes no param, so both are literal).
apiVersion: astera/v3
kind: Skill
id: pistol-reload
item: pistol
meta:
  name: {ja: "リロード", en: Reload}
  description: {ja: "銃を再装填する。短時間動きが鈍る。", en: "Reloads the gun. Slows you briefly."}
  cooldown_ticks: 30
  resource_cost: 0
  reload_ticks: 30
  tags: [gun, reload]
anchors:
  - {id: click, anchor: caster.eye, offset: {up: -0.3, forward: 0.7}, mode: snapshot}
machine:
  start: reloading
  states:
    reloading:
      for: 30
      then: ready
      enter:
        - {id: buff, op: status, target: caster, status: reloading, stacks: 1, for: 30}
        - {id: snd, op: sound, sound: "astera:weapons/gun-reload-start", anchor: caster, volume: 0.7, pitch: 1.3}
        - {id: click0, op: particle_def, def: reload-click, anchor: click}
    ready:
      for: 1
      then: end
      enter:
        - {id: snd_end, op: sound, sound: "astera:weapons/gun-reload-end", anchor: caster, volume: 0.5, pitch: 1.7}
        - {id: click1, op: particle_def, def: reload-click, anchor: click}
    end: {final: true}
