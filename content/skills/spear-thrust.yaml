# Match arsenal (wp/match-arsenal): simple PvP skill. One cast sound, a few particles.

id: spear-thrust

name:
  ja: "突き"
  en: "Thrust"
description:
  ja: "長い間合いで細く突く。"
  en: "A long, narrow thrust."

archetype: melee
cooldown_ticks: 12
resource_cost: 6
tags: [ melee, physical ]

params:
  type: melee
  range: 4.2
  arc_degrees: 30.0
  knockback: 0.2
  damage:
    - base: { type: literal, value: 34.0 }
      attribute: physical

phases:
  type: melee
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/sword-swing
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 1.5 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.4, height: -0.2 }
      particle_id: stab-spark
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/blade-hit
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
  miss: []
