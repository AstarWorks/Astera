# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: frag-grenade-throw

name:
  ja: "破片手榴弾"
  en: "Frag Grenade"
description:
  ja: "投げつけると破片をまき散らし、周囲を少し傷つける。"
  en: "Bursts into shrapnel and chips nearby blocks."

archetype: projectile
cooldown_ticks: 140
resource_cost: 0
tags: [ ranged, explosive, physical ]
block_damage:
  amount: 35
  radius: 1.5

params:
  type: projectile
  launch_speed: 1.4
  max_lifetime_ticks: 60
  visual:
    trail_spacing: 0.4
    trail:
      - type: point
        particles:
          - { id: smoke, offset: { x: 0.04, y: 0.04, z: 0.04 } }
          - { id: crit, offset: { x: 0.04, y: 0.04, z: 0.04 } }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.snowball.throw
      volume: { type: literal, value: 0.9 }
      pitch: { type: literal, value: 0.7 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 0.9, height: -0.25 }
      particle_id: gun-muzzle-smoke
  hit_entity:
    - type: explode
      targets: { type: target }
      power: { type: literal, value: 1.3 }
      radius: { type: literal, value: 3.5 }
      break_blocks: { type: literal, value: false }
      components:
        - base: { type: literal, value: 35.0 }
          attribute: physical
    - type: apply_status
      targets: { type: enemies, center: { type: target }, radius: { type: literal, value: 3.5 } }
      status_id: bleed
      effect_duration_ticks: { type: literal, value: 20 }
    - type: play_sound
      targets: { type: target }
      sound_id: entity.generic.explode
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
  hit_block:
    - type: explode
      targets: { type: hit_location }
      power: { type: literal, value: 1.3 }
      radius: { type: literal, value: 3.5 }
      break_blocks: { type: literal, value: false }
      components:
        - base: { type: literal, value: 35.0 }
          attribute: physical
    - type: apply_status
      targets: { type: enemies, center: { type: hit_location }, radius: { type: literal, value: 3.5 } }
      status_id: bleed
      effect_duration_ticks: { type: literal, value: 20 }
    - type: play_sound
      targets: { type: hit_location }
      sound_id: entity.generic.explode
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: hit-spark
  miss: []
  expire: []
