apiVersion: astera/v3
kind: Skill
id: axe-plank-wall-iron
item: iron-axe
meta:
  name: {ja: 鉄の板壁, en: Iron Plank Wall}
  description: {ja: "目の前に補強板の壁を築く。", en: "Raises a wall of reinforced planks in front of you."}
  cooldown_ticks: 300
  resource_cost: 0
  tags: [tool, cover]
anchors:
  - {id: aim, anchor: caster.eye, offset: {forward: 2.0}}
machine:
  start: place
  states:
    place:
      for: 1
      then: end
      do:
        - {id: wall, op: place_shape, at: 0, anchor: caster, shape: {wall: {width: 5, height: 3}}, block: "astera:reinforced_planks", consume: none, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, at: 0, sound: "astera:weapons/gun-impact-block", anchor: caster, volume: 1.0, pitch: 0.9}
        - {id: spark, op: particle_def, at: 0, def: hit-spark, anchor: aim}
    end: {final: true}
