apiVersion: astera/v3
kind: Skill
id: axe-plank-wall-iron
item: iron-axe
meta:
  name: {ja: 鉄の板壁, en: Iron Plank Wall}
  description: {ja: "目の前に補強板の壁を築く。", en: "Raises a wall of reinforced planks in front of you."}
  cooldown_ticks: 300
  resource_cost: 0
  tags: [tool, cover]
anchors:
  - {id: aim_pt, anchor: caster, offset: {forward: 2.0}, mode: follow}   # was pt_caster_0_0_2 (caster feet, yaw-only)
machine:
  start: place
  states:
    place:
      for: 1
      then: end
      do:
        - {id: wall, op: place_shape, at: 0, anchor: caster, shape: {wall: {width: 5, height: 3}}, block: "astera:reinforced_planks", consume: none, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, at: 0, sound: item.axe.strip, anchor: caster, volume: 1.0, pitch: 0.7}
        - {id: snd_2, op: sound, at: 0, sound: block.wood.break, anchor: caster, volume: 0.9, pitch: 0.8}
        - {id: snd_3, op: sound, at: 0, sound: entity.player.attack.strong, anchor: caster, volume: 0.6, pitch: 0.9}
        - {id: spark, op: particle_def, at: 0, def: tool-axe-iron, anchor: aim_pt}
    end: {final: true}
