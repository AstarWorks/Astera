apiVersion: "astera/v3"
kind: Skill
id: gale-gust
item: gale-fan
meta: {name: {ja: "突風", en: Gust}, description: {ja: "前方の敵を強く押し返す。", en: "Blows enemies in front of you away."}, cooldown_ticks: 70, resource_cost: 12, tags: [magic, wind, control]}
anchors:
  cast_fx: {anchor: caster.eye, offset: {forward: 1.5}, mode: snapshot}
presentation:
  timeline:
    - at: 0
      do:
        - {id: snd, op: sound, sound: entity.breeze.wind_burst, anchor: caster, volume: 0.9, pitch: 1.2}
        - {id: fx, op: particle_def, def: dash-cloud, anchor: cast_fx}
gameplay:
  timeline:
    - at: 0
      do:
        - id: sel
          op: hit
          anchor: caster.eye
          targets: enemies
          shape: {sector: {deg: 80, range: 6.0, height: 2.0}}
          damage: {physical: 10.0}
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(flat(pos(event.victim) - pos(caster))) + vec(0.0, 0.2, 0.0)", strength: 1.6}
