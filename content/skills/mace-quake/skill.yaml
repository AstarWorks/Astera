          offset: [0, 0, 0]
          shift: "= vec((0.5 + 0.6 * 1) * cos(6.283185307179586 * i / 16 + draw('shape_ph') * 6.283185307179586), 0.0, -(0.5 + 0.6 * 1) * sin(6.283185307179586 * i / 16 + draw('shape_ph') * 6.283185307179586))"
