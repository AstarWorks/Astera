# mace-quake: ground quake: a slam in front of the caster and a shockwave ring around it (instant, no wind-up).
# Frames (ADR-0314): the skill moves no weapon, so there is no blade frame; only the places the sounds and fx land are frames:
#   body   - the caster's feet, v forward / w up / s right: the quake fx: `ground` (w 0.15) is the centre of the shockwave rings, `slam` (1.6 ahead, w 0.15) is the crater.
#   wound  - one per victim at the victim's centre, v the way the blow came in: the hit spark and the hit sound (only where the skill hits).
apiVersion: astera/v3
kind: Skill
id: mace-quake
item: mace
meta:
  name: {ja: "大地震", en: Quake}
  description: {ja: "地面を叩き、周囲の敵を揺さぶる。", en: "Slams the ground, shaking everyone nearby."}
  cooldown_ticks: 150
  resource_cost: 18
  tags: [aoe, physical]
params:
  radius: {type: blocks, default: 3.5}
  dmg_physical: {type: number, default: 30.0}
  tremor_ticks: {type: ticks, default: 60}
frames:
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: wound
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
machine:
  start: quake
  states:
    quake:
      for: 1
      then: end
      enter:
        - {id: snd_quake, op: sound, sound: "astera:weapons/blade-heavy-swing", frame: body, volume: 1.0, pitch: 0.6}
        - {id: snd_thud, op: sound, sound: "astera:weapons/gun-impact-block", frame: body, pos: {v: 1.6, w: 0.15}, volume: 1.0, pitch: 0.5}
        - {id: snd_crack, op: sound, sound: "astera:weapons/blade-crit", frame: body, pos: {v: 1.6, w: 0.15}, volume: 0.8, pitch: 0.55}
        - id: burst
          op: hit
          anchor: caster
          at: 0
          shape: {sphere: "${radius}"}
          targets: enemies
          max_count: all
          window: once
          ignore_invulnerability: false
          damage: {physical: "= ${dmg_physical} * (1.0 - 0.5 * dist(event.victim, caster) / ${radius})"}
          on:
            hit:
              - {id: st_tremor, op: status, target: event.victim, status: tremor, stacks: 1, for: "${tremor_ticks}"}
              - {id: fx_hit_crit, op: particle, particle: crit, frame: wound, pos: {w: 0.2}, count: 10, offset: [0.3, 0.4, 0.3], extra: 0.25, at: 0}
              - {id: fx_hit_dust, op: particle, particle: dust, frame: wound, pos: {w: 0.2}, count: 6, offset: [0.3, 0.4, 0.3], color: "#96785a", size: 1.2, at: 0}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", frame: wound, volume: 0.7, pitch: 1.0}
      do:
        # --- ground slam in front of the caster: cracked-earth burst, a dust puff, then the shockwave ring flung out over the ground plane (fast inner ring, slower outer ring, a lifted debris ring) ---
        - {id: fx_crack, op: particle, particle: block, block: "minecraft:coarse_dirt", frame: body, pos: {v: 1.6, w: 0.15}, at: 0, count: 40, offset: [0.5, 0.15, 0.5], extra: 0.12}
        - {id: fx_stone, op: particle, particle: block, block: "minecraft:stone", frame: body, pos: {v: 1.6, w: 0.15}, at: 0, count: 20, offset: [0.4, 0.3, 0.4], extra: 0.2}
        - {id: fx_dust, op: particle, particle: dust, frame: body, pos: {v: 1.6, w: 0.15}, at: 0, count: 8, offset: [0.5, 0.2, 0.5], color: "#96785a", size: 1.6}
        - {id: fx_core, op: particle, particle: crit, frame: body, pos: {v: 1.6, w: 0.15}, at: 0, count: 12, offset: [0.3, 0.1, 0.3], extra: 0.3}
        - {id: wave_fast, op: particle, particle: block, block: "minecraft:coarse_dirt", frame: body, pos: {w: 0.15}, times: 32, at: 0, count: 0, offset: "= vec(cos(i * 2 * pi / 32), 0.0, sin(i * 2 * pi / 32))", extra: 0.55}
        - {id: wave_slow, op: particle, particle: block, block: "minecraft:dirt", frame: body, pos: {w: 0.15}, times: 24, at: 0, count: 0, offset: "= vec(cos(i * 2 * pi / 24), 0.0, sin(i * 2 * pi / 24))", extra: 0.35}
        - {id: ring_dust, op: particle, particle: dust, frame: body, pos: {w: 0.15}, at: 0, count: 8, offset: [1.6, 0.1, 1.6], color: "#a6a6a6", size: 0.5}
        - {id: wave_debris, op: particle, particle: block, block: "minecraft:stone", frame: body, pos: {w: 0.15}, times: 12, at: 0, count: 0, offset: "= vec(0.7 * cos(i * 2 * pi / 12), 0.8, 0.7 * sin(i * 2 * pi / 12))", extra: 0.3}
        # impact weight: a crater flash, a big debris fountain and a wider, faster outer ring flung out beyond the first
        - {id: wave_flash, op: particle, particle: crit, frame: body, pos: {v: 1.6, w: 0.15}, times: 16, at: 0, count: 0, offset: "= vec(cos(i * 2 * pi / 16), 0.0, sin(i * 2 * pi / 16))", extra: 0.5}
        - {id: fx_plume, op: particle, particle: dust, frame: body, pos: {v: 1.6, w: 0.15}, at: 0, count: 4, offset: [0.45, 0.1, 0.45], color: "#7a7a7a", size: 0.5}
        - {id: fx_plume_mid, op: particle, particle: dust, frame: body, pos: {v: 1.6, w: 0.55}, at: 0, count: 3, offset: [0.55, 0.15, 0.55], color: "#a6a6a6", size: 0.5}
        - {id: fx_plume_top, op: particle, particle: dust, frame: body, pos: {v: 1.6, w: 1.0}, at: 0, count: 2, offset: [0.65, 0.2, 0.65], color: "#96785a", size: 0.5}
        - {id: fx_fountain, op: particle, particle: block, block: "minecraft:stone", frame: body, pos: {v: 1.6, w: 0.15}, at: 0, count: 36, offset: [0.35, 0.7, 0.35], extra: 0.45}
        - {id: fx_clods, op: particle, particle: block, block: "minecraft:coarse_dirt", frame: body, pos: {v: 1.6, w: 0.15}, at: 0, count: 24, offset: [0.5, 0.5, 0.5], extra: 0.3}
        - {id: wave_outer, op: particle, particle: block, block: "minecraft:coarse_dirt", frame: body, pos: {w: 0.15}, times: 40, at: 0, count: 0, offset: "= vec(cos(i * 2 * pi / 40), 0.0, sin(i * 2 * pi / 40))", extra: 0.8}
        - {id: ring_dust_outer, op: particle, particle: dust, frame: body, pos: {w: 0.15}, at: 0, count: 8, offset: [3.0, 0.1, 3.0], color: "#7a7a7a", size: 0.5}
    end: {final: true}
