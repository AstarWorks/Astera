# Wave 2 v3 draft (basic-ac): ported 1:1 from the v2 skill.yaml + look.yaml. GAP comments mark what v3 cannot spell yet.
apiVersion: astera/v3
kind: Skill
id: mace-quake
item: mace
meta:
  name: {ja: "大地震", en: Quake}
  description: {ja: "地面を叩き、周囲の敵を揺さぶる。", en: "Slams the ground, shaking everyone nearby."}
  cooldown_ticks: 150
  resource_cost: 18
  tags: [aoe, physical]
params:
  radius: {type: blocks, default: 3.5}
  dmg_physical: {type: number, default: 30.0}
  tremor_ticks: {type: ticks, default: 60}
anchors:
  - {id: ground, anchor: caster, offset: {up: 0.15}, mode: snapshot}                 # was pt_caster_0_0p15_0
machine:
  start: quake
  states:
    quake:
      for: 6
      then: end
      enter:
        - {id: snd_quake, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 1.0, pitch: 0.6}
        # GAP(Q1): max_count spelling (A: required int|all, B: optional); v2 had no cap, so `all` = unlimited.
        - id: burst
          op: hit
          anchor: caster
          at: 0
          shape: {sphere: "${radius}"}
          targets: enemies
          max_count: all
          window: once
          ignore_invulnerability: false
          damage: {physical: "= dmg_physical * (1.0 - 0.5 * dist(event.victim, caster) / radius)"}
          on:
            hit:
              - {id: st_tremor, op: status, target: event.victim, status: tremor, stacks: 1, for: "= tremor_ticks"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.0}
      do:
        # six expanding rings, ticks 0..5, radius 0.5 + 0.6 * k (0.5 .. 3.5); one random phase per cast (v2 draw('shape_ph')).
        # Unrolled per wave k: a state `do` does not accept a timing group (engine gap, PartParser.ops).
        - id: ring_crit_0
          op: particle
          particle: crit
          anchor: ground
          at: 0
          times: 16
          count: 0
          offset: "= vec(cos(6.283185307179586 * i / 16), 0.0, -sin(6.283185307179586 * i / 16))"
          shift: "= vec((0.5 + 0.6 * 0) * cos(6.283185307179586 * i / 16 + draw('shape_ph') * 6.283185307179586), 0.0, -(0.5 + 0.6 * 0) * sin(6.283185307179586 * i / 16 + draw('shape_ph') * 6.283185307179586))"
          extra: 0.03
        - id: ring_dust_0
          op: particle
          particle: dust
          anchor: ground
          at: 0
          times: 16
          count: 1
          offset: [0, 0, 0]
          shift: "= vec((0.5 + 0.6 * 0) * cos(6.283185307179586 * i / 16 + draw('shape_ph') * 6.283185307179586), 0.0, -(0.5 + 0.6 * 0) * sin(6.283185307179586 * i / 16 + draw('shape_ph') * 6.283185307179586))"
          extra: 0
          color: "#96785a"
          size: 1.4
        - id: ring_crit_1
          op: particle
          particle: crit
          anchor: ground
          at: 1
          times: 16
          count: 0
          offset: "= vec(cos(6.283185307179586 * i / 16), 0.0, -sin(6.283185307179586 * i / 16))"
          shift: "= vec((0.5 + 0.6 * 1) * cos(6.283185307179586 * i / 16 + draw('shape_ph') * 6.283185307179586), 0.0, -(0.5 + 0.6 * 1) * sin(6.283185307179586 * i / 16 + draw('shape_ph') * 6.283185307179586))"
          extra: 0.03
        - id: ring_dust_1
