# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: shield-bash

name:
  ja: "シールドバッシュ"
  en: "Shield Bash"
description:
  ja: "盾で殴り、相手を弾き飛ばす。"
  en: "Bashes with the shield and shoves the target back."

archetype: melee
cooldown_ticks: 50
resource_cost: 8
tags: [ melee, control, physical ]

params:
  type: melee
  range: 2.6
  arc_degrees: 70.0
  knockback: 1.3
  damage:
    - base: { type: literal, value: 18.0 }
      attribute: physical

phases:
  type: melee
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: item.shield.block
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 0.9 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.3, height: 0.0 }
      particle_id: hit-spark
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/blade-hit
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
    - type: apply_status
      targets: { type: target }
      status_id: tremor
      effect_duration_ticks: { type: literal, value: 40 }
  miss: []
