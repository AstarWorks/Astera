# Wave H 5content-depth (ADR-0125): ice-family single-target projectile.
#
# Pairs frost (ice) attribute damage with a freeze status that slows the
# target's movement. Lower cooldown + lower damage than fire spells —
# the kit's reliable poke option.

id: frost-shard

name:
  ja: "氷の刃"
  en: "Frost Shard"
description:
  ja: "氷属性の鋭い破片を放ち、対象の動きを鈍らせる。"
  en: "Hurls a piercing shard of ice that chills its target on impact."

archetype: projectile
cooldown_ticks: 30
resource_cost: 8               # energy
tags: [ ranged, ice-family, slow ]
# ADR-0280: flat chip where the shard lands (opt-in; cover has 200-500 HP, weapons only chip).
block_damage:
  amount: 10

params:
  type: projectile
  launch_speed: 2.2
  max_lifetime_ticks: 50
  visual:
    # Budget: ~7 particles per 0.3-block sample, ~7 samples/tick => ~50 spawns/tick in flight.
    trail_spacing: 0.3
    trail:
      - type: point
        particles:
          - { id: snowflake, count: 2, extra: 0.01, offset: { x: 0.08, y: 0.08, z: 0.08 } }
          - { id: dust, count: 2, offset: { x: 0.06, y: 0.06, z: 0.06 }, color: { r: 235, g: 245, b: 255 }, scale: 0.9 }
          - { id: end_rod, offset: { x: 0.02, y: 0.02, z: 0.02 } }
    display: { variant: item, material: minecraft:prismarine_shard, scale: 0.9 }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:skills/frost-cast
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 1.4 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.0, height: -0.2 }
      particle_id: frost-cast
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 25.0 }
          attribute: water
    - type: apply_status
      targets: { type: target }
      status_id: freeze
      effect_duration_ticks: { type: literal, value: 60 }
      chance: { type: literal, value: 0.70 }
    # Soaks the target: a follow-up shock doubles the wet slow (status-effect-interactions).
    - type: apply_status
      targets: { type: target }
      status_id: wet
      effect_duration_ticks: { type: literal, value: 100 }
    - type: play_sound
      targets: { type: target }
      sound_id: astera:skills/frost-impact
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.5 }
    # Shatter: crystal burst + a small ring (~60 + 4 x 12 x 2 = ~160 spawns once).
    - type: schedule_particle_animation
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.0, z: 0.0 } } }
      animation:
        - type: point
          particles:
            - { id: snowflake, count: 30, extra: 0.15 }
            - { id: end_rod, count: 10, extra: 0.2 }
            - { id: dust, count: 20, extra: 0.0, color: { r: 190, g: 230, b: 255 }, scale: 1.4, offset: { x: 0.4, y: 0.4, z: 0.4 } }
        - type: ring
          period_ticks: 4
          points: 12
          start_radius: 0.3
          end_radius: 1.4
          angle: random
          particles:
            - { id: snowflake, count: 0, extra: 0.04 }
            - { id: dust, color: { r: 190, g: 230, b: 255 }, scale: 1.3 }
  hit_block:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: astera:skills/frost-impact
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.6 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: frost-impact
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: frost-impact-dust
  miss: []
  expire:
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: frost-impact
