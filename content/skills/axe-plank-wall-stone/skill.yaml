apiVersion: astera/v3
kind: Skill
id: axe-plank-wall-stone
item: stone-axe
meta:
  name: {ja: 石の板壁, en: Stone Plank Wall}
  description: {ja: "目の前に補強板の壁を築く。", en: "Raises a wall of reinforced planks in front of you."}
  cooldown_ticks: 400
  resource_cost: 0
  tags: [tool, cover]
anchors:
  - {id: aim, anchor: caster.eye, offset: {forward: 2.0}}
presentation:
  timeline:
    - id: place
      at: 0
      do:
        - {id: snd, op: sound, sound: "astera:weapons/gun-impact-block", anchor: caster, volume: 1.0, pitch: 0.9}
        - {id: spark, op: emit, effect: hit-spark, anchor: aim}
machine:
  start: cast
  states:
    cast:
      for: 1
      then: done
      enter:
        - {id: wall, op: place_shape, at: 0, anchor: caster, shape: {wall: {width: 3, height: 2}}, block: "astera:reinforced_planks", consume: none, ripple: 29, revert: 200, outside_arena: false}
    done: {final: true}
