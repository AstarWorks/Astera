# Raises a wall of reinforced planks in front of the caster; the tiers differ in wall size. Base of the axe-plank-wall tiers (this is the stone tier);
# axe-plank-wall-iron / -diamond extend it (ADR-0303 9.3): same document, other id / item / meta and the `with:` values below.
apiVersion: astera/v3
kind: Skill
id: axe-plank-wall-stone
item: stone-axe
meta:
  name: {ja: "石の板壁", en: "Stone Plank Wall"}
  description: {ja: "目の前に補強板の壁を築く。", en: "Raises a wall of reinforced planks in front of you."}
  cooldown_ticks: 400
  resource_cost: 0
  tags: [tool, cover]
params:
  width: {type: number, default: 3}
  height: {type: number, default: 2}
  strip_pitch: {type: number, default: 0.8}
  break_vol: {type: number, default: 0.8}
  break_pitch: {type: number, default: 0.9}
  strong: {type: bool, default: false}
  crit: {type: bool, default: false}
  spark: {type: string, default: tool-axe-stone}
anchors:
  - {id: aim_pt, anchor: caster, offset: {forward: 2.0}, mode: follow}
machine:
  start: cast
  states:
    cast:
      for: 1
      then: end
      do:
        - {id: wall, op: place_shape, anchor: caster, shape: {wall: {width: "${width}", height: "${height}"}}, block: "astera:reinforced_planks", consume: none, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, sound: item.axe.strip, anchor: caster, volume: 1.0, pitch: "${strip_pitch}"}
        - {id: snd_2, op: sound, sound: block.wood.break, anchor: caster, volume: "${break_vol}", pitch: "${break_pitch}"}
        - {id: snd_3, op: sound, sound: entity.player.attack.strong, anchor: caster, volume: 0.6, pitch: 0.9, when: "= ${strong}"}
        - {id: snd_4, op: sound, sound: entity.player.attack.crit, anchor: caster, volume: 0.8, pitch: 0.9, when: "= ${crit}"}
        - {id: spark, op: particle_def, def: "${spark}", anchor: aim_pt}
    end: {final: true}
