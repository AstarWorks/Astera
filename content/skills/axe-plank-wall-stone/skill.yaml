apiVersion: astera/v3
kind: Skill
id: axe-plank-wall-stone
item: stone-axe
meta:
  name: {ja: 石の板壁, en: Stone Plank Wall}
  description: {ja: "目の前に補強板の壁を築く。", en: "Raises a wall of reinforced planks in front of you."}
  cooldown_ticks: 400
  resource_cost: 0
  tags: [tool, cover]
anchors:
  - {id: aim_pt, anchor: caster, offset: {forward: 2.0}}
machine:
  start: cast
  states:
    cast:
      start: place
      do:
        - {id: snd, op: sound, sound: item.axe.strip, anchor: caster, volume: 1.0, pitch: 0.8}
        - {id: snd_2, op: sound, sound: block.wood.break, anchor: caster, volume: 0.8, pitch: 0.9}
        - {id: spark, op: particle_def, def: tool-axe-stone, anchor: aim_pt}
      on:
        - {event: end, to: done}
      states:
        place:
          for: 1
          then: recover
          enter:
            - {id: wall, op: place_shape, at: 0, anchor: caster, shape: {wall: {width: 3, height: 2}}, block: "astera:reinforced_planks", consume: none, ripple: 29, revert: 200, outside_arena: false}
        recover: {final: true}
    done: {final: true}
