# Hand-authored tool presentation. Mechanical shape / timing / damage / cooldown stay unchanged.
# Dust uses typical tool material; no per-cell surface data is exposed to presentation rows.
apiVersion: astera/v3
kind: Skill
id: axe-plank-wall-stone
item: stone-axe
meta:
  name: {ja: "石の板壁", en: "Stone Plank Wall"}
  description: {ja: "目の前に補強板の壁を築く。", en: "Raises a wall of reinforced planks in front of you."}
  cooldown_ticks: 400
  resource_cost: 0
  tags: [tool, cover]
params:
  width: {type: number, default: 3}
  height: {type: number, default: 2}
  trail_span: {type: number, default: 6}
  splinters: {type: number, default: 8}
  chips: {type: number, default: 3}
  core_color: {type: string, default: "#9e7545"}
  core_size: {type: number, default: 0.3}
  arc_height: {type: number, default: 0.8}
  arc_depth: {type: number, default: 0.55}
  arc_size: {type: number, default: 0.7}
  arc_samples: {type: number, default: 21}
  arc_count: {type: number, default: 2}
  arc_color: {type: string, default: "#dfba7a"}
  sweep_layers: {type: number, default: 1}
frames:
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: w, to: 0}
      - {at: 0, for: 5, about: w, to: -90, ease: out_cubic}
      - {at: 5, for: 3, about: w, to: 25, ease: out_cubic}
      - {at: 8, for: 3, about: w, to: 0, ease: out_cubic}
      - {at: 0, for: 0, about: s, to: -30}
      - {at: 0, for: 5, about: s, to: 12, ease: out_quad}
      - {at: 5, for: 3, about: s, to: -5, ease: out_cubic}
      - {at: 8, for: 3, about: s, to: -25, ease: out_cubic}
      - {at: 11, for: 3, about: s, to: -30, ease: in_out_sine}
  - id: tool
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 5, about: s, to: 110, ease: out_quad}
      - {at: 5, for: 3, about: s, to: -30, ease: out_cubic}
      - {at: 8, for: 3, about: s, to: -55, ease: out_cubic}
      - {at: 11, for: 3, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
lines:
  edge: {frame: tool, from: {v: 0.3}, to: {v: 0.8}}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 6
      then: cast
      do:
        - {id: rig, op: rig, frame: tool, for: 14, detach: true}
        # First blade sample precedes impact; remaining samples belong to cast.
        - {id: trail, op: particle, particle: dust, along: edge, samples: 5, count: 1, color: "#b88c55", size: 0.35, extra: 0, at: 5}
        - {"id": "crescent_1", "op": "particle", "particle": "dust", "frame": "body", "times": "${arc_samples}", "pos": {"v": "= 2.55 - ${arc_depth} * cos(-pi / 2 + i * pi / (${arc_samples} - 1))", "w": "= 1.0 + ${arc_height} * sin(-pi / 2 + i * pi / (${arc_samples} - 1))"}, "count": "${arc_count}", "color": "${arc_color}", "size": "${arc_size}", "extra": 0, "at": 3, "offset": [0.02, 0.02, 0.02]}
        - {"id": "crescent_2", "op": "particle", "particle": "dust", "frame": "body", "times": "${arc_samples}", "pos": {"v": "= 3.6999999999999997 - ${arc_depth} * cos(-pi / 2 + i * pi / (${arc_samples} - 1))", "w": "= 1.0 + ${arc_height} * sin(-pi / 2 + i * pi / (${arc_samples} - 1))"}, "count": "${arc_count}", "color": "${arc_color}", "size": "${arc_size}", "extra": 0, "at": 4, "offset": [0.02, 0.02, 0.02]}
        - {"id": "crescent_3", "op": "particle", "particle": "dust", "frame": "body", "times": "${arc_samples}", "pos": {"v": "= 4.85 - ${arc_depth} * cos(-pi / 2 + i * pi / (${arc_samples} - 1))", "w": "= 1.0 + ${arc_height} * sin(-pi / 2 + i * pi / (${arc_samples} - 1))"}, "count": "${arc_count}", "color": "${arc_color}", "size": "${arc_size}", "extra": 0, "at": 5, "offset": [0.02, 0.02, 0.02]}
        - {"id": "travel_sweep_0", "op": "particle", "particle": "sweep_attack", "frame": "body", "pos": {"v": 1.4, "w": "= 1.0 + (i - (${sweep_layers} - 1) / 2.0) * 0.16"}, "count": 1, "extra": 0, "at": 2, "times": "${sweep_layers}", "detach": true}
        - {"id": "travel_sweep_0_beat_1", "op": "particle", "particle": "sweep_attack", "frame": "body", "pos": {"v": 1.4, "w": "= 1.0 + (i - (${sweep_layers} - 1) / 2.0) * 0.16"}, "count": 1, "extra": 0, "at": 3, "times": "${sweep_layers}", "detach": true}
        - {"id": "travel_sweep_0_beat_2", "op": "particle", "particle": "sweep_attack", "frame": "body", "pos": {"v": 1.4, "w": "= 1.0 + (i - (${sweep_layers} - 1) / 2.0) * 0.16"}, "count": 1, "extra": 0, "at": 4, "times": "${sweep_layers}", "detach": true}
        - {"id": "travel_sweep_2", "op": "particle", "particle": "sweep_attack", "frame": "body", "pos": {"v": 3.7, "w": "= 1.0 + (i - (${sweep_layers} - 1) / 2.0) * 0.16"}, "count": 1, "extra": 0, "at": 4, "times": "${sweep_layers}", "detach": true}
        - {"id": "travel_sweep_2_beat_1", "op": "particle", "particle": "sweep_attack", "frame": "body", "pos": {"v": 3.7, "w": "= 1.0 + (i - (${sweep_layers} - 1) / 2.0) * 0.16"}, "count": 1, "extra": 0, "at": 5, "times": "${sweep_layers}", "detach": true}
        - {"id": "travel_sweep_2_beat_2", "op": "particle", "particle": "sweep_attack", "frame": "body", "pos": {"v": 3.7, "w": "= 1.0 + (i - (${sweep_layers} - 1) / 2.0) * 0.16"}, "count": 1, "extra": 0, "at": 6, "times": "${sweep_layers}", "detach": true}
    cast:
      for: 1
      then: end
      do:
        - {id: wall, op: place_shape, frame: body, shape: {wall: {width: "${width}", height: "${height}"}}, block: "astera:reinforced_planks", consume: none, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, sound: block.wood.break, frame: body, volume: 1.0, pitch: 1.0}
        - {id: rise_0, op: particle, particle: block, block: minecraft:oak_planks, frame: body, pos: {v: 2, w: "= 0.25 + (0 / 2.0) * (${height} - 1)", s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: "${splinters}", offset: [0.14, 0.14, 0.14], extra: 0.02, at: 0}
        - {id: rise_1, op: particle, particle: block, block: minecraft:oak_planks, frame: body, pos: {v: 2, w: "= 0.25 + (1 / 2.0) * (${height} - 1)", s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: "${splinters}", offset: [0.14, 0.14, 0.14], extra: 0.02, at: 2, detach: true}
        - {id: rise_2, op: particle, particle: block, block: minecraft:oak_planks, frame: body, pos: {v: 2, w: "= 0.25 + (2 / 2.0) * (${height} - 1)", s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: "${splinters}", offset: [0.14, 0.14, 0.14], extra: 0.02, at: 4, detach: true}
        - {id: rise_quarter, op: particle, particle: block, block: minecraft:oak_planks, frame: body, pos: {v: 2, w: "= 0.25 + (0.5 / 2.0) * (${height} - 1)", s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: "${splinters}", offset: [0.14, 0.14, 0.14], extra: 0.02, at: 1, detach: true}
        - {id: rise_three_quarters, op: particle, particle: block, block: minecraft:oak_planks, frame: body, pos: {v: 2, w: "= 0.25 + (1.5 / 2.0) * (${height} - 1)", s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: "${splinters}", offset: [0.14, 0.14, 0.14], extra: 0.02, at: 3, detach: true}
        - {id: rise_0_puff, op: particle, particle: dust, frame: body, pos: {v: 2, w: "= 0.25 + (0 / 2.0) * (${height} - 1)", s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: "${chips}", offset: [0.12, 0.08, 0.12], color: "${core_color}", size: "${core_size}", extra: 0}
        - {id: rise_1_puff, op: particle, particle: dust, frame: body, pos: {v: 2, w: "= 0.25 + (1 / 2.0) * (${height} - 1)", s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: "${chips}", offset: [0.12, 0.08, 0.12], color: "${core_color}", size: "${core_size}", extra: 0, at: 2, detach: true}
        - {id: rise_2_puff, op: particle, particle: dust, frame: body, pos: {v: 2, w: "= 0.25 + (2 / 2.0) * (${height} - 1)", s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: "${chips}", offset: [0.12, 0.08, 0.12], color: "${core_color}", size: "${core_size}", extra: 0, at: 4, detach: true}
        - {id: trail, op: particle, particle: dust, along: edge, samples: 5, count: 1, color: "#b88c55", size: 0.35, extra: 0, at: 1, every: 2, for: "= ${trail_span} - 2", detach: true}
        - {"id": "contact_chips", "op": "particle", "frame": "body", "pos": {"v": 5.65, "w": 1.0}, "at": 0, "detach": true, "particle": "block", "block": "minecraft:oak_planks", "count": "= 12 + 6 * ${chips}", "offset": [0.18, 0.18, 0.18], "extra": 0.13}
        - {"id": "contact_core", "op": "particle", "frame": "body", "pos": {"v": 5.65, "w": 1.0}, "at": 0, "detach": true, "particle": "dust", "count": "= 6 + 2 * ${chips}", "offset": [0.12, 0.12, 0.12], "color": "${core_color}", "size": "= ${core_size} * 2", "extra": 0}
        - {"id": "crescent_4", "op": "particle", "particle": "dust", "frame": "body", "times": "${arc_samples}", "pos": {"v": "= 6.0 - ${arc_depth} * cos(-pi / 2 + i * pi / (${arc_samples} - 1))", "w": "= 1.0 + ${arc_height} * sin(-pi / 2 + i * pi / (${arc_samples} - 1))"}, "count": "${arc_count}", "color": "${arc_color}", "size": "${arc_size}", "extra": 0, "at": 4, "detach": true, "offset": [0.02, 0.02, 0.02]}
        - {"id": "contact_sweep", "op": "particle", "frame": "body", "pos": {"v": 5.1, "w": "= 1.0 + (i - (${sweep_layers} - 1) / 2.0) * 0.16"}, "at": 0, "detach": true, "particle": "sweep_attack", "count": 1, "extra": 0, "times": "${sweep_layers}"}
        - {"id": "contact_sweep_beat_1", "op": "particle", "frame": "body", "pos": {"v": 5.1, "w": "= 1.0 + (i - (${sweep_layers} - 1) / 2.0) * 0.16"}, "at": 1, "detach": true, "particle": "sweep_attack", "count": 1, "extra": 0, "times": "${sweep_layers}"}
        - {"id": "contact_sweep_beat_2", "op": "particle", "frame": "body", "pos": {"v": 5.1, "w": "= 1.0 + (i - (${sweep_layers} - 1) / 2.0) * 0.16"}, "at": 2, "detach": true, "particle": "sweep_attack", "count": 1, "extra": 0, "times": "${sweep_layers}"}
        - {"id": "terminal_chips", "op": "particle", "frame": "body", "pos": {"v": 5.65, "w": 1.0}, "at": 4, "detach": true, "particle": "block", "block": "minecraft:oak_planks", "count": "= 6 + 3 * ${chips}", "offset": [0.18, 0.18, 0.18], "extra": 0.13}
        - {"id": "terminal_sweep", "op": "particle", "frame": "body", "pos": {"v": 5.1, "w": "= 1.0 + (i - (${sweep_layers} - 1) / 2.0) * 0.16"}, "at": 4, "detach": true, "particle": "sweep_attack", "count": 1, "extra": 0, "times": "${sweep_layers}"}
    end: {final: true}
