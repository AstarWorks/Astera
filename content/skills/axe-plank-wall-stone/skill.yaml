# Hand-authored tool presentation. Mechanical shape / timing / damage / cooldown stay unchanged.
# Dust uses typical tool material; no per-cell surface data is exposed to presentation rows.
apiVersion: astera/v3
kind: Skill
id: axe-plank-wall-stone
item: stone-axe
meta:
  name: {ja: "石の板壁", en: "Stone Plank Wall"}
  description: {ja: "目の前に補強板の壁を築く。", en: "Raises a wall of reinforced planks in front of you."}
  cooldown_ticks: 400
  resource_cost: 0
  tags: [tool, cover]
params:
  width: {type: number, default: 3}
  height: {type: number, default: 2}
  strip_pitch: {type: number, default: 0.8}
  break_vol: {type: number, default: 0.8}
  break_pitch: {type: number, default: 0.9}
  strong: {type: bool, default: false}
  crit: {type: bool, default: false}
  spark: {type: string, default: tool-axe-stone}
  trail_span: {type: number, default: 6}
  metallic: {type: bool, default: false}
  bright: {type: bool, default: false}
frames:
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: w, to: 0}
      - {at: 0, for: 5, about: w, to: -90, ease: out_cubic}
      - {at: 5, for: 3, about: w, to: 25, ease: out_cubic}
      - {at: 8, for: 3, about: w, to: 0, ease: out_cubic}
      - {at: 0, for: 0, about: s, to: -30}
      - {at: 0, for: 5, about: s, to: 12, ease: out_quad}
      - {at: 5, for: 3, about: s, to: -5, ease: out_cubic}
      - {at: 8, for: 3, about: s, to: -25, ease: out_cubic}
      - {at: 11, for: 3, about: s, to: -30, ease: in_out_sine}
  - id: tool
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 5, about: s, to: 110, ease: out_quad}
      - {at: 5, for: 3, about: s, to: -30, ease: out_cubic}
      - {at: 8, for: 3, about: s, to: -55, ease: out_cubic}
      - {at: 11, for: 3, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
lines:
  edge: {frame: tool, from: {v: 0.3}, to: {v: 0.8}}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 6
      then: cast
      do:
        - {id: rig, op: rig, frame: tool, for: 14, detach: true}
        - {id: trail, op: particle, particle: dust, along: edge, samples: 5, count: 1, color: "#b88c55", size: 0.35, extra: 0, at: 5, every: 2, for: "${trail_span}", detach: true}
        - {id: wind, op: sound, sound: entity.player.attack.sweep, frame: body, at: 4, volume: 0.35, pitch: 0.65}
    cast:
      for: 1
      then: end
      do:
        - {id: wall, op: place_shape, frame: body, shape: {wall: {width: "${width}", height: "${height}"}}, block: "astera:reinforced_planks", consume: none, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, sound: block.scaffolding.place, frame: body, volume: 1.0, pitch: "${strip_pitch}"}
        - {id: snd_2, op: sound, sound: block.wood.place, frame: body, volume: "${break_vol}", pitch: "${break_pitch}"}
        - {id: snd_3, op: sound, sound: entity.player.attack.strong, frame: body, volume: 0.6, pitch: 0.9, when: "= ${strong}"}
        - {id: snd_4, op: sound, sound: entity.player.attack.crit, frame: body, volume: 0.8, pitch: 0.9, when: "= ${crit}"}
        - {id: rise_0, op: particle, particle: block_crumble, block: minecraft:oak_planks, frame: body, pos: {v: 2, w: "= 0.25 + (0 / 2.0) * (${height} - 1)", s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: 8, offset: [0.14, 0.14, 0.14], extra: 0.02, at: 0}
        - {id: rise_1, op: particle, particle: block_crumble, block: minecraft:oak_planks, frame: body, pos: {v: 2, w: "= 0.25 + (1 / 2.0) * (${height} - 1)", s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: 8, offset: [0.14, 0.14, 0.14], extra: 0.02, at: 2, detach: true}
        - {id: rise_2, op: particle, particle: block_crumble, block: minecraft:oak_planks, frame: body, pos: {v: 2, w: "= 0.25 + (2 / 2.0) * (${height} - 1)", s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: 8, offset: [0.14, 0.14, 0.14], extra: 0.02, at: 4, detach: true}
        - {id: rise_quarter, op: particle, particle: block_crumble, block: minecraft:oak_planks, frame: body, pos: {v: 2, w: "= 0.25 + (0.5 / 2.0) * (${height} - 1)", s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: 8, offset: [0.14, 0.14, 0.14], extra: 0.02, at: 1, detach: true}
        - {id: rise_three_quarters, op: particle, particle: block_crumble, block: minecraft:oak_planks, frame: body, pos: {v: 2, w: "= 0.25 + (1.5 / 2.0) * (${height} - 1)", s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: 8, offset: [0.14, 0.14, 0.14], extra: 0.02, at: 3, detach: true}
        - {id: material_accent, op: particle, particle: block_crumble, block: minecraft:oak_planks, count: 12, extra: 0.03, frame: body, pos: {v: 2, w: 0.4}}
        - {id: metal, op: particle, particle: electric_spark, frame: body, pos: {v: 2, w: 0.4}, count: 12, offset: [0.14, 0.14, 0.14], extra: 0.12, at: 0, when: "= ${metallic}"}
        - {id: diamond_flash, op: particle, particle: dust, frame: body, pos: {v: 2, w: 0.4}, count: 12, offset: [0.14, 0.14, 0.14], extra: 0, at: 0, color: "#64f5ef", size: 0.8, when: "= ${bright}"}
        - {id: diamond_glint, op: particle, particle: end_rod, frame: body, pos: {v: 2, w: 0.4}, count: 6, offset: [0.14, 0.14, 0.14], extra: 0.04, at: 2, detach: true, when: "= ${bright}"}
        - {id: metal_rim, op: particle, particle: electric_spark, frame: body, pos: {v: "= 2 + 0.8 * cos(i * 2 * pi / 16)", w: 0.4, s: "= 0.8 * sin(i * 2 * pi / 16)"}, times: 16, count: 1, extra: 0.02, when: "= ${metallic}"}
        - {id: ring, op: sound, sound: block.anvil.land, frame: body, pos: {v: 2, w: 0.4}, volume: 0.18, pitch: 1.4, when: "= ${metallic}"}
        - {id: chime, op: sound, sound: block.amethyst_block.chime, frame: body, pos: {v: 2, w: 0.4}, volume: 0.6, pitch: 1.3, when: "= ${bright}"}
        - {id: settle, op: sound, sound: block.wood.step, frame: body, pos: {v: 2, w: 0.4}, at: 5, detach: true, volume: 0.4, pitch: 0.75}
    end: {final: true}
