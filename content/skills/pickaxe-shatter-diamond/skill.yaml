# v3 hand port of the v2 skill (ADR-0303 rev4.3). one break_area at tick 0, kept field for field.
apiVersion: astera/v3
kind: Skill
id: pickaxe-shatter-diamond
item: diamond-pickaxe
meta: {name: {ja: "ダイヤの粉砕", en: "Diamond Shatter"}, description: {ja: "視線の先のブロックを球状に砕く。", en: "Shatters blocks in a sphere where you look."}, cooldown_ticks: 160, resource_cost: 0, tags: [tool, cover]}
anchors:
  - {id: spark, anchor: caster, offset: {forward: 2.0}, mode: snapshot}   # was pt_caster_0_0_2 (caster feet, yaw-only)
machine:
  start: smash
  states:
    smash:
      for: 1
      then: end
      do:
        - {id: break, op: break_area, at: 0, anchor: caster, shape: {sphere: {radius: 4, ahead: 4.0}}, tool: pickaxe, block_damage: 100, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, at: 0, sound: block.stone.break, anchor: caster, volume: 1.0, pitch: 0.6}
        - {id: snd_2, op: sound, at: 0, sound: item.trident.hit_ground, anchor: caster, volume: 0.8, pitch: 1.0}
        - {id: snd_3, op: sound, at: 0, sound: block.amethyst_cluster.break, anchor: caster, volume: 0.8, pitch: 1.0}
        - {id: fx, op: particle_def, at: 0, def: tool-pick-diamond, anchor: spark}
    end: {final: true}
