machine:
  start: cast
  states:
    cast:
      for: 1
      then: end
      do:
        - {id: shatter, use: pickaxe-shatter, with: {radius: 4, tier: 3, stone_pitch: 0.6, thud_vol: 0.8, thud_pitch: 1.0}, frames: {spot: dust}}
    end: {final: true}
