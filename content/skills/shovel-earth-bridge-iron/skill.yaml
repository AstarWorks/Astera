# astera/v3 hand port of the v2 skill.yaml + look.yaml (tick for tick).
apiVersion: astera/v3
kind: Skill
id: shovel-earth-bridge-iron
item: iron-shovel
meta: {name: {ja: "鉄の土橋", en: "Iron Earth Bridge"}, description: {ja: "目の前に固めた粘土の橋を架ける。", en: "Lays a packed-clay bridge ahead of you."}, cooldown_ticks: 220, resource_cost: 0, tags: [tool, cover]}
anchors:
  - {id: spark,  anchor: caster, offset: {forward: 2.0}, mode: follow}      # was pt_caster_0_0_2 (feet, yaw-only)
machine:
  start: cast
  states:
    cast:
      for: 1
      then: end
      do:
        - {id: bridge, op: place_shape, at: 0, anchor: caster, shape: {bridge: {length: 7, width: 3}}, block: "astera:packed_clay", consume: none, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, sound: block.gravel.break, anchor: caster, volume: 1.0, pitch: 0.7}
        - {id: snd_2, op: sound, sound: block.rooted_dirt.break, anchor: caster, volume: 0.8, pitch: 0.9}
        - {id: fx, op: particle_def, def: tool-shovel-iron, anchor: spark}
    end: {final: true}
