# astera/v3 hand port of the v2 skill.yaml + look.yaml (tick for tick).
apiVersion: astera/v3
kind: Skill
id: shovel-earth-bridge-iron
item: iron-shovel
meta: {name: {ja: "鉄の土橋", en: "Iron Earth Bridge"}, description: {ja: "目の前に固めた粘土の橋を架ける。", en: "Lays a packed-clay bridge ahead of you."}, cooldown_ticks: 220, resource_cost: 0, tags: [tool, cover]}
anchors:
  - {id: aim,    anchor: caster.eye}                              # the v2 `aim` frame, origin of place_shape
  - {id: spark,  anchor: caster.eye, offset: {forward: 2.0}}      # was pt_aim_0_0_2
machine:
  start: cast
  states:
    cast:
      for: 1
      then: end
      do:
        # GAP: op place_shape has no v3 spelling in ADR-0303 -> none; v2 fields carried verbatim, v2 `at: aim` (a frame) is written `anchor: aim`
        - {id: bridge, op: place_shape, at: 0, shape: bridge, block: "astera:packed_clay", width: 3, length: 7, anchor: aim}
        - {id: snd, op: sound, sound: "astera:weapons/gun-impact-block", anchor: caster, volume: 1.0, pitch: 1.0}
        - {id: fx, op: particle_def, def: hit-spark, anchor: spark}
    end: {final: true}
