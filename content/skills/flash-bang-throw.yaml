# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: flash-bang-throw

name:
  ja: "閃光弾"
  en: "Flash Bang"
description:
  ja: "着弾点で閃光を放ち、周囲の敵を一瞬動けなくする。"
  en: "Pops a flash that briefly stuns enemies near the impact."

archetype: projectile
cooldown_ticks: 200
resource_cost: 12
tags: [ ranged, utility, control ]

params:
  type: projectile
  launch_speed: 1.4
  max_lifetime_ticks: 50
  visual:
    trail_spacing: 0.4
    trail:
      - type: point
        particles:
          - { id: end_rod, offset: { x: 0.03, y: 0.03, z: 0.03 } }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.snowball.throw
      volume: { type: literal, value: 0.9 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 0.9, height: -0.25 }
      particle_id: gun-muzzle-flash
  hit_entity:
    - type: apply_status
      targets: { type: enemies, center: { type: target }, radius: { type: literal, value: 4.0 } }
      status_id: shock
      effect_duration_ticks: { type: literal, value: 30 }
    - type: schedule_particle_animation
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 0.8, z: 0.0 } } }
      animation:
        - type: ring
          period_ticks: 4
          points: 16
          start_radius: 0.4
          end_radius: 3.5
          particles:
            - { id: end_rod, count: 0, extra: 0.08 }
            - { id: dust, color: { r: 255, g: 255, b: 230 }, scale: 1.4 }
    - type: play_sound
      targets: { type: target }
      sound_id: entity.firework_rocket.blast
      volume: { type: literal, value: 0.9 }
      pitch: { type: literal, value: 1.3 }
  hit_block:
    - type: apply_status
      targets: { type: enemies, center: { type: hit_location }, radius: { type: literal, value: 4.0 } }
      status_id: shock
      effect_duration_ticks: { type: literal, value: 30 }
    - type: schedule_particle_animation
      targets: { type: hit_location }
      animation:
        - type: ring
          period_ticks: 4
          points: 16
          start_radius: 0.4
          end_radius: 3.5
          particles:
            - { id: end_rod, count: 0, extra: 0.08 }
            - { id: dust, color: { r: 255, g: 255, b: 230 }, scale: 1.4 }
    - type: play_sound
      targets: { type: hit_location }
      sound_id: entity.firework_rocket.blast
      volume: { type: literal, value: 0.9 }
      pitch: { type: literal, value: 1.3 }
  miss: []
  expire: []
