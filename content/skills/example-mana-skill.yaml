# Wave 5a starter: skill with a mana cost.
# Demonstrates the `mana_cost` field added in Wave 5a — ConsumeManaUseCase
# debits this amount before SkillCast is published; if the caster's pool is
# below the cost, the cast fails with InsufficientMana and the cooldown is
# not started.
#
# Wave _items-1 (ADR-0073): trigger / i18n keys folded into item bindings +
# inline locale maps.

id: example-mana-skill

name:
  ja: "魔力消費弾"
  en: "Example Mana Skill"
description:
  ja: "発射時に魔力を消費する遠距離スキル。"
  en: "A ranged skill that debits the caster's mana pool on each fire."

archetype: projectile
cooldown_ticks: 40        # ~2s @ 20 TPS
mana_cost: 30             # debited from the caster's ManaPool on cast

params:
  type: projectile
  launch_speed: 1.6       # blocks/tick
  max_lifetime_ticks: 60  # ~3s flight time
  damage:
    base: 10.0
    attribute: fire
