# Wave _skills-2 / ADR-0077: PROJECTILE with mana cost.
# Demonstrates `mana_cost`: ConsumeManaUseCase debits 30 mana before the cast
# commits. On insufficient mana the cast fails (InsufficientMana) and no
# cooldown / SkillCast is published.

id: example-mana-skill

name:
  ja: "魔力消費弾"
  en: "Example Mana Skill"
description:
  ja: "発射時に魔力を消費する遠距離スキル。"
  en: "A ranged skill that debits the caster's mana pool on each fire."

archetype: projectile
cooldown_ticks: 40
mana_cost: 30
tags: [ ranged, fire-family, mana-cost ]

params:
  type: projectile
  launch_speed: 1.6
  max_lifetime_ticks: 60
  damage:
    - base: { kind: literal, value: 10.0 }
      attribute: fire

phases:
  archetype: projectile
  cast:
    - type: play_sound
      targets: { kind: caster }
      sound_id: skills/mana-cast
  hit_entity:
    - type: damage
      targets: { kind: target }
      components:
        - base: { kind: literal, value: 10.0 }
          attribute: fire
  hit_block: []
  miss: []
  expire: []
