# Wave _skills-2 / ADR-0077: PROJECTILE with mana cost.
# Demonstrates `resource_type` / `resource_cost` (WP2): CastSkillUseCase spends
# 30 mana from the caster's resource pool before the cast commits. On a short
# pool the cast is rejected (SkillCastRejected) and no cooldown / SkillCast is
# published.

id: example-mana-skill

name:
  ja: "魔力消費弾"
  en: "Example Mana Skill"
description:
  ja: "発射時に魔力を消費する遠距離スキル。"
  en: "A ranged skill that debits the caster's mana pool on each fire."

archetype: projectile
cooldown_ticks: 40
resource_type: mana
resource_cost: 30
tags: [ ranged, fire-family, mana-cost ]

params:
  type: projectile
  launch_speed: 1.6
  max_lifetime_ticks: 60

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.evoker.cast_spell
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 10.0 }
          attribute: fire
  hit_block: []
  miss: []
  expire: []
