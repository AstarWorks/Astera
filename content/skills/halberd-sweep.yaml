# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: halberd-sweep

name:
  ja: "薙ぎ払い"
  en: "Halberd Sweep"
description:
  ja: "広い弧で前方を薙ぎ払う。"
  en: "A wide sweeping arc."

archetype: melee
cooldown_ticks: 24
resource_cost: 12
tags: [ melee, physical ]

params:
  type: melee
  range: 3.8
  arc_degrees: 160.0
  knockback: 0.6
  damage:
    - base: { type: literal, value: 38.0 }
      attribute: physical

phases:
  type: melee
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/blade-heavy-swing
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 0.9 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.6, height: -0.1 }
      particle_id: slash-sweep
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/blade-hit
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
  miss: []
