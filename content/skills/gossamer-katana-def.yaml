id: gossamer-katana-def
name:
  ja: 糸抜け
  en: Thread Slip
description:
  ja: 糸のようにすり抜けて距離を取る。
  en: Slip away like a thread and gain distance.
archetype: sequence
cooldown_ticks: 80
resource_cost: 10
params:
  type: sequence
phases:
  type: sequence
  cast:
  - type: play_vfx
    targets:
      type: caster
    vfx_id: gossamer-katana-guard
  - type: dash_strike
    distance: 5
    ticks: 5
    radius: 0.8
    hit_once: true
    invulnerable: false
    stop_on_block: true
    on_hit: []
    delay_ticks:
      type: literal
      value: 3
  - type: modify_attribute
    targets:
      type: caster
    attribute_key: resist.physical
    delta:
      type: literal
      value: 0.7
    ticks:
      type: literal
      value: 12
