# Unfilmed evade adaptation. Poise-on-activation approximates a successful-evade hook.
id: gossamer-katana-def
name: {en: Spun Ward, ja: 糸結界}
description: {en: An evasive backward step leaves a pale afterimage., ja: 淡い残像を残して後方へ退き、攻撃を回避する。}
archetype: sequence
cooldown_ticks: 80
resource_cost: 12
params: {type: sequence}
phases:
  type: sequence
  cast:
  - type: apply_status
    targets: {type: caster}
    status_id: evasive
    effect_duration_ticks: {type: literal, value: 14}
  - type: play_vfx
    targets: {type: caster}
    vfx_id: gossamer-katana-guard
  - type: propel
    targets: {type: caster}
    direction: {type: from_caster}
    strength: {type: literal, value: -0.8}
  - type: apply_status
    targets: {type: caster}
    status_id: poise
    effect_duration_ticks: {type: literal, value: 100}
  - type: play_sound
    targets: {type: caster}
    sound_id: entity.player.attack.sweep
    pitch: {type: literal, value: 1.6}
