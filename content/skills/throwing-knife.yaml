# Match arsenal (wp/match-arsenal): simple PvP skill. One cast sound, a few particles.

id: throwing-knife

name:
  ja: "投げナイフ"
  en: "Throwing Knife"
description:
  ja: "素早く真っすぐ飛ぶナイフを投げる。"
  en: "Throws a fast, flat knife."

archetype: projectile
cooldown_ticks: 10
resource_cost: 5
tags: [ ranged, physical ]

params:
  type: projectile
  launch_speed: 2.8
  max_lifetime_ticks: 30
  visual:
    trail_spacing: 0.4
    trail:
      - type: point
        particles:
          - { id: crit, offset: { x: 0.04, y: 0.04, z: 0.04 } }
          - { id: dust, color: { r: 230, g: 230, b: 230 }, scale: 1.0 }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/sword-swing
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 1.8 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 0.9, height: -0.25 }
      particle_id: stab-spark
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 28.0 }
          attribute: physical
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/gun-impact
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
  hit_block:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: astera:weapons/gun-impact-block
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.5 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: hit-spark
  miss: []
  expire: []
