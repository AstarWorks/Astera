# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: sanctuary-heal

name:
  ja: "癒しの輪"
  en: "Healing Circle"
description:
  ja: "周囲の味方の体力を回復する。"
  en: "Heals you and nearby allies."

archetype: sequence
cooldown_ticks: 240
resource_cost: 28
tags: [ magic, support, heal ]

params:
  type: sequence

phases:
  type: sequence
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:skills/heal-chime
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.0 }
    - type: heal
      targets: { type: allies, center: { type: caster }, include_self: true, radius: { type: literal, value: 6.0 } }
      amount: { type: literal, value: 30.0 }
    - type: schedule_particle_animation
      targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 0.15, z: 0.0 } } }
      animation:
        - type: ring
          period_ticks: 8
          points: 16
          start_radius: 0.4
          end_radius: 4.0
          particles:
            - { id: happy_villager, count: 0, extra: 0.02 }
            - { id: dust, color: { r: 90, g: 230, b: 90 }, scale: 1.4 }
    - type: spawn_particle
      targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 1.0, z: 0.0 } } }
      particle_id: verdant-heal
