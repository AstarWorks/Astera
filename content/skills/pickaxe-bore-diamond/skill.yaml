# Wave 2 v3 draft (basic-ac): ported 1:1 from the v2 skill.yaml + look.yaml. GAP comments mark what v3 cannot spell yet.
apiVersion: astera/v3
kind: Skill
id: pickaxe-bore-diamond
item: diamond-pickaxe
meta:
  name: {ja: "ダイヤの掘削", en: "Diamond Bore"}
  description: {ja: "正面に3x3のトンネルを掘り進む。", en: "Bores a 3x3 tunnel straight ahead."}
  cooldown_ticks: 90
  resource_cost: 0
  tags: [tool, cover]
anchors:
  - {id: aim, anchor: caster.eye, mode: snapshot}
  - {id: dust, anchor: caster.eye, offset: {forward: 2.0}, mode: snapshot}            # was pt_aim_0_0_2
machine:
  start: bore
  states:
    bore:
      for: 1
      then: end
      enter:
        # GAP: break_area (block-break profile: line, tool_class, block_damage, power) -> none in v3. Kept verbatim; v2 `at: aim` is `anchor: aim`.
        - {id: break, op: break_area, shape: line, radius: 2.0, length: 8, width: 3, height: 3, tool_class: PICKAXE, block_damage: 350, power: 3, anchor: aim}
        - {id: snd_bore, op: sound, sound: "astera:weapons/gun-impact-block", anchor: caster, volume: 1.0, pitch: 0.5}
        - {id: fx_bore, op: particle_def, def: hit-spark, anchor: dust}
    end: {final: true}
