# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: scythe-pull

name:
  ja: "引き寄せ"
  en: "Pull"
description:
  ja: "前方の相手を手前へ引き寄せる。"
  en: "Drags the targets in front of you toward you."

archetype: sequence
cooldown_ticks: 130
resource_cost: 12
tags: [ melee, control ]

params:
  type: sequence

phases:
  type: sequence
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.sweep
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 0.6 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 2.0, height: -0.1 }
      particle_id: slash-sweep
    - type: knockback
      targets:
        type: cone
        from: { type: caster }
        direction: { type: from_caster }
        distance: { type: literal, value: 5.0 }
        angle_degrees: { type: literal, value: 50 }
        max_count: 3
      direction: { type: toward_caster, vertical: 0.2 }
      strength: { type: literal, value: 1.3 }
    - type: damage
      targets:
        type: cone
        from: { type: caster }
        direction: { type: from_caster }
        distance: { type: literal, value: 5.0 }
        angle_degrees: { type: literal, value: 50 }
        max_count: 3
      components:
        - base: { type: literal, value: 14.0 }
          attribute: physical
