# Swift powder: single use. Consumes one item and grants swift for swift_ticks.
apiVersion: astera/v3
kind: Skill
id: swift-powder-use
item: swift-powder
meta:
  name: {ja: "疾風の粉", en: "Swift Powder"}
  description: {ja: "使い切りで 8 秒間、移動速度が上がる。", en: "Single use; faster movement for 8s."}
  cooldown_ticks: 200
  resource_cost: 0
  tags: [support, movement, consumable]
params:
  swift_ticks: {type: ticks, default: 160}
anchors:
  - {id: puff_pt, anchor: caster, offset: {up: 0.2}, mode: follow}
machine:
  start: use
  states:
    use:
      for: 1
      then: end
      do:
        - {id: consume, op: consume_item, at: 0, target: caster, item: swift-powder, count: 1}
        - {id: swift, op: status, at: 0, target: caster, status: swift, stacks: 1, for: "${swift_ticks}"}
        - {id: whoosh, op: sound, at: 0, sound: entity.player.attack.knockback, anchor: caster, pitch: 1.4}
        - {id: puff, op: particle_def, at: 0, def: dash-cloud, anchor: puff_pt}
    end: {final: true}
