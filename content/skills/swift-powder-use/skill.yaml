apiVersion: astera/v3
kind: Skill
id: swift-powder-use
item: swift-powder
meta:
  name: {ja: "疾風の粉", en: "Swift Powder"}
  description: {ja: "使い切りで 8 秒間、移動速度が上がる。", en: "Single use; faster movement for 8s."}
  cooldown_ticks: 200
  resource_cost: 0
  tags: [support, movement, consumable]
anchors:
  - {id: puff_pt, anchor: caster, offset: {up: 0.2}}
machine:
  start: main
  states:
    main:
      for: 1
      then: end
      do:
        # GAP: consume_item {target: caster, item: swift-powder, count: 1} -> none (no item-consume op in ADR 10.1b)
        - {id: st_swift, op: status, target: caster, status: swift, stacks: 1, for: 160}
        - {id: snd, op: sound, sound: entity.player.attack.knockback, anchor: caster, pitch: 1.4}
        - {id: puff, op: particle_def, def: dash-cloud, anchor: puff_pt}
    end: {final: true}
