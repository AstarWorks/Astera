apiVersion: astera/v3
kind: Skill
id: halberd-hook
item: halberd
meta: {name: {ja: "引っ掛け", en: "Halberd Hook"}, description: {ja: "穂先で足を払い、相手の体勢を崩す。", en: "Hooks the legs and shakes the target."}, cooldown_ticks: 110, resource_cost: 12, tags: [melee, physical, control]}
params:
  arc_deg:      {type: number, default: 50}
  range:        {type: blocks, default: 3.6}
  dmg_physical: {type: number, default: 22}
  tremor_ticks: {type: ticks, default: 40}
anchors:
  - {id: cast_fx, anchor: caster, offset: {up: -0.1, forward: 1.6}, mode: follow}  # v2 pt_caster (feet, yaw-only)
  - {id: heart, anchor: victim.root, offset: {up: 1.2}, mode: follow}
machine:
  start: swing
  states:
    swing:
      for: 1
      then: end
      do:
        - {id: snd, op: sound, sound: "entity.player.attack.sweep", anchor: caster, volume: 1.0, pitch: 0.8, at: 0}
        - {id: fx, op: particle_def, def: stab-spark, anchor: cast_fx, at: 0}
        - id: swing
          op: hit
          at: 0
          anchor: caster.eye
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: 0.2}
              - {id: st_tremor, op: status, target: event.victim, status: tremor, stacks: 1, for: "${tremor_ticks}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.2}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
    end: {final: true}
