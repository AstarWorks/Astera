# halberd-hook: wind-up 5 ticks (rule round(5 / attack_speed)), hit at tick 5. Low hook at the legs: reached high on the right, swept low across to the left.
apiVersion: astera/v3
kind: Skill
id: halberd-hook
item: halberd
meta: {name: {ja: "引っ掛け", en: "Halberd Hook"}, description: {ja: "穂先で足を払い、相手の体勢を崩す。", en: "Hooks the legs and shakes the target."}, cooldown_ticks: 110, resource_cost: 12, tags: [melee, physical, control]}
params:
  arc_deg:      {type: number, default: 50}
  range:        {type: blocks, default: 3.6}
  dmg_physical: {type: number, default: 22}
  knockback:    {type: number, default: 0.2}
  tremor_ticks: {type: ticks, default: 40}
anchors:
  - {id: cast_fx, anchor: caster.eye, offset: {up: -0.1, forward: 1.6}, mode: follow}
  - {id: heart, anchor: victim.center, mode: follow}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 5
      then: strike
      do:
        - {id: snd_windup, op: sound, sound: item.armor.equip_iron, anchor: caster, volume: 0.5, pitch: 0.8}
        # weapon rig: low hooking sweep. One performance in the windup state, detached so it plays on through the strike and the tail:
        # drawn back over 4 ticks, the cut starts at tick 4 so the blade crosses the target zone at the hit (tick 5), then 6 ticks of follow-through.
        - id: rig
          op: rig
          parent: caster
          mount: caster.hand_r
          rest: [{axis: left, deg: 72}]
          detach: true
          for: 13
          swing:
            - {at: 0, for: 4, from: {left: 0.000, up: 0.507, forward: 0.862}, to: {left: -0.609, up: 0.508, forward: 0.609}, edge: trailing, roll: 0, ease: out_quad}
            - {at: 4, for: 3, to: {left: 0.704, up: -0.503, forward: 0.503}, edge: leading, roll: 0, ease: out_cubic}
            - {at: 7, for: 6, to: {left: 0.936, up: -0.351, forward: 0.000}, edge: leading, roll: 0, ease: out_cubic}
    strike:
      for: 1
      then: end
      do:
        - id: swing
          op: hit
          at: 0
          anchor: caster.eye
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: "${knockback}"}
              - {id: st_tremor, op: status, target: event.victim, status: tremor, stacks: 1, for: "${tremor_ticks}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.2, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart, detach: true}
        - {id: snd, op: sound, sound: "entity.player.attack.sweep", anchor: caster, volume: 1.0, pitch: 0.8, detach: true}
        - {id: fx, op: particle_def, def: stab-spark, anchor: cast_fx, detach: true}
        - {id: trail, op: particle, particle: crit, anchor: {of: /windup/rig.root, to: /windup/rig.tip, samples: 6}, count: 1, extra: 0.04, at: 0, every: 1, for: 8, detach: true}
    end: {final: true}
