# Zwei West Section 3 Ishmael, Knight's Greatsword Form (video 11.633-14.233): two waist-high sweeps. Director integration (pilot, ONE rig).
# bastion-s1-rig plays at skill tick 0 for the whole skill (freeze 7/31 = the two hit_stops; r23 hit-1 contact tick 7 = reference t7, was 8); fx-high/low play at 3/27 (contact = effect tick 4; hit-stops 7 / 31): the rings track the per-tick swing from its start (ADR-0278).
# Caster travel (founder 2026-10-27, PvP burst): 2.4 blocks over 3 ticks starting on the swing (t4-6) into hit 1, 2.6 over t28-30 into hit 2; each stops dead 1.7 from the target at the contact tick (hit-stop 7 / 31). The reference travel (~1.0 / ~1.2, estimated) is the floor. The cones are evaluated from the caster at the contact tick, so the hit area moves with it.
# Sounds: impacts are layered vanilla (mace smash + anvil + crit, hit 2 adds iron golem + explode and is lower and heavier); every sound is vanilla, layered and pitched low (heavy, medieval; no custom oggs); vanilla particles ride the blade inside fx-high/low (deliver/particle-cues.yaml round 7b); no spawn_particle steps remain here (no electric_spark user since r9; ADR-0274 ember/spark channels). Caster movement: lunge into hit 2 only.
