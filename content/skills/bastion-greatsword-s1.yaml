# Zwei West Section 3 Ishmael, Knight's Greatsword Form (video 11.633-14.233): two waist-high sweeps. Director integration (pilot, ONE rig).
# bastion-s1-rig plays at skill tick 0 for the whole skill (freeze 7/31 = the two hit_stops); fx-high/low play at 3/27 (contact = effect tick 4).
# Sounds: deliver/sound-cues.yaml; vanilla particles: deliver/particle-cues.yaml. Caster movement: step-in before hit 1, crouched lunge before hit 2.
