# ADR-0221 persona weapon: Bastion Greatsword S1 (left click). Two beats: a horizontal moon
# crescent now, a rising crescent 21 ticks later (a player's 20-tick invulnerability frames make
# closer hits land as nothing). Landing the first beat banks 1 charge on the caster. The second
# beat picks its victims when it fires (a cone in front of where the cast started), so backing off
# or sidestepping dodges it; a condition on a delayed mechanic is only checked at cast time.

id: bastion-greatsword-s1

name:
  ja: "月輪の薙ぎ"
  en: "Moon Sweep"
description:
  ja: "黄金の三日月で薙ぎ払い、続けて斬り上げる二連撃。初撃が当たると溜め（チャージ）を得る。"
  en: "A golden crescent sweep followed by a rising slash. Landing the first beat banks one charge."

archetype: melee
cooldown_ticks: 42
resource_cost: 20              # energy
tags: [ melee, physical, burst, charge ]

params:
  type: melee
  range: 4.4
  arc_degrees: 160.0
  knockback: 0.5
  damage:
    - base: { type: literal, value: 8.0 }
      attribute: physical

phases:
  type: melee
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.sweep
      pitch: { type: literal, value: 0.6 }
    - type: play_vfx
      targets: { type: caster }
      vfx_id: bastion-s1-sweep
    - type: play_vfx
      targets: { type: caster }
      vfx_id: bastion-s1-rise
      delay_ticks: { type: literal, value: 17 }
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.sweep
      pitch: { type: literal, value: 0.9 }
      delay_ticks: { type: literal, value: 19 }
    # Beat 2: the rising crescent, victims chosen at tick 21.
    - type: damage
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 150.0 }, distance: { type: literal, value: 5.0 } }
      components:
        - base: { type: literal, value: 8.0 }
          attribute: physical
      delay_ticks: { type: literal, value: 21 }
    - type: knockback
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 150.0 }, distance: { type: literal, value: 5.0 } }
      direction: { type: up }
      strength: { type: literal, value: 0.45 }
      delay_ticks: { type: literal, value: 21 }
    - type: play_vfx
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 150.0 }, distance: { type: literal, value: 5.0 } }
      vfx_id: bastion-impact
      scale: { type: literal, value: 1.3 }
      delay_ticks: { type: literal, value: 21 }
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.strong
      delay_ticks: { type: literal, value: 21 }
  hit_entity:
    # Beat 1 (the baseline params.damage above).
    - type: play_vfx
      targets: { type: target }
      vfx_id: bastion-impact
    - type: play_sound
      targets: { type: target }
      sound_id: entity.player.attack.crit
    - type: apply_status
      targets: { type: caster }
      status_id: charge
      effect_duration_ticks: { type: literal, value: 400 }
      stack_count: { type: literal, value: 1 }
  miss:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.nodamage
