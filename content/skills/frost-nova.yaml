# WP1: staff sneak + right-click. Ice AoE around the caster that chills.

id: frost-nova

name:
  ja: "フロストノヴァ"
  en: "Frost Nova"
description:
  ja: "周囲の敵に氷属性ダメージを与え、動きを鈍らせる。"
  en: "Blasts nearby enemies with ice and slows them."

archetype: aoe
cooldown_ticks: 160
resource_cost: 25              # mana (type from the frost staff); frost-shard uses the staff's default
tags: [ magic, ice-family, aoe ]

params:
  type: aoe
  radius: 5.0
  falloff: linear
  damage:
    - base: { type: literal, value: 8.0 }
      attribute: water

phases:
  type: aoe
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: block.glass.break
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 0.9 }
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.hurt_freeze
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.0 }
    - type: spawn_particle
      targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 0.3, z: 0.0 } } }
      particle_id: frost-nova-flakes
    - type: spawn_particle
      targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 1.0, z: 0.0 } } }
      particle_id: frost-nova-dust
  hit_entity:
    - type: apply_status
      targets: { type: target }
      status_id: freeze
      effect_duration_ticks: { type: literal, value: 60 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.0, z: 0.0 } } }
      particle_id: frost-impact
  expire: []
