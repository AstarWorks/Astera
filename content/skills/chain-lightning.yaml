# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: chain-lightning

name:
  ja: "連鎖雷"
  en: "Chain Lightning"
description:
  ja: "着弾点から周囲の敵へ雷が走る。"
  en: "Lightning arcs from the impact to nearby enemies."

archetype: projectile
cooldown_ticks: 90
resource_cost: 18
tags: [ ranged, electric, magic ]

params:
  type: projectile
  launch_speed: 2.6
  max_lifetime_ticks: 40
  visual:
    trail_spacing: 0.4
    trail:
      - type: point
        particles:
          - { id: electric_spark, count: 3, extra: 0.05, offset: { x: 0.12, y: 0.12, z: 0.12 } }
          - { id: end_rod, offset: { x: 0.02, y: 0.02, z: 0.02 } }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:skill/wand/cast
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.7 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.0, height: -0.2 }
      particle_id: thunder-cast
  hit_entity:
    - type: damage
      targets: { type: enemies, center: { type: target }, radius: { type: literal, value: 4.5 } }
      components:
        - base: { type: literal, value: 36 }
          attribute: electric
    - type: apply_status
      targets: { type: target }
      status_id: shock
      effect_duration_ticks: { type: literal, value: 20 }
      chance: { type: literal, value: 0.4 }
    - type: play_sound
      targets: { type: target }
      sound_id: astera:skills/lightning-impact
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: thunder-impact
  hit_block:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: astera:weapons/gun-impact-block
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.5 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: hit-spark
  miss: []
  expire: []
