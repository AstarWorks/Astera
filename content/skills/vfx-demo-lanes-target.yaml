# Audience demo (target): plays content/vfx/demo-lanes.yaml for viewers: target. Not bound to any item.

id: vfx-demo-lanes-target

name:
  ja: "デモ・レーン (target)"
  en: "Demo Lanes (target)"
description:
  ja: "レーン別の表示エンティティを viewers=target で再生するデモ。"
  en: "Plays one display per VFX lane with viewers=target."

archetype: sequence
cooldown_ticks: 20
tags: [ demo, vfx ]

params:
  type: sequence

phases:
  type: sequence
  cast:
    - type: for_each_target
      targets:
        type: cone
        from: { type: caster }
        direction: { type: from_caster }
        distance: { type: literal, value: 12 }
        angle_degrees: { type: literal, value: 45 }
        max_count: 1
      mechanics:
        - type: play_vfx
          targets: { type: caster }
          vfx_id: demo-lanes
          track_bound_target: true
          viewers: target
