# Ambient demo: plays vfx-demo-smoke for the caster. Not bound to any item.
id: vfx-demo-smoke
name: {ja: "デモ・煙", en: "Demo Smoke"}
description: {ja: "ambient レーンの煙を再生するデモ。", en: "Plays an ambient-lane smoke bank."}
archetype: sequence
cooldown_ticks: 20
tags: [demo, vfx]
params: {type: sequence}
phases:
  type: sequence
  cast:
  - type: play_vfx
    targets: {type: caster}
    vfx_id: vfx-demo-smoke
    viewers: all
