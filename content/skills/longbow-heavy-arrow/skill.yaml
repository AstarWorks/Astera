# longbow-heavy-arrow: the slow-recovery, hard-hitting arrow; the cast ends when the arrow body ends. Rewritten from zero on the rev4.10 grammar (ADR-0303):
# a visible item display riding the projectile body, the impact as one skill-local fragment, the trail as one rider group.
# Straight flight on purpose (no gravity): the hit tick is balance. Randomness: none. Visuals need a founder look on skill-compare.
apiVersion: astera/v3
kind: Skill
id: longbow-heavy-arrow
item: longbow
meta: {name: {ja: "重矢", en: "Heavy Arrow"}, description: {ja: "次の矢まで時間がかかるが、強烈な一射。", en: "Slow to recover, but hits hard."}, cooldown_ticks: 100, resource_cost: 16, tags: [ranged, physical]}
params:
  launch_speed: {type: number, default: 4.0}
  dmg_physical: {type: number, default: 40}
  max_lifetime_ticks: {type: ticks, default: 60}
anchors:
  - {id: muzzle,  anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: cast_fx, anchor: caster.eye, offset: {up: -0.25, forward: 0.9}, mode: snapshot}
  - {id: heart,   anchor: victim.root, offset: {up: 1.2}, mode: follow}
fragments:
  impact:
    frames_in: {spot: anchor}
    do:
      - {id: snd, op: sound, at: 0, sound: "astera:weapons/blade-crit", anchor: spot, volume: 0.7, pitch: 1.2}
      - {id: spark, op: particle_def, at: 0, def: hit-spark, anchor: spot}
      - {id: fleck, op: particle, at: 0, particle: dust, anchor: spot, count: 4, offset: [0.15, 0.15, 0.15], color: "#a07846", size: 1.0}
machine:
  start: fly
  tail: 14
  states:
    fly:
      on:
        - {event: bolt.end, to: end}
      do:
        - {id: draw, op: body, target: caster, anim: bow-draw, speed: 1.0, at: 0, for: 14, detach: true}
        - {id: snd, op: sound, at: 0, sound: "astera:weapons/sword-swing", anchor: caster, volume: 0.8, pitch: 0.7}
        - {id: fx, op: particle_def, at: 0, def: gun-muzzle-smoke, anchor: cast_fx}
        - id: bolt
          op: projectile
          at: 0
          origin: muzzle
          velocity: "= look(caster) * ${launch_speed}"
          for: "${max_lifetime_ticks}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg_physical}"}}
              - {id: hit_fx, use: "fragment:impact", frames: {spot: heart}}
            block:
              - {id: block_snd, op: sound, at: 0, sound: "astera:weapons/gun-impact-block", anchor: contact.point, volume: 0.5, pitch: 1.5}
              - {id: block_fx, op: particle_def, at: 0, def: hit-spark, anchor: contact.point}
        - {id: shaft, op: display, kind: item, item: "minecraft:arrow", context: fixed, anchor: bolt, scale: [1.4, 1.4, 1.4], at: 0, until: bolt.end}
        - id: trail
          op: group
          at: 0
          every: 1
          until: bolt.end
          do:
            - {id: wake, op: particle, particle: crit, count: 1, offset: [0.04, 0.04, 0.04], anchor: {of: bolt, sweep: 0.4}, at: 0}
            - {id: dust, op: particle, particle: dust, count: 1, color: "#a07846", size: 1.0, anchor: {of: bolt, sweep: 0.4}, at: 0}
    end: {final: true}
