# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: katana-slash

name:
  ja: "居合の一閃"
  en: "Katana Slash"
description:
  ja: "素早く前方を斬る。"
  en: "A quick, light forward slash."

archetype: melee
cooldown_ticks: 8
resource_cost: 5
tags: [ melee, physical ]

params:
  type: melee
  range: 3.3
  arc_degrees: 70.0
  knockback: 0.2
  damage:
    - base: { type: literal, value: 26.0 }
      attribute: physical

phases:
  type: melee
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/sword-swing
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 1.5 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.4, height: -0.2 }
      particle_id: slash-sweep
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/blade-hit
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
  miss: []
