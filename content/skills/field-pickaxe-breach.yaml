# ADR-0280: field tool skill. Tools do the large-scale cover breaking; weapons only chip.

id: field-pickaxe-breach

name:
  ja: "破城の一撃"
  en: "Breach Strike"
description:
  ja: "視線の先の遮蔽物を、小さな範囲でまとめて強打する。石の壁は2回で崩れる。"
  en: "Smashes the cover you are looking at in a small radius. A stone wall falls in two strikes."

archetype: sequence
cooldown_ticks: 160
resource_cost: 0
tags: [ tool, cover ]

block_damage:
  amount: 300          # 3 pickaxe swings of HP, on every cover cell within the radius
  radius: 2.0
  reach: 5.0
  tool: PICKAXE/IRON

params:
  type: sequence

phases:
  type: sequence
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/gun-impact-block
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 0.5 }
