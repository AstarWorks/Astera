# Venom flask: a thrown flask; on a victim or a block it bursts into a poison cloud (enemies within `radius` are poisoned). Re-authored from zero on ADR-0303 rev4.10.
# The cast ends when the projectile body ends. The two bursts share one fragment.
apiVersion: astera/v3
kind: Skill
id: poison-cloud
item: venom-flask
meta: {name: {ja: "毒霧の瓶", en: "Poison Cloud"}, description: {ja: "着弾点に毒の霧を広げる。", en: "Bursts into a lingering poison cloud."}, cooldown_ticks: 160, resource_cost: 16, tags: [ranged, poison, magic, zone]}
params:
  speed:        {type: number, default: 1.3}
  fly:          {type: ticks, default: 50}
  radius:       {type: blocks, default: 3.5}
  poison_ticks: {type: ticks, default: 80}
anchors:
  - {id: start,  anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: muzzle, anchor: caster.eye, offset: {up: -0.25, forward: 0.9}, mode: snapshot}
  - {id: foe,    anchor: victim.root, mode: follow}
fragments:
  cloud:
    frames_in: {spot: anchor}
    params:
      radius:       {type: blocks, default: 3.5}
      poison_ticks: {type: ticks, default: 80}
    do:
      - {id: st_poison, op: status, target: {kind: enemies, around: spot, radius: "${radius}"}, status: poison, stacks: 1, for: "${poison_ticks}"}
      - {id: pts, op: particle, particle: happy_villager, anchor: spot, offset: [0.0, 0.15, 0.0], count: 0, extra: 0.02}
      - {id: dust, op: particle, particle: dust, anchor: spot, offset: [0.0, 0.15, 0.0], count: 1, extra: 0, color: "#5aaa3c", size: 1.4}
      - {id: snd_hit, op: sound, sound: entity.splash_potion.break, anchor: spot, volume: 0.8, pitch: 0.8}
machine:
  start: throw
  states:
    throw:
      on:
        - {event: bolt.end, to: end}
      enter:
        - {id: snd, op: sound, sound: entity.splash_potion.throw, anchor: caster, volume: 0.9, pitch: 0.9}
        - {id: fx, op: particle_def, def: verdant-cast, anchor: muzzle}
      do:
        - id: bolt
          op: projectile
          origin: start
          velocity: "= look(caster) * speed"
          for: "${fly}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: fx, op: use, use: "fragment:cloud", with: {radius: "${radius}", poison_ticks: "${poison_ticks}"}, frames: {spot: foe}}
            block:
              - {id: fx, op: use, use: "fragment:cloud", with: {radius: "${radius}", poison_ticks: "${poison_ticks}"}, frames: {spot: contact}}
        - {id: trail0, op: particle, particle: happy_villager, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.04, 0.04, 0.04], extra: 0, at: 0, every: 1, until: bolt.end}
        - {id: trail1, op: particle, particle: dust, anchor: {of: bolt, sweep: 0.4}, count: 1, extra: 0, color: "#5aaa3c", size: 1.0, at: 0, every: 1, until: bolt.end}
    end: {final: true}
