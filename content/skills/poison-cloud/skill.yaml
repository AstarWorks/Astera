# Venom flask: a thrown flask; on a victim or a block it bursts into a poison cloud (enemies within `radius` are poisoned). Re-authored from zero on ADR-0303 rev4.10.
# The cast ends when the projectile body ends. Frame grammar (ADR-0314): tip - the caster's hand (eye / aim basis, 0.9 ahead, 0.25 below, 0.25 right):
# the throw sound, the cast puff and the flask leave it; head - the flask's body (v along its velocity), the trail is a segment of it;
# hit / blk - one per victim / block contact: the cloud puff is drawn on it (hit sits at the victim's centre, 0.75 down = the feet).
# The poison status is one row per handler, its area centred on the hit / blk frame. Gameplay unchanged.
apiVersion: astera/v3
kind: Skill
id: poison-cloud
item: venom-flask
meta: {name: {ja: "毒霧の瓶", en: "Poison Cloud"}, description: {ja: "着弾点に毒の霧を広げる。", en: "Bursts into a lingering poison cloud."}, cooldown_ticks: 160, resource_cost: 16, tags: [ranged, poison, magic, zone]}
params:
  speed:        {type: number, default: 1.3}
  fly:          {type: ticks, default: 50}
  radius:       {type: blocks, default: 3.5}
  poison_ticks: {type: ticks, default: 80}
frames:
  - {id: tip, origin: caster.eye, v: aim, w: s x v, s: right, move: [{at: 0, for: 0, to: {v: 0.9, w: -0.25, s: 0.25}}]}
  - {id: head, origin: bolt, v: velocity, w: up, w_fallback: [1, 0, 0], s: v x w}
  - {id: hit, on: event.victim, each: true, origin: victim.center, v: incoming, w: up, w_fallback: [1, 0, 0], s: v x w}
  - {id: blk, on: event.block, each: true, origin: contact, v: incoming, w: up, w_fallback: [1, 0, 0], s: v x w}
machine:
  start: throw
  states:
    throw:
      on:
        - {event: bolt.end, to: end}
      enter:
        - {id: snd, op: sound, sound: entity.splash_potion.throw, frame: tip, volume: 0.9, pitch: 0.9}
        - {id: fx, op: particle_def, def: verdant-cast, frame: tip}
      do:
        - id: bolt
          op: projectile
          frame: tip
          velocity: "= look(caster) * speed"
          for: "${fly}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: st_poison, op: status, target: {kind: enemies, frame: hit, pos: {v: 0}, radius: "${radius}"}, status: poison, stacks: 1, for: "${poison_ticks}"}
              - {id: pts, op: particle, particle: happy_villager, frame: hit, pos: {w: -0.75}, count: 0, extra: 0.02}
              - {id: dust, op: particle, particle: dust, frame: hit, pos: {w: -0.75}, count: 1, extra: 0, color: "#5aaa3c", size: 1.4}
              - {id: snd_hit, op: sound, sound: entity.splash_potion.break, frame: hit, pos: {w: -0.75}, volume: 0.8, pitch: 0.8}
            block:
              - {id: st_poison_b, op: status, target: {kind: enemies, frame: blk, pos: {v: 0}, radius: "${radius}"}, status: poison, stacks: 1, for: "${poison_ticks}"}
              - {id: pts_b, op: particle, particle: happy_villager, frame: blk, pos: {w: 0.15}, count: 0, extra: 0.02}
              - {id: dust_b, op: particle, particle: dust, frame: blk, pos: {w: 0.15}, count: 1, extra: 0, color: "#5aaa3c", size: 1.4}
              - {id: snd_blk, op: sound, sound: entity.splash_potion.break, frame: blk, volume: 0.8, pitch: 0.8}
        - {id: trail0, op: particle, particle: happy_villager, frame: head, pos: {v: 0}, to: {v: -1.3}, samples: 2, count: 1, offset: [0.04, 0.04, 0.04], extra: 0, at: 0, every: 1, until: bolt.end}
        - {id: trail1, op: particle, particle: dust, frame: head, pos: {v: 0}, to: {v: -1.3}, samples: 2, count: 1, extra: 0, color: "#5aaa3c", size: 1.0, at: 0, every: 1, until: bolt.end}
    end: {final: true}
