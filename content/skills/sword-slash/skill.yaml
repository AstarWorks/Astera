# sword-slash: base of the knight-sword tiers. sword-slash-t2..t4 extend it (ADR-0303 9.3): another id, item, meta and dmg.
# Wind-up W = 3 ticks (round_half_up(5 / attack_speed 1.6)): the blade is drawn back to the caster's right, the sweep hits at tick 3, the cast ends one tick
# later (miss cue at tick 2 after the hit). The weapon rig, the sweep fx and the blade trail are detach: true, so the follow-through plays on after the cast end (tail).
# Rig: ONE swing written as the tip's travel (caster frame: left/up/forward, right = -left). The pull-back goes to the right with the edge trailing
# (the cutting edge already faces the cut), the cut crosses to the left with the edge leading, then the blade settles back toward guard.
apiVersion: astera/v3
kind: Skill
id: sword-slash
item: knight-sword
meta:
  name: {ja: "斬撃", en: "Sword Slash"}
  description: {ja: "前方を薙ぎ払う基本の斬撃。", en: "A basic sweeping slash."}
  cooldown_ticks: 10
  tags: [melee, physical]
params:
  dmg: {type: number, default: 40.0}
anchors:
  - {id: sweep_pt, anchor: caster.eye, offset: {up: -0.3, forward: 1.6}, mode: follow}
  - {id: heart, anchor: victim.root, offset: {up: 1.2}, mode: follow}   # was pt_enemy_0_1p2_0 (victim feet, yaw-only)
machine:
  start: windup
  tail: 9
  states:
    windup:
      for: 3
      then: strike
      do:
        - id: rig
          op: rig
          parent: caster
          mount: caster.hand_r
          rest: [{axis: left, deg: 72}]
          for: 12
          detach: true
          swing:
            - {at: 0, for: 2, from: {left: -0.1, up: 0.8, forward: 0.6}, to: {left: -0.9, up: 0.4, forward: 0.1}, edge: trailing, ease: in_out_sine}
            - {at: 2, for: 4, to: {left: 0.9, up: -0.15, forward: 0.5}, edge: leading, roll: 20, ease: out_cubic}
            - {at: 6, for: 6, to: {left: 0.0, up: 0.6, forward: 0.7}, edge: trailing, ease: in_out_sine}
    strike:
      for: 2
      then: end
      enter:
        - id: swing
          op: hit
          at: 0
          anchor: caster.eye
          shape: {sector: {deg: 100, range: 3.5, height: 2.0, forward: look}}
          targets: enemies
          ignore_invulnerability: false
          damage: {physical: "${dmg}"}
          window: once
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: 0.4}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart, detach: true}
            miss:
              - {id: snd_miss, op: sound, at: 2, sound: "astera:weapons/blade-miss", anchor: caster, detach: true}
        - {id: snd, op: sound, at: 0, sound: "astera:weapons/sword-swing", anchor: caster, detach: true}
        - {id: fx, op: particle_def, at: 0, def: slash-sweep, anchor: sweep_pt, detach: true}
        - {id: trail_fx, use: swing-trail, with: {samples: 2, span: 7, extra: 0.05}, frames: {weapon: /windup/rig}, detach: true}
    end: {final: true}
