# sword-slash: the knight-sword's basic cut in the frame grammar (ADR-0314, ADR-0315). sword-slash-t2..t4 extend it (ADR-0303 9.3): another id, item, meta and
# dmg, the same frames, so the four tiers cut the same arc. Wind-up W = 3 ticks, the sweep hits at tick 3, the cast ends one tick later; the rig, the sweep fx
# and the trail are detach: true and play on after the cast end (tail).
# Four frames carry everything drawn:
#   arm    - the right arm, rotate keys only. Origin = the right shoulder (`caster.shoulder_r`); the arm is one rigid 0.60 bone, so the hand can only travel on
#            a sphere about that point, and a turn of this frame is exactly that travel. About w the hand swings left/right, about s it rises and falls:
#            guard (low in front) -> drawn out to the right at shoulder height -> across to the left and down (the cut) -> back to guard.
#   blade  - the sword. Origin = the point 0.60 along the arm (`{frame: arm, pos: {v: 0.6}}`), i.e. the hand; the engine pins the right hand to it. Long axis
#            along v (grip at the origin, tip at v 1.09), edge along w. One roll about v turns the edge to the left, then the cut is a turn about s, which
#            moves v towards w: the edge leads by construction. The wind-up turns the tip to the right (-60), the cut carries it across the front to the left
#            (+80, hit at tick 3 while the blade crosses the middle), `reset` eases the chain back to guard.
#            The line `edge` (0.65 -> tip 1.09) is what the trail rows draw along.
#   body   - the caster's feet, v forward / w up / s right: the sound. (The sweep arc sprite `fx` sits on frame `arc` (origin = the hand, a fixed cut plane, so it does not turn with the blade): a flat crescent centred on the hand, in a fixed horizontal cut plane, twice the blade length so its rim is at the blade tip: it shows the path the edge travels.)
#   wound  - one per victim at the victim's centre, v the way the blow came in: the hit spark and the hit sound.
# Gameplay (hit tick, sector, damage, knockback, cooldown, cast length) is unchanged.
apiVersion: astera/v3
kind: Skill
id: sword-slash
item: knight-sword
meta:
  name: {ja: "斬撃", en: "Sword Slash"}
  description: {ja: "前方を薙ぎ払う基本の斬撃。", en: "A basic sweeping slash."}
  cooldown_ticks: 10
  tags: [melee, physical]
params:
  dmg: {type: number, default: 40.0}
frames:
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 2, about: w, to: -72, ease: in_out_sine}                 # draw: the hand swings out to the right ...
      - {at: 2, for: 3, about: w, to: 72, ease: out_cubic}                    # the cut: the hand sweeps across to the left, back down
      - {at: 5, for: 7, about: w, to: -9, ease: in_out_sine}                  # follow-through: back to guard
      - {at: 0, for: 0, about: s, to: -41}                                    # guard: the hand low in front of the hip
      - {at: 0, for: 2, about: s, to: 1, ease: in_out_sine}                   # ... and up to shoulder height
      - {at: 2, for: 3, about: s, to: -34, ease: out_cubic}
      - {at: 5, for: 7, about: s, to: -41, ease: in_out_sine}
  - id: blade
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: v, to: -80}                                    # edge to the left: the cut is flat, a touch rising
      - {at: 0, for: 2, about: s, to: -60, ease: in_out_sine}                 # tip to the right
      - {at: 2, for: 3, about: s, to: 80, ease: out_cubic}                    # the cut, edge first
      - {at: 5, for: 7, reset: true, ease: in_out_sine}
  - id: arc
    origin: {frame: blade}
    v: forward
    w: left
    s: v x w
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: wound
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
lines:
  edge: {frame: blade, from: {v: 0.65}, to: {v: 1.09}}           # outer half of the blade (the inner half stays out of the caster eye volume)
machine:
  start: windup
  tail: 9
  states:
    windup:
      for: 3
      then: strike
      do:
        - {id: rig, op: rig, frame: blade, for: 12, detach: true}
    strike:
      for: 2
      then: end
      enter:
        - id: swing
          op: hit
          at: 0
          anchor: caster.eye
          shape: {sector: {deg: 100, range: 3.5, height: 2.0, forward: look}}
          targets: enemies
          ignore_invulnerability: false
          damage: {physical: "${dmg}"}
          window: once
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: 0.4}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", frame: wound, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, frame: wound, pos: {w: 0.2}, detach: true}
            miss:
              - {id: snd_miss, op: sound, at: 2, sound: "astera:weapons/blade-miss", frame: body, detach: true}
        - {id: snd, op: sound, at: 0, sound: "astera:weapons/sword-swing", frame: body, detach: true}
        - {id: fx, op: display, at: 0, for: 3, kind: sprite, sprite: slash, size: [2.18, 2.18], frame: arc, plane: [w, v], see_through: true, brightness: {block: 15, sky: 15}, detach: true}  # the sweep arc: a flat crescent on the fixed cut plane `arc`, rim at the blade tip, over the cut ticks
        - {id: trail_fx, op: particle, particle: crit, along: edge, samples: 2, count: 1, extra: 0.05, at: 0, every: 1, for: 4, detach: true}
    end: {final: true}
