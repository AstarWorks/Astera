# sword-slash: the knight-sword's basic cut in the frame grammar (ADR-0314, ADR-0315). sword-slash-t2..t4 extend it (ADR-0303 9.3): another id, item, meta and
# dmg, the same frames, so the four tiers cut the same arc. Wind-up W = 3 ticks, the sweep hits at tick 3, the cast ends one tick later; the rig, the sweep fx
# and the trail are detach: true and play on after the cast end (tail).
# Three frames carry everything drawn:
#   blade  - the sword. Origin at the caster's feet, moved along the hand path (`move:`: guard low in front -> cocked high at the right -> across to the left
#            -> back to guard; every point inside the 0.60 reach of the right shoulder at v 0 / w 1.29 / s 0.29, the engine pins the right hand to the
#            origin). Long axis along v (grip at the origin, tip at v 1.09), edge along w. One roll about v turns the edge to the left, then the cut is a turn
#            about s, which moves v towards w: the edge leads by construction. The wind-up turns the tip to the right (-60), the cut carries it across the front
#            to the left (+80, hit at tick 3 while the blade crosses the middle), `reset` eases the chain back to guard.
#            The line `edge` (guard 0.2 -> tip 1.09) is what the trail rows draw along.
#   body   - the caster's feet, v forward / w up / s right: the sound and the sweep fx (1.4 ahead, at chest height).
#   wound  - one per victim at the victim's centre, v the way the blow came in: the hit spark and the hit sound.
# Gameplay (hit tick, sector, damage, knockback, cooldown, cast length) is unchanged.
apiVersion: astera/v3
kind: Skill
id: sword-slash
item: knight-sword
meta:
  name: {ja: "斬撃", en: "Sword Slash"}
  description: {ja: "前方を薙ぎ払う基本の斬撃。", en: "A basic sweeping slash."}
  cooldown_ticks: 10
  tags: [melee, physical]
params:
  dmg: {type: number, default: 40.0}
frames:
  - id: blade
    origin: caster
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: 0.45, w: 0.9, s: 0.36}}  # guard
      - {at: 0, for: 1, to: {v: 0.39, w: 1.06, s: 0.69}}
      - {at: 1, for: 1, to: {v: 0.19, w: 1.3, s: 0.86}}
      - {at: 2, for: 1, to: {v: 0.43, w: 0.9, s: 0.13}}
      - {at: 3, for: 1, to: {v: 0.25, w: 0.95, s: -0.14}}
      - {at: 5, for: 1, to: {v: 0.25, w: 0.9, s: -0.09}}
      - {at: 6, for: 1, to: {v: 0.31, w: 0.87, s: -0.02}}
      - {at: 7, for: 1, to: {v: 0.34, w: 0.85, s: 0.07}}
      - {at: 8, for: 1, to: {v: 0.42, w: 0.87, s: 0.25}}
      - {at: 9, for: 1, to: {v: 0.43, w: 0.87, s: 0.28}}
      - {at: 10, for: 1, to: {v: 0.45, w: 0.9, s: 0.34}}
      - {at: 11, for: 1, to: {v: 0.45, w: 0.9, s: 0.36}}
    rotate:
      - {at: 0, for: 0, about: v, to: -80}                                    # edge to the left: the cut is flat, a touch rising
      - {at: 0, for: 2, about: s, to: -60, ease: in_out_sine}                 # tip to the right
      - {at: 2, for: 3, about: s, to: 80, ease: out_cubic}                    # the cut, edge first
      - {at: 5, for: 7, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: wound
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
lines:
  edge: {frame: blade, from: {v: 0.65}, to: {v: 1.09}}           # outer half of the blade (the inner half stays out of the caster eye volume)
machine:
  start: windup
  tail: 9
  states:
    windup:
      for: 3
      then: strike
      do:
        - {id: rig, op: rig, frame: blade, for: 12, detach: true}
    strike:
      for: 2
      then: end
      enter:
        - id: swing
          op: hit
          at: 0
          anchor: caster.eye
          shape: {sector: {deg: 100, range: 3.5, height: 2.0, forward: look}}
          targets: enemies
          ignore_invulnerability: false
          damage: {physical: "${dmg}"}
          window: once
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: 0.4}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", frame: wound, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, frame: wound, pos: {w: 0.2}, detach: true}
            miss:
              - {id: snd_miss, op: sound, at: 2, sound: "astera:weapons/blade-miss", frame: body, detach: true}
        - {id: snd, op: sound, at: 0, sound: "astera:weapons/sword-swing", frame: body, detach: true}
        - {id: fx, op: particle_def, at: 0, def: slash-sweep, frame: body, pos: {v: 1.4, w: 1.4}, detach: true}
        - {id: trail_fx, op: particle, particle: crit, along: edge, samples: 2, count: 1, extra: 0.05, at: 0, every: 1, for: 4, detach: true}
    end: {final: true}
