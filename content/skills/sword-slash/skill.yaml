apiVersion: astera/v3
kind: Skill
id: sword-slash
item: knight-sword
meta:
  name: {ja: "斬撃", en: "Sword Slash"}
  description: {ja: "前方を薙ぎ払う基本の斬撃。", en: "A basic sweeping slash."}
  cooldown_ticks: 10
  tags: [melee, physical]
# GAP: gameplay.expose (damage <- dmg_physical, arc_deg, range) -> none (inline literals)
anchors:
  - {id: sweep_pt, anchor: caster.eye, offset: {up: -0.3, forward: 1.6}}
  - {id: foe,   anchor: victim.root}
  - {id: heart, anchor: victim.root, offset: {up: 1.2}}
machine:
  start: swing
  states:
    swing:
      for: 1
      then: end
      do:
        - id: swing
          op: hit
          at: 0
          anchor: caster.eye
          shape: {sector: {deg: 100, range: 3.5, height: 2.0}}
          targets: enemies
          damage: {physical: 40.0}
          window: once
          on:
            hit:
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: foe}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
        - {id: snd, op: sound, sound: "astera:weapons/sword-swing", anchor: caster}
        - {id: fx, op: particle_def, def: slash-sweep, anchor: sweep_pt}
        # GAP: counter swing_hits (+1 per hit) and sound blade-miss when counter('swing_hits') == 0.0 (miss cue) -> none (no counter op; class-L when is not allowed on a sound)
    end: {final: true}
