# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: smg-rush

name:
  ja: "ダッシュ"
  en: "Rush"
description:
  ja: "一時的に素早く動けるようになる。"
  en: "A short burst of speed."

archetype: buff
cooldown_ticks: 200
resource_cost: 0
tags: [ gun, movement ]

params:
  type: buff
  status_effect_id: swift
  duration_ticks: 50

phases:
  type: buff
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/dash-whoosh
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 0.2, z: 0.0 } } }
      particle_id: dash-cloud
  expire: []
  removed: []
