# Fire staff bolt: one flying fire charge; on a victim it deals fire damage and may ignite, on a block it bursts, on expiry it fizzles.
# Frame grammar (ADR-0314): tip = the staff head on the caster's eye/aim basis (cast puff, sound and the bolt leave it), head = the bolt body
# (the shell and a trail segment 1.4 long = one tick of flight), hit / blk = one frame per victim / block contact, v the way the bolt came in:
# the burst (sound, explosion, flames, smoke, rings) is drawn on them. Only the expire fizzle keeps the contact-point anchor (no contact frame there).
# The flight trail starts at tick 2 (the bolt is past the caster eye view volume by then; near-eye rule, CasterEyeClutter). Gameplay unchanged.
apiVersion: astera/v3
kind: Skill
id: flame-burst
item: fire-staff
meta:
  name: {ja: "炎の爆発", en: "Flame Burst"}
  description: {ja: "広範囲に炎属性ダメージを与え、対象に燃焼を付与する。", en: "A wide fire-attribute blast that ignites every target it touches."}
  cooldown_ticks: 80
  resource_cost: 25
  tags: [ranged, fire-family, aoe]
params:
  dmg_fire:     {type: number, default: 40.0}
  burn_ticks:   {type: ticks, default: 20}
  burn_chance:  {type: number, default: 0.85}
  speed:        {type: number, default: 1.4}
  fly:          {type: ticks, default: 50}
frames:
  - {id: tip, origin: caster.eye, v: aim, w: s x v, s: right, move: [{at: 0, for: 0, to: {v: 1.3, w: -0.3, s: 0.25}}]}
  - {id: head, origin: bolt, v: velocity, w: up, s: v x w}
  - {id: hit, on: event.victim, each: true, origin: victim.center, v: incoming, w: up, s: v x w}
  - {id: blk, on: event.block, each: true, origin: contact, v: incoming, w: up, s: v x w}
machine:
  start: fly
  states:
    fly:
      for: 51      # fly + 1; a state `for` must be a literal (C5)
      then: end
      on:
        - {event: bolt.end, to: end}
      do:
        - {id: snd, op: sound, sound: "astera:skill/wand/cast", frame: tip, volume: 0.8, pitch: 1.1}
        - {id: fx, op: particle, particle: flame, frame: tip, count: 2, offset: [0.04, 0.04, 0.04]}
        - {id: shell, op: display, kind: item, item: "minecraft:fire_charge", context: fixed, frame: head, scale: [0.9, 0.9, 0.9], at: 0, until: bolt.end}
        - {id: trail_flame, op: particle, particle: flame, frame: head, pos: {v: 0}, to: {v: -1.4}, samples: 3, count: 1, offset: [0.12, 0.12, 0.12], extra: 0.02, at: 2, every: 1, until: bolt.end}
        - {id: trail_dust, op: particle, particle: dust, frame: head, pos: {v: 0}, to: {v: -1.4}, samples: 2, count: 1, offset: [0.1, 0.1, 0.1], color: "#ff7814", size: 1.6, at: 2, every: 1, until: bolt.end}
        - {id: trail_lava, op: particle, particle: lava, frame: head, pos: {v: -0.7}, count: 1, offset: [0.08, 0.08, 0.08], at: 2, every: 1, until: bolt.end}
        - {id: trail_smoke, op: particle_def, def: smoke-dark, frame: head, at: 2, every: 1, until: bolt.end}
        - id: bolt
          op: projectile
          frame: tip
          velocity: "= look(caster) * speed"
          for: "${fly}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {fire: "${dmg_fire}"}}
              - {id: st_burn, op: status, target: event.victim, status: burn, stacks: 1, for: "${burn_ticks}", when: "= rand() < burn_chance"}
              - {id: chip, op: break_area, at: 0, frame: hit, pos: {v: 0}, shape: {sphere: {radius: 1.5}}, tool: none, block_damage: 35, ripple: 29, revert: 200, outside_arena: false}
              - {id: lava, op: particle, particle: lava, frame: hit, count: 12, extra: 0.1}
              - {id: snd_hit, op: sound, sound: "astera:skills/fire-impact", frame: hit, volume: 0.45, pitch: 1.3}
              - {id: boom, op: particle, particle: explosion, frame: hit, count: 1}
              - {id: flame, op: particle, particle: flame, frame: hit, count: 60, extra: 0.24}
              - {id: smoke, op: particle_def, def: smoke-dark, frame: hit}
              - {id: ring_flame, op: particle, particle: flame, frame: hit, count: 0, extra: 0.08}
              - {id: ring_dust, op: particle, particle: dust, frame: hit, count: 1, color: "#ff6e14", size: 2.0}
            block:
              - {id: chip, op: break_area, at: 0, frame: blk, pos: {v: 0}, shape: {sphere: {radius: 1.5}}, tool: none, block_damage: 35, ripple: 29, revert: 200, outside_arena: false}
              - {id: snd_blk, op: sound, sound: "astera:skills/fire-impact", frame: blk, volume: 0.45, pitch: 1.4}
              - {id: boom_blk, op: particle, particle: explosion, frame: blk, count: 1}
              - {id: flame_blk, op: particle, particle: flame, frame: blk, count: 50, extra: 0.24}
              - {id: smoke_blk, op: particle_def, def: smoke-dark, frame: blk}
              - {id: ring_flame_blk, op: particle, particle: flame, frame: blk, count: 0, extra: 0.08}
              - {id: ring_dust_blk, op: particle, particle: dust, frame: blk, count: 1, color: "#ff6e14", size: 2.0}
            expire:
              - {id: snd_end, op: sound, sound: "astera:skills/fire-impact", frame: head, volume: 0.4, pitch: 1.2}
              - {id: fx_end, op: particle_def, def: fire-impact-smoke, frame: head}
    end: {final: true}
