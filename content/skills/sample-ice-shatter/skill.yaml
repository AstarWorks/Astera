apiVersion: astera/v3
kind: Skill
id: sample-ice-shatter
meta:
  name:
    en: Ice Shatter
    ja: sample-ice-shatter
  description:
    en: 'Sprite gallery demo: 4 block plate, 1 frame per tick.'
    ja: ギャラリー用。4ブロック四方、1 tick/フレーム。
  cooldown_ticks: 0
  resource_cost: 0
  tags:
  - sample
anchors:
- id: surface
  anchor: caster
  offset:
    up: 2.4
    forward: 3
machine:
  start: show
  states:
    show:
      for: 40
      do:
      - id: surface
        op: display
        kind: sprite
        anchor: surface
        for: 40
        sprite: sample-ice-shatter
        size:
        - 4
        - 4
        billboard: center
        brightness:
          block: 15
          sky: 15
        flipbook:
          frames: 8
          every: 1
          loop: true
      then: end
    end:
      final: true
