# Bastion greatsword S1 (Moon Sweep), natural v3 grammar: three states (sweep1 / sweep2 / slam) = the three weapon swings; the rig is declared once
# in sweep1 and detached so it runs through the whole cast (machine.tail), later states read /sweep1/rig.root and /sweep1/rig.tip. Blade fx are segments
# between the rig points, dust/impact/ring bursts are small families (times / shift CEL) at one centre point instead of baked frame+particle pairs.
# Gameplay (hit ticks 7 / 31, damage, status, knockback, dashes, freezes) and the cast length 58 are the v2 values unchanged.
apiVersion: astera/v3
kind: Skill
id: bastion-greatsword-s1
item: bastion-greatsword
meta:
  name: {ja: "月輪の薙ぎ", en: "Moon Sweep"}
  description: {ja: "一歩踏み込んで腰の高さで二度薙ぎ払う。初撃が当たると溜めを得る。", en: "Step in and sweep twice at waist height. Landing the first banks charge."}
  cooldown_ticks: 64
  resource_cost: 20
  tags: [melee, physical, charge]
params:
  radius: {type: blocks, default: 3.0}
  dmg_physical: {type: number, default: 35}
  dmg_physical_2: {type: number, default: 45}
  charge_ticks: {type: ticks, default: 400}
  charge_stacks: {type: number, default: 1}
  dash_distance: {type: blocks, default: 2.4}
  dash_distance_2: {type: blocks, default: 2.6}
  knockback: {type: number, default: 0.5}
anchors:
  # v2: frame fx2_bastion_s1_fx_high at caster orient yaw follow, group tick 3
  # NOTE: v2 created this frame at tick 3; a doc-level anchor exists from tick 0 and follows the caster the same way
  - {id: fx2_fx_high, anchor: caster, mode: follow}
  # v2: frame fx3_bastion_s1_fx_low at caster orient yaw follow, group tick 27
  # NOTE: v2 created this frame at tick 27; a doc-level anchor exists from tick 0 and follows the caster the same way
  - {id: fx3_fx_low, anchor: caster, mode: follow}
machine:
  start: sweep1
  tail: 30
  states:
    sweep1:
      for: 28
      then: sweep2
      do:
        # --- gameplay swing 1 (v2 t4 dash / t7 hit): the dash ends at its first victim, the hit freezes caster and victim 2 ticks ---
        - {id: dash_hit, op: hit, at: 4, for: 3, every: 1, anchor: caster.body, shape: {sphere: 1.7}, targets: enemies, window: once, ignore_invulnerability: false}
        - {id: dash, op: dash, at: 4, speed: "= dash_distance / 3", for: 3, until: dash_hit.hit, direction: {forward: 1.0}, invulnerable: true, stop_on_block: true, follow_pitch: false, face_movement: false}
        - {id: hit1, op: hit, at: 7, anchor: caster, shape: {sphere: "${radius}"}, targets: enemies, damage: {physical: "${dmg_physical}"}, window: once, ignore_invulnerability: true, on: {hit: [{id: react, op: react, target: event.victim, flinch: true, for: 6}, {id: stop, op: freeze, at: 0, ticks: 2, scope: [caster, event.victim]}]}}
        - {id: st_charge, op: status, at: 7, target: caster, status: charge, stacks: "${charge_stacks}", for: "${charge_ticks}", when: "= nearest_enemy_dist(caster) < 3.6"}
        - id: rig
          op: rig
          parent: caster
          mount: caster.hand_r
          anim: bastion-s1-body
          rest: [{axis: left, deg: 72}]
          respect_hit_stop: true
          freezes: [{at: 7, ticks: 2}, {at: 31, ticks: 2}]
          for: 58
          detach: true
          swing:
            # swing 1 (ticks 2-22): wind-up behind, cut down at the hit (tick 7), sweep up and over to the front
            - {at: 2, for: 5, from: {left: -0.95553, up: -0.0235, forward: -0.29395}, to: {left: -0.24629, up: -0.96705, forward: -0.06444}, edge: trailing, roll: 39.9, ease: in_quad}
            - {at: 7, for: 7, to: {left: 0.53139, up: -0.14142, forward: 0.83524}, edge: trailing, roll: -70.2, ease: out_cubic}
            - {at: 14, for: 8, to: {left: -0.1298, up: -0.21654, forward: 0.96761}, edge: leading, roll: 11.3, ease: in_out_sine}
            # swing 2 (ticks 24-44): lift to the left, cut across at the hit (tick 31), follow through to the right
            - {at: 24, for: 5, from: {left: -0.1298, up: -0.21654, forward: 0.96761}, to: {left: 0.68894, up: 0.05507, forward: 0.72272}, edge: trailing, roll: 62.2, ease: in_quad}
            - {at: 29, for: 7, to: {left: -0.37137, up: -0.91282, forward: -0.16986}, edge: leading, roll: -31.9, ease: out_cubic}
            - {at: 36, for: 8, to: {left: 0.94723, up: 0.09866, forward: 0.305}, edge: trailing, roll: 34.7, ease: in_out_sine}
            # swing 3 (ticks 46-56): raise, slam down; the rest pose comes back at 56
            - {at: 46, for: 4, from: {left: 0.94723, up: 0.09866, forward: 0.305}, to: {left: -0.03872, up: 0.78715, forward: 0.61554}, edge: trailing, roll: -79.1, ease: in_quad}
            - {at: 50, for: 6, to: {left: 0.0, up: -0.51, forward: 0.86}, edge: leading, roll: 0.0, ease: out_cubic}
            - {at: 56, reset: true}
        # --- sound ---
        - {id: snd, op: sound, at: 0, sound: block.gravel.step, anchor: caster, volume: 1.0, pitch: 0.6}
        - {id: snd_2, op: sound, at: 0, sound: entity.ravager.step, anchor: caster, volume: 0.6, pitch: 0.8}
        - {id: snd_3, op: sound, at: 2, sound: item.armor.equip_chain, anchor: caster, volume: 0.9, pitch: 0.7}
        - {id: snd_4, op: sound, at: 2, sound: item.armor.equip_iron, anchor: caster, volume: 0.6, pitch: 0.6}
        - {id: snd_5, op: sound, at: 4, sound: entity.player.attack.sweep, anchor: caster, volume: 1.0, pitch: 0.5}
        - {id: snd_6, op: sound, at: 4, sound: item.trident.throw, anchor: caster, volume: 0.7, pitch: 0.6}
        - {id: snd_7, op: sound, at: 7, sound: item.mace.smash_ground_heavy, anchor: caster, volume: 1.0, pitch: 0.9}
        - {id: snd_8, op: sound, at: 7, sound: block.anvil.land, anchor: caster, volume: 0.8, pitch: 0.6}
        - {id: snd_9, op: sound, at: 7, sound: entity.player.attack.crit, anchor: caster, volume: 1.0, pitch: 0.8}
        - {id: snd_10, op: sound, at: 8, sound: item.armor.equip_netherite, anchor: caster, volume: 0.9, pitch: 0.6}
        - {id: snd_11, op: sound, at: 8, sound: block.chain.place, anchor: caster, volume: 0.8, pitch: 0.6}
        - {id: snd_12, op: sound, at: 18, sound: item.armor.equip_iron, anchor: caster, volume: 1.0, pitch: 0.8}
        - {id: snd_13, op: sound, at: 22, sound: item.armor.equip_chain, anchor: caster, volume: 0.9, pitch: 0.7}
        - {id: snd_14, op: sound, at: 22, sound: item.armor.equip_iron, anchor: caster, volume: 0.6, pitch: 0.6}
        - {id: snd_15, op: sound, at: 26, sound: entity.player.attack.sweep, anchor: caster, volume: 1.0, pitch: 0.45}
        - {id: snd_16, op: sound, at: 26, sound: entity.breeze.wind_burst, anchor: caster, volume: 0.6, pitch: 0.5}
        - {id: snd_17, op: sound, at: 26, sound: item.trident.throw, anchor: caster, volume: 0.8, pitch: 0.5}
        # --- hit ring (front and back quarters) and the first streak / flash ---
        - {id: fx2_fx_high_s1h1_ring_quarters, op: display, times: 4, at: [3, 4, 3, 7], kind: sprite, see_through: true, sprite: [bastion-s1-hring-q0, bastion-s1-hring-q1, bastion-s1-hring-q2, bastion-s1-hring-q3], size: [3.047, 3.047], anchor: fx2_fx_high, brightness: {block: 15, sky: 15}, offset: [{left: -1.862, up: 1.543, forward: 1.485}, {left: 1.138, up: 1.543, forward: 1.508}, {left: -1.838, up: 1.332, forward: -1.508}, {left: 1.162, up: 1.332, forward: -1.485}], rotate: [{axis: up, deg: 0.35418}, {axis: left, deg: 85.96954}, {axis: forward, deg: 0.3301}], for: "= 16 - [3, 4, 3, 7][int(i)]"}
        - {id: fx2_fx_high_s1h1_ring_bquarters, op: display, times: 4, at: [3, 4, 3, 7], kind: sprite, see_through: true, sprite: [bastion-s1-hring-bq0, bastion-s1-hring-bq1, bastion-s1-hring-bq2, bastion-s1-hring-bq3], size: [3.047, 3.047], anchor: fx2_fx_high, brightness: {block: 15, sky: 15}, offset: [{left: -1.862, up: 1.543, forward: 1.485}, {left: 1.138, up: 1.543, forward: 1.508}, {left: -1.838, up: 1.332, forward: -1.508}, {left: 1.162, up: 1.332, forward: -1.485}], rotate: [{axis: up, deg: 179.6}, {axis: left, deg: -85.97}], for: "= 16 - [3, 4, 3, 7][int(i)]"}
        - {id: fx2_fx_high_s1h1_streak_main, op: display, at: 6, kind: sprite, see_through: true, sprite: bastion-s1-streak, size: [2.4998, 1.92], anchor: fx2_fx_high, brightness: {block: 15, sky: 15}, billboard: center, offset: {left: -0.439, up: 1.58, forward: 1.5}, rotate: [{axis: forward, deg: 6.0}], for: 7, motion: [{law: keys, keys: [{t: 0, offset: {left: -0.439, up: 1.58, forward: 1.5}, pose: [{axis: forward, deg: 6.0}], scale: {left: 1.0, up: 1.0, forward: 1.0}}, {t: 1, offset: {left: -0.439, up: 1.58, forward: 1.5}, pose: [{axis: forward, deg: 6.0}], scale: {left: 1.2002, up: 1.0, forward: 1.0}, ease: out_quad}, {t: 6, offset: {left: -0.439, up: 1.58, forward: 1.5}, pose: [{axis: forward, deg: 6.0}], scale: {left: 0.9201, up: 0.1, forward: 1.0}, ease: in_quad}]}]}
        - {id: fx2_fx_high_s1h1_flash, op: display, at: 6, kind: sprite, see_through: true, sprite: bastion-s1-flare, size: [1.1002, 1.1002], anchor: fx2_fx_high, brightness: {block: 15, sky: 15}, billboard: center, offset: {left: -0.439, up: 1.54, forward: 1.59}, for: 4, motion: [{law: keys, keys: [{t: 0, offset: {left: -0.439, up: 1.54, forward: 1.59}, pose: [], scale: {left: 1.0, up: 1.0, forward: 1.0}}, {t: 1, offset: {left: -0.439, up: 1.54, forward: 1.59}, pose: [], scale: {left: 0.8633, up: 0.8633, forward: 1.0}, ease: out_quad}, {t: 3, offset: {left: -0.439, up: 1.54, forward: 1.59}, pose: [], scale: {left: 0.409, up: 0.409, forward: 1.0}, ease: in_quad}]}]}
        # --- dust gathering at the blade tip: two points of the root-tip segment, three overlapping defs ---
        - {id: gather_a, op: particle_def, def: bastion-s1-p-gather-1, at: 4, every: 1, for: 3, anchor: {of: rig.root, to: rig.tip, samples: 2}}
        - {id: gather_b, op: particle_def, def: bastion-s1-p-gather-2, at: 4, every: 1, for: 2, anchor: {of: rig.root, to: rig.tip, samples: 2}}
        - {id: gather_c, op: particle_def, def: bastion-s1-p-gather-3, at: 4, anchor: {of: rig.root, to: rig.tip, samples: 2}}
        # the swing-1 follow-up waves (v2 ticks 7 and 14): def 3 first, 2 a tick later, 1 two ticks later, three ticks each
        - id: wave
          at: 7
          every: 7
          times: 2
          do:
            - {id: w3, op: particle_def, def: bastion-s1-p-gather-3, every: 1, for: 3, anchor: {of: rig.root, to: rig.tip, samples: 2}}
            - {id: w2, op: particle_def, def: bastion-s1-p-gather-2, at: 1, every: 1, for: 3, anchor: {of: rig.root, to: rig.tip, samples: 2}}
            - {id: w1, op: particle_def, def: bastion-s1-p-gather-1, at: 2, every: 1, for: 3, anchor: {of: rig.root, to: rig.tip, samples: 2}}
        # --- hit 1 impact (tick 7): dust / crit / enchant at the impact point, then a 6-point crit ring that opens over 3 ticks (radius 0.25 -> 0.8, 20 deg/tick twist) ---
        - {id: imp_dust, op: particle_def, def: bastion-s1-p-impact-dust, at: 7, anchor: {of: fx2_fx_high, offset: {left: -0.036, up: 1.529, forward: 2.782}}}
        - {id: imp_crit, op: particle_def, def: bastion-s1-p-impact-crit, at: 7, anchor: {of: fx2_fx_high, offset: {left: -0.036, up: 1.529, forward: 2.782}}}
        - {id: imp_ench, op: particle_def, def: bastion-s1-p-impact-enchant, at: 7, anchor: {of: fx2_fx_high, offset: {left: -0.036, up: 1.529, forward: 2.782}}}
        - id: ring1
          at: 7
          every: 1
          times: 3
          do:
            # plane = up/forward, tilted 15 degrees about up (left = -0.232 * forward); angle = 60 i - 20 parent.i degrees
            - id: pt
              op: particle_def
              def: bastion-s1-p-ring-crit
              anchor: {of: fx2_fx_high, offset: {left: -0.036, up: 1.529, forward: 2.782}}
              times: 6
              shift:
                forward: "= (0.25 + 0.275 * parent.i) * cos((60 * i - 20 * parent.i) * 0.0174533)"
                up: "= (0.25 + 0.275 * parent.i) * sin((60 * i - 20 * parent.i) * 0.0174533)"
                left: "= -0.232 * (0.25 + 0.275 * parent.i) * cos((60 * i - 20 * parent.i) * 0.0174533)"
        # --- blade fx: segments between the rig points (ADR-0303 10.5), no baked positions ---
        - {id: b1_trail, op: particle_def, def: bastion-s1-p-trail, at: 4, every: 1, for: 16, anchor: {of: rig.root, to: rig.tip, samples: 11}}
        - {id: b1_sheath, op: particle_def, def: bastion-s1-p-sheath, at: 4, every: 1, for: 16, anchor: {of: rig.root, to: rig.tip, samples: 5}}
        - {id: b1_steel, op: particle_def, def: bastion-s1-p-steel, at: 4, every: 1, for: 16, anchor: rig.tip}
        - {id: b1_fleck, op: particle_def, def: bastion-s1-p-fleck, at: 4, every: 1, for: 16, anchor: {of: rig.root, to: rig.tip, samples: 3}}
        - {id: b1_crit, op: particle_def, def: bastion-s1-p-trail-crit, at: 7, every: 1, for: 3, anchor: {of: rig.root, to: rig.tip, samples: 11}}
    sweep2:
      for: 18
      then: slam
      do:
        # --- gameplay swing 2 (v2 t28 dash / t31 hit): hit 2 freezes 2 ticks and knocks the victim back ---
        - {id: dash_hit_2, op: hit, at: 0, for: 3, every: 1, anchor: caster.body, shape: {sphere: 1.7}, targets: enemies, window: once, ignore_invulnerability: false}
        - {id: dash_2, op: dash, at: 0, speed: "= dash_distance_2 / 3", for: 3, until: dash_hit_2.hit, direction: {forward: 1.0}, invulnerable: true, stop_on_block: true, follow_pitch: false, face_movement: false}
        - {id: hit2, op: hit, at: 3, anchor: caster, shape: {sphere: "${radius}"}, targets: enemies, damage: {physical: "${dmg_physical_2}"}, window: once, ignore_invulnerability: true, on: {hit: [{id: react_2, op: react, target: event.victim, flinch: true, for: 6}, {id: stop_2, op: freeze, at: 0, ticks: 2, scope: [caster, event.victim]}, {id: kb, op: knockback, target: event.victim, direction: "= normalize(flat(pos(event.victim) - pos(caster))) + vec(0.0, 0.2, 0.0)", strength: "${knockback}"}]}}
        # --- sound ---
        - {id: snd_18, op: sound, at: 3, sound: item.mace.smash_ground_heavy, anchor: caster, volume: 1.0, pitch: 0.7}
        - {id: snd_19, op: sound, at: 3, sound: block.anvil.land, anchor: caster, volume: 1.0, pitch: 0.5}
        - {id: snd_20, op: sound, at: 3, sound: entity.player.attack.crit, anchor: caster, volume: 1.0, pitch: 0.65}
        - {id: snd_21, op: sound, at: 3, sound: entity.iron_golem.attack, anchor: caster, volume: 1.0, pitch: 0.6}
        - {id: snd_22, op: sound, at: 3, sound: entity.generic.explode, anchor: caster, volume: 0.45, pitch: 0.5}
        - {id: snd_23, op: sound, at: 4, sound: item.armor.equip_netherite, anchor: caster, volume: 0.9, pitch: 0.6}
        - {id: snd_24, op: sound, at: 4, sound: block.chain.place, anchor: caster, volume: 0.8, pitch: 0.6}
        - {id: snd_25, op: sound, at: 12, sound: item.armor.equip_iron, anchor: caster, volume: 1.0, pitch: 0.8}
        # --- ring quarters, floor fill, ink, streaks, flashes, lines ---
        - {id: fx3_fx_low_s1h2_ring_quarters, op: display, times: 4, at: [0, 1, 4, 5], kind: sprite, see_through: true, sprite: [bastion-s1-ring-q0, bastion-s1-ring-q1, bastion-s1-ring-q2, bastion-s1-ring-q3], size: [2.6502, 2.6502], anchor: fx3_fx_low, brightness: {block: 15, sky: 15}, offset: [{left: 0.98, up: 0.77, forward: -1.029}, {left: 0.968, up: 0.953, forward: 1.615}, {left: -1.664, up: 0.593, forward: -1.029}, {left: -1.676, up: 0.776, forward: 1.615}], rotate: [{axis: up, deg: -136}, {axis: left, deg: -84.5}, {axis: forward, deg: 45.87}], for: "= 14 - [0, 1, 4, 5][int(i)]"}
        - {id: fx3_fx_low_s1h2_floor_fill, op: display, at: 2, kind: sprite, sprite: bastion-s1-ink, size: [4.4, 4.4], anchor: fx3_fx_low, brightness: {block: 15, sky: 15}, offset: {left: 0.25, up: 0.03, forward: 0.5}, rotate: [{axis: left, deg: -90}, {axis: forward, deg: 90}], for: 2}
        - {id: fx3_fx_low_s1h2_line_1, op: display, at: 2, kind: sprite, see_through: true, sprite: bastion-s1-streak, size: [0.5, 0.64], anchor: fx3_fx_low, brightness: {block: 15, sky: 15}, billboard: center, offset: {left: 0.5, up: 0.6, forward: 1.2}, for: 3, motion: [{law: keys, keys: [{t: 0, offset: {left: 0.5, up: 0.6, forward: 1.2}, pose: [], scale: {left: 1.0, up: 1.0, forward: 1.0}}, {t: 1, offset: {left: 0.5, up: 0.6, forward: 1.2}, pose: [], scale: {left: 4.8003, up: 1.0, forward: 1.0}, ease: out_expo}, {t: 2, offset: {left: 0.5, up: 0.6, forward: 1.2}, pose: [], scale: {left: 3.3602, up: 0.2, forward: 1.0}, ease: in_quad}]}]}
        - {id: fx3_fx_low_s1h2_ink, op: display, at: 3, kind: sprite, sprite: bastion-s1-ink, size: [3.3997, 3.3997], anchor: fx3_fx_low, brightness: {block: 15, sky: 15}, billboard: center, offset: {left: 0.212, up: 1.223, forward: 1.554}, for: 2}
        - {id: fx3_fx_low_s1h2_streak_main, op: display, at: 3, kind: sprite, see_through: true, sprite: bastion-s1-streak, size: [0.6, 2.048], anchor: fx3_fx_low, brightness: {block: 15, sky: 15}, billboard: center, offset: {left: 0.062, up: 1.773, forward: 1.604}, rotate: [{axis: forward, deg: -4.0}], for: 6, motion: [{law: keys, keys: [{t: 0, offset: {left: 0.062, up: 1.773, forward: 1.604}, pose: [{axis: forward, deg: -4.0}], scale: {left: 1.0, up: 1.0, forward: 1.0}}, {t: 1, offset: {left: 0.062, up: 1.773, forward: 1.604}, pose: [{axis: forward, deg: -4.0}], scale: {left: 7.6661, up: 1.0, forward: 1.0}, ease: out_expo}, {t: 6, offset: {left: 0.062, up: 1.773, forward: 1.604}, pose: [{axis: forward, deg: -4.0}], scale: {left: 6.0, up: 0.125, forward: 1.0}, ease: in_quad}]}]}
        - {id: fx3_fx_low_s1h2_line_2, op: display, at: 3, kind: sprite, see_through: true, sprite: bastion-s1-streak, size: [0.5, 0.64], color: "#FFE070", anchor: fx3_fx_low, brightness: {block: 15, sky: 15}, billboard: center, offset: {left: -0.5, up: 1.05, forward: 1.4}, for: 3, motion: [{law: keys, keys: [{t: 0, offset: {left: -0.5, up: 1.05, forward: 1.4}, pose: [], scale: {left: 1.0, up: 1.0, forward: 1.0}}, {t: 1, offset: {left: -0.5, up: 1.05, forward: 1.4}, pose: [], scale: {left: 4.0003, up: 1.0, forward: 1.0}, ease: out_expo}, {t: 2, offset: {left: -0.5, up: 1.05, forward: 1.4}, pose: [], scale: {left: 2.7995, up: 0.2, forward: 1.0}, ease: in_quad}]}]}
        - {id: fx3_fx_low_s1h2_flash, op: display, at: 3, kind: sprite, see_through: true, sprite: bastion-s1-flare, size: [1.2, 1.2], anchor: fx3_fx_low, brightness: {block: 15, sky: 15}, billboard: center, offset: {left: 0.112, up: 1.273, forward: 1.504}, for: 4, motion: [{law: keys, keys: [{t: 0, offset: {left: 0.112, up: 1.273, forward: 1.504}, pose: [], scale: {left: 1.0, up: 1.0, forward: 1.0}}, {t: 1, offset: {left: 0.112, up: 1.273, forward: 1.504}, pose: [], scale: {left: 1.9168, up: 1.9168, forward: 1.0}, ease: out_back}, {t: 3, offset: {left: 0.112, up: 1.273, forward: 1.504}, pose: [], scale: {left: 0.7499, up: 0.7499, forward: 1.0}, ease: out_quad}]}]}
        - {id: fx3_fx_low_s1h2_flash_x, op: display, at: 3, kind: sprite, see_through: true, sprite: bastion-s1-flare, size: [1.2, 1.2], anchor: fx3_fx_low, brightness: {block: 15, sky: 15}, offset: {left: 0.112, up: 1.273, forward: 1.504}, rotate: [{axis: left, deg: 90.0}], for: 4, motion: [{law: keys, keys: [{t: 0, offset: {left: 0.112, up: 1.273, forward: 1.504}, pose: [{axis: left, deg: 90.0}], scale: {left: 1.0, up: 1.0, forward: 1.0}}, {t: 1, offset: {left: 0.112, up: 1.273, forward: 1.504}, pose: [{axis: left, deg: 90.0}], scale: {left: 1.9168, up: 1.9168, forward: 1.0}, ease: out_back}, {t: 3, offset: {left: 0.112, up: 1.273, forward: 1.504}, pose: [{axis: left, deg: 90.0}], scale: {left: 0.7499, up: 0.7499, forward: 1.0}, ease: out_quad}]}]}
        - {id: fx3_fx_low_s1h2_flash_f, op: display, at: 3, kind: sprite, see_through: true, sprite: bastion-s1-flare, size: [1.2, 1.2], anchor: fx3_fx_low, brightness: {block: 15, sky: 15}, offset: {left: 0.112, up: 1.273, forward: 1.504}, rotate: [{axis: up, deg: -90}], for: 4, motion: [{law: keys, keys: [{t: 0, offset: {left: 0.112, up: 1.273, forward: 1.504}, pose: [{axis: up, deg: 90.0}], scale: {left: 1.0, up: 1.0, forward: 1.0}}, {t: 1, offset: {left: 0.112, up: 1.273, forward: 1.504}, pose: [{axis: up, deg: 90.0}], scale: {left: 1.9168, up: 1.9168, forward: 1.0}, ease: out_back}, {t: 3, offset: {left: 0.112, up: 1.273, forward: 1.504}, pose: [{axis: up, deg: 90.0}], scale: {left: 0.7499, up: 0.7499, forward: 1.0}, ease: out_quad}]}]}
        - {id: fx3_fx_low_s1h2_streak_x, op: display, at: 3, kind: sprite, see_through: true, sprite: bastion-s1-streak, size: [0.6, 2.048], anchor: fx3_fx_low, brightness: {block: 15, sky: 15}, offset: {left: 0.062, up: 1.773, forward: 1.604}, rotate: [{axis: left, deg: 90}, {axis: forward, deg: -4}], for: 6, motion: [{law: keys, keys: [{t: 0, offset: {left: 0.062, up: 1.773, forward: 1.604}, pose: [{axis: up, deg: -3.14148}, {axis: left, deg: 89.96015}, {axis: forward, deg: -3.14148}], scale: {left: 1.0, up: 1.0, forward: 1.0}}, {t: 1, offset: {left: 0.062, up: 1.773, forward: 1.604}, pose: [{axis: up, deg: -3.14148}, {axis: left, deg: 89.96015}, {axis: forward, deg: -3.14148}], scale: {left: 9.3333, up: 1.0, forward: 1.0}, ease: out_expo}, {t: 6, offset: {left: 0.062, up: 1.773, forward: 1.604}, pose: [{axis: up, deg: -3.14148}, {axis: left, deg: 89.96015}, {axis: forward, deg: -3.14148}], scale: {left: 6.0, up: 0.125, forward: 1.0}, ease: in_quad}]}]}
        # --- dust at the blade tip: the swing-2 start and the follow-up wave (v2 ticks 28 / 30 / 36) ---
        - {id: gather2_c, op: particle_def, def: bastion-s1-p-gather-3, at: 0, anchor: {of: /sweep1/rig.root, to: /sweep1/rig.tip, samples: 2}}
        - {id: gather2_b, op: particle_def, def: bastion-s1-p-gather-2, at: 0, anchor: {of: /sweep1/rig.root, to: /sweep1/rig.tip, samples: 2}}
        - {id: gather2_a, op: particle_def, def: bastion-s1-p-gather-1, at: 2, anchor: {of: /sweep1/rig.root, to: /sweep1/rig.tip, samples: 2}}
        - id: wave2
          at: 8
          do:
            - {id: v3, op: particle_def, def: bastion-s1-p-gather-3, every: 1, for: 3, anchor: {of: /sweep1/rig.root, to: /sweep1/rig.tip, samples: 2}}
            - {id: v2, op: particle_def, def: bastion-s1-p-gather-2, at: 1, every: 1, for: 3, anchor: {of: /sweep1/rig.root, to: /sweep1/rig.tip, samples: 2}}
            - {id: v1, op: particle_def, def: bastion-s1-p-gather-1, at: 2, every: 1, for: 3, anchor: {of: /sweep1/rig.root, to: /sweep1/rig.tip, samples: 2}}
        # --- hit 2 impact (tick 31): three dust / crit puffs spread along the cut, one enchant, a floor puff + poof, then a 10-point ring (20 deg/tick twist) ---
        - {id: imp_dust, op: particle_def, def: bastion-s1-p-impact-dust, at: 3, times: 3, anchor: {of: fx3_fx_low, offset: {left: 0.096, up: 1.005, forward: 2.532}}, shift: {left: "= 0.25 * i", forward: "= -0.15 * i"}}
        - {id: imp_crit, op: particle_def, def: bastion-s1-p-impact-crit, at: 3, times: 3, anchor: {of: fx3_fx_low, offset: {left: 0.096, up: 1.005, forward: 2.532}}, shift: {left: "= 0.25 * i", forward: "= -0.15 * i"}}
        - {id: imp_ench, op: particle_def, def: bastion-s1-p-impact-enchant, at: 3, anchor: {of: fx3_fx_low, offset: {left: 0.096, up: 1.005, forward: 2.532}}}
        - {id: imp_puff, op: particle_def, def: bastion-s1-p-puff, at: 3, anchor: {of: fx3_fx_low, offset: {left: 0.096, up: 1.005, forward: 2.532}}, shift: {up: -0.605}}
        - {id: imp_poof, op: particle_def, def: bastion-s1-p-poof, at: 3, anchor: {of: fx3_fx_low, offset: {left: 0.096, up: 1.005, forward: 2.532}}, shift: {up: -0.605}}
        - id: ring2
          at: 3
          every: 1
          times: 3
          do:
            # plane = left/up (normal forward); angle = 36 i - 20 parent.i degrees
            - id: pt2
              op: particle_def
              def: bastion-s1-p-ring-crit
              anchor: {of: fx3_fx_low, offset: {left: 0.096, up: 1.005, forward: 2.532}}
              times: 10
              shift:
                left: "= (0.25 + 0.275 * parent.i) * cos((36 * i - 20 * parent.i) * 0.0174533)"
                up: "= (0.25 + 0.275 * parent.i) * sin((36 * i - 20 * parent.i) * 0.0174533)"
        # --- blade fx ---
        - {id: b2_trail, op: particle_def, def: bastion-s1-p-trail, at: 1, every: 1, for: 15, anchor: {of: /sweep1/rig.root, to: /sweep1/rig.tip, samples: 11}}
        - {id: b2_sheath, op: particle_def, def: bastion-s1-p-sheath-hot, at: 1, every: 1, for: 15, anchor: {of: /sweep1/rig.root, to: /sweep1/rig.tip, samples: 5}}
        - {id: b2_steel, op: particle_def, def: bastion-s1-p-steel, at: 1, every: 1, for: 15, anchor: /sweep1/rig.tip}
        - {id: b2_fleck, op: particle_def, def: bastion-s1-p-fleck, at: 1, every: 1, for: 15, anchor: {of: /sweep1/rig.root, to: /sweep1/rig.tip, samples: 3}}
        - {id: b2_crit, op: particle_def, def: bastion-s1-p-trail-crit, at: 3, every: 1, for: 3, anchor: {of: /sweep1/rig.root, to: /sweep1/rig.tip, samples: 11}}
    slam:
      for: 12
      then: end
      do:
        # swing 3 (v2 t46-56): raise and slam down, the rest pose returns at 56
        - {id: b3_slash, op: particle_def, def: bastion-s1-p-slash, at: 4, every: 1, for: 6, anchor: {of: /sweep1/rig.root, to: /sweep1/rig.tip, samples: 11}}
        - {id: b3_steel, op: particle_def, def: bastion-s1-p-steel, at: 4, every: 1, for: 6, anchor: /sweep1/rig.tip}
    end: {final: true}
