          do:
            - {id: snd_3, op: sound, sound: item.armor.equip_chain, anchor: caster, volume: 0.9, pitch: 0.7}
            - {id: snd_4, op: sound, sound: item.armor.equip_iron, anchor: caster, volume: 0.6, pitch: 0.6}
        - id: fx3
