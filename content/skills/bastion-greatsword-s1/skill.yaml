# Offsets [left, up, forward] -> name-keyed maps. Euler turn [pitch, yaw, roll] (Ry(-yaw) Rx(pitch) Rz(roll)) -> pose list [up -yaw, left pitch, forward roll].
# Weapon rig: three swings of three keys each (founder 2026-10-29: few keys + ease, no per-tick replica of the previous rig). Each step is one great-circle arc of the tip (from/to),
# the edge side (leading|trailing) and a roll; hit ticks (7, 31), freezes, damage and the end tick are the values. Blade particles are segments between the rig anchor's
# root and tip points (anchor: {of: rig.root, to: rig.tip, samples: N}), not baked positions.
apiVersion: astera/v3
kind: Skill
id: bastion-greatsword-s1
item: bastion-greatsword
meta:
  name: {ja: "月輪の薙ぎ", en: "Moon Sweep"}
  description: {ja: "一歩踏み込んで腰の高さで二度薙ぎ払う。初撃が当たると溜めを得る。", en: "Step in and sweep twice at waist height. Landing the first banks charge."}
  cooldown_ticks: 64
  resource_cost: 20
  tags: [melee, physical, charge]
params:
  radius: {type: blocks, default: 3.0}
  dmg_physical: {type: number, default: 35}
  dmg_physical_2: {type: number, default: 45}
  charge_ticks: {type: ticks, default: 400}
  charge_stacks: {type: number, default: 1}
  dash_distance: {type: blocks, default: 2.4}
  dash_distance_2: {type: blocks, default: 2.6}
  knockback: {type: number, default: 0.5}
anchors:
  - {id: fx2_fx_high, anchor: caster, mode: follow}
  - {id: fx3_fx_low, anchor: caster, mode: follow}
machine:
  start: sweep
  states:
    sweep:
      for: 58
      then: end
      do:
        # --- gameplay (t4 / t7 / t28 / t31) ---
        # dash_strike D over 3 ticks -> dash speed D/3 blocks/tick.
        # hit_once + stop_before_target 1.7 (R9): sibling trigger-only corridor hit, window once; the dash ends at its first victim (sphere 1.7 = the stop distance).
        - {id: dash_hit, op: hit, at: 4, for: 3, every: 1, anchor: caster.body, shape: {sphere: 1.7}, targets: enemies, window: once, ignore_invulnerability: false}
        - {id: dash, op: dash, at: 4, speed: "= dash_distance / 3", for: 3, until: dash_hit.hit, direction: {forward: 1.0}, invulnerable: true, stop_on_block: true, follow_pitch: false, face_movement: false}
        # sel (damage 35, ignore_invulnerability) + sel_2 (freeze 2, scope enemy+caster) are the same sphere at the same tick: one hit with the damage.
        # The hit-stop of sel_2 is the freeze row in `on: hit1` below (R25); rig.freezes holds the weapon rig only.
        - {id: hit1, op: hit, at: 7, anchor: caster, shape: {sphere: "${radius}"}, targets: enemies, damage: {physical: "${dmg_physical}"}, window: once, ignore_invulnerability: true, on: {hit: [{id: stop, op: freeze, at: 0, ticks: 2, scope: [caster, event.victim]}]}}
        - {id: st_charge, op: status, at: 7, target: caster, status: charge, stacks: "${charge_stacks}", for: "${charge_ticks}", when: "= nearest_enemy_dist(caster) < 3.6"}
        - {id: dash_hit_2, op: hit, at: 28, for: 3, every: 1, anchor: caster.body, shape: {sphere: 1.7}, targets: enemies, window: once, ignore_invulnerability: false}
        - {id: dash_2, op: dash, at: 28, speed: "= dash_distance_2 / 3", for: 3, until: dash_hit_2.hit, direction: {forward: 1.0}, invulnerable: true, stop_on_block: true, follow_pitch: false, face_movement: false}
        # sel_3 (damage 45, ignore_invulnerability) + sel_4 (freeze 2 + knockback) merged the same way.
        - {id: hit2, op: hit, at: 31, anchor: caster, shape: {sphere: "${radius}"}, targets: enemies, damage: {physical: "${dmg_physical_2}"}, window: once, ignore_invulnerability: true, on: {hit: [{id: stop_2, op: freeze, at: 0, ticks: 2, scope: [caster, event.victim]}, {id: kb, op: knockback, target: event.victim, direction: "= normalize(flat(pos(event.victim) - pos(caster))) + vec(0.0, 0.2, 0.0)", strength: "${knockback}"}]}}
        # --- weapon rig (group fx0, rig duration 58) ---
        - id: rig
          op: rig
          parent: caster
          mount: caster.hand_r
          anim: bastion-s1-body
          part: held_hand
          rest: [{axis: left, deg: 72}]
          respect_hit_stop: true
          freezes: [{at: 7, ticks: 2}, {at: 31, ticks: 2}]
          for: 58
          swing:
            # swing 1 (ticks 2-22): wind-up behind, cut down at the hit (tick 7), sweep up and over to the front
            - {at: 2, for: 5, from: {left: -0.95553, up: -0.0235, forward: -0.29395}, to: {left: -0.24629, up: -0.96705, forward: -0.06444}, edge: trailing, roll: 39.9, ease: in_quad}
            - {at: 7, for: 7, to: {left: 0.53139, up: -0.14142, forward: 0.83524}, edge: trailing, roll: -70.2, ease: out_cubic}
            - {at: 14, for: 8, to: {left: -0.1298, up: -0.21654, forward: 0.96761}, edge: leading, roll: 11.3, ease: in_out_sine}
            # swing 2 (ticks 24-44): lift to the left, cut across at the hit (tick 31), follow through to the right
            - {at: 24, for: 5, from: {left: -0.1298, up: -0.21654, forward: 0.96761}, to: {left: 0.68894, up: 0.05507, forward: 0.72272}, edge: trailing, roll: 62.2, ease: in_quad}
            - {at: 29, for: 7, to: {left: -0.37137, up: -0.91282, forward: -0.16986}, edge: leading, roll: -31.9, ease: out_cubic}
            - {at: 36, for: 8, to: {left: 0.94723, up: 0.09866, forward: 0.305}, edge: trailing, roll: 34.7, ease: in_out_sine}
            # swing 3 (ticks 46-56): raise, slam down; the rest pose comes back at 56
            - {at: 46, for: 4, from: {left: 0.94723, up: 0.09866, forward: 0.305}, to: {left: -0.03872, up: 0.78715, forward: 0.61554}, edge: trailing, roll: -79.1, ease: in_quad}
            - {at: 50, for: 6, to: {left: 0.0, up: -0.51, forward: 0.86}, edge: leading, roll: 0.0, ease: out_cubic}
            - {at: 56, reset: true}
        # --- presentation (timeline groups, folded from the former top-level `presentation:`) ---
        - id: fx0
          op: group
          at: 0
          do:
            - {id: snd, op: sound, sound: block.gravel.step, anchor: caster, volume: 1.0, pitch: 0.6}
            - {id: snd_2, op: sound, sound: entity.ravager.step, anchor: caster, volume: 0.6, pitch: 0.8}
        - id: fx2
          op: group
