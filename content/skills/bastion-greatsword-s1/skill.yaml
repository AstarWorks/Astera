# Bastion greatsword S1 (Moon Sweep) in the frame grammar (ADR-0314). These frames carry everything drawn:
#   arm   - the caster's right shoulder (`caster.shoulder_r`), turned by yaw (about w) then pitch (about s) keys: where the straight arm points.
#   blade - the sword: its origin is the point 0.6 along the arm (`origin: {frame: arm, pos: {v: 0.6}}`), the length of the rigid arm, so the
#           hand reaches the origin on every tick by construction (no fitting keys). The greatsword rides it, long axis along v (grip at the
#           origin, tip at v 1.7), edge along w. The caster's right hand is pinned onto this origin by the engine (ADR-0315): the blade leads,
#           the hand follows. Its rotate keys ARE the three swings: one roll about v turns the edge to the left, then every cut is a turn about
#           s, which moves v towards w - the edge leads by construction. The first sweep goes right -> left, the moon keeps turning the same
#           way round the back and across the front again, then the edge is rolled down for the slam. `reset` eases the chain back to the
#           rest pose before the rig ends.
#           The blade line `edge` (ricasso 0.3 -> tip 1.7) and `tip` (1.3 -> 1.7) are the two lines every trail / gather / sheath row draws along.
#   body  - the caster's feet, v forward / w up / s right: the hit rings (four quarter glyphs of one ring, each drawn in on its own tick, so four
#           rows), the floor ink and the streak / flash plates. A flat plate is plane [-s, v] (width left, height forward, face down); a plate
#           standing across the front is plane [v, w].
#   wound - one per victim at the victim's centre, v the way the blow came in: the impact bursts on the entry side (v -0.3) and the sliver
#           left stuck in the victim (plane [v, w]: a shard along the way it came in).
#   burst1 / burst2 - one per victim per blow, same axes as wound: the crit ring. Its points are three (five) diameters of a 0.25 ring; the
#           frame's scale key opens it to 0.8 over the three ticks and its rotate key twists it 20 deg a tick (one frame per blow, so each
#           ring starts from its own tick).
# Gameplay (hit ticks 7 / 31, damage, status, knockback, dashes), the sounds and the cast length 58 are unchanged.
apiVersion: astera/v3
kind: Skill
id: bastion-greatsword-s1
item: bastion-greatsword
meta:
  name: {ja: "月輪の薙ぎ", en: "Moon Sweep"}
  description: {ja: "一歩踏み込んで腰の高さで二度薙ぎ払う。初撃が当たると溜めを得る。", en: "Step in and sweep twice at waist height. Landing the first banks charge."}
  cooldown_ticks: 64
  resource_cost: 20
  tags: [melee, physical, charge]
params:
  radius: {type: blocks, default: 3.0}
  dmg_physical: {type: number, default: 35}
  dmg_physical_2: {type: number, default: 45}
  charge_ticks: {type: ticks, default: 400}
  charge_stacks: {type: number, default: 1}
  dash_distance: {type: blocks, default: 2.4}
  dash_distance_2: {type: blocks, default: 2.6}
  knockback: {type: number, default: 0.5}
frames:
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      # yaw about w, then pitch about s: the arm's direction from the shoulder (listed yaw first, so the two compose as yaw . pitch)
      - {at: 0, for: 0, about: w, to: 73}                                   # rest: the hand at the hip
      - {at: 0, for: 1, about: w, to: 146}                                  # lift: the arm comes up
      - {at: 1, for: 1, about: w, to: 125}
      - {at: 2, for: 3, about: w, to: 172}                                  # wind-up to the right
      - {at: 5, for: 1, about: w, to: 71}                                   # cut 1: across the front ...
      - {at: 6, for: 1, about: w, to: 133}                                  # ... and in to the left (hit at 7)
      - {at: 7, for: 5, about: w, to: 164}                                  # run-out
      - {at: 12, for: 7, about: w, to: 219}                                 # the hand drops back for the moon
      - {at: 27, for: 2, about: w, to: 243}                                 # moon: round the left side
      - {at: 29, for: 1, about: w, to: 112}
      - {at: 30, for: 1, about: w, to: 34}                                  # cut 2: out across the front (hit at 31)
      - {at: 31, for: 8, about: w, to: 17}                                  # run-out, the hand comes home
      - {at: 39, for: 1, about: w, to: 123}                                 # slam: set the grip, raise, bring it down
      - {at: 40, for: 8, about: w, to: 88}
      - {at: 48, for: 4, about: w, to: -11}
      - {at: 0, for: 0, about: s, to: -63}
      - {at: 0, for: 1, about: s, to: -23}
      - {at: 1, for: 1, about: s, to: 43}
      - {at: 2, for: 3, about: s, to: 31}
      - {at: 5, for: 1, about: s, to: 19}
      - {at: 6, for: 1, about: s, to: 19}
      - {at: 7, for: 5, about: s, to: 8}
      - {at: 12, for: 7, about: s, to: -43}
      - {at: 27, for: 2, about: s, to: -14}
      - {at: 29, for: 1, about: s, to: -29}
      - {at: 30, for: 1, about: s, to: -18}
      - {at: 31, for: 8, about: s, to: -36}
      - {at: 39, for: 1, about: s, to: -34}
      - {at: 40, for: 8, about: s, to: -70}
      - {at: 48, for: 4, about: s, to: -60}
  - id: blade
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      # the lift (0-2) is straight up with the edge still up, so it lies in the blade plane; then the roll, with the hand still
      - {at: 2, for: 1, about: v, to: -80}                       # edge to the left: the sweeps are flat, a touch rising
      # sweep 1 (hit at 7): wind up to the right, cut across the front, run out
      - {at: 3, for: 2, about: s, to: -60, ease: out_quad}
      - {at: 5, for: 5, about: s, to: 80}
      - {at: 10, for: 8, about: s, to: 110, ease: out_sine}
      # sweep 2 (hit at 31): the moon - keep turning, round the back and across the front again
      - {at: 23, for: 8, about: s, to: 370, ease: in_quad}
      - {at: 31, for: 6, about: s, to: 400, ease: out_sine}
      - {at: 37, for: 2, about: s, to: 360}                     # run out level, quick, before the hand comes back (38-48: blade still, a cut needs a still hand or a fast blade)
      # slam (hit-less, 49-55): edge rolled down while the blade is still, then with the hand home at 49: raise, bring it down
      - {at: 40, for: 4, about: v, to: -170}
      - {at: 49, for: 2, about: s, to: 320, ease: out_quad}
      - {at: 51, for: 4, about: s, to: 440}
      - {at: 55, for: 3, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: wound
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
  - id: burst1
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
    rotate: [{at: 0, for: 2, about: s, to: -40}]
    scale: [{at: 0, for: 2, to: {v: 3.2, w: 3.2, s: 3.2}}]
  - id: burst2
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
    rotate: [{at: 0, for: 2, about: v, to: -40}]
    scale: [{at: 0, for: 2, to: {v: 3.2, w: 3.2, s: 3.2}}]
lines:
  edge: {frame: blade, from: {v: 0.3}, to: {v: 1.7}}            # ricasso -> tip
  tip:  {frame: blade, from: {v: 1.3}, to: {v: 1.7}}            # the outer part
machine:
  start: sweep1
  tail: 30
  states:
    sweep1:
      for: 28
      then: sweep2
      do:
        # --- gameplay swing 1 (v2 t4 dash / t7 hit): the dash ends at its first victim, the hit has no hit-stop (hold table: light skills do not stop) ---
        - {id: dash_hit, op: hit, at: 4, for: 3, every: 1, anchor: caster.body, shape: {sphere: 1.7}, targets: enemies, window: once, ignore_invulnerability: false}
        - {id: dash, op: dash, at: 4, speed: "= dash_distance / 3", for: 3, until: dash_hit.hit, direction: {forward: 1.0}, invulnerable: true, stop_on_block: true, follow_pitch: false, face_movement: false}
        - id: hit1
          op: hit
          at: 7
          anchor: caster
          shape: {sphere: "${radius}"}
          targets: enemies
          damage: {physical: "${dmg_physical}"}
          window: once
          ignore_invulnerability: true
          on:
            hit:
              - {id: react, op: react, target: event.victim, flinch: true, for: 6}
              # the blow lands on the victim: bursts on the entry side, a shard left stuck in for the rest of the cast
              - {id: imp_dust, op: particle_def, def: bastion-s1-p-impact-dust, frame: wound, pos: {v: -0.3}, detach: true}
              - {id: imp_crit, op: particle_def, def: bastion-s1-p-impact-crit, frame: wound, pos: {v: -0.3}, detach: true}
              - {id: imp_ench, op: particle_def, def: bastion-s1-p-impact-enchant, frame: wound, pos: {v: -0.3}, detach: true}
              # crit sparks sprayed along the cut line across the wound (the blade itself passes the caster's face at 7-11, so they live on the victim)
              - {id: cut_crit, op: particle_def, def: bastion-s1-p-trail-crit, every: 1, times: 3, frame: wound, pos: {v: -0.3, s: -0.4}, to: {v: -0.3, s: 0.4}, samples: 5, detach: true}
              # the crit ring in the v-w plane (normal s): 6 points, opening and twisting with burst1
              - {id: ring_a, op: particle_def, def: bastion-s1-p-ring-crit, every: 1, times: 3, frame: burst1, pos: {v: 0.25}, to: {v: -0.25}, samples: 2, detach: true}
              - {id: ring_b, op: particle_def, def: bastion-s1-p-ring-crit, every: 1, times: 3, frame: burst1, pos: {v: 0.13, w: 0.22}, to: {v: -0.13, w: -0.22}, samples: 2, detach: true}
              - {id: ring_c, op: particle_def, def: bastion-s1-p-ring-crit, every: 1, times: 3, frame: burst1, pos: {v: -0.13, w: 0.22}, to: {v: 0.13, w: -0.22}, samples: 2, detach: true}
              - {id: imp_flare, op: display, kind: sprite, sprite: bastion-s1-flare, size: [1.0, 1.0], billboard: center, see_through: true, brightness: {block: 15, sky: 15}, frame: wound, pos: {v: -0.3}, for: 4, detach: true}
              - {id: shard, op: display, kind: sprite, sprite: bastion-s1-sliver, size: [0.6, 0.6], see_through: true, brightness: {block: 15, sky: 15}, frame: wound, pos: {v: -0.2, w: 0.2}, plane: [v, w], for: 50, detach: true}
              - {id: shard_fleck, op: particle_def, def: bastion-s1-p-fleck, every: 2, times: 8, frame: wound, pos: {v: -0.2, w: 0.2}, detach: true}   # embers off the stuck shard
        - {id: st_charge, op: status, at: 7, target: caster, status: charge, stacks: "${charge_stacks}", for: "${charge_ticks}", when: "= nearest_enemy_dist(caster) < 3.6"}
        - {id: rig, op: rig, frame: blade, anim: bastion-s1-body, for: 58, detach: true}
        # --- sound (all at the caster) ---
        - {id: snd, op: sound, at: 0, sound: block.gravel.step, frame: body, volume: 1.0, pitch: 0.6}
        - {id: snd_2, op: sound, at: 0, sound: entity.ravager.step, frame: body, volume: 0.6, pitch: 0.8}
        - {id: snd_3, op: sound, at: 2, sound: item.armor.equip_chain, frame: body, volume: 0.9, pitch: 0.7}
        - {id: snd_4, op: sound, at: 2, sound: item.armor.equip_iron, frame: body, volume: 0.6, pitch: 0.6}
        - {id: snd_5, op: sound, at: 4, sound: entity.player.attack.sweep, frame: body, volume: 1.0, pitch: 0.5}
        - {id: snd_6, op: sound, at: 4, sound: item.trident.throw, frame: body, volume: 0.7, pitch: 0.6}
        - {id: snd_7, op: sound, at: 7, sound: item.mace.smash_ground_heavy, frame: body, volume: 1.0, pitch: 0.9}
        - {id: snd_8, op: sound, at: 7, sound: block.anvil.land, frame: body, volume: 0.8, pitch: 0.6}
        - {id: snd_9, op: sound, at: 7, sound: entity.player.attack.crit, frame: body, volume: 1.0, pitch: 0.8}
        - {id: snd_10, op: sound, at: 8, sound: item.armor.equip_netherite, frame: body, volume: 0.9, pitch: 0.6}
        - {id: snd_11, op: sound, at: 8, sound: block.chain.place, frame: body, volume: 0.8, pitch: 0.6}
        - {id: snd_12, op: sound, at: 18, sound: item.armor.equip_iron, frame: body, volume: 1.0, pitch: 0.8}
        - {id: snd_13, op: sound, at: 22, sound: item.armor.equip_chain, frame: body, volume: 0.9, pitch: 0.7}
        - {id: snd_14, op: sound, at: 22, sound: item.armor.equip_iron, frame: body, volume: 0.6, pitch: 0.6}
        - {id: snd_15, op: sound, at: 26, sound: entity.player.attack.sweep, frame: body, volume: 1.0, pitch: 0.45}
        - {id: snd_16, op: sound, at: 26, sound: entity.breeze.wind_burst, frame: body, volume: 0.6, pitch: 0.5}
        - {id: snd_17, op: sound, at: 26, sound: item.trident.throw, frame: body, volume: 0.8, pitch: 0.5}
        # --- hit 1 ring: one 6-block ring at chest height from four quarter glyphs (there is no whole-ring glyph; each quarter is drawn in on its own tick) ---
        - {id: ring_q0, op: display, at: 3, for: 13, kind: sprite, sprite: bastion-s1-hring-q0, size: [3.0, 3.0], frame: body, pos: {v: 1.5, w: 1.5, s: -1.5}, plane: [-s, v], see_through: true, brightness: {block: 15, sky: 15}}
        - {id: ring_q1, op: display, at: 4, for: 12, kind: sprite, sprite: bastion-s1-hring-q1, size: [3.0, 3.0], frame: body, pos: {v: 1.5, w: 1.5, s: 1.5}, plane: [-s, v], see_through: true, brightness: {block: 15, sky: 15}}
        - {id: ring_q2, op: display, at: 3, for: 13, kind: sprite, sprite: bastion-s1-hring-q2, size: [3.0, 3.0], frame: body, pos: {v: -1.5, w: 1.5, s: -1.5}, plane: [-s, v], see_through: true, brightness: {block: 15, sky: 15}}
        - {id: ring_q3, op: display, at: 7, for: 9, kind: sprite, sprite: bastion-s1-hring-q3, size: [3.0, 3.0], frame: body, pos: {v: -1.5, w: 1.5, s: 1.5}, plane: [-s, v], see_through: true, brightness: {block: 15, sky: 15}}
        # --- the streak and the flash in front (camera-facing, a slight roll about v) ---
        - {id: streak1, op: display, at: 6, for: 7, kind: sprite, sprite: bastion-s1-streak, size: [2.5, 1.9], frame: body, pos: {v: 1.5, w: 1.6, s: 0.4}, billboard: center, rotate: [{axis: v, deg: 6}], see_through: true, brightness: {block: 15, sky: 15}}
        - {id: flash1, op: display, at: 6, for: 4, kind: sprite, sprite: bastion-s1-flare, size: [1.1, 1.1], frame: body, pos: {v: 1.6, w: 1.5, s: 0.4}, billboard: center, see_through: true, brightness: {block: 15, sky: 15}}
        # --- dust gathering along the blade (three overlapping defs), then the follow-up waves at the hit and 7 ticks after ---
        - {id: gather_a, op: particle_def, def: bastion-s1-p-gather-1, at: 4, every: 1, for: 3, along: edge, samples: 2}
        - {id: gather_b, op: particle_def, def: bastion-s1-p-gather-2, at: 4, every: 1, for: 2, along: edge, samples: 2}
        - {id: gather_c, op: particle_def, def: bastion-s1-p-gather-3, at: 4, along: edge, samples: 2}
        - id: wave
          at: 7
          every: 7
          times: 2
          do:
            - {id: w3, op: particle_def, def: bastion-s1-p-gather-3, every: 1, for: 3, along: edge, samples: 2}
            - {id: w2, op: particle_def, def: bastion-s1-p-gather-2, at: 1, every: 1, for: 3, along: edge, samples: 2}
            - {id: w1, op: particle_def, def: bastion-s1-p-gather-1, at: 2, every: 1, for: 3, along: edge, samples: 2}
        # --- blade fx along the edge line, the steel at the tip ---
        - {id: b1_trail, op: particle_def, def: bastion-s1-p-trail, at: 4, every: 1, for: 16, along: edge, samples: 11}
        - {id: b1_sheath, op: particle_def, def: bastion-s1-p-sheath, at: 4, every: 1, for: 16, along: edge, samples: 5}
        - {id: b1_steel, op: particle_def, def: bastion-s1-p-steel, at: 4, every: 1, for: 16, frame: blade, pos: {v: 1.7}}
        - {id: b1_fleck, op: particle_def, def: bastion-s1-p-fleck, at: 4, every: 1, for: 16, along: tip, samples: 2}
    sweep2:
      for: 18
      then: slam
      do:
        # --- gameplay swing 2 (v2 t28 dash / t31 hit): hit 2 knocks the victim back (no hit-stop) ---
        - {id: dash_hit_2, op: hit, at: 0, for: 3, every: 1, anchor: caster.body, shape: {sphere: 1.7}, targets: enemies, window: once, ignore_invulnerability: false}
        - {id: dash_2, op: dash, at: 0, speed: "= dash_distance_2 / 3", for: 3, until: dash_hit_2.hit, direction: {forward: 1.0}, invulnerable: true, stop_on_block: true, follow_pitch: false, face_movement: false}
        - id: hit2
          op: hit
          at: 3
          anchor: caster
          shape: {sphere: "${radius}"}
          targets: enemies
          damage: {physical: "${dmg_physical_2}"}
          window: once
          ignore_invulnerability: true
          on:
            hit:
              - {id: react_2, op: react, target: event.victim, flinch: true, for: 6}
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(flat(pos(event.victim) - pos(caster))) + vec(0.0, 0.2, 0.0)", strength: "${knockback}"}
              # the second blow: three puffs spread along the cut (s), a floor puff below, the ring, a flare; a second shard stays in
              - {id: imp_dust2, op: particle_def, def: bastion-s1-p-impact-dust, frame: wound, pos: {v: -0.3}, to: {v: -0.3, s: 0.5}, samples: 3, detach: true}
              - {id: imp_crit2, op: particle_def, def: bastion-s1-p-impact-crit, frame: wound, pos: {v: -0.3}, to: {v: -0.3, s: 0.5}, samples: 3, detach: true}
              - {id: imp_ench2, op: particle_def, def: bastion-s1-p-impact-enchant, frame: wound, pos: {v: -0.3}, detach: true}
              - {id: imp_puff2, op: particle_def, def: bastion-s1-p-puff, frame: wound, pos: {v: -0.3, w: -0.6}, detach: true}
              - {id: imp_poof2, op: particle_def, def: bastion-s1-p-poof, frame: wound, pos: {v: -0.3, w: -0.6}, detach: true}
              # the crit ring in the w-s plane (normal v, facing the way the blow came): 10 points, opening and twisting with burst2
              - {id: ring2_a, op: particle_def, def: bastion-s1-p-ring-crit, every: 1, times: 3, frame: burst2, pos: {w: 0.25}, to: {w: -0.25}, samples: 2, detach: true}
              - {id: ring2_b, op: particle_def, def: bastion-s1-p-ring-crit, every: 1, times: 3, frame: burst2, pos: {w: 0.2, s: 0.15}, to: {w: -0.2, s: -0.15}, samples: 2, detach: true}
              - {id: ring2_c, op: particle_def, def: bastion-s1-p-ring-crit, every: 1, times: 3, frame: burst2, pos: {w: 0.08, s: 0.24}, to: {w: -0.08, s: -0.24}, samples: 2, detach: true}
              - {id: ring2_d, op: particle_def, def: bastion-s1-p-ring-crit, every: 1, times: 3, frame: burst2, pos: {w: -0.08, s: 0.24}, to: {w: 0.08, s: -0.24}, samples: 2, detach: true}
              - {id: ring2_e, op: particle_def, def: bastion-s1-p-ring-crit, every: 1, times: 3, frame: burst2, pos: {w: -0.2, s: 0.15}, to: {w: 0.2, s: -0.15}, samples: 2, detach: true}
              - {id: imp_flare2, op: display, kind: sprite, sprite: bastion-s1-flare, size: [1.2, 1.2], billboard: center, see_through: true, brightness: {block: 15, sky: 15}, frame: wound, pos: {v: -0.3}, for: 4, detach: true}
              - {id: shard2, op: display, kind: sprite, sprite: bastion-s1-sliver, size: [0.6, 0.6], see_through: true, brightness: {block: 15, sky: 15}, frame: wound, pos: {v: -0.2, w: -0.2, s: 0.2}, plane: [v, w], for: 30, detach: true}
              - {id: shard2_fleck, op: particle_def, def: bastion-s1-p-fleck, every: 2, times: 8, frame: wound, pos: {v: -0.2, w: -0.2, s: 0.2}, detach: true}
        # --- sound (all at the caster) ---
        - {id: snd_18, op: sound, at: 3, sound: item.mace.smash_ground_heavy, frame: body, volume: 1.0, pitch: 0.7}
        - {id: snd_19, op: sound, at: 3, sound: block.anvil.land, frame: body, volume: 1.0, pitch: 0.5}
        - {id: snd_20, op: sound, at: 3, sound: entity.player.attack.crit, frame: body, volume: 1.0, pitch: 0.65}
        - {id: snd_21, op: sound, at: 3, sound: entity.iron_golem.attack, frame: body, volume: 1.0, pitch: 0.6}
        - {id: snd_22, op: sound, at: 3, sound: entity.generic.explode, frame: body, volume: 0.45, pitch: 0.5}
        - {id: snd_23, op: sound, at: 4, sound: item.armor.equip_netherite, frame: body, volume: 0.9, pitch: 0.6}
        - {id: snd_24, op: sound, at: 4, sound: block.chain.place, frame: body, volume: 0.8, pitch: 0.6}
        - {id: snd_25, op: sound, at: 12, sound: item.armor.equip_iron, frame: body, volume: 1.0, pitch: 0.8}
        # --- hit 2 ring (the waist-height ring, four quarter glyphs again), the floor ink, the streaks and the flash in front ---
        - {id: ring2_q0, op: display, at: 0, for: 14, kind: sprite, sprite: bastion-s1-ring-q0, size: [2.7, 2.7], frame: body, pos: {v: -1.0, w: 0.8, s: -1.0}, plane: [-s, v], see_through: true, brightness: {block: 15, sky: 15}}
        - {id: ring2_q1, op: display, at: 1, for: 13, kind: sprite, sprite: bastion-s1-ring-q1, size: [2.7, 2.7], frame: body, pos: {v: 1.6, w: 1.0, s: -1.0}, plane: [-s, v], see_through: true, brightness: {block: 15, sky: 15}}
        - {id: ring2_q2, op: display, at: 4, for: 10, kind: sprite, sprite: bastion-s1-ring-q2, size: [2.7, 2.7], frame: body, pos: {v: -1.0, w: 0.6, s: 1.7}, plane: [-s, v], see_through: true, brightness: {block: 15, sky: 15}}
        - {id: ring2_q3, op: display, at: 5, for: 9, kind: sprite, sprite: bastion-s1-ring-q3, size: [2.7, 2.7], frame: body, pos: {v: 1.6, w: 0.8, s: 1.7}, plane: [-s, v], see_through: true, brightness: {block: 15, sky: 15}}
        - {id: floor, op: display, at: 2, for: 2, kind: sprite, sprite: bastion-s1-ink, size: [4.4, 4.4], frame: body, pos: {v: 0.5, w: 0.1, s: -0.3}, plane: [s, v], brightness: {block: 15, sky: 15}}
        - {id: ink2, op: display, at: 3, for: 2, kind: sprite, sprite: bastion-s1-ink, size: [3.4, 3.4], frame: body, pos: {v: 1.6, w: 1.2, s: -0.2}, billboard: center, brightness: {block: 15, sky: 15}}
        - {id: streak2, op: display, at: 3, for: 6, kind: sprite, sprite: bastion-s1-streak, size: [3.6, 2.0], frame: body, pos: {v: 1.6, w: 1.8}, billboard: center, rotate: [{axis: v, deg: -4}], see_through: true, brightness: {block: 15, sky: 15}}
        - {id: streak2_x, op: display, at: 3, for: 6, kind: sprite, sprite: bastion-s1-streak, size: [3.6, 2.0], frame: body, pos: {v: 1.6, w: 1.8}, plane: [-s, v], see_through: true, brightness: {block: 15, sky: 15}}
        - {id: line2_a, op: display, at: 2, for: 3, kind: sprite, sprite: bastion-s1-streak, size: [2.0, 0.6], frame: body, pos: {v: 1.2, w: 0.6, s: -0.5}, billboard: center, see_through: true, brightness: {block: 15, sky: 15}}
        - {id: line2_b, op: display, at: 3, for: 3, kind: sprite, sprite: bastion-s1-streak, size: [2.0, 0.6], color: "#FFE070", frame: body, pos: {v: 1.4, w: 1.1, s: 0.5}, billboard: center, see_through: true, brightness: {block: 15, sky: 15}}
        # the flash is three plates through one point: camera-facing, flat, and standing across the front
        - {id: flash2, op: display, at: 3, for: 4, kind: sprite, sprite: bastion-s1-flare, size: [1.2, 1.2], frame: body, pos: {v: 1.5, w: 1.3, s: -0.1}, billboard: center, see_through: true, brightness: {block: 15, sky: 15}}
        - {id: flash2_x, op: display, at: 3, for: 4, kind: sprite, sprite: bastion-s1-flare, size: [1.2, 1.2], frame: body, pos: {v: 1.5, w: 1.3, s: -0.1}, plane: [-s, v], see_through: true, brightness: {block: 15, sky: 15}}
        - {id: flash2_f, op: display, at: 3, for: 4, kind: sprite, sprite: bastion-s1-flare, size: [1.2, 1.2], frame: body, pos: {v: 1.5, w: 1.3, s: -0.1}, plane: [v, w], see_through: true, brightness: {block: 15, sky: 15}}
        # --- dust along the blade at the sweep-2 start and the follow-up wave ---
        - {id: gather2_c, op: particle_def, def: bastion-s1-p-gather-3, at: 0, along: edge, samples: 2}
        - {id: gather2_b, op: particle_def, def: bastion-s1-p-gather-2, at: 0, along: edge, samples: 2}
        - {id: gather2_a, op: particle_def, def: bastion-s1-p-gather-1, at: 2, along: edge, samples: 2}
        - id: wave2
          at: 8
          do:
            - {id: v3, op: particle_def, def: bastion-s1-p-gather-3, every: 1, for: 3, along: edge, samples: 2}
            - {id: v2, op: particle_def, def: bastion-s1-p-gather-2, at: 1, every: 1, for: 3, along: edge, samples: 2}
            - {id: v1, op: particle_def, def: bastion-s1-p-gather-1, at: 2, every: 1, for: 3, along: edge, samples: 2}
        # --- blade fx along the edge line through the moon and the run-out (29-43), the steel at the tip ---
        - {id: b2_trail, op: particle_def, def: bastion-s1-p-trail, at: 1, every: 1, for: 15, along: edge, samples: 11}
        - {id: b2_sheath, op: particle_def, def: bastion-s1-p-sheath-hot, at: 1, every: 1, for: 15, along: edge, samples: 5}
        - {id: b2_steel, op: particle_def, def: bastion-s1-p-steel, at: 1, every: 1, for: 15, frame: blade, pos: {v: 1.7}}
        - {id: b2_fleck, op: particle_def, def: bastion-s1-p-fleck, at: 1, every: 1, for: 15, along: tip, samples: 2}
        - {id: b2_crit, op: particle_def, def: bastion-s1-p-trail-crit, at: 3, every: 1, for: 3, along: tip, samples: 5}
    slam:
      for: 12
      then: end
      do:
        # swing 3 (49-55): raise and bring the blade down; the chain resets to the rest pose at 55
        - {id: b3_slash, op: particle_def, def: bastion-s1-p-slash, at: 4, every: 1, for: 6, along: edge, samples: 11}
        - {id: b3_steel, op: particle_def, def: bastion-s1-p-steel, at: 4, every: 1, for: 6, frame: blade, pos: {v: 1.7}}
    end: {final: true}
