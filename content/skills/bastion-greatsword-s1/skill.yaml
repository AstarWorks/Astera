# bastion-greatsword-s1 "Moon Sweep" in the v3 grammar (ADR-0303): params, doc anchors, one machine state, gameplay ops, a weapon rig,
# and the look as flat timed ops. Presentation ops carry their own `at`; a particle sits at `anchor: {of: <frame>, offset}` (no helper frame per puff).
# The sheath/hot/steel line loops are two keyed end tracks (loopA_*, loopB_*) plus one emitter per line fraction (`shift` = fraction of B - A).
# Where this grammar cannot say what v2 did (baked blade samples, per-tick rig swing) the ops stay baked; the gaps are listed in the commit message.
apiVersion: astera/v3
kind: Skill
id: bastion-greatsword-s1
item: bastion-greatsword
meta:
  name: {ja: "月輪の薙ぎ", en: "Moon Sweep"}
  description: {ja: "一歩踏み込んで腰の高さで二度薙ぎ払う。初撃が当たると溜めを得る。", en: "Step in and sweep twice at waist height. Landing the first banks charge."}
  cooldown_ticks: 64
  resource_cost: 20
  tags: [melee, physical, charge]
params:
  radius: {type: blocks, default: 3.0}
  dmg_physical: {type: number, default: 35}
  dmg_physical_2: {type: number, default: 45}
  charge_ticks: {type: ticks, default: 400}
  charge_stacks: {type: number, default: 1}
  dash_distance: {type: blocks, default: 2.4}
  dash_distance_2: {type: blocks, default: 2.6}
  knockback: {type: number, default: 0.5}
anchors:
  # v2: frame fx2_bastion_s1_fx_high at caster orient yaw follow, group tick 3
  # NOTE: v2 created this frame at tick 3; a doc-level anchor exists from tick 0 and follows the caster the same way
  - {id: fx2_fx_high, anchor: caster, mode: follow}
  # v2: frame fx3_bastion_s1_fx_low at caster orient yaw follow, group tick 27
  # NOTE: v2 created this frame at tick 27; a doc-level anchor exists from tick 0 and follows the caster the same way
  - {id: fx3_fx_low, anchor: caster, mode: follow}
machine:
  start: sweep
  states:
    sweep:
      for: 58
      then: end
      do:
        # --- gameplay (v2 gameplay.timeline t4 / t7 / t28 / t31) ---
        # v2 dash_strike D over 3 ticks -> dash speed D/3 blocks/tick.
        # v2 hit_once + stop_before_target 1.7 (R9): sibling trigger-only corridor hit, window once; the dash ends at its first victim (sphere 1.7 = the stop distance).
        - {id: dash_hit, op: hit, at: 4, for: 3, every: 1, anchor: caster.body, shape: {sphere: 1.7}, targets: enemies, window: once, ignore_invulnerability: false}
        - {id: dash, op: dash, at: 4, speed: "= dash_distance / 3", for: 3, until: dash_hit.hit, direction: {forward: 1.0}, invulnerable: true, stop_on_block: true, follow_pitch: false, face_movement: false}
        # v2 sel (damage 35, ignore_invulnerability) + sel_2 (freeze 2, scope enemy+caster) are the same sphere at the same tick: one hit with the damage.
        # The hit-stop of sel_2 is the freeze row in `on: hit1` below (R25); rig.freezes holds the weapon rig only.
        - {id: hit1, op: hit, at: 7, anchor: caster, shape: {sphere: "${radius}"}, targets: enemies, damage: {physical: "${dmg_physical}"}, window: once, ignore_invulnerability: true, on: {hit: [{id: stop, op: freeze, at: 0, ticks: 2, scope: [caster, event.victim]}]}}
        - {id: st_charge, op: status, at: 7, target: caster, status: charge, stacks: "${charge_stacks}", for: "${charge_ticks}", when: "= nearest_enemy_dist(caster) < 3.6"}
        - {id: dash_hit_2, op: hit, at: 28, for: 3, every: 1, anchor: caster.body, shape: {sphere: 1.7}, targets: enemies, window: once, ignore_invulnerability: false}
        - {id: dash_2, op: dash, at: 28, speed: "= dash_distance_2 / 3", for: 3, until: dash_hit_2.hit, direction: {forward: 1.0}, invulnerable: true, stop_on_block: true, follow_pitch: false, face_movement: false}
        # v2 sel_3 (damage 45, ignore_invulnerability) + sel_4 (freeze 2 + knockback) merged the same way.
        - {id: hit2, op: hit, at: 31, anchor: caster, shape: {sphere: "${radius}"}, targets: enemies, damage: {physical: "${dmg_physical_2}"}, window: once, ignore_invulnerability: true, on: {hit: [{id: stop_2, op: freeze, at: 0, ticks: 2, scope: [caster, event.victim]}, {id: kb, op: knockback, target: event.victim, direction: "= normalize(flat(pos(event.victim) - pos(caster))) + vec(0.0, 0.2, 0.0)", strength: "${knockback}"}]}}
