            - {id: fx2_fx_high_s1h1_ring_q2, op: display, kind: sprite, see_through: true, sprite: bastion-s1-hring-q2, size: [3.047, 3.047], anchor: fx2_fx_high, brightness: {block: 15, sky: 15}, offset: {left: -1.838, up: 1.332, forward: -1.508}, rotate: [{axis: up, deg: 0.35418}, {axis: left, deg: 85.96954}, {axis: forward, deg: 0.3301}], for: 13}
            - {id: fx2_fx_high_s1h1_ring_bq0, op: display, kind: sprite, see_through: true, sprite: bastion-s1-hring-bq0, size: [3.047, 3.047], anchor: fx2_fx_high, brightness: {block: 15, sky: 15}, offset: {left: -1.862, up: 1.543, forward: 1.485}, rotate: [{axis: up, deg: 179.6}, {axis: left, deg: -85.97}], for: 13}
            - {id: fx2_fx_high_s1h1_ring_bq2, op: display, kind: sprite, see_through: true, sprite: bastion-s1-hring-bq2, size: [3.047, 3.047], anchor: fx2_fx_high, brightness: {block: 15, sky: 15}, offset: {left: -1.838, up: 1.332, forward: -1.508}, rotate: [{axis: up, deg: 179.6}, {axis: left, deg: -85.97}], for: 13}
