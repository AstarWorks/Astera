id: couture-rapier-ego
name: {ja: 終幕の裁ち鋏, en: Final Fitting}
description: {ja: 淡い鋏を宙に並べ、巨大な裁ち鋏で終幕を刻む。, en: 'Suspend pale shears above the marked line, then close a monumental final cut.'}
archetype: sequence
cooldown_ticks: 220
resource_cost: 0
tags:
- physical
- couture
params: {type: sequence}
phases:
  type: sequence
  cast:
  - type: play_vfx
    targets: {type: caster}
    vfx_id: couture-rapier-atelier
  - type: play_vfx
    targets: {type: caster}
    vfx_id: couture-rapier-ready
  - type: damage
    targets:
      type: forward_ray
      from: {type: caster}
      distance: {type: literal, value: 7}
    components:
    - base: {type: literal, value: 6}
      attribute: physical
    ignore_invulnerability: {type: literal, value: true}
    delay_ticks: {type: literal, value: 60}
  - type: play_vfx
    targets:
      type: forward_ray
      from: {type: caster}
      distance: {type: literal, value: 7}
    vfx_id: couture-rapier-burst
    delay_ticks: {type: literal, value: 60}
  - type: play_sound
    targets:
      type: forward_ray
      from: {type: caster}
      distance: {type: literal, value: 7}
    sound_id: entity.player.attack.crit
    volume: {type: literal, value: 0.6}
    pitch: {type: literal, value: 1.6}
    delay_ticks: {type: literal, value: 60}
  - type: hit_stop
    targets:
      type: forward_ray
      from: {type: caster}
      distance: {type: literal, value: 7}
    ticks: 2
    include_caster: true
    delay_ticks: {type: literal, value: 60}
  - type: screen_flash
    targets: {type: caster}
    overlay: white
    color: '#FFF1DC'
    fade_in: {type: literal, value: 0}
    stay: {type: literal, value: 1}
    fade_out: {type: literal, value: 1}
    delay_ticks: {type: literal, value: 60}
  - type: damage
    targets:
      type: forward_ray
      from: {type: caster}
      distance: {type: literal, value: 7}
    components:
    - base: {type: literal, value: 12}
      attribute: physical
    ignore_invulnerability: {type: literal, value: true}
    delay_ticks: {type: literal, value: 110}
  - type: play_vfx
    targets:
      type: forward_ray
      from: {type: caster}
      distance: {type: literal, value: 7}
    vfx_id: couture-rapier-cross
    delay_ticks: {type: literal, value: 110}
  - type: play_sound
    targets:
      type: forward_ray
      from: {type: caster}
      distance: {type: literal, value: 7}
    sound_id: entity.player.attack.crit
    volume: {type: literal, value: 0.6}
    pitch: {type: literal, value: 1.6}
    delay_ticks: {type: literal, value: 110}
  - type: hit_stop
    targets:
      type: forward_ray
      from: {type: caster}
      distance: {type: literal, value: 7}
    ticks: 4
    include_caster: true
    delay_ticks: {type: literal, value: 110}
  - type: play_vfx
    targets: {type: caster_forward, distance: 5, height: -1.62}
    vfx_id: couture-rapier-vertical
    delay_ticks: {type: literal, value: 106}
  - type: screen_flash
    targets: {type: caster}
    overlay: white
    color: '#FFF1DC'
    fade_in: {type: literal, value: 0}
    stay: {type: literal, value: 1}
    fade_out: {type: literal, value: 1}
    delay_ticks: {type: literal, value: 110}
ego_cost: 100
