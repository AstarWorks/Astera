# v3 hand port of the v2 skill (ADR-0303 rev4.2). 8 expanding rings of 16 points at ticks 0..7 plus the gameplay op at tick 0.
apiVersion: astera/v3
kind: Skill
id: sanctuary-purify
item: sanctuary-staff
meta: {name: {ja: "浄化", en: Purify}, description: {ja: "自分と周囲の味方の状態異常を取り除く。", en: "Clears harmful effects from you and nearby allies."}, cooldown_ticks: 200, resource_cost: 20, tags: [magic, support]}
anchors:
  - {id: self,  anchor: caster}
  - {id: feet,  anchor: caster, offset: {up: 0.15}}                   # was pt_caster_0_0p15_0
  - {id: chest, anchor: caster, offset: {up: 1.0}}                    # was pt_caster_0_1_0
machine:
  start: bless
  states:
    bless:
      for: 8
      then: end
      enter:
        - {id: snd, op: sound, sound: "block.amethyst_block.chime", anchor: caster, volume: 0.8, pitch: 1.2}
        - {id: cleanse, op: cleanse, negative_only: true, target: {kind: allies, around: self, radius: 6.0, max_count: all, include_self: true}}   # GAP(Q1): v2 had no cap; A=`all`, B=omit
      do:
        - id: ring
          at: 0
          every: 1
          times: 8                   # ring k = parent.i; radius = 0.4 + parent.i * (3.0 - 0.4) / 7
          do:
            - {id: pts,  op: particle, particle: end_rod, anchor: feet, count: 0, offset: "= [cos(6.283185307179586 * i / n + 6.283185307179586 * draw('shape_ph')), 0, -sin(6.283185307179586 * i / n + 6.283185307179586 * draw('shape_ph'))]", extra: 0.02, times: 16, at: 0, shift: {left: "= (0.4 + parent.i * 2.6 / 7.0) * cos(6.283185307179586 * i / n + 6.283185307179586 * draw('shape_ph'))", forward: "= -(0.4 + parent.i * 2.6 / 7.0) * sin(6.283185307179586 * i / n + 6.283185307179586 * draw('shape_ph'))"}}
            - {id: dust, op: particle, particle: dust, anchor: feet, count: 1, extra: 0, color: "#f0f0aa", size: 1.4, times: 16, at: 0, shift: {left: "= (0.4 + parent.i * 2.6 / 7.0) * cos(6.283185307179586 * i / n + 6.283185307179586 * draw('shape_ph'))", forward: "= -(0.4 + parent.i * 2.6 / 7.0) * sin(6.283185307179586 * i / n + 6.283185307179586 * draw('shape_ph'))"}}
    end: {final: true}
