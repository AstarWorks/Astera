apiVersion: astera/v3
kind: Skill
id: spear-thrust
item: spear
meta:
  name: {ja: "突き", en: "Thrust"}
  description: {ja: "前方へ鋭く突く。", en: "A sharp forward thrust."}
  cooldown_ticks: 12
  resource_cost: 6
  tags: [melee, physical]
# GAP: gameplay.expose (damage <- dmg_physical, arc_deg, range) -> none (inline literals)
anchors:
  - {id: stab_pt, anchor: caster.eye, offset: {up: -0.2, forward: 1.4}}
  - {id: foe,   anchor: victim.root}
  - {id: heart, anchor: victim.root, offset: {up: 1.2}}
machine:
  start: swing
  states:
    swing:
      for: 1
      then: end
      do:
        - id: swing
          op: hit
          at: 0
          anchor: caster.eye
          shape: {sector: {deg: 30, range: 4.2, height: 2.0}}
          targets: enemies
          damage: {physical: 34.0}
          window: once
          on:
            hit:
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: foe, volume: 0.7, pitch: 1.2}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
        - {id: snd, op: sound, sound: "astera:weapons/sword-swing", anchor: caster, volume: 1.0, pitch: 1.5}
        - {id: fx, op: particle_def, def: stab-spark, anchor: stab_pt}
    end: {final: true}
