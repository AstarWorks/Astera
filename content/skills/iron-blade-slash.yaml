# Match arsenal (wp/match-arsenal): simple PvP skill. One cast sound, a few particles.

id: iron-blade-slash

name:
  ja: "鉄の斬撃"
  en: "Iron Slash"
description:
  ja: "前方を斬りつける。"
  en: "A clean forward slash."

archetype: melee
cooldown_ticks: 10
resource_cost: 6
tags: [ melee, physical ]

params:
  type: melee
  range: 3.4
  arc_degrees: 90.0
  knockback: 0.4
  damage:
    - base: { type: literal, value: 36.0 }
      attribute: physical

phases:
  type: melee
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/sword-swing
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 1.0 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.4, height: -0.2 }
      particle_id: slash-sweep
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/blade-hit
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
  miss: []
