# Match arsenal (wp/match-arsenal): simple PvP skill. One cast sound, a few particles.

id: twin-daggers-flurry

name:
  ja: "連続斬り"
  en: "Flurry"
description:
  ja: "素早い二連撃。出血させることがある。"
  en: "Two fast cuts that can make the target bleed."

archetype: melee
cooldown_ticks: 6
resource_cost: 4
tags: [ melee, physical ]

params:
  type: melee
  range: 2.5
  arc_degrees: 70.0
  knockback: 0.1
  damage:
    - base: { type: literal, value: 18.0 }
      attribute: physical

phases:
  type: melee
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/sword-swing
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 1.7 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.4, height: -0.2 }
      particle_id: stab-spark
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/blade-hit
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
    - type: apply_status
      targets: { type: target }
      status_id: bleed
      effect_duration_ticks: { type: literal, value: 80 }
      chance: { type: literal, value: 0.4 }
  miss: []
