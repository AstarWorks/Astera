apiVersion: astera/v3
kind: Skill
id: axe-plank-wall-diamond
item: diamond-axe
meta:
  name: {ja: ダイヤの板壁, en: Diamond Plank Wall}
  description: {ja: "目の前に補強板の壁を築く。", en: "Raises a wall of reinforced planks in front of you."}
  cooldown_ticks: 200
  resource_cost: 0
  tags: [tool, cover]
anchors:
  - {id: aim, anchor: caster.eye, offset: {forward: 2.0}}
machine:
  start: cast
  states:
    cast:
      for: 1
      then: end
      do:
        - {id: wall, op: place_shape, at: 0, anchor: caster, shape: {wall: {width: 7, height: 3}}, block: "astera:reinforced_planks", consume: none, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, sound: "astera:weapons/gun-impact-block", anchor: caster, volume: 1.0, pitch: 0.9, at: 0}
        - {id: spark, op: particle_def, def: hit-spark, anchor: aim, at: 0}
    end: {final: true}
