# Match arsenal (wp/match-arsenal): simple PvP skill. One cast sound, a few particles.

id: axe-fell-diamond

name:
  ja: "ダイヤの木断ち"
  en: "Diamond Fell"
description:
  ja: "前方一直線の木のブロックを切り倒す。"
  en: "Cuts a line of wooden blocks ahead."

archetype: sequence
cooldown_ticks: 80
resource_cost: 0
tags: [ tool, cover ]

params:
  type: sequence

phases:
  type: sequence
  cast:
    - type: break_area
      shape: line
      length: 9
      width: 1
      height: 3
      power: 600
      tool_class: AXE
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/blade-heavy-swing
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 0.8 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 2.0, height: 0.0 }
      particle_id: hit-spark
