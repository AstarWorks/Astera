# Wind-up W = 3 ticks (round_half_up(5 / attack_speed 1.6)): the spear is levelled and drawn back, the charge and the every-tick hit start at tick 3.
# The cast ends with the charge state; the rig (level -> thrust along the charge -> settle) and trail are detach: true.
apiVersion: astera/v3
kind: Skill
id: spear-charge
item: spear
meta:
  name: {ja: "突撃", en: "Charge"}
  description: {ja: "遠くまで駆け抜けて突き刺す。", en: "Charges far forward, hitting the first target."}
  cooldown_ticks: 140
  resource_cost: 14
  tags: [melee, movement, physical]
params:
  speed:        {type: number, default: 1.0}
  ticks:        {type: ticks, default: 6}
  dmg_physical: {type: number, default: 40}
anchors:
  - {id: puff_pt, anchor: caster, offset: {up: 0.2}, mode: follow}
machine:
  start: windup
  tail: 13
  states:
    windup:
      for: 3
      then: charge
      do:
        - id: rig
          op: rig
          parent: caster
          mount: caster.hand_r
          rest: [{axis: left, deg: 72}]
          for: 16
          detach: true
          swing:
            - {at: 0, for: 3, from: {left: 0.1, up: 0.1, forward: 0.95}, to: {left: -0.25, up: -0.2, forward: 0.5}, edge: trailing, ease: in_out_sine}
            - {at: 3, for: 3, to: {left: 0.0, up: 0.0, forward: 1.0}, edge: leading, ease: out_cubic}
            - {at: 6, for: 10, to: {left: -0.1, up: 0.3, forward: 0.9}, edge: trailing, ease: in_out_sine}
    charge:
      for: 6
      then: end
      enter:
        - {id: snd, op: sound, sound: "astera:weapons/dash-whoosh", anchor: caster, volume: 1.0, pitch: 1.1, detach: true}
        - {id: puff, op: particle_def, def: dash-cloud, anchor: puff_pt, detach: true}
        - {id: dash, op: dash, at: 0, speed: "${speed}", for: "${ticks}", until: strike.hit, direction: {forward: 1}, follow_pitch: false, stop_on_block: true, invulnerable: false, face_movement: false}
        - id: strike
          op: hit
          at: 0
          every: 1
          for: "${ticks}"
          anchor: caster.body
          shape: {sphere: 1.0}
          targets: enemies
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          window: once
          on:
            hit:
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, detach: true}
        - {id: trail_fx, op: particle, particle: crit, anchor: {of: /windup/rig.root, to: /windup/rig.tip, samples: 3}, count: 1, extra: 0.03, at: 0, every: 3, for: 12, detach: true}
    end: {final: true}
