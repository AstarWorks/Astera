apiVersion: astera/v3
kind: Skill
id: spear-charge
item: spear
meta:
  name: {ja: "突撃", en: "Charge"}
  description: {ja: "遠くまで駆け抜けて突き刺す。", en: "Charges far forward, hitting the first target."}
  cooldown_ticks: 140
  resource_cost: 14
  tags: [melee, movement, physical]
anchors:
  - {id: puff_pt, anchor: caster, offset: {up: 0.2}}
machine:
  start: charge
  states:
    charge:
      for: 6
      then: end
      do:
        - {id: snd, op: sound, sound: "astera:weapons/dash-whoosh", anchor: caster, volume: 1.0, pitch: 1.1}
        - {id: puff, op: particle_def, def: dash-cloud, anchor: puff_pt}
        # v2 dash_strike distance 6 over 6 ticks = 1.0 block per tick
        - {id: dash, op: dash, at: 0, speed: 1.0, for: 6, until: strike.hit, direction: {forward: 1}, follow_pitch: false, stop_on_block: true, invulnerable: false, face_movement: false}
        - id: strike
          op: hit
          at: 0
          every: 1
          for: 6
          anchor: caster.body
          shape: {sphere: 1.0}
          targets: enemies
          ignore_invulnerability: false
          damage: {physical: 40.0}
          window: once
          on:
            hit:
              # v2 raise_event dash_fx: its only listener played blade-hit at the enemy, inlined here
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact}
    end: {final: true}
