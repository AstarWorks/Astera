apiVersion: astera/v3
kind: Skill
id: spear-charge
item: spear
meta:
  name: {ja: "突撃", en: "Charge"}
  description: {ja: "遠くまで駆け抜けて突き刺す。", en: "Charges far forward, hitting the first target."}
  cooldown_ticks: 140
  resource_cost: 14
  tags: [melee, movement, physical]
# GAP: gameplay.expose (damage <- dmg_physical) -> none (inline literal)
anchors:
  - {id: puff_pt, anchor: caster, offset: {up: 0.2}}
  - {id: foe, anchor: victim.root}
machine:
  start: charge
  states:
    charge:
      for: 6
      then: end
      do:
        - {id: snd, op: sound, sound: "astera:weapons/dash-whoosh", anchor: caster, volume: 1.0, pitch: 1.1}
        - {id: puff, op: particle_def, def: dash-cloud, anchor: puff_pt}
        # v2 dash_strike distance 6 over 6 ticks = 1.0 block per tick
        # GAP: dash_strike stop_on_block true, follow_pitch false (horizontal only), invulnerable false -> dash {speed, for, ease?, direction?} has no stop-on-block or pitch lock
        - {id: dash, op: dash, speed: 1.0, for: 6}
        # GAP: dash_strike hit_once + on_hit ends the dash at the first victim -> none (hit window: once only limits repeat hits; the dash keeps going)
        - id: strike
          op: hit
          at: 0
          every: 1
          for: 6
          anchor: caster
          shape: {sphere: 1.0}
          targets: enemies
          damage: {physical: 40.0}
          window: once
          on:
            hit:
              # GAP: raise_event dash_fx -> none; its only listener played blade-hit at the enemy, inlined here
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: foe}
    end: {final: true}
