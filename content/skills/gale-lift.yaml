# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: gale-lift

name:
  ja: "追い風"
  en: "Updraft"
description:
  ja: "自分を前上方へ吹き飛ばす。"
  en: "Launches you up and forward."

archetype: sequence
cooldown_ticks: 160
resource_cost: 10
tags: [ magic, wind, movement ]

params:
  type: sequence

phases:
  type: sequence
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.breeze.jump
      volume: { type: literal, value: 0.9 }
      pitch: { type: literal, value: 1.1 }
    - type: spawn_particle
      targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 0.2, z: 0.0 } } }
      particle_id: dash-cloud
    - type: propel
      targets: { type: caster }
      direction: { type: from_caster }
      strength: { type: literal, value: 1.0 }
    - type: propel
      targets: { type: caster }
      direction: { type: up }
      strength: { type: literal, value: 0.6 }
