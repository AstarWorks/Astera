# Persona weapon #10 (edict-blade), DEF / sneak + left-click: Cold Reply.
# A backstep (short speed buff) that leaves three pale afterimages along the retreat; the instant the
# evade window closes (8t) a counter-line slashes the cone ahead (3) and the blade banks two Poise.
# Archetype buff: the status is the evade window, everything else is explicit mechanics.

id: edict-def

name:
  ja: "冷たい返答"
  en: "Edict Cold Reply"
description:
  ja: "残像を残して後ろへ跳び、かわしざまに前方を斬り返す。「平静」を二つ得る。"
  en: "Backsteps leaving afterimages, then slashes back across the cone ahead. Banks two Poise."

archetype: buff
cooldown_ticks: 80
resource_cost: 18              # energy
tags: [ buff, evade, counter, physical, persona, edict, poise ]

params:
  type: buff
  status_effect_id: evasive
  duration_ticks: 25

phases:
  type: buff
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.knockback
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 1.4 }
    - type: propel
      targets: { type: caster }
      direction: { type: from_caster }
      strength: { type: literal, value: -1.0 }
    - type: play_vfx
      targets: { type: caster }
      vfx_id: edict-ghost
    - type: apply_status
      targets: { type: caster }
      status_id: poise
      effect_duration_ticks: { type: literal, value: 400 }
      stack_count: { type: literal, value: 2 }
    # 8: the counter
    - type: damage
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 70.0 }, distance: { type: literal, value: 5.0 } }
      ignore_invulnerability: { type: literal, value: true }
      delay_ticks: { type: literal, value: 8 }
      components:
        - base: { type: literal, value: 3.0 }
          attribute: physical
    - type: play_vfx
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 70.0 }, distance: { type: literal, value: 5.0 } }
      vfx_id: edict-slash-h
      delay_ticks: { type: literal, value: 8 }
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.sweep
      volume: { type: literal, value: 0.9 }
      pitch: { type: literal, value: 1.8 }
      delay_ticks: { type: literal, value: 8 }
  expire: []
  removed: []
