# Match arsenal (wp/match-arsenal): simple PvP skill. One cast sound, a few particles.

id: frost-rod-sleet

name:
  ja: "みぞれ"
  en: "Sleet"
description:
  ja: "氷の欠片。凍らせることがある。"
  en: "A chilling shard that can freeze."

archetype: projectile
cooldown_ticks: 22
resource_cost: 6
tags: [ ranged, water ]

params:
  type: projectile
  launch_speed: 2.4
  max_lifetime_ticks: 45
  visual:
    trail_spacing: 0.4
    trail:
      - type: point
        particles:
          - { id: snowflake, offset: { x: 0.04, y: 0.04, z: 0.04 } }
          - { id: dust, color: { r: 200, g: 235, b: 255 }, scale: 1.0 }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:skill/wand/cast
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 1.4 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 0.9, height: -0.25 }
      particle_id: frost-cast
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 36.0 }
          attribute: water
    - type: play_sound
      targets: { type: target }
      sound_id: astera:skills/frost-impact
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
    - type: apply_status
      targets: { type: target }
      status_id: freeze
      effect_duration_ticks: { type: literal, value: 40 }
      chance: { type: literal, value: 0.4 }
  hit_block:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: astera:weapons/gun-impact-block
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.5 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: hit-spark
  miss: []
  expire: []
