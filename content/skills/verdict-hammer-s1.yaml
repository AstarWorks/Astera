# ADR-0230 persona weapon: Verdict Hammer S1 (left click), "Gavel Strike". Two beats: a hammer
# slam with a gold crescent now, an echo crescent 14 ticks later (it ignores invulnerability frames so it
# really lands). Every landed beat drives one rupture stake into the
# target; the echo hits harder per stake. The echo picks its victims when it fires (a cone in front
# of where the cast started), so backing off or sidestepping dodges it; 

id: verdict-hammer-s1

name:
  ja: "槌音の一撃"
  en: "Gavel Strike"
description:
  ja: "宙に浮かぶ杭槌を叩きつけ、遅れて響く二撃目。命中ごとに対象へ杭（破裂）を打ち込み、二撃目は杭の数で威力が増す。"
  en: "Slam a floating hammer, then an echo strikes again. Each landed beat drives a rupture stake in; the echo scales with stakes."

archetype: melee
cooldown_ticks: 36
resource_cost: 20              # energy
tags: [ melee, physical, burst, rupture ]

params:
  type: melee
  range: 3.8
  arc_degrees: 130.0
  knockback: 0.4
  damage:
    - base: { type: literal, value: 7.0 }
      attribute: physical

phases:
  type: melee
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.sweep
      pitch: { type: literal, value: 0.5 }
    - type: play_vfx
      targets: { type: caster }
      vfx_id: verdict-s1-gavel
    - type: play_vfx
      targets: { type: caster }
      vfx_id: verdict-s1-echo
      delay_ticks: { type: literal, value: 10 }
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.sweep
      pitch: { type: literal, value: 0.8 }
      delay_ticks: { type: literal, value: 12 }
    # Beat 2: the echo, victims chosen at tick 21.
    - type: damage
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 130.0 }, distance: { type: literal, value: 4.6 } }
      components:
        - base: { type: literal, value: 8.0 }
          attribute: physical
          per_stack: { status_id: rupture, amount: 0.5, on: target, consume: false }
      ignore_invulnerability: { type: literal, value: true }
      delay_ticks: { type: literal, value: 14 }
    - type: apply_status
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 130.0 }, distance: { type: literal, value: 4.6 } }
      status_id: rupture
      effect_duration_ticks: { type: literal, value: 200 }
      stack_count: { type: literal, value: 1 }
      delay_ticks: { type: literal, value: 14 }
    - type: play_vfx
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 130.0 }, distance: { type: literal, value: 4.6 } }
      vfx_id: verdict-impact
      scale: { type: literal, value: 1.3 }
      delay_ticks: { type: literal, value: 14 }
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.strong
      delay_ticks: { type: literal, value: 14 }
  hit_entity:
    # Beat 1 (the baseline params.damage above).
    - type: apply_status
      targets: { type: target }
      status_id: rupture
      effect_duration_ticks: { type: literal, value: 200 }
      stack_count: { type: literal, value: 1 }
    - type: play_vfx
      targets: { type: target }
      vfx_id: verdict-impact
    - type: camera_shake
      targets: { type: target }
      intensity: { type: literal, value: 0.3 }
      ticks: { type: literal, value: 4 }
    - type: play_sound
      targets: { type: target }
      sound_id: entity.player.attack.crit
  miss:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.nodamage
