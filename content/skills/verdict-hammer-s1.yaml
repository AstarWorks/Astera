id: verdict-hammer-s1
name:
  ja: 槌音の一撃
  en: Gavel Strike
description:
  ja: 踏み込み、杭槌を二度振るって破裂の杭を打つ。
  en: Slide in and swing the tower hammer twice, planting rupture stakes.
archetype: sequence
cooldown_ticks: 85
resource_cost: 20
params:
  type: sequence
phases:
