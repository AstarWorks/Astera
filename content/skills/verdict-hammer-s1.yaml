    delay_ticks:
      type: literal
      value: 7
    distance: 5.5
    ticks: 12
    radius: 0.3
    hit_once: true
    stop_on_block: true
    on_hit: []
    stop_before_target: 1.8
  - type: play_vfx
    targets: &id001
      type: caster
    delay_ticks:
      type: literal
      value: 7
    vfx_id: verdict-s2-call
