id: bastion-greatsword-s2
name:
  ja: 審判の突進
  en: Judgement Rush
description:
  ja: 二度薙ぎ払い、頭上から斬り下ろす。最後の一撃で溜めを消費する。
  en: Two sweeping cuts followed by an overhead cleave. The final blow spends charge.
archetype: sequence
cooldown_ticks: 100
resource_cost: 30
tags: [melee, physical, charge]
params:
  type: sequence
phases:
  type: sequence
  cast:
  - type: play_vfx
    vfx_id: bastion-s2-rush
    targets:
      type: caster
  - type: damage
    targets:
      type: nearby_entities
      center:
        type: caster
      radius: {type: literal, value: 3.3}
      exclude_caster: true
    components:
    - base: {type: literal, value: 7}
      attribute: physical
      per_stack:
        status_id: charge
        amount: 0.5
        'on': caster
        consume: false
    ignore_invulnerability:
      type: literal
      value: true
    delay_ticks: {type: literal, value: 8}
  - type: spawn_particle
    targets:
      type: nearby_entities
      center:
        type: caster
      radius: {type: literal, value: 3.3}
      exclude_caster: true
    particle_id: bastion-s3-hit-crit
    delay_ticks: {type: literal, value: 8}
  - type: hit_stop
    targets:
      type: nearby_entities
      center:
        type: caster
      radius: {type: literal, value: 3.3}
      exclude_caster: true
    ticks: 2
