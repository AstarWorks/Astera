# ADR-0230 persona weapon: Bastion Greatsword S2 (right click), "Judgement Rush". 8 ticks of
# telegraph (lit floor lane + sword held flat), a 7-block rush, and if it connects a plunge on the
# spot 30 ticks later (converging warning hoop = dodgeable). Both hits scale with banked charge;
# the plunge spends it. A rush that touches nobody does nothing past the visuals.
# A sequence skill: no baseline hit, all damage comes from the timeline below.

id: bastion-greatsword-s2

name:
  ja: "審判の突進"
  en: "Judgement Rush"
description:
  ja: "溜めた力で突進し、命中した地点へ大剣を突き立てる。溜め（チャージ）を消費して威力が増す。"
  en: "Rush forward and, if it connects, plunge the greatsword into the spot. Spends charge for extra damage."

archetype: sequence
cooldown_ticks: 100
resource_cost: 30              # energy
tags: [ melee, physical, movement, charge ]

params:
  type: sequence

phases:
  type: sequence
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: block.anvil.land
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 0.6 }
    - type: play_vfx
      targets: { type: caster }
      vfx_id: bastion-s2-rush
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.knockback
      pitch: { type: literal, value: 0.7 }
      delay_ticks: { type: literal, value: 8 }
    - type: dash_strike
      delay_ticks: { type: literal, value: 8 }
      distance: 7.0
      ticks: 5
      radius: 1.3
      hit_once: true
      invulnerable: true
      stop_on_block: true
      on_hit:
        # Hit 1: the rush itself.
        - type: damage
          targets: { type: target }
          components:
            - base: { type: literal, value: 7.0 }
              attribute: physical
              per_stack: { status_id: charge, amount: 0.5, on: caster, consume: false }
        - type: hit_stop
          targets: { type: target }
          ticks: 3
          include_caster: true
        - type: knockback
          targets: { type: target }
          direction: { type: from_caster }
          strength: { type: literal, value: 0.5 }
        - type: play_vfx
          targets: { type: target }
          vfx_id: bastion-impact
          scale: { type: literal, value: 1.3 }
        - type: camera_shake
          targets: { type: target }
          intensity: { type: literal, value: 0.5 }
          ticks: { type: literal, value: 6 }
        - type: play_sound
          targets: { type: target }
          sound_id: entity.player.attack.strong
        # Hit 2: plunge on the spot the rush connected, 30 ticks later; the hoop warns for 14.
        - type: play_vfx
          targets: { type: hit_location }
          vfx_id: bastion-s2-plunge
          delay_ticks: { type: literal, value: 16 }
        - type: damage
          targets: { type: nearby_entities, center: { type: hit_location }, radius: { type: literal, value: 3.6 }, exclude_caster: true }
          components:
            - base: { type: literal, value: 9.0 }
              attribute: physical
              per_stack: { status_id: charge, amount: 0.5, on: caster, consume: true }
          delay_ticks: { type: literal, value: 30 }
        - type: knockup
          targets: { type: nearby_entities, center: { type: hit_location }, radius: { type: literal, value: 3.6 }, exclude_caster: true }
          strength: { type: literal, value: 0.7 }
          delay_ticks: { type: literal, value: 30 }
        - type: hit_stop
          targets: { type: nearby_entities, center: { type: hit_location }, radius: { type: literal, value: 3.6 }, exclude_caster: true }
          ticks: 3
          delay_ticks: { type: literal, value: 30 }
        - type: camera_shake
          targets: { type: nearby_entities, center: { type: hit_location }, radius: { type: literal, value: 6.0 }, exclude_caster: false }
          intensity: { type: literal, value: 0.8 }
          ticks: { type: literal, value: 8 }
          delay_ticks: { type: literal, value: 30 }
        - type: play_sound
          targets: { type: hit_location }
          sound_id: entity.generic.explode
          volume: { type: literal, value: 0.6 }
          pitch: { type: literal, value: 0.8 }
          delay_ticks: { type: literal, value: 30 }
