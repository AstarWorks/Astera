apiVersion: astera/v3
kind: Skill
id: axe-fell-stone
item: stone-axe
meta:
  name: {ja: 石の木断ち, en: Stone Fell}
  description: {ja: "前方一直線の木のブロックを切り倒す。", en: "Cuts a line of wooden blocks ahead."}
  cooldown_ticks: 140
  resource_cost: 0
  tags: [tool, cover]
anchors:
  - {id: aim, anchor: caster.eye, offset: {forward: 2.0}}
presentation:
  timeline:
    - id: swing
      at: 0
      do:
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 1.0, pitch: 0.8}
        - {id: spark, op: emit, effect: hit-spark, anchor: aim}
machine:
  start: cast
  states:
    cast:
      for: 1
      then: done
      enter:
        - {id: fell, op: break_area, at: 0, anchor: caster.eye, shape: {line: {length: 5, width: 1}}, tool: axe, block_damage: 100, ripple: 29, revert: 200, outside_arena: false}
    done: {final: true}
