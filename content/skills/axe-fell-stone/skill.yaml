apiVersion: astera/v3
kind: Skill
id: axe-fell-stone
item: stone-axe
meta:
  name: {ja: 石の木断ち, en: Stone Fell}
  description: {ja: "前方一直線の木のブロックを切り倒す。", en: "Cuts a line of wooden blocks ahead."}
  cooldown_ticks: 140
  resource_cost: 0
  tags: [tool, cover]
anchors:
  - {id: aim, anchor: caster, offset: {forward: 2.0}}
machine:
  start: cast
  states:
    cast:
      start: strike
      do:
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 1.0, pitch: 0.8, at: 0}
        - {id: spark, op: particle_def, def: hit-spark, anchor: aim, at: 0}
      on:
        - {event: end, to: done}
      states:
        strike:
          for: 1
          then: recover
          enter:
            - {id: fell, op: break_area, at: 0, anchor: caster, shape: {line: {length: 5, width: 1}}, tool: axe, block_damage: 100, ripple: 29, revert: 200, outside_arena: false}
        recover: {final: true}
    done: {final: true}
