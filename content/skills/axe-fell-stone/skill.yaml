# Hand-authored tool presentation. Mechanical shape / timing / damage / cooldown stay unchanged.
# Dust uses typical tool material; no per-cell surface data is exposed to presentation rows.
apiVersion: astera/v3
kind: Skill
id: axe-fell-stone
item: stone-axe
meta:
  name: {ja: "石の木断ち", en: "Stone Fell"}
  description: {ja: "前方一直線の木のブロックを切り倒す。", en: "Cuts a line of wooden blocks ahead."}
  cooldown_ticks: 140
  resource_cost: 0
  tags: [tool, cover]
params:
  length: {type: number, default: 5}
  trail_span: {type: number, default: 6}
  splinters: {type: number, default: 6}
  chips: {type: number, default: 3}
  core_color: {type: string, default: "#9e7545"}
  core_size: {type: number, default: 0.3}
frames:
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: w, to: 0}
      - {at: 0, for: 5, about: w, to: -90, ease: out_cubic}
      - {at: 5, for: 3, about: w, to: 25, ease: out_cubic}
      - {at: 8, for: 3, about: w, to: 0, ease: out_cubic}
      - {at: 0, for: 0, about: s, to: -30}
      - {at: 0, for: 5, about: s, to: 12, ease: out_quad}
      - {at: 5, for: 3, about: s, to: -5, ease: out_cubic}
      - {at: 8, for: 3, about: s, to: -25, ease: out_cubic}
      - {at: 11, for: 3, about: s, to: -30, ease: in_out_sine}
  - id: tool
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 5, about: s, to: 110, ease: out_quad}
      - {at: 5, for: 3, about: s, to: -30, ease: out_cubic}
      - {at: 8, for: 3, about: s, to: -55, ease: out_cubic}
      - {at: 11, for: 3, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
lines:
  edge: {frame: tool, from: {v: 0.3}, to: {v: 0.8}}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 6
      then: cast
      do:
        - {id: rig, op: rig, frame: tool, for: 14, detach: true}
        # First blade sample precedes impact; remaining samples belong to cast.
        - {id: trail, op: particle, particle: dust, along: edge, samples: 5, count: 1, color: "#b88c55", size: 0.35, extra: 0, at: 5}
        - {"id": "crescent_0", "op": "particle", "particle": "dust", "frame": "body", "times": 15, "pos": {"v": "= 1.4 - 0.55 * cos(-pi / 2 + i * pi / 14)", "w": "= 1.0 + 0.8 * sin(-pi / 2 + i * pi / 14)"}, "count": 1, "color": "#dfba7a", "size": "${core_size}", "extra": 0, "at": 2}
        - {"id": "crescent_1", "op": "particle", "particle": "dust", "frame": "body", "times": 15, "pos": {"v": "= 2.55 - 0.55 * cos(-pi / 2 + i * pi / 14)", "w": "= 1.0 + 0.8 * sin(-pi / 2 + i * pi / 14)"}, "count": 1, "color": "#dfba7a", "size": "${core_size}", "extra": 0, "at": 3}
        - {"id": "crescent_2", "op": "particle", "particle": "dust", "frame": "body", "times": 15, "pos": {"v": "= 3.6999999999999997 - 0.55 * cos(-pi / 2 + i * pi / 14)", "w": "= 1.0 + 0.8 * sin(-pi / 2 + i * pi / 14)"}, "count": 1, "color": "#dfba7a", "size": "${core_size}", "extra": 0, "at": 4}
        - {"id": "crescent_3", "op": "particle", "particle": "dust", "frame": "body", "times": 15, "pos": {"v": "= 4.85 - 0.55 * cos(-pi / 2 + i * pi / 14)", "w": "= 1.0 + 0.8 * sin(-pi / 2 + i * pi / 14)"}, "count": 1, "color": "#dfba7a", "size": "${core_size}", "extra": 0, "at": 5}
        - {"id": "travel_sweep_0", "op": "particle", "particle": "sweep_attack", "frame": "body", "pos": {"v": 1.4, "w": 1}, "count": 1, "extra": 0, "at": 2}
        - {"id": "travel_sweep_2", "op": "particle", "particle": "sweep_attack", "frame": "body", "pos": {"v": 3.7, "w": 1}, "count": 1, "extra": 0, "at": 4}
    cast:
      for: 1
      then: end
      do:
        - {id: fell, op: break_area, block_family: wood, frame: body, shape: {line: {length: "${length}", width: 1, height: 3}}, tool: axe, block_damage: 100, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, sound: block.wood.break, frame: body, volume: 1.0, pitch: 1.0}
        - {id: wave_0, op: particle, particle: block, block: minecraft:oak_log, frame: body, pos: {v: "= 1 + (0 / 2.0) * (${length} - 1)", w: 0.6, s: 0.0}, count: "${splinters}", offset: [0.14, 0.14, 0.14], extra: 0.04, at: 0}
        - {id: wave_1, op: particle, particle: block, block: minecraft:oak_log, frame: body, pos: {v: "= 1 + (1 / 2.0) * (${length} - 1)", w: 0.6, s: 0.0}, count: "${splinters}", offset: [0.14, 0.14, 0.14], extra: 0.04, at: 2, detach: true}
        - {id: wave_2, op: particle, particle: block, block: minecraft:oak_log, frame: body, pos: {v: "= 1 + (2 / 2.0) * (${length} - 1)", w: 0.6, s: 0.0}, count: "${splinters}", offset: [0.14, 0.14, 0.14], extra: 0.04, at: 4, detach: true}
        - {id: wave_quarter, op: particle, particle: block, block: minecraft:oak_log, frame: body, pos: {v: "= 1 + (0.5 / 2.0) * (${length} - 1)", w: 0.6, s: 0.0}, count: "${splinters}", offset: [0.14, 0.14, 0.14], extra: 0.04, at: 1, detach: true}
        - {id: wave_three_quarters, op: particle, particle: block, block: minecraft:oak_log, frame: body, pos: {v: "= 1 + (1.5 / 2.0) * (${length} - 1)", w: 0.6, s: 0.0}, count: "${splinters}", offset: [0.14, 0.14, 0.14], extra: 0.04, at: 3, detach: true}
        - {id: wave_0_puff, op: particle, particle: dust, frame: body, pos: {v: "= 1 + (0 / 2.0) * (${length} - 1)", w: 0.6, s: 0.0}, count: "${chips}", offset: [0.12, 0.08, 0.12], color: "${core_color}", size: "${core_size}", extra: 0}
        - {id: wave_1_puff, op: particle, particle: dust, frame: body, pos: {v: "= 1 + (1 / 2.0) * (${length} - 1)", w: 0.6, s: 0.0}, count: "${chips}", offset: [0.12, 0.08, 0.12], color: "${core_color}", size: "${core_size}", extra: 0, at: 2, detach: true}
        - {id: wave_2_puff, op: particle, particle: dust, frame: body, pos: {v: "= 1 + (2 / 2.0) * (${length} - 1)", w: 0.6, s: 0.0}, count: "${chips}", offset: [0.12, 0.08, 0.12], color: "${core_color}", size: "${core_size}", extra: 0, at: 4, detach: true}
        - {id: trail, op: particle, particle: dust, along: edge, samples: 5, count: 1, color: "#b88c55", size: 0.35, extra: 0, at: 1, every: 2, for: "= ${trail_span} - 2", detach: true}
        - {"id": "contact_chips", "op": "particle", "frame": "body", "pos": {"v": 5.65, "w": 1.0}, "at": 0, "detach": true, "particle": "block", "block": "minecraft:oak_log", "count": "= 12 + 6 * ${chips}", "offset": [0.18, 0.18, 0.18], "extra": 0.13}
        - {"id": "contact_core", "op": "particle", "frame": "body", "pos": {"v": 5.65, "w": 1.0}, "at": 0, "detach": true, "particle": "dust", "count": "= 6 + 2 * ${chips}", "offset": [0.12, 0.12, 0.12], "color": "${core_color}", "size": "= ${core_size} * 2", "extra": 0}
        - {"id": "crescent_4", "op": "particle", "particle": "dust", "frame": "body", "times": 15, "pos": {"v": "= 6.0 - 0.55 * cos(-pi / 2 + i * pi / 14)", "w": "= 1.0 + 0.8 * sin(-pi / 2 + i * pi / 14)"}, "count": 1, "color": "#dfba7a", "size": "= ${core_size} + 0.4", "extra": 0, "at": 4, "detach": true}
        - {"id": "contact_sweep", "op": "particle", "frame": "body", "pos": {"v": 6, "w": 1.0}, "at": 0, "detach": true, "particle": "sweep_attack", "count": 1, "extra": 0}
        - {"id": "terminal_chips", "op": "particle", "frame": "body", "pos": {"v": 5.65, "w": 1.0}, "at": 4, "detach": true, "particle": "block", "block": "minecraft:oak_log", "count": "= 6 + 3 * ${chips}", "offset": [0.18, 0.18, 0.18], "extra": 0.13}
        - {"id": "terminal_sweep", "op": "particle", "frame": "body", "pos": {"v": 6, "w": 1.0}, "at": 4, "detach": true, "particle": "sweep_attack", "count": 1, "extra": 0}
    end: {final: true}
