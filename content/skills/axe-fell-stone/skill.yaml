# Cuts a line of wooden blocks ahead, in the frame grammar (ADR-0314 / ADR-0315). Base of the axe-fell tiers (this is the stone tier);
# axe-fell-iron / -diamond extend it (ADR-0303 9.3): same document, other id / item / meta and the `with:` values below.
# Wind-up W = 6 ticks (round_half_up(5 / attack_speed 0.8 (vanilla stone axe; the iron axe 0.9 also rounds to 6, the diamond axe 1.0 would be 5
# but tiers share the base))): the axe is drawn back over 5 ticks, the cut starts at tick 5 so the head crosses the target at the impact (tick 6)
# and the blocks give way there; then 6 ticks of follow-through. Gameplay (the line of blocks, sounds, cooldown) is unchanged.
# Three frames carry everything drawn:
#   arm  - the caster's right shoulder (`caster.shoulder_r`); it only turns (pitch about s), so the arm points where the hand goes.
#   tool - the held tool: its origin is the point 0.6 along the arm (`origin: {frame: arm, pos: {v: 0.6}}`, the length of the rigid arm), so the
#          hand reaches it on every tick by construction. The right hand is pinned onto this origin by the engine (ADR-0315): the head leads,
#          the hand follows. The head turns about its own s (v towards w): drawn back, down through the target, run out, then `reset` eases it
#          back to the rest pose before the rig ends. The line `edge` (head base -> head) is what the trail draws along.
#   body - the caster's feet, v forward / w up / s right: the hit area spark is a point of it.
apiVersion: astera/v3
kind: Skill
id: axe-fell-stone
item: stone-axe
meta:
  name: {ja: "石の木断ち", en: "Stone Fell"}
  description: {ja: "前方一直線の木のブロックを切り倒す。", en: "Cuts a line of wooden blocks ahead."}
  cooldown_ticks: 140
  resource_cost: 0
  tags: [tool, cover]
params:
  length: {type: number, default: 5}
  strip_pitch: {type: number, default: 0.8}
  break_vol: {type: number, default: 0.8}
  break_pitch: {type: number, default: 0.9}
  strong: {type: bool, default: false}
  crit: {type: bool, default: false}
  spark: {type: string, default: tool-axe-stone}
frames:
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      # pitch about s: where the straight arm points (angle from forward, towards up); the arm only turns, the hand rides its end
      - {at: 0, for: 0, about: s, to: -30}                                   # rest: the hand at the hip
      - {at: 0, for: 5, about: s, to: 95, ease: out_quad}                        # drawn back over the head
      - {at: 5, for: 3, about: s, to: -5, ease: out_cubic}                       # the cut
      - {at: 8, for: 3, about: s, to: -25, ease: out_cubic}                      # follow-through
      - {at: 11, for: 3, about: s, to: -30, ease: in_out_sine}                    # back to the hip
  - id: tool
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 5, about: s, to: 110, ease: out_quad}
      - {at: 5, for: 3, about: s, to: -30, ease: out_cubic}
      - {at: 8, for: 3, about: s, to: -55, ease: out_cubic}
      - {at: 11, for: 3, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
lines:
  edge: {frame: tool, from: {v: 0.3}, to: {v: 0.8}}      # head base -> head
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 6
      then: cast
      do:
        - {id: rig, op: rig, frame: tool, for: 14, detach: true}
        - {id: trail, op: particle, particle: crit, along: edge, samples: 4, count: 1, extra: 0.04, at: 5, every: 2, for: 6, detach: true}
    cast:
      for: 1
      then: end
      do:
        - {id: fell, op: break_area, frame: body, shape: {line: {length: "${length}", width: 1, height: 3}}, tool: axe, block_damage: 100, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, sound: item.axe.strip, frame: body, volume: 1.0, pitch: "${strip_pitch}"}
        - {id: snd_2, op: sound, sound: block.wood.break, frame: body, volume: "${break_vol}", pitch: "${break_pitch}"}
        - {id: snd_3, op: sound, sound: entity.player.attack.strong, frame: body, volume: 0.6, pitch: 0.9, when: "= ${strong}"}
        - {id: snd_4, op: sound, sound: entity.player.attack.crit, frame: body, volume: 0.8, pitch: 0.9, when: "= ${crit}"}
        - {id: spark, op: particle_def, def: "${spark}", frame: body, pos: {v: 2.0}}
    end: {final: true}
