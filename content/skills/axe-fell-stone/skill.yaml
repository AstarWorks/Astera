# Cuts a line of wooden blocks ahead; the tiers differ in reach. Base of the axe-fell tiers (this is the stone tier);
# axe-fell-iron / -diamond extend it (ADR-0303 9.3): same document, other id / item / meta and the `with:` values below.
# Wind-up W = 6 ticks (round_half_up(5 / attack_speed 0.8 (vanilla stone axe; the iron axe 0.9 also rounds to 6, the diamond axe 1.0 would be 5 but tiers share the base))): the held rig swings in the wind-up and the blocks give way at tick 6 (the impact), as the melee skills.
apiVersion: astera/v3
kind: Skill
id: axe-fell-stone
item: stone-axe
meta:
  name: {ja: "石の木断ち", en: "Stone Fell"}
  description: {ja: "前方一直線の木のブロックを切り倒す。", en: "Cuts a line of wooden blocks ahead."}
  cooldown_ticks: 140
  resource_cost: 0
  tags: [tool, cover]
params:
  length: {type: number, default: 5}
  strip_pitch: {type: number, default: 0.8}
  break_vol: {type: number, default: 0.8}
  break_pitch: {type: number, default: 0.9}
  strong: {type: bool, default: false}
  crit: {type: bool, default: false}
  spark: {type: string, default: tool-axe-stone}
anchors:
  - {id: aim_pt, anchor: caster, offset: {forward: 2.0}, mode: follow}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 6
      then: cast
      do:
        # held rig: one performance in the wind-up, detached so it plays on through the impact and the tail. Overhead strike written as the head's travel (caster frame left/up/forward):
        # drawn back over 5 ticks, the cut starts at tick 5 so the head crosses the target at the impact (tick 6), then 6 ticks of follow-through.
        - id: rig
          op: rig
          parent: caster
          mount: caster.hand_r
          rest: [{axis: left, deg: 72}]
          detach: true
          for: 14
          swing:
            - {at: 0, for: 5, from: {left: 0.000, up: 0.507, forward: 0.862}, to: {left: 0.100, up: 0.949, forward: -0.300}, edge: trailing, roll: 0, ease: out_quad}
            - {at: 5, for: 3, to: {left: 0.000, up: -0.447, forward: 0.894}, edge: leading, roll: 0, ease: out_cubic}
            - {at: 8, for: 6, to: {left: 0.000, up: -0.786, forward: 0.618}, edge: leading, roll: 0, ease: out_cubic}
    cast:
      for: 1
      then: end
      do:
        - {id: fell, op: break_area, anchor: caster, shape: {line: {length: "${length}", width: 1, height: 3}}, tool: axe, block_damage: 100, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, sound: item.axe.strip, anchor: caster, volume: 1.0, pitch: "${strip_pitch}"}
        - {id: snd_2, op: sound, sound: block.wood.break, anchor: caster, volume: "${break_vol}", pitch: "${break_pitch}"}
        - {id: snd_3, op: sound, sound: entity.player.attack.strong, anchor: caster, volume: 0.6, pitch: 0.9, when: "= ${strong}"}
        - {id: snd_4, op: sound, sound: entity.player.attack.crit, anchor: caster, volume: 0.8, pitch: 0.9, when: "= ${crit}"}
        - {id: spark, op: particle_def, def: "${spark}", anchor: aim_pt}
        - {id: trail, op: particle, particle: crit, anchor: {of: /windup/rig.root, to: /windup/rig.tip, samples: 6}, count: 1, extra: 0.04, at: 0, every: 1, for: 8, detach: true}
    end: {final: true}
