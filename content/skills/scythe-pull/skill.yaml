# astera/v3 hand port of the v2 skill.yaml + look.yaml (tick for tick).
apiVersion: astera/v3
kind: Skill
id: scythe-pull
item: scythe
meta: {name: {ja: "引き寄せ", en: Pull}, description: {ja: "前方の相手を手前へ引き寄せる。", en: "Drags the targets in front of you toward you."}, cooldown_ticks: 130, resource_cost: 12, tags: [melee, control]}
anchors:
  - {id: eye,   anchor: caster.eye}
  - {id: sweep, anchor: caster.eye, offset: {up: -0.1, forward: 2.0}}   # was pt_aim_0_m0p1_2
machine:
  start: cast
  states:
    cast:
      for: 1
      then: end
      do:
        - {id: snd, op: sound, sound: entity.player.attack.sweep, anchor: caster, volume: 1.0, pitch: 0.6}
        - {id: fx, op: particle_def, def: slash-sweep, anchor: sweep}
        - id: sel
          op: hit
          at: 0
          anchor: eye
          shape: {sector: {deg: 50, range: 5.0, height: 2.0, forward: look}}
          targets: enemies
          max_count: 3   # GAP(Q1): v2 cap 3; spelling of max_count (A required int|all, B optional) is open
          window: once
          ignore_invulnerability: false
          # GAP(Q4): v2 on_hit order knockback -> damage; R7 form = no `damage` on the hit, handler [knockback, damage]. Q4-B would put `damage: {physical: 14.0}` back on the hit.
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(flat(pos(caster) - pos(event.victim))) + vec(0.0, 0.2, 0.0)", strength: 1.3}
              - {id: dmg, op: damage, target: event.victim, damage: {physical: 14.0}}
    end: {final: true}
