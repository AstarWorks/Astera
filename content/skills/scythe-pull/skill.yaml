apiVersion: astera/v3
kind: Skill
id: scythe-pull
item: scythe
meta: {name: {ja: "引き寄せ", en: Pull}, description: {ja: "前方の相手を手前へ引き寄せる。", en: "Drags the targets in front of you toward you."}, cooldown_ticks: 130, resource_cost: 12, tags: [melee, control]}
anchors:
  - {id: sweep, anchor: caster, offset: {up: -0.1, forward: 2.0}}
machine:
  start: cast
  states:
    cast:
      for: 1
      then: end
      do:
        - {id: snd, op: sound, sound: entity.player.attack.sweep, anchor: caster, volume: 1.0, pitch: 0.6, at: 0}
        - {id: fx, op: particle_def, def: slash-sweep, anchor: sweep, at: 0}
        - id: sel
          op: hit
          at: 0
          anchor: caster.eye
          shape: {sector: {deg: 50, range: 5.0, height: 2.0, forward: look}}
          targets: enemies
          max_count: 3
          window: once
          ignore_invulnerability: false
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(caster) - pos(event.victim)) + vec(0.0, 0.2, 0.0)", strength: 1.3}
              - {id: dmg, op: damage, target: event.victim, damage: {physical: 14.0}}
    end: {final: true}
