# scythe-pull: wind-up 4 ticks (rule round(5 / attack_speed)), hit at tick 4. Hook: the blade reaches out, then is drawn down and back toward the caster.
apiVersion: astera/v3
kind: Skill
id: scythe-pull
item: scythe
meta: {name: {ja: "引き寄せ", en: Pull}, description: {ja: "前方の相手を手前へ引き寄せる。", en: "Drags the targets in front of you toward you."}, cooldown_ticks: 130, resource_cost: 12, tags: [melee, control]}
params:
  arc_deg:      {type: number, default: 50}
  range:        {type: blocks, default: 5.0}
  max_targets:  {type: number, default: 3}
  dmg_physical: {type: number, default: 14}
  pull:         {type: number, default: 1.3}
anchors:
  - {id: sweep, anchor: caster.eye, offset: {up: -0.1, forward: 2.0}, mode: follow}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 4
      then: strike
      do:
        - {id: snd_windup, op: sound, sound: item.armor.equip_chain, anchor: caster, volume: 0.5, pitch: 0.7}
        # weapon rig: reach out, then hook and drag back. One performance in the windup state, detached so it plays on through the strike and the tail:
        # drawn back over 3 ticks, the cut starts at tick 3 so the blade crosses the target zone at the hit (tick 4), then 6 ticks of follow-through.
        - id: rig
          op: rig
          parent: caster
          mount: caster.hand_r
          rest: [{axis: left, deg: 72}]
          detach: true
          for: 12
          swing:
            - {at: 0, for: 3, from: {left: 0.000, up: 0.507, forward: 0.862}, to: {left: 0.000, up: 0.352, forward: 0.936}, edge: leading, roll: 0, ease: out_quad}
            - {at: 3, for: 3, to: {left: 0.000, up: -0.857, forward: 0.514}, edge: leading, roll: 0, ease: out_cubic}
            - {at: 6, for: 6, to: {left: 0.156, up: -0.937, forward: -0.312}, edge: leading, roll: 0, ease: out_cubic}
    strike:
      for: 1
      then: end
      do:
        - id: sel
          op: hit
          at: 0
          anchor: caster.eye
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          max_count: "${max_targets}"
          window: once
          ignore_invulnerability: false
          on:
            hit:
              - {id: react, op: react, target: event.victim, flinch: true, for: 6}
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(caster) - pos(event.victim)) + vec(0.0, 0.2, 0.0)", strength: "${pull}"}
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg_physical}"}}
        - {id: snd, op: sound, sound: entity.player.attack.sweep, anchor: caster, volume: 1.0, pitch: 0.6, detach: true}
        - {id: fx, op: particle_def, def: slash-sweep, anchor: sweep, detach: true}
        - {id: trail, op: particle, particle: crit, anchor: {of: /windup/rig.root, to: /windup/rig.tip, samples: 6}, count: 1, extra: 0.04, at: 0, every: 1, for: 8, detach: true}
    end: {final: true}
