# scythe-pull: hook: the scythe reaches out, then drags down and back (wind-up 4 ticks, hit at tick 4).
# Frames (ADR-0314, ADR-0315), the gameplay (hit tick, shape, damage, knockback, cooldown, cast length) is unchanged:
#   arm    - the right arm, rotate keys only. Origin = the right shoulder (`caster.shoulder_r`); the arm is one rigid 0.60 bone, so the hand travels on a sphere about it and a turn of this frame is that travel (about w left/right, about s up/down). Hand path: guard -> reached out -> dragged back and down -> guard.
#   blade  - the scythe. Origin = the hand, 0.60 along the arm frame (the hand path is the arm's turn: guard -> reached out ahead -> drawn back down towards the caster -> guard). Long axis along v (grip at the origin), edge along w.
#            The reach is the hand swinging forward on the arm; the hook is a turn about s (v moves towards w): the head rakes down and back, the point leads the drag. The wind-up lifts the point a touch (-10),
#            the pull drives it down (+60, hit as the head starts to rake), `reset` eases back to guard.
#            The engine pins the right hand to the origin; the origin sits exactly on the 0.60 reach sphere of the shoulder by construction.
#   body   - the caster's feet, v forward / w up / s right: sounds and the cast fx.
#   wound  - one per victim at the victim's centre, v the way the blow came in: the hit sound and the hit spark.
#   edge   - line along the curved blade from its root (v 1.20, w -0.07: where the head leaves the shaft) to its tip (v 0.62, w -0.64: the head curls back along -w), measured from the scythe model's point table (content/frames/scythe.yaml); what the trail rows draw along, so the trail sits on the steel the model draws.
apiVersion: astera/v3
kind: Skill
id: scythe-pull
item: scythe
meta: {name: {ja: "引き寄せ", en: Pull}, description: {ja: "前方の相手を手前へ引き寄せる。", en: "Drags the targets in front of you toward you."}, cooldown_ticks: 130, resource_cost: 12, tags: [melee, control]}
params:
  arc_deg:      {type: number, default: 50}
  range:        {type: blocks, default: 5.0}
  max_targets:  {type: number, default: 3}
  dmg_physical: {type: number, default: 14}
  pull_stop:         {type: number, default: 1.5}
frames:
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: w, to: -8}   # guard
      - {at: 0, for: 3, about: w, to: -3, ease: in_out_sine}   # reach out to hook the target
      - {at: 3, for: 3, about: w, to: -13, ease: out_cubic}   # the pull: the hand drags back and down
      - {at: 6, for: 6, about: w, to: -8, ease: in_out_sine}   # back to guard
      - {at: 0, for: 0, about: s, to: -36}
      - {at: 0, for: 3, about: s, to: -14, ease: in_out_sine}
      - {at: 3, for: 3, about: s, to: -52, ease: out_cubic}
      - {at: 6, for: 6, about: s, to: -36, ease: in_out_sine}
  - id: blade
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 3, about: s, to: -10, ease: in_out_sine}  # lift the point
      - {at: 3, for: 3, about: s, to: 60, ease: out_cubic}  # the head rakes down and back
      - {at: 6, for: 6, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: wound
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
lines:
  edge: {frame: blade, from: {v: 1.20, w: -0.07}, to: {v: 0.62, w: -0.64}}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 4
      then: strike
      do:
        - {id: snd_windup, op: sound, sound: item.armor.equip_chain, frame: body, volume: 0.5, pitch: 0.7}
        # weapon rig: reach out, then hook and drag back. One performance in the windup state, detached so it plays on through the strike and the tail:
        # drawn back over 3 ticks, the cut starts at tick 3 so the blade crosses the target zone at the hit (tick 4), then 6 ticks of follow-through.
        - {id: rig, op: rig, frame: blade, for: 12, detach: true}
    strike:
      for: 1
      then: end
      do:
        - id: sel
          op: hit
          at: 0
          frame: blade
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          max_count: "${max_targets}"
          window: once
          ignore_invulnerability: false
          on:
            hit:
              - {id: react, op: react, target: event.victim, flinch: true, for: 6}
              - {id: kb, op: pull, target: event.victim, direction: "= flat(pos(caster) - pos(event.victim))", distance: "= length(flat(pos(caster) - pos(event.victim))) - ${pull_stop}"}
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg_physical}"}}
        - {id: snd, op: sound, sound: entity.player.attack.sweep, frame: body, volume: 1.0, pitch: 0.6, detach: true}
        - {id: fx, op: particle_def, def: slash-sweep, frame: body, pos: {v: 2, w: 1.52}, detach: true}
        - {id: trail, op: particle, particle: crit, along: edge, samples: 2, count: 1, extra: 0.04, at: 0, every: 1, for: 4, detach: true}
    end: {final: true}
