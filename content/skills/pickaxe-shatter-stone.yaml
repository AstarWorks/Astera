# Match arsenal (wp/match-arsenal): simple PvP skill. One cast sound, a few particles.

id: pickaxe-shatter-stone

name:
  ja: "石の粉砕"
  en: "Stone Shatter"
description:
  ja: "視線の先のブロックを球状に砕く。"
  en: "Shatters blocks in a sphere where you look."

archetype: sequence
cooldown_ticks: 240
resource_cost: 0
tags: [ tool, cover ]

params:
  type: sequence

phases:
  type: sequence
  cast:
    - type: break_area
      shape: sphere
      radius: 2
      tool_class: PICKAXE
      block_damage: 100
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/gun-impact-block
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 0.4 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 2.0, height: 0.0 }
      particle_id: hit-spark
