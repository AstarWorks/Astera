apiVersion: astera/v3
kind: Skill
id: club-bash
item: club
meta:
  name: {ja: 棍棒の殴打, en: Club Bash}
  description: {ja: "大きく吹き飛ばす一撃。", en: "A blow that knocks the target far back."}
  cooldown_ticks: 18
  resource_cost: 8
  tags: [melee, physical, control]
params:
  arc_deg:      {type: number, default: 80}
  range:        {type: blocks, default: 2.8}
  dmg_physical: {type: number, default: 24}
  knockback:    {type: number, default: 1.6}
anchors:
  - {id: fx, anchor: caster.eye, offset: {forward: 1.4}}
  - {id: heart, anchor: victim.root, offset: {up: 1.2}}
machine:
  start: cast
  states:
    cast:
      for: 1
      then: done
      do:
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 0.9, pitch: 1.1, at: 0}
        - {id: fx1, op: particle_def, def: hit-spark, anchor: fx, at: 0}
        - id: strike
          op: hit
          anchor: caster.eye
          at: 0
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(event.victim - pos(caster))", strength: "${knockback}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.2}
              - {id: spark, op: particle_def, def: hit-spark, anchor: heart}
    done: {final: true}
