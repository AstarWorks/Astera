apiVersion: astera/v3
kind: Skill
id: club-bash
item: club
meta:
  name: {ja: 棍棒の殴打, en: Club Bash}
  description: {ja: "大きく吹き飛ばす一撃。", en: "A blow that knocks the target far back."}
  cooldown_ticks: 18
  resource_cost: 8
  tags: [melee, physical, control]
params:
  arc_deg:      {type: degrees, default: 80}
  range:        {type: blocks, default: 2.8}
  dmg_physical: {type: number, default: 24}
anchors:
  - {id: fx, anchor: caster.eye, offset: {forward: 1.4}}
  - {id: enemy, anchor: victim.body, offset: {up: 1.2}}
presentation:
  timeline:
    - id: swing
      at: 0
      do:
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 0.9, pitch: 1.1}
        - {id: fx1, op: emit, effect: hit-spark, anchor: fx}
  "on":
    hit:
      - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: enemy, volume: 0.7, pitch: 1.2}
      - {id: spark, op: emit, effect: hit-spark, anchor: enemy}
machine:
  start: cast
  states:
    cast:
      for: 1
      then: done
      enter:
        # GAP: v2 sector height 2.0 -> v3 sector has no vertical limit (F8), none
        # v2 knockback 1.6 was a no-op in v1 (CONVERT-V1-NOOP); not ported, per v1 behaviour
        - id: strike
          op: hit
          anchor: caster.eye
          shape: {kind: sector, deg: "${arc_deg}", range: "${range}"}
          targets: enemies
          damage: {physical: "${dmg_physical}"}
    done: {final: true}
