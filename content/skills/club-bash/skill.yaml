# club-bash: wind-up 5 ticks (rule round(5 / attack_speed)), hit at tick 5. Diagonal bash: raised on the right, driven down across to the left.
apiVersion: astera/v3
kind: Skill
id: club-bash
item: club
meta:
  name: {ja: 棍棒の殴打, en: Club Bash}
  description: {ja: "大きく吹き飛ばす一撃。", en: "A blow that knocks the target far back."}
  cooldown_ticks: 18
  resource_cost: 8
  tags: [melee, physical, control]
params:
  arc_deg:      {type: number, default: 80}
  range:        {type: blocks, default: 2.8}
  dmg_physical: {type: number, default: 24}
  knockback:    {type: number, default: 1.6}
anchors:
  - {id: fx, anchor: caster.eye, offset: {forward: 1.4}, mode: follow}
  - {id: heart, anchor: victim.center, mode: follow}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 5
      then: strike
      do:
        - {id: snd_windup, op: sound, sound: item.armor.equip_iron, anchor: caster, volume: 0.5, pitch: 0.6}
        # weapon rig: diagonal bash. One performance in the windup state, detached so it plays on through the strike and the tail:
        # drawn back over 4 ticks, the cut starts at tick 4 so the blade crosses the target zone at the hit (tick 5), then 6 ticks of follow-through.
        - id: rig
          op: rig
          parent: caster
          mount: caster.hand_r
          rest: [{axis: left, deg: 72}]
          detach: true
          for: 13
          swing:
            - {at: 0, for: 4, from: {left: 0.000, up: 0.507, forward: 0.862}, to: {left: -0.682, up: 0.731, forward: 0.000}, edge: trailing, roll: 0, ease: out_quad}
            - {at: 4, for: 3, to: {left: 0.349, up: -0.399, forward: 0.848}, edge: leading, roll: 0, ease: out_cubic}
            - {at: 7, for: 6, to: {left: 0.652, up: -0.592, forward: 0.474}, edge: leading, roll: 0, ease: out_cubic}
    strike:
      for: 1
      then: end
      do:
        - id: strike
          op: hit
          anchor: caster.eye
          at: 0
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: react, op: react, target: event.victim, flinch: true, for: 6}
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(event.victim - pos(caster))", strength: "${knockback}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.2, detach: true}
              - {id: spark, op: particle_def, def: hit-spark, anchor: heart, detach: true}
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 0.9, pitch: 1.1, detach: true}
        - {id: fx1, op: particle_def, def: hit-spark, anchor: fx, detach: true}
        - {id: trail, use: swing-trail, with: {samples: 2, span: 5}, frames: {weapon: /windup/rig}, detach: true}
    end: {final: true}
