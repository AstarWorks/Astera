# club-bash: diagonal bash of the club, raised on the right, driven down across to the left (wind-up 5 ticks, hit at tick 5).
# Frames (ADR-0314, ADR-0315), the gameplay (hit tick, shape, damage, knockback, cooldown, cast length) is unchanged:
#   blade  - the club. Origin at the caster feet, moved along a hand path (guard -> raised high at the right -> driven down across to the left -> guard). Long axis along v (grip at the origin, tip at v 0.74), edge along w. Roll -135 about v lays the edge on
#            the diagonal, then the cut is a turn about s (v moves towards w): the edge leads. The wind-up tips the point back (-55), the cut carries it through (+85, hit
#            while the blade crosses the middle), `reset` eases back to guard.
#            The engine pins the right hand to the origin, so every `move:` point lies inside the 0.60 reach of the right shoulder (v 0 / w 1.29 / s 0.29).
#   body   - the caster's feet, v forward / w up / s right: sounds and the cast fx.
#   wound  - one per victim at the victim's centre, v the way the blow came in: the hit sound and the hit spark.
#   edge   - line along the blade from part-way to the tip (v 0.33 .. 0.74), what the trail rows draw along.
apiVersion: astera/v3
kind: Skill
id: club-bash
item: club
meta:
  name: {ja: 棍棒の殴打, en: Club Bash}
  description: {ja: "大きく吹き飛ばす一撃。", en: "A blow that knocks the target far back."}
  cooldown_ticks: 18
  resource_cost: 8
  tags: [melee, physical, control]
params:
  arc_deg:      {type: number, default: 80}
  range:        {type: blocks, default: 2.8}
  dmg_physical: {type: number, default: 24}
  knockback:    {type: number, default: 1.6}
frames:
  - id: blade
    origin: caster
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: 0.48, w: 0.94, s: 0.36}}  # guard
      - {at: 0, for: 1, to: {v: 0.48, w: 0.96, s: 0.45}}
      - {at: 1, for: 1, to: {v: 0.41, w: 1.04, s: 0.65}}
      - {at: 2, for: 1, to: {v: 0.2, w: 1.41, s: 0.84}}
      - {at: 3, for: 1, to: {v: 0.1, w: 1.56, s: 0.82}}
      - {at: 4, for: 1, to: {v: 0.44, w: 0.9, s: 0.16}}
      - {at: 5, for: 1, to: {v: 0.41, w: 0.9, s: 0.09}}
      - {at: 6, for: 1, to: {v: 0.42, w: 0.91, s: 0.09}}
      - {at: 8, for: 1, to: {v: 0.43, w: 0.9, s: 0.14}}
      - {at: 9, for: 1, to: {v: 0.45, w: 0.9, s: 0.21}}
      - {at: 10, for: 1, to: {v: 0.47, w: 0.92, s: 0.3}}
      - {at: 11, for: 1, to: {v: 0.47, w: 0.92, s: 0.34}}
      - {at: 12, for: 1, to: {v: 0.48, w: 0.94, s: 0.36}}
    rotate:
      - {at: 0, for: 0, about: v, to: -135}  # roll the edge into the cut plane
      - {at: 0, for: 4, about: s, to: -55, ease: in_out_sine}  # wind-up turn
      - {at: 4, for: 3, about: s, to: 85, ease: out_cubic}  # the cut, edge first
      - {at: 7, for: 6, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: wound
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
lines:
  edge: {frame: blade, from: {v: 0.33}, to: {v: 0.74}}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 5
      then: strike
      do:
        - {id: snd_windup, op: sound, sound: item.armor.equip_iron, frame: body, volume: 0.5, pitch: 0.6}
        # weapon rig: diagonal bash. One performance in the windup state, detached so it plays on through the strike and the tail:
        # drawn back over 4 ticks, the cut starts at tick 4 so the blade crosses the target zone at the hit (tick 5), then 6 ticks of follow-through.
        - {id: rig, op: rig, frame: blade, for: 13, detach: true}
    strike:
      for: 1
      then: end
      do:
        - id: strike
          op: hit
          frame: blade
          at: 0
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: react, op: react, target: event.victim, flinch: true, for: 6}
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(event.victim - pos(caster))", strength: "${knockback}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", frame: wound, volume: 0.7, pitch: 1.2, detach: true}
              - {id: spark, op: particle_def, def: hit-spark, frame: wound, pos: {w: 0.2}, detach: true}
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", frame: body, volume: 0.9, pitch: 1.1, detach: true}
        - {id: fx1, op: particle_def, def: hit-spark, frame: body, pos: {v: 1.4, w: 1.62}, detach: true}
        - {id: trail, op: particle, particle: crit, along: edge, samples: 2, count: 1, extra: 0.04, at: 0, every: 1, for: 2, detach: true}
    end: {final: true}
