# astera/v3 hand port of the v2 skill.yaml + look.yaml (tick for tick).
apiVersion: astera/v3
kind: Skill
id: shovel-excavate-diamond
item: diamond-shovel
meta: {name: {ja: "ダイヤの掘削", en: "Diamond Excavate"}, description: {ja: "目の前の柔らかいブロックを箱形にえぐる。", en: "Digs out a box of soft blocks in front of you."}, cooldown_ticks: 80, resource_cost: 0, tags: [tool, cover]}
anchors:
  - {id: aim,    anchor: caster.eye}                              # the v2 `aim` frame, origin of break_area
  - {id: spark,  anchor: caster.eye, offset: {forward: 2.0}}      # was pt_aim_0_0_2
machine:
  start: cast
  states:
    cast:
      for: 1
      then: end
      do:
        # GAP: op break_area has no v3 spelling in ADR-0303 -> none; v2 fields carried verbatim, v2 `at: aim` (a frame) is written `anchor: aim`
        - {id: dig, op: break_area, at: 0, shape: box, radius: 2.0, length: 5, width: 5, height: 4, tool_class: SHOVEL, block_damage: 250, power: 3, anchor: aim}
        - {id: snd, op: sound, sound: "astera:weapons/gun-impact-block", anchor: caster, volume: 1.0, pitch: 0.7}
        - {id: fx, op: particle_def, def: hit-spark, anchor: spark}
    end: {final: true}
