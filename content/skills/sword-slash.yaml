# WP3: melee archetype reference skill — a sword left-click slash.
#
# Hits every player / mob inside a forward cone (range blocks, arc_degrees
# full apex angle) measured from the caster's eye along their look direction.
# Damage goes through the normal pipeline (armor, crit, friendly fire); the
# item's vanilla melee damage is cancelled by the combat plugin so it never
# double-applies (ADR-0149). WP1 binds the sword's left_click to this id.

# V-2a visuals. Per-cast particle budget: swing arcs 11x2 + 3 = 25, hit 16 per target.
id: sword-slash

name:
  ja: "斬撃"
  en: "Sword Slash"
description:
  ja: "前方の扇状の範囲を斬りつけ、命中した対象に物理ダメージを与える。"
  en: "Slashes a forward arc, dealing physical damage to everything it catches."

archetype: melee
cooldown_ticks: 10
tags: [ melee, physical ]

params:
  type: melee
  range: 3.5
  arc_degrees: 100.0
  knockback: 0.4
  damage:
    - base: { type: literal, value: 8.0 }
      attribute: physical

phases:
  type: melee
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.sweep
    # swing: right -> left across the 100 degree hit cone, radius ~80% of range
    - type: schedule_particle_animation
      targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 1.1, z: 0.0 } } }
      animation:
        - type: arc
          radius: 2.8
          start_degrees: 50.0
          end_degrees: -50.0
          points: 11
          sweep_ticks: 3
          height_start: 0.3
          height_end: -0.2
          particles: [ { id: end_rod }, { id: electric_spark } ]
        - type: arc
          radius: 2.4
          start_degrees: 50.0
          end_degrees: -50.0
          points: 3
          sweep_ticks: 3
          height_start: 0.3
          height_end: -0.2
          particles: [ { id: sweep_attack } ]
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: entity.player.attack.strong
    - type: schedule_particle_animation
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      animation:
        - type: point
          particles:
            - { id: crit, count: 10, extra: 0.35 }
            - { id: electric_spark, count: 6, extra: 0.3 }
  miss:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.nodamage
