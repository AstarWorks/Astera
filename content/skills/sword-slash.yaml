# WP3: melee archetype reference skill — a sword left-click slash.
#
# Hits every player / mob inside a forward cone (range blocks, arc_degrees
# full apex angle) measured from the caster's eye along their look direction.
# Damage goes through the normal pipeline (armor, crit, friendly fire); the
# item's vanilla melee damage is cancelled by the combat plugin so it never
# double-applies (ADR-0149). WP1 binds the sword's left_click to this id.

id: sword-slash

name:
  ja: "斬撃"
  en: "Sword Slash"
description:
  ja: "前方の扇状の範囲を斬りつけ、命中した対象に物理ダメージを与える。"
  en: "Slashes a forward arc, dealing physical damage to everything it catches."

archetype: melee
cooldown_ticks: 10
tags: [ melee, physical ]

params:
  type: melee
  range: 3.5
  arc_degrees: 100.0
  knockback: 0.4
  damage:
    - base: { type: literal, value: 40.0 }
      attribute: physical

phases:
  type: melee
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/sword-swing
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.6, height: -0.3 }
      particle_id: slash-sweep
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/blade-hit
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
  miss:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/blade-miss
