# Sigil Rifle S3 (sneak + right-click) "Sigil Detonation": the caster plants for 44 ticks while a floor
# sigil, horn flames and a hair-thin laser sight telegraph the lane (the aim is locked at cast time).
# Tick 44 a thick beam pierces up to 34 blocks: 6 phys, +2 Sinking stacks, the struck are held 6 ticks.
# Tick 46 stacked sigil discs build on every pierced target; tick 66 (20 ticks later, i-frame safe) they
# detonate: 8 phys + 1.5 per Sinking stack, consuming them all. Anyone who leaves the lane in the 20-tick
# window escapes the pop. 14 + 1.5/stack with no prior marks ~20; the point is scaling with S1/S2 stacks.
# Cooldown 300; the caster is held for 12 more ticks after the pop.

id: sigil-rifle-s3

name:
  ja: "刻印連鎖爆破"
  en: "Sigil Detonation"
description:
  ja: "足を止めて照準を固定し、刻印のレンズから貫通ビームを放つ。貫かれた敵に刻印が積み重なり、連鎖して炸裂する。沈降が多いほど痛い。"
  en: "Plant, lock the aim and fire a piercing beam through the sigil lens. Everything pierced is stacked with sigils that detonate in a chain; more Sinking, more damage."

archetype: aoe
cooldown_ticks: 300
resource_cost: 60              # energy
tags: [ ranged, aoe, physical, finisher, sinking ]

params:
  type: aoe
  radius: 0.5
  falloff: linear
  damage:
    - base: { type: literal, value: 0.0 }
      attribute: physical

phases:
  type: aoe
  cast:
    # -- telegraph (0-44): rooted, floor sigil + laser sight both lock to the cast-time aim --
    - type: play_vfx
      targets: { type: caster }
      vfx_id: sigil-rifle-charge
    - type: play_vfx
      targets: { type: caster }
      vfx_id: sigil-rifle-beam
    - type: hit_stop
      targets: { type: caster }
      ticks: 44
    - type: play_sound
      targets: { type: caster }
      sound_id: block.beacon.charge
      pitch: { type: literal, value: 1.4 }
    - type: play_sound
      targets: { type: caster }
      sound_id: block.beacon.ambient
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.6 }
      delay_ticks: { type: literal, value: 20 }
    # -- the beam (44) --
    - type: damage
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 5.0 }, distance: { type: literal, value: 34.0 } }
      ignore_invulnerability: { type: literal, value: true }
      delay_ticks: { type: literal, value: 44 }
      components:
        - base: { type: literal, value: 6.0 }
          attribute: physical
    - type: apply_status
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 5.0 }, distance: { type: literal, value: 34.0 } }
      status_id: sinking
      effect_duration_ticks: { type: literal, value: 200 }
      stack_count: { type: literal, value: 2 }
      delay_ticks: { type: literal, value: 44 }
    - type: hit_stop
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 5.0 }, distance: { type: literal, value: 34.0 } }
      ticks: 6
      delay_ticks: { type: literal, value: 44 }
    - type: camera_shake
      targets: { type: caster }
      intensity: { type: literal, value: 0.6 }
      ticks: { type: literal, value: 6 }
      delay_ticks: { type: literal, value: 44 }
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.firework_rocket.blast
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 0.5 }
      delay_ticks: { type: literal, value: 44 }
    - type: play_sound
      targets: { type: caster }
      sound_id: item.crossbow.shoot
      pitch: { type: literal, value: 0.5 }
      delay_ticks: { type: literal, value: 44 }
    # -- sigils stack on every pierced target (46) --
    - type: play_vfx
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 5.0 }, distance: { type: literal, value: 34.0 } }
      vfx_id: sigil-rifle-detonate
      delay_ticks: { type: literal, value: 46 }
    # -- detonation (66) --
    - type: damage
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 5.0 }, distance: { type: literal, value: 34.0 } }
      ignore_invulnerability: { type: literal, value: true }
      delay_ticks: { type: literal, value: 66 }
      components:
        - base: { type: literal, value: 8.0 }
          attribute: physical
          per_stack: { status_id: sinking, amount: 1.5, on: target, consume: true }
    - type: hit_stop
      targets: { type: caster }
      ticks: 12
      delay_ticks: { type: literal, value: 66 }
    - type: camera_shake
      targets: { type: caster }
      intensity: { type: literal, value: 0.7 }
      ticks: { type: literal, value: 8 }
      delay_ticks: { type: literal, value: 66 }
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.generic.explode
      volume: { type: literal, value: 0.9 }
      pitch: { type: literal, value: 1.2 }
      delay_ticks: { type: literal, value: 66 }
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.firework_rocket.twinkle
      volume: { type: literal, value: 0.9 }
      pitch: { type: literal, value: 1.4 }
      delay_ticks: { type: literal, value: 68 }
  hit_entity: []
  expire: []
