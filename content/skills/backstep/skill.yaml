apiVersion: astera/v3
kind: Skill
id: backstep
item: rifle        # also bound to items: shotgun
meta:
  name: {ja: バックステップ, en: Backstep}
  description: {ja: "後方へ跳び退き、短時間だけ素早く動ける。", en: "Hops backwards and sprints briefly to break contact."}
  cooldown_ticks: 120
  resource_cost: 0
  tags: [gun, movement, mobility]
params:
  evasive_ticks: {type: ticks, default: 25, expose: duration}
  propel:   {type: number, default: -1.1}
  propel_2: {type: number, default: 0.35}
anchors:
  - {id: feet, anchor: caster, offset: {up: 0.2}}
presentation:
  timeline:
    - id: hop
      at: 0
      do:
        - {id: snd, op: sound, sound: "astera:weapons/dash-whoosh", anchor: caster, volume: 1.0, pitch: 1.0}
        - {id: cloud, op: emit, effect: dash-cloud, anchor: feet}
machine:
  start: cast
  states:
    cast:
      for: 1
      then: done
      enter:
        - {id: evade, op: status, target: caster, status: evasive, stacks: 1, for: "${evasive_ticks}"}
        # GAP: v2 op propel (direction axis(caster,"forward"), strength -1.1) -> closest v3 is impulse with a world-axis vector; kept verbatim
        - {id: back, op: propel, direction: "= axis(caster, \"forward\")", strength: "${propel}"}
        # GAP: v2 op propel (direction vec(0,1,0), strength 0.35) -> closest v3 is impulse {vector: [0, 0.35, 0]}; kept verbatim
        - {id: hop, op: propel, direction: "= vec(0, 1, 0)", strength: "${propel_2}"}
    done: {final: true}
