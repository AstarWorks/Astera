apiVersion: astera/v3
kind: Skill
id: heal-potion-use
item: heal-potion
meta:
  name: {ja: "回復薬", en: "Healing Draught"}
  description: {ja: "使い切りで体力を 40 回復する。", en: "Single use; restores 40 HP."}
  cooldown_ticks: 100
  resource_cost: 0
  tags: [support, heal, consumable]
params:
  heal: {type: number, default: 40.0}
anchors:
  - {id: body, anchor: caster, offset: {up: 1.0}, mode: follow}   # was pt_caster_0_1_0
machine:
  start: use
  states:
    use:
      for: 1
      then: end
      do:
        - {id: consume, op: consume_item, at: 0, target: caster, item: heal-potion, count: 1}
        - {id: heal, op: heal, at: 0, target: caster, amount: "${heal}"}
        - {id: snd_drink, op: sound, at: 0, sound: entity.generic.drink, anchor: caster, volume: 1.0, pitch: 1.0}
        - {id: snd_chime, op: sound, at: 0, sound: block.amethyst_block.chime, anchor: caster, volume: 0.7, pitch: 1.3}
        - {id: fx_heal, op: particle_def, at: 0, def: verdant-heal, anchor: body}
    end: {final: true}
