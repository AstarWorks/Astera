# Heal potion, in the frame grammar (ADR-0314): single use. Consumes one item and restores HP in the same tick. Gameplay (40 HP, cooldown 100) unchanged.
# One frame, `feet`: the caster's feet, v forward / w up / s right (it follows the caster). The drink and chime are points of it and the heal
# glow sits 1.0 above it, at the chest.
apiVersion: astera/v3
kind: Skill
id: heal-potion-use
item: heal-potion
meta:
  name: {ja: "回復薬", en: "Healing Draught"}
  description: {ja: "使い切りで体力を 40 回復する。", en: "Single use; restores 40 HP."}
  cooldown_ticks: 100
  resource_cost: 0
  tags: [support, heal, consumable]
params:
  heal: {type: number, default: 40.0}
frames:
  - id: feet
    origin: caster
    v: forward
    w: up
    s: v x w
machine:
  start: use
  states:
    use:
      for: 1
      then: end
      do:
        - {id: consume, op: consume_item, at: 0, target: caster, item: heal-potion, count: 1}
        - {id: heal, op: heal, at: 0, target: caster, amount: "${heal}"}
        - {id: drink, op: sound, at: 0, sound: entity.generic.drink, frame: feet, volume: 1.0, pitch: 1.0}
        - {id: chime, op: sound, at: 0, sound: block.amethyst_block.chime, frame: feet, volume: 0.7, pitch: 1.3}
        - {id: glow, op: particle_def, at: 0, def: verdant-heal, frame: feet, pos: {w: 1.0}}
    end: {final: true}
