# astera/v3 hand port of the v2 skill.yaml + look.yaml (tick for tick).
apiVersion: astera/v3
kind: Skill
id: shortbow-snare
item: shortbow
meta: {name: {ja: "足止めの矢", en: "Snare Arrow"}, description: {ja: "当たった相手の足を鈍らせる。", en: "Slows whoever it hits."}, cooldown_ticks: 120, resource_cost: 8, tags: [ranged, physical, control]}
anchors:
  - {id: muzzle,  anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}   # projectile origin
  - {id: cast_fx, anchor: caster, offset: {up: -0.25, forward: 0.9}, mode: follow}        # was pt_caster_0_m0p25_0p9 (feet, yaw-only)
  - {id: heart,   anchor: victim.root, offset: {up: 1.2}, mode: follow}   # was pt_enemy_0_1p2_0 (victim feet, yaw-only)
machine:
  start: fly
  states:
    fly:
      for: 40
      then: end
      on:
        - {event: arrow.end, to: end}
      do:
        - {id: snd, op: sound, sound: "astera:weapons/sword-swing", anchor: caster, volume: 0.7, pitch: 0.9}
        - {id: fx, op: particle_def, def: gun-muzzle-smoke, anchor: cast_fx}
        - id: arrow
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * 2.6"
          for: 40
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {physical: 7.0}}
              - {id: st_sink, op: status, target: event.victim, status: sinking, stacks: 1, for: 80}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: victim, volume: 0.7, pitch: 1.0}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
            block:
              - {id: snd_block, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact.point, volume: 0.5, pitch: 1.5}
              - {id: fx_block, op: particle_def, def: hit-spark, anchor: contact.point}
        - {id: trail_crit, op: particle, particle: crit, count: 1, offset: [0.04, 0.04, 0.04], anchor: {of: arrow, sweep: 0.4}, every: 1, until: arrow.end}
        - {id: trail_dust, op: particle, particle: dust, count: 1, color: "#787878", size: 0.9, anchor: {of: arrow, sweep: 0.4}, every: 1, until: arrow.end}
    end: {final: true}
