# shortbow-snare: a straight arrow that slows (sinking) whoever it hits. Rewritten from zero on the rev4.10 grammar (ADR-0303):
# a visible item display riding the projectile body, the impact as one skill-local fragment, the trail as one rider group.
# Straight flight on purpose (no gravity): the hit tick is balance. Randomness: none. Visuals need a founder look on skill-compare.
apiVersion: astera/v3
kind: Skill
id: shortbow-snare
item: shortbow
meta: {name: {ja: "足止めの矢", en: "Snare Arrow"}, description: {ja: "当たった相手の足を鈍らせる。", en: "Slows whoever it hits."}, cooldown_ticks: 120, resource_cost: 8, tags: [ranged, physical, control]}
params:
  launch_speed: {type: number, default: 2.6}
  dmg_physical: {type: number, default: 7}
  sink_ticks: {type: ticks, default: 80}
  max_lifetime_ticks: {type: ticks, default: 40}
anchors:
  - {id: muzzle,  anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: cast_fx, anchor: caster.eye, offset: {up: -0.25, forward: 1.8}, mode: snapshot}
  - {id: heart,   anchor: victim.root, offset: {up: 1.2}, mode: follow}
machine:
  start: fly
  tail: 14
  states:
    fly:
      for: 40      # = max_lifetime_ticks (a state `for` cannot read a param yet)
      then: end
      on:
        - {event: arrow.end, to: end}
      do:
        - {id: draw, op: body, target: caster, anim: bow-draw, speed: 1.0, at: 0, for: 14, detach: true}
        - {id: fire_fx, use: gun-muzzle, with: {snd: "astera:weapons/sword-swing", vol: 0.7, pitch: 0.9, flash: false}, frames: {muzzle: cast_fx}}
        - id: arrow
          op: projectile
          at: 0
          origin: muzzle
          velocity: "= look(caster) * ${launch_speed}"
          for: "${max_lifetime_ticks}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg_physical}"}}
              - {id: st_sink, op: status, target: event.victim, status: sinking, stacks: 1, for: "${sink_ticks}"}
              - {id: hit_fx, use: strike-impact, with: {snd: "astera:weapons/blade-hit", color: "#787878", pitch: 1.0, size: 0.9}, frames: {spot: heart}, detach: true}
            block:
              - {id: block_snd, op: sound, at: 0, sound: "astera:weapons/gun-impact-block", anchor: contact.point, volume: 0.5, pitch: 1.5, detach: true}
              - {id: block_fx, op: particle_def, at: 0, def: hit-spark, anchor: contact.point, detach: true}
        - {id: shaft, use: projectile-body, with: {item: "minecraft:spectral_arrow", scale: 0.9, color: "#787878", size: 0.9}, frames: {body: arrow}, events: {body_end: arrow.end}}
    end: {final: true}
