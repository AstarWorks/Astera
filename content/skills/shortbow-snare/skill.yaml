# shortbow-snare: a straight arrow that slows (sinking) whoever it hits, in the frame grammar (ADR-0314, ADR-0315). `bow` is rooted in the caster's right hand (the bow arm of the `bow-draw` pose, v = aim, s = right,
# w = s x v), so the arrow leaves the nock 0.30 ahead of the hand along the aim, where the string is drawn, not the head. The hand pose stays the body clip
# (a bow has no 3D model to rig). Cast sound at the hand; the arrow display and its wake ride the body (part projectile-body); `hit` one per victim at
# its centre, `blk` one per block contact, v the way the arrow came in; the sparks sit at v -0.2 of them.
# Straight flight on purpose (no gravity): the hit tick is balance. Randomness: none.
apiVersion: astera/v3
kind: Skill
id: shortbow-snare
item: shortbow
meta: {name: {ja: "足止めの矢", en: "Snare Arrow"}, description: {ja: "当たった相手の足を鈍らせる。", en: "Slows whoever it hits."}, cooldown_ticks: 120, resource_cost: 8, tags: [ranged, physical, control]}
params:
  launch_speed: {type: number, default: 2.6}
  dmg_physical: {type: number, default: 7}
  sink_ticks: {type: ticks, default: 80}
  max_lifetime_ticks: {type: ticks, default: 40}
frames:
  - id: bow
    origin: caster.hand_r
    v: aim
    w: s x v
    s: right
  - id: hit
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
  - id: blk
    on: event.block
    each: true
    origin: contact
    v: incoming
    w: up
    s: v x w
machine:
  start: fly
  tail: 14
  states:
    fly:
      for: 40      # = max_lifetime_ticks (a state `for` cannot read a param yet)
      then: end
      on:
        - {event: arrow.end, to: end}
      do:
        - {id: draw, op: body, target: caster, anim: bow-draw, speed: 1.0, at: 0, for: 14, detach: true}
        - {id: snd, op: sound, at: 0, sound: "astera:weapons/sword-swing", frame: bow, volume: 0.7, pitch: 0.9}
        - id: arrow
          op: projectile
          at: 0
          frame: bow
          pos: {v: 0.30}
          velocity: "= look(caster) * ${launch_speed}"
          for: "${max_lifetime_ticks}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg_physical}"}}
              - {id: st_sink, op: status, target: event.victim, status: sinking, stacks: 1, for: "${sink_ticks}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", frame: hit, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, frame: hit, pos: {v: -0.2}, detach: true}
            block:
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", frame: blk, volume: 0.5, pitch: 1.5, detach: true}
              - {id: fx_blk, op: particle_def, def: hit-spark, frame: blk, pos: {v: -0.2}, detach: true}
        - {id: shaft, use: projectile-body, with: {item: "minecraft:spectral_arrow", scale: 0.9, color: "#787878", size: 0.9}, frames: {body: arrow}, events: {body_end: arrow.end}}
    end: {final: true}
