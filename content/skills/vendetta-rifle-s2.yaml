# Persona weapon: Vendetta Bayonet. S2 right-click -- Rack Volley. Costs 2 rounds.
#
#   t0   ghost rifle rack unfolds behind the caster (8 crossbow projections, one tick apart)
#   t8   recoil hop backwards + the volley starts: 8 beams, 2 ticks apart, converging ~10 blocks ahead
#   t10  beam 1 lands. Every beam is its own 1.0 hit (ignore_invulnerability) and leaves a hit mark; beams 1/3/5/7 add a tremor stack.
#   t24  beam 8 (the closing 2.0 hit): knockback, short hit-stop, camera punch. 9 damage in total.
# Targets are the narrow cone the beams converge on (16 degrees, 14 blocks) taken from the cast pose.

id: vendetta-rifle-s2

name:
  ja: "銃架の斉射"
  en: "Rack Volley"
description:
  ja: "背後に幻の銃架を展開し、八条の光線を一点へ撃ち込んで後方へ跳ぶ。弾を2発消費する。"
  en: "Unfolds a ghost rifle rack, hops back and fires eight converging beams. Costs 2 rounds."

archetype: buff
cooldown_ticks: 70
resource_cost: 2               # two rounds of the six
tags: [ persona, gun, ranged, tremor, mobility ]

params:
  type: buff
  status_effect_id: evasive    # the sprint after the hop
  duration_ticks: 24

phases:
  type: buff
  cast:
    # t0 -- the rack unfolds (readable telegraph: 8 barrels rising behind the caster)
    - type: play_vfx
      targets: { type: caster }
      vfx_id: vendetta-rack
    - type: play_sound
      targets: { type: caster }
      sound_id: item.crossbow.loading_end
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 0.7 }
    - type: play_sound
      targets: { type: caster }
      sound_id: block.iron_door.open
      volume: { type: literal, value: 0.6 }
      pitch: { type: literal, value: 0.6 }
      delay_ticks: { type: literal, value: 3 }
    # t8 -- recoil hop + volley
    - type: propel
      targets: { type: caster }
      direction: { type: from_caster }
      strength: { type: literal, value: -0.9 }
      delay_ticks: { type: literal, value: 8 }
    - type: propel
      targets: { type: caster }
      direction: { type: up }
      strength: { type: literal, value: 0.25 }
      delay_ticks: { type: literal, value: 8 }
    - type: play_vfx
      targets: { type: caster }
      vfx_id: vendetta-beam-volley
      delay_ticks: { type: literal, value: 8 }
    - type: loop
      count: { type: literal, value: 8 }
      stride_ticks: { type: literal, value: 2 }
      delay_ticks: { type: literal, value: 8 }
      mechanics:
        - type: play_sound
          targets: { type: caster }
          sound_id: item.crossbow.shoot
          volume: { type: literal, value: 0.55 }
          pitch: { type: literal, value: 1.3 }
        - type: spawn_particle
          targets: { type: caster_forward, distance: 1.2, height: -0.2 }
          particle_id: gun-muzzle-flash
        - type: play_vfx
          targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 16.0 }, distance: { type: literal, value: 14.0 } }
          vfx_id: vendetta-hit-spark
          delay_ticks: { type: literal, value: 2 }
        - type: play_sound
          targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 16.0 }, distance: { type: literal, value: 14.0 } }
          sound_id: entity.player.attack.crit
          volume: { type: literal, value: 0.5 }
          pitch: { type: literal, value: 1.6 }
          delay_ticks: { type: literal, value: 2 }
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.generic.explode
      volume: { type: literal, value: 0.45 }
      pitch: { type: literal, value: 1.8 }
      delay_ticks: { type: literal, value: 8 }
    # t10 -- beam 1: the damage packet
    - type: loop
      count: { type: literal, value: 8 }
      stride_ticks: { type: literal, value: 2 }
      delay_ticks: { type: literal, value: 10 }
      mechanics:
        - type: damage
          targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 16.0 }, distance: { type: literal, value: 14.0 } }
          ignore_invulnerability: { type: literal, value: true }
          components:
            - base: { type: literal, value: 1.0 }
              attribute: physical
    - type: damage
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 16.0 }, distance: { type: literal, value: 14.0 } }
      ignore_invulnerability: { type: literal, value: true }
      components:
        - base: { type: literal, value: 1.0 }
          attribute: physical
      delay_ticks: { type: literal, value: 24 }
    # tremor on beams 1, 3, 5, 7 (t10, 14, 18, 22)
    - type: loop
      count: { type: literal, value: 4 }
      stride_ticks: { type: literal, value: 4 }
      delay_ticks: { type: literal, value: 10 }
      mechanics:
        - type: apply_status
          targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 16.0 }, distance: { type: literal, value: 14.0 } }
          status_id: tremor
          effect_duration_ticks: { type: literal, value: 200 }
    # t24 -- beam 8: closing punch
    - type: hit_stop
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 16.0 }, distance: { type: literal, value: 14.0 } }
      ticks: 3
      delay_ticks: { type: literal, value: 24 }
    - type: knockback
      targets: { type: cone, from: { type: caster }, direction: { type: away_from_caster, vertical: 0.15 }, angle_degrees: { type: literal, value: 16.0 }, distance: { type: literal, value: 14.0 } }
      direction: { type: away_from_caster, vertical: 0.15 }
      strength: { type: literal, value: 0.5 }
      delay_ticks: { type: literal, value: 24 }
    - type: camera_shake
      targets: { type: caster }
      intensity: { type: literal, value: 0.3 }
      ticks: { type: literal, value: 4 }
      delay_ticks: { type: literal, value: 24 }
  expire: []
  removed: []
