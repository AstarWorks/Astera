# Hand-authored tool presentation. Mechanical shape / timing / damage / cooldown stay unchanged.
# Dust uses typical tool material; no per-cell surface data is exposed to presentation rows.
apiVersion: astera/v3
kind: Skill
id: pickaxe-shatter-stone
item: stone-pickaxe
meta:
  name: {ja: "石の粉砕", en: "Stone Shatter"}
  description: {ja: "視線の先のブロックを球状に砕く。", en: "Shatters blocks in a sphere where you look."}
  cooldown_ticks: 240
  resource_cost: 0
  tags: [tool, cover]
params:
  radius: {type: number, default: 2}
  ahead: {type: number, default: 6.0}
  trail_span: {type: number, default: 6}
  chips: {type: number, default: 3}
  core_color: {type: string, default: "#777777"}
  core_size: {type: number, default: 0.3}
  bright: {type: bool, default: false}
  ring_color: {type: string, default: "#555555"}
frames:
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: w, to: 0}
      - {at: 0, for: 3, about: w, to: -90, ease: out_cubic}
      - {at: 3, for: 3, about: w, to: 0, ease: out_cubic}
      - {at: 0, for: 0, about: s, to: -30}
      - {at: 0, for: 3, about: s, to: 80, ease: out_quad}
      - {at: 3, for: 3, about: s, to: -5, ease: out_cubic}
      - {at: 6, for: 3, about: s, to: -25, ease: out_cubic}
      - {at: 9, for: 3, about: s, to: -30, ease: in_out_sine}
  - id: tool
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 3, about: s, to: 110, ease: out_quad}
      - {at: 3, for: 3, about: s, to: -30, ease: out_cubic}
      - {at: 6, for: 3, about: s, to: -55, ease: out_cubic}
      - {at: 9, for: 3, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
lines:
  edge: {frame: tool, from: {v: 0.5}, to: {v: 0.9}}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 4
      then: cast
      do:
        - {id: rig, op: rig, frame: tool, for: 12, detach: true}
        # First blade sample precedes impact; remaining samples belong to cast.
        - {id: trail, op: particle, particle: dust, along: edge, samples: 5, count: 1, color: "#999999", size: 0.35, extra: 0, at: 3}
    cast:
      for: 1
      then: end
      do:
        - {id: break, op: break_area, block_family: stone, anchor: {of: caster.eye, offset: {forward: "= dist(pos(caster.eye), aim_point(caster, ${ahead}))"}}, shape: {sphere: {radius: "${radius}"}}, tool: pickaxe, block_damage: 100, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, sound: block.stone.break, frame: body, volume: 1.0, pitch: 1.0}
        - {id: crater, op: particle, particle: block, block: minecraft:deepslate, anchor: {of: caster.eye, offset: {forward: "= dist(pos(caster.eye), aim_point(caster, ${ahead}))"}}, count: 32, offset: [0.2, 0.05, 0.2], extra: 0.22, at: 0}
        - {id: crater_core, op: particle, particle: electric_spark, anchor: {of: caster.eye, offset: {forward: "= dist(pos(caster.eye), aim_point(caster, ${ahead}))"}}, count: 2, offset: [0.06, 0.03, 0.06], extra: 0.02}
        - {id: crater_ore, op: particle, particle: dust, anchor: {of: caster.eye, offset: {forward: "= dist(pos(caster.eye), aim_point(caster, ${ahead}))"}}, count: "${chips}", color: "${core_color}", size: "${core_size}", extra: 0}
        - {id: crater_cyan, op: particle, particle: dust, anchor: {of: caster.eye, offset: {forward: "= dist(pos(caster.eye), aim_point(caster, ${ahead}))"}}, count: 4, color: "#64f5ef", size: "${core_size}", extra: 0, when: "= ${bright}"}
        - {id: trail, op: particle, particle: dust, along: edge, samples: 5, count: 1, color: "#999999", size: 0.35, extra: 0, at: 1, every: 2, for: "= ${trail_span} - 2", detach: true}
        - {"id": "contact_chips", "op": "particle", "frame": "body", "pos": {"v": 5.65, "w": 1.0}, "at": 0, "detach": true, "particle": "block", "block": "minecraft:deepslate", "count": "= 18 + 9 * ${chips}", "offset": [0.18, 0.18, 0.18], "extra": 0.13}
        - {"id": "contact_core", "op": "particle", "frame": "body", "pos": {"v": 5.65, "w": 1.0}, "at": 0, "detach": true, "particle": "dust", "count": "= 12 + 4 * ${chips}", "offset": [0.2, 0.2, 0.2], "color": "${core_color}", "size": "= 0.6 + 2 * ${core_size}", "extra": 0}
        - {"id": "contact_sparks", "op": "particle", "frame": "body", "pos": {"v": 5.65, "w": 1.0}, "at": 0, "detach": true, "particle": "electric_spark", "count": "= 20 + 6 * ${chips}", "offset": [0.22, 0.22, 0.22], "extra": 0.18}
        - {"id": "ground_eruption", "op": "particle", "particle": "block", "block": "minecraft:stone", "times": "= 24 + 8 * ${chips}", "count": 0, "offset": {"forward": "= 0.8 * cos(i * 2 * pi / (24 + 8 * ${chips}))", "up": 0.9, "left": "= 0.8 * sin(i * 2 * pi / (24 + 8 * ${chips}))"}, "extra": "= 0.36 + 0.02 * ${chips}", "anchor": {"of": "caster", "offset": {"forward": "= 6 + 0.5 * cos(i * 2 * pi / (24 + 8 * ${chips}))", "up": 0.04, "left": "= 0.5 * sin(i * 2 * pi / (24 + 8 * ${chips}))"}}}
        - {"id": "ground_core", "op": "particle", "particle": "block", "block": "minecraft:deepslate", "frame": "body", "pos": {"v": 6, "w": 0.08}, "count": "= 32 + 12 * ${chips}", "offset": [0.35, 0.06, 0.35], "extra": 0.28}
        - {"id": "ground_ring", "op": "particle", "particle": "dust", "frame": "body", "times": "= 64 + 16 * ${chips}", "pos": {"v": "= 6 + ${radius} * cos(i * 2 * pi / (64 + 16 * ${chips}))", "w": 0.05, "s": "= ${radius} * sin(i * 2 * pi / (64 + 16 * ${chips}))"}, "count": 1, "color": "${ring_color}", "size": "= 0.4 + ${core_size}", "extra": 0, "at": 0, "detach": true}
        - {"id": "ground_ring_beat_2", "op": "particle", "particle": "dust", "frame": "body", "times": "= 64 + 16 * ${chips}", "pos": {"v": "= 6 + ${radius} * cos(i * 2 * pi / (64 + 16 * ${chips}))", "w": 0.05, "s": "= ${radius} * sin(i * 2 * pi / (64 + 16 * ${chips}))"}, "count": 1, "color": "${ring_color}", "size": "= 0.4 + ${core_size}", "extra": 0, "at": 2, "detach": true}
        - {"id": "ground_ring_beat_4", "op": "particle", "particle": "dust", "frame": "body", "times": "= 64 + 16 * ${chips}", "pos": {"v": "= 6 + ${radius} * cos(i * 2 * pi / (64 + 16 * ${chips}))", "w": 0.05, "s": "= ${radius} * sin(i * 2 * pi / (64 + 16 * ${chips}))"}, "count": 1, "color": "${ring_color}", "size": "= 0.4 + ${core_size}", "extra": 0, "at": 4, "detach": true}
        - {"id": "ground_ring_beat_6", "op": "particle", "particle": "dust", "frame": "body", "times": "= 64 + 16 * ${chips}", "pos": {"v": "= 6 + ${radius} * cos(i * 2 * pi / (64 + 16 * ${chips}))", "w": 0.05, "s": "= ${radius} * sin(i * 2 * pi / (64 + 16 * ${chips}))"}, "count": 1, "color": "${ring_color}", "size": "= 0.4 + ${core_size}", "extra": 0, "at": 6, "detach": true}
        - {"id": "rising_shards_1", "op": "particle", "particle": "block", "block": "minecraft:stone", "frame": "body", "times": "= 16 + 4 * ${chips}", "pos": {"v": "= 6 + 0.5 * (1.25 + 0.25 * ${chips}) * (0.3 + 0.7 * mod(i, 7) / 6) * cos(i * 2.4)", "w": "= 0.65 * (0.3 + 0.7 * mod(i * 3, 7) / 6)", "s": "= 0.5 * (1.25 + 0.25 * ${chips}) * (0.3 + 0.7 * mod(i, 7) / 6) * sin(i * 2.4)"}, "count": "= 1 + floor(${chips} / 3)", "offset": [0.08, 0.08, 0.08], "extra": 0.07, "at": 1, "detach": true}
        - {"id": "rising_shards_2", "op": "particle", "particle": "block", "block": "minecraft:stone", "frame": "body", "times": "= 16 + 4 * ${chips}", "pos": {"v": "= 6 + 0.8 * (1.25 + 0.25 * ${chips}) * (0.3 + 0.7 * mod(i, 7) / 6) * cos(i * 2.4)", "w": "= 1.35 * (0.3 + 0.7 * mod(i * 3, 7) / 6)", "s": "= 0.8 * (1.25 + 0.25 * ${chips}) * (0.3 + 0.7 * mod(i, 7) / 6) * sin(i * 2.4)"}, "count": "= 1 + floor(${chips} / 3)", "offset": [0.08, 0.08, 0.08], "extra": 0.07, "at": 2, "detach": true}
        - {"id": "rising_shards_3", "op": "particle", "particle": "block", "block": "minecraft:stone", "frame": "body", "times": "= 16 + 4 * ${chips}", "pos": {"v": "= 6 + 1 * (1.25 + 0.25 * ${chips}) * (0.3 + 0.7 * mod(i, 7) / 6) * cos(i * 2.4)", "w": "= 1.8 * (0.3 + 0.7 * mod(i * 3, 7) / 6)", "s": "= 1 * (1.25 + 0.25 * ${chips}) * (0.3 + 0.7 * mod(i, 7) / 6) * sin(i * 2.4)"}, "count": "= 1 + floor(${chips} / 3)", "offset": [0.08, 0.08, 0.08], "extra": 0.07, "at": 3, "detach": true}
    end: {final: true}
