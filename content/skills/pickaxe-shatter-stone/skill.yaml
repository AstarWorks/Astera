# Shatters blocks in a sphere at the face the caster looks at, in the frame grammar (ADR-0314 / ADR-0315). Base of the pickaxe-shatter tiers (this is the stone tier);
# pickaxe-shatter-iron / -diamond extend it (ADR-0303 9.3): same document, other id / item / meta and the `with:` values below.
# Wind-up W = 4 ticks (round_half_up(5 / attack_speed 1.2 (vanilla pickaxe))):
# the pickaxe is drawn back over 3 ticks, the cut starts at tick 3 so the head crosses the target at the impact (tick 4) and the blocks give way there; then 6 ticks of follow-through.
# Gameplay (the sphere, sounds, cooldown) is unchanged.
# Three frames carry everything drawn:
#   arm  - the caster's right shoulder (`caster.shoulder_r`); it only turns (pitch about s), so the arm points where the hand goes.
#   tool - the held tool: its origin is the point 0.6 along the arm (`origin: {frame: arm, pos: {v: 0.6}}`, the length of the rigid arm), so the
#          hand reaches it on every tick by construction. The right hand is pinned onto this origin by the engine (ADR-0315): the head leads,
#          the hand follows. The head turns about its own s (v towards w): drawn back, down through the target, run out, then `reset` eases it
#          back to the rest pose before the rig ends. The line `edge` (head base -> head) is what the trail draws along.
#   body - the caster's feet, v forward / w up / s right: the hit area spark and the sounds are points of it.
apiVersion: astera/v3
kind: Skill
id: pickaxe-shatter-stone
item: stone-pickaxe
meta:
  name: {ja: "石の粉砕", en: "Stone Shatter"}
  description: {ja: "視線の先のブロックを球状に砕く。", en: "Shatters blocks in a sphere where you look."}
  cooldown_ticks: 240
  resource_cost: 0
  tags: [tool, cover]
params:
  radius: {type: number, default: 2}
  ahead: {type: number, default: 6.0}
  stone_pitch: {type: number, default: 0.8}
  thud_vol: {type: number, default: 0.7}
  thud_pitch: {type: number, default: 1.2}
  thud: {type: bool, default: false}
  amethyst: {type: bool, default: false}
  spark: {type: string, default: tool-pick-stone}
frames:
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      # pitch about s: where the straight arm points (angle from forward, towards up); the arm only turns, the hand rides its end
      - {at: 0, for: 0, about: s, to: -30}                                   # rest: the hand at the hip
      - {at: 0, for: 3, about: s, to: 55, ease: out_quad}                        # drawn back, hand at head height
      - {at: 3, for: 3, about: s, to: -5, ease: out_cubic}                       # the cut
      - {at: 6, for: 3, about: s, to: -25, ease: out_cubic}                      # follow-through
      - {at: 9, for: 3, about: s, to: -30, ease: in_out_sine}                    # back to the hip
      # yaw about w: the draw goes up at the right of the eye line, so the arm and the axe head stay in frame in first person (as C's mace-smash)
      - {at: 0, for: 0, about: w, to: 0}
      - {at: 0, for: 3, about: w, to: -90, ease: in_out_sine}
      - {at: 3, for: 3, about: w, to: 0, ease: out_cubic}
  - id: tool
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 3, about: s, to: 110, ease: out_quad}
      - {at: 3, for: 3, about: s, to: -30, ease: out_cubic}
      - {at: 6, for: 3, about: s, to: -55, ease: out_cubic}
      - {at: 9, for: 3, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
lines:
  edge: {frame: tool, from: {v: 0.4}, to: {v: 0.9}}      # head base -> head
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 4
      then: cast
      do:
        - {id: rig, op: rig, frame: tool, for: 12, detach: true}
        - {id: trail, op: particle, particle: crit, along: edge, samples: 4, count: 1, extra: 0.04, at: 3, every: 2, for: 6, detach: true}
    cast:
      for: 1
      then: end
      do:
        - {id: break, op: break_area, anchor: {of: caster.eye, offset: {forward: "= dist(pos(caster.eye), aim_point(caster, ${ahead}))"}}, shape: {sphere: {radius: "${radius}"}}, tool: pickaxe, block_damage: 100, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, sound: block.stone.break, frame: body, volume: 1.0, pitch: "${stone_pitch}"}
        - {id: snd_2, op: sound, sound: item.trident.hit_ground, frame: body, volume: "${thud_vol}", pitch: "${thud_pitch}", when: "= ${thud}"}
        - {id: snd_3, op: sound, sound: block.amethyst_cluster.break, frame: body, volume: 0.8, pitch: 1.0, when: "= ${amethyst}"}
        - {id: spark, op: particle_def, def: "${spark}", frame: body, pos: {v: 2.0}}
    end: {final: true}
