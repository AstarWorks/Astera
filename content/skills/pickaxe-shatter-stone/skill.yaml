# Hand-authored tool presentation. Mechanical shape / timing / damage / cooldown stay unchanged.
# Dust uses typical tool material; no per-cell surface data is exposed to presentation rows.
apiVersion: astera/v3
kind: Skill
id: pickaxe-shatter-stone
item: stone-pickaxe
meta:
  name: {ja: "石の粉砕", en: "Stone Shatter"}
  description: {ja: "視線の先のブロックを球状に砕く。", en: "Shatters blocks in a sphere where you look."}
  cooldown_ticks: 240
  resource_cost: 0
  tags: [tool, cover]
params:
  radius: {type: number, default: 2}
  ahead: {type: number, default: 6.0}
  stone_pitch: {type: number, default: 0.8}
  thud_vol: {type: number, default: 0.7}
  thud_pitch: {type: number, default: 1.2}
  thud: {type: bool, default: false}
  amethyst: {type: bool, default: false}
  spark: {type: string, default: tool-pick-stone}
  trail_span: {type: number, default: 6}
  metallic: {type: bool, default: false}
  bright: {type: bool, default: false}
frames:
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: w, to: 0}
      - {at: 0, for: 3, about: w, to: -90, ease: out_cubic}
      - {at: 3, for: 3, about: w, to: 0, ease: out_cubic}
      - {at: 0, for: 0, about: s, to: -30}
      - {at: 0, for: 3, about: s, to: 80, ease: out_quad}
      - {at: 3, for: 3, about: s, to: -5, ease: out_cubic}
      - {at: 6, for: 3, about: s, to: -25, ease: out_cubic}
      - {at: 9, for: 3, about: s, to: -30, ease: in_out_sine}
  - id: tool
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 3, about: s, to: 110, ease: out_quad}
      - {at: 3, for: 3, about: s, to: -30, ease: out_cubic}
      - {at: 6, for: 3, about: s, to: -55, ease: out_cubic}
      - {at: 9, for: 3, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
lines:
  edge: {frame: tool, from: {v: 0.4}, to: {v: 0.9}}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 4
      then: cast
      do:
        - {id: rig, op: rig, frame: tool, for: 12, detach: true}
        - {id: trail, op: particle, particle: dust, along: edge, samples: 5, count: 1, color: "#999999", size: 0.35, extra: 0, at: 3, every: 2, for: "${trail_span}", detach: true}
        - {id: wind, op: sound, sound: entity.player.attack.sweep, frame: body, at: 2, volume: 0.35, pitch: 0.65}
    cast:
      for: 1
      then: end
      do:
        - {id: break, op: break_area, anchor: {of: caster.eye, offset: {forward: "= dist(pos(caster.eye), aim_point(caster, ${ahead}))"}}, shape: {sphere: {radius: "${radius}"}}, tool: pickaxe, block_damage: 100, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, sound: block.stone.break, frame: body, volume: 1.0, pitch: "${stone_pitch}"}
        - {id: snd_2, op: sound, sound: item.trident.hit_ground, frame: body, volume: "${thud_vol}", pitch: "${thud_pitch}", when: "= ${thud}"}
        - {id: snd_3, op: sound, sound: block.amethyst_cluster.break, frame: body, volume: 0.8, pitch: 1.0, when: "= ${amethyst}"}
        - {id: crater, op: particle, particle: block, block: minecraft:deepslate, anchor: {of: caster.eye, offset: {forward: "= dist(pos(caster.eye), aim_point(caster, ${ahead}))"}}, count: 32, offset: [0.14, 0.14, 0.14], extra: 0.18, at: 0}
        - {id: crater_rim, op: particle, particle: block_crumble, block: minecraft:stone, anchor: {of: caster.eye, offset: {forward: "= dist(pos(caster.eye), aim_point(caster, ${ahead}))"}}, times: 24, shift: {forward: "= ${radius} * cos(i * 2 * pi / 24)", left: "= ${radius} * sin(i * 2 * pi / 24)", up: -0.5}, count: 2, extra: 0.06}
        - {id: crater_settle, op: particle, particle: block_crumble, block: minecraft:deepslate, anchor: {of: caster.eye, offset: {forward: "= dist(pos(caster.eye), aim_point(caster, ${ahead}))"}}, times: 24, shift: {forward: "= ${radius} * cos(i * 2 * pi / 24)", left: "= ${radius} * sin(i * 2 * pi / 24)", up: -0.5}, count: 2, extra: 0.03, at: 3, detach: true}
        - {id: material_accent, op: particle_def, def: "${spark}", anchor: {of: caster.eye, offset: {forward: "= dist(pos(caster.eye), aim_point(caster, ${ahead}))"}}}
        - {id: metal, op: particle, particle: electric_spark, anchor: {of: caster.eye, offset: {forward: "= dist(pos(caster.eye), aim_point(caster, ${ahead}))"}}, count: 12, offset: [0.14, 0.14, 0.14], extra: 0.12, at: 0, when: "= ${metallic}"}
        - {id: diamond_flash, op: particle, particle: dust, anchor: {of: caster.eye, offset: {forward: "= dist(pos(caster.eye), aim_point(caster, ${ahead}))"}}, count: 12, offset: [0.14, 0.14, 0.14], extra: 0, at: 0, color: "#64f5ef", size: 0.8, when: "= ${bright}"}
        - {id: diamond_glint, op: particle, particle: end_rod, anchor: {of: caster.eye, offset: {forward: "= dist(pos(caster.eye), aim_point(caster, ${ahead}))"}}, count: 6, offset: [0.14, 0.14, 0.14], extra: 0.04, at: 2, detach: true, when: "= ${bright}"}
        - {id: metal_rim, op: particle, particle: electric_spark, anchor: {of: caster.eye, offset: {forward: "= dist(pos(caster.eye), aim_point(caster, ${ahead}))"}}, shift: {forward: "= ${radius} * cos(i * 2 * pi / 16)", left: "= ${radius} * sin(i * 2 * pi / 16)", up: -0.3}, times: 16, count: 1, extra: 0.02, when: "= ${metallic}"}
        - {id: ring, op: sound, sound: block.anvil.land, frame: body, pos: {v: "= dist(pos(caster.eye), aim_point(caster, ${ahead}))", w: 1.62}, volume: 0.18, pitch: 1.4, when: "= ${metallic}"}
        - {id: chime, op: sound, sound: block.amethyst_block.chime, frame: body, pos: {v: "= dist(pos(caster.eye), aim_point(caster, ${ahead}))", w: 1.62}, volume: 0.6, pitch: 1.3, when: "= ${bright}"}
        - {id: settle, op: sound, sound: block.stone.step, frame: body, pos: {v: "= dist(pos(caster.eye), aim_point(caster, ${ahead}))", w: 1.62}, at: 5, detach: true, volume: 0.4, pitch: 0.75}
    end: {final: true}
