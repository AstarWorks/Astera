apiVersion: astera/v3
kind: Skill
id: pickaxe-shatter-stone
item: stone-pickaxe
meta:
  name: {ja: "石の粉砕", en: "Stone Shatter"}
  description: {ja: "視線の先のブロックを球状に砕く。", en: "Shatters blocks in a sphere where you look."}
  cooldown_ticks: 240
  resource_cost: 0
  tags: [tool, cover]
anchors:
  - {id: dust, anchor: caster, offset: {forward: 2.0}, mode: snapshot}
machine:
  start: cast
  states:
    cast:
      for: 1
      then: end
      do:
        - {id: shatter, use: pickaxe-shatter, with: {radius: 2, tier: 1, stone_pitch: 0.8}, frames: {spot: dust}}
    end: {final: true}
