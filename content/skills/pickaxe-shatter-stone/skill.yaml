# Shatters blocks in a sphere ahead of the caster; the tiers differ in radius. Base of the pickaxe-shatter tiers (this is the stone tier);
# pickaxe-shatter-iron / -diamond extend it (ADR-0303 9.3): same document, other id / item / meta and the `with:` values below.
apiVersion: astera/v3
kind: Skill
id: pickaxe-shatter-stone
item: stone-pickaxe
meta:
  name: {ja: "石の粉砕", en: "Stone Shatter"}
  description: {ja: "視線の先のブロックを球状に砕く。", en: "Shatters blocks in a sphere where you look."}
  cooldown_ticks: 240
  resource_cost: 0
  tags: [tool, cover]
params:
  radius: {type: number, default: 2}
  ahead: {type: number, default: 4.0}
  stone_pitch: {type: number, default: 0.8}
  thud_vol: {type: number, default: 0.7}
  thud_pitch: {type: number, default: 1.2}
  thud: {type: bool, default: false}
  amethyst: {type: bool, default: false}
  spark: {type: string, default: tool-pick-stone}
anchors:
  - {id: dust, anchor: caster, offset: {forward: 2.0}, mode: snapshot}
machine:
  start: cast
  states:
    cast:
      for: 1
      then: end
      do:
        - {id: break, op: break_area, anchor: {of: caster, offset: {forward: "${ahead}"}}, shape: {sphere: {radius: "${radius}"}}, tool: pickaxe, block_damage: 100, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, sound: block.stone.break, anchor: caster, volume: 1.0, pitch: "${stone_pitch}"}
        - {id: snd_2, op: sound, sound: item.trident.hit_ground, anchor: caster, volume: "${thud_vol}", pitch: "${thud_pitch}", when: "= ${thud}"}
        - {id: snd_3, op: sound, sound: block.amethyst_cluster.break, anchor: caster, volume: 0.8, pitch: 1.0, when: "= ${amethyst}"}
        - {id: spark, op: particle_def, def: "${spark}", anchor: dust}
    end: {final: true}
