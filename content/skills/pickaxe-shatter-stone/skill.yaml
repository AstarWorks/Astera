# Shatters blocks in a sphere at the face the caster looks at (within `ahead` blocks); the tiers differ in radius. Base of the pickaxe-shatter tiers (this is the stone tier);
# pickaxe-shatter-iron / -diamond extend it (ADR-0303 9.3): same document, other id / item / meta and the `with:` values below.
# Wind-up W = 4 ticks (round_half_up(5 / attack_speed 1.2 (vanilla pickaxe))): the held rig swings in the wind-up and the blocks give way at tick 4 (the impact), as the melee skills.
apiVersion: astera/v3
kind: Skill
id: pickaxe-shatter-stone
item: stone-pickaxe
meta:
  name: {ja: "石の粉砕", en: "Stone Shatter"}
  description: {ja: "視線の先のブロックを球状に砕く。", en: "Shatters blocks in a sphere where you look."}
  cooldown_ticks: 240
  resource_cost: 0
  tags: [tool, cover]
params:
  radius: {type: number, default: 2}
  ahead: {type: number, default: 6.0}
  stone_pitch: {type: number, default: 0.8}
  thud_vol: {type: number, default: 0.7}
  thud_pitch: {type: number, default: 1.2}
  thud: {type: bool, default: false}
  amethyst: {type: bool, default: false}
  spark: {type: string, default: tool-pick-stone}
anchors:
  - {id: dust, anchor: caster, offset: {forward: 2.0}, mode: snapshot}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 4
      then: cast
      do:
        # held rig: one performance in the wind-up, detached so it plays on through the impact and the tail. Overhead strike written as the head's travel (caster frame left/up/forward):
        # drawn back over 3 ticks, the cut starts at tick 3 so the head crosses the target at the impact (tick 4), then 6 ticks of follow-through.
        - id: rig
          op: rig
          parent: caster
          mount: caster.hand_r
          rest: [{axis: left, deg: 72}]
          detach: true
          for: 12
          swing:
            - {at: 0, for: 3, from: {left: 0.000, up: 0.507, forward: 0.862}, to: {left: 0.100, up: 0.949, forward: -0.300}, edge: trailing, roll: 0, ease: out_quad}
            - {at: 3, for: 3, to: {left: 0.000, up: -0.447, forward: 0.894}, edge: leading, roll: 0, ease: out_cubic}
            - {at: 6, for: 6, to: {left: 0.000, up: -0.786, forward: 0.618}, edge: leading, roll: 0, ease: out_cubic}
    cast:
      for: 1
      then: end
      do:
        - {id: break, op: break_area, anchor: {of: caster.eye, offset: {forward: "= dist(pos(caster.eye), aim_point(caster, ${ahead}))"}}, shape: {sphere: {radius: "${radius}"}}, tool: pickaxe, block_damage: 100, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, sound: block.stone.break, anchor: caster, volume: 1.0, pitch: "${stone_pitch}"}
        - {id: snd_2, op: sound, sound: item.trident.hit_ground, anchor: caster, volume: "${thud_vol}", pitch: "${thud_pitch}", when: "= ${thud}"}
        - {id: snd_3, op: sound, sound: block.amethyst_cluster.break, anchor: caster, volume: 0.8, pitch: 1.0, when: "= ${amethyst}"}
        - {id: spark, op: particle_def, def: "${spark}", anchor: dust}
        - {id: trail, use: swing-trail, with: {samples: 6, span: 8}, frames: {weapon: /windup/rig}, detach: true}
    end: {final: true}
