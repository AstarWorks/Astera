apiVersion: astera/v3
kind: Skill
id: shovel-excavate-stone
item: stone-shovel
meta:
  name: {ja: "石の掘削", en: "Stone Excavate"}
  description: {ja: "目の前の柔らかいブロックを箱形にえぐる。", en: "Digs out a box of soft blocks in front of you."}
  cooldown_ticks: 140
  resource_cost: 0
  tags: [tool, cover]
anchors:
  - {id: spark, anchor: caster, offset: {forward: 2.0}, mode: follow}
machine:
  start: cast
  states:
    cast:
      for: 1
      then: end
      do:
        - {id: excavate, use: shovel-excavate, with: {width: 3, height: 2, length: 3, tier: 1, gravel_pitch: 0.8}, frames: {spot: spark}}
    end: {final: true}
