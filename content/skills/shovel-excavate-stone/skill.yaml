# Digs out a box of soft blocks in front of the caster, in the frame grammar (ADR-0314 / ADR-0315). Base of the shovel-excavate tiers (this is the stone tier);
# shovel-excavate-iron / -diamond extend it (ADR-0303 9.3): same document, other id / item / meta and the `with:` values below.
# Wind-up W = 5 ticks (round_half_up(5 / attack_speed 1.0 (vanilla shovel))):
# the shovel is drawn back over 4 ticks, the cut starts at tick 4 so the blade crosses the target at the impact (tick 5) and the blocks give way there; then 6 ticks of follow-through.
# Gameplay (the box, sounds, cooldown) is unchanged.
# Two frames carry everything drawn:
#   tool - the shovel: origin at the caster's feet moved along the hand path (`move:`), the held shovel rides it, long axis along v (grip at the origin,
#          blade at v 0.9). The right hand is pinned onto this origin by the engine (ADR-0315): the blade leads, the hand follows. The scoop is a turn about s, which moves v towards w: the blade is drawn back to 95 degrees, scooped down through the target to -35 and runs out to -60,
#          then `reset` eases it back to the rest pose before the rig ends. The line `edge` (blade base 0.4 -> blade 0.9) is what the trail draws along.
#   body - the caster's feet, v forward / w up / s right: the hit area spark and the sounds are points of it.
apiVersion: astera/v3
kind: Skill
id: shovel-excavate-stone
item: stone-shovel
meta:
  name: {ja: "石の掘削", en: "Stone Excavate"}
  description: {ja: "目の前の柔らかいブロックを箱形にえぐる。", en: "Digs out a box of soft blocks in front of you."}
  cooldown_ticks: 140
  resource_cost: 0
  tags: [tool, cover]
params:
  width: {type: number, default: 3}
  height: {type: number, default: 2}
  length: {type: number, default: 3}
  gravel_pitch: {type: number, default: 0.8}
  dirt_vol: {type: number, default: 0.8}
  dirt_pitch: {type: number, default: 0.9}
  dirt: {type: bool, default: false}
  flatten: {type: bool, default: false}
  spark: {type: string, default: tool-shovel-stone}
frames:
  - id: tool
    origin: caster
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: 0.51, w: 0.98, s: 0.42}}      # on the arm's reach sphere (0.60 about the shoulder), one key a tick
      - {at: 0, for: 1, to: {v: 0.53, w: 1.53, s: 0.42}}      # drawn back
      - {at: 1, for: 1, to: {v: 0.26, w: 1.82, s: 0.37}}
      - {at: 2, for: 1, to: {v: 0.03, w: 1.88, s: 0.32}}
      - {at: 3, for: 1, to: {v: -0.05, w: 1.88, s: 0.30}}
      - {at: 4, for: 1, to: {v: 0.53, w: 1.53, s: 0.42}}      # the cut
      - {at: 5, for: 1, to: {v: 0.59, w: 1.27, s: 0.43}}
      - {at: 6, for: 1, to: {v: 0.58, w: 1.23, s: 0.43}}
      - {at: 7, for: 1, to: {v: 0.55, w: 1.08, s: 0.43}}      # follow-through
      - {at: 8, for: 1, to: {v: 0.54, w: 1.03, s: 0.42}}
      - {at: 9, for: 1, to: {v: 0.53, w: 1.03, s: 0.42}}
      - {at: 10, for: 1, to: {v: 0.53, w: 1.01, s: 0.42}}      # back to the hip
      - {at: 11, for: 1, to: {v: 0.51, w: 0.99, s: 0.42}}
      - {at: 12, for: 1, to: {v: 0.51, w: 0.98, s: 0.42}}
    rotate:
      - {at: 0, for: 4, about: s, to: 95, ease: out_quad}
      - {at: 4, for: 3, about: s, to: -35, ease: out_cubic}
      - {at: 7, for: 3, about: s, to: -60, ease: out_cubic}
      - {at: 10, for: 3, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
lines:
  edge: {frame: tool, from: {v: 0.4}, to: {v: 0.9}}      # head base -> head
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 5
      then: cast
      do:
        - {id: rig, op: rig, frame: tool, for: 13, detach: true}
        - {id: trail, op: particle, particle: crit, along: edge, samples: 4, count: 1, extra: 0.04, at: 4, every: 2, for: 6, detach: true}
    cast:
      for: 1
      then: end
      do:
        - {id: dig, op: break_area, frame: body, shape: {box: {width: "${width}", height: "${height}", length: "${length}"}}, tool: shovel, block_damage: 100, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, sound: block.gravel.break, frame: body, volume: 1.0, pitch: "${gravel_pitch}"}
        - {id: snd_2, op: sound, sound: block.rooted_dirt.break, frame: body, volume: "${dirt_vol}", pitch: "${dirt_pitch}", when: "= ${dirt}"}
        - {id: snd_3, op: sound, sound: item.shovel.flatten, frame: body, volume: 0.8, pitch: 0.9, when: "= ${flatten}"}
        - {id: spark, op: particle_def, def: "${spark}", frame: body, pos: {v: 2.0}}
    end: {final: true}
