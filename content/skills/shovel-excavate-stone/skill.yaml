# astera/v3 hand port of the v2 skill.yaml + look.yaml (tick for tick).
apiVersion: astera/v3
kind: Skill
id: shovel-excavate-stone
item: stone-shovel
meta: {name: {ja: "石の掘削", en: "Stone Excavate"}, description: {ja: "目の前の柔らかいブロックを箱形にえぐる。", en: "Digs out a box of soft blocks in front of you."}, cooldown_ticks: 140, resource_cost: 0, tags: [tool, cover]}
anchors:
  - {id: spark,  anchor: caster, offset: {forward: 2.0}, mode: follow}      # was pt_caster_0_0_2 (feet, yaw-only)
machine:
  start: cast
  states:
    cast:
      for: 1
      then: end
      do:
        - {id: dig, op: break_area, at: 0, anchor: caster, shape: {box: {width: 3, height: 2, length: 3}}, tool: shovel, block_damage: 100, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, sound: block.gravel.break, anchor: caster, volume: 1.0, pitch: 0.8}
        - {id: fx, op: particle_def, def: tool-shovel-stone, anchor: spark}
    end: {final: true}
