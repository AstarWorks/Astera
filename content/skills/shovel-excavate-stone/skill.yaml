# Hand-authored tool presentation. Mechanical shape / timing / damage / cooldown stay unchanged.
# Dust uses typical tool material; no per-cell surface data is exposed to presentation rows.
apiVersion: astera/v3
kind: Skill
id: shovel-excavate-stone
item: stone-shovel
meta:
  name: {ja: "石の掘削", en: "Stone Excavate"}
  description: {ja: "目の前の柔らかいブロックを箱形にえぐる。", en: "Digs out a box of soft blocks in front of you."}
  cooldown_ticks: 140
  resource_cost: 0
  tags: [tool, cover]
params:
  width: {type: number, default: 3}
  height: {type: number, default: 2}
  length: {type: number, default: 3}
  trail_span: {type: number, default: 6}
  chips: {type: number, default: 2}
  core_color: {type: string, default: "#856349"}
  core_size: {type: number, default: 0.3}
frames:
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: w, to: 0}
      - {at: 0, for: 4, about: w, to: -45, ease: out_cubic}
      - {at: 4, for: 3, about: w, to: 0, ease: out_cubic}
      - {at: 0, for: 0, about: s, to: -30}
      - {at: 0, for: 4, about: s, to: -50, ease: out_quad}
      - {at: 4, for: 3, about: s, to: 25, ease: out_cubic}
      - {at: 7, for: 3, about: s, to: -25, ease: out_cubic}
      - {at: 10, for: 3, about: s, to: -30, ease: in_out_sine}
  - id: tool
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 4, about: s, to: -65, ease: out_quad}
      - {at: 4, for: 3, about: s, to: 35, ease: out_cubic}
      - {at: 7, for: 3, about: s, to: -60, ease: out_cubic}
      - {at: 10, for: 3, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
lines:
  edge: {frame: tool, from: {v: 0.4}, to: {v: 0.9}}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 5
      then: cast
      do:
        - {id: rig, op: rig, frame: tool, for: 13, detach: true}
        # First blade sample precedes impact; remaining samples belong to cast.
        - {id: trail, op: particle, particle: dust, along: edge, samples: 5, count: 1, color: "#856349", size: 0.35, extra: 0, at: 4}
    cast:
      for: 1
      then: end
      do:
        - {id: dig, op: break_area, block_family: soil, frame: body, shape: {box: {width: "${width}", height: "${height}", length: "${length}"}}, tool: shovel, block_damage: 100, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, sound: block.gravel.break, frame: body, volume: 1.0, pitch: 1.0}
        - {id: wave_0, op: particle, particle: block, block: minecraft:dirt, anchor: {of: caster, offset: {forward: "= 1 + (0 / 2.0) * (${length} - 1)", up: 0.6, left: "= i - floor(${width} / 2.0)"}}, times: "${width}", count: 0, offset: {forward: 0.12, up: 0.8, left: 0.18}, extra: 0.12, at: 0}
        - {id: chips_0, op: particle, particle: block, block: minecraft:dirt, frame: body, pos: {v: "= 1 + (0 / 2.0) * (${length} - 1)", w: 0.6, s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: 2, offset: [0.12, 0.04, 0.12], extra: .025, at: 0}
        - {id: fall_0, op: particle, particle: falling_dust, block: minecraft:coarse_dirt, frame: body, pos: {v: "= 1 + (0 / 2.0) * (${length} - 1)", w: 0.6, s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: 1, offset: [0.14, 0.14, 0.14], extra: 0, at: 2, detach: true}
        - {id: wave_1, op: particle, particle: block, block: minecraft:dirt, anchor: {of: caster, offset: {forward: "= 1 + (1 / 2.0) * (${length} - 1)", up: 0.6, left: "= i - floor(${width} / 2.0)"}}, times: "${width}", count: 0, offset: {forward: 0.12, up: 0.8, left: 0.18}, extra: 0.12, at: 2, detach: true}
        - {id: chips_1, op: particle, particle: block, block: minecraft:dirt, frame: body, pos: {v: "= 1 + (1 / 2.0) * (${length} - 1)", w: 0.6, s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: 2, offset: [0.12, 0.04, 0.12], extra: .025, at: 2, detach: true}
        - {id: fall_1, op: particle, particle: falling_dust, block: minecraft:coarse_dirt, frame: body, pos: {v: "= 1 + (1 / 2.0) * (${length} - 1)", w: 0.6, s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: 1, offset: [0.14, 0.14, 0.14], extra: 0, at: 4, detach: true}
        - {id: wave_2, op: particle, particle: block, block: minecraft:dirt, anchor: {of: caster, offset: {forward: "= 1 + (2 / 2.0) * (${length} - 1)", up: 0.6, left: "= i - floor(${width} / 2.0)"}}, times: "${width}", count: 0, offset: {forward: 0.12, up: 0.8, left: 0.18}, extra: 0.12, at: 4, detach: true}
        - {id: chips_2, op: particle, particle: block, block: minecraft:dirt, frame: body, pos: {v: "= 1 + (2 / 2.0) * (${length} - 1)", w: 0.6, s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: 2, offset: [0.12, 0.04, 0.12], extra: .025, at: 4, detach: true}
        - {id: fall_2, op: particle, particle: falling_dust, block: minecraft:coarse_dirt, frame: body, pos: {v: "= 1 + (2 / 2.0) * (${length} - 1)", w: 0.6, s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: 1, offset: [0.14, 0.14, 0.14], extra: 0, at: 6, detach: true}
        - {id: wave_quarter, op: particle, particle: block, block: minecraft:dirt, anchor: {of: caster, offset: {forward: "= 1 + (0.5 / 2.0) * (${length} - 1)", up: 0.6, left: "= i - floor(${width} / 2.0)"}}, times: "${width}", count: 0, offset: {forward: 0.12, up: 0.8, left: 0.18}, extra: 0.12, at: 1, detach: true}
        - {id: chips_quarter, op: particle, particle: block, block: minecraft:dirt, frame: body, pos: {v: "= 1 + (0.5 / 2.0) * (${length} - 1)", w: 0.6, s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: 2, offset: [0.12, 0.04, 0.12], extra: .025, at: 1, detach: true}
        - {id: wave_three_quarters, op: particle, particle: block, block: minecraft:dirt, anchor: {of: caster, offset: {forward: "= 1 + (1.5 / 2.0) * (${length} - 1)", up: 0.6, left: "= i - floor(${width} / 2.0)"}}, times: "${width}", count: 0, offset: {forward: 0.12, up: 0.8, left: 0.18}, extra: 0.12, at: 3, detach: true}
        - {id: chips_three_quarters, op: particle, particle: block, block: minecraft:dirt, frame: body, pos: {v: "= 1 + (1.5 / 2.0) * (${length} - 1)", w: 0.6, s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: 2, offset: [0.12, 0.04, 0.12], extra: .025, at: 3, detach: true}
        - {id: wave_0_puff, op: particle, particle: dust, frame: body, pos: {v: "= 1 + (0 / 2.0) * (${length} - 1)", w: 0.6, s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: "${chips}", offset: [0.12, 0.08, 0.12], color: "${core_color}", size: "${core_size}", extra: 0}
        - {id: wave_1_puff, op: particle, particle: dust, frame: body, pos: {v: "= 1 + (1 / 2.0) * (${length} - 1)", w: 0.6, s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: "${chips}", offset: [0.12, 0.08, 0.12], color: "${core_color}", size: "${core_size}", extra: 0, at: 2, detach: true}
        - {id: wave_2_puff, op: particle, particle: dust, frame: body, pos: {v: "= 1 + (2 / 2.0) * (${length} - 1)", w: 0.6, s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: "${chips}", offset: [0.12, 0.08, 0.12], color: "${core_color}", size: "${core_size}", extra: 0, at: 4, detach: true}
        - {id: trail, op: particle, particle: dust, along: edge, samples: 5, count: 1, color: "#856349", size: 0.35, extra: 0, at: 1, every: 2, for: "= ${trail_span} - 2", detach: true}
        - {"id": "contact_chips", "op": "particle", "frame": "body", "pos": {"v": 5.65, "w": 1.0}, "at": 0, "detach": true, "particle": "block", "block": "minecraft:dirt", "count": "= 12 + 6 * ${chips}", "offset": [0.18, 0.18, 0.18], "extra": 0.13}
        - {"id": "contact_core", "op": "particle", "frame": "body", "pos": {"v": 5.65, "w": 1.0}, "at": 0, "detach": true, "particle": "dust", "count": "= 6 + 2 * ${chips}", "offset": [0.12, 0.12, 0.12], "color": "${core_color}", "size": "= ${core_size} * 2", "extra": 0}
        - {"id": "lob_clumps_0", "op": "particle", "particle": "block", "block": "minecraft:dirt", "frame": "body", "pos": {"v": 1.4, "w": 0.25}, "count": "= 3 + 2 * ${chips}", "offset": [0.1, 0.1, 0.1], "extra": 0.035, "at": 0, "detach": true}
        - {"id": "lob_clumps_1", "op": "particle", "particle": "block", "block": "minecraft:dirt", "frame": "body", "pos": {"v": 2.55, "w": 1.86}, "count": "= 3 + 2 * ${chips}", "offset": [0.1, 0.1, 0.1], "extra": 0.035, "at": 1, "detach": true}
        - {"id": "lob_clumps_2", "op": "particle", "particle": "block", "block": "minecraft:dirt", "frame": "body", "pos": {"v": 3.7, "w": 2.4}, "count": "= 3 + 2 * ${chips}", "offset": [0.1, 0.1, 0.1], "extra": 0.035, "at": 2, "detach": true}
        - {"id": "lob_clumps_3", "op": "particle", "particle": "block", "block": "minecraft:dirt", "frame": "body", "pos": {"v": 4.85, "w": 1.86}, "count": "= 3 + 2 * ${chips}", "offset": [0.1, 0.1, 0.1], "extra": 0.035, "at": 3, "detach": true}
        - {"id": "lob_clumps_4", "op": "particle", "particle": "block", "block": "minecraft:dirt", "frame": "body", "pos": {"v": 6.0, "w": 0.25}, "count": "= 3 + 2 * ${chips}", "offset": [0.1, 0.1, 0.1], "extra": 0.035, "at": 4, "detach": true}
        - {"id": "landing", "op": "particle", "particle": "block", "block": "minecraft:dirt", "frame": "body", "pos": {"v": 6, "w": 0.12}, "count": "= 12 + 6 * ${chips}", "offset": [0.24, 0.06, 0.24], "extra": 0.07, "at": 4, "detach": true}
        - {"id": "low_dust", "op": "particle", "particle": "dust", "frame": "body", "pos": {"v": 6, "w": 0.16}, "count": "= 8 + 3 * ${chips}", "offset": [0.28, 0.08, 0.28], "color": "${core_color}", "size": "= 1.0 + ${core_size}", "extra": 0, "at": 4, "every": 2, "detach": true, "for": 5}
    end: {final: true}
