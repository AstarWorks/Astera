apiVersion: astera/v3
kind: Skill
id: flash-bang-throw
item: flash-bang
meta:
  name: {ja: "閃光弾", en: "Flash Bang"}
  description: {ja: "着弾点で閃光を放ち、周囲の敵を一瞬動けなくする。", en: "Pops a flash that briefly stuns enemies near the impact."}
  cooldown_ticks: 200
  resource_cost: 12
  tags: [ranged, utility, control]
params:
  launch_speed:       {type: number, default: 1.4}
  max_lifetime_ticks: {type: ticks, default: 50}
  radius:             {type: blocks, default: 4.0}
  shock_ticks:        {type: ticks, default: 30}
anchors:
  - {id: muzzle, anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: cast_fx, anchor: caster, offset: {up: -0.25, forward: 0.9}, mode: snapshot}
  - {id: heart, anchor: victim.root, offset: {up: 0.8}, mode: follow}
machine:
  start: cast
  states:
    cast:
      on:
        - {event: bolt.end, to: done}
      enter:
        - {id: snd, op: sound, sound: "entity.snowball.throw", anchor: caster, volume: 0.9, pitch: 1.2}
        - {id: fx, op: particle_def, def: gun-muzzle-flash, anchor: cast_fx}
      do:
        - id: bolt
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * ${launch_speed}"
          speed: "${launch_speed}"
          for: "${max_lifetime_ticks}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: st_shock, op: status, target: {kind: enemies, around: heart, radius: "${radius}"}, status: shock, stacks: 1, for: "${shock_ticks}"}
              - {id: emit_2, op: particle, particle: end_rod, anchor: heart, count: 0, extra: 0.08}
              - {id: emit_3, op: particle, particle: dust, anchor: heart, count: 1, color: "#ffffe6", size: 1.4}
              - {id: snd_hit, op: sound, sound: "entity.firework_rocket.blast", anchor: contact, volume: 0.9, pitch: 1.3}
            block:
              - {id: st_shock_2, op: status, target: {kind: enemies, around: contact, radius: "${radius}"}, status: shock, stacks: 1, for: "${shock_ticks}"}
              - {id: emit_4, op: particle, particle: end_rod, anchor: contact, count: 0, extra: 0.08}
              - {id: emit_5, op: particle, particle: dust, anchor: contact, count: 1, color: "#ffffe6", size: 1.4}
              - {id: snd_blk, op: sound, sound: "entity.firework_rocket.blast", anchor: contact, volume: 0.9, pitch: 1.3}
        - {id: trail, op: particle, particle: end_rod, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.03, 0.03, 0.03], at: 0, every: 1, until: bolt.end}
    done: {final: true}
