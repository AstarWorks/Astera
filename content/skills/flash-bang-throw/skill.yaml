# Flash bang, in the frame grammar (ADR-0314 / ADR-0315): a lobbed body bounces and rolls, then pops a flash at a fixed fuse tick after the throw
# (fuse_ticks = the projectile `for`, fixed at load) and shocks enemies near the spot. Gameplay (speed 1.4, fuse 50, gravity 0.04, 3 bounces, shock
# 30 ticks within 4 blocks) is unchanged; the fragment keeps only the shock (a gameplay row, around the burst point).
# Frames: `eye` is the caster's eye / aim basis (v = aim, s = right, w = s x v); the bomb leaves at v 0.5 (the old muzzle) and the throw puff is at
# v 0.9, w -0.5, s 0.35. There is no `hand` frame / rig: the item has no point table in content/frames (rig needs one), so the arm stays on the vanilla pose. `body` rides the bomb (v forward, w up): the glowstone shell and its
# dust tail (the line `tail`, 0.4 behind, 2 samples) are points of it, and at the fuse end the flash (glint, core, report) is drawn on `body` too,
# since the end handler runs while the bomb's last position still stands.
apiVersion: astera/v3
kind: Skill
id: flash-bang-throw
item: flash-bang
meta:
  name: {ja: "閃光弾", en: "Flash Bang"}
  description: {ja: "着弾点で閃光を放ち、周囲の敵を一瞬動けなくする。", en: "Pops a flash that briefly stuns enemies near the impact."}
  cooldown_ticks: 200
  resource_cost: 12
  tags: [ranged, utility, control]
params:
  launch_speed: {type: number, default: 1.4}
  fuse_ticks:   {type: ticks, default: 50}
  radius:       {type: blocks, default: 4.0}
  shock_ticks:  {type: ticks, default: 30}
frames:
  - id: eye
    origin: caster.eye
    v: aim
    w: s x v
    s: right
  - id: body
    origin: bolt
    v: forward
    w: up
    s: v x w
lines:
  tail: {frame: body, from: {v: -0.4}, to: {v: 0}}
fragments:
  flash:
    params:
      radius: {type: blocks, required: true}
      shock:  {type: ticks, required: true}
    frames_in: {spot: anchor}
    do:
      - {id: shock, op: status, target: {kind: enemies, around: spot, radius: "${radius}"}, status: shock, stacks: 1, for: "${shock}"}
machine:
  start: cast
  tail: 2
  states:
    cast:
      for: "= fuse_ticks"
      then: done
      enter:
        - {id: snd, op: sound, at: 0, sound: "entity.snowball.throw", frame: eye, volume: 0.9, pitch: 1.2}
        - {id: smoke, op: particle_def, at: 0, def: gun-muzzle-smoke, frame: eye, pos: {v: 0.9, w: -0.5, s: 0.35}}
      do:
        - id: bolt
          op: projectile
          frame: eye
          pos: {v: 0.5}
          velocity: "= look(caster) * ${launch_speed}"
          speed: "${launch_speed}"
          for: "${fuse_ticks}"
          gravity: 0.04
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false, reflect: true}
          block: {mode: bounce, restitution: 0.45, friction: 0.15, times: 3}
          on:
            end:
              - {op: use, use: "fragment:flash", with: {radius: "${radius}", shock: "${shock_ticks}"}, frames: {spot: bolt}}
              - {id: glint, op: particle, particle: end_rod, frame: body, count: 0, extra: 0.08, detach: true}
              - {id: core, op: particle, particle: dust, frame: body, count: 1, color: "#ffffe6", size: 1.4, detach: true}
              - {id: report, op: sound, sound: "entity.firework_rocket.blast", frame: body, volume: 0.9, pitch: 1.3, detach: true}
        - {id: shell, op: display, kind: item, item: "minecraft:glowstone_dust", context: fixed, frame: body, scale: [0.5, 0.5, 0.5], at: 0, until: bolt.end}
        - {id: trail, op: particle, particle: dust, along: tail, samples: 2, count: 1, offset: [0.03, 0.03, 0.03], color: "#fffff0", size: 0.35, at: 0, every: 1, until: bolt.end}
    done: {final: true}
