apiVersion: astera/v3
kind: Skill
id: ember-rod-spark
item: ember-rod
meta:
  name: {ja: 火花, en: Ember Spark}
  description: {ja: "小さな火の玉。燃焼させることがある。", en: "A small fireball that may ignite."}
  cooldown_ticks: 20
  resource_cost: 6
  tags: [ranged, fire]
params:
  launch_speed:       {type: number, default: 2.2}
  max_lifetime_ticks: {type: ticks, default: 45}
  dmg_fire:           {type: number, default: 20}
  burn_ticks:         {type: ticks, default: 20}
anchors:
  - {id: muzzle, anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: fx, anchor: caster, offset: {forward: 0.9, up: -0.25}}   # was pt_caster_0_m0p25_0p9 (caster feet, yaw-only)
  - {id: heart, anchor: victim.root, offset: {up: 1.2}}   # was pt_enemy_0_1p2_0 (v2 enemy frame = victim feet)
machine:
  start: cast
  states:
    cast:
      for: "= max_lifetime_ticks"
      then: end
      on:
        - {event: bolt.end, to: end}
      do:
        - id: bolt
          op: projectile
          at: 0
          origin: muzzle
          velocity: "= look(caster) * ${launch_speed}"
          for: "${max_lifetime_ticks}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {fire: "${dmg_fire}"}}
              - {id: burn, op: status, target: event.victim, status: burn, stacks: 1, for: "${burn_ticks}", when: "= rand() < 0.5"}
              - {id: snd_hit, op: sound, sound: "astera:skills/fire-impact", anchor: contact.point, volume: 0.7, pitch: 1.2}
              - {id: spark, op: particle_def, def: hit-spark, anchor: heart}
            block:
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact.point, volume: 0.5, pitch: 1.5}
              - {id: spark_b, op: particle_def, def: hit-spark, anchor: contact.point}
        - {id: snd, op: sound, at: 0, sound: "astera:skill/wand/cast", anchor: caster, volume: 0.8, pitch: 1.2}
        - {id: fx1, op: particle_def, at: 0, def: fire-cast, anchor: fx}
        - {id: t1, op: particle, particle: flame, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.04, 0.04, 0.04], extra: 0, at: 0, every: 1, until: bolt.end}
        - {id: t2, op: particle, particle: dust, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0, 0, 0], extra: 0, color: "#ff7814", size: 1.0, at: 0, every: 1, until: bolt.end}
    end: {final: true}
