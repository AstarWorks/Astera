apiVersion: astera/v3
kind: Skill
id: ember-rod-spark
item: ember-rod
meta:
  name: {ja: 火花, en: Ember Spark}
  description: {ja: "小さな火の玉。燃焼させることがある。", en: "A small fireball that may ignite."}
  cooldown_ticks: 20
  resource_cost: 6
  tags: [ranged, fire]
params:
  launch_speed:       {type: number, default: 2.2}
  max_lifetime_ticks: {type: ticks, default: 45}
  dmg_fire:           {type: number, default: 20}
  burn_ticks:         {type: ticks, default: 20}
anchors:
  - {id: muzzle, anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: fx, anchor: caster.eye, offset: {forward: 0.9, up: -0.25}}
  - {id: enemy, anchor: victim.body, offset: {up: 1.2}}
presentation:
  timeline:
    - id: cast
      at: 0
      do:
        - {id: snd, op: sound, sound: "astera:skill/wand/cast", anchor: caster, volume: 0.8, pitch: 1.2}
        - {id: fx1, op: emit, effect: fire-cast, anchor: fx}
    - id: trail
      at: 0
      every: 1
      until: bolt.end
      do:
        # GAP: v2 trail spacing 0.4 -> v3 sweep anchor {of: bolt, sweep: 0.4}; spacing semantics assumed equal
        - {id: t1, op: particle, particle: flame, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.04, 0.04, 0.04], extra: 0}
        - {id: t2, op: particle, particle: dust, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0, 0, 0], extra: 0, color: "#ff7814", size: 1.0}
  "on":
    hit:
      - {id: snd_hit, op: sound, sound: "astera:skills/fire-impact", anchor: enemy, volume: 0.7, pitch: 1.2}
      - {id: spark, op: emit, effect: hit-spark, anchor: enemy}
    block:
      - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact.point, volume: 0.5, pitch: 1.5}
      - {id: spark_b, op: emit, effect: hit-spark, anchor: contact.point}
machine:
  start: cast
  states:
    cast:
      for: 46
      then: done
      enter:
        - id: bolt
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * ${launch_speed}"
          speed: "${launch_speed}"
          for: "${max_lifetime_ticks}"
          radius: 0.5
          hit: {targets: enemies, once: true}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, components: [{kind: fire, amount: "${dmg_fire}"}]}
              - {id: burn, op: status, target: event.victim, status: burn, stacks: 1, for: "${burn_ticks}", when: "= rand() < 0.5"}
    done: {final: true}
