# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: halberd-hook

name:
  ja: "引っ掛け"
  en: "Halberd Hook"
description:
  ja: "穂先で足を払い、相手の体勢を崩す。"
  en: "Hooks the legs and shakes the target."

archetype: melee
cooldown_ticks: 110
resource_cost: 12
tags: [ melee, physical, control ]

params:
  type: melee
  range: 3.6
  arc_degrees: 50.0
  knockback: 0.2
  damage:
    - base: { type: literal, value: 22.0 }
      attribute: physical

phases:
  type: melee
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.sweep
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 0.8 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.6, height: -0.1 }
      particle_id: stab-spark
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/blade-hit
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
    - type: apply_status
      targets: { type: target }
      status_id: tremor
      effect_duration_ticks: { type: literal, value: 40 }
  miss: []
