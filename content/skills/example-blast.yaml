# Wave _skills-2 / ADR-0077: PROJECTILE archetype with phase mechanics.
#
# `params` controls the projectile's macro shape (speed, lifetime, baseline
# damage list). `phases` carries declarative mechanics fired at lifecycle
# events — cast (launch), hit_entity / hit_block (impact), miss, expire.

id: example-blast

name:
  ja: "炸裂弾"
  en: "Example Blast"
description:
  ja: "炎属性の弾を発射する基本的な遠距離スキル。"
  en: "Launches a fire-attribute projectile — the canonical ranged example."

archetype: projectile
cooldown_ticks: 40
tags: [ ranged, fire-family ]

params:
  type: projectile
  launch_speed: 1.8
  max_lifetime_ticks: 60
  damage:
    - base: { kind: literal, value: 8.0 }
      attribute: fire
    - base: { kind: literal, value: 3.0 }
      attribute: electric

phases:
  archetype: projectile
  cast:
    - type: play_sound
      targets: { kind: caster }
      sound_id: skills/blast-cast
    - type: spawn_particle
      targets: { kind: caster_offset, offset: { kind: literal, value: { x: 0.0, y: 1.5, z: 0.5 } } }
      particle_id: example-burst
  hit_entity:
    - type: damage
      targets: { kind: target }
      components:
        - base: { kind: literal, value: 8.0 }
          attribute: fire
        - base: { kind: literal, value: 3.0 }
          attribute: electric
    - type: apply_status
      targets: { kind: target }
      status_id: example-burn
      effect_duration_ticks: { kind: literal, value: 60 }
      chance: { kind: literal, value: 0.4 }
  hit_block:
    - type: spawn_particle
      targets: { kind: hit_location }
      particle_id: example-burst
  miss:
    - type: play_sound
      targets: { kind: caster }
      sound_id: skills/whiff
  expire: []
