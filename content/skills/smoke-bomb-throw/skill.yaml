# Smoke bomb: a lobbed body bounces and rolls, then fills its spot with smoke at a fixed fuse tick after the throw
# (fuse_ticks = the projectile `for`, fixed at load); allies near it turn evasive.
apiVersion: astera/v3
kind: Skill
id: smoke-bomb-throw
item: smoke-bomb
meta:
  name: {ja: "煙幕弾", en: "Smoke Bomb"}
  description: {ja: "着弾点に煙を張り、味方を見つかりにくくする。", en: "Fills the spot with smoke; allies in it move evasively."}
  cooldown_ticks: 200
  resource_cost: 12
  tags: [ranged, utility, support]
params:
  launch_speed:  {type: number, default: 1.2}
  fuse_ticks:    {type: ticks, default: 50}
  radius:        {type: blocks, default: 4.0}
  evasive_ticks: {type: ticks, default: 80}
anchors:
  - {id: muzzle,    anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: flash,     anchor: caster.eye, offset: {up: -0.25, forward: 1.7}, mode: follow}
fragments:
  cloud:
    params:
      radius:  {type: blocks, required: true}
      evasive: {type: ticks, required: true}
    frames_in: {spot: anchor, puff: anchor}
    do:
      - {id: evasive, op: status, target: {kind: allies, around: spot, radius: "${radius}", include_self: true}, status: evasive, stacks: 1, for: "${evasive}"}
      - {id: snd, op: sound, sound: entity.generic.extinguish_fire, anchor: spot, volume: 0.8, pitch: 0.7, detach: true}
      - {id: big, op: particle, particle: large_smoke, anchor: puff, count: 0, extra: 0.01, detach: true}
      - {id: small, op: particle, particle: smoke, anchor: puff, count: 0, extra: 0.01, detach: true}
machine:
  start: fly
  tail: 2
  states:
    fly:
      for: "= fuse_ticks"
      then: end
      do:
        - {id: snd, op: sound, sound: entity.generic.extinguish_fire, anchor: caster, volume: 0.9, pitch: 1.0, at: 0}
        - {id: puff, op: particle_def, def: gun-muzzle-smoke, anchor: flash, at: 0}
        - id: bolt
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * ${launch_speed}"
          for: "${fuse_ticks}"
          gravity: 0.04
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false, reflect: true}
          block: {mode: bounce, restitution: 0.4, friction: 0.2, times: 3}
          on:
            end: [{op: use, use: "fragment:cloud", with: {radius: "${radius}", evasive: "${evasive_ticks}"}, frames: {spot: bolt, puff: bolt}}]
        - {id: shell, op: display, kind: item, item: "minecraft:gunpowder", context: fixed, anchor: bolt, scale: [0.5, 0.5, 0.5], at: 0, until: bolt.end}
        - {id: trail, op: particle, particle: smoke, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.04, 0.04, 0.04], at: 2, every: 1, until: bolt.end}
    end: {final: true}
