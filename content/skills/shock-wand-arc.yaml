# Match arsenal (wp/match-arsenal): simple PvP skill. One cast sound, a few particles.

id: shock-wand-arc

name:
  ja: "放電"
  en: "Arc Burst"
description:
  ja: "周囲へ放電し、敵を痺れさせる。"
  en: "Releases a ring of lightning around you."

archetype: aoe
cooldown_ticks: 140
resource_cost: 16
tags: [ aoe, electric ]

params:
  type: aoe
  radius: 3.5
  falloff: linear
  damage:
    - base: { type: literal, value: 30.0 }
      attribute: electric

phases:
  type: aoe
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:skill/wand/cast
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 1.1 }
    - type: schedule_particle_animation
      targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 0.15, z: 0.0 } } }
      animation:
        - type: ring
          period_ticks: 6
          points: 16
          start_radius: 0.5
          end_radius: 3.5
          particles:
            - { id: electric_spark, count: 0, extra: 0.03 }
            - { id: dust, color: { r: 255, g: 240, b: 120 }, scale: 1.4 }
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/blade-hit
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.0 }
    - type: apply_status
      targets: { type: target }
      status_id: shock
      effect_duration_ticks: { type: literal, value: 30 }
      chance: { type: literal, value: 0.5 }
  expire: []
