machine:
  start: wind
  states:
    wind:
      for: 11
      then: dash
    dash:
      # v2 dash_strike at tick 11: distance 9 over 5 ticks, radius 0.8, hit_once, invulnerable false.
      # The dash_fx handler of v2 outlives the dash by 9 ticks (dash_fx6..9 removals), so the state lasts 14 ticks.
      for: 14
      then: end
      enter:
        # GAP: dash_strike stop_on_block true -> none (op dash has no block-stop flag)
        # GAP: dash_strike follow_pitch false -> none (dash is horizontal by default?)
        - {id: lunge, op: dash, speed: "= dash_distance / 5", for: 5}
      do:
        # GAP: dash_strike hit_once true / radius 0.8 -> closest: hit sphere 0.8 with window once (the v2 sweep is a moving capsule along the dash)
        # GAP: v2 dash_strike has no sector, so no height; sphere used
        - {id: dash_hit, op: hit, anchor: caster, targets: enemies, shape: {sphere: 0.8}, at: 0, for: 5, window: once, damage: {physical: "= dmg_physical"}}
        # GAP: damage ignore_invulnerability true -> none on op hit
      on:
        - event: dash_hit.hit
          do:
            - id: f0
              at: 0
              do:
                - id: fx3_couture_passage_contact
                  op: frame
                  anchor: victim.root
                  # GAP: anchor orient yaw at enemy (victim origin, CASTER yaw) -> victim.root snapshot (victim basis)
                  mode: snapshot
                  for: 9
                - id: fx3_couture_passage_contact_cross_0
                  op: display
                  kind: block
                  block: white_concrete
                  anchor: fx3_couture_passage_contact
                  offset: {left: 0, up: 1.05, forward: 0}
                  rotate: [{axis: left, deg: -45}]
                  scale: [0.05, 3.3, 0.06]
                  brightness: {block: 15, sky: 15}
                  for: 9
                  motion:
                    - {law: grow, prop: scale, per_tick: [-0.005, 0, -0.006667], at: 0, for: 3}
                    - {law: grow, prop: scale, per_tick: [-0.007, 0, -0.008], at: 3, for: 5, ease: in_quad}
                - id: fx3_couture_passage_contact_cross_1
