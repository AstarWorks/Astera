# Shear Passage (couture rapier S1) in the frame grammar (ADR-0314): crouch and fold the air, snip open a pair of shears, lunge through
# the target and cut a cross. Every drawn thing is a point of one of these frames; `left` / `up` / `forward` are not written. Axes of a
# caster frame: v = forward, w = up, s = v x w (to the right), so a display's own x runs along -s, y along w and z along v.
#   body    - the caster's feet. The five lavender folds and the spindle pinch together 1.2 ahead of it (ticks 2..11, before the lunge
#             starts), the crescent of the cut trails behind it (ticks 13..22).
#   hinge_a - the pivot of the right scissor half: feet + 0.45 ahead, 1.05 up, 0.295 to the right. Its blade (three tapering steel plates
#             along v, the edge strip on top, the five-piece loop handle behind) lies in the v-w plane; the `rotate` keys about s ARE the
#             snip: the half drops 22 degrees (6-10), kicks back 5 up (10-13), settles 17 down (13-18) and closes to 32 down (18-21).
#   hinge_b - the left half, 0.205 to the right of the pivot, starts 64 degrees nose-up (rotate about s: positive turns v towards w)
#             and swings down through the other half: 46, 9, -9, -24 degrees, so the two cross at the hinge and shut like shears.
#   flower  - the white four-cube flower on the hinge; it follows the caster like the halves.
#   cut     - one per victim, at the victim's centre, v the way the blow came in: the white cross, the dark shards, the bloom and the
#             eight petals of the golden-angle burst. Its scale key is the burst: it opens from 0.1 to 1 over 7 ticks (out_cubic), so
#             every shard and petal, placed at its final radius, flies out and slows. One frame, because all of them start on the hit.
# Gameplay (dash, hit window, damage, react, states, cast length 37) and the sounds are unchanged.
apiVersion: astera/v3
kind: Skill
id: couture-rapier-s1
item: couture-rapier
meta: {name: {ja: "切り合わせ", en: "Shear Passage"}, description: {ja: "前方へ突進して切りつける。", en: "Dash forward and cut."}, cooldown_ticks: 65, resource_cost: 10}
params:
  dash_distance: {type: blocks, default: 9}
  dmg_physical: {type: number, default: 40}
frames:
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: hinge_a
    origin: caster
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: 0.45, w: 1.05, s: 0.30}}
    rotate:
      - {at: 6, for: 4, about: s, to: -22}
      - {at: 10, for: 3, about: s, to: 5}
      - {at: 13, for: 5, about: s, to: -17}
      - {at: 18, for: 3, about: s, to: -32}
  - id: hinge_b
    origin: caster
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: 0.45, w: 1.05, s: 0.20}}
    rotate:
      - {at: 0, for: 0, about: s, to: 64}
      - {at: 6, for: 4, about: s, to: 46}
      - {at: 10, for: 3, about: s, to: 9}
      - {at: 13, for: 5, about: s, to: -9}
      - {at: 18, for: 3, about: s, to: -24}
  - id: flower
    origin: caster
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: 0.45, w: 1.05}}
  - id: cut
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
    scale:
      - {at: 0, for: 0, to: {v: 0.1, w: 0.1, s: 0.1}}
      - {at: 0, for: 7, to: {v: 1, w: 1, s: 1}, ease: out_cubic}
machine:
  start: cast
  states:
    cast:
      # crouch anim 35 ticks from tick 2: the cast lives to tick 37 (dash ends at 25, the settle state holds the body anim)
      for: 37
      then: end
      start: wind
      on:
        - {event: cast.end, to: end}
      do:
        - {id: anim, op: body, target: caster, anim: crouch, speed: 1.0, at: 2, for: 35}

        # --- tick 2..10: five lavender folds and a spindle pinch together 1.2 ahead of the caster (the lunge starts at 11)
        - {id: fold, op: display, kind: text, text: "◆", color: "#8573B0", frame: body, pos: {v: 1.2, w: 0.6}, at: 2, for: 9, scale: [4.5, 1.5, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, alpha: 0.12}, {t: 3, alpha: 0.4, scale: [0.85, 0.85, 1]}, {t: 8, alpha: 0, scale: [0.6, 0.5, 1]}]}]}
        - {id: spindle, op: display, kind: text, text: " ", background: "#B2A3CF", frame: body, pos: {v: 1.2, w: 1.0}, at: 2, for: 9, scale: [0.48, 7.2, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, alpha: 0.12}, {t: 3, alpha: 0.35}, {t: 8, alpha: 0}]}]}

        # --- tick 6..22: two scissor halves snip about the hinge and shrink away; each plate sits at its centre along v, flat in the v-w plane
        - {id: a_blade, op: display, kind: block, block: gray_concrete, frame: hinge_a, pos: {v: 0.9, w: -0.15}, rotate: [{axis: s, deg: -7}], at: 6, for: 16, scale: [0.12, 0.25, 1.8], motion: [{law: grow, to: 0, at: 12, for: 3}]}
        - {id: a_edge, op: display, kind: block, block: iron_block, frame: hinge_a, pos: {v: 0.9, w: -0.05}, rotate: [{axis: s, deg: -10}], at: 6, for: 16, scale: [0.12, 0.05, 1.8], motion: [{law: grow, to: 0, at: 12, for: 3}]}
        - {id: a_handle, op: display, kind: block, block: black_concrete, frame: hinge_a, pos: {v: -0.8, w: 0.2}, rotate: [{axis: s, deg: 20}], at: 6, for: 16, scale: [0.12, 0.1, 0.6], motion: [{law: grow, to: 0, at: 12, for: 3}]}
        - {id: b_blade, op: display, kind: block, block: gray_concrete, frame: hinge_b, pos: {v: 0.9, w: -0.15}, rotate: [{axis: s, deg: -7}], at: 6, for: 16, scale: [0.12, 0.25, 1.8], motion: [{law: grow, to: 0, at: 12, for: 3}]}
        - {id: b_edge, op: display, kind: block, block: iron_block, frame: hinge_b, pos: {v: 0.9, w: -0.05}, rotate: [{axis: s, deg: -10}], at: 6, for: 16, scale: [0.12, 0.05, 1.8], motion: [{law: grow, to: 0, at: 12, for: 3}]}
        - {id: b_handle, op: display, kind: block, block: black_concrete, frame: hinge_b, pos: {v: -0.8, w: 0.2}, rotate: [{axis: s, deg: 20}], at: 6, for: 16, scale: [0.12, 0.1, 0.6], motion: [{law: grow, to: 0, at: 12, for: 3}]}
        - {id: flower, op: display, kind: block, block: white_concrete, frame: flower, rotate: [{axis: v, deg: "= 45 * i"}], at: 6, for: 16, times: 4, scale: [0.06, 0.06, 0.5], motion: [{law: grow, to: 0, at: 12, for: 3}]}

        # --- tick 13..22: the cut leaves a crescent of light behind the caster
        - {id: crescent, op: display, kind: sprite, sprite: couture-cut, frame: body, pos: {v: -0.2, w: 1.0}, at: 13, for: 9, rotate: [{axis: v, deg: -60}], size: [5.2, 4], billboard: center, brightness: {block: 15, sky: 15}, flipbook: {frames: 6, every: 2, loop: false}}
      states:
        wind:
          for: 11
          then: dash
        dash:
          # distance 9 over 5 ticks, radius 0.8, hit once, not invulnerable. The contact fx outlive the dash by 9 ticks, so the state lasts 14.
          for: 14
          then: settle
          enter:
            - {id: lunge, op: dash, speed: "= dash_distance / 5", for: 5, until: dash_hit.hit, direction: {forward: 1.0}, follow_pitch: false, stop_on_block: true, invulnerable: false, face_movement: false}
          do:
            # corridor sphere swept between the tick positions
            - id: dash_hit
              op: hit
              anchor: caster.body
              targets: enemies
              shape: {sphere: 0.8}
              at: 0
              every: 1
              for: 5
              window: once
              damage: {physical: = dmg_physical}
              ignore_invulnerability: true
              on:
                hit:
                  - {id: react, op: react, target: event.victim, flinch: true, for: 6}
                  # the cut lands on this victim: a white cross, four dark shards, a bloom, eight petals on a golden-angle spiral, sparks
                  - {id: cross, op: display, kind: block, block: white_concrete, frame: cut, pos: {w: 0.15}, for: 9, times: 2, rotate: [{axis: s, deg: "= 45 - 90 * i"}], scale: [0.05, 3.3, 0.05], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 3, scale: [0.8, 1, 0.8]}, {t: 8, scale: [0.2, 1, 0.2]}]}]}
                  - {id: smoke, op: display, kind: text, text: " ", background: "#28201C", frame: cut, pos: {v: -0.9, w: -0.6}, for: 7, scale: [1.2, 0.8, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 6, scale: [0.3, 0.3, 1]}]}, {law: fade, at: 0, for: 6, ease: out_cubic}]}
                  - {id: bloom, op: display, kind: text, text: " ", background: "#EAD9B0", frame: cut, pos: {w: 0.2}, for: 6, scale: [4, 2, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 1, scale: [2, 2, 1]}, {t: 5, scale: [2.5, 2.5, 1]}]}, {law: fade, at: 1, for: 4}]}
                  - {id: petal, op: display, kind: block, block: white_concrete, frame: cut, pos: {w: 0.1}, for: 8, times: 4, rotate: [{axis: v, deg: "= 45 * i"}], scale: [0.05, 0.05, 1.6], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 7, scale: [0.1, 0.1, 0.3]}]}]}
                  - {id: sparks, op: particle_def, def: stab-spark, frame: cut, pos: {w: 0.2}, every: 3, times: 2}
                  - {id: snd, op: sound, sound: entity.player.attack.strong, frame: cut, volume: 0.7, pitch: 1.1}
        settle: {for: 12, then: done}
        done: {final: true}
    end: {final: true}
