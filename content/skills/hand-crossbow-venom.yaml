# Match arsenal (wp/match-arsenal): simple PvP skill. One cast sound, a few particles.

id: hand-crossbow-venom

name:
  ja: "毒矢"
  en: "Venom Bolt"
description:
  ja: "対象を毒状態にする矢。"
  en: "A bolt that poisons the target."

archetype: projectile
cooldown_ticks: 60
resource_cost: 10
tags: [ ranged, physical ]

params:
  type: projectile
  launch_speed: 2.8
  max_lifetime_ticks: 40
  visual:
    trail_spacing: 0.4
    trail:
      - type: point
        particles:
          - { id: happy_villager, offset: { x: 0.04, y: 0.04, z: 0.04 } }
          - { id: dust, color: { r: 70, g: 170, b: 60 }, scale: 1.0 }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/gun-shot
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 1.3 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 0.9, height: -0.25 }
      particle_id: gun-muzzle-flash
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 20.0 }
          attribute: physical
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/gun-impact
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
    - type: apply_status
      targets: { type: target }
      status_id: poison
      effect_duration_ticks: { type: literal, value: 120 }
  hit_block:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: astera:weapons/gun-impact-block
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.5 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: hit-spark
  miss: []
  expire: []
