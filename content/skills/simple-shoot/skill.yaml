# astera/v3 hand port of the v2 skill.yaml + look.yaml (tick for tick).
# GAP: gameplay.expose [damage <- dmg_fire, flight_speed <- launch_speed] -> none (no v3 spelling; the numbers are inline below)
# GAP: v2 had no resource_cost; written as 0 here because v3 has no implicit default
# GAP: v2 impact spiral axis/start/sign/radius = draw(...) (per-cast shared random) -> none; fixed three orthogonal circles, radius 1.2, start 0, sign +, 10 deg step
# GAP: v2 per-particle position shift -> closest is an inline anchor `{of: contact.point, offset: {...}}`, not in ADR 2.2
# GAP: inline anchor `contact.point` used as a base frame; ADR only shows it bound in handlers
# The impact (ring r=0.4 + 3 spirals) is identical for hit, block and expire; hit also plays the impact sound. Kept inline in each handler.
apiVersion: astera/v3
kind: Skill
id: simple-shoot
item: rtm-blaster
meta:
  name: {ja: "シンプルシュート", en: "Simple Shoot"}
  description: {ja: "炎と橙色の粉塵の光線を撃ち、着弾点で輪状に弾ける。", en: "Fires a dense flame-and-ember beam that bursts into a ring where it lands."}
  cooldown_ticks: 4
  resource_cost: 0
  tags: [ranged, fire-family]
anchors:
  - {id: muzzle, anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}   # projectile origin
  - {id: front,  anchor: caster.eye, offset: {forward: 1.2}}                    # cast burst, was pt_aim_0_0_1p2
machine:
  start: fly
  states:
    fly:
      for: 44   # 40 flight ticks + impact tails (rings at +0..+3)
      then: end
      do:
        - {id: snd, op: sound, sound: "astera:skill/wand/cast", anchor: caster}
        - {id: cast_flame, op: particle, particle: flame, count: 50, extra: 0.2, anchor: front}
        - {id: cast_dust, op: particle, particle: dust, count: 20, offset: [0.2, 0.2, 0.2], extra: 0, color: "#ff6414", size: 1.6, anchor: front}
        - id: beam
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * 2.0"
          for: 40
          radius: 0.5
          hit: {targets: enemies, once: true}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {fire: 25.0}}
              - {id: snd_hit, op: sound, sound: "astera:skills/fire-impact", anchor: victim}
              - {id: flame, op: particle, particle: flame, count: 60, extra: 0.2, anchor: contact.point}
              - {id: lava, op: particle, particle: lava, count: 8, extra: 0.1, anchor: contact.point}
              # Ring waves at +0..+3: radius 0.4 + 0.46667 * wave (0.4, 0.8667, 1.3333, 1.8), 16 points.
              - id: ring
                at: 0
                every: 1
                times: 4
                do:
                  - {id: ring_flame, op: particle, particle: flame, count: 0, extra: 0.06, times: 16, offset: ["= cos(2 * pi * i / 16)", 0, "= -sin(2 * pi * i / 16)"], anchor: {of: contact.point, offset: {left: "= (0.4 + 0.46667 * parent.i) * cos(2 * pi * i / 16)", forward: "= -(0.4 + 0.46667 * parent.i) * sin(2 * pi * i / 16)"}}}
                  - {id: ring_dust, op: particle, particle: dust, count: 1, color: "#ff6414", size: 2.5, times: 16, anchor: {of: contact.point, offset: {left: "= (0.4 + 0.46667 * parent.i) * cos(2 * pi * i / 16)", forward: "= -(0.4 + 0.46667 * parent.i) * sin(2 * pi * i / 16)"}}}
              # Spirals: +0 uses angle index i+1, +1 continues with i+16 (15 points each, 10 deg apart), three orthogonal planes.
              - id: spiral
                at: 0
                every: 1
                times: 2
                do:
                  - {id: sp_a, op: particle, particle: dust, count: 1, color: "#ff6414", size: 2.0, times: 15, anchor: {of: contact.point, offset: {left: "= 1.2 * cos(radians(10 * (15 * parent.i + i + 1)))", forward: "= 1.2 * sin(radians(10 * (15 * parent.i + i + 1)))"}}}
                  - {id: sp_b, op: particle, particle: dust, count: 1, color: "#ff6414", size: 2.0, times: 15, anchor: {of: contact.point, offset: {up: "= 1.2 * cos(radians(10 * (15 * parent.i + i + 1)))", forward: "= 1.2 * sin(radians(10 * (15 * parent.i + i + 1)))"}}}
                  - {id: sp_c, op: particle, particle: dust, count: 1, color: "#ff6414", size: 2.0, times: 15, anchor: {of: contact.point, offset: {left: "= 1.2 * cos(radians(10 * (15 * parent.i + i + 1)))", up: "= 1.2 * sin(radians(10 * (15 * parent.i + i + 1)))"}}}
            block:
              - {id: flame, op: particle, particle: flame, count: 60, extra: 0.2, anchor: contact.point}
              - {id: lava, op: particle, particle: lava, count: 8, extra: 0.1, anchor: contact.point}
              - id: ring
                at: 0
                every: 1
                times: 4
                do:
                  - {id: ring_flame, op: particle, particle: flame, count: 0, extra: 0.06, times: 16, offset: ["= cos(2 * pi * i / 16)", 0, "= -sin(2 * pi * i / 16)"], anchor: {of: contact.point, offset: {left: "= (0.4 + 0.46667 * parent.i) * cos(2 * pi * i / 16)", forward: "= -(0.4 + 0.46667 * parent.i) * sin(2 * pi * i / 16)"}}}
                  - {id: ring_dust, op: particle, particle: dust, count: 1, color: "#ff6414", size: 2.5, times: 16, anchor: {of: contact.point, offset: {left: "= (0.4 + 0.46667 * parent.i) * cos(2 * pi * i / 16)", forward: "= -(0.4 + 0.46667 * parent.i) * sin(2 * pi * i / 16)"}}}
              - id: spiral
                at: 0
                every: 1
                times: 2
                do:
                  - {id: sp_a, op: particle, particle: dust, count: 1, color: "#ff6414", size: 2.0, times: 15, anchor: {of: contact.point, offset: {left: "= 1.2 * cos(radians(10 * (15 * parent.i + i + 1)))", forward: "= 1.2 * sin(radians(10 * (15 * parent.i + i + 1)))"}}}
                  - {id: sp_b, op: particle, particle: dust, count: 1, color: "#ff6414", size: 2.0, times: 15, anchor: {of: contact.point, offset: {up: "= 1.2 * cos(radians(10 * (15 * parent.i + i + 1)))", forward: "= 1.2 * sin(radians(10 * (15 * parent.i + i + 1)))"}}}
                  - {id: sp_c, op: particle, particle: dust, count: 1, color: "#ff6414", size: 2.0, times: 15, anchor: {of: contact.point, offset: {left: "= 1.2 * cos(radians(10 * (15 * parent.i + i + 1)))", up: "= 1.2 * sin(radians(10 * (15 * parent.i + i + 1)))"}}}
            expire:
              - {id: flame, op: particle, particle: flame, count: 60, extra: 0.2, anchor: contact.point}
              - {id: lava, op: particle, particle: lava, count: 8, extra: 0.1, anchor: contact.point}
              - id: ring
                at: 0
                every: 1
                times: 4
                do:
                  - {id: ring_flame, op: particle, particle: flame, count: 0, extra: 0.06, times: 16, offset: ["= cos(2 * pi * i / 16)", 0, "= -sin(2 * pi * i / 16)"], anchor: {of: contact.point, offset: {left: "= (0.4 + 0.46667 * parent.i) * cos(2 * pi * i / 16)", forward: "= -(0.4 + 0.46667 * parent.i) * sin(2 * pi * i / 16)"}}}
                  - {id: ring_dust, op: particle, particle: dust, count: 1, color: "#ff6414", size: 2.5, times: 16, anchor: {of: contact.point, offset: {left: "= (0.4 + 0.46667 * parent.i) * cos(2 * pi * i / 16)", forward: "= -(0.4 + 0.46667 * parent.i) * sin(2 * pi * i / 16)"}}}
              - id: spiral
                at: 0
                every: 1
                times: 2
                do:
                  - {id: sp_a, op: particle, particle: dust, count: 1, color: "#ff6414", size: 2.0, times: 15, anchor: {of: contact.point, offset: {left: "= 1.2 * cos(radians(10 * (15 * parent.i + i + 1)))", forward: "= 1.2 * sin(radians(10 * (15 * parent.i + i + 1)))"}}}
                  - {id: sp_b, op: particle, particle: dust, count: 1, color: "#ff6414", size: 2.0, times: 15, anchor: {of: contact.point, offset: {up: "= 1.2 * cos(radians(10 * (15 * parent.i + i + 1)))", forward: "= 1.2 * sin(radians(10 * (15 * parent.i + i + 1)))"}}}
                  - {id: sp_c, op: particle, particle: dust, count: 1, color: "#ff6414", size: 2.0, times: 15, anchor: {of: contact.point, offset: {left: "= 1.2 * cos(radians(10 * (15 * parent.i + i + 1)))", up: "= 1.2 * sin(radians(10 * (15 * parent.i + i + 1)))"}}}
        - {id: trail_flame, op: particle, particle: flame, count: 1, anchor: {of: beam, sweep: 0.25}, every: 1, until: beam.end}
        - {id: trail_dust, op: particle, particle: dust, count: 1, color: "#ff6414", size: 1.5, anchor: {of: beam, sweep: 0.25}, every: 1, until: beam.end}
    end: {final: true}
