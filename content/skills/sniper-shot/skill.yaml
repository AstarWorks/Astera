# sniper-shot: one fast, heavy, long-range bullet; the cast ends when the body ends.
apiVersion: astera/v3
kind: Skill
id: sniper-shot
item: sniper
meta:
  name: {ja: "狙撃", en: "Sniper Shot"}
  description: {ja: "遠距離から強烈な一発を撃ち込む。", en: "A single, devastating long-range shot."}
  cooldown_ticks: 50
  resource_cost: 12
  tags: [ranged, gun, physical]
params:
  speed: {type: number, default: 6.0}
  life:  {type: ticks, default: 50}
  dmg:   {type: number, default: 47.5}
anchors:
  - {id: muzzle, anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: flash,  anchor: caster.eye, offset: {forward: 0.55, left: -0.35, up: -0.65}, mode: follow}  # gun position: right of the eye, below it, so the FP tracer runs from the held item to the crosshair
  - {id: heart,  anchor: victim.center, mode: follow}
machine:
  tail: 4
  start: fly
  states:
    fly:
      on:
        - {event: bolt.end, to: end}
      do:
        - {id: fire_fx, use: gun-muzzle, with: {snd: "astera:weapons/rifle-crack", vol: 0.9, pitch: 0.8, smoke: false}, frames: {muzzle: flash}}
        - id: bolt
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * ${speed}"
          for: "${life}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: tracer_h, use: skill:gun-tracer, with: {thickness: 0.16}, frames: {muzzle: flash, tip: contact}}
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg}"}}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-crit", anchor: contact, volume: 0.8, pitch: 1.0}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
            block:
              - {id: tracer_b, use: skill:gun-tracer, with: {thickness: 0.16}, frames: {muzzle: flash, tip: contact}}
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact, volume: 0.5, pitch: 1.5}
              - {id: fx_blk, op: particle_def, def: hit-spark, anchor: contact}
            expire:
              - {id: tracer_e, use: skill:gun-tracer, with: {thickness: 0.16}, frames: {muzzle: flash, tip: contact}}
        # the visible round, riding the body
        - {id: slug, use: bullet-body, with: {item: "minecraft:iron_nugget", scale: 0.7, sweep: 0.4, start: 0, first: end_rod, off1: 0.01, next: crit}, frames: {body: bolt}, events: {body_end: bolt.end}}
    end: {final: true}
