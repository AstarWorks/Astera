# sniper-shot: one fast, heavy, long-range bullet; the cast ends when the body ends.
apiVersion: astera/v3
kind: Skill
id: sniper-shot
item: sniper
meta:
  name: {ja: "狙撃", en: "Sniper Shot"}
  description: {ja: "遠距離から強烈な一発を撃ち込む。", en: "A single, devastating long-range shot."}
  cooldown_ticks: 50
  resource_cost: 12
  tags: [ranged, gun, physical]
params:
  speed: {type: number, default: 6.0}
  life:  {type: ticks, default: 50}
  dmg:   {type: number, default: 47.5}
anchors:
  - {id: muzzle, anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: flash,  anchor: caster.eye, offset: {up: -0.25, forward: 1.0}, mode: follow}
  - {id: heart,  anchor: victim.center, mode: follow}
machine:
  start: fly
  states:
    fly:
      on:
        - {event: bolt.end, to: end}
      do:
        - {id: snd, op: sound, sound: "astera:weapons/rifle-crack", anchor: caster, volume: 0.9, pitch: 0.8}
        - {id: puff, op: particle_def, def: gun-muzzle-flash, anchor: flash}
        - id: bolt
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * ${speed}"
          for: "${life}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg}"}}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-crit", anchor: contact, volume: 0.8, pitch: 1.0}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
            block:
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact, volume: 0.5, pitch: 1.5}
              - {id: fx_blk, op: particle_def, def: hit-spark, anchor: contact}
        # the visible round, riding the body
        - {id: slug, op: display, kind: item, item: "minecraft:iron_nugget", context: fixed, anchor: bolt, scale: [0.7, 0.7, 0.7], at: 0, until: bolt.end}
        - {id: trail,   op: particle, particle: end_rod, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.01, 0.01, 0.01], at: 0, every: 1, until: bolt.end}
        - {id: trail_2, op: particle, particle: crit,    anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.02, 0.02, 0.02], at: 0, every: 1, until: bolt.end}
    end: {final: true}
