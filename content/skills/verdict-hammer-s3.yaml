id: verdict-hammer-s3
name:
  ja: 黒曜の審判
  en: Obsidian Judgment
description:
  ja: 杭を落とし、薙ぎ払い、最後の槌撃で杭を消費する。
  en: Summon nails, sweep forward, then bring the hammer down to consume the stakes.
