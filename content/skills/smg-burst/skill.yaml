# smg-burst: a light fast round, 8 degrees of flip, in the frame grammar (ADR-0314, ADR-0315). Same hand as revolver-shot: `gun` is rooted in the caster's eye / aim basis (v = aim,
# s = right, w = s x v) at the aimed position 0.57 ahead, 0.51 below the eye line, 0.30 right; the rig rides it, so the right arm is pinned
# onto the frame origin and the gun points along `v`. Recoil is a swing on the arm's 0.60 sphere: the hand kicks up 0.03 over 2 ticks and settles over 4,
# the muzzle flips up 8 degrees and back. `hit` / `blk`: one frame per victim / block contact, v the way the bullet came in.
# Flash, smoke, bolt and trail share ONE muzzle point on `gun`, v 0.54 / w 0.22 (grip -> tip x 0.94, content/frames/smg.yaml). No 3D, no ribbon.
# Schedule: hit tick, damage and end tick are arithmetic (speed, life); randomness is not used.
apiVersion: astera/v3
kind: Skill
id: smg-burst
item: smg
meta:
  name: {ja: "短機関銃", en: "SMG Burst"}
  description: {ja: "軽い弾をばら撒く。", en: "Sprays light rounds."}
  cooldown_ticks: 4
  resource_cost: 2
  tags: [ranged, gun, physical]
params:
  dmg:   {type: number, default: 5.5}
  speed: {type: number, default: 3.2}
  life:  {type: ticks, default: 30}
frames:
  - id: gun
    origin: caster.eye
    v: aim
    w: s x v
    s: right
    move:
      - {at: 0, for: 0, to: {v: 0.57, w: -0.51, s: 0.30}}                      # aimed: straight out from the right shoulder
      - {at: 0, for: 2, to: {v: 0.58, w: -0.48, s: 0.30}, ease: out_quad}      # recoil: the arm kicks up
      - {at: 2, for: 4, to: {v: 0.57, w: -0.51, s: 0.30}, ease: in_out_sine}   # settle
    rotate:
      - {at: 0, for: 2, about: s, to: 8, ease: out_quad}                      # muzzle flip
      - {at: 2, for: 4, about: s, to: 0, ease: in_out_sine}
  - id: hit
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
  - id: blk
    on: event.block
    each: true
    origin: contact
    v: incoming
    w: up
    s: v x w
machine:
  start: fire
  tail: 10
  states:
    fire:
      on:
        - {event: bolt.end, to: end}
      do:
        - {id: rig, op: rig, frame: gun, for: 10, detach: true}
        - {id: snd, op: sound, at: 0, sound: "astera:weapons/gun-shot", frame: gun, volume: 0.5, pitch: 1.6}
        - {id: flash, op: particle_def, at: 0, def: gun-muzzle-flash, frame: gun, pos: {v: 0.54, w: 0.22}}
        - id: bolt
          op: projectile
          frame: gun
          pos: {v: 0.54, w: 0.22}
          velocity: "= look(caster) * ${speed}"
          for: "${life}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg}"}}
              - {id: snd_hit, op: sound, sound: "astera:weapons/gun-impact", frame: hit, volume: 0.5, pitch: 1.3, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, frame: hit, pos: {v: -0.2}, detach: true}
            block:
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", frame: blk, volume: 0.5, pitch: 1.5, detach: true}
              - {id: fx_blk0, op: particle_def, def: hit-spark, frame: blk, pos: {v: -0.2}, detach: true}
        - {id: trail0, op: particle, particle: dust, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.02, 0.02, 0.02], color: "#ffe9a8", size: 0.3, at: 1, every: 1, until: bolt.end}
        - {id: trail1, op: particle, particle: dust, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.03, 0.03, 0.03], color: "#9a9a9a", size: 0.35, at: 1, every: 1, until: bolt.end}
    end: {final: true}
