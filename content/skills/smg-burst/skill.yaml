# smg-burst: a light fast bullet; the cast ends when the body ends.
apiVersion: astera/v3
kind: Skill
id: smg-burst
item: smg
meta:
  name: {ja: "短機関銃", en: "SMG Burst"}
  description: {ja: "軽い弾をばら撒く。", en: "Sprays light rounds."}
  cooldown_ticks: 4
  resource_cost: 2
  tags: [ranged, gun, physical]
params:
  dmg:   {type: number, default: 5.5}
  speed: {type: number, default: 3.2}
  life:  {type: ticks, default: 30}
anchors:
  - {id: muzzle, anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: flash,  anchor: caster.eye, offset: {up: -0.25, forward: 0.9}, mode: follow}
  - {id: heart,  anchor: victim.center, mode: follow}
machine:
  tail: 3
  start: fly
  states:
    fly:
      on:
        - {event: bolt.end, to: end}
      do:
        - {id: snd, op: sound, sound: "astera:weapons/gun-shot", anchor: caster, volume: 0.5, pitch: 1.6}
        - {id: puff, op: particle_def, def: gun-muzzle-flash, anchor: flash}
        - id: bolt
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * ${speed}"
          for: "${life}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: tracer_h, op: ribbon, from: flash, to: contact, thickness: 0.035, color: "#EEFFF0B0", for: 3, detach: true}
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg}"}}
              - {id: snd_hit, op: sound, sound: "astera:weapons/gun-impact", anchor: contact, volume: 0.5, pitch: 1.3}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
            block:
              - {id: tracer_b, op: ribbon, from: flash, to: contact, thickness: 0.035, color: "#EEFFF0B0", for: 3, detach: true}
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact, volume: 0.5, pitch: 1.5}
              - {id: fx_blk, op: particle_def, def: hit-spark, anchor: contact}
        # the visible round, riding the body
        - {id: slug, op: display, kind: item, item: "minecraft:iron_nugget", context: fixed, anchor: bolt, scale: [0.4, 0.4, 0.4], at: 0, until: bolt.end}
        - {id: tracer, op: ribbon, of: bolt, history: 3, style: crisp, width: 0.035, color: "#EEFFF0B0", double_sided: true, for: "${life}"}
        - {id: trail, op: particle, particle: crit, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.03, 0.03, 0.03], at: 0, every: 1, until: bolt.end}
    end: {final: true}
