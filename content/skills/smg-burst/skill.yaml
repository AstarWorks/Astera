# smg-burst: a light fast bullet; the cast ends when the body ends.
apiVersion: astera/v3
kind: Skill
id: smg-burst
item: smg
meta:
  name: {ja: "短機関銃", en: "SMG Burst"}
  description: {ja: "軽い弾をばら撒く。", en: "Sprays light rounds."}
  cooldown_ticks: 4
  resource_cost: 2
  tags: [ranged, gun, physical]
params:
  dmg:   {type: number, default: 5.5}
  speed: {type: number, default: 3.2}
  life:  {type: ticks, default: 30}
anchors:
  - {id: muzzle, anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: flash,  anchor: caster.eye, offset: {forward: 0.45, left: -0.35, up: -0.65}, mode: follow}  # gun position: right of the eye, below it, so the FP tracer runs from the held item to the crosshair
  - {id: heart,  anchor: victim.center, mode: follow}
machine:
  tail: 4
  start: fly
  states:
    fly:
      on:
        - {event: bolt.end, to: end}
      do:
        - {id: fire_fx, use: gun-muzzle, with: {snd: "astera:weapons/gun-shot", vol: 0.5, pitch: 1.6, smoke: false}, frames: {muzzle: flash}}
        - id: bolt
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * ${speed}"
          for: "${life}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: tracer_h, use: skill:gun-tracer, with: {thickness: 0.07}, frames: {muzzle: flash, tip: contact}}
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg}"}}
              - {id: snd_hit, op: sound, sound: "astera:weapons/gun-impact", anchor: contact, volume: 0.5, pitch: 1.3}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
            block:
              - {id: tracer_b, use: skill:gun-tracer, with: {thickness: 0.07}, frames: {muzzle: flash, tip: contact}}
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact, volume: 0.5, pitch: 1.5}
              - {id: fx_blk, op: particle_def, def: hit-spark, anchor: contact}
            expire:
              - {id: tracer_e, use: skill:gun-tracer, with: {thickness: 0.07}, frames: {muzzle: flash, tip: contact}}
        # the visible round, riding the body
        - {id: slug, use: bullet-body, with: {item: "minecraft:iron_nugget", scale: 0.4, sweep: 0.4, start: 0, off1: 0.03, second: false}, frames: {body: bolt}, events: {body_end: bolt.end}}
    end: {final: true}
