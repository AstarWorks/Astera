apiVersion: astera/v3
kind: Skill
id: smg-burst
item: smg
meta:
  name: {ja: "短機関銃", en: "SMG Burst"}
  description: {ja: "軽い弾をばら撒く。", en: "Sprays light rounds."}
  cooldown_ticks: 4
  resource_cost: 2
  tags: [ranged, gun, physical]
anchors:
  - {id: muzzle, anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: flash,  anchor: caster.eye, offset: {up: -0.25, forward: 0.9}}
  - {id: heart,  anchor: victim.root, offset: {up: 1.2}}  # GAP(Q2): v2 enemy frame origin = feet+0.8 fixed; victim.body (live hitbox centre, 0.9) or a fixed chest point is the founder's choice (Q2)
machine:
  start: fly
  states:
    fly:
      for: 31      # max flight 30 + 1 so the end handlers fit
      then: end
      do:
        - {id: snd, op: sound, sound: "astera:weapons/gun-shot", anchor: caster, volume: 0.5, pitch: 1.6}
        - {id: puff, op: particle_def, def: gun-muzzle-flash, anchor: flash}
        - id: bolt
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * 3.2"
          for: 30
          radius: 0.5
          hit: {targets: enemies, once: true}     # v2 projectile ended on its first victim
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {physical: 5.5}}
              - {id: snd_hit, op: sound, sound: "astera:weapons/gun-impact", anchor: contact, volume: 0.5, pitch: 1.3}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
            block:
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact, volume: 0.5, pitch: 1.5}
              - {id: fx_blk, op: particle_def, def: hit-spark, anchor: contact}
        - {id: trail, op: particle, particle: crit, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.03, 0.03, 0.03], at: 0, every: 1, until: bolt.end}
    end: {final: true}
