# katana-iaido: sheathed draw: the katana held low at the hip, then a rising cut along the dash (wind-up 2 ticks, dash 3 ticks, every-tick hit).
# Frames (ADR-0314, ADR-0315), the gameplay (hit tick, shape, damage, knockback, cooldown, cast length) is unchanged:
#   blade  - the katana. Origin at the caster feet, moved along a hand path (hip draw low at the right -> rising cut across to the high left -> guard). Long axis along v (grip at the origin,
#            tip at v 1.03), edge along w. Roll -45 about v lays the edge on the rising diagonal, the cut is a turn about s (v moves towards w): the edge leads. The wind-up
#            keeps the point low at the right (-50), the cut rises through the target (+80), `reset` eases back.
#            The engine pins the right hand to the origin, so every `move:` point lies inside the 0.60 reach of the right shoulder (v 0 / w 1.29 / s 0.29).
#   body   - the caster's feet, v forward / w up / s right: sounds and the cast fx.
#   wound  - one per victim at the victim's centre, v the way the blow came in: the hit sound and the hit spark.
#   edge   - line along the blade, outer half (v 0.65 .. 1.03) for the crit trail; edge_full (v 0.26 .. 1.03) for the electric spark and the sweep arc.
apiVersion: astera/v3
kind: Skill
id: katana-iaido
item: katana
meta:
  name: {ja: "抜刀斬り", en: "Iaido"}
  description: {ja: "一瞬で踏み込み、すれ違いざまに斬る。", en: "Snaps forward and cuts whoever you pass."}
  cooldown_ticks: 110
  resource_cost: 10
  tags: [melee, movement, physical]
params:
  dash_distance: {type: blocks, default: 4}
  dash_ticks: {type: ticks, default: 3}
  dmg_physical: {type: number, default: 40.0}
frames:
  - id: blade
    origin: caster
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: 0.39, w: 0.85, s: 0.43}}  # guard
      - {at: 0, for: 1, to: {v: 0.12, w: 0.78, s: 0.59}}
      - {at: 1, for: 1, to: {v: 0.22, w: 1.03, s: -0.2}}
      - {at: 2, for: 1, to: {v: 0.12, w: 1.36, s: -0.29}}
      - {at: 5, for: 1, to: {v: 0.16, w: 1.27, s: -0.29}}
      - {at: 6, for: 1, to: {v: 0.18, w: 1.18, s: -0.27}}
      - {at: 7, for: 1, to: {v: 0.25, w: 0.95, s: -0.14}}
      - {at: 8, for: 1, to: {v: 0.42, w: 0.92, s: 0.07}}
      - {at: 9, for: 1, to: {v: 0.4, w: 0.85, s: 0.25}}
      - {at: 10, for: 1, to: {v: 0.39, w: 0.84, s: 0.37}}
      - {at: 11, for: 1, to: {v: 0.39, w: 0.85, s: 0.41}}
      - {at: 12, for: 1, to: {v: 0.39, w: 0.85, s: 0.43}}
    rotate:
      - {at: 0, for: 0, about: v, to: -45}  # roll the edge into the cut plane
      - {at: 0, for: 1, about: s, to: -50, ease: in_out_sine}  # wind-up turn
      - {at: 1, for: 3, about: s, to: 80, ease: out_cubic}  # the cut, edge first
      - {at: 4, for: 9, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: wound
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
lines:
  edge: {frame: blade, from: {v: 0.65}, to: {v: 1.03}}
  edge_full: {frame: blade, from: {v: 0.26}, to: {v: 1.03}}
machine:
  start: windup
  tail: 11
  states:
    windup:
      for: 2
      then: dash
      do:
        - {id: rig, op: rig, frame: blade, for: 13, detach: true}
    dash:
      for: "= dash_ticks"
      then: end
      enter:
        - {id: snd_dash, op: sound, sound: "astera:weapons/dash-whoosh", frame: body, volume: 1.0, pitch: 1.4, detach: true}
        - {id: fx_dash, op: particle_def, def: dash-cloud, frame: body, pos: {w: 0.2}, detach: true}
        - {id: lunge, op: dash, speed: "= ${dash_distance} / ${dash_ticks}", for: "${dash_ticks}", direction: {forward: 1}, follow_pitch: false, stop_on_block: true, invulnerable: false, face_movement: false, pass_through: true}
        # dash_strike corridor: capsule radius 1.0, hit_once, no early end (the dash runs through everyone).
        - id: strike
          op: hit
          frame: body
          pos: {w: 0.9}
          at: 0
          every: 1
          for: "${dash_ticks}"
          shape: {sphere: 1.0}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", frame: wound, volume: 1.0, pitch: 1.0, detach: true}
        # the whole katana lies inside the caster eye volume (check 16): the lingering crit streak stays on the outer half at a slower cadence; the dense streak is the electric_spark trail_edge below
        - {id: trail_fx, op: particle, particle: crit, along: edge, samples: 2, count: 1, extra: 0.04, at: 0, every: 2, for: 4, detach: true}
        - {id: trail_edge, op: particle, particle: electric_spark, along: edge_full, samples: 8, count: 2, extra: 0.02, at: 0, every: 1, for: 11, detach: true}
        - {id: trail_arc, op: particle, particle: sweep_attack, along: edge_full, samples: 2, count: 1, at: 0, every: 2, for: 10, detach: true}
    end: {final: true}
