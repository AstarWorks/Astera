# Wind-up W = 2 ticks (round_half_up(5 / attack_speed 2.5)): the katana is held low at the hip (sheathed draw), the dash and the every-tick hit start at tick 2.
# The cast ends with the dash; the rig (draw -> rising cut along the dash -> settle) and trail are detach: true.
apiVersion: astera/v3
kind: Skill
id: katana-iaido
item: katana
meta:
  name: {ja: "抜刀斬り", en: "Iaido"}
  description: {ja: "一瞬で踏み込み、すれ違いざまに斬る。", en: "Snaps forward and cuts whoever you pass."}
  cooldown_ticks: 110
  resource_cost: 10
  tags: [melee, movement, physical]
params:
  dash_distance: {type: blocks, default: 4}
  dash_ticks: {type: ticks, default: 3}
  dmg_physical: {type: number, default: 40.0}
anchors:
  - {id: feet, anchor: caster, offset: {up: 0.2}, mode: snapshot}                  # was pt_caster_0_0p2_0
machine:
  start: windup
  tail: 11
  states:
    windup:
      for: 2
      then: dash
      do:
        - id: rig
          op: rig
          parent: caster
          mount: caster.hand_r
          rest: [{axis: left, deg: 72}]
          for: 13
          detach: true
          swing:
            - {at: 0, for: 2, from: {left: 0.2, up: -0.1, forward: 0.9}, to: {left: -0.9, up: -0.3, forward: 0.2}, edge: trailing, ease: in_out_sine}
            - {at: 2, for: 3, to: {left: 0.9, up: 0.3, forward: 0.4}, edge: leading, roll: 15, ease: out_cubic}
            - {at: 5, for: 8, to: {left: 0.0, up: 0.55, forward: 0.8}, edge: trailing, ease: in_out_sine}
    dash:
      for: "= dash_ticks"
      then: end
      enter:
        - {id: snd_dash, op: sound, sound: "astera:weapons/dash-whoosh", anchor: caster, volume: 1.0, pitch: 1.4, detach: true}
        - {id: fx_dash, op: particle_def, def: dash-cloud, anchor: feet, detach: true}
        - {id: lunge, op: dash, speed: "= ${dash_distance} / ${dash_ticks}", for: "${dash_ticks}", direction: {forward: 1}, follow_pitch: false, stop_on_block: true, invulnerable: false, face_movement: false, pass_through: true}
        # dash_strike corridor: capsule radius 1.0, hit_once, no early end (the dash runs through everyone).
        - id: strike
          op: hit
          anchor: caster.body
          at: 0
          every: 1
          for: "${dash_ticks}"
          shape: {sphere: 1.0}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 1.0, pitch: 1.0, detach: true}
        # readable cut: bright non-lingering sparks (electric_spark, sweep_attack) carry the edge so check 16 stays clear near the eye; crit keeps its original cadence
        - {id: trail_fx, use: swing-trail, with: {samples: 3, span: 11, every: 3}, frames: {weapon: /windup/rig}, detach: true}
        - {id: trail_edge, op: particle, particle: electric_spark, anchor: {of: /windup/rig.root, to: /windup/rig.tip, samples: 8}, count: 2, extra: 0.02, at: 0, every: 1, for: 11, detach: true}
        - {id: trail_arc, op: particle, particle: sweep_attack, anchor: {of: /windup/rig.root, to: /windup/rig.tip, samples: 2}, count: 1, at: 0, every: 2, for: 10, detach: true}
    end: {final: true}
