# Wave H 5content-depth (ADR-0125): fire-family AOE projectile.
#
# Designed as the second canonical fire skill (burst role: heavy hit + burn DoT).
# Wider hit_entity damage list + higher chance burn application — the
# archetypal "AOE that leaves a DoT" pattern.

id: flame-burst

name:
  ja: "炎の爆発"
  en: "Flame Burst"
description:
  ja: "広範囲に炎属性ダメージを与え、対象に燃焼を付与する。"
  en: "A wide fire-attribute blast that ignites every target it touches."

archetype: projectile
cooldown_ticks: 80
resource_cost: 25              # energy
tags: [ ranged, fire-family, aoe ]

params:
  type: projectile
  launch_speed: 1.4
  max_lifetime_ticks: 50

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.blaze.shoot
    - type: spawn_particle
      targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 1.5, z: 0.5 } } }
      particle_id: example-burst
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 12.0 }
          attribute: fire
    - type: apply_status
      targets: { type: target }
      status_id: burn
      effect_duration_ticks: { type: literal, value: 80 }
      chance: { type: literal, value: 0.85 }
  hit_block:
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: example-burst
  miss:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.sweep
  expire: []
