# Wave H 5content-depth (ADR-0125): fire-family AOE projectile.
#
# Designed as the second canonical fire skill (paired with example-blast).
# Wider hit_entity damage list + higher chance burn application — the
# archetypal "AOE that leaves a DoT" pattern.

id: flame-burst

name:
  ja: "炎の爆発"
  en: "Flame Burst"
description:
  ja: "広範囲に炎属性ダメージを与え、対象に燃焼を付与する。"
  en: "A wide fire-attribute blast that ignites every target it touches."

archetype: projectile
cooldown_ticks: 80
tags: [ ranged, fire-family, aoe ]

params:
  type: projectile
  launch_speed: 1.4
  max_lifetime_ticks: 50
  damage:
    - base: { kind: literal, value: 12.0 }
      attribute: fire

phases:
  archetype: projectile
  cast:
    - type: play_sound
      targets: { kind: caster }
      sound_id: skills/blast-cast
    - type: spawn_particle
      targets: { kind: caster_offset, offset: { kind: literal, value: { x: 0.0, y: 1.5, z: 0.5 } } }
      particle_id: example-burst
  hit_entity:
    - type: damage
      targets: { kind: target }
      components:
        - base: { kind: literal, value: 12.0 }
          attribute: fire
    - type: apply_status
      targets: { kind: target }
      status_id: burn
      effect_duration_ticks: { kind: literal, value: 80 }
      chance: { kind: literal, value: 0.85 }
  hit_block:
    - type: spawn_particle
      targets: { kind: hit_location }
      particle_id: example-burst
  miss:
    - type: play_sound
      targets: { kind: caster }
      sound_id: skills/whiff
  expire: []
