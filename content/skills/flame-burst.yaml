# Wave H 5content-depth (ADR-0125): fire-family AOE projectile.
#
# Designed as the second canonical fire skill (burst role: heavy hit + burn DoT).
# Wider hit_entity damage list + higher chance burn application — the
# archetypal "AOE that leaves a DoT" pattern.

id: flame-burst

name:
  ja: "炎の爆発"
  en: "Flame Burst"
description:
  ja: "広範囲に炎属性ダメージを与え、対象に燃焼を付与する。"
  en: "A wide fire-attribute blast that ignites every target it touches."

archetype: projectile
cooldown_ticks: 80
resource_cost: 25              # mana
tags: [ ranged, fire-family, aoe ]

params:
  type: projectile
  launch_speed: 1.4
  max_lifetime_ticks: 50
  visual:
    trail: [ fire-trail, fire-smoke ]
    display: { variant: item, material: minecraft:fire_charge, scale: 0.6 }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.blaze.shoot
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 1.1 }
    - type: play_sound
      targets: { type: caster }
      sound_id: item.firecharge.use
      volume: { type: literal, value: 0.6 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.0, height: -0.2 }
      particle_id: fire-cast
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 12.0 }
          attribute: fire
    - type: apply_status
      targets: { type: target }
      status_id: burn
      effect_duration_ticks: { type: literal, value: 80 }
      chance: { type: literal, value: 0.85 }
    - type: play_sound
      targets: { type: target }
      sound_id: entity.generic.explode
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.3 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.0, z: 0.0 } } }
      particle_id: fire-impact
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.0, z: 0.0 } } }
      particle_id: fire-impact-smoke
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.arrow.hit_player
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.2 }
  hit_block:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: entity.generic.explode
      volume: { type: literal, value: 0.4 }
      pitch: { type: literal, value: 1.4 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: fire-impact
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: fire-impact-smoke
  miss: []
  expire:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: block.fire.extinguish
      volume: { type: literal, value: 0.4 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: fire-impact-smoke
