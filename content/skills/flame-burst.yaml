# Wave H 5content-depth (ADR-0125): fire-family AOE projectile.
#
# Designed as the second canonical fire skill (burst role: heavy hit + burn DoT).
# Wider hit_entity damage list + higher chance burn application — the
# archetypal "AOE that leaves a DoT" pattern.

id: flame-burst

name:
  ja: "炎の爆発"
  en: "Flame Burst"
description:
  ja: "広範囲に炎属性ダメージを与え、対象に燃焼を付与する。"
  en: "A wide fire-attribute blast that ignites every target it touches."

archetype: projectile
cooldown_ticks: 80
resource_cost: 25              # energy
tags: [ ranged, fire-family, aoe ]

params:
  type: projectile
  launch_speed: 1.4
  max_lifetime_ticks: 50
  visual:
    # Budget: ~8 particles per 0.25-block sample, ~25 samples / 2 ticks => ~100 spawns/tick while in flight.
    trail_spacing: 0.3
    trail:
      - type: point
        particles:
          - { id: flame, count: 3, extra: 0.02, offset: { x: 0.12, y: 0.12, z: 0.12 } }
          - { id: dust, count: 2, offset: { x: 0.1, y: 0.1, z: 0.1 }, color: { r: 255, g: 120, b: 20 }, scale: 1.6 }
          - { id: lava, count: 1, offset: { x: 0.08, y: 0.08, z: 0.08 } }
      - type: point
        particles:
          - { id: smoke, offset: { x: 0.05, y: 0.05, z: 0.05 } }
    display: { variant: item, material: minecraft:fire_charge, scale: 0.9 }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.blaze.shoot
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 1.1 }
    - type: play_sound
      targets: { type: caster }
      sound_id: item.firecharge.use
      volume: { type: literal, value: 0.6 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.0, height: -0.2 }
      particle_id: fire-cast
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 12.0 }
          attribute: fire
    - type: apply_status
      targets: { type: target }
      status_id: burn
      effect_duration_ticks: { type: literal, value: 80 }
      chance: { type: literal, value: 0.85 }
    - type: play_sound
      targets: { type: target }
      sound_id: entity.generic.explode
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.3 }
    # Impact: fireball core + ember ring that expands to 3 blocks over 6 ticks (~120 + 6*16*3 = ~410 spawns once).
    - type: schedule_particle_animation
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.0, z: 0.0 } } }
      animation:
        - type: point
          particles:
            - { id: explosion, count: 1 }
            - { id: flame, count: 60, extra: 0.25 }
            - { id: lava, count: 12, extra: 0.1 }
            - { id: large_smoke, count: 6, extra: 0.04 }
        - type: ring
          period_ticks: 6
          points: 16
          start_radius: 0.5
          end_radius: 3.0
          particles:
            - { id: flame, count: 0, extra: 0.08 }
            - { id: dust, color: { r: 255, g: 110, b: 20 }, scale: 2.0 }
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.arrow.hit_player
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.2 }
  hit_block:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: entity.generic.explode
      volume: { type: literal, value: 0.4 }
      pitch: { type: literal, value: 1.4 }
    - type: schedule_particle_animation
      targets: { type: hit_location }
      animation:
        - type: point
          particles:
            - { id: explosion, count: 1 }
            - { id: flame, count: 50, extra: 0.22 }
            - { id: large_smoke, count: 4, extra: 0.04 }
        - type: ring
          period_ticks: 6
          points: 16
          start_radius: 0.5
          end_radius: 2.5
          particles:
            - { id: flame, count: 0, extra: 0.08 }
            - { id: dust, color: { r: 255, g: 110, b: 20 }, scale: 2.0 }
  miss: []
  expire:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: block.fire.extinguish
      volume: { type: literal, value: 0.4 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: fire-impact-smoke
