# war-axe-whirl: spin: coil to the right-back, then a full turn of the axe around the caster (wind-up 5 ticks, burst at tick 5).
# Frames (ADR-0314, ADR-0315), the gameplay (hit tick, shape, damage, knockback, cooldown, cast length) is unchanged:
#   blade  - the war axe. Origin at the caster feet, moved along a short hand path (guard -> coiled to the right-back -> across the front -> guard). Long axis along v (grip at the origin, head at v 0.60..0.94), edge along w.
#            The whirl is a turn about w (up): -120 to coil the head to the right-back, then +360 in six ticks (the burst hits at tick 5) and +80 more; a roll of -90 about v, listed
#            after the turn, lays the edge along the tangent, so the edge leads the spin.
#            The engine pins the right hand to the origin, so every `move:` point lies inside the 0.60 reach of the right shoulder (v 0 / w 1.29 / s 0.29).
#   body   - the caster's feet, v forward / w up / s right: sounds and the cast fx.
#   wound  - one per victim at the victim's centre, v the way the blow came in: the hit sound and the hit spark.
#   edge   - line along the axe head (v 0.60 .. 0.94), what the trail rows draw along.
apiVersion: astera/v3
kind: Skill
id: war-axe-whirl
item: war-axe
meta:
  name: {ja: "旋風斬り", en: "Whirl"}
  description: {ja: "回転して周囲の敵をまとめて斬る。", en: "Spins and cuts everyone around you."}
  cooldown_ticks: 120
  resource_cost: 15
  tags: [aoe, physical]
params:
  radius:       {type: blocks, default: 3.5}
  dmg_physical: {type: number, default: 35}
frames:
  - id: blade
    origin: caster
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: 0.41, w: 0.89, s: 0.47}}  # guard
      - {at: 0, for: 1, to: {v: 0.4, w: 0.91, s: 0.53}}
      - {at: 1, for: 1, to: {v: 0.32, w: 0.99, s: 0.7}}
      - {at: 2, for: 1, to: {v: 0.18, w: 1.13, s: 0.84}}
      - {at: 3, for: 1, to: {v: 0.11, w: 1.2, s: 0.87}}
      - {at: 4, for: 1, to: {v: 0.14, w: 1.17, s: 0.86}}
      - {at: 5, for: 1, to: {v: 0.26, w: 1.06, s: 0.78}}
      - {at: 6, for: 1, to: {v: 0.39, w: 0.94, s: 0.58}}
      - {at: 7, for: 1, to: {v: 0.44, w: 0.88, s: 0.29}}
      - {at: 8, for: 1, to: {v: 0.42, w: 0.89, s: 0.13}}
      - {at: 9, for: 1, to: {v: 0.41, w: 0.9, s: 0.1}}
      - {at: 10, for: 1, to: {v: 0.43, w: 0.88, s: 0.21}}
      - {at: 11, for: 1, to: {v: 0.43, w: 0.88, s: 0.4}}
      - {at: 12, for: 1, to: {v: 0.41, w: 0.89, s: 0.47}}
    rotate:
      - {at: 0, for: 4, about: w, to: -120, ease: out_quad}                     # coil: the axe head swings to the right-back
      - {at: 4, for: 6, about: w, to: 240, ease: in_quad}                       # one full turn (360) around the caster, ending at the right-back again
      - {at: 10, for: 3, about: w, to: 320, ease: out_cubic}                    # on through the front
      - {at: 0, for: 0, about: v, to: -90}                                      # edge laid along the tangent of the turn (listed after the turn: the turn is about the world up axis)
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: wound
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
lines:
  edge: {frame: blade, from: {v: 0.60}, to: {v: 0.94}}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 5
      then: strike
      do:
        - {id: snd_windup, op: sound, sound: item.armor.equip_iron, frame: body, volume: 0.5, pitch: 0.8}
        # weapon rig: coil to the right-back, then three 120 degree arcs of the tip around the caster (right -> front -> left -> right) over the cut; the hit is tick 5.
        # Detached so it plays on through the strike and the tail.
        - {id: rig, op: rig, frame: blade, for: 13, detach: true}
    strike:
      for: 1
      then: end
      do:
        - id: burst
          op: hit
          at: 0
          frame: body
          shape: {sphere: "${radius}"}
          targets: enemies
          ignore_invulnerability: false
          # linear falloff: full damage at the centre, half at the edge
          damage: {physical: "= ${dmg_physical} * (1.0 - 0.5 * dist(event.victim, caster) / ${radius})"}
          window: once
          on:
            hit:
              - {id: react, op: react, target: event.victim, flinch: true, push: {back: 0.4}, for: 6}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", frame: wound, volume: 0.7, pitch: 1.0, detach: true}
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", frame: body, volume: 1.0, pitch: 1.2, detach: true}
        - {id: fx_crit, op: particle, particle: crit, frame: body, pos: {w: 0.15}, count: 0, extra: 0.03, detach: true}
        - {id: fx_dust, op: particle, particle: dust, frame: body, pos: {w: 0.15}, count: 1, color: "#dcdcdc", size: 1.4, detach: true}
        - {id: trail, op: particle, particle: crit, along: edge, samples: 2, count: 1, extra: 0.05, at: 0, every: 1, for: 4, detach: true}
    end: {final: true}
