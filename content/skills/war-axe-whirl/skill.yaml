apiVersion: astera/v3
kind: Skill
id: war-axe-whirl
item: war-axe
meta:
  name: {ja: "旋風斬り", en: "Whirl"}
  description: {ja: "回転して周囲の敵をまとめて斬る。", en: "Spins and cuts everyone around you."}
  cooldown_ticks: 120
  resource_cost: 15
  tags: [aoe, physical]
params:
  radius:       {type: blocks, default: 3.5}
  dmg_physical: {type: number, default: 35}
anchors:
  - {id: ring_pt, anchor: caster, offset: {up: 0.15}, mode: follow}
machine:
  start: whirl
  states:
    whirl:
      for: 1
      then: end
      do:
        - id: burst
          op: hit
          at: 0
          anchor: caster
          shape: {sphere: "${radius}"}
          targets: enemies
          ignore_invulnerability: false
          # linear falloff: full damage at the centre, half at the edge
          damage: {physical: "= ${dmg_physical} * (1.0 - 0.5 * dist(event.victim, caster) / ${radius})"}
          window: once
          on:
            hit:
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.0}
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 1.0, pitch: 1.2}
        - {id: fx_crit, op: particle, particle: crit, anchor: ring_pt, at: 0, count: 0, extra: 0.03}
        - {id: fx_dust, op: particle, particle: dust, anchor: ring_pt, at: 0, count: 1, color: "#dcdcdc", size: 1.4}
    end: {final: true}
