# war-axe-whirl: wind-up 5 ticks (rule round(5 / attack_speed)), hit at tick 5. Spin: coil to the right-back, then a full turn of the blade around the caster.
apiVersion: astera/v3
kind: Skill
id: war-axe-whirl
item: war-axe
meta:
  name: {ja: "旋風斬り", en: "Whirl"}
  description: {ja: "回転して周囲の敵をまとめて斬る。", en: "Spins and cuts everyone around you."}
  cooldown_ticks: 120
  resource_cost: 15
  tags: [aoe, physical]
params:
  radius:       {type: blocks, default: 3.5}
  dmg_physical: {type: number, default: 35}
anchors:
  - {id: ring_pt, anchor: caster, offset: {up: 0.15}, mode: follow}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 5
      then: strike
      do:
        - {id: snd_windup, op: sound, sound: item.armor.equip_iron, anchor: caster, volume: 0.5, pitch: 0.8}
        # weapon rig: coil to the right-back, then three 120 degree arcs of the tip around the caster (right -> front -> left -> right) over the cut; the hit is tick 5.
        # Detached so it plays on through the strike and the tail.
        - id: rig
          op: rig
          parent: caster
          mount: caster.hand_r
          rest: [{axis: left, deg: 72}]
          detach: true
          for: 13
          swing:
            - {at: 0, for: 4, from: {left: 0.000, up: 0.507, forward: 0.862}, to: {left: -0.593, up: 0.148, forward: -0.791}, edge: trailing, roll: 0, ease: out_quad}
            - {at: 4, for: 2, to: {left: -0.386, up: 0.148, forward: 0.910}, edge: leading, roll: 0, ease: in_quad}
            - {at: 6, for: 2, to: {left: 0.982, up: 0.149, forward: -0.119}, edge: leading, roll: 0, ease: linear}
            - {at: 8, for: 2, to: {left: -0.593, up: 0.148, forward: -0.791}, edge: leading, roll: 0, ease: out_cubic}
            - {at: 10, for: 3, to: {left: -0.404, up: 0.101, forward: 0.909}, edge: leading, roll: 0, ease: out_cubic}
    strike:
      for: 1
      then: end
      do:
        - id: burst
          op: hit
          at: 0
          anchor: caster
          shape: {sphere: "${radius}"}
          targets: enemies
          ignore_invulnerability: false
          # linear falloff: full damage at the centre, half at the edge
          damage: {physical: "= ${dmg_physical} * (1.0 - 0.5 * dist(event.victim, caster) / ${radius})"}
          window: once
          on:
            hit:
              - {id: react, op: react, target: event.victim, flinch: true, push: {back: 0.4}, for: 6}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.0, detach: true}
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 1.0, pitch: 1.2, detach: true}
        - {id: fx_crit, op: particle, particle: crit, anchor: ring_pt, count: 0, extra: 0.03, detach: true}
        - {id: fx_dust, op: particle, particle: dust, anchor: ring_pt, count: 1, color: "#dcdcdc", size: 1.4, detach: true}
        - {id: trail, use: swing-trail, with: {samples: 3, span: 8, extra: 0.05}, frames: {weapon: /windup/rig}, detach: true}
    end: {final: true}
