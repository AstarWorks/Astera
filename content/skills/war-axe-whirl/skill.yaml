apiVersion: astera/v3
kind: Skill
id: war-axe-whirl
item: war-axe
meta:
  name: {ja: "旋風斬り", en: "Whirl"}
  description: {ja: "回転して周囲の敵をまとめて斬る。", en: "Spins and cuts everyone around you."}
  cooldown_ticks: 120
  resource_cost: 15
  tags: [aoe, physical]
anchors:
  - {id: ring_pt, anchor: caster, offset: {up: 0.15}}
machine:
  start: whirl
  states:
    whirl:
      for: 6
      then: end
      do:
        - id: burst
          op: hit
          at: 0
          anchor: caster
          shape: {sphere: 3.5}
          targets: enemies
          max_count: all  # GAP(Q1): spelling A (required, `all` = v2 unlimited); under B delete this line
          ignore_invulnerability: false
          # linear falloff from 35 at the centre to 17.5 at the edge (v2 expression kept)
          damage: {physical: "= 35.0 * (1.0 - 0.5 * dist(event.victim, caster) / 3.5)"}
          window: once
          on:
            hit:
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.0}
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 1.0, pitch: 1.2}
        # six expanding rings, one per tick, radius 0.5 + 0.6 * k; 16 emits per ring
        # Unrolled per wave k: a state `do` does not accept a timing group (engine gap, PartParser.ops).
        - {id: crit_0, op: particle, particle: crit, times: 16, at: 0, count: 0, offset: "= vec(cos((2*PI*i/16 + draw('shape_ph')*2*PI)), 0.0, -sin((2*PI*i/16 + draw('shape_ph')*2*PI)))", extra: 0.03, anchor: ring_pt, shift: {left: "= (0.5 + 0.6 * 0) * cos((2*PI*i/16 + draw('shape_ph')*2*PI))", forward: "= -(0.5 + 0.6 * 0) * sin((2*PI*i/16 + draw('shape_ph')*2*PI))"}}
        - {id: dust_0, op: particle, particle: dust, times: 16, at: 0, count: 1, color: "#dcdcdc", size: 1.4, anchor: ring_pt, shift: {left: "= (0.5 + 0.6 * 0) * cos((2*PI*i/16 + draw('shape_ph')*2*PI))", forward: "= -(0.5 + 0.6 * 0) * sin((2*PI*i/16 + draw('shape_ph')*2*PI))"}}
        - {id: crit_1, op: particle, particle: crit, times: 16, at: 1, count: 0, offset: "= vec(cos((2*PI*i/16 + draw('shape_ph')*2*PI)), 0.0, -sin((2*PI*i/16 + draw('shape_ph')*2*PI)))", extra: 0.03, anchor: ring_pt, shift: {left: "= (0.5 + 0.6 * 1) * cos((2*PI*i/16 + draw('shape_ph')*2*PI))", forward: "= -(0.5 + 0.6 * 1) * sin((2*PI*i/16 + draw('shape_ph')*2*PI))"}}
        - {id: dust_1, op: particle, particle: dust, times: 16, at: 1, count: 1, color: "#dcdcdc", size: 1.4, anchor: ring_pt, shift: {left: "= (0.5 + 0.6 * 1) * cos((2*PI*i/16 + draw('shape_ph')*2*PI))", forward: "= -(0.5 + 0.6 * 1) * sin((2*PI*i/16 + draw('shape_ph')*2*PI))"}}
        - {id: crit_2, op: particle, particle: crit, times: 16, at: 2, count: 0, offset: "= vec(cos((2*PI*i/16 + draw('shape_ph')*2*PI)), 0.0, -sin((2*PI*i/16 + draw('shape_ph')*2*PI)))", extra: 0.03, anchor: ring_pt, shift: {left: "= (0.5 + 0.6 * 2) * cos((2*PI*i/16 + draw('shape_ph')*2*PI))", forward: "= -(0.5 + 0.6 * 2) * sin((2*PI*i/16 + draw('shape_ph')*2*PI))"}}
        - {id: dust_2, op: particle, particle: dust, times: 16, at: 2, count: 1, color: "#dcdcdc", size: 1.4, anchor: ring_pt, shift: {left: "= (0.5 + 0.6 * 2) * cos((2*PI*i/16 + draw('shape_ph')*2*PI))", forward: "= -(0.5 + 0.6 * 2) * sin((2*PI*i/16 + draw('shape_ph')*2*PI))"}}
        - {id: crit_3, op: particle, particle: crit, times: 16, at: 3, count: 0, offset: "= vec(cos((2*PI*i/16 + draw('shape_ph')*2*PI)), 0.0, -sin((2*PI*i/16 + draw('shape_ph')*2*PI)))", extra: 0.03, anchor: ring_pt, shift: {left: "= (0.5 + 0.6 * 3) * cos((2*PI*i/16 + draw('shape_ph')*2*PI))", forward: "= -(0.5 + 0.6 * 3) * sin((2*PI*i/16 + draw('shape_ph')*2*PI))"}}
        - {id: dust_3, op: particle, particle: dust, times: 16, at: 3, count: 1, color: "#dcdcdc", size: 1.4, anchor: ring_pt, shift: {left: "= (0.5 + 0.6 * 3) * cos((2*PI*i/16 + draw('shape_ph')*2*PI))", forward: "= -(0.5 + 0.6 * 3) * sin((2*PI*i/16 + draw('shape_ph')*2*PI))"}}
        - {id: crit_4, op: particle, particle: crit, times: 16, at: 4, count: 0, offset: "= vec(cos((2*PI*i/16 + draw('shape_ph')*2*PI)), 0.0, -sin((2*PI*i/16 + draw('shape_ph')*2*PI)))", extra: 0.03, anchor: ring_pt, shift: {left: "= (0.5 + 0.6 * 4) * cos((2*PI*i/16 + draw('shape_ph')*2*PI))", forward: "= -(0.5 + 0.6 * 4) * sin((2*PI*i/16 + draw('shape_ph')*2*PI))"}}
        - {id: dust_4, op: particle, particle: dust, times: 16, at: 4, count: 1, color: "#dcdcdc", size: 1.4, anchor: ring_pt, shift: {left: "= (0.5 + 0.6 * 4) * cos((2*PI*i/16 + draw('shape_ph')*2*PI))", forward: "= -(0.5 + 0.6 * 4) * sin((2*PI*i/16 + draw('shape_ph')*2*PI))"}}
        - {id: crit_5, op: particle, particle: crit, times: 16, at: 5, count: 0, offset: "= vec(cos((2*PI*i/16 + draw('shape_ph')*2*PI)), 0.0, -sin((2*PI*i/16 + draw('shape_ph')*2*PI)))", extra: 0.03, anchor: ring_pt, shift: {left: "= (0.5 + 0.6 * 5) * cos((2*PI*i/16 + draw('shape_ph')*2*PI))", forward: "= -(0.5 + 0.6 * 5) * sin((2*PI*i/16 + draw('shape_ph')*2*PI))"}}
        - {id: dust_5, op: particle, particle: dust, times: 16, at: 5, count: 1, color: "#dcdcdc", size: 1.4, anchor: ring_pt, shift: {left: "= (0.5 + 0.6 * 5) * cos((2*PI*i/16 + draw('shape_ph')*2*PI))", forward: "= -(0.5 + 0.6 * 5) * sin((2*PI*i/16 + draw('shape_ph')*2*PI))"}}
    end: {final: true}
