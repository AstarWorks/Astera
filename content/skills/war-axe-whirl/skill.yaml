apiVersion: astera/v3
kind: Skill
id: war-axe-whirl
item: war-axe
meta:
  name: {ja: "旋風斬り", en: "Whirl"}
  description: {ja: "回転して周囲の敵をまとめて斬る。", en: "Spins and cuts everyone around you."}
  cooldown_ticks: 120
  resource_cost: 15
  tags: [aoe, physical]
anchors:
  - {id: ring_pt, anchor: caster, offset: {up: 0.15}}
machine:
  start: whirl
  states:
    whirl:
      for: 1   # v2 timeline is one row at tick 0; 6 ticks was the invented ring wave (see report)
      then: end
      do:
        - id: burst
          op: hit
          at: 0
          anchor: caster
          shape: {sphere: 3.5}
          targets: enemies
          max_count: all  # GAP(Q1): spelling A (required, `all` = v2 unlimited); under B delete this line
          ignore_invulnerability: false
          # linear falloff from 35 at the centre to 17.5 at the edge (v2 expression kept)
          damage: {physical: "= 35.0 * (1.0 - 0.5 * dist(event.victim, caster) / 3.5)"}
          window: once
          on:
            hit:
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.0}
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 1.0, pitch: 1.2}
        - {id: fx_crit, op: particle, particle: crit, anchor: ring_pt, at: 0, count: 0, extra: 0.03}
        - {id: fx_dust, op: particle, particle: dust, anchor: ring_pt, at: 0, count: 1, color: "#dcdcdc", size: 1.4}
    end: {final: true}
