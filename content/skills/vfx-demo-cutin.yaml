# Cut-in demo (screen_flash): white flash 1t -> gold burst 2t -> diagonal speed lines 2t.
# Only the caster sees it. Not bound to any item; film it with
# `make vfx-shot SKILL=vfx-demo-cutin VIEW=caster HIDE_HUD=0 TICKS=12`.

id: vfx-demo-cutin

name:
  ja: "デモ・カットイン"
  en: "Demo Cut-in"
description:
  ja: "白閃 1t → 金のバースト 2t → 斜めの集中線 2t と画面全体を塗るカットインを見せるデモ。"
  en: "Full-screen cut-in chain: white flash 1t, gold burst 2t, diagonal speed lines 2t."

archetype: sequence
cooldown_ticks: 40
tags: [ demo, vfx ]

params:
  type: sequence

phases:
  type: sequence
  cast:
    - type: screen_flash
      targets: { type: caster }
      overlay: white
      fade_in: { type: literal, value: 0 }
      stay: { type: literal, value: 1 }
      fade_out: { type: literal, value: 0 }
    - type: screen_flash
      targets: { type: caster }
      overlay: gold_burst
      color: "#FFC84A"
      delay_ticks: { type: literal, value: 1 }
      fade_in: { type: literal, value: 0 }
      stay: { type: literal, value: 1 }
      fade_out: { type: literal, value: 1 }
    - type: screen_flash
      targets: { type: caster }
      overlay: speed_diag
      color: "#FFFFFF"
      delay_ticks: { type: literal, value: 3 }
      fade_in: { type: literal, value: 0 }
      stay: { type: literal, value: 1 }
      fade_out: { type: literal, value: 1 }
