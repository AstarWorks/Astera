# Couturier's Shears S2 (型紙裁ち, Pattern Trim): reference GIe7Fna5LD4 t=25.947..31.498. Beat sheet: tools/skill-compare/data/couture-rapier-s2/beat-sheet/beat-sheet.md (r1, gate 1 passed 2026-10-27).
# Three effect-driven coins: t9 white crescent ring + thin line, t34 the shears split overhead into THREE objects (body + two separate blades) that fly side by side as three real projectiles and stick in the enemy; a pink thread links hand and target and pulls them back, t72 back-turned dash through the enemy with a clockwise 180 deg turn in the smear (Q1=A).
# Remote hits (t9, t41) are fixed at the cast-time pose and hit whoever stands on the line (Q3=A: no homing, dodgeable). Hit area = visual reach (cone 24 deg / 7 blocks; the line / shears fly ~5.4).
# The performance rig couture-s2-rig hides the held item t20-57: hand shears t0-19 and t57+, the three overhead objects t22-34, the three flying projectiles t34+.
