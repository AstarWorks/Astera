# WP7: shotgun right-click. A close-range cone of pellets (modelled as the melee
# archetype: instant, forward arc, no travel time). Burst role: ~2 blasts to kill,
# punishing at range 0-4, nothing beyond 6.

id: shotgun-blast

name:
  ja: "ショットガン射撃"
  en: "Shotgun Blast"
description:
  ja: "近距離の扇状に散弾を撃ち込み、大ダメージとノックバックを与える。"
  en: "Blasts a close-range cone of pellets for heavy damage and knockback."

archetype: melee
cooldown_ticks: 26
resource_cost: 1               # one shell; the shotgun's magazine is 6
tags: [ ranged, gun, burst ]
# ADR-0280: flat chip along the look ray (opt-in; cover has 200-500 HP, weapons only chip).
block_damage:
  amount: 30
  reach: 4.0

params:
  type: melee
  range: 6.0
  arc_degrees: 50.0
  knockback: 0.9
  damage:
    - base: { type: literal, value: 32.5 }
      attribute: physical

phases:
  type: melee
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/shotgun-blast
      volume: { type: literal, value: 0.6 }
      pitch: { type: literal, value: 1.4 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.2, height: -0.25 }
      particle_id: shotgun-muzzle
    - type: spawn_particle
      targets: { type: caster_forward, distance: 2.4, height: -0.2 }
      particle_id: shotgun-cone-smoke
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/gun-impact
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: gun-impact
  miss: []
