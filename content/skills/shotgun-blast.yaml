# WP7: shotgun right-click. A close-range cone of pellets (modelled as the melee
# archetype: instant, forward arc, no travel time). Burst role: ~2 blasts to kill,
# punishing at range 0-4, nothing beyond 6.

# V-2a visuals. Per-cast particle budget: muzzle 23, pellet fan 7 points x (2+1+2) = 35, entity impact 23 per target.
id: shotgun-blast

name:
  ja: "ショットガン射撃"
  en: "Shotgun Blast"
description:
  ja: "近距離の扇状に散弾を撃ち込み、大ダメージとノックバックを与える。"
  en: "Blasts a close-range cone of pellets for heavy damage and knockback."

archetype: melee
cooldown_ticks: 26
resource_cost: 1               # one shell; the shotgun's magazine is 6
tags: [ ranged, gun, burst ]

params:
  type: melee
  range: 6.0
  arc_degrees: 50.0
  knockback: 0.9
  damage:
    - base: { type: literal, value: 13.0 }
      attribute: physical

phases:
  type: melee
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.generic.explode
      volume: { type: literal, value: 0.6 }
      pitch: { type: literal, value: 1.4 }
    - type: schedule_particle_animation
      targets: { type: caster_forward, distance: 1.2, height: -0.25 }
      animation:
        - type: point
          particles:
            - { id: flame, count: 12, extra: 0.2 }
            - { id: electric_spark, count: 8, extra: 0.45 }
            - { id: large_smoke, count: 3, extra: 0.04, delay_ticks: 1 }
    # pellet fan: three wavefronts over the 50 degree cone, travelling out at ~1 block/tick
    - type: schedule_particle_animation
      targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      animation:
        - type: arc
          radius: 2.0
          start_degrees: -25.0
          end_degrees: 25.0
          points: 7
          particles: [ { id: end_rod }, { id: crit } ]
        - type: arc
          delay_ticks: 1
          radius: 3.8
          start_degrees: -25.0
          end_degrees: 25.0
          points: 7
          particles: [ { id: electric_spark } ]
        - type: arc
          delay_ticks: 2
          radius: 5.6
          start_degrees: -25.0
          end_degrees: 25.0
          points: 7
          particles: [ { id: end_rod }, { id: white_smoke, extra: 0.02 } ]
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: entity.player.attack.strong
    - type: schedule_particle_animation
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      animation:
        - type: point
          particles:
            - { id: crit, count: 12, extra: 0.4 }
            - { id: electric_spark, count: 8, extra: 0.3 }
            - { id: white_smoke, count: 3, extra: 0.05 }
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.arrow.hit_player
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.2 }
  miss: []
