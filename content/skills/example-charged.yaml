# Wave 5a starter: PROJECTILE archetype with a hold-to-cast charge phase.
#
# The `charge_ticks` field elevates this from `ChargedSkillVariant.Instant`
# (default) to `Charged(30)` — the player must hold the trigger for 30 ticks
# (~1.5s @ 20 TPS) before the projectile is launched. Release / cancel
# semantics are orchestrated by `ChargedSkillCastUseCase`.

id: example-charged

display_name_key: astera.skill.example-charged.name
description_key: astera.skill.example-charged.lore

archetype: projectile
trigger: right_click
cooldown_ticks: 60         # ~3s @ 20 TPS — slightly longer than instant blast
charge_ticks: 30           # ~1.5s hold before the projectile launches

params:
  type: projectile
  launch_speed: 2.4        # blocks/tick — slightly faster than example-blast
  max_lifetime_ticks: 80   # ~4s flight time before despawn
  damage:
    base: 18.0             # heavier hit than example-blast to reward the hold
    attribute: fire
