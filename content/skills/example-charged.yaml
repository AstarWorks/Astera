# Wave _skills-2 / ADR-0077: PROJECTILE with charge phase.
#
# `charge_ticks` puts this on ChargedSkillVariant.Charged(30) — the player
# must hold the trigger for 30 ticks (~1.5s) before the projectile is
# launched. Once charged, the cast / hit_entity / hit_block / miss / expire
# phases dispatch as normal.

id: example-charged

name:
  ja: "溜め炸裂弾"
  en: "Example Charged Blast"
description:
  ja: "長押しで威力を溜めてから発射する強化遠距離スキル。"
  en: "Charged ranged skill — hold to build up before launching a heavier projectile."

archetype: projectile
cooldown_ticks: 60
charge_ticks: 30
tags: [ ranged, fire-family, charged ]

params:
  type: projectile
  launch_speed: 2.4
  max_lifetime_ticks: 80
  damage:
    - base: { kind: literal, value: 18.0 }
      attribute: fire

phases:
  archetype: projectile
  cast:
    - type: play_sound
      targets: { kind: caster }
      sound_id: skills/charged-release
  hit_entity:
    - type: damage
      targets: { kind: target }
      components:
        - base: { kind: literal, value: 18.0 }
          attribute: fire
    - type: apply_status
      targets: { kind: target }
      status_id: example-burn
      effect_duration_ticks: { kind: literal, value: 100 }
      chance: { kind: literal, value: 0.7 }
  hit_block:
    - type: spawn_particle
      targets: { kind: hit_location }
      particle_id: example-burst
  miss: []
  expire: []
