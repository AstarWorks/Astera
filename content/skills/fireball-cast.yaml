# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: fireball-cast

name:
  ja: "火球"
  en: "Fireball"
description:
  ja: "火の玉を放ち、着弾で爆ぜる。"
  en: "Hurls a fireball that bursts on impact."

archetype: projectile
cooldown_ticks: 70
resource_cost: 16
tags: [ ranged, fire, magic ]

params:
  type: projectile
  launch_speed: 1.5
  max_lifetime_ticks: 60
  visual:
    trail_spacing: 0.4
    trail:
      - type: point
        particles:
          - { id: flame, offset: { x: 0.08, y: 0.08, z: 0.08 } }
          - { id: smoke, offset: { x: 0.04, y: 0.04, z: 0.04 } }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.blaze.shoot
      volume: { type: literal, value: 0.9 }
      pitch: { type: literal, value: 0.9 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 0.9, height: -0.25 }
      particle_id: fire-cast
  hit_entity:
    - type: explode
      targets: { type: target }
      power: { type: literal, value: 1.2 }
      radius: { type: literal, value: 2.5 }
      break_blocks: { type: literal, value: false }
      components:
        - base: { type: literal, value: 55.0 }
          attribute: fire
    - type: apply_status
      targets: { type: target }
      status_id: burn
      effect_duration_ticks: { type: literal, value: 60 }
    - type: play_sound
      targets: { type: target }
      sound_id: astera:skills/fire-impact
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.0 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
  hit_block:
    - type: explode
      targets: { type: hit_location }
      power: { type: literal, value: 1.2 }
      radius: { type: literal, value: 2.5 }
      break_blocks: { type: literal, value: false }
      components:
        - base: { type: literal, value: 55.0 }
          attribute: fire
    - type: play_sound
      targets: { type: hit_location }
      sound_id: astera:skills/fire-impact
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.0 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: hit-spark
  miss: []
  expire: []
