# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: glacier-spike

name:
  ja: "氷柱"
  en: "Ice Spike"
description:
  ja: "氷の礫を飛ばし、相手の足を鈍らせる。"
  en: "Flings a shard of ice that slows the target."

archetype: projectile
cooldown_ticks: 50
resource_cost: 10
tags: [ ranged, water, magic ]

params:
  type: projectile
  launch_speed: 2.2
  max_lifetime_ticks: 40
  visual:
    trail_spacing: 0.4
    trail:
      - type: point
        particles:
          - { id: snowflake, offset: { x: 0.04, y: 0.04, z: 0.04 } }
          - { id: dust, color: { r: 190, g: 230, b: 255 }, scale: 1.0 }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:skills/frost-cast
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.3 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 0.9, height: -0.25 }
      particle_id: frost-cast
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 30 }
          attribute: water
    - type: apply_status
      targets: { type: target }
      status_id: sinking
      effect_duration_ticks: { type: literal, value: 60 }
    - type: play_sound
      targets: { type: target }
      sound_id: astera:skills/frost-impact
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.1 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: frost-impact
  hit_block:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: astera:weapons/gun-impact-block
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.5 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: hit-spark
  miss: []
  expire: []
