# Wave _skills-2 / ADR-0077: BUFF archetype — speed boost on hold.
# Mechanically a `example-speed` status applied for `duration_ticks`. The
# cast / expire phases bookend with sound + minor particles.

id: example-charge

name:
  ja: "加速チャージ"
  en: "Example Charge"
description:
  ja: "長押しで一定時間、移動速度が上昇する。"
  en: "Hold to gain a movement-speed buff for a short window."

archetype: buff
cooldown_ticks: 80
tags: [ buff, movement ]

params:
  type: buff
  status_effect_id: example-speed
  duration_ticks: 100

phases:
  archetype: buff
  cast:
    - type: play_sound
      targets: { kind: caster }
      sound_id: skills/charge-on
    - type: spawn_particle
      targets: { kind: caster }
      particle_id: example-burst
  expire:
    - type: play_sound
      targets: { kind: caster }
      sound_id: skills/charge-off
  removed: []
