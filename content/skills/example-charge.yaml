# Phase 2 starter: BUFF archetype example — speed boost on hold.
# The "charge" framing is authoring intent (player builds speed while holding);
# mechanically it grants a `speed-up` status effect for the listed duration.
#
# Wave _items-1 (ADR-0073): trigger / i18n keys folded into item bindings +
# inline locale maps.

id: example-charge

name:
  ja: "加速チャージ"
  en: "Example Charge"
description:
  ja: "長押しで一定時間、移動速度が上昇する。"
  en: "Hold to gain a movement-speed buff for a short window."

archetype: buff
cooldown_ticks: 80        # ~4s @ 20 TPS

params:
  type: buff
  status_effect_id: example-speed
  duration_ticks: 100     # ~5s of speed
