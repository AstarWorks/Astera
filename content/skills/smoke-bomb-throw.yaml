# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: smoke-bomb-throw

name:
  ja: "煙幕弾"
  en: "Smoke Bomb"
description:
  ja: "着弾点に煙を張り、味方を見つかりにくくする。"
  en: "Fills the spot with smoke; allies in it move evasively."

archetype: projectile
cooldown_ticks: 200
resource_cost: 12
tags: [ ranged, utility, support ]

params:
  type: projectile
  launch_speed: 1.2
  max_lifetime_ticks: 50
  visual:
    trail_spacing: 0.4
    trail:
      - type: point
        particles:
          - { id: smoke, offset: { x: 0.04, y: 0.04, z: 0.04 } }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.generic.extinguish_fire
      volume: { type: literal, value: 0.9 }
      pitch: { type: literal, value: 1.0 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 0.9, height: -0.25 }
      particle_id: gun-muzzle-smoke
  hit_entity:
    - type: apply_status
      targets: { type: allies, center: { type: target }, include_self: true, radius: { type: literal, value: 4.0 } }
      status_id: evasive
      effect_duration_ticks: { type: literal, value: 80 }
    - type: schedule_particle_animation
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 0.5, z: 0.0 } } }
      animation:
        - type: ring
          period_ticks: 10
          points: 16
          start_radius: 0.4
          end_radius: 4.0
          particles:
            - { id: large_smoke, count: 0, extra: 0.01 }
            - { id: smoke, count: 0, extra: 0.01 }
    - type: play_sound
      targets: { type: target }
      sound_id: entity.generic.extinguish_fire
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 0.7 }
  hit_block:
    - type: apply_status
      targets: { type: allies, center: { type: hit_location }, include_self: true, radius: { type: literal, value: 4.0 } }
      status_id: evasive
      effect_duration_ticks: { type: literal, value: 80 }
    - type: schedule_particle_animation
      targets: { type: hit_location }
      animation:
        - type: ring
          period_ticks: 10
          points: 16
          start_radius: 0.4
          end_radius: 4.0
          particles:
            - { id: large_smoke, count: 0, extra: 0.01 }
            - { id: smoke, count: 0, extra: 0.01 }
    - type: play_sound
      targets: { type: hit_location }
      sound_id: entity.generic.extinguish_fire
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 0.7 }
  miss: []
  expire: []
