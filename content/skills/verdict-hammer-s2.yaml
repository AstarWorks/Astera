id: verdict-hammer-s2
name: {ja: 天降る杭, en: Heavenly Stakes}
description: {ja: 狙った敵へ二本の杭を収束させ、一撃を落とす。, en: Summon two converging nails onto the aimed enemy in one strike.}
archetype: sequence
cooldown_ticks: 70
resource_cost: 30
params: {type: sequence}
phases:
  type: sequence
  cast:
  - type: play_vfx
    targets:
      type: forward_ray
      from: &id001 {type: caster}
      distance: {type: literal, value: 12}
    delay_ticks: {type: literal, value: 10}
    vfx_id: verdict-s2-mark
  - type: damage
    targets:
      type: nearby_entities
      center: &id002
        type: forward_ray
        from: *id001
        distance: {type: literal, value: 12}
      radius: {type: literal, value: 3.2}
      exclude_caster: true
    delay_ticks: {type: literal, value: 26}
    ignore_invulnerability: {type: literal, value: true}
    components:
    - base: {type: literal, value: 9.0}
      attribute: physical
  - type: hit_stop
    targets: *id002
    delay_ticks: {type: literal, value: 26}
    ticks: 2
    include_caster: true
  - type: play_sound
    targets: *id001
    delay_ticks: {type: literal, value: 26}
    sound_id: entity.player.attack.strong
    pitch: {type: literal, value: 0.7}
  - type: schedule_particle_animation
    targets: *id002
    delay_ticks: {type: literal, value: 26}
    animation:
    - type: point
      particles:
      - {id: crit, count: 12, extra: 0.15}
      - {id: end_rod, count: 8, extra: 0.09}
      - {id: smoke, count: 4, extra: 0.03}
      - {id: flash, count: 1}
  - type: play_vfx
    targets: *id002
    delay_ticks: {type: literal, value: 26}
    vfx_id: verdict-impact
    scale: {type: literal, value: 1.6}
  - type: apply_status
    targets: *id002
    delay_ticks: {type: literal, value: 26}
    status_id: rupture
    effect_duration_ticks: {type: literal, value: 200}
    stack_count: {type: literal, value: 1}
