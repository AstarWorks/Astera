# grapple-shot: fires a hook. A wall reels the caster in; an enemy is reeled to the caster. Rewritten from zero on the rev4.10 grammar (ADR-0303):
# an item display riding the body, one impact fragment, a chain ribbon-less trail; straight flight on purpose (hit tick is balance).
# The cast ends when the hook body ends. Visuals need a founder look on skill-compare.
apiVersion: astera/v3
kind: Skill
id: grapple-shot
item: grappling-hook
meta: {name: {ja: "フック射出", en: "Grapple Shot"}, description: {ja: "フックを撃ち、壁なら自分が、敵なら相手が引かれる。", en: "Fires a hook: reels you to a wall, or the enemy to you."}, cooldown_ticks: 120, resource_cost: 10, tags: [ranged, utility, movement]}
params:
  launch_speed:       {type: number, default: 2.4}
  max_lifetime_ticks: {type: ticks, default: 40}
  dmg_physical:       {type: number, default: 5}
  reel_strength:      {type: number, default: 1.2}     # enemy pulled toward the caster
  pull_forward:       {type: number, default: 1.3}     # caster impulse when the hook bites a wall
  pull_up:            {type: number, default: 0.4}
anchors:
  - {id: muzzle,  anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: cast_fx, anchor: caster, offset: {up: -0.25, forward: 0.9}, mode: snapshot}
  - {id: heart,   anchor: victim.root, offset: {up: 1.2}, mode: follow}
fragments:
  bite:
    frames_in: {spot: anchor}
    do:
      - {id: snd, op: sound, at: 0, sound: "block.chain.place", anchor: spot, volume: 0.8, pitch: 0.8}
      - {id: spark, op: particle_def, at: 0, def: hit-spark, anchor: spot}
machine:
  start: cast
  states:
    cast:
      on:
        - {event: bolt.end, to: done}
      do:
        - {id: snd, op: sound, at: 0, sound: "block.chain.place", anchor: caster, volume: 0.9, pitch: 1.2}
        - {id: fx, op: particle_def, at: 0, def: hit-spark, anchor: cast_fx}
        - id: bolt
          op: projectile
          at: 0
          origin: muzzle
          velocity: "= look(caster) * ${launch_speed}"
          speed: "${launch_speed}"
          for: "${max_lifetime_ticks}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg_physical}"}}
              - {id: reel, op: knockback, target: event.victim, direction: "= normalize(pos(caster) - pos(event.victim)) + vec(0.0, 0.2, 0.0)", strength: "${reel_strength}"}
              - {id: bite, use: "fragment:bite", frames: {spot: heart}}
            block:
              - {id: pull, op: impulse, at: 0, target: caster, vector: {of: caster, forward: "${pull_forward}", up: "${pull_up}"}}
              - {id: bite_wall, use: "fragment:bite", frames: {spot: contact}}
        - {id: hook, op: display, kind: item, item: tripwire_hook, context: fixed, anchor: bolt, scale: [0.9, 0.9, 0.9], at: 0, until: bolt.end}
        - id: trail
          op: group
          at: 0
          every: 1
          until: bolt.end
          do:
            - {id: wake, op: particle, particle: crit, count: 1, offset: [0.02, 0.02, 0.02], anchor: {of: bolt, sweep: 0.4}, at: 0}
            - {id: chain, op: particle, particle: dust, count: 1, color: "#787878", size: 0.8, anchor: {of: bolt, sweep: 0.4}, at: 0}
    done: {final: true}
