apiVersion: "astera/v3"
kind: Skill
id: grapple-shot
item: grappling-hook
meta:
  name: {ja: "フック射出", en: "Grapple Shot"}
  description: {ja: "フックを撃ち、壁なら自分が、敵なら相手が引かれる。", en: "Fires a hook: reels you to a wall, or the enemy to you."}
  cooldown_ticks: 120
  resource_cost: 10
  tags: [ranged, utility, movement]
anchors:
  muzzle: {anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  cast_fx: {anchor: caster.eye, offset: {up: -0.25, forward: 0.9}, mode: snapshot}
  heart: {anchor: victim.body, offset: {up: 0.4}}
# anchor note: v2 enemy point offset Y minus 0.8 (example b maps 1.0 -> up 0.2)
presentation:
  timeline:
    - at: 0
      do:
        - {id: snd, op: sound, sound: "block.chain.place", anchor: caster, volume: 0.9, pitch: 1.2}
        - {id: fx, op: particle_def, def: hit-spark, anchor: cast_fx}
    - {at: 0, every: 1, until: bolt.end, do: [{op: particle, particle: crit, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.02, 0.02, 0.02]}]}
    - {at: 0, every: 1, until: bolt.end, do: [{op: particle, particle: dust, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.0, 0.0, 0.0], color: "#787878", size: 0.8}]}
gameplay:
  timeline:
    - at: 0
      do:
        - id: bolt
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * 2.4"
          for: 40
          radius: 0.5
          hit: {targets: enemies, once: true}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, components: [{kind: physical, amount: 5}]}
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(flat(pos(caster) - pos(event.victim))) + vec(0.0, 0.2, 0.0)", strength: 1.2}
              - {id: snd_hit, op: sound, sound: "block.chain.place", anchor: heart, volume: 0.8, pitch: 0.8}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
            block:
              # GAP: propel (forward 1.3 then up 0.4, two ops) -> impulse is the closest op; propel semantics unverified
              - {id: pull, op: impulse, target: caster, vector: "= look(caster) * 1.3 + vec(0.0, 0.4, 0.0)"}
              - {id: snd_blk, op: sound, sound: "block.chain.place", anchor: contact.point, volume: 0.8, pitch: 0.8}
              - {id: fx_blk, op: particle_def, def: hit-spark, anchor: contact.point}
