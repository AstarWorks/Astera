# Wave 2 v3 hand port of bastion-greatsword-def (v2: skill.yaml + look.yaml). Offsets [left, up, forward] -> name-keyed maps.
# Euler turn [pitch, yaw, roll] (v1 convention Ry(-yaw) Rx(pitch) Rz(roll)) -> pose list [up -yaw, left pitch, forward roll] (R = R_A * R_B * R_C).
# Rotations here are static (one key), so sum+hold has nothing to carry.
apiVersion: astera/v3
kind: Skill
id: bastion-greatsword-def
item: bastion-greatsword
meta:
  name: {ja: "城壁の構え", en: "Tower Shield"}
  description: {ja: "半透明の障壁で受け止める。", en: "Brace behind a translucent barrier."}
  cooldown_ticks: 120
  resource_cost: 15
  tags: [buff, defense, charge]
params:
  charge_ticks: {type: ticks, default: 400}
  charge_stacks: {type: number, default: 1}
anchors:
  # v2: frame fx1_bastion_shield, body, at caster, orient yaw, follow, teleport_ticks 2.
  - {id: shield, anchor: caster, mode: follow}
machine:
  start: brace
  states:
    brace:
      for: 162          # v2: remove of all six plates at tick 162; the resist modifiers also last 162
      then: end
      do:
        # --- gameplay (v2 timeline t0 / t20 / t40) ---
        - {id: attr, op: modify_attribute, target: caster, attribute: resist.physical, operation: add, amount: 0.7, at: 0, for: 162}
        - {id: attr_2, op: modify_attribute, target: caster, attribute: resist.knockback, operation: add, amount: 1.0, at: 0, for: 162}
        - {id: st_charge, op: status, target: caster, status: charge, stacks: "${charge_stacks}", at: 0, for: "${charge_ticks}"}
        - {id: st_charge_2, op: status, target: caster, status: charge, stacks: "${charge_stacks}", at: 20, for: "${charge_ticks}"}
        - {id: st_charge_3, op: status, target: caster, status: charge, stacks: "${charge_stacks}", at: 40, for: "${charge_ticks}"}
        # --- presentation (v2 look.yaml group fx0, tick 0) ---
        - {id: snd, op: sound, sound: item.shield.block, anchor: caster, at: 0}
        # plates: v2 plate size 6.4 x track scale -> sprite size in blocks; brightness 15 -> {block: 15, sky: 15}.
        - id: rim0r
          op: display
          kind: sprite
          sprite: bastion-rim
          anchor: shield
          offset: {left: 0.2, up: 1.3, forward: 1.15}
          size: [3.712, 1.92]
          rotate: [{axis: up, deg: 39.0405}, {axis: left, deg: -39.0405}, {axis: forward, deg: 83.72263}]
          billboard: fixed
          see_through: true
          brightness: {block: 15, sky: 15}
          at: 0
          for: 162
        - id: rim0l
          op: display
          kind: sprite
          sprite: bastion-rim
          anchor: shield
          offset: {left: 0.2, up: 1.3, forward: 1.15}
          size: [3.712, 1.92]
          rotate: [{axis: up, deg: 39.0405}, {axis: left, deg: 39.0405}, {axis: forward, deg: -83.72263}]
          billboard: fixed
          see_through: true
          brightness: {block: 15, sky: 15}
          at: 0
          for: 162
        - id: rim1r
          op: display
          kind: sprite
          sprite: bastion-rim
          anchor: shield
          offset: {left: 0.2, up: 1.3, forward: 1.15}
          size: [3.072, 1.408]
          rotate: [{axis: up, deg: 39.0405}, {axis: left, deg: -39.0405}, {axis: forward, deg: 83.72263}]
          tint: "#FFF3C8"
          billboard: fixed
          see_through: true
          brightness: {block: 15, sky: 15}
          at: 0
          for: 162
        - id: rim1l
          op: display
          kind: sprite
          sprite: bastion-rim
          anchor: shield
          offset: {left: 0.2, up: 1.3, forward: 1.15}
          size: [3.072, 1.408]
          rotate: [{axis: up, deg: 39.0405}, {axis: left, deg: 39.0405}, {axis: forward, deg: -83.72263}]
          tint: "#FFF3C8"
          billboard: fixed
          see_through: true
          brightness: {block: 15, sky: 15}
          at: 0
          for: 162
        - id: crest
          op: display
          kind: sprite
          sprite: bastion-crest
          anchor: shield
          offset: {left: 0.2, up: 1.35, forward: 1.15}
          size: [1.664, 1.664]
          rotate: [{axis: up, deg: 50}]
          billboard: fixed
          see_through: true
          brightness: {block: 15, sky: 15}
          at: 0
          for: 162
        # v2 quad "fill": text glyph "●", colour #FFD66E, keys on scale + alpha (out_cubic into t6, in_quad into t162).
        - id: fill
          op: display
          kind: text
          text: "●"
          color: "#FFD66E"
          anchor: shield
          offset: {left: 0.2, up: 1.3, forward: 1.15}
          rotate: [{axis: up, deg: 50}]
          billboard: fixed
          brightness: {block: 15, sky: 15}
          at: 0
          for: 162
          # v2 t152..t162 alpha 0.14 -> 0 (in_quad) is the `fade` law.
          motion:
            - law: keys
              keys:
                - {t: 0, scale: [0.3, 0.6, 1.0], alpha: 0.0}
                - {t: 6, scale: [1.5, 3.3, 1.0], alpha: 0.14, ease: out_cubic}
                - {t: 162, scale: [1.4, 3.1, 1.0], alpha: 0.14}
            - {law: fade, at: 152, for: 10, ease: in_quad}
    end: {final: true}
