# Tower Shield: a translucent barrier in front of the caster. One visual object = one op; the shared pose lives on the anchor.
apiVersion: astera/v3
kind: Skill
id: bastion-greatsword-def
item: bastion-greatsword
meta:
  name: {ja: "城壁の構え", en: "Tower Shield"}
  description: {ja: "半透明の障壁で受け止める。", en: "Brace behind a translucent barrier."}
  cooldown_ticks: 120
  resource_cost: 15
  tags: [buff, defense, charge]
params:
  charge_ticks: {type: ticks, default: 400}
  charge_stacks: {type: number, default: 1}
anchors:
  - {id: shield, anchor: caster, mode: follow, offset: {left: 0.2, up: 1.3, forward: 1.15}}
machine:
  start: brace
  states:
    brace:
      for: 162
      then: end
      start: guard
      states:
        # the shared parry part: the first 16 ticks of the brace catch a hit from the front 110 degrees outright; the resist rows below cover the rest
        guard:
          use: parry
          with: {window: 16, arc: 110, range: 64, recover: 4, whiff_lag: 1}
          frames: {weapon: shield}
          on:
            - {event: brace/guard.end, to: held}
        held: {final: true}
      do:
        - {id: attr, op: modify_attribute, target: caster, attribute: resist.physical, operation: add, amount: 0.7, at: 0, for: 162}
        - {id: attr_2, op: modify_attribute, target: caster, attribute: resist.knockback, operation: add, amount: 1.0, at: 0, for: 162}
        - id: charge
          op: group
          every: 20
          times: 3
          do:
            - {id: st, op: status, target: caster, status: charge, stacks: "${charge_stacks}", for: "${charge_ticks}"}
        - {id: snd, op: sound, sound: item.shield.block, anchor: caster, at: 0}
        # Two plate pairs (outer, tinted inner); the pair is the two faces: forward +90 / -90.
        - {id: rim0, op: display, kind: sprite, sprite: bastion-rim, anchor: shield, times: 2, size: [3.712, 1.92], rotate: [{axis: up, deg: -50}, {axis: forward, deg: "= 90 - 180 * i"}], billboard: fixed, see_through: true, brightness: {block: 15, sky: 15}, for: 162}
        - {id: rim1, op: display, kind: sprite, sprite: bastion-rim, anchor: shield, times: 2, size: [3.072, 1.408], color: "#FFF3C8", rotate: [{axis: up, deg: -50}, {axis: forward, deg: "= 90 - 180 * i"}], billboard: fixed, see_through: true, brightness: {block: 15, sky: 15}, for: 162}
        - {id: crest, op: display, kind: sprite, sprite: bastion-crest, anchor: shield, offset: {up: 0.05}, rotate: [{axis: up, deg: -50}], size: [1.664, 1.664], billboard: fixed, see_through: true, brightness: {block: 15, sky: 15}, for: 162}
        - id: fill
          op: display
          kind: text
          text: "●"
          color: "#FFD66E"
          anchor: shield
          billboard: fixed
          brightness: {block: 15, sky: 15}
          for: 162
          motion:
            - law: keys
              keys:
                - {t: 0, pose: [{axis: up, deg: -50}], scale: {left: 1.5, up: 3, forward: 1.0}, alpha: 0.0}
                - {t: 6, scale: {left: 7.5, up: 16.5, forward: 1.0}, alpha: 0.14, ease: out_cubic}
                - {t: 152, alpha: 0.14}
                - {t: 162, scale: {left: 7, up: 15.5, forward: 1.0}, alpha: 0, ease: in_quad}
    end: {final: true}
