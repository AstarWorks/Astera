# Bastion greatsword S2 (Judgement Rush), natural v3 grammar: three states (rush1 / rush2 / chop) = the three weapon swings; the rig is declared once in rush1 and
# detached (machine.tail) so it runs through the whole cast, later states read /rush1/rig.root and /rush1/rig.tip. Blade fx are segments between the rig points,
# dust / impact / ring bursts are small families (times / shift CEL). Gameplay (hit ticks 13 / 32 / 53, damage, knockback, dashes, freezes, cast length 80) is the v2 value unchanged.
apiVersion: astera/v3
kind: Skill
id: bastion-greatsword-s2
item: bastion-greatsword
meta:
  name: {ja: "審判の突進", en: "Judgement Rush"}
  description: {ja: "踏み込んで二度薙ぎ払い、頭上から斬り下ろして前へ踏み込む。最後の一撃で溜めを消費する。", en: "Step in, sweep twice, then cleave from overhead and step through. The final blow spends charge."}
  cooldown_ticks: 100
  resource_cost: 30
  tags: [melee, physical, charge]
params:
  dash_distance: {type: blocks, default: 2.4}
  dash_distance_2: {type: blocks, default: 1.6}
  dash_distance_3: {type: blocks, default: 4.0}
  radius: {type: blocks, default: 3.0}
  reach: {type: blocks, default: 3.4}
  arc_deg: {type: number, default: 80}
  dmg_physical: {type: number, default: 35}
  dmg_physical_2: {type: number, default: 40}
  dmg_physical_3: {type: number, default: 60}
  knockback: {type: number, default: 0.4}
  knockback_2: {type: number, default: 0.5}
  knockback_3: {type: number, default: 1.3}
anchors:
  # doc-level anchors exist from tick 0 and follow the caster
  - {id: fx2_fx_ring, anchor: caster.look, mode: follow}
  - {id: fx3_fx_ring, anchor: caster.look, mode: follow}
  - {id: fx4_fx_chop, anchor: caster.look, mode: follow}
machine:
  start: rush1
  tail: 56
  states:
    rush1:
      for: 24
      then: rush2
      do:
        # --- gameplay swing 1 (v2 t10 dash / t13 hit): the dash ends at its first victim ---
        - {id: dash_hit, op: hit, at: 10, for: 3, every: 1, anchor: caster.body, shape: {sphere: 0.9}, targets: enemies, window: once, ignore_invulnerability: false}
        - {id: dash, op: dash, at: 10, speed: "= dash_distance / 3", for: 3, until: dash_hit.hit, direction: {forward: 1.0}, invulnerable: true, stop_on_block: true, follow_pitch: false, face_movement: false}
        - {id: hit1, op: hit, at: 13, anchor: caster, shape: {sphere: "${radius}"}, targets: enemies, damage: {physical: "= dmg_physical + 0.5 * stacks(caster, 'charge')"}, window: once, ignore_invulnerability: true, on: {hit: [{id: react, op: react, target: event.victim, flinch: true, for: 6}, {id: stop, op: freeze, at: 0, ticks: 2, scope: [caster, event.victim]}, {id: kb_1, op: knockback, target: event.victim, direction: "= normalize(flat(pos(event.victim) - pos(caster))) + vec(0.0, 0.2, 0.0)", strength: "${knockback}"}]}}
        - id: rig
          op: rig
          parent: caster
          mount: caster.hand_r
          anim: bastion-s2-body
          rest: [{axis: left, deg: 72}]
          respect_hit_stop: true
          freezes: [{at: 13, ticks: 2}, {at: 32, ticks: 2}, {at: 53, ticks: 8}]
          for: 80
          detach: true
          swing:
            # three swings of three keys (founder 2026-10-29), hits at 13 / 32 / 53
            - {at: 7, for: 6, from: {left: -0.95553, up: -0.0235, forward: -0.29395}, to: {left: 0.4445, up: -0.54123, forward: 0.71379}, edge: trailing, roll: 43.5, ease: in_quad}
            - {at: 13, for: 4, to: {left: -0.37137, up: -0.91282, forward: -0.16986}, edge: leading, roll: -36.0, ease: out_cubic}
            - {at: 17, for: 5, to: {left: 0.94723, up: 0.09866, forward: 0.305}, edge: trailing, roll: -45.2, ease: in_out_sine}
            - {at: 24, for: 8, from: {left: 0.94723, up: 0.09866, forward: 0.305}, to: {left: 0.4445, up: -0.54123, forward: 0.71379}, edge: leading, roll: 39.1, ease: in_quad}
            - {at: 32, for: 4, to: {left: -0.37137, up: -0.91282, forward: -0.16986}, edge: leading, roll: -63.3, ease: out_cubic}
            - {at: 36, for: 6, to: {left: 0.98812, up: -0.04022, forward: -0.14836}, edge: trailing, roll: -61.2, ease: in_out_sine}
            - {at: 45, for: 5, from: {left: 0.98812, up: -0.04022, forward: -0.14836}, to: {left: -0.71837, up: -0.39065, forward: 0.57562}, edge: leading, roll: -71.8, ease: in_quad}
            - {at: 50, for: 3, to: {left: -0.36874, up: -0.92918, forward: -0.02571}, edge: trailing, roll: 6.0, ease: out_cubic}
            - {at: 53, for: 5, to: {left: -0.12017, up: -0.96162, forward: -0.24666}, edge: trailing, roll: 0.0, ease: in_out_sine}
            - {at: 67, reset: true}
        # --- sound ---
        - {id: snd, op: sound, at: 0, sound: block.gravel.step, anchor: caster, volume: 1.0, pitch: 0.6}
        - {id: snd_2, op: sound, at: 0, sound: entity.ravager.step, anchor: caster, volume: 0.6, pitch: 0.8}
        - {id: snd_3, op: sound, at: 2, sound: item.armor.equip_chain, anchor: caster, volume: 0.9, pitch: 0.7}
        - {id: snd_4, op: sound, at: 2, sound: item.armor.equip_iron, anchor: caster, volume: 0.6, pitch: 0.6}
        - {id: snd_5, op: sound, at: 9, sound: entity.player.attack.sweep, anchor: caster, volume: 1.0, pitch: 0.5}
        - {id: snd_6, op: sound, at: 9, sound: item.trident.throw, anchor: caster, volume: 0.7, pitch: 0.6}
        - {id: snd_7, op: sound, at: 13, sound: item.mace.smash_ground_heavy, anchor: caster, volume: 1.0, pitch: 0.9}
        - {id: snd_8, op: sound, at: 13, sound: block.anvil.land, anchor: caster, volume: 0.8, pitch: 0.6}
        - {id: snd_9, op: sound, at: 13, sound: entity.player.attack.crit, anchor: caster, volume: 1.0, pitch: 0.8}
        - {id: snd_10, op: sound, at: 14, sound: item.armor.equip_netherite, anchor: caster, volume: 0.9, pitch: 0.6}
        - {id: snd_11, op: sound, at: 14, sound: block.chain.place, anchor: caster, volume: 0.8, pitch: 0.6}
        - {id: snd_12, op: sound, at: 23, sound: item.armor.equip_iron, anchor: caster, volume: 1.0, pitch: 0.8}
        # --- hit ring, floor, ink, streaks, flashes ---
        - {id: fx2_fx_ring_s2r_ring_quarters, op: display, times: 4, at: [10, 11, 14, 15], kind: sprite, see_through: true, sprite: [bastion-s1-ring-q0, bastion-s1-ring-q1, bastion-s1-ring-q2, bastion-s1-ring-q3], size: [2.6502, 2.6502], anchor: fx2_fx_ring, brightness: {block: 15, sky: 15}, offset: [{left: 0.98, up: 0.77, forward: -1.029}, {left: 0.968, up: 0.953, forward: 1.615}, {left: -1.664, up: 0.593, forward: -1.029}, {left: -1.676, up: 0.776, forward: 1.615}], rotate: [{axis: up, deg: -136}, {axis: left, deg: -84.5}, {axis: forward, deg: 45.87}], for: "= 24 - [10, 11, 14, 15][int(i)]"}
        - {id: fx2_fx_ring_s2r_floor_fill, op: display, at: 12, kind: sprite, sprite: bastion-s1-ink, size: [4.4, 4.4], anchor: fx2_fx_ring, brightness: {block: 15, sky: 15}, offset: {left: 0.25, up: 0.03, forward: 0.5}, rotate: [{axis: left, deg: -90}, {axis: forward, deg: 90}], for: 2}
        - {id: fx2_fx_ring_s2r_line_1, op: display, at: 12, kind: sprite, see_through: true, sprite: bastion-s1-streak, size: [0.5, 0.64], anchor: fx2_fx_ring, brightness: {block: 15, sky: 15}, billboard: center, offset: {left: 0.5, up: 0.6, forward: 1.2}, for: 3, motion: [{law: keys, keys: [{t: 0, offset: {left: 0.5, up: 0.6, forward: 1.2}, pose: [], scale: {left: 1.0, up: 1.0, forward: 1.0}}, {t: 1, offset: {left: 0.5, up: 0.6, forward: 1.2}, pose: [], scale: {left: 4.8003, up: 1.0, forward: 1.0}, ease: out_expo}, {t: 2, offset: {left: 0.5, up: 0.6, forward: 1.2}, pose: [], scale: {left: 3.3602, up: 0.2, forward: 1.0}, ease: in_quad}]}]}
        - {id: fx2_fx_ring_s2r_ink, op: display, at: 13, kind: sprite, sprite: bastion-s1-ink, size: [3.3997, 3.3997], anchor: fx2_fx_ring, brightness: {block: 15, sky: 15}, billboard: center, offset: {left: 0.212, up: 1.223, forward: 1.554}, for: 2}
        - {id: fx2_fx_ring_s2r_streak_main, op: display, at: 13, kind: sprite, see_through: true, sprite: bastion-s1-streak, size: [0.6, 2.048], anchor: fx2_fx_ring, brightness: {block: 15, sky: 15}, billboard: center, offset: {left: 0.062, up: 1.773, forward: 1.604}, rotate: [{axis: forward, deg: -4.0}], for: 6, motion: [{law: keys, keys: [{t: 0, offset: {left: 0.062, up: 1.773, forward: 1.604}, pose: [{axis: forward, deg: -4.0}], scale: {left: 1.0, up: 1.0, forward: 1.0}}, {t: 1, offset: {left: 0.062, up: 1.773, forward: 1.604}, pose: [{axis: forward, deg: -4.0}], scale: {left: 7.6661, up: 1.0, forward: 1.0}, ease: out_expo}, {t: 6, offset: {left: 0.062, up: 1.773, forward: 1.604}, pose: [{axis: forward, deg: -4.0}], scale: {left: 6.0, up: 0.125, forward: 1.0}, ease: in_quad}]}]}
        - {id: fx2_fx_ring_s2r_line_2, op: display, at: 13, kind: sprite, see_through: true, sprite: bastion-s1-streak, size: [0.5, 0.64], color: "#FFE070", anchor: fx2_fx_ring, brightness: {block: 15, sky: 15}, billboard: center, offset: {left: -0.5, up: 1.05, forward: 1.4}, for: 3, motion: [{law: keys, keys: [{t: 0, offset: {left: -0.5, up: 1.05, forward: 1.4}, pose: [], scale: {left: 1.0, up: 1.0, forward: 1.0}}, {t: 1, offset: {left: -0.5, up: 1.05, forward: 1.4}, pose: [], scale: {left: 4.0003, up: 1.0, forward: 1.0}, ease: out_expo}, {t: 2, offset: {left: -0.5, up: 1.05, forward: 1.4}, pose: [], scale: {left: 2.7995, up: 0.2, forward: 1.0}, ease: in_quad}]}]}
        - {id: fx2_fx_ring_s2r_flash, op: display, at: 13, kind: sprite, see_through: true, sprite: bastion-s1-flare, size: [1.2, 1.2], anchor: fx2_fx_ring, brightness: {block: 15, sky: 15}, billboard: center, offset: {left: 0.112, up: 1.273, forward: 1.504}, for: 4, motion: [{law: keys, keys: [{t: 0, offset: {left: 0.112, up: 1.273, forward: 1.504}, pose: [], scale: {left: 1.0, up: 1.0, forward: 1.0}}, {t: 1, offset: {left: 0.112, up: 1.273, forward: 1.504}, pose: [], scale: {left: 1.9168, up: 1.9168, forward: 1.0}, ease: out_back}, {t: 3, offset: {left: 0.112, up: 1.273, forward: 1.504}, pose: [], scale: {left: 0.7499, up: 0.7499, forward: 1.0}, ease: out_quad}]}]}
        - {id: fx2_fx_ring_s2r_flash_x, op: display, at: 13, kind: sprite, see_through: true, sprite: bastion-s1-flare, size: [1.2, 1.2], anchor: fx2_fx_ring, brightness: {block: 15, sky: 15}, offset: {left: 0.112, up: 1.273, forward: 1.504}, rotate: [{axis: left, deg: 90.0}], for: 4, motion: [{law: keys, keys: [{t: 0, offset: {left: 0.112, up: 1.273, forward: 1.504}, pose: [{axis: left, deg: 90.0}], scale: {left: 1.0, up: 1.0, forward: 1.0}}, {t: 1, offset: {left: 0.112, up: 1.273, forward: 1.504}, pose: [{axis: left, deg: 90.0}], scale: {left: 1.9168, up: 1.9168, forward: 1.0}, ease: out_back}, {t: 3, offset: {left: 0.112, up: 1.273, forward: 1.504}, pose: [{axis: left, deg: 90.0}], scale: {left: 0.7499, up: 0.7499, forward: 1.0}, ease: out_quad}]}]}
        - {id: fx2_fx_ring_s2r_flash_f, op: display, at: 13, kind: sprite, see_through: true, sprite: bastion-s1-flare, size: [1.2, 1.2], anchor: fx2_fx_ring, brightness: {block: 15, sky: 15}, offset: {left: 0.112, up: 1.273, forward: 1.504}, rotate: [{axis: up, deg: -90}], for: 4, motion: [{law: keys, keys: [{t: 0, offset: {left: 0.112, up: 1.273, forward: 1.504}, pose: [{axis: up, deg: 90.0}], scale: {left: 1.0, up: 1.0, forward: 1.0}}, {t: 1, offset: {left: 0.112, up: 1.273, forward: 1.504}, pose: [{axis: up, deg: 90.0}], scale: {left: 1.9168, up: 1.9168, forward: 1.0}, ease: out_back}, {t: 3, offset: {left: 0.112, up: 1.273, forward: 1.504}, pose: [{axis: up, deg: 90.0}], scale: {left: 0.7499, up: 0.7499, forward: 1.0}, ease: out_quad}]}]}
        - {id: fx2_fx_ring_s2r_streak_x, op: display, at: 13, kind: sprite, see_through: true, sprite: bastion-s1-streak, size: [0.6, 2.048], anchor: fx2_fx_ring, brightness: {block: 15, sky: 15}, offset: {left: 0.062, up: 1.773, forward: 1.604}, rotate: [{axis: left, deg: 90}, {axis: forward, deg: -4}], for: 6, motion: [{law: keys, keys: [{t: 0, offset: {left: 0.062, up: 1.773, forward: 1.604}, pose: [{axis: up, deg: -3.14148}, {axis: left, deg: 89.96015}, {axis: forward, deg: -3.14148}], scale: {left: 1.0, up: 1.0, forward: 1.0}}, {t: 1, offset: {left: 0.062, up: 1.773, forward: 1.604}, pose: [{axis: up, deg: -3.14148}, {axis: left, deg: 89.96015}, {axis: forward, deg: -3.14148}], scale: {left: 9.3333, up: 1.0, forward: 1.0}, ease: out_expo}, {t: 6, offset: {left: 0.062, up: 1.773, forward: 1.604}, pose: [{axis: up, deg: -3.14148}, {axis: left, deg: 89.96015}, {axis: forward, deg: -3.14148}], scale: {left: 6.0, up: 0.125, forward: 1.0}, ease: in_quad}]}]}
        # --- dust at the blade: the opening puffs and the swing-1 wave (v2 ticks 10 / 12 / 18) ---
        - {id: g1_b, op: particle_def, def: bastion-s1-p-gather-2, at: 10, anchor: {of: rig.root, to: rig.tip, samples: 2}}
        - {id: g1_c, op: particle_def, def: bastion-s1-p-gather-3, at: 10, anchor: {of: rig.root, to: rig.tip, samples: 2}}
        - {id: g1_a, op: particle_def, def: bastion-s1-p-gather-1, at: 12, anchor: {of: rig.root, to: rig.tip, samples: 2}}
        - id: wv1
          at: 18
          do:
            - {id: wv13, op: particle_def, def: bastion-s1-p-gather-3, every: 1, for: 3, anchor: {of: rig.root, to: rig.tip, samples: 2}}
            - {id: wv12, op: particle_def, def: bastion-s1-p-gather-2, at: 1, every: 1, for: 3, anchor: {of: rig.root, to: rig.tip, samples: 2}}
            - {id: wv11, op: particle_def, def: bastion-s1-p-gather-1, at: 2, every: 1, for: 3, anchor: {of: rig.root, to: rig.tip, samples: 2}}
        # --- hit 1 impact (tick 13) ---
        - {id: imp1_dust, op: particle_def, def: bastion-s1-p-impact-dust, at: 13, times: 3, anchor: {of: fx2_fx_ring, offset: {left: 0.096, up: 1.005, forward: 2.532}}, shift: {left: "= 0.25 * i", forward: "= -0.15 * i"}}
        - {id: imp1_crit, op: particle_def, def: bastion-s1-p-impact-crit, at: 13, times: 3, anchor: {of: fx2_fx_ring, offset: {left: 0.096, up: 1.005, forward: 2.532}}, shift: {left: "= 0.25 * i", forward: "= -0.15 * i"}}
        - {id: imp1_ench, op: particle_def, def: bastion-s1-p-impact-enchant, at: 13, anchor: {of: fx2_fx_ring, offset: {left: 0.096, up: 1.005, forward: 2.532}}}
        - {id: imp1_puff, op: particle_def, def: bastion-s1-p-puff, at: 13, anchor: {of: fx2_fx_ring, offset: {left: 0.096, up: 1.005, forward: 2.532}}, shift: {up: -0.605}}
        - {id: imp1_poof, op: particle_def, def: bastion-s1-p-poof, at: 13, anchor: {of: fx2_fx_ring, offset: {left: 0.096, up: 1.005, forward: 2.532}}, shift: {up: -0.605}}
        - id: ring1
          at: 13
          every: 1
          times: 3
          do:
            # plane = left/up (normal forward); angle = 36 i - 20 parent.i degrees, radius 0.25 -> 0.8
            - id: ring1_pt
              op: particle_def
              def: bastion-s1-p-ring-crit
              anchor: {of: fx2_fx_ring, offset: {left: 0.096, up: 1.005, forward: 2.532}}
              times: 10
              shift:
                left: "= (0.25 + 0.275 * parent.i) * cos((36 * i - 20 * parent.i) * 0.0174533)"
                up: "= (0.25 + 0.275 * parent.i) * sin((36 * i - 20 * parent.i) * 0.0174533)"
        # --- blade fx: segments between the rig points (ADR-0303 10.5) ---
        - {id: b1_trail, op: particle_def, def: bastion-s1-p-trail, at: 7, every: 1, for: 15, anchor: {of: rig.root, to: rig.tip, samples: 11}}
        - {id: b1_sheath, op: particle_def, def: bastion-s1-p-sheath, at: 7, every: 1, for: 15, anchor: {of: rig.root, to: rig.tip, samples: 5}}
        - {id: b1_steel, op: particle_def, def: bastion-s1-p-steel, at: 7, every: 1, for: 15, anchor: rig.tip}
        - {id: b1_crit, op: particle_def, def: bastion-s1-p-trail-crit, at: 13, every: 1, for: 3, anchor: {of: rig.root, to: rig.tip, samples: 11}}
    rush2:
      for: 21
      then: chop
      do:
        # --- gameplay swing 2 (v2 t29 dash / t32 hit) ---
        - {id: dash_hit_2, op: hit, at: 5, for: 3, every: 1, anchor: caster.body, shape: {sphere: 0.9}, targets: enemies, window: once, ignore_invulnerability: false}
        - {id: dash_2, op: dash, at: 5, speed: "= dash_distance_2 / 3", for: 3, until: dash_hit_2.hit, direction: {forward: 1.0}, invulnerable: true, stop_on_block: true, follow_pitch: false, face_movement: false}
        - {id: hit2, op: hit, at: 8, anchor: caster, shape: {sphere: "${radius}"}, targets: enemies, damage: {physical: "= dmg_physical_2 + 0.5 * stacks(caster, 'charge')"}, window: once, ignore_invulnerability: true, on: {hit: [{id: react_2, op: react, target: event.victim, flinch: true, for: 6}, {id: stop_2, op: freeze, at: 0, ticks: 2, scope: [caster, event.victim]}, {id: kb, op: knockback, target: event.victim, direction: "= normalize(flat(pos(event.victim) - pos(caster))) + vec(0.0, 0.2, 0.0)", strength: "${knockback_2}"}]}}
        # --- sound ---
        - {id: snd_13, op: sound, at: 3, sound: item.armor.equip_chain, anchor: caster, volume: 0.9, pitch: 0.7}
        - {id: snd_14, op: sound, at: 3, sound: item.armor.equip_iron, anchor: caster, volume: 0.6, pitch: 0.6}
        - {id: snd_15, op: sound, at: 4, sound: entity.player.attack.sweep, anchor: caster, volume: 1.0, pitch: 0.45}
        - {id: snd_16, op: sound, at: 4, sound: entity.breeze.wind_burst, anchor: caster, volume: 0.6, pitch: 0.5}
        - {id: snd_17, op: sound, at: 4, sound: item.trident.throw, anchor: caster, volume: 0.8, pitch: 0.5}
        - {id: snd_18, op: sound, at: 8, sound: item.mace.smash_ground_heavy, anchor: caster, volume: 1.0, pitch: 0.7}
        - {id: snd_19, op: sound, at: 8, sound: block.anvil.land, anchor: caster, volume: 0.8, pitch: 0.5}
        - {id: snd_20, op: sound, at: 8, sound: entity.player.attack.crit, anchor: caster, volume: 1.0, pitch: 0.65}
        - {id: snd_21, op: sound, at: 8, sound: entity.iron_golem.attack, anchor: caster, volume: 1.0, pitch: 0.6}
        - {id: snd_22, op: sound, at: 8, sound: entity.generic.explode, anchor: caster, volume: 0.45, pitch: 0.5}
        - {id: snd_23, op: sound, at: 9, sound: item.armor.equip_netherite, anchor: caster, volume: 0.9, pitch: 0.6}
        - {id: snd_24, op: sound, at: 9, sound: block.chain.place, anchor: caster, volume: 0.8, pitch: 0.6}
        - {id: snd_25, op: sound, at: 17, sound: item.armor.equip_netherite, anchor: caster, volume: 0.9, pitch: 0.5}
        - {id: snd_26, op: sound, at: 18, sound: block.chain.place, anchor: caster, volume: 0.8, pitch: 0.5}
        - {id: snd_27, op: sound, at: 19, sound: item.armor.equip_chain, anchor: caster, volume: 0.9, pitch: 0.5}
        # --- hit ring, floor, ink, streaks, flashes ---
        - {id: fx3_fx_ring_s2r_ring_quarters, op: display, times: 4, at: [5, 6, 9, 10], kind: sprite, see_through: true, sprite: [bastion-s1-ring-q0, bastion-s1-ring-q1, bastion-s1-ring-q2, bastion-s1-ring-q3], size: [2.6502, 2.6502], anchor: fx3_fx_ring, brightness: {block: 15, sky: 15}, offset: [{left: 0.98, up: 0.77, forward: -1.029}, {left: 0.968, up: 0.953, forward: 1.615}, {left: -1.664, up: 0.593, forward: -1.029}, {left: -1.676, up: 0.776, forward: 1.615}], rotate: [{axis: up, deg: 74.03572}, {axis: left, deg: -69.25163}, {axis: forward, deg: -64.62826}], for: "= 19 - [5, 6, 9, 10][int(i)]"}
        - {id: fx3_fx_ring_s2r_floor_fill, op: display, at: 7, kind: sprite, sprite: bastion-s1-ink, size: [4.4, 4.4], anchor: fx3_fx_ring, brightness: {block: 15, sky: 15}, offset: {left: 0.25, up: 0.03, forward: 0.5}, rotate: [{axis: up, deg: -69.28203}, {axis: left, deg: -69.28203}, {axis: forward, deg: 69.28203}], for: 2}
