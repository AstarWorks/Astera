# rifle-shot: fast long-range round. The state lasts one tick past the flight (life + 1); the cast ends when the body ends.
apiVersion: astera/v3
kind: Skill
id: rifle-shot
item: rifle
meta:
  name: {ja: "ライフル射撃", en: "Rifle Shot"}
  description: {ja: "高速で遠くまで届く、重い一発を撃つ。", en: "Fires a fast, long-range, hard-hitting round."}
  cooldown_ticks: 14
  resource_cost: 1
  tags: [ranged, gun, sustain]
params:
  dmg:   {type: number, default: 25.0}
  speed: {type: number, default: 4.5}
  life:  {type: ticks, default: 40}
anchors:
  - {id: start,  anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: muzzle, anchor: caster.eye, offset: {forward: 0.45, left: -0.35, up: -0.65}, mode: snapshot}  # gun position: right of the eye, below it, so the FP tracer runs from the held item to the crosshair
  - {id: heart,  anchor: victim.center, mode: follow}
machine:
  start: fire
  tail: 4
  states:
    fire:
      for: 41
      then: end
      on:
        - {event: bolt.end, to: end}
      enter:
        - {id: fire_fx, use: gun-muzzle, with: {snd: "astera:weapons/rifle-crack", vol: 1.0, pitch: 0.7}, frames: {muzzle: muzzle}}
      do:
        - id: bolt
          op: projectile
          origin: start
          velocity: "= look(caster) * ${speed}"
          for: "${life}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: tracer_h, use: skill:gun-tracer, with: {thickness: 0.14}, frames: {muzzle: muzzle, tip: contact}}
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg}"}}
              - {id: chip, op: break_area, anchor: contact, shape: {sphere: {radius: 0.5}}, tool: none, block_damage: 20, ripple: 29, revert: 200, outside_arena: false}
              - {id: snd_hit, op: sound, sound: "astera:weapons/gun-impact", anchor: contact}
              - {id: fx_hit, op: particle_def, def: gun-impact, anchor: heart}
            block:
              - {id: tracer_b, use: skill:gun-tracer, with: {thickness: 0.14}, frames: {muzzle: muzzle, tip: contact}}
              - {id: chip_b, op: break_area, anchor: contact, shape: {sphere: {radius: 0.5}}, tool: none, block_damage: 20, ripple: 29, revert: 200, outside_arena: false}
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact, volume: 0.6, pitch: 1.6}
              - {id: fx_blk0, op: particle_def, def: gun-impact, anchor: contact}
              - {id: fx_blk1, op: particle_def, def: gun-impact-smoke, anchor: contact}
            expire:
              - {id: tracer_e, use: skill:gun-tracer, with: {thickness: 0.14}, frames: {muzzle: muzzle, tip: contact}}
        # the visible round, riding the body
        - {id: slug, use: bullet-body, with: {item: "minecraft:iron_nugget", scale: 0.6}, frames: {body: bolt}, events: {body_end: bolt.end}}
    end: {final: true}
