# WP1: gun sneak + drop key (Shift+Q). WP2: a real reload. `reload_ticks` marks it as a reload:
# after 30 ticks the source item's ammo is refilled; ammo casts are rejected until
# then. The buff phase keeps the short slow + click sound as the visible cue.

id: pistol-reload

name:
  ja: "リロード"
  en: "Reload"
description:
  ja: "銃を再装填する。短時間動きが鈍る。"
  en: "Reloads the gun. Slows you briefly."

archetype: buff
cooldown_ticks: 30
resource_cost: 0               # reloading itself is free
reload_ticks: 30
tags: [ gun, reload ]

params:
  type: buff
  status_effect_id: reloading
  duration_ticks: 30

phases:
  type: buff
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: item.crossbow.loading_start
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.3 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 0.7, height: -0.3 }
      particle_id: reload-click
  expire:
    - type: play_sound
      targets: { type: caster }
      sound_id: block.iron_door.close
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.7 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 0.7, height: -0.3 }
      particle_id: reload-click
  removed: []
