# WP1: gun drop key (Q). WP2: a real reload. `reload_ticks` marks it as a reload:
# after 30 ticks the source item's ammo is refilled; ammo casts are rejected until
# then. The buff phase keeps the short slow + click sound as the visible cue.

# V-2a visuals. Per-reload particle budget: start 7 + drop 3 + rack 8 + ready 15 = 33.
id: pistol-reload

name:
  ja: "リロード"
  en: "Reload"
description:
  ja: "銃を再装填する。短時間動きが鈍る。"
  en: "Reloads the gun. Slows you briefly."

archetype: buff
cooldown_ticks: 30
resource_cost: 0               # reloading itself is free
reload_ticks: 30
tags: [ gun, reload ]

params:
  type: buff
  status_effect_id: reloading
  duration_ticks: 30

phases:
  type: buff
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: item.crossbow.loading_start
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.3 }
    # sequence: mag release (t0), mag drop (t4), slide rack (t14)
    - type: schedule_particle_animation
      targets: { type: caster_forward, distance: 0.7, height: -0.3 }
      animation:
        - type: point
          particles:
            - { id: crit, count: 4, extra: 0.1 }
            - { id: electric_spark, count: 3, extra: 0.15 }
        - type: point
          delay_ticks: 4
          particles:
            - { id: dust, count: 3, color: { r: 170, g: 170, b: 180 }, scale: 1.3, offset: { x: 0.0, y: -0.4, z: 0.0 } }
        - type: point
          delay_ticks: 14
          particles:
            - { id: electric_spark, count: 6, extra: 0.25 }
            - { id: white_smoke, count: 2, extra: 0.02 }
  expire:
    - type: play_sound
      targets: { type: caster }
      sound_id: block.iron_door.close
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.7 }
    # ready: bolt closes, bright pulse
    - type: schedule_particle_animation
      targets: { type: caster_forward, distance: 0.7, height: -0.3 }
      animation:
        - type: point
          particles:
            - { id: end_rod, count: 6, extra: 0.1 }
            - { id: electric_spark, count: 6, extra: 0.2 }
            - { id: firework, count: 3, extra: 0.1 }
  removed: []
