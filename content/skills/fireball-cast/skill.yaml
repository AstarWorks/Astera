apiVersion: "astera/v3"
kind: Skill
id: fireball-cast
item: fireball-charge
meta: {name: {ja: "火球", en: Fireball}, description: {ja: "火の玉を放ち、着弾で爆ぜる。", en: "Hurls a fireball that bursts on impact."}, cooldown_ticks: 70, resource_cost: 16, tags: [ranged, fire, magic]}
anchors:
  muzzle: {anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  cast_fx: {anchor: caster.eye, offset: {up: -0.25, forward: 0.9}, mode: snapshot}
  heart: {anchor: victim.body, offset: {up: 0.4}}
# anchor note: v2 enemy point offset Y minus 0.8 (example b maps 1.0 -> up 0.2)
presentation:
  timeline:
    - at: 0
      do:
        - {id: snd, op: sound, sound: "entity.blaze.shoot", anchor: caster, volume: 0.9, pitch: 0.9}
        - {id: fx, op: particle_def, def: fire-cast, anchor: cast_fx}
    - {at: 0, every: 1, until: bolt.end, do: [{op: particle, particle: flame, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.08, 0.08, 0.08]}]}
    - {at: 0, every: 1, until: bolt.end, do: [{op: particle, particle: smoke, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.04, 0.04, 0.04]}]}
gameplay:
  timeline:
    - at: 0
      do:
        - id: bolt
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * 1.5"
          for: 60
          radius: 0.5
          hit: {targets: enemies, once: true}
          block: {mode: despawn}
          on:
            hit:
              # GAP: explode (power 1.2, radius 2.5, break_blocks false, fire 27.5, target victim) -> none in v3 gameplay ops; kept verbatim
              - {id: boom, op: explode, target: event.victim, power: 1.2, break_blocks: false, radius: 2.5, components: [{kind: fire, amount: 27.5}]}
              - {id: st_burn, op: status, target: event.victim, status: burn, stacks: 1, for: 20}
              - {id: snd_hit, op: sound, sound: "astera:skills/fire-impact", anchor: heart, volume: 0.7, pitch: 1.0}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
            block:
              # GAP: explode at contact.point (same fields as hit) -> none in v3 gameplay ops; kept verbatim
              - {id: boom_2, op: explode, anchor: contact.point, power: 1.2, break_blocks: false, radius: 2.5, components: [{kind: fire, amount: 27.5}]}
              - {id: snd_blk, op: sound, sound: "astera:skills/fire-impact", anchor: contact.point, volume: 0.7, pitch: 1.0}
              - {id: fx_blk, op: particle_def, def: hit-spark, anchor: contact.point}
