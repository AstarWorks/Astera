# Match arsenal (wp/match-arsenal): simple PvP skill. One cast sound, a few particles.

id: shock-wand-zap

name:
  ja: "電撃"
  en: "Zap"
description:
  ja: "素早い電撃。麻痺させることがある。"
  en: "A quick bolt of electricity that can stun."

archetype: projectile
cooldown_ticks: 18
resource_cost: 6
tags: [ ranged, electric ]

params:
  type: projectile
  launch_speed: 3.2
  max_lifetime_ticks: 40
  visual:
    trail_spacing: 0.4
    trail:
      - type: point
        particles:
          - { id: electric_spark, offset: { x: 0.04, y: 0.04, z: 0.04 } }
          - { id: dust, color: { r: 255, g: 240, b: 120 }, scale: 1.0 }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:skill/wand/cast
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 1.4 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 0.9, height: -0.25 }
      particle_id: thunder-cast
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 16.0 }
          attribute: electric
    - type: play_sound
      targets: { type: target }
      sound_id: astera:skills/lightning-impact
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
    - type: apply_status
      targets: { type: target }
      status_id: shock
      effect_duration_ticks: { type: literal, value: 30 }
      chance: { type: literal, value: 0.3 }
  hit_block:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: astera:weapons/gun-impact-block
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.5 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: hit-spark
  miss: []
  expire: []
