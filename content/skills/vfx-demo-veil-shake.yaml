# Veil + self-shake demo: no weapon rig, so the caster view is unobstructed. Not bound to any item.
id: vfx-demo-veil-shake
name: {ja: "デモ・ベール", en: "Demo Veil"}
description: {ja: "screen_veil と camera_shake を術者に再生するデモ。", en: "Plays screen_veil and camera_shake on the caster."}
archetype: sequence
cooldown_ticks: 20
tags: [demo, vfx]
params: {type: sequence}
phases:
  type: sequence
  cast:
  - type: screen_veil
    targets: {type: caster}
    sprite: burst
    distance: {type: literal, value: 0.4}
    scale: {type: literal, value: 1.4}
    ticks: {type: literal, value: 8}
    color: '#FFC84A'
    viewers: caster
    delay_ticks: {type: literal, value: 6}
  - type: camera_shake
    targets: {type: caster}
    intensity: {type: literal, value: 1.0}
    ticks: {type: literal, value: 10}
    shape: decay
    direction: none
    viewers: caster
    delay_ticks: {type: literal, value: 6}
