id: orrery-def
name: {en: Orrery Counter-Seal, ja: 天球の返し}
description: {en: Guard against physical attacks and bank three Charge., ja: 天球の返し。金の軌跡と充填を操る。}
archetype: sequence
cooldown_ticks: 90
resource_cost: 12
tags: [persona, orrery]
params: {type: sequence}
phases:
  type: sequence
  cast:
  - type: play_vfx
    targets: {type: caster}
    delay_ticks: {type: literal, value: 0}
    vfx_id: orrery-guard
  - type: modify_attribute
    targets: {type: caster}
    delay_ticks: {type: literal, value: 0}
    attribute_key: resist.physical
    delta: {type: literal, value: 0.6}
    ticks: {type: literal, value: 30}
  - type: apply_status
    targets: {type: caster}
    delay_ticks: {type: literal, value: 0}
    status_id: charge
    effect_duration_ticks: {type: literal, value: 400}
    stack_count: {type: literal, value: 3}
  - type: play_sound
    targets: {type: caster}
    delay_ticks: {type: literal, value: 0}
    sound_id: item.shield.block
