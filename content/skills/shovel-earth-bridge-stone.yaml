# Match arsenal (wp/match-arsenal): simple PvP skill. One cast sound, a few particles.

id: shovel-earth-bridge-stone

name:
  ja: "石の土橋"
  en: "Stone Earth Bridge"
description:
  ja: "目の前に固めた粘土の橋を架ける。"
  en: "Lays a packed-clay bridge ahead of you."

archetype: sequence
cooldown_ticks: 300
resource_cost: 0
tags: [ tool, cover ]

params:
  type: sequence

phases:
  type: sequence
  cast:
    - type: place_shape
      shape: bridge
      block_key: "astera:packed_clay"
      width: 2
      length: 5
      consume_from_inventory: false
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/gun-impact-block
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 1.0 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 2.0, height: 0.0 }
      particle_id: hit-spark
