# Sticky bomb, in the frame grammar (ADR-0314 / ADR-0315): a lobbed body that sticks to the first block or enemy it touches and still bursts at the
# fixed fuse tick after the throw (fuse_ticks = the projectile `for`, fixed at load). Gameplay (speed 1.2, fuse 60, blast 3.0 blocks / 30 fire,
# chip 1.0 sphere) is unchanged; the fragment `blast` keeps only its gameplay rows (explode, damage, chip).
# Frames: `eye` is the caster's eye / aim basis (v = aim, s = right, w = s x v); the bomb leaves at v 0.5 (the old muzzle) and the cast puff is at
# v 1.8, w -0.25. There is no `hand` frame / rig: the item has no point table in content/frames (rig needs one), so the arm stays on the vanilla pose. `body` rides the bomb (v forward, w up, so it stays valid while the bomb is stuck and its
# velocity is 0): the slime-ball shell, its smoke and the green ember tail (the line `tail`, 0.4 behind, 2 samples) are points of it.
# `hit` is one per victim at the victim's centre and `blk` one per block contact at the contact point, v the way the bomb came in: the
# sticking sound and hit-spark sit on them.
apiVersion: astera/v3
kind: Skill
id: sticky-bomb-throw
item: sticky-bomb
meta:
  name: {ja: "粘着爆弾", en: "Sticky Bomb"}
  description: {ja: "投げつけると着弾で爆発し、周囲のブロックを少し傷つける。", en: "Lobs a bomb that bursts on contact, chipping nearby blocks."}
  cooldown_ticks: 100
  resource_cost: 0
  tags: [ranged, fire]
params:
  launch_speed: {type: number, default: 1.2}
  fuse_ticks:   {type: ticks, default: 60}
  blast_radius: {type: blocks, default: 3.0}
  blast_damage: {type: number, default: 30.0}
frames:
  - id: eye
    origin: caster.eye
    v: aim
    w: s x v
    s: right
  - id: body
    origin: bolt
    v: forward
    w: up
    s: v x w
  - id: hit
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
  - id: blk
    on: event.block
    each: true
    origin: contact
    v: incoming
    w: up
    s: v x w
lines:
  tail: {frame: body, from: {v: -0.4}, to: {v: 0}}
fragments:
  blast:
    params:
      radius: {type: blocks, required: true}
      damage: {type: number, required: true}
    frames_in: {spot: anchor}
    do:
      - {id: boom, op: explode, at: 0, anchor: spot, power: 1.5, break_blocks: false, fire: false}
      - {id: dmg, op: damage, at: 0, target: {kind: enemies, around: spot, radius: "${radius}"}, damage: {fire: "${damage}"}}
      - {id: chip, op: break_area, at: 0, anchor: spot, shape: {sphere: {radius: 1.0}}, tool: none, block_damage: 25, ripple: 29, revert: 200, outside_arena: false}
machine:
  start: fly
  tail: 2
  states:
    fly:
      for: "= fuse_ticks"
      then: end
      do:
        - {id: snd, op: sound, sound: "astera:skill/wand/cast", frame: eye, volume: 0.8, pitch: 0.8, at: 0}
        - {id: puff, op: particle, particle: flame, frame: eye, pos: {v: 1.8, w: -0.25}, count: 2, offset: [0.04, 0.04, 0.04], at: 0}
        - id: bolt
          op: projectile
          frame: eye
          pos: {v: 0.5}
          velocity: "= look(caster) * ${launch_speed}"
          for: "${fuse_ticks}"
          gravity: 0.04
          radius: 0.5
          hit: {targets: enemies, once: true, attach: {for: "${fuse_ticks}"}}
          block: {mode: stick, fused: true}
          on:
            hit:
              - {id: snd_hit, op: sound, sound: "astera:skills/fire-impact", frame: hit, volume: 0.7, pitch: 1.2, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, frame: hit, detach: true}
            block:
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", frame: blk, volume: 0.5, pitch: 1.5, detach: true}
              - {id: fx_blk, op: particle_def, def: hit-spark, frame: blk, detach: true}
            end:
              - {op: use, use: "fragment:blast", with: {radius: "${blast_radius}", damage: "${blast_damage}"}, frames: {spot: bolt}}
        - {id: shell, op: display, kind: item, item: "minecraft:slime_ball", context: fixed, frame: body, scale: [0.25, 0.25, 0.25], at: 0, until: bolt.end}
        - {id: smoke, op: particle_def, def: smoke-dark, frame: body, at: 2, every: 1, until: bolt.end}
        - {id: ember, op: particle, particle: dust, along: tail, samples: 2, count: 1, color: "#78c850", size: 1.0, at: 2, every: 1, until: bolt.end}
    end: {final: true}
