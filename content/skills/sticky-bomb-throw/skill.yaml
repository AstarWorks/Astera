apiVersion: astera/v3
kind: Skill
id: sticky-bomb-throw
item: sticky-bomb
meta:
  name: {ja: "粘着爆弾", en: "Sticky Bomb"}
  description: {ja: "投げつけると着弾で爆発し、周囲のブロックを少し傷つける。", en: "Lobs a bomb that bursts on contact, chipping nearby blocks."}
  cooldown_ticks: 100
  resource_cost: 0
  tags: [ranged, fire]
anchors:
  - {id: muzzle, anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: foe,    anchor: victim.root}
  - {id: flash,  anchor: caster, offset: {up: -0.25, forward: 0.9}}
  - {id: heart,  anchor: victim.root, offset: {up: 1.2}}
machine:
  start: fly
  states:
    fly:
      for: 60      # v2 max_lifetime_ticks 60
      then: end
      on:
        - {event: bolt.end, to: end}      # v2: the cast ends when the projectile body ends
      do:
        - {id: snd, op: sound, sound: "astera:skill/wand/cast", anchor: caster, volume: 0.8, pitch: 0.8}
        - {id: puff, op: particle_def, def: fire-cast, anchor: flash}
        - id: bolt
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * 1.2"
          for: 60
          radius: 0.5
          hit: {targets: enemies, once: true}
          block: {mode: despawn}
          on:
            hit:
              - {id: explode, op: explode, at: 0, anchor: foe, power: 1.5, break_blocks: false, fire: false}
              # GAP(Q1): max_count spelling A (required, `all` = v2 unlimited); under B delete the key
              - {id: blast, op: damage, at: 0, target: {kind: enemies, around: foe, radius: 3.0, max_count: all}, damage: {fire: 30.0}}
              - {id: chip, op: break_area, at: 0, anchor: contact, shape: {sphere: {radius: 1.0, ahead: 0.0}}, tool: none, block_damage: 25, ripple: 0, revert: 200, outside_arena: false}
              - {id: snd_hit, op: sound, sound: "astera:skills/fire-impact", anchor: contact, volume: 0.7, pitch: 1.2}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
            block:
              - {id: explode_2, op: explode, at: 0, anchor: contact, power: 1.5, break_blocks: false, fire: false}
              # GAP(Q1): max_count spelling A (required, `all` = v2 unlimited); under B delete the key
              - {id: blast_2, op: damage, at: 0, target: {kind: enemies, around: contact, radius: 3.0, max_count: all}, damage: {fire: 30.0}}
              - {id: chip_2, op: break_area, at: 0, anchor: contact, shape: {sphere: {radius: 1.0, ahead: 0.0}}, tool: none, block_damage: 25, ripple: 0, revert: 200, outside_arena: false}
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact, volume: 0.5, pitch: 1.5}
              - {id: fx_blk, op: particle_def, def: hit-spark, anchor: contact}
        - {id: trail,   op: particle, particle: smoke, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.04, 0.04, 0.04], at: 0, every: 1, until: bolt.end}
        - {id: trail_2, op: particle, particle: dust,  anchor: {of: bolt, sweep: 0.4}, count: 1, color: "#78c850", size: 1.0, at: 0, every: 1, until: bolt.end}
    end: {final: true}
