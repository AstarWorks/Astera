apiVersion: astera/v3
kind: Skill
id: sticky-bomb-throw
item: sticky-bomb
meta:
  name: {ja: "粘着爆弾", en: "Sticky Bomb"}
  description: {ja: "投げつけると着弾で爆発し、周囲のブロックを少し傷つける。", en: "Lobs a bomb that bursts on contact, chipping nearby blocks."}
  cooldown_ticks: 100
  resource_cost: 0
  tags: [ranged, fire]
# GAP: gameplay.expose (flight_speed <- launch_speed) -> none (inline literal)
# GAP: v2 vanilla emit without speed (trail smoke) -> extra: 0 (v3 identity); v2 default not recoverable
anchors:
  - {id: muzzle, anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: flash,  anchor: caster.eye, offset: {up: -0.25, forward: 0.9}}
  - {id: foe,    anchor: victim.root}
  - {id: heart,  anchor: victim.root, offset: {up: 1.2}}
machine:
  start: fly
  states:
    fly:
      for: 61      # max flight 60 + 1 so the end handlers fit
      then: end
      do:
        - {id: snd, op: sound, sound: "astera:skill/wand/cast", anchor: caster, volume: 0.8, pitch: 0.8}
        - {id: puff, op: particle_def, def: fire-cast, anchor: flash}
        - id: bolt
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * 1.2"
          for: 60
          radius: 0.5
          hit: {targets: enemies, once: true}
          block: {mode: despawn}
          on:
            hit:
              # GAP: explode {power: 1.5, break_blocks: false, radius: 3.0, fire 30, target: victim} -> damage area fire 30 radius 3 (explosion power/knockback has no v3 spelling; max_count 16 is a guess, v2 had none)
              - {id: explode, op: damage, target: {kind: enemies, around: foe, radius: 3.0, max_count: 16, include_self: false}, components: [{kind: fire, amount: 30.0}]}
              # GAP: break_area {sphere r 1.0, block_damage 25, breaks true, staged false, length 0} at contact.point -> none (no block-damage op in ADR 10.1b)
              - {id: snd_hit, op: sound, sound: "astera:skills/fire-impact", anchor: foe, volume: 0.7, pitch: 1.2}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
            block:
              # GAP: explode at contact.point (same fields as above) -> damage area fire 30 radius 3 around contact.point
              - {id: explode, op: damage, target: {kind: enemies, around: contact.point, radius: 3.0, max_count: 16, include_self: false}, components: [{kind: fire, amount: 30.0}]}
              # GAP: break_area {sphere r 1.0, block_damage 25, breaks true} at contact.point -> none
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact.point, volume: 0.5, pitch: 1.5}
              - {id: fx_blk, op: particle_def, def: hit-spark, anchor: contact.point}
        - {id: trail,   op: particle, particle: smoke, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.04, 0.04, 0.04], at: 0, every: 1, until: bolt.end}
        - {id: trail_2, op: particle, particle: dust,  anchor: {of: bolt, sweep: 0.4}, count: 1, color: "#78c850", size: 1.0, at: 0, every: 1, until: bolt.end}
    end: {final: true}
