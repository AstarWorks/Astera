# revolver-shot: slow heavy bullet, in the frame grammar (ADR-0314). Three frames: `gun` on the right hand, aimed where the caster looks,
# kicking back 0.1 along its own v on the shot; `hit` one per victim at the victim's centre, v facing the way the bullet came in; `blk` one
# per block contact at the contact point, v the way the bullet came in. Everything drawn or heard is a point of one of them: the flash and
# the bolt at v 0.7 (the barrel), the sparks at v -0.2 (the entry side, on a victim or a block). No 3D.
apiVersion: astera/v3
kind: Skill
id: revolver-shot
item: revolver
meta:
  name: {ja: "リボルバー射撃", en: "Revolver Shot"}
  description: {ja: "一発一発が重い銃撃。", en: "Slow, heavy shots."}
  cooldown_ticks: 16
  resource_cost: 6
  tags: [ranged, gun, physical]
params:
  dmg:   {type: number, default: 30}
  speed: {type: number, default: 3.6}
  life:  {type: ticks, default: 40}
frames:
  - id: gun
    origin: caster.hand_r
    v: aim
    w: up
    s: v x w
    move:
      - {at: 0, for: 2, to: {v: -0.1}, ease: out_quad}   # recoil
      - {at: 2, for: 6, to: {v: 0}, ease: in_out_sine}
  - id: hit
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
  - id: blk
    on: event.block
    each: true
    origin: contact
    v: incoming
    w: up
    s: v x w
machine:
  start: fire
  tail: 4
  states:
    fire:
      for: 40
      then: end
      on:
        - {event: bolt.end, to: end}
      do:
        - {id: snd, op: sound, at: 0, sound: "astera:weapons/gun-shot", frame: gun, volume: 0.8, pitch: 0.8}
        - {id: flash, op: particle_def, at: 0, def: gun-muzzle-flash, frame: gun, pos: {v: 0.7}}
        - id: bolt
          op: projectile
          frame: gun
          pos: {v: 0.7}
          velocity: "= look(caster) * ${speed}"
          for: "${life}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg}"}}
              - {id: snd_hit, op: sound, sound: "astera:weapons/gun-impact", frame: hit, volume: 0.8, detach: true}
              - {id: spark, op: particle, particle: dust, frame: hit, pos: {v: -0.2}, count: 4, offset: [0.06, 0.06, 0.06], color: "#ffd060", size: 0.45, detach: true}
              - {id: dust, op: particle, particle: dust, frame: hit, pos: {v: -0.2, w: 0.1}, count: 3, offset: [0.12, 0.12, 0.12], color: "#8c8c8c", size: 0.6, detach: true}
            block:
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", frame: blk, volume: 0.5, pitch: 1.5, detach: true}
              - {id: spark_blk, op: particle, particle: dust, frame: blk, pos: {v: -0.2}, count: 4, offset: [0.06, 0.06, 0.06], color: "#ffd060", size: 0.45, detach: true}
              - {id: dust_blk, op: particle, particle: dust, frame: blk, pos: {v: -0.2, w: 0.1}, count: 3, offset: [0.12, 0.12, 0.12], color: "#8c8c8c", size: 0.6, detach: true}
        - {id: trail0, op: particle, particle: dust, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.02, 0.02, 0.02], color: "#ffe9a8", size: 0.3, at: 2, every: 1, until: bolt.end}
        - {id: trail1, op: particle, particle: dust, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.03, 0.03, 0.03], color: "#9a9a9a", size: 0.35, at: 2, every: 1, until: bolt.end}
    end: {final: true}
