# v3 hand port of the v2 skill (ADR-0303 rev4.2). v2 params launch_speed 3.6, max_lifetime_ticks 40, dmg_physical 30.
apiVersion: astera/v3
kind: Skill
id: revolver-shot
item: revolver
meta: {name: {ja: "リボルバー射撃", en: "Revolver Shot"}, description: {ja: "一発一発が重い銃撃。", en: "Slow, heavy shots."}, cooldown_ticks: 16, resource_cost: 6, tags: [ranged, gun, physical]}
anchors:
  - {id: start,  anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}            # was pt_aim_0_0_0p5
  - {id: muzzle, anchor: caster, offset: {up: -0.25, forward: 0.9}, mode: snapshot} # was pt_caster_0_m0p25_0p9 (feet, yaw-only)
  - {id: heart,  anchor: victim.root, offset: {up: 1.2}}   # was pt_enemy_0_1p2_0 (victim feet, yaw-only)
machine:
  start: fire
  states:
    fire:
      for: 40                       # = max_lifetime_ticks; covers the whole flight
      then: end
      on:
        - {event: bolt.end, to: end}
      enter:
        - {id: snd, op: sound, sound: "astera:weapons/gun-shot", anchor: caster, volume: 0.8, pitch: 0.8}
        - {id: fl0, op: particle_def, def: gun-muzzle-flash, anchor: muzzle}
      do:
        - id: bolt
          op: projectile
          origin: start
          velocity: "= look(caster) * 3.6"
          for: 40
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {physical: 30}}
              - {id: snd_hit, op: sound, sound: "astera:weapons/gun-impact", anchor: contact.point, volume: 0.8, pitch: 1.0}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
            block:
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact, volume: 0.5, pitch: 1.5}
              - {id: fx_blk0, op: particle_def, def: hit-spark, anchor: contact}
        # trail: one call per `spacing` blocks of bolt travel
        - {id: trail0, op: particle, particle: crit, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.03, 0.03, 0.03], extra: 0, every: 1, until: bolt.end}
        - {id: trail1, op: particle, particle: smoke, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.02, 0.02, 0.02], extra: 0, every: 1, until: bolt.end}
    end: {final: true}
