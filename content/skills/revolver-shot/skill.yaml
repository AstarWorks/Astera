# revolver-shot: slow heavy bullet. The state lasts exactly the flight (life) and also ends on the body end.
apiVersion: astera/v3
kind: Skill
id: revolver-shot
item: revolver
meta:
  name: {ja: "リボルバー射撃", en: "Revolver Shot"}
  description: {ja: "一発一発が重い銃撃。", en: "Slow, heavy shots."}
  cooldown_ticks: 16
  resource_cost: 6
  tags: [ranged, gun, physical]
params:
  dmg:   {type: number, default: 30}
  speed: {type: number, default: 3.6}
  life:  {type: ticks, default: 40}
anchors:
  - {id: start,  anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: muzzle, anchor: caster.eye, offset: {up: -0.25, forward: 0.9}, mode: snapshot}
  - {id: heart,  anchor: victim.center, mode: follow}
machine:
  start: fire
  tail: 4
  states:
    fire:
      for: 40
      then: end
      on:
        - {event: bolt.end, to: end}
      enter:
        - {id: snd, op: sound, sound: "astera:weapons/gun-shot", anchor: caster, volume: 0.8, pitch: 0.8}
        - {id: fl0, op: particle_def, def: gun-muzzle-flash, anchor: muzzle}
      do:
        - id: bolt
          op: projectile
          origin: start
          velocity: "= look(caster) * ${speed}"
          for: "${life}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: tracer_h, op: ribbon, from: muzzle, to: contact, thickness: 0.12, color: "#FFFFE070", for: 4, detach: true}
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg}"}}
              - {id: snd_hit, op: sound, sound: "astera:weapons/gun-impact", anchor: contact.point, volume: 0.8, pitch: 1.0, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart, detach: true}
            block:
              - {id: tracer_b, op: ribbon, from: muzzle, to: contact, thickness: 0.12, color: "#FFFFE070", for: 4, detach: true}
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact, volume: 0.5, pitch: 1.5, detach: true}
              - {id: fx_blk0, op: particle_def, def: hit-spark, anchor: contact, detach: true}
            expire:
              - {id: tracer_e, op: ribbon, from: muzzle, to: contact, thickness: 0.12, color: "#FFFFE070", for: 4, detach: true}
        # the visible round, riding the body
        - {id: slug, op: display, kind: item, item: "minecraft:gold_nugget", context: fixed, anchor: bolt, scale: [0.6, 0.6, 0.6], at: 0, until: bolt.end}
        - {id: trail0, op: particle, particle: crit, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.03, 0.03, 0.03], at: 0, every: 1, until: bolt.end}
        - {id: trail1, op: particle, particle: smoke, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.02, 0.02, 0.02], at: 0, every: 1, until: bolt.end}
    end: {final: true}
