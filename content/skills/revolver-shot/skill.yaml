# revolver-shot: slow heavy bullet. Visuals only: muzzle flash, crit + smoke trail, hit spark. No 3D.
apiVersion: astera/v3
kind: Skill
id: revolver-shot
item: revolver
meta:
  name: {ja: "リボルバー射撃", en: "Revolver Shot"}
  description: {ja: "一発一発が重い銃撃。", en: "Slow, heavy shots."}
  cooldown_ticks: 16
  resource_cost: 6
  tags: [ranged, gun, physical]
params:
  dmg:   {type: number, default: 30}
  speed: {type: number, default: 3.6}
  life:  {type: ticks, default: 40}
anchors:
  - {id: start,  anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: muzzle, anchor: caster.eye, offset: {forward: 0.7, left: -0.3, up: -0.3}, mode: snapshot}  # barrel of the held gun: right of and below the crosshair, so the flash reads at the gun, not on the target
  - {id: heart,  anchor: victim.center, mode: follow}
fragments:
  impact:   # a small bright spark and a little dust; the target stays visible
    frames_in: {spot: anchor}
    do:
      - {id: spark, op: particle, particle: dust, anchor: spot, count: 4, offset: [0.06, 0.06, 0.06], color: "#ffd060", size: 0.45}
      - {id: dust, op: particle, particle: dust, anchor: spot, count: 3, offset: [0.12, 0.12, 0.12], color: "#8c8c8c", size: 0.6}
machine:
  start: fire
  tail: 4
  states:
    fire:
      for: 40
      then: end
      on:
        - {event: bolt.end, to: end}
      enter:
        - {id: fire_fx, use: gun-muzzle, with: {snd: "astera:weapons/gun-shot", pitch: 0.8, smoke: false}, frames: {muzzle: muzzle}}
      do:
        - id: bolt
          op: projectile
          origin: start
          velocity: "= look(caster) * ${speed}"
          for: "${life}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg}"}}
              - {id: snd_hit, op: sound, sound: "astera:weapons/gun-impact", anchor: contact.point, volume: 0.8, detach: true}
              - {id: fx_hit, op: use, use: "fragment:impact", frames: {spot: heart}, detach: true}
            block:
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact, volume: 0.5, pitch: 1.5, detach: true}
              - {id: fx_blk, op: use, use: "fragment:impact", frames: {spot: contact}, detach: true}
        - {id: trail0, op: particle, particle: dust, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.02, 0.02, 0.02], color: "#ffe9a8", size: 0.3, at: 2, every: 1, until: bolt.end}
        - {id: trail1, op: particle, particle: dust, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.03, 0.03, 0.03], color: "#9a9a9a", size: 0.35, at: 2, every: 1, until: bolt.end}
    end: {final: true}
