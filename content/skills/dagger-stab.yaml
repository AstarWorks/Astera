# WP7: dagger left-click. Fast, short, bleeds. Per-hit damage is low but the
# bleed DoT (stacks to 3) is not gated by invulnerability frames, so the dagger
# is the sustain-DPS pick against a target it stays glued to.

# V-2a visuals. Per-cast particle budget: thrust 1+2+2+3 = 8, hit 16 per target.
id: dagger-stab

name:
  ja: "刺突"
  en: "Dagger Stab"
description:
  ja: "素早く突き刺し、確率で出血を与える。"
  en: "A quick stab that can leave the target bleeding."

archetype: melee
cooldown_ticks: 8
resource_cost: 8               # energy
tags: [ melee, physical, sustain, bleed ]

params:
  type: melee
  range: 2.6
  arc_degrees: 70.0
  knockback: 0.1
  damage:
    - base: { type: literal, value: 5.0 }
      attribute: physical

phases:
  type: melee
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.sweep
      pitch: { type: literal, value: 1.6 }
    # quick short thrust: a straight needle of light (4 steps over 2 ticks)
    - type: schedule_particle_animation
      targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 1.1, z: 0.0 } } }
      animation:
        - type: arc
          radius: 0.7
          start_degrees: 0.0
          end_degrees: 0.0
          points: 1
          particles: [ { id: end_rod } ]
        - type: arc
          radius: 1.2
          start_degrees: 0.0
          end_degrees: 0.0
          points: 1
          particles: [ { id: end_rod }, { id: electric_spark } ]
        - type: arc
          delay_ticks: 1
          radius: 1.7
          start_degrees: 0.0
          end_degrees: 0.0
          points: 1
          particles: [ { id: end_rod }, { id: electric_spark } ]
        - type: arc
          delay_ticks: 1
          radius: 2.1
          start_degrees: 0.0
          end_degrees: 0.0
          points: 1
          particles: [ { id: crit, count: 3, extra: 0.2 } ]
  hit_entity:
    - type: apply_status
      targets: { type: target }
      status_id: bleed
      effect_duration_ticks: { type: literal, value: 100 }
      chance: { type: literal, value: 0.6 }
    - type: play_sound
      targets: { type: target }
      sound_id: entity.player.attack.crit
      volume: { type: literal, value: 0.6 }
      pitch: { type: literal, value: 1.5 }
    - type: schedule_particle_animation
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      animation:
        - type: point
          particles:
            - { id: crit, count: 8, extra: 0.35 }
            - { id: electric_spark, count: 4, extra: 0.3 }
            - { id: dust, count: 4, color: { r: 190, g: 20, b: 30 }, scale: 1.0, extra: 0.05 }
  miss: []
