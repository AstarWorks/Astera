# Match arsenal (wp/match-arsenal): simple PvP skill. One cast sound, a few particles.

id: frost-rod-chill

name:
  ja: "冷気"
  en: "Chill"
description:
  ja: "周囲に冷気を放ち、敵を凍らせる。"
  en: "A cold wave that freezes nearby enemies."

archetype: aoe
cooldown_ticks: 160
resource_cost: 16
tags: [ aoe, water ]

params:
  type: aoe
  radius: 4.0
  falloff: linear
  damage:
    - base: { type: literal, value: 25.0 }
      attribute: water

phases:
  type: aoe
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:skill/wand/cast
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 1.0 }
    - type: schedule_particle_animation
      targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 0.15, z: 0.0 } } }
      animation:
        - type: ring
          period_ticks: 6
          points: 16
          start_radius: 0.5
          end_radius: 4.0
          particles:
            - { id: snowflake, count: 0, extra: 0.03 }
            - { id: dust, color: { r: 200, g: 235, b: 255 }, scale: 1.4 }
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/blade-hit
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.0 }
    - type: apply_status
      targets: { type: target }
      status_id: freeze
      effect_duration_ticks: { type: literal, value: 40 }
  expire: []
