# Wave 2 v3 draft (basic-ac): ported 1:1 from the v2 skill.yaml + look.yaml. GAP comments mark what v3 cannot spell yet.
apiVersion: astera/v3
kind: Skill
id: pickaxe-bore-iron
item: iron-pickaxe
meta:
  name: {ja: "鉄の掘削", en: "Iron Bore"}
  description: {ja: "正面に3x3のトンネルを掘り進む。", en: "Bores a 3x3 tunnel straight ahead."}
  cooldown_ticks: 120
  resource_cost: 0
  tags: [tool, cover]
anchors:
  - {id: aim, anchor: caster.eye, mode: snapshot}
  - {id: dust, anchor: caster.eye, offset: {forward: 2.0}, mode: snapshot}            # was pt_aim_0_0_2
machine:
  start: bore
  states:
    bore:
      for: 1
      then: end
      enter:
        - {id: break, op: break_area, at: 0, anchor: aim, shape: {line: {length: 6, width: 3}}, tool: pickaxe, block_damage: 100, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd_bore, op: sound, sound: "astera:weapons/gun-impact-block", anchor: caster, volume: 1.0, pitch: 0.5}
        - {id: fx_bore, op: particle_def, def: hit-spark, anchor: dust}
    end: {final: true}
