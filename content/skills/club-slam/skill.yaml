# club-slam: wind-up 5 ticks (rule round(5 / attack_speed)), hit at tick 5. Ground slam: raised overhead, driven straight into the ground at the hit.
apiVersion: astera/v3
kind: Skill
id: club-slam
item: club
meta:
  name: {ja: 叩きつけ, en: Slam}
  description: {ja: "地面を叩き、周囲を弾き飛ばす。", en: "Slams the ground and shoves everyone around you away."}
  cooldown_ticks: 130
  resource_cost: 14
  tags: [aoe, physical, control]
params:
  radius:       {type: blocks, default: 3.0}
  dmg_physical: {type: number, default: 16}
  knockback:    {type: number, default: 1.1}
anchors:
  - {id: ground, anchor: caster, offset: {up: 0.15}, mode: follow}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 5
      then: strike
      do:
        - {id: snd_windup, op: sound, sound: item.armor.equip_iron, anchor: caster, volume: 0.5, pitch: 0.5}
        # weapon rig: overhead slam. One performance in the windup state, detached so it plays on through the strike and the tail:
        # drawn back over 4 ticks, the cut starts at tick 4 so the blade crosses the target zone at the hit (tick 5), then 6 ticks of follow-through.
        - id: rig
          op: rig
          parent: caster
          mount: caster.hand_r
          part: held_hand
          rest: [{axis: left, deg: 72}]
          detach: true
          for: 13
          swing:
            - {at: 0, for: 4, from: {left: 0.000, up: 0.507, forward: 0.862}, to: {left: 0.100, up: 0.949, forward: -0.300}, edge: trailing, roll: 0, ease: out_quad}
            - {at: 4, for: 3, to: {left: 0.000, up: -0.954, forward: 0.301}, edge: leading, roll: 0, ease: out_cubic}
            - {at: 7, for: 6, to: {left: 0.000, up: -0.988, forward: 0.151}, edge: leading, roll: 0, ease: out_cubic}
    strike:
      for: 1
      then: end
      do:
        - id: blast
          op: hit
          at: 0
          anchor: caster
          shape: {sphere: "${radius}"}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "= ${dmg_physical} * (1.0 - 0.5 * dist(event.victim, caster) / ${radius})"}
          on:
            hit:
              - {id: react, op: react, target: event.victim, flinch: true, for: 6}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.0, detach: true}
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster)) + vec(0, 0.3, 0)", strength: "${knockback}"}
        - {id: snd, op: sound, sound: "item.mace.smash_ground_heavy", anchor: caster, volume: 0.8, pitch: 1.2, detach: true}
        - {id: crit, op: particle, particle: crit, anchor: ground, count: 0, extra: 0.03, detach: true}
        - {id: dust, op: particle, particle: dust, anchor: ground, count: 1, color: "#96785a", size: 1.4, detach: true}
        - {id: trail, op: particle, particle: crit, anchor: {of: /windup/rig.root, to: /windup/rig.tip, samples: 6}, count: 1, extra: 0.05, at: 0, every: 1, for: 8, detach: true}
    end: {final: true}
