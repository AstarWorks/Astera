# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: scythe-reap

name:
  ja: "刈り取り"
  en: "Scythe Reap"
description:
  ja: "半円状に刈り取る。"
  en: "A wide reaping arc."

archetype: melee
cooldown_ticks: 16
resource_cost: 8
tags: [ melee, physical ]

params:
  type: melee
  range: 3.4
  arc_degrees: 180.0
  knockback: 0.3
  damage:
    - base: { type: literal, value: 28.0 }
      attribute: physical

phases:
  type: melee
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.sweep
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 1.0 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.5, height: -0.2 }
      particle_id: slash-sweep
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/blade-hit
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
  miss: []
