apiVersion: astera/v3
kind: Skill
id: axe-fell-diamond
item: diamond-axe
meta:
  name: {ja: ダイヤの木断ち, en: Diamond Fell}
  description: {ja: "前方一直線の木のブロックを切り倒す。", en: "Cuts a line of wooden blocks ahead."}
  cooldown_ticks: 80
  resource_cost: 0
  tags: [tool, cover]
anchors:
  - {id: aim, anchor: caster.eye, offset: {forward: 2.0}}
presentation:
  timeline:
    - id: swing
      at: 0
      do:
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 1.0, pitch: 0.8}
        - {id: spark, op: emit, effect: hit-spark, anchor: aim}
machine:
  start: cast
  states:
    cast:
      for: 1
      then: done
      enter:
        # GAP: v2 op break_area has no v3 OpSpec -> kept verbatim, closest v3 is none (block-break must stay exact)
        - {id: fell, op: break_area, shape: line, radius: 2.0, length: 9, width: 1, height: 3, tool_class: AXE, block_damage: 200, power: 3, at: aim}
    done: {final: true}
