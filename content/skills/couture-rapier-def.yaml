id: couture-rapier-def
name:
  ja: 仮縫いの退歩
  en: Fitting Step
description:
  ja: 仕立ての構えを保ち、間合いを詰めて一撃を返す。
  en: Hold a fitting stance, then answer with one close-range cut.
archetype: sequence
cooldown_ticks: 100
resource_cost: 12
tags:
- physical
- couture
params:
  type: sequence
phases:
  type: sequence
  cast:
  - type: play_vfx
    targets:
      type: caster
    vfx_id: couture-rapier-guard
  - type: play_vfx
    targets:
      type: caster
    vfx_id: couture-rapier-parry
  - type: apply_status
    targets:
      type: caster
    status_id: charge
    effect_duration_ticks:
      type: literal
      value: 400
    stack_count:
      type: literal
      value: 2
  - type: dash_strike
    distance: 2.6
    ticks: 3
    radius: 0.8
    hit_once: true
    stop_on_block: true
    invulnerable: false
    delay_ticks:
      type: literal
      value: 35
    on_hit: []
    stop_before_target: 1.8
  - type: play_vfx
    targets:
      type: caster
    vfx_id: couture-rapier-reply
    delay_ticks:
      type: literal
      value: 35
  - type: damage
    targets:
      type: cone
      from:
        type: caster
      direction:
        type: from_caster
      angle_degrees:
        type: literal
        value: 75
      distance:
        type: literal
        value: 3.6
      max_count: 1
    components:
    - base:
        type: literal
        value: 6
      attribute: physical
    ignore_invulnerability:
      type: literal
      value: true
    delay_ticks:
      type: literal
      value: 44
  - type: play_vfx
    targets:
      type: caster_forward
      distance: 1.5
      height: -1.62
    vfx_id: couture-rapier-burst
    delay_ticks:
      type: literal
      value: 44
  - type: play_sound
    targets:
      type: cone
      from:
        type: caster
      direction:
        type: from_caster
      angle_degrees:
        type: literal
        value: 75
      distance:
        type: literal
        value: 3.6
      max_count: 1
    sound_id: entity.player.attack.crit
    volume:
      type: literal
      value: 0.6
    pitch:
      type: literal
      value: 1.6
    delay_ticks:
      type: literal
      value: 44
  - type: hit_stop
    targets:
      type: cone
      from:
        type: caster
      direction:
        type: from_caster
      angle_degrees:
        type: literal
        value: 75
      distance:
        type: literal
        value: 3.6
      max_count: 1
    ticks: 3
    include_caster: true
    delay_ticks:
      type: literal
      value: 44
  - type: screen_flash
    targets:
      type: caster
    overlay: white
    color: '#FFF1DC'
    fade_in:
      type: literal
      value: 0
    stay:
      type: literal
      value: 1
    fade_out:
      type: literal
      value: 1
    delay_ticks:
      type: literal
      value: 54
  - type: play_vfx
    targets:
      type: caster_forward
      distance: 1.5
      height: -1.62
    vfx_id: couture-rapier-cross
    delay_ticks:
      type: literal
      value: 56
