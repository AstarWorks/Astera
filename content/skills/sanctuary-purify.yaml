# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: sanctuary-purify

name:
  ja: "浄化"
  en: "Purify"
description:
  ja: "自分と周囲の味方の状態異常を取り除く。"
  en: "Clears harmful effects from you and nearby allies."

archetype: sequence
cooldown_ticks: 200
resource_cost: 20
tags: [ magic, support ]

params:
  type: sequence

phases:
  type: sequence
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: block.amethyst_block.chime
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 1.2 }
    - type: cleanse
      targets: { type: allies, center: { type: caster }, include_self: true, radius: { type: literal, value: 6.0 } }
    - type: schedule_particle_animation
      targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 0.15, z: 0.0 } } }
      animation:
        - type: ring
          period_ticks: 8
          points: 16
          start_radius: 0.4
          end_radius: 3.0
          particles:
            - { id: end_rod, count: 0, extra: 0.02 }
            - { id: dust, color: { r: 240, g: 240, b: 170 }, scale: 1.4 }
