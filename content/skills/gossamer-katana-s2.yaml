# Gossamer Katana S2 (right-click): the drawn line. The caster is rooted for 20 ticks while a thin blue
# line hangs at eye height and everything in the lane glows -- then the line flashes and the damage
# arrives ALL AT ONCE as five real hits one tick apart (4 x 2.0 + a 4.0 last = 12), each its own damage
# event, plus two bleed stacks. Nothing lands before tick 20 and targets are re-read at that moment, so
# stepping out of the lane dodges it.

id: gossamer-katana-s2

name:
  ja: "居合の一筋"
  en: "Unseen Line"
description:
  ja: "納刀したまま溜め、見えていた一筋の線が光った瞬間に全員へ遅れて斬撃が届く。出血2。"
  en: "A still draw: the line you could see flashes and every hit lands at once, late. Leaves 2 bleed."

archetype: sequence
cooldown_ticks: 90
resource_cost: 25
tags: [ melee, physical, delayed, bleed ]

params:
  type: sequence

phases:
  type: sequence
  cast:
    # --- the draw (ticks 0-20) ---
    - type: play_sound
      targets: { type: caster }
      sound_id: item.trident.return
      volume: { type: literal, value: 0.6 }
      pitch: { type: literal, value: 0.8 }
    - type: play_vfx
      targets: { type: caster }
      vfx_id: gossamer-katana-iaido-line
    - type: hit_stop
      targets: { type: caster }
      ticks: 22
    - type: glow
      targets:
        type: cone
        from: { type: caster }
        direction: { type: from_caster }
        angle_degrees: { type: literal, value: 60.0 }
        distance: { type: literal, value: 9.0 }
      ticks: { type: literal, value: 20 }
    # --- the line lands (ticks 20-24) ---
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.sweep
      pitch: { type: literal, value: 0.7 }
      delay_ticks: { type: literal, value: 20 }
    - type: loop
      targets: { type: caster }
      count: { type: literal, value: 4 }
      stride_ticks: { type: literal, value: 1 }
      delay_ticks: { type: literal, value: 20 }
      mechanics:
        - type: damage
          targets:
            type: cone
            from: { type: caster }
            direction: { type: from_caster }
            angle_degrees: { type: literal, value: 60.0 }
            distance: { type: literal, value: 9.0 }
          components:
            - base: { type: literal, value: 2.0 }
              attribute: physical
          ignore_invulnerability: { type: literal, value: true }
        - type: camera_shake
          targets:
            type: cone
            from: { type: caster }
            direction: { type: from_caster }
            angle_degrees: { type: literal, value: 60.0 }
            distance: { type: literal, value: 9.0 }
          intensity: { type: literal, value: 0.2 }
          ticks: { type: literal, value: 2 }
    - type: damage
      targets:
        type: cone
        from: { type: caster }
        direction: { type: from_caster }
        angle_degrees: { type: literal, value: 60.0 }
        distance: { type: literal, value: 9.0 }
      components:
        - base: { type: literal, value: 4.0 }
          attribute: physical
      ignore_invulnerability: { type: literal, value: true }
      delay_ticks: { type: literal, value: 24 }
    - type: play_vfx
      targets:
        type: cone
        from: { type: caster }
        direction: { type: from_caster }
        angle_degrees: { type: literal, value: 60.0 }
        distance: { type: literal, value: 9.0 }
      vfx_id: gossamer-katana-lattice
      delay_ticks: { type: literal, value: 20 }
    - type: hit_stop
      targets:
        type: cone
        from: { type: caster }
        direction: { type: from_caster }
        angle_degrees: { type: literal, value: 60.0 }
        distance: { type: literal, value: 9.0 }
      ticks: 4
      delay_ticks: { type: literal, value: 20 }
    - type: camera_shake
      targets:
        type: cone
        from: { type: caster }
        direction: { type: from_caster }
        angle_degrees: { type: literal, value: 60.0 }
        distance: { type: literal, value: 9.0 }
      intensity: { type: literal, value: 0.3 }
      ticks: { type: literal, value: 6 }
      delay_ticks: { type: literal, value: 20 }
    - type: apply_status
      targets:
        type: cone
        from: { type: caster }
        direction: { type: from_caster }
        angle_degrees: { type: literal, value: 60.0 }
        distance: { type: literal, value: 9.0 }
      status_id: bleed
      effect_duration_ticks: { type: literal, value: 120 }
      stack_count: { type: literal, value: 2 }
      delay_ticks: { type: literal, value: 24 }
    - type: play_sound
      targets:
        type: cone
        from: { type: caster }
        direction: { type: from_caster }
        angle_degrees: { type: literal, value: 60.0 }
        distance: { type: literal, value: 9.0 }
      sound_id: entity.player.attack.crit
      pitch: { type: literal, value: 1.1 }
      delay_ticks: { type: literal, value: 20 }
