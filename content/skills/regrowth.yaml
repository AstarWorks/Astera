# WP7: verdant staff sneak + right-click. Support: the caster and allies within
# ~10 blocks lose harmful statuses and regenerate 1.5 HP/s for 8s.
# (A direct heal mechanic is still held back; heal-over-time rides the regen status.)

id: regrowth

name:
  ja: "再生の風"
  en: "Regrowth"
description:
  ja: "自分と周囲の味方の状態異常を浄化し、しばらく体力を回復し続ける。"
  en: "Cleanses you and nearby allies and heals them over time."

archetype: buff
cooldown_ticks: 240
resource_cost: 35              # energy
tags: [ magic, earth-family, support, heal ]

params:
  type: buff
  status_effect_id: regen
  duration_ticks: 160

phases:
  type: buff
  cast:
    - type: cleanse
      targets: { type: allies, center: { type: caster }, include_self: true }
    - type: apply_status
      targets: { type: allies, center: { type: caster } }
      status_id: regen
      effect_duration_ticks: { type: literal, value: 160 }
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:skills/heal-chime
      volume: { type: literal, value: 0.5 }
    - type: spawn_particle
      targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 1.0, z: 0.0 } } }
      particle_id: verdant-heal
    # Healing aura: a ground ripple, two rising green halos and a burst of hearts around the caster.
    # Budget: ripple 8x16x2 = 256 + halos 2 x 14 x 10 x 2 = 560 + burst 30 => ~850 once per cast.
    - type: schedule_particle_animation
      targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 0.1, z: 0.0 } } }
      animation:
        - type: ring
          period_ticks: 8
          points: 16
          start_radius: 0.4
          end_radius: 2.2
          particles:
            - { id: happy_villager, count: 0, extra: 0.02 }
            - { id: dust, color: { r: 90, g: 230, b: 90 }, scale: 1.4 }
        - type: ring
          period_ticks: 14
          points: 10
          start_radius: 1.1
          end_radius: 0.7
          rise: 2.2
          particles:
            - { id: happy_villager }
            - { id: dust, color: { r: 140, g: 255, b: 120 }, scale: 1.2 }
        - type: ring
          delay_ticks: 6
          period_ticks: 14
          points: 10
          start_radius: 0.7
          end_radius: 1.1
          rise: 2.2
          particles:
            - { id: happy_villager }
            - { id: dust, color: { r: 140, g: 255, b: 120 }, scale: 1.2 }
        - type: point
          particles:
            - { id: heart, count: 8, offset: { x: 0.8, y: 0.8, z: 0.8 } }
            - { id: happy_villager, count: 22, offset: { x: 0.7, y: 1.0, z: 0.7 } }
  expire: []
  removed: []
