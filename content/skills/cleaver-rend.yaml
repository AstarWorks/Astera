# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: cleaver-rend

name:
  ja: "引き裂き"
  en: "Rend"
description:
  ja: "傷口を広げ、出血させる。"
  en: "Tears the wound open for bleeding."

archetype: melee
cooldown_ticks: 120
resource_cost: 12
tags: [ melee, physical ]

params:
  type: melee
  range: 2.8
  arc_degrees: 60.0
  knockback: 0.1
  damage:
    - base: { type: literal, value: 24.0 }
      attribute: physical

phases:
  type: melee
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.sweep
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 0.7 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.3, height: -0.1 }
      particle_id: stab-spark
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/blade-hit
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
    - type: apply_status
      targets: { type: target }
      status_id: bleed
      effect_duration_ticks: { type: literal, value: 100 }
  miss: []
