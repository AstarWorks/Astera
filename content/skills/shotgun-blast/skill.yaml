# shotgun-blast: one close-range cone hit with a push on the cast tick, in the frame grammar (ADR-0314, ADR-0315). Same hand as revolver-shot:
# `gun` is rooted in the caster's eye / aim basis at the aimed position 0.42 ahead, 0.76 below the eye line (a low ready: the long mesh stays out of the caster view), 0.30 right; the rig rides it, so the
# right arm is pinned onto the frame origin. Recoil is the arm's swing on its 0.60 sphere: the hand kicks up 0.05 and forward 0.05 over 2 ticks and settles over 4,
# the muzzle flips up 16 degrees and back. Flash and the cone smoke are points of `gun` (muzzle v 1.03 / w 0.18, content/frames/shotgun.yaml;
# the cloud 2 ahead). `hit` one per victim at its centre. The chip is a block hit where the look ray ends (first block within `chip_ahead`, else that far).
apiVersion: astera/v3
kind: Skill
id: shotgun-blast
item: shotgun
meta:
  name: {ja: "ショットガン射撃", en: "Shotgun Blast"}
  description: {ja: "近距離の扇状に散弾を撃ち込み、大ダメージとノックバックを与える。", en: "Blasts a close-range cone of pellets for heavy damage and knockback."}
  cooldown_ticks: 20
  resource_cost: 1
  tags: [ranged, gun, burst]
params:
  dmg:       {type: number, default: 25}
  arc_deg:   {type: number, default: 50}
  range:     {type: blocks, default: 6}
  knockback: {type: number, default: 0.9}
  chip_ahead: {type: number, default: 4}
frames:
  - id: gun
    origin: caster.eye
    v: aim
    w: s x v
    s: right
    move:
      - {at: 0, for: 0, to: {v: 0.42, w: -0.76, s: 0.30}}                      # aimed: straight out from the right shoulder
      - {at: 0, for: 2, to: {v: 0.47, w: -0.71, s: 0.30}, ease: out_quad}      # recoil: the arm kicks up (on the arm sphere)
      - {at: 2, for: 4, to: {v: 0.42, w: -0.76, s: 0.30}, ease: in_out_sine}   # settle
    rotate:
      - {at: 0, for: 2, about: s, to: 16, ease: out_quad}                      # muzzle flip
      - {at: 2, for: 4, about: s, to: 0, ease: in_out_sine}
  - id: hit
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    w_fallback: [1, 0, 0]
    s: v x w
machine:
  start: cast
  tail: 10
  states:
    cast:
      for: 1
      then: end
      do:
        - {id: rig, op: rig, frame: gun, for: 10, detach: true}
        - {id: snd, op: sound, sound: "astera:weapons/shotgun-blast", frame: gun, volume: 0.6, pitch: 1.4}
        - {id: fx, op: particle_def, def: shotgun-muzzle, frame: gun, pos: {v: 1.03, w: 0.18}}
        - {id: fx_2, op: particle_def, def: shotgun-cone-smoke, frame: gun, pos: {v: 2.0, w: 0.18}}
        - id: swing
          op: hit
          at: 0
          anchor: caster.eye
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg}"}
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: "${knockback}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/gun-impact", frame: hit, detach: true}
              - {id: fx_hit, op: particle_def, def: gun-impact, frame: hit, pos: {v: -0.2}, detach: true}
        - {id: chip, op: break_area, at: 0, anchor: {of: caster.eye, offset: {forward: "= dist(pos(caster.eye), aim_point(caster, ${chip_ahead}))"}}, shape: {sphere: {radius: 1.0}}, tool: none, block_damage: 30, ripple: 29, revert: 200, outside_arena: false}
    end: {final: true}
