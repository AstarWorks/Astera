# astera/v3 hand port of the v2 skill.yaml + look.yaml (tick for tick).
apiVersion: astera/v3
kind: Skill
id: shotgun-blast
item: shotgun
meta:
  name: {ja: "ショットガン射撃", en: "Shotgun Blast"}
  description: {ja: "近距離の扇状に散弾を撃ち込み、大ダメージとノックバックを与える。", en: "Blasts a close-range cone of pellets for heavy damage and knockback."}
  cooldown_ticks: 20
  resource_cost: 1
  tags: [ranged, gun, burst]
anchors:
  - {id: eye,    anchor: caster.eye, mode: follow}
  - {id: muzzle, anchor: caster, offset: {up: -0.25, forward: 1.2}, mode: follow}   # v2 pt_caster_0_m0p25_1p2: caster frame (feet, yaw-only)
  - {id: cone,   anchor: caster, offset: {up: -0.2, forward: 2.4}, mode: follow}   # v2 pt_caster_0_m0p2_2p4: caster frame (feet, yaw-only)
  - {id: heart,  anchor: victim.root, offset: {up: 1.2}, mode: follow}   # v2 pt_enemy_0_1p2_0
machine:
  start: cast
  states:
    cast:
      for: 1
      then: end
      do:
        - {id: snd, op: sound, sound: "astera:weapons/shotgun-blast", anchor: caster, volume: 0.6, pitch: 1.4}
        - {id: fx, op: particle_def, def: shotgun-muzzle, anchor: muzzle}
        - {id: fx_2, op: particle_def, def: shotgun-cone-smoke, anchor: cone}
        - id: swing
          op: hit
          at: 0
          anchor: eye
          shape: {sector: {deg: 50.0, range: 6.0, height: 2.0, forward: look}}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: 25.0}
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: 0.9}
              - {id: snd_hit, op: sound, sound: "astera:weapons/gun-impact", anchor: contact}
              - {id: fx_hit, op: particle_def, def: gun-impact, anchor: heart}
        - {id: chip, op: break_area, at: 0, anchor: {of: caster.eye, offset: {forward: 4}}, shape: {sphere: {radius: 0.5, ahead: 4.0}}, tool: none, block_damage: 30, ripple: 29, revert: 200, outside_arena: false}
    end: {final: true}
