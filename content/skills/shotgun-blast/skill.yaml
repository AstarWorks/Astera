# shotgun-blast: one close-range cone hit with a push on the cast tick, plus a block chip ahead.
apiVersion: astera/v3
kind: Skill
id: shotgun-blast
item: shotgun
meta:
  name: {ja: "ショットガン射撃", en: "Shotgun Blast"}
  description: {ja: "近距離の扇状に散弾を撃ち込み、大ダメージとノックバックを与える。", en: "Blasts a close-range cone of pellets for heavy damage and knockback."}
  cooldown_ticks: 20
  resource_cost: 1
  tags: [ranged, gun, burst]
params:
  dmg:       {type: number, default: 25.0}
  arc_deg:   {type: number, default: 50.0}
  range:     {type: blocks, default: 6.0}
  knockback: {type: number, default: 0.9}
anchors:
  - {id: eye,    anchor: caster.eye, mode: follow}
  - {id: muzzle, anchor: caster, offset: {up: -0.25, forward: 1.2}, mode: follow}
  - {id: cone,   anchor: caster, offset: {up: -0.2, forward: 2.4}, mode: follow}
  - {id: heart,  anchor: victim.root, offset: {up: 1.2}, mode: follow}
machine:
  start: cast
  states:
    cast:
      for: 1
      then: end
      do:
        - {id: snd, op: sound, sound: "astera:weapons/shotgun-blast", anchor: caster, volume: 0.6, pitch: 1.4}
        - {id: fx, op: particle_def, def: shotgun-muzzle, anchor: muzzle}
        - {id: fx_2, op: particle_def, def: shotgun-cone-smoke, anchor: cone}
        - id: swing
          op: hit
          at: 0
          anchor: eye
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg}"}
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: "${knockback}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/gun-impact", anchor: contact}
              - {id: fx_hit, op: particle_def, def: gun-impact, anchor: heart}
        - {id: chip, op: break_area, at: 0, anchor: {of: caster.eye, offset: {forward: 4}}, shape: {sphere: {radius: 1.0}}, tool: none, block_damage: 30, ripple: 29, revert: 200, outside_arena: false}
    end: {final: true}
