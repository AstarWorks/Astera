# ember-rod-burst: a fire nova around the caster, damage falling off with distance. Written from zero on the rev4.10 grammar.
apiVersion: astera/v3
kind: Skill
id: ember-rod-burst
item: ember-rod
meta:
  name: {ja: 火炎爆発, en: Ember Burst}
  description: {ja: "周囲を炎で焼き払う。", en: "A blast of fire around you."}
  cooldown_ticks: 150
  resource_cost: 18
  tags: [aoe, fire]
params:
  radius:     {type: blocks, default: 3.5}
  dmg_fire:   {type: number, default: 22.5}
  falloff:    {type: number, default: 0.5}
  burn_ticks: {type: ticks,  default: 20}
anchors:
  - {id: ground, anchor: caster, offset: {up: 0.15}, mode: follow}
machine:
  start: cast
  states:
    cast:
      for: 1
      then: end
      do:
        - {id: snd, op: sound, sound: "astera:skill/wand/cast", anchor: caster, volume: 1.0, pitch: 0.9, at: 0}
        - {id: flame, op: particle, particle: flame, anchor: ground, count: 0, extra: 0.03, at: 0}
        - {id: dust, op: particle, particle: dust, anchor: ground, count: 1, color: "#ff6e14", size: 1.4, at: 0}
        # the shock ring: 24 flames flung outward on the ground plane, two lifted rings behind it; the burst lasts one tick so these are instant rows
        - {id: ring, op: particle, particle: dust, color: "#ff6e14", size: 0.3, anchor: ground, times: 24, at: 0, count: 0, offset: "= vec(cos(i * 2 * pi / 24), 0.0, sin(i * 2 * pi / 24))", extra: 1.5}
        - {id: ring_hi, op: particle, particle: dust, color: "#b43c0a", size: 0.3, anchor: ground, times: 12, at: 0, count: 0, offset: "= vec(0.6 * cos(i * 2 * pi / 12), 0.8, 0.6 * sin(i * 2 * pi / 12))", extra: 0.9}
        - {id: embers, op: particle, particle: dust, color: "#50505a", size: 0.3, anchor: ground, count: 20, offset: "= vec(1.2, 0.3, 1.2)", extra: 0.04, at: 0}
      enter:
        - id: blast
          op: hit
          at: 0
          anchor: caster
          shape: {sphere: "${radius}"}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {fire: "= ${dmg_fire} * (1.0 - ${falloff} * dist(event.victim, caster) / ${radius})"}
          on:
            hit:
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.0}
              - {id: burn, op: status, target: event.victim, status: burn, stacks: 1, for: "${burn_ticks}"}
    end: {final: true}
