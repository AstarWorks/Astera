# Sanctuary staff heal: on tick 0 the caster and allies within `radius` are healed; the cast ends on tick 1. Frame grammar (ADR-0314):
# ground - the plate under the caster's feet (v up): the flat dust disc across the radius is drawn on it (the state is 1 tick, so no display fits: StateOverrun);
# chest - the caster's chest for the heal glow. Gameplay unchanged.
apiVersion: astera/v3
kind: Skill
id: sanctuary-heal
item: sanctuary-staff
meta: {name: {ja: "癒しの輪", en: "Healing Circle"}, description: {ja: "周囲の味方の体力を回復する。", en: "Heals you and nearby allies."}, cooldown_ticks: 240, resource_cost: 28, tags: [magic, support, heal]}
params:
  radius: {type: blocks, default: 6.0}
  heal:   {type: number, default: 30.0}
frames:
  - {id: ground, origin: caster.feet, v: up, w: forward, s: right, move: [{at: 0, for: 0, to: {v: 0.15}}]}
  - {id: chest, origin: caster.feet, v: up, w: forward, s: right, move: [{at: 0, for: 0, to: {v: 1.0}}]}
machine:
  start: bless
  states:
    bless:
      for: 1
      then: end
      enter:
        - {id: heal, op: heal, target: {kind: allies, around: caster, radius: "${radius}", include_self: true}, amount: "${heal}"}
        - {id: snd, op: sound, sound: "astera:skills/heal-chime", frame: ground, volume: 0.7, pitch: 1.0}
        - {id: emit, op: particle, particle: happy_villager, frame: ground, count: 0, extra: 0.02}
        - {id: emit_2, op: particle, particle: dust, frame: ground, count: 1, color: "#5ae65a", size: 1.4}
        - {id: emit_3, op: particle_def, def: verdant-heal, frame: chest}
      do:
        - {id: disc, op: particle, particle: dust, frame: ground, count: 24, offset: [3.0, 0.1, 3.0], extra: 0, color: "#5ae65a", size: 1.2, at: 0}
    end: {final: true}
