# sword-dash: dash, no weapon motion.
# Frames (ADR-0314): the skill moves no weapon, so there is no blade frame; only the places the sounds and fx land are frames:
#   body   - the caster's feet, v forward / w up / s right: the sound and the dash cloud at the feet (w 0.2).
#   wound  - one per victim at the victim's centre, v the way the blow came in: the hit spark and the hit sound (only where the skill hits).
apiVersion: astera/v3
kind: Skill
id: sword-dash
item: dagger
meta:
  name: {ja: "ダッシュ", en: "Dash"}
  description: {ja: "一瞬だけ素早く駆け出す。", en: "A brief burst of speed."}
  cooldown_ticks: 100
  resource_cost: 30
  tags: [buff, movement, sword]
params:
  dash_ticks: {type: ticks, default: 20}
  propel:     {type: number, default: 1.1}
frames:
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
machine:
  start: main
  states:
    main:
      for: 1
      then: end
      do:
        - {id: buff, op: status, at: 0, target: caster, status: dash, stacks: 1, for: "${dash_ticks}"}
        - {id: propel, op: impulse, at: 0, target: caster, vector: {of: caster, forward: "${propel}"}}
        - {id: snd, op: sound, at: 0, sound: "astera:weapons/dash-whoosh", frame: body}
        - {id: puff, op: particle_def, at: 0, def: dash-cloud, frame: body, pos: {w: 0.2}}
    end: {final: true}
