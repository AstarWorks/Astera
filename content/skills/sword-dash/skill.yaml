apiVersion: astera/v3
kind: Skill
id: sword-dash
item: dagger
meta:
  name: {ja: "ダッシュ", en: "Dash"}
  description: {ja: "一瞬だけ素早く駆け出す。", en: "A brief burst of speed."}
  cooldown_ticks: 100
  resource_cost: 30
  tags: [buff, movement, sword]
# GAP: gameplay.expose (duration <- dash_ticks) -> none (inline literal)
anchors:
  - {id: puff_pt, anchor: caster, offset: {up: 0.2}}
machine:
  start: main
  states:
    main:
      for: 1
      then: end
      do:
        - {id: buff, op: status, target: caster, status: dash, stacks: 1, for: 20}
        # GAP: propel {direction: axis(caster,"forward"), strength: 1.1} -> impulse (fields not spelled in ADR 10.1b); row below is the closest form
        - {id: propel, op: impulse, target: caster, direction: "= axis(caster, \"forward\")", strength: 1.1}
        - {id: snd, op: sound, sound: "astera:weapons/dash-whoosh", anchor: caster}
        - {id: puff, op: particle_def, def: dash-cloud, anchor: puff_pt}
    end: {final: true}
