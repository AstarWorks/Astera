apiVersion: astera/v3
kind: Skill
id: sword-dash
item: dagger
meta:
  name: {ja: "ダッシュ", en: "Dash"}
  description: {ja: "一瞬だけ素早く駆け出す。", en: "A brief burst of speed."}
  cooldown_ticks: 100
  resource_cost: 30
  tags: [buff, movement, sword]
params:
  dash_ticks: {type: ticks, default: 20}
  propel:     {type: number, default: 1.1}
anchors:
  - {id: puff_pt, anchor: caster, offset: {up: 0.2}}   # was pt_caster_0_0p2_0
machine:
  start: main
  states:
    main:
      for: 1
      then: end
      do:
        - {id: buff, op: status, at: 0, target: caster, status: dash, stacks: 1, for: "${dash_ticks}"}
        - {id: propel, op: impulse, at: 0, target: caster, vector: {of: caster, forward: "${propel}"}}
        - {id: snd, op: sound, at: 0, sound: "astera:weapons/dash-whoosh", anchor: caster}
        - {id: puff, op: particle_def, at: 0, def: dash-cloud, anchor: puff_pt}
    end: {final: true}
