# ADR-0239 demo: plays content/vfx/demo-sprites.yaml in front of the caster. Not bound to any
# item; cast it with `caster.cast(...)` in the simulator.

id: vfx-demo-sprites

name:
  ja: "デモ・自作パーティクル"
  en: "Demo Custom Particles"
description:
  ja: "自作パーティクル（TextDisplay のフォントグリフ）を全種ループ再生するデモ。"
  en: "Loops every custom particle sprite (TextDisplay font glyphs) side by side."

archetype: aoe
cooldown_ticks: 60
tags: [ demo, vfx ]

params:
  type: aoe
  radius: 4.0
  falloff: linear
  damage:
    - base: { type: literal, value: 6.25 }
      attribute: physical

phases:
  type: aoe
  cast:
    - type: play_vfx
      targets: { type: caster }
      vfx_id: demo-sprites
  hit_entity: []
  expire: []
