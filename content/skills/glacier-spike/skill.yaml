# glacier-spike: an ice shard that leaves the target sinking. Written from zero on the rev4.10 grammar.
apiVersion: astera/v3
kind: Skill
id: glacier-spike
item: glacier-wand
meta:
  name: {ja: "氷柱", en: "Ice Spike"}
  description: {ja: "氷の礫を飛ばし、相手の足を鈍らせる。", en: "Flings a shard of ice that slows the target."}
  cooldown_ticks: 50
  resource_cost: 10
  tags: [ranged, water, magic]
params:
  speed:         {type: number, default: 2.2}
  flight_ticks:  {type: ticks,  default: 40}
  dmg_water:     {type: number, default: 15}
  sinking_ticks: {type: ticks,  default: 60}
anchors:
  - {id: muzzle,  anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: cast_fx, anchor: caster.eye, offset: {up: -0.25, forward: 0.9}, mode: snapshot}
  - {id: heart,   anchor: victim.root, offset: {up: 1.2}, mode: follow}
machine:
  start: fly
  tail: 2
  states:
    fly:
      for: 40                       # literal: state `for` does not take ${param} yet (= flight_ticks)
      then: end
      on:
        - {event: bolt.end, to: end}
      enter:
        - {id: snd, op: sound, sound: "astera:skills/frost-cast", anchor: caster, volume: 0.7, pitch: 1.3}
        - {id: fx, op: particle_def, def: frost-cast, anchor: cast_fx}
      do:
        - id: bolt
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * ${speed}"
          for: "${flight_ticks}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {water: "${dmg_water}"}}
              - {id: st_sinking, op: status, target: event.victim, status: sinking, stacks: 1, for: "${sinking_ticks}"}
              - {id: snd_hit, op: sound, sound: "astera:skills/frost-impact", anchor: heart, volume: 0.7, pitch: 1.1, detach: true}
              - {id: fx_hit, op: particle_def, def: frost-impact-dust, anchor: heart, detach: true}
            block:
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact.point, volume: 0.5, pitch: 1.5, detach: true}
              - {id: fx_blk, op: particle_def, def: hit-spark, anchor: contact.point, detach: true}
        - id: core
          op: display
          kind: sprite
          sprite: frost-shatter
          anchor: bolt
          size: [0.7, 0.7]
          color: "#d8f0ff"
          billboard: center
          brightness: {block: 15, sky: 15}
          flipbook: {frames: 6, every: 1, loop: true}
          at: 2                       # the bolt is 2.2 blocks/tick: from tick 2 the core is past the caster's eye volume (CasterEyeClutter)
          for: 38
          motion:
            - {law: spin, axis: forward, deg_per_tick: 24, at: 0, for: 38}
        - id: trail
          at: 2                       # same: ticks 0-1 would put long-life snowflake/dust inside the eye volume next to the 8-dust cast puff
          every: 1
          until: bolt.end
          do:
            - {id: snow, op: particle, particle: snowflake, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.04, 0.04, 0.04]}
            - {id: dust, op: particle, particle: dust, anchor: {of: bolt, sweep: 0.4}, count: 1, color: "#bee6ff", size: 1.0}
    end: {final: true}
