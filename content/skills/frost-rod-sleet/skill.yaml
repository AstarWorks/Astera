# frost-rod-sleet: a quick ice shard that sometimes freezes. Written from zero on the rev4.10 grammar.
apiVersion: astera/v3
kind: Skill
id: frost-rod-sleet
item: frost-rod
meta:
  name: {ja: "みぞれ", en: Sleet}
  description: {ja: "氷の欠片。凍らせることがある。", en: "A chilling shard that can freeze."}
  cooldown_ticks: 22
  resource_cost: 6
  tags: [ranged, water]
params:
  launch_speed:       {type: number, default: 2.4}
  max_lifetime_ticks: {type: ticks,  default: 45}
  dmg_water:          {type: number, default: 18.0}
  freeze_ticks:       {type: ticks,  default: 16}
anchors:
  - {id: muzzle,  anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: cast_fx, anchor: caster.eye, offset: {up: -0.25, forward: 0.9}, mode: snapshot}
  - {id: heart,   anchor: victim.root, offset: {up: 1.2}, mode: follow}
fragments:
  impact:
    frames_in: {spot: anchor}
    do:
      - {id: ring, op: particle, particle: snowflake, anchor: spot, times: 16, at: 0, count: 0, offset: "= vec(cos(i * 2 * pi / 16), 0.0, sin(i * 2 * pi / 16))", extra: 0.2}
      - {id: ring_up, op: particle, particle: snowflake, anchor: spot, times: 8, at: 0, count: 0, offset: "= vec(0.7 * cos(i * 2 * pi / 8), 0.7, 0.7 * sin(i * 2 * pi / 8))", extra: 0.16}
      - {id: pop, op: particle, particle: snowflake, anchor: spot, count: 5, offset: [0.15, 0.15, 0.15], extra: 0.12, at: 0}
machine:
  start: fly
  states:
    fly:
      on:
        - {event: bolt.end, to: end}
      do:
        - {id: snd, op: sound, sound: "astera:skill/wand/cast", anchor: caster, volume: 0.8, pitch: 1.4, at: 0}
        - {id: fx, op: particle_def, def: frost-cast, anchor: cast_fx, at: 0}
        - id: bolt
          op: projectile
          origin: muzzle
          velocity: "= look(caster) * ${launch_speed}"
          for: "${max_lifetime_ticks}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {water: "${dmg_water}"}}
              - {id: st_freeze, op: status, target: event.victim, status: freeze, stacks: 1, for: "${freeze_ticks}"}
              - {id: snd_hit, op: sound, sound: "astera:skills/frost-impact", anchor: contact, volume: 0.7, pitch: 1.2}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
              - {op: use, use: "fragment:impact", frames: {spot: heart}}
            block:
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact, volume: 0.5, pitch: 1.5}
              - {id: fx_blk, op: particle_def, def: hit-spark, anchor: contact}
              - {op: use, use: "fragment:impact", frames: {spot: contact}}
        - id: core
          op: display
          kind: sprite
          sprite: frost-shatter
          anchor: bolt
          size: [0.5, 0.5]
          color: "#d8f0ff"
          billboard: center
          brightness: {block: 15, sky: 15}
          flipbook: {frames: 6, every: 1, loop: true}
          at: 0
          until: bolt.end
          motion:
            - {law: spin, axis: forward, deg_per_tick: 24, at: 0, for: 45}
        - id: trail
          at: 0
          every: 1
          until: bolt.end
          do:
            - {id: tr0, op: particle, particle: dust, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.04, 0.04, 0.04], color: "#e6f4ff", size: 0.4}
            - {id: tr1, op: particle, particle: dust, anchor: {of: bolt, sweep: 0.4}, count: 1, color: "#c8ebff", size: 0.45}
    end: {final: true}
