# WP1: gun right-click. Fast, flat, physical bullet.

id: pistol-shot

name:
  ja: "ピストル射撃"
  en: "Pistol Shot"
description:
  ja: "高速で直進する弾を撃つ。"
  en: "Fires a fast, flat-flying bullet."

archetype: projectile
cooldown_ticks: 8              # the pistol's cooldown_override_ticks (6) wins when fired from the item
resource_cost: 1               # one round; resource type comes from the pistol (ammo)
tags: [ ranged, gun ]

params:
  type: projectile
  launch_speed: 3.2
  max_lifetime_ticks: 30
  visual:
    trail:
      - type: point
        particles:
          - { id: crit }
          - { id: white_smoke, offset: { x: 0.02, y: 0.02, z: 0.02 } }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/gun-shot
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 0.9, height: -0.25 }
      particle_id: gun-muzzle-flash
    - type: spawn_particle
      targets: { type: caster_forward, distance: 0.9, height: -0.25 }
      particle_id: gun-muzzle-smoke
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/gun-impact
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 7.0 }
          attribute: physical
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: gun-impact
  hit_block:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: astera:weapons/gun-impact-block
      volume: { type: literal, value: 0.6 }
      pitch: { type: literal, value: 1.6 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: gun-impact
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: gun-impact-smoke
  miss: []
  expire: []
