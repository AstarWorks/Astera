# Gossamer Katana S3 (sneak + right-click): web cyclone. A 12-tick telegraph (six blue blades close in,
# everything within reach glows), then a 34-tick spin in place: a 24-bar helix cyclone, a red web laid
# under every enemy within 3.8 blocks, a 5.0 lump on the first pulse plus a bleed stack on each of
# five pulses, and at tick 34 the scar -- a single diagonal that spends every bleed stack (3.0 + 1.5
# per stack, max 3 stacks = 7.5). The two damage beats sit 21 ticks apart because a target takes one hit
# per 20-tick invulnerability window and `damage.ignore_invulnerability` is not honoured by the
# dispatcher yet. Total 5 + 7.5 = 12.5 with full bleed. Cooldown 14 s.

id: gossamer-katana-s3

name:
  ja: "巣廻し・旋"
  en: "Web Cyclone"
description:
  ja: "溜めの後、旋風で周囲に糸を張り出血を重ね、最後の一閃で出血をすべて断ち切って爆ぜさせる。"
  en: "A spin that webs and bleeds everything near, ended by one cut that spends every bleed stack."

archetype: buff
cooldown_ticks: 280
resource_cost: 45
tags: [ melee, aoe, physical, finisher, bleed ]

# `evasive` is a placeholder 2-tick status (the archetype needs one); the caster is rooted by hit_stop.
params:
  type: buff
  status_effect_id: evasive
  duration_ticks: 2

phases:
  type: buff
  cast:
    # --- telegraph (ticks 0-12) ---
    - type: play_sound
      targets: { type: caster }
      sound_id: block.beacon.activate
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.5 }
    - type: play_vfx
      targets: { type: caster }
      vfx_id: gossamer-katana-swords
    - type: hit_stop
      targets: { type: caster }
      ticks: 38
    - type: glow
      targets:
        type: nearby_entities
        center: { type: caster }
        radius: { type: literal, value: 4.2 }
        exclude_caster: true
      ticks: { type: literal, value: 14 }
    # --- the spin (ticks 12-46) ---
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.sweep
      pitch: { type: literal, value: 0.6 }
      delay_ticks: { type: literal, value: 12 }
    - type: play_vfx
      targets: { type: caster }
      vfx_id: gossamer-katana-cyclone
      delay_ticks: { type: literal, value: 12 }
    - type: play_vfx
      targets:
        type: nearby_entities
        center: { type: caster }
        radius: { type: literal, value: 3.8 }
        exclude_caster: true
      vfx_id: gossamer-katana-web
      delay_ticks: { type: literal, value: 13 }
    - type: damage
      targets:
        type: nearby_entities
        center: { type: caster }
        radius: { type: literal, value: 3.8 }
        exclude_caster: true
      components:
        - base: { type: literal, value: 5.0 }
          attribute: physical
      delay_ticks: { type: literal, value: 13 }
    - type: loop
      targets: { type: caster }
      count: { type: literal, value: 5 }
      stride_ticks: { type: literal, value: 3 }
      delay_ticks: { type: literal, value: 13 }
      mechanics:
        - type: apply_status
          targets:
            type: nearby_entities
            center: { type: caster }
            radius: { type: literal, value: 3.8 }
            exclude_caster: true
          status_id: bleed
          effect_duration_ticks: { type: literal, value: 140 }
        - type: play_sound
          targets: { type: caster }
          sound_id: entity.player.attack.sweep
          volume: { type: literal, value: 0.6 }
          pitch: { type: literal, value: 1.3 }
    # --- the scar (tick 34) ---
    - type: play_vfx
      targets: { type: caster }
      vfx_id: gossamer-katana-scar
      delay_ticks: { type: literal, value: 34 }
    - type: damage
      targets:
        type: nearby_entities
        center: { type: caster }
        radius: { type: literal, value: 3.8 }
        exclude_caster: true
      components:
        - base: { type: literal, value: 3.0 }
          attribute: physical
          per_stack: { status_id: bleed, amount: 1.5, on: target, consume: true }
      delay_ticks: { type: literal, value: 34 }
    - type: hit_stop
      targets:
        type: nearby_entities
        center: { type: caster }
        radius: { type: literal, value: 3.8 }
        exclude_caster: true
      ticks: 4
      delay_ticks: { type: literal, value: 34 }
    - type: camera_shake
      targets:
        type: nearby_entities
        center: { type: caster }
        radius: { type: literal, value: 5.0 }
        exclude_caster: false
      intensity: { type: literal, value: 0.6 }
      ticks: { type: literal, value: 8 }
      delay_ticks: { type: literal, value: 34 }
    - type: knockup
      targets:
        type: nearby_entities
        center: { type: caster }
        radius: { type: literal, value: 3.8 }
        exclude_caster: true
      strength: { type: literal, value: 0.3 }
      delay_ticks: { type: literal, value: 35 }
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.firework_rocket.blast
      pitch: { type: literal, value: 1.2 }
      delay_ticks: { type: literal, value: 34 }
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.player.attack.knockback
      pitch: { type: literal, value: 0.8 }
      delay_ticks: { type: literal, value: 34 }
  expire: []
  removed: []
