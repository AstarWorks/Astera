# iron-blade-lunge: the iron blade drawn back, then a thrust-slash along the lunge dash (wind-up 3 ticks, dash 4 ticks, every-tick hit).
# Frames (ADR-0314, ADR-0315), the gameplay (hit tick, shape, damage, knockback, cooldown, cast length) is unchanged:
#   blade  - the iron blade. Origin at the caster feet, moved along a hand path (guard -> drawn back -> thrust straight ahead along v -> guard). Long axis along v (grip at the origin, tip at v 0.92),
#            edge along w. The thrust is the hand `move:` along v, the point leads by construction; the wind-up aims the point slightly (-12), `reset` eases back to guard.
#            The engine pins the right hand to the origin, so every `move:` point lies inside the 0.60 reach of the right shoulder (v 0 / w 1.29 / s 0.29).
#   body   - the caster's feet, v forward / w up / s right: sounds and the cast fx.
#   wound  - one per victim at the victim's centre, v the way the blow came in: the hit sound and the hit spark.
#   edge   - line along the blade (v 0.56 .. 0.92), what the trail rows draw along.
apiVersion: astera/v3
kind: Skill
id: iron-blade-lunge
item: iron-blade
meta:
  name: {ja: "突進斬り", en: "Lunge"}
  description: {ja: "前方へ踏み込み、触れた相手を斬る。", en: "Lunges forward and cuts whoever you hit."}
  cooldown_ticks: 90
  resource_cost: 10
  tags: [melee, movement, physical]
params:
  dash_distance: {type: blocks, default: 3}
  dash_ticks: {type: ticks, default: 4}
  dmg_physical: {type: number, default: 30.0}
frames:
  - id: blade
    origin: caster
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: 0.48, w: 0.96, s: 0.43}}  # guard
      - {at: 0, for: 1, to: {v: 0.28, w: 0.82, s: 0.54}}
      - {at: 1, for: 1, to: {v: 0, w: 0.77, s: 0.59}}
      - {at: 2, for: 1, to: {v: 0.46, w: 0.91, s: 0.33}}
      - {at: 3, for: 1, to: {v: 0.51, w: 0.98, s: 0.26}}
      - {at: 4, for: 1, to: {v: 0.52, w: 0.99, s: 0.25}}
      - {at: 6, for: 1, to: {v: 0.5, w: 0.96, s: 0.26}}
      - {at: 7, for: 1, to: {v: 0.51, w: 0.97, s: 0.3}}
      - {at: 8, for: 1, to: {v: 0.5, w: 0.96, s: 0.33}}
      - {at: 9, for: 1, to: {v: 0.41, w: 0.86, s: 0.33}}
      - {at: 10, for: 1, to: {v: 0.44, w: 0.89, s: 0.35}}
      - {at: 11, for: 1, to: {v: 0.47, w: 0.93, s: 0.4}}
      - {at: 12, for: 1, to: {v: 0.49, w: 0.97, s: 0.43}}
      - {at: 13, for: 1, to: {v: 0.48, w: 0.96, s: 0.43}}
    rotate:
      - {at: 0, for: 2, about: s, to: -12, ease: in_out_sine}  # aim while drawing
      - {at: 2, for: 3, about: s, to: 0, ease: out_cubic}  # level on the target
      - {at: 5, for: 9, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: wound
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
lines:
  edge: {frame: blade, from: {v: 0.56}, to: {v: 0.92}}
machine:
  start: windup
  tail: 11
  states:
    windup:
      for: 3
      then: dash
      do:
        - {id: rig, op: rig, frame: blade, for: 14, detach: true}
    dash:
      for: "= ${dash_ticks}"
      then: end
      enter:
        - {id: snd_dash, op: sound, sound: "astera:weapons/dash-whoosh", frame: body, volume: 1.0, pitch: 1.1, detach: true}
        - {id: fx_dash, op: particle_def, def: dash-cloud, frame: body, pos: {w: 0.2}, detach: true}
        - {id: lunge, op: dash, speed: "= ${dash_distance} / ${dash_ticks}", for: "= ${dash_ticks}", direction: {forward: 1}, follow_pitch: false, stop_on_block: true, invulnerable: false, face_movement: false, pass_through: true}
        # dash corridor: capsule radius 1.0, hit_once, no early end (the dash runs through everyone).
        - id: strike
          op: hit
          anchor: caster.body
          at: 0
          every: 1
          for: "= ${dash_ticks}"
          shape: {sphere: 1.0}
          targets: enemies
          max_count: all
          window: once
          ignore_invulnerability: false
          damage: {physical: "= ${dmg_physical}"}
          on:
            hit:
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", frame: wound, volume: 1.0, pitch: 1.0, detach: true}
        - {id: trail_fx, op: particle, particle: crit, along: edge, samples: 2, count: 1, extra: 0.04, at: 0, every: 1, for: 4, detach: true}
    end: {final: true}
