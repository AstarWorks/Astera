# iron-blade-lunge: the iron blade drawn back, then a thrust-slash along the lunge dash (wind-up 3 ticks, dash 4 ticks, every-tick hit).
# Frames (ADR-0314, ADR-0315), the gameplay (hit tick, shape, damage, knockback, cooldown, cast length) is unchanged:
#   arm    - the right arm, rotate keys only. Origin = the right shoulder (`caster.shoulder_r`); the arm is one rigid 0.60 bone, so the hand travels on a sphere about it and a turn of this frame is that travel (about w left/right, about s up/down). Hand path: guard -> drawn back to the right hip -> shot forward -> guard.
#   blade  - the iron blade. Origin = the hand, 0.60 along the arm frame (the hand path is the arm's turn: guard -> drawn back -> thrust straight ahead along v -> guard). Long axis along v (grip at the origin, tip at v 0.92),
#            edge along w. The thrust is the hand swinging forward on the arm, the point leads by construction; the wind-up aims the point slightly (-12), `reset` eases back to guard.
#            The engine pins the right hand to the origin; the origin sits exactly on the 0.60 reach sphere of the shoulder by construction.
#   body   - the caster's feet, v forward / w up / s right: sounds and the cast fx.
#   wound  - one per victim at the victim's centre, v the way the blow came in: the hit sound and the hit spark.
#   edge   - line along the blade (v 0.56 .. 0.92), what the trail rows draw along.
apiVersion: astera/v3
kind: Skill
id: iron-blade-lunge
item: iron-blade
meta:
  name: {ja: "突進斬り", en: "Lunge"}
  description: {ja: "前方へ踏み込み、触れた相手を斬る。", en: "Lunges forward and cuts whoever you hit."}
  cooldown_ticks: 90
  resource_cost: 10
  tags: [melee, movement, physical]
params:
  dash_distance: {type: blocks, default: 3}
  dash_ticks: {type: ticks, default: 4}
  dmg_physical: {type: number, default: 30.0}
frames:
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: w, to: -16}   # guard
      - {at: 0, for: 2, about: w, to: -90, ease: in_out_sine}   # draw back: the hand to the right hip
      - {at: 2, for: 3, about: w, to: 4, ease: out_cubic}   # the lunge: the hand shoots forward
      - {at: 5, for: 9, about: w, to: -16, ease: in_out_sine}   # recover to guard
      - {at: 0, for: 0, about: s, to: -33}
      - {at: 0, for: 2, about: s, to: -60, ease: in_out_sine}
      - {at: 2, for: 3, about: s, to: -30, ease: out_cubic}
      - {at: 5, for: 9, about: s, to: -33, ease: in_out_sine}
  - id: blade
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 2, about: s, to: -12, ease: in_out_sine}  # aim while drawing
      - {at: 2, for: 3, about: s, to: 0, ease: out_cubic}  # level on the target
      - {at: 5, for: 9, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: wound
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    w_fallback: [1, 0, 0]
    s: v x w
lines:
  edge: {frame: blade, from: {v: 0.56}, to: {v: 0.92}}
machine:
  start: windup
  tail: 11
  states:
    windup:
      for: 3
      then: dash
      do:
        - {id: rig, op: rig, frame: blade, for: 14, detach: true}
    dash:
      for: "= ${dash_ticks}"
      then: end
      enter:
        - {id: snd_dash, op: sound, sound: "astera:weapons/dash-whoosh", frame: body, volume: 1.0, pitch: 1.1, detach: true}
        - {id: fx_dash, op: particle_def, def: dash-cloud, frame: body, pos: {w: 0.2}, detach: true}
        - {id: lunge, op: dash, speed: "= ${dash_distance} / ${dash_ticks}", for: "= ${dash_ticks}", direction: {forward: 1}, follow_pitch: false, stop_on_block: true, invulnerable: false, face_movement: false, pass_through: true}
        # dash corridor: capsule radius 1.0, hit_once, no early end (the dash runs through everyone).
        - id: strike
          op: hit
          anchor: caster.body
          at: 0
          every: 1
          for: "= ${dash_ticks}"
          shape: {sphere: 1.0}
          targets: enemies
          max_count: all
          window: once
          ignore_invulnerability: false
          damage: {physical: "= ${dmg_physical}"}
          on:
            hit:
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", frame: wound, volume: 1.0, pitch: 1.0, detach: true}
        - {id: trail_fx, op: particle, particle: crit, along: edge, samples: 2, count: 1, extra: 0.04, at: 0, every: 1, for: 8, detach: true}
    end: {final: true}
