# Wave 2 v3 draft (basic-ac): ported 1:1 from the v2 skill.yaml + look.yaml. GAP comments mark what v3 cannot spell yet.
apiVersion: astera/v3
kind: Skill
id: iron-blade-lunge
item: iron-blade
meta:
  name: {ja: "突進斬り", en: "Lunge"}
  description: {ja: "前方へ踏み込み、触れた相手を斬る。", en: "Lunges forward and cuts whoever you hit."}
  cooldown_ticks: 90
  resource_cost: 10
  tags: [melee, movement, physical]
params:
  dash_distance: {type: blocks, default: 3}
  dash_ticks: {type: ticks, default: 4}
  dmg_physical: {type: number, default: 30.0}
anchors:
  - {id: feet, anchor: caster, offset: {up: 0.2}, mode: snapshot}                  # was pt_caster_0_0p2_0
machine:
  start: dash
  states:
    dash:
      for: "= ${dash_ticks}"
      then: end
      enter:
        - {id: snd_dash, op: sound, sound: "astera:weapons/dash-whoosh", anchor: caster, volume: 1.0, pitch: 1.1}
        - {id: fx_dash, op: particle_def, def: dash-cloud, anchor: feet}
        - {id: lunge, op: dash, speed: "= ${dash_distance} / ${dash_ticks}", for: "= ${dash_ticks}", direction: {forward: 1}, follow_pitch: false, stop_on_block: true, invulnerable: false, face_movement: false}
        # v2 dash_strike corridor: capsule radius 1.0, hit_once, no early end (the dash runs through everyone); `until` omitted for 1:1.
        - id: strike
          op: hit
          anchor: caster.body
          at: 0
          every: 1
          for: "= ${dash_ticks}"
          shape: {sphere: 1.0}
          targets: enemies
          max_count: all
          window: once
          ignore_invulnerability: false
          damage: {physical: "= ${dmg_physical}"}
          on:
            hit:
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 1.0, pitch: 1.0}
    end: {final: true}
