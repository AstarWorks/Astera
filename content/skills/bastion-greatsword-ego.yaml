id: bastion-greatsword-ego
name:
  ja: 城塞の暁
  en: Citadel Dawn
description:
  ja: 大盾を掲げ、剣を突き立てて黄金の稲妻を放つ。E.G.Oゲージを全て消費する。
  en: Raise the tower shield, then plant the blade in a burst of golden lightning. Consumes the full E.G.O gauge.
archetype: sequence
cooldown_ticks: 300
resource_cost: 0
tags: [aoe, physical, finisher, charge]
params:
  type: sequence
phases:
  type: sequence
  cast:
  - type: play_vfx
    targets:
      type: caster
    vfx_id: bastion-ego-guard
  - type: play_vfx
    targets:
      type: caster
    vfx_id: bastion-s3-raise
    delay_ticks: {type: literal, value: 20}
  - type: play_vfx
    targets:
      type: caster_forward
      distance: 2.2
      height: -1.62
    vfx_id: bastion-s3-planted
    delay_ticks: {type: literal, value: 34}
  - type: play_vfx
    targets:
      type: caster_forward
      distance: 2.2
      height: -1.62
    vfx_id: bastion-s3-slam
    delay_ticks: {type: literal, value: 36}
  - type: damage
    targets:
      type: nearby_entities
      center:
        type: caster_forward
        distance: 2.2
        height: -1.62
      radius: {type: literal, value: 3.3}
      exclude_caster: true
    components:
    - base: {type: literal, value: 28}
      attribute: physical
      per_stack:
        status_id: charge
        amount: 0.5
        'on': caster
        consume: true
    ignore_invulnerability:
      type: literal
      value: true
    delay_ticks: {type: literal, value: 36}
  - type: spawn_particle
    targets:
      type: nearby_entities
      center:
        type: caster_forward
        distance: 2.2
        height: -1.62
      radius: {type: literal, value: 3.3}
      exclude_caster: true
    particle_id: bastion-s3-hit-crit
    delay_ticks: {type: literal, value: 36}
  - type: hit_stop
    targets:
      type: nearby_entities
      center:
        type: caster_forward
        distance: 2.2
        height: -1.62
      radius: {type: literal, value: 3.3}
      exclude_caster: true
    ticks: 2
    include_caster: true
    delay_ticks: {type: literal, value: 36}
  - type: play_sound
    targets:
      type: caster
    sound_id: entity.player.attack.strong
    delay_ticks: {type: literal, value: 36}
  - type: screen_flash
    targets:
      type: caster
    overlay: gold_burst
    stay:
      type: literal
      value: 1
    fade_in:
      type: literal
      value: 0
    fade_out:
      type: literal
      value: 2
    delay_ticks: {type: literal, value: 36}
  - type: knockback
    targets:
      type: nearby_entities
      center:
        type: caster_forward
        distance: 2.2
        height: -1.62
      radius: {type: literal, value: 3.3}
      exclude_caster: true
    direction:
      type: away_from_caster
      vertical: 0.3
    strength:
      type: literal
      value: 1.6
    delay_ticks: {type: literal, value: 36}
ego_cost: 100
