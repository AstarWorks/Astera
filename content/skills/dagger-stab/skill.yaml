# dagger-stab: dagger stab from the hip (wind-up 2 ticks, hit at tick 2).
# Frames (ADR-0314, ADR-0315), the gameplay (hit tick, shape, damage, knockback, cooldown, cast length) is unchanged:
#   arm    - the right arm, rotate keys only. Origin = the right shoulder (`caster.shoulder_r`); the arm is one rigid 0.60 bone, so the hand travels on a sphere about it and a turn of this frame is that travel (about w left/right, about s up/down). Hand path: guard -> pulled back -> driven forward -> guard.
#   blade  - the dagger. Origin = the hand, 0.60 along the arm frame (the hand path is the arm's turn: guard -> drawn back -> thrust straight ahead along v -> guard). Long axis along v (grip at the origin, tip at v 0.61),
#            edge along w. The thrust is the hand swinging forward on the arm, the point leads by construction; the wind-up aims the point slightly (15), `reset` eases back to guard.
#            The engine pins the right hand to the origin; the origin sits exactly on the 0.60 reach sphere of the shoulder by construction.
#   body   - the caster's feet, v forward / w up / s right: sounds and the cast fx.
#   wound  - one per victim at the victim's centre, v the way the blow came in: the hit sound and the hit spark.
#   edge   - line along the blade (v 0.38 .. 0.61), what the trail rows draw along.
apiVersion: astera/v3
kind: Skill
id: dagger-stab
item: dagger
meta:
  name: {ja: 刺突, en: Dagger Stab}
  description: {ja: "素早く突き刺し、確率で出血を与える。", en: "A quick stab that can leave the target bleeding."}
  cooldown_ticks: 8
  resource_cost: 8
  tags: [melee, physical, sustain, bleed]
params:
  arc_deg:      {type: number, default: 70}
  range:        {type: blocks, default: 2.6}
  dmg_physical: {type: number, default: 25}
  bleed_ticks:  {type: ticks, default: 100}
frames:
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: w, to: -29}   # guard
      - {at: 0, for: 1, about: w, to: -90, ease: in_out_sine}   # pull the hand back to the right hip
      - {at: 1, for: 3, about: w, to: -8, ease: out_cubic}   # the stab: the hand drives forward
      - {at: 4, for: 7, about: w, to: -29, ease: in_out_sine}   # back to guard
      - {at: 0, for: 0, about: s, to: -51}
      - {at: 0, for: 1, about: s, to: -64, ease: in_out_sine}
      - {at: 1, for: 3, about: s, to: -15, ease: out_cubic}
      - {at: 4, for: 7, about: s, to: -51, ease: in_out_sine}
  - id: blade
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 1, about: s, to: 15, ease: in_out_sine}  # aim while drawing
      - {at: 1, for: 3, about: s, to: 0, ease: out_cubic}  # level on the target
      - {at: 4, for: 7, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: wound
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
lines:
  edge: {frame: blade, from: {v: 0.38}, to: {v: 0.61}}
machine:
  start: windup
  tail: 9
  states:
    windup:
      for: 2
      then: strike
      do:
        - {id: rig, op: rig, frame: blade, for: 11, detach: true}
    strike:
      for: 1
      then: end
      enter:
        - id: strike
          op: hit
          frame: blade
          at: 0
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", frame: wound, volume: 0.6, pitch: 1.5, detach: true}
              - {id: spark, op: particle_def, def: hit-spark, frame: wound, detach: true}
              - {id: bleed, op: status, target: event.victim, status: bleed, stacks: 1, for: "${bleed_ticks}", when: "= rand() < 0.6"}
        - {id: snd, op: sound, sound: "astera:weapons/sword-swing", frame: body, volume: 1.0, pitch: 1.6, at: 0, detach: true}
        - {id: fx1, op: particle_def, def: stab-spark, frame: body, pos: {v: 1.4, w: 1.42}, at: 0, detach: true}
        - {id: trail_fx, op: particle, particle: crit, along: edge, samples: 2, count: 1, extra: 0.04, at: 0, every: 1, for: 2, detach: true}
    end: {final: true}
