apiVersion: astera/v3
kind: Skill
id: dagger-stab
item: dagger
meta:
  name: {ja: 刺突, en: Dagger Stab}
  description: {ja: "素早く突き刺し、確率で出血を与える。", en: "A quick stab that can leave the target bleeding."}
  cooldown_ticks: 8
  resource_cost: 8
  tags: [melee, physical, sustain, bleed]
params:
  arc_deg:      {type: number, default: 70}
  range:        {type: blocks, default: 2.6}
  dmg_physical: {type: number, default: 25}
  bleed_ticks:  {type: ticks, default: 100}
anchors:
  - {id: fx, anchor: caster, offset: {forward: 1.4, up: -0.2}}
machine:
  start: cast
  states:
    cast:
      start: strike
      do:
        - {id: snd, op: sound, sound: "astera:weapons/sword-swing", anchor: caster, volume: 1.0, pitch: 1.6, at: 0}
        - {id: fx1, op: particle_def, def: stab-spark, anchor: fx, at: 0}
      on:
        - {event: end, to: done}
      states:
        strike:
          for: 1
          then: recover
          enter:
            - id: strike
              op: hit
              anchor: caster.eye
              at: 0
              shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
              targets: enemies
              max_count: all       # GAP(Q1): max_count spelling (A required int|all / B omit) is a founder question; v2 had no cap
              window: once
              ignore_invulnerability: false
              damage: {physical: "${dmg_physical}"}
              on:
                hit:
                  - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.6, pitch: 1.5}
                  - {id: spark, op: particle_def, def: hit-spark, anchor: contact}
                  - {id: bleed, op: status, target: event.victim, status: bleed, stacks: 1, for: "${bleed_ticks}", when: "= rand() < 0.6"}
        recover: {final: true}
    done: {final: true}
