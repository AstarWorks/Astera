# Wind-up W = 2 ticks (round_half_up(5 / attack_speed 3.0)): the dagger is drawn back low at the hip, the stab hits at tick 2 and the cast ends one tick later.
# The rig (one thrust written as the tip's travel: back and low -> straight forward, the edge facing the push), the stab spark and the trail are detach: true
# and play on after the cast end (tail).
apiVersion: astera/v3
kind: Skill
id: dagger-stab
item: dagger
meta:
  name: {ja: 刺突, en: Dagger Stab}
  description: {ja: "素早く突き刺し、確率で出血を与える。", en: "A quick stab that can leave the target bleeding."}
  cooldown_ticks: 8
  resource_cost: 8
  tags: [melee, physical, sustain, bleed]
params:
  arc_deg:      {type: number, default: 70}
  range:        {type: blocks, default: 2.6}
  dmg_physical: {type: number, default: 25}
  bleed_ticks:  {type: ticks, default: 100}
anchors:
  - {id: fx, anchor: caster.eye, offset: {forward: 1.4, up: -0.2}, mode: follow}
machine:
  start: windup
  tail: 9
  states:
    windup:
      for: 2
      then: strike
      do:
        - id: rig
          op: rig
          parent: caster
          mount: caster.hand_r
          rest: [{axis: left, deg: 72}]
          for: 11
          detach: true
          swing:
            - {at: 0, for: 1, from: {left: 0.1, up: 0.2, forward: 0.9}, to: {left: -0.3, up: -0.45, forward: 0.35}, edge: trailing, ease: in_out_sine}
            - {at: 1, for: 3, to: {left: 0.0, up: 0.05, forward: 1.0}, edge: leading, ease: out_cubic}
            - {at: 4, for: 7, to: {left: -0.1, up: 0.25, forward: 0.9}, edge: trailing, ease: in_out_sine}
    strike:
      for: 1
      then: end
      enter:
        - id: strike
          op: hit
          anchor: caster.eye
          at: 0
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.6, pitch: 1.5, detach: true}
              - {id: spark, op: particle_def, def: hit-spark, anchor: contact, detach: true}
              - {id: bleed, op: status, target: event.victim, status: bleed, stacks: 1, for: "${bleed_ticks}", when: "= rand() < 0.6"}
        - {id: snd, op: sound, sound: "astera:weapons/sword-swing", anchor: caster, volume: 1.0, pitch: 1.6, at: 0, detach: true}
        - {id: fx1, op: particle_def, def: stab-spark, anchor: fx, at: 0, detach: true}
        - {id: trail_fx, op: particle, particle: crit, anchor: {of: /windup/rig.root, to: /windup/rig.tip, samples: 2}, count: 1, extra: 0.04, at: 0, every: 1, for: 3, detach: true}
    end: {final: true}
