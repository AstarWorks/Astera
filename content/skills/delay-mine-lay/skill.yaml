# Delay mine: plants a mine ahead; it detonates 50 ticks later (arithmetic schedule) and the cast ends one tick after.
# The mine is a flat dark plate with a red core and a pulsing red ring on the ground, visible from the tick it is laid until the blast.
apiVersion: astera/v3
kind: Skill
id: delay-mine-lay
item: delay-mine
meta:
  name: {ja: 地雷設置, en: Lay Mine}
  description: {ja: "目の前に地雷を置く。少し後に爆発する。", en: "Plants a mine ahead that detonates after a short delay."}
  cooldown_ticks: 160
  resource_cost: 10
  tags: [utility, explosive, zone]
params:
  explode_power:    {type: number, default: 1.0}
  explode_radius:   {type: blocks, default: 2.5}
  explode_physical: {type: number, default: 55}
anchors:
  - {id: spot,     anchor: caster, offset: {forward: 2.5}, mode: snapshot}
  - {id: smoke_at, anchor: caster, offset: {forward: 2.5, up: 0.1}, mode: follow}
machine:
  start: armed
  states:
    armed:
      for: 51      # fuse 50 + 1: the blast rows sit on tick 50
      then: end
      do:
        - {id: click, op: sound, sound: "block.stone_pressure_plate.click_on", anchor: caster, volume: 1.0, pitch: 0.8, at: 0}
        - {id: plate, op: display, kind: block, block: black_concrete, anchor: spot, at: 0, for: 51, offset: {up: 0.07}, scale: [0.8, 0.14, 0.8], brightness: {block: 15, sky: 15}}
        - {id: core, op: display, kind: block, block: red_concrete, anchor: spot, at: 0, for: 51, offset: {up: 0.17}, scale: [0.34, 0.08, 0.34], brightness: {block: 15, sky: 15}}
        - {id: lamp, op: display, kind: block, block: redstone_block, anchor: spot, at: 0, for: 51, offset: {up: 0.24}, scale: [0.14, 0.06, 0.14], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [0.14, 0.06, 0.14]}, {t: 5, scale: [0.22, 0.1, 0.22], ease: in_out_quad}, {t: 10, scale: [0.14, 0.06, 0.14], ease: in_out_quad}, {t: 15, scale: [0.22, 0.1, 0.22], ease: in_out_quad}, {t: 20, scale: [0.14, 0.06, 0.14], ease: in_out_quad}, {t: 25, scale: [0.22, 0.1, 0.22], ease: in_out_quad}, {t: 30, scale: [0.14, 0.06, 0.14], ease: in_out_quad}, {t: 35, scale: [0.22, 0.1, 0.22], ease: in_out_quad}, {t: 40, scale: [0.14, 0.06, 0.14], ease: in_out_quad}, {t: 45, scale: [0.22, 0.1, 0.22], ease: in_out_quad}, {t: 50, scale: [0.14, 0.06, 0.14], ease: in_out_quad}]}]}
        - {id: ring, op: display, kind: sprite, sprite: ring, anchor: spot, at: 0, for: 51, offset: {up: 0.16}, size: [1.5, 1.5], color: "#ff3220", billboard: fixed, brightness: {block: 15, sky: 15}, motion: [{law: align, axis: forward, to: world.up, at: 0, for: 51}]}
        - {id: smoke, op: particle_def, def: gun-smoke, anchor: smoke_at, at: 0}
        - {id: boom, op: explode, at: 50, anchor: spot, power: "${explode_power}", break_blocks: false, fire: false}
        - {id: blast, op: damage, at: 50, target: {kind: enemies, around: spot, radius: "${explode_radius}"}, damage: {physical: "${explode_physical}"}}
    end: {final: true}
