apiVersion: astera/v3
kind: Skill
id: delay-mine-lay
item: delay-mine
meta:
  name: {ja: 地雷設置, en: Lay Mine}
  description: {ja: "目の前に地雷を置く。少し後に爆発する。", en: "Plants a mine ahead that detonates after a short delay."}
  cooldown_ticks: 160
  resource_cost: 10
  tags: [utility, explosive, zone]
params:
  explode_power:    {type: number, default: 1.0}
  explode_radius:   {type: blocks, default: 2.5}
  explode_physical: {type: number, default: 55}
anchors:
  - {id: spot, anchor: caster.eye, offset: {forward: 2.5}, mode: snapshot}
  - {id: smoke_at, anchor: caster.eye, offset: {forward: 2.5, up: 0.1}}
presentation:
  timeline:
    - id: lay
      at: 0
      do:
        - {id: snd, op: sound, sound: "block.stone_pressure_plate.click_on", anchor: caster, volume: 1.0, pitch: 0.8}
        - {id: smoke, op: emit, effect: gun-smoke, anchor: smoke_at}
machine:
  start: armed
  states:
    armed:
      for: 51
      then: done
      do:
        # GAP: v2 op explode (power, break_blocks, radius, components) has no v3 OpSpec -> kept verbatim at tick 50; closest v3 is damage + particle, which would drop block-break/power semantics
        - {id: boom, op: explode, at: 50, power: "${explode_power}", break_blocks: false, radius: "${explode_radius}", components: [{kind: physical, amount: "${explode_physical}"}], anchor: spot}
    done: {final: true}
