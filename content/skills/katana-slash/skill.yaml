# katana-slash: rising diagonal cut of the katana (wind-up 2 ticks, hit at tick 2).
# Frames (ADR-0314, ADR-0315), the gameplay (hit tick, shape, damage, knockback, cooldown, cast length) is unchanged:
#   blade  - the katana. Origin at the caster feet, moved along a hand path (guard -> drawn low at the right -> up across to the high left -> guard). Long axis along v (grip at the origin, tip at v 1.03), edge along w. Roll -45 about v lays the edge on
#            the diagonal, then the cut is a turn about s (v moves towards w): the edge leads. The wind-up tips the point back (-50), the cut carries it through (+80, hit
#            while the blade crosses the middle), `reset` eases back to guard.
#            The engine pins the right hand to the origin, so every `move:` point lies inside the 0.60 reach of the right shoulder (v 0 / w 1.29 / s 0.29).
#   body   - the caster's feet, v forward / w up / s right: sounds and the cast fx.
#   wound  - one per victim at the victim's centre, v the way the blow came in: the hit sound and the hit spark.
#   edge   - line along the blade from part-way to the tip (v 0.65 .. 1.03), what the trail rows draw along.
apiVersion: astera/v3
kind: Skill
id: katana-slash
item: katana
meta:
  name: {ja: "居合の一閃", en: "Katana Slash"}
  description: {ja: "素早く前方を斬る。", en: "A quick, light forward slash."}
  cooldown_ticks: 8
  resource_cost: 5
  tags: [melee, physical]
params:
  arc_deg: {type: number, default: 70}
  range: {type: blocks, default: 3.3}
  dmg_physical: {type: number, default: 26.0}
  knockback: {type: number, default: 0.2}
frames:
  - id: blade
    origin: caster
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: 0.45, w: 0.9, s: 0.36}}  # guard
      - {at: 0, for: 1, to: {v: 0.24, w: 0.88, s: 0.66}}
      - {at: 1, for: 1, to: {v: 0.2, w: 1.08, s: -0.24}}
      - {at: 2, for: 1, to: {v: 0.12, w: 1.36, s: -0.29}}
      - {at: 4, for: 1, to: {v: 0.14, w: 1.35, s: -0.29}}
      - {at: 5, for: 1, to: {v: 0.18, w: 1.18, s: -0.27}}
      - {at: 6, for: 1, to: {v: 0.25, w: 0.95, s: -0.14}}
      - {at: 7, for: 1, to: {v: 0.41, w: 0.88, s: 0.12}}
      - {at: 8, for: 1, to: {v: 0.47, w: 0.92, s: 0.29}}
      - {at: 9, for: 1, to: {v: 0.46, w: 0.91, s: 0.34}}
      - {at: 10, for: 1, to: {v: 0.45, w: 0.9, s: 0.36}}
    rotate:
      - {at: 0, for: 0, about: v, to: -45}  # roll the edge into the cut plane
      - {at: 0, for: 1, about: s, to: -50, ease: in_out_sine}  # wind-up turn
      - {at: 1, for: 3, about: s, to: 80, ease: out_cubic}  # the cut, edge first
      - {at: 4, for: 7, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: wound
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
lines:
  edge: {frame: blade, from: {v: 0.65}, to: {v: 1.03}}
machine:
  start: windup
  tail: 9
  states:
    windup:
      for: 2
      then: strike
      do:
        - {id: rig, op: rig, frame: blade, for: 11, detach: true}
    strike:
      for: 1
      then: end
      enter:
        - id: swing
          op: hit
          frame: blade
          at: 0
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          max_count: all
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: "${knockback}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", frame: wound, volume: 0.7, pitch: 1.2, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, frame: wound, pos: {w: 0.2}, detach: true}
        - {id: snd_swing, op: sound, sound: "astera:weapons/sword-swing", frame: body, volume: 1.0, pitch: 1.5, at: 0, detach: true}
        - {id: fx_swing, op: particle_def, def: slash-sweep, frame: body, pos: {v: 1.4, w: 1.42}, at: 0, detach: true}
        - {id: trail_fx, op: particle, particle: crit, along: edge, samples: 2, count: 1, extra: 0.04, at: 0, every: 1, for: 4, detach: true}
    end: {final: true}
