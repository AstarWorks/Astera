# Match arsenal (wp/match-arsenal): simple PvP skill. One cast sound, a few particles.

id: pickaxe-bore-stone

name:
  ja: "石の掘削"
  en: "Stone Bore"
description:
  ja: "正面に3x3のトンネルを掘り進む。"
  en: "Bores a 3x3 tunnel straight ahead."

archetype: sequence
cooldown_ticks: 160
resource_cost: 0
tags: [ tool, cover ]

params:
  type: sequence

phases:
  type: sequence
  cast:
    - type: break_area
      shape: line
      length: 4
      width: 3
      height: 3
      power: 1
      tool_class: PICKAXE
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/gun-impact-block
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 0.5 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 2.0, height: 0.0 }
      particle_id: hit-spark
