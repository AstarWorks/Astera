# Wave _skills-2 / ADR-0077: BUFF archetype with phase mechanics.
#
# Self-buff that grants `example-heal-amp` for the duration. The `cast` phase
# fires the buff-on sound; `expire` plays the buff-off sound when the duration
# elapses (BuffHandler schedules the expire dispatch via IScheduler).

id: example-buff

name:
  ja: "回復強化"
  en: "Example Buff"
description:
  ja: "短時間、自分への回復効果を増幅する。"
  en: "Briefly amplifies healing received by the caster."

archetype: buff
cooldown_ticks: 200
tags: [ buff, heal-amp ]

params:
  type: buff
  status_effect_id: example-heal-amp
  duration_ticks: 60

phases:
  type: buff
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: block.beacon.activate
  expire:
    - type: play_sound
      targets: { type: caster }
      sound_id: block.beacon.deactivate
  removed: []
