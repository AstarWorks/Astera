# Phase 2 starter: BUFF archetype example — short-press defensive buff.
# Applies a self-targeted heal-amp via the example-heal status; the runtime
# heal handler (Phase 2 mid Batch 3) reads the multiplier from the spec.

id: example-buff

display_name_key: astera.skill.example-buff.name
description_key: astera.skill.example-buff.lore

archetype: buff
trigger: sneak_right
cooldown_ticks: 200       # ~10s @ 20 TPS

params:
  type: buff
  status_effect_id: example-heal-amp
  duration_ticks: 60      # ~3s window of amplified healing
