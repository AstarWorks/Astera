# ADR-0280: field tool skill. Tools do the large-scale cover breaking; weapons only chip.

id: field-axe-cleave

name:
  ja: "木断ち"
  en: "Cleave"
description:
  ja: "前方6ブロックの直線上の遮蔽物を一気に割る。木のバリケード向き。"
  en: "Cuts a 6-block line of cover in front of you in one swing. Made for wooden barricades."

archetype: sequence
cooldown_ticks: 120
resource_cost: 0
tags: [ tool, cover ]

block_damage:
  amount: 300          # 3 axe swings of HP along the whole line (a barricade falls in one cleave)
  radius: 1.0
  reach: 6.0
  shape: line
  tool: AXE/IRON

params:
  type: sequence

phases:
  type: sequence
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/blade-heavy-swing
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 0.8 }
