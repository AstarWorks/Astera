id: edict-ego
name:
  ja: 解かれた勅令
  en: Unbound Mandate
description:
  ja: E.G.Oを使い、拘束を解いて呼吸を溜める。
  en: Spend E.G.O to break the bonds and build Poise.
archetype: sequence
cooldown_ticks: 220
resource_cost: 0
params:
  type: sequence
phases:
  type: sequence
  cast:
  - type: play_vfx
    targets:
      type: caster
    vfx_id: edict-prescript
  - type: play_vfx
    targets:
      type: caster
    vfx_id: edict-branching-arms
    delay_ticks:
      type: literal
      value: 1
  - type: play_vfx
    targets:
      type: caster
    vfx_id: edict-ground-ellipse
    delay_ticks:
      type: literal
      value: 10
  - type: apply_status
    targets:
      type: caster
    status_id: poise
    effect_duration_ticks:
      type: literal
      value: 400
    stack_count:
      type: literal
      value: 5
    delay_ticks:
      type: literal
      value: 24
  - type: screen_flash
    targets:
      type: caster
    overlay: vignette
    color: '#080510'
    fade_in:
      type: literal
      value: 0
    stay:
      type: literal
      value: 1
    fade_out:
      type: literal
      value: 1
    delay_ticks:
      type: literal
      value: 9
ego_cost: 100
