id: edict-ego
name:
  en: Edict Thorn Mandate
  ja: 棘の勅令
description:
  en: A cipher resolves as dark thorns unfold; gathers Poise.
  ja: 暗号が解け、黒い棘が広がる。平静を得る。
archetype: sequence
cooldown_ticks: 240
resource_cost: 0
params:
  type: sequence
phases:
  type: sequence
  cast:
  - type: play_vfx
    targets:
      type: caster
    delay_ticks:
      type: literal
      value: 0
    vfx_id: edict-prescript
  - type: screen_flash
    targets:
      type: caster
    delay_ticks:
      type: literal
      value: 13
    overlay: vignette
    color: '#080510'
    fade_in:
      type: literal
      value: 0
    stay:
      type: literal
      value: 2
    fade_out:
      type: literal
      value: 1
  - type: apply_status
    targets:
      type: caster
    delay_ticks:
      type: literal
      value: 26
    status_id: poise
    effect_duration_ticks:
      type: literal
      value: 400
    stack_count:
      type: literal
      value: 3
  - type: play_sound
    targets:
      type: caster
    delay_ticks:
      type: literal
      value: 16
    sound_id: block.respawn_anchor.charge
    volume:
      type: literal
      value: 0.8
    pitch:
      type: literal
      value: 0.7
  - type: spawn_particle
    targets:
      type: nearby_entities
      center:
        type: caster_forward
        distance: 2.6
        height: -0.72
      radius:
        type: literal
        value: 1.7
      exclude_caster: true
      max_count:
        type: literal
        value: 1
    delay_ticks:
      type: literal
      value: 16
    particle_id: hit-spark
ego_cost: 100
