# Persona weapon: Ember Gauntlet. DEF sneak + left-click -- Flare Guard. 15 energy.
# The gauntlet vents a flame ring: the caster is untouchable for 8 ticks (dash_strike invulnerable on a half-block
# slip), enemies in the 3.4 block front arc are shoved back, singed (burn) and starburst-marked, and
# the caster banks 2 Charge (one from the buff status, one from the cast). Soot puff afterwards.

id: ember-gauntlet-def

name:
  ja: "フレア・ガード"
  en: "Flare Guard"
description:
  ja: "炎の輪を噴き出して短時間無敵になり、前方の敵を押し返して燃やす。充填が2溜まる。"
  en: "Vents a flame ring: briefly untouchable, shoves and singes enemies in front, and banks 2 charge."

archetype: buff
cooldown_ticks: 120
resource_cost: 15              # energy
tags: [ persona, melee, fire, defense, charge ]

params:
  type: buff
  status_effect_id: charge     # +1 Charge
  duration_ticks: 160

phases:
  type: buff
  cast:
    - type: dash_strike
      distance: 0.5
      ticks: 8
      radius: 1.0
      hit_once: true
      invulnerable: true
      stop_on_block: true
    - type: apply_status
      targets: { type: caster }
      status_id: charge
      effect_duration_ticks: { type: literal, value: 160 }
    - type: play_vfx
      targets: { type: caster }
      vfx_id: ember-flare-guard
    - type: play_sound
      targets: { type: caster }
      sound_id: item.firecharge.use
      volume: { type: literal, value: 0.9 }
      pitch: { type: literal, value: 0.8 }
    - type: play_sound
      targets: { type: caster }
      sound_id: item.shield.block
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.4 }
    - type: spawn_particle
      targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 0.3, z: 0.0 } } }
      particle_id: fire-cast
    # the shove lands as the ring reaches the front arc
    - type: damage
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 140.0 }, distance: { type: literal, value: 3.4 } }
      components:
        - base: { type: literal, value: 2.5 }
          attribute: fire
      delay_ticks: { type: literal, value: 3 }
    - type: hit_stop
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 140.0 }, distance: { type: literal, value: 3.4 } }
      ticks: 2
      delay_ticks: { type: literal, value: 3 }
    - type: knockback
      targets: { type: cone, from: { type: caster }, direction: { type: away_from_caster, vertical: 0.15 }, angle_degrees: { type: literal, value: 140.0 }, distance: { type: literal, value: 3.4 } }
      direction: { type: away_from_caster, vertical: 0.15 }
      strength: { type: literal, value: 1.1 }
      delay_ticks: { type: literal, value: 3 }
    - type: apply_status
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 140.0 }, distance: { type: literal, value: 3.4 } }
      status_id: burn
      effect_duration_ticks: { type: literal, value: 20 }
      delay_ticks: { type: literal, value: 3 }
    - type: play_vfx
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 140.0 }, distance: { type: literal, value: 3.4 } }
      vfx_id: ember-hoop-hit
      scale: { type: literal, value: 1.2 }
      delay_ticks: { type: literal, value: 3 }
    - type: play_sound
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 140.0 }, distance: { type: literal, value: 3.4 } }
      sound_id: entity.player.attack.strong
      pitch: { type: literal, value: 0.9 }
      delay_ticks: { type: literal, value: 3 }
    # vents
    - type: play_vfx
      targets: { type: caster }
      vfx_id: ember-smoke-puff
      scale: { type: literal, value: 0.7 }
      delay_ticks: { type: literal, value: 8 }
  expire: []
  removed: []
