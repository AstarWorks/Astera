# sentry-totem: plants a sentry turret ahead of the caster (ADR-0313 `summon`). The turret is an independent run owned by the caster; it outlives the caster's death and has a breakable 20 hp body.
apiVersion: astera/v3
kind: Skill
id: sentry-totem
meta:
  name: {ja: "センチネル", en: Sentry totem}
  description: {ja: "前方に自動で撃つ砲台を置く。", en: "Plants a turret that fires on its own."}
  cooldown_ticks: 100
  resource_cost: 12
  tags: [summon]
anchors:
  - {id: plant, anchor: caster.feet, offset: {forward: 2}, mode: snapshot}
machine:
  start: place
  states:
    place:
      for: 2
      then: end
      do:
        - {id: turret, op: summon, at: 0, skill: sentry-turret, anchor: plant, life: 60, outlives_caster: true, body: {hp: 20, width: 0.9, height: 1.2}}
    end: {final: true}
