              - {id: dark_3_1, op: display, kind: text, text: " ", background: "#28201C", frame: cut1, pos: {v: 0.9, w: 0.3}, for: 7, rotate: [{axis: v, deg: 90}], scale: [0.96, 0.64, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: grow, per_tick: {left: -0.093333, up: -0.053333}, at: 0, for: 6, ease: out_cubic}, {law: fade, at: 0, for: 6, ease: out_cubic}]}
