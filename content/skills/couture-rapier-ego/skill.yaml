                kind: text
                text: "✦"
                color: "#FFF8ED"
                see_through: true
                anchor: hit2_at
                at: 0
                for: 7
                offset: {up: 1.1}
                scale: [0.5, 0.5, 1]
                billboard: center
                brightness: {block: 15, sky: 15}
                motion:
                  - {law: grow, per_tick: {left: 8.5, up: 8.5}, at: 0, for: 1, ease: out_expo}
                  - {law: grow, per_tick: {left: -0.5, up: -0.5}, at: 1, for: 2}
                  - {law: grow, per_tick: {left: -2.333333, up: -2.333333}, at: 3, for: 3, ease: in_quad}
                  - {law: fade, at: 0, for: 6, ease: in_quad}
              - {id: hit2_sparks_at, op: frame, anchor: hit2_at, mode: follow, offset: {up: 1.1}, at: 0, for: 1}
              - {id: hit2_sparks, op: particle_def, def: stab-spark, anchor: hit2_sparks_at, at: 0, every: 3, times: 2}
              - {id: snd_2, op: sound, sound: entity.player.attack.strong, anchor: contact, volume: 0.7, pitch: 1.1}
        - id: rosette_pick
          op: hit
          at: 62
          anchor: caster.eye
          targets: enemies
          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          ignore_invulnerability: true
          on:
            hit:
              # --- tick +0..11: a ring of 15 pink arcs (radius 2.6) blooms around the victim and contracts again
              - {id: rosette_at, op: frame, anchor: victim, axes: caster, mode: snapshot, at: 0, for: 11}
              - id: rosette
                op: display
                kind: block
                block: pink_concrete
                anchor: rosette_at
                at: 0
                for: 11
                times: 15
                offset: {up: "= 1.1 + 2.6 * sin(rad(24 * i))", forward: "= 0.4 + 2.6 * cos(rad(24 * i))"}
                rotate: [{axis: left, deg: "= -90 - 24 * i"}]
                scale: [0, 0, 0]
                brightness: {block: 15, sky: 15}
                motion:
                  - {law: grow, per_tick: {left: 0.025, up: "= 0.0235 + 0.0487 * sin(3.14159265 * i / 15)", forward: 0.626225}, at: 0, for: 2}
                  - {law: grow, per_tick: {left: -0.005556, up: "= -0.2222 * (0.0235 + 0.0487 * sin(3.14159265 * i / 15))", forward: -0.055664}, at: 2, for: 9}
    end: {final: true}
