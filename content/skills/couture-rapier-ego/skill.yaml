              - {id: flower1_0, op: display, kind: block, block: white_concrete, frame: fall1, pos: {s: 0.24}, for: 21, scale: [0.3, 0.3, 0.24], motion: [{law: grow, to: 0, at: 16, for: 4}]}
              - {id: flower1_1, op: display, kind: block, block: white_concrete, frame: fall1, pos: {s: -0.24}, for: 21, scale: [0.3, 0.3, 0.24], motion: [{law: grow, to: 0, at: 16, for: 4}]}
