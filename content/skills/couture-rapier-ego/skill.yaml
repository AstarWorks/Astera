              - {id: a1_blade2, op: display, kind: block, block: gray_concrete, frame: fall_a1, pos: {v: 3.18, w: -0.38}, rotate: [{axis: s, deg: -7}], for: 21, scale: [0.12, 0.09, 0.8], motion: [{law: grow, to: 0, at: 16, for: 4}]}
