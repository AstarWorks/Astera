# Falling Cutout (E.G.O): an overhead arc of glass sweeps up, then five timed hits - giant shears drop on the nearest enemy twice, a cut with a white cross lands twice, and a pink rosette closes it.
# Written in the ADR-0303 high-level form: one op per visual object, copies as `times:` families, shape as laws and keys.
# The shears are the rapier shears at 2x scale, hinged about a frame that drops from 6.5 blocks above the victim; the cross is the rapier-def cross.
apiVersion: astera/v3
kind: Skill
id: couture-rapier-ego
item: couture-rapier
meta: {name: {ja: "落花の裁断", en: "Falling Cutout"}, description: {ja: "E.G.Oを使い切り、鋏で強烈な連続斬りを叩き込む。", en: "Spend the full E.G.O gauge for a heavy shearing combo."}, cooldown_ticks: 220, resource_cost: 0, ego_cost: 100}
params:
  arc_deg: {type: number, default: 45}
  reach: {type: blocks, default: 12}
  dmg_physical: {type: number, default: 75}
  dmg_physical_2: {type: number, default: 100}
machine:
  start: cast
  states:
    cast:
      for: 73
      then: end
      do:
        # --- tick 0..19: an arc of 12 glass panes (radius 1.7, -80 to 110 degrees) sweeps up over the caster's head
        - {id: overhead_at, op: frame, anchor: caster, mode: snapshot, at: 0, for: 19}
        - id: overhead
          op: display
          kind: block
          block: white_stained_glass
          anchor: overhead_at
          at: 0
          for: 19
          times: 12
          offset: {up: "= 1.1 + 1.7 * sin(rad(-80 + 190 / 11 * i))", forward: "= 0.4 + 1.7 * cos(rad(-80 + 190 / 11 * i))"}
          rotate: [{axis: left, deg: "= -10 - 190 / 11 * i"}]
          scale: [0, 0, 0]
          brightness: {block: 15, sky: 15}
          motion:
            - {law: grow, per_tick: {left: 0.025, up: "= 0.02686 + 0.0452 * sin(3.14159265 * i / 11)", forward: 0.294685}, at: 0, for: 2}
            - {law: grow, per_tick: {left: -0.002941, up: "= -0.11765 * (0.02686 + 0.0452 * sin(3.14159265 * i / 11))", forward: -0.013868}, at: 2, for: 17}
        # origin eye, yaw-only forward, sector 45 deg full opening, ignore_invulnerability; trigger-only hits omit damage; max_count 1 = nearest target.
        - id: sel
          op: hit
          at: 18
          anchor: caster.eye
          targets: enemies
          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          ignore_invulnerability: true
          on:
            hit:
              # --- tick +0..21: a giant pair of shears (2x the rapier shears) drops from 6.5 blocks above the victim, snips about its hinge and shrinks away
              - {id: fall_at, op: frame, anchor: victim, axes: caster, mode: snapshot, at: 0, for: 21}
              - id: fall_drop
                op: frame
                anchor: fall_at
                offset: {up: 6.5}
                at: 0
                for: 21
                motion:
                  - {law: move, velocity: {up: -0.4625}, at: 0, for: 8}
                  - {law: move, velocity: {up: -0.035563, forward: 0.124027}, at: 8, for: 3}
              - id: fall_hinge_a
                op: frame
                anchor: fall_drop
                offset: {left: -0.09}
                turn: [{axis: left, deg: 113}]
                at: 0
                for: 21
                motion:
                  - {law: spin, axis: left, deg_per_tick: -9.33333, at: 8, for: 3}
              - id: fall_blade_a
                op: display
                kind: block
                block: gray_concrete
                anchor: fall_hinge_a
                at: 0
                for: 21
                times: 3
                offset: [{up: -0.0975, forward: 0.79404}, {up: -0.26812, forward: 2.1836}, {up: -0.38998, forward: 3.17614}]
                rotate: [{axis: left, deg: 7}]
                scale: [[0.12, 0.38, 1.6], [0.12, 0.24, 1.2], [0.12, 0.09, 0.8]]
                motion:
                  - {law: grow, to: 0, at: 16, for: 4}
              - id: fall_edge_a
                op: display
                kind: block
                block: iron_block
                anchor: fall_hinge_a
                at: 0
                for: 21
                times: 3
                offset: [{up: 0.02132, forward: 0.80862}, {up: -0.19308, forward: 2.19282}, {up: -0.36184, forward: 3.1796}]
                rotate: [[{axis: left, deg: 10.66907}], [{axis: left, deg: 10.09097}], [{axis: left, deg: 8.73982}]]
                scale: [[0.12, 0.05, 1.60328], [0.12, 0.05, 1.20174], [0.12, 0.05, 0.80036]]
                motion:
                  - {law: grow, to: 0, at: 16, for: 4}
              - id: fall_handle_a
                op: display
                kind: block
                block: black_concrete
                anchor: fall_hinge_a
                at: 0
                for: 21
                times: 5
                offset: [{up: 0.26468, forward: -0.35036}, {up: 0.5349, forward: -0.9922}, {up: 0.3848, forward: -1.57484}, {up: -0.03642, forward: -1.34446}, {up: -0.13148, forward: -0.57028}]
                rotate: [[{axis: left, deg: -128}], [{axis: left, deg: -176.81407}], [{axis: left, deg: 127.06858}], [{axis: left, deg: 34.14968}], [{axis: left, deg: -20.14968}]]
                scale: [[0.12, 0.09, 0.62226], [0.12, 0.09, 0.902], [0.12, 0.09, 0.43908], [0.12, 0.09, 0.87658], [0.12, 0.09, 0.87658]]
                motion:
