              - {id: b1_edge1, op: display, kind: block, block: iron_block, frame: fall_b1, pos: {v: 2.2, w: -0.2}, rotate: [{axis: s, deg: -10.1}], for: 21, scale: [0.12, 0.05, 1.2], motion: [{law: grow, to: 0, at: 16, for: 4}]}
              - {id: b1_edge2, op: display, kind: block, block: iron_block, frame: fall_b1, pos: {v: 3.18, w: -0.36}, rotate: [{axis: s, deg: -8.7}], for: 21, scale: [0.12, 0.05, 0.8], motion: [{law: grow, to: 0, at: 16, for: 4}]}
              - {id: b1_handle0, op: display, kind: block, block: black_concrete, frame: fall_b1, pos: {v: -0.36, w: 0.26}, rotate: [{axis: s, deg: 128}], for: 21, scale: [0.12, 0.09, 0.62], motion: [{law: grow, to: 0, at: 16, for: 4}]}
              - {id: b1_handle1, op: display, kind: block, block: black_concrete, frame: fall_b1, pos: {v: -1, w: 0.54}, rotate: [{axis: s, deg: 177}], for: 21, scale: [0.12, 0.09, 0.9], motion: [{law: grow, to: 0, at: 16, for: 4}]}
