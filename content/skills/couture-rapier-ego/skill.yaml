# Falling Cutout (E.G.O) in the frame grammar (ADR-0314): an overhead arc of glass sweeps up, then five timed hits - giant shears drop on the nearest
# enemy twice, a cut with a white cross lands twice, and a pink rosette closes it. A caster frame has v = forward, w = up, s = v x w (to the right).
#   body      - the caster's feet: the 12 glass panes of the overhead arc (radius 1.7, -80 to 110 degrees about the head) are points of it.
#   fallN     - one per shears drop N (hits at ticks 18 and 48): the victim's feet, v the caster's forward. The flower sits on it. It
#               falls from 6.5 above the victim to 2.8 in 8 ticks, then drifts to 2.69 above and 0.37 ahead in 3 more.
#   fall_aN/_bN - the two halves of the giant shears (2x the rapier shears), 0.09 either side; they ride the same drop. The `rotate` keys
#               about s ARE the snip: half A starts 113 degrees and closes to 85, half B starts 53 and opens to 81 (ticks 8..11).
#   cutN      - the victim's centre, v the way the blow came in: cross, four shards, bloom, eight petals, fill and sparks of the cut that lands
#               (ticks 29 and 59). Its scale key is the burst: 0.1 to 1 over 7 ticks (out_cubic), so every shard and petal, placed at its
#               final radius, flies out and slows. One frame per blow because a per-victim frame's keys run from its first use.
#   ring      - the victim's feet: the 15 pink blades of the rosette (tick 62) close around the head at 2.6 and collapse.
# Gameplay (hit ticks 18, 29, 48, 59, 62, windows, damage, cast length 73) is unchanged.
apiVersion: astera/v3
kind: Skill
id: couture-rapier-ego
item: couture-rapier
meta: {name: {ja: "落花の裁断", en: "Falling Cutout"}, description: {ja: "E.G.Oを使い切り、鋏で強烈な連続斬りを叩き込む。", en: "Spend the full E.G.O gauge for a heavy shearing combo."}, cooldown_ticks: 220, resource_cost: 0, ego_cost: 100}
params:
  arc_deg: {type: number, default: 45}
  reach: {type: blocks, default: 12}
  dmg_physical: {type: number, default: 75}
  dmg_physical_2: {type: number, default: 100}
frames:
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: fall1
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {w: 6.5}}
      - {at: 0, for: 8, to: {w: 2.8}}
      - {at: 8, for: 3, to: {v: 0.37, w: 2.69}}
  - id: fall_a1
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {w: 6.5, s: 0.09}}
      - {at: 0, for: 8, to: {w: 2.8, s: 0.09}}
      - {at: 8, for: 3, to: {v: 0.37, w: 2.69, s: 0.09}}
    rotate:
      - {at: 0, for: 0, about: s, to: -113}
      - {at: 8, for: 3, about: s, to: -85}
  - id: fall_b1
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {w: 6.5, s: -0.09}}
      - {at: 0, for: 8, to: {w: 2.8, s: -0.09}}
      - {at: 8, for: 3, to: {v: 0.37, w: 2.69, s: -0.09}}
    rotate:
      - {at: 0, for: 0, about: s, to: -53}
      - {at: 8, for: 3, about: s, to: -81}
  - id: cut1
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
    scale:
      - {at: 0, for: 0, to: {v: 0.1, w: 0.1, s: 0.1}}
      - {at: 0, for: 7, to: {v: 1, w: 1, s: 1}, ease: out_cubic}
  - id: fall2
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {w: 6.5}}
      - {at: 0, for: 8, to: {w: 2.8}}
      - {at: 8, for: 3, to: {v: 0.37, w: 2.69}}
  - id: fall_a2
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {w: 6.5, s: 0.09}}
      - {at: 0, for: 8, to: {w: 2.8, s: 0.09}}
      - {at: 8, for: 3, to: {v: 0.37, w: 2.69, s: 0.09}}
    rotate:
      - {at: 0, for: 0, about: s, to: -113}
      - {at: 8, for: 3, about: s, to: -85}
  - id: fall_b2
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {w: 6.5, s: -0.09}}
      - {at: 0, for: 8, to: {w: 2.8, s: -0.09}}
      - {at: 8, for: 3, to: {v: 0.37, w: 2.69, s: -0.09}}
    rotate:
      - {at: 0, for: 0, about: s, to: -53}
      - {at: 8, for: 3, about: s, to: -81}
  - id: cut2
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
    scale:
      - {at: 0, for: 0, to: {v: 0.1, w: 0.1, s: 0.1}}
      - {at: 0, for: 7, to: {v: 1, w: 1, s: 1}, ease: out_cubic}
  - id: ring
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
machine:
  start: cast
  states:
    cast:
      for: 73
      then: end
      do:
        # --- tick 0..19: an arc of 12 glass panes (radius 1.7, -80 to 110 degrees) sweeps up over the caster's head
        - {id: overhead0, op: display, kind: block, block: white_stained_glass, frame: body, pos: {v: 0.7, w: -0.57}, at: 0, for: 19, rotate: [{axis: s, deg: 10}], scale: [0, 0, 0], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [0, 0, 0]}, {t: 2, scale: [0.05, 0.054, 0.59]}, {t: 19, scale: [0, 0, 0]}]}]}
        - {id: overhead1, op: display, kind: block, block: white_stained_glass, frame: body, pos: {v: 1.18, w: -0.41}, at: 0, for: 19, rotate: [{axis: s, deg: 27.3}], scale: [0, 0, 0], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [0, 0, 0]}, {t: 2, scale: [0.05, 0.079, 0.59]}, {t: 19, scale: [0, 0, 0]}]}]}
        - {id: overhead2, op: display, kind: block, block: white_stained_glass, frame: body, pos: {v: 1.59, w: -0.11}, at: 0, for: 19, rotate: [{axis: s, deg: 44.5}], scale: [0, 0, 0], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [0, 0, 0]}, {t: 2, scale: [0.05, 0.103, 0.59]}, {t: 19, scale: [0, 0, 0]}]}]}
        - {id: overhead3, op: display, kind: block, block: white_stained_glass, frame: body, pos: {v: 1.9, w: 0.3}, at: 0, for: 19, rotate: [{axis: s, deg: 61.8}], scale: [0, 0, 0], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [0, 0, 0]}, {t: 2, scale: [0.05, 0.122, 0.59]}, {t: 19, scale: [0, 0, 0]}]}]}
        - {id: overhead4, op: display, kind: block, block: white_stained_glass, frame: body, pos: {v: 2.07, w: 0.78}, at: 0, for: 19, rotate: [{axis: s, deg: 79.1}], scale: [0, 0, 0], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [0, 0, 0]}, {t: 2, scale: [0.05, 0.136, 0.59]}, {t: 19, scale: [0, 0, 0]}]}]}
        - {id: overhead5, op: display, kind: block, block: white_stained_glass, frame: body, pos: {v: 2.09, w: 1.29}, at: 0, for: 19, rotate: [{axis: s, deg: 96.4}], scale: [0, 0, 0], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [0, 0, 0]}, {t: 2, scale: [0.05, 0.143, 0.59]}, {t: 19, scale: [0, 0, 0]}]}]}
        - {id: overhead6, op: display, kind: block, block: white_stained_glass, frame: body, pos: {v: 1.96, w: 1.78}, at: 0, for: 19, rotate: [{axis: s, deg: 113.6}], scale: [0, 0, 0], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [0, 0, 0]}, {t: 2, scale: [0.05, 0.143, 0.59]}, {t: 19, scale: [0, 0, 0]}]}]}
        - {id: overhead7, op: display, kind: block, block: white_stained_glass, frame: body, pos: {v: 1.68, w: 2.21}, at: 0, for: 19, rotate: [{axis: s, deg: 130.9}], scale: [0, 0, 0], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [0, 0, 0]}, {t: 2, scale: [0.05, 0.136, 0.59]}, {t: 19, scale: [0, 0, 0]}]}]}
        - {id: overhead8, op: display, kind: block, block: white_stained_glass, frame: body, pos: {v: 1.3, w: 2.54}, at: 0, for: 19, rotate: [{axis: s, deg: 148.2}], scale: [0, 0, 0], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [0, 0, 0]}, {t: 2, scale: [0.05, 0.122, 0.59]}, {t: 19, scale: [0, 0, 0]}]}]}
        - {id: overhead9, op: display, kind: block, block: white_stained_glass, frame: body, pos: {v: 0.83, w: 2.75}, at: 0, for: 19, rotate: [{axis: s, deg: 165.5}], scale: [0, 0, 0], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [0, 0, 0]}, {t: 2, scale: [0.05, 0.103, 0.59]}, {t: 19, scale: [0, 0, 0]}]}]}
        - {id: overhead10, op: display, kind: block, block: white_stained_glass, frame: body, pos: {v: 0.32, w: 2.8}, at: 0, for: 19, rotate: [{axis: s, deg: 182.7}], scale: [0, 0, 0], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [0, 0, 0]}, {t: 2, scale: [0.05, 0.079, 0.59]}, {t: 19, scale: [0, 0, 0]}]}]}
        - {id: overhead11, op: display, kind: block, block: white_stained_glass, frame: body, pos: {v: -0.18, w: 2.7}, at: 0, for: 19, rotate: [{axis: s, deg: 200}], scale: [0, 0, 0], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [0, 0, 0]}, {t: 2, scale: [0.05, 0.054, 0.59]}, {t: 19, scale: [0, 0, 0]}]}]}
