                at: 0
                for: 21
                times: 3
                offset: [{up: -0.0975, forward: 0.79404}, {up: -0.26812, forward: 2.1836}, {up: -0.38998, forward: 3.17614}]
                rotate: [{axis: left, deg: 7}]
                scale: [[0.12, 0.38, 1.6], [0.12, 0.24, 1.2], [0.12, 0.09, 0.8]]
                motion:
                  - {law: grow, to: 0, at: 16, for: 4}
              - id: fall_edge_b
