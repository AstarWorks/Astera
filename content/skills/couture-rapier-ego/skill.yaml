              - {id: a1_handle2, op: display, kind: block, block: black_concrete, frame: fall_a1, pos: {v: -1.58, w: 0.38}, rotate: [{axis: s, deg: -127}], for: 21, scale: [0.12, 0.09, 0.44], motion: [{law: grow, to: 0, at: 16, for: 4}]}
              - {id: a1_handle3, op: display, kind: block, block: black_concrete, frame: fall_a1, pos: {v: -1.34, w: -0.04}, rotate: [{axis: s, deg: -34}], for: 21, scale: [0.12, 0.09, 0.88], motion: [{law: grow, to: 0, at: 16, for: 4}]}
              - {id: a1_handle4, op: display, kind: block, block: black_concrete, frame: fall_a1, pos: {v: -0.58, w: -0.14}, rotate: [{axis: s, deg: 20}], for: 21, scale: [0.12, 0.09, 0.88], motion: [{law: grow, to: 0, at: 16, for: 4}]}
              - {id: b1_blade0, op: display, kind: block, block: gray_concrete, frame: fall_b1, pos: {v: 0.8, w: -0.1}, rotate: [{axis: s, deg: -7}], for: 21, scale: [0.12, 0.38, 1.6], motion: [{law: grow, to: 0, at: 16, for: 4}]}
