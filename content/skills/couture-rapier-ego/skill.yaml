# Falling Cutout (E.G.O) in the frame grammar (ADR-0314): an overhead arc of glass sweeps up, then five timed hits - giant shears drop on the nearest
# enemy twice, a cut with a white cross lands twice, and a pink rosette closes it. A caster frame has v = forward, w = up, s = v x w (to the right).
#   body      - the caster's feet: the 12 glass panes of the overhead arc (radius 1.7, -80 to 110 degrees about the head) are points of it.
#   blade     - the caster's hand and the rapier (rig): the tip sweeps up and over with the arc, then cuts down at ticks 29 and 59.
#   fallN     - one per shears drop N (hits at ticks 18 and 48): the victim's feet, v the caster's forward. The flower sits on it. It
#               falls from 6.5 above the victim to 2.8 in 8 ticks, then drifts to 2.69 above and 0.37 ahead in 3 more.
#   fall_aN/_bN - the two halves of the giant shears (2x the rapier shears), 0.09 either side; they ride the same drop. The `rotate` keys
#               about s ARE the snip: half A starts 113 degrees and closes to 85, half B starts 53 and opens to 81 (ticks 8..11).
#   cutN      - the victim's centre, v the way the blow came in: cross, four shards, bloom, eight petals, fill and sparks of the cut that lands
#               (ticks 29 and 59). Its scale key is the burst: 0.1 to 1 over 7 ticks (out_cubic), so every shard and petal, placed at its
#               final radius, flies out and slows. One frame per blow because a per-victim frame's keys run from its first use.
#   ring      - the victim's feet: the 15 pink blades of the rosette (tick 62) close around the head at 2.6 and collapse.
# Gameplay (hit ticks 18, 29, 48, 59, 62, windows, damage, cast length 73) is unchanged.
apiVersion: astera/v3
kind: Skill
id: couture-rapier-ego
item: couture-rapier
meta: {name: {ja: "落花の裁断", en: "Falling Cutout"}, description: {ja: "E.G.Oを使い切り、鋏で強烈な連続斬りを叩き込む。", en: "Spend the full E.G.O gauge for a heavy shearing combo."}, cooldown_ticks: 220, resource_cost: 0, ego_cost: 100}
params:
  arc_deg: {type: number, default: 45}
  reach: {type: blocks, default: 12}
  dmg_physical: {type: number, default: 75}
  dmg_physical_2: {type: number, default: 100}
frames:
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  # arm: the right arm. Origin = the right shoulder, rotate keys only; the hand is 0.45 along its v, so it can never leave arm reach.
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: w, to: -70}
      - {at: 0, for: 0, about: s, to: -35}
      - {at: 0, for: 14, about: s, to: -5, ease: out_quad}
      - {at: 19, for: 8, about: s, to: 0}
      - {at: 25, for: 4, about: s, to: -5, ease: out_quad}
      - {at: 29, for: 3, about: s, to: -25, ease: in_quad}
      - {at: 32, for: 8, about: s, to: 0}
      - {at: 54, for: 5, about: s, to: -5, ease: out_quad}
      - {at: 59, for: 3, about: s, to: -25, ease: in_quad}
      - {at: 62, for: 8, about: s, to: 0}
  # blade: the rapier. Origin = the hand (arm tip); its keys are the blade angle (positive about s lifts the point).
  - id: blade
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      # the overhead sweep (ticks 0..14): the point rises from low in front up and over, riding the glass arc
      - {at: 0, for: 0, about: s, to: -35}
      - {at: 0, for: 14, about: s, to: 110, ease: out_quad}
      - {at: 19, for: 8, about: s, to: 0}
      # the cut that lands at tick 29: wind up, then down across the front
      - {at: 25, for: 4, about: s, to: 70, ease: out_quad}
      - {at: 29, for: 3, about: s, to: -30, ease: in_quad}
      - {at: 32, for: 8, about: s, to: 0}
      # the cut that lands at tick 59 (the shears drop at 48)
      - {at: 54, for: 5, about: s, to: 80, ease: out_quad}
      - {at: 59, for: 3, about: s, to: -30, ease: in_quad}
      - {at: 62, for: 8, about: s, to: 0}
  - id: fall1
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {w: 6.5}}
      - {at: 0, for: 8, to: {w: 2.8}}
      - {at: 8, for: 3, to: {v: 0.37, w: 2.69}}
  - id: fall_a1
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {w: 6.5, s: 0.09}}
      - {at: 0, for: 8, to: {w: 2.8, s: 0.09}}
      - {at: 8, for: 3, to: {v: 0.37, w: 2.69, s: 0.09}}
    rotate:
      - {at: 0, for: 0, about: s, to: -113}
      - {at: 8, for: 3, about: s, to: -85}
  - id: fall_b1
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {w: 6.5, s: -0.09}}
      - {at: 0, for: 8, to: {w: 2.8, s: -0.09}}
      - {at: 8, for: 3, to: {v: 0.37, w: 2.69, s: -0.09}}
    rotate:
      - {at: 0, for: 0, about: s, to: -53}
      - {at: 8, for: 3, about: s, to: -81}
  - id: cut1
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
    scale:
      - {at: 0, for: 0, to: {v: 0.1, w: 0.1, s: 0.1}}
      - {at: 0, for: 7, to: {v: 1, w: 1, s: 1}, ease: out_cubic}
  - id: fall2
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {w: 6.5}}
      - {at: 0, for: 8, to: {w: 2.8}}
      - {at: 8, for: 3, to: {v: 0.37, w: 2.69}}
  - id: fall_a2
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {w: 6.5, s: 0.09}}
      - {at: 0, for: 8, to: {w: 2.8, s: 0.09}}
      - {at: 8, for: 3, to: {v: 0.37, w: 2.69, s: 0.09}}
    rotate:
      - {at: 0, for: 0, about: s, to: -113}
      - {at: 8, for: 3, about: s, to: -85}
  - id: fall_b2
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {w: 6.5, s: -0.09}}
      - {at: 0, for: 8, to: {w: 2.8, s: -0.09}}
      - {at: 8, for: 3, to: {v: 0.37, w: 2.69, s: -0.09}}
    rotate:
      - {at: 0, for: 0, about: s, to: -53}
      - {at: 8, for: 3, about: s, to: -81}
  - id: cut2
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
    scale:
      - {at: 0, for: 0, to: {v: 0.1, w: 0.1, s: 0.1}}
      - {at: 0, for: 7, to: {v: 1, w: 1, s: 1}, ease: out_cubic}
  - id: ring
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
machine:
  start: cast
  states:
    cast:
      for: 73
      then: end
      do:
        # --- tick 0..19: an arc of 12 glass panes (radius 1.7, -80 to 110 degrees) sweeps up over the caster's head
        - {id: arc, op: display, kind: block, block: white_stained_glass, frame: body, pos: {v: 0.4, w: 1.1}, at: 0, for: 19, times: 6, rotate: [{axis: s, deg: "= 30 * i"}], scale: [0.05, 0.05, 2.4], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [0, 0, 0]}, {t: 2, scale: [1, 1, 1]}, {t: 19, scale: [0, 0, 0]}]}]}
        # origin eye, yaw-only forward, sector 45 deg full opening, ignore_invulnerability; trigger-only hits omit damage; max_count 1 = nearest target.
        - {id: rig, op: rig, frame: blade, for: 73}
        - id: sel
          op: hit
          at: 18
          anchor: caster.eye
          targets: enemies
          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          ignore_invulnerability: true
          on:
            hit:
              - {id: a1_blade, op: display, kind: block, block: gray_concrete, frame: fall_a1, pos: {v: 1.8, w: -0.15}, rotate: [{axis: s, deg: -7}], for: 21, scale: [0.12, 0.25, 3.6], motion: [{law: grow, to: 0, at: 16, for: 4}]}
              - {id: a1_edge, op: display, kind: block, block: iron_block, frame: fall_a1, pos: {v: 1.8, w: -0.05}, rotate: [{axis: s, deg: -10}], for: 21, scale: [0.12, 0.05, 3.6], motion: [{law: grow, to: 0, at: 16, for: 4}]}
              - {id: a1_handle, op: display, kind: block, block: black_concrete, frame: fall_a1, pos: {v: -0.8, w: 0.2}, rotate: [{axis: s, deg: 20}], for: 21, scale: [0.12, 0.1, 1.2], motion: [{law: grow, to: 0, at: 16, for: 4}]}
              - {id: b1_blade, op: display, kind: block, block: gray_concrete, frame: fall_b1, pos: {v: 1.8, w: -0.15}, rotate: [{axis: s, deg: -7}], for: 21, scale: [0.12, 0.25, 3.6], motion: [{law: grow, to: 0, at: 16, for: 4}]}
              - {id: b1_edge, op: display, kind: block, block: iron_block, frame: fall_b1, pos: {v: 1.8, w: -0.05}, rotate: [{axis: s, deg: -10}], for: 21, scale: [0.12, 0.05, 3.6], motion: [{law: grow, to: 0, at: 16, for: 4}]}
              - {id: b1_handle, op: display, kind: block, block: black_concrete, frame: fall_b1, pos: {v: -0.8, w: 0.2}, rotate: [{axis: s, deg: 20}], for: 21, scale: [0.12, 0.1, 1.2], motion: [{law: grow, to: 0, at: 16, for: 4}]}
              - {id: flower1, op: display, kind: block, block: white_concrete, frame: fall1, rotate: [{axis: v, deg: "= 45 * i"}], for: 21, times: 4, scale: [0.08, 0.08, 0.6], motion: [{law: grow, to: 0, at: 16, for: 4}]}
        - id: sel_2
          op: hit
          at: 29
          anchor: caster.eye
          targets: enemies
          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          damage: {physical: "= dmg_physical"}
          ignore_invulnerability: true
          on:
            hit:
              - {id: cross_1, op: display, kind: block, block: white_concrete, frame: cut1, pos: {w: 0.15}, for: 9, times: 2, rotate: [{axis: s, deg: "= 45 - 90 * i"}], scale: [0.05, 3.3, 0.05], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 3, scale: [0.8, 1, 0.8]}, {t: 8, scale: [0.2, 1, 0.2]}]}]}
              - {id: smoke_1, op: display, kind: text, text: " ", background: "#28201C", frame: cut1, pos: {v: -0.9, w: -0.6}, for: 7, scale: [1.2, 0.8, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 6, scale: [0.3, 0.3, 1]}]}, {law: fade, at: 0, for: 6, ease: out_cubic}]}
              - {id: bloom_1, op: display, kind: text, text: " ", background: "#EAD9B0", frame: cut1, pos: {w: 0.2}, for: 6, scale: [4, 2, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 1, scale: [2, 2, 1]}, {t: 5, scale: [2.5, 2.5, 1]}]}, {law: fade, at: 1, for: 4}]}
              - {id: petal_1, op: display, kind: block, block: white_concrete, frame: cut1, pos: {w: 0.1}, for: 8, times: 4, rotate: [{axis: v, deg: "= 45 * i"}], scale: [0.05, 0.05, 1.6], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 7, scale: [0.1, 0.1, 0.3]}]}]}
              - {id: fill_1, op: display, kind: text, text: "✦", color: "#FFF8ED", see_through: true, frame: cut1, pos: {w: 0.2}, for: 7, scale: [1, 1, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [0.5, 0.5, 1]}, {t: 1, scale: [9, 9, 1]}, {t: 3, scale: [8, 8, 1]}, {t: 6, scale: [1, 1, 1]}]}, {law: fade, at: 0, for: 6, ease: in_quad}]}
              - {id: sparks_1, op: particle_def, def: stab-spark, frame: cut1, pos: {w: 0.2}, every: 3, times: 2}
              - {id: snd_1, op: sound, sound: entity.player.attack.strong, frame: cut1, volume: 0.7, pitch: 1.1}
        - id: fall2_pick
          op: hit
          at: 48
          anchor: caster.eye
          targets: enemies
          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          ignore_invulnerability: true
          on:
            hit:
              - {id: a2_blade, op: display, kind: block, block: gray_concrete, frame: fall_a2, pos: {v: 1.8, w: -0.15}, rotate: [{axis: s, deg: -7}], for: 21, scale: [0.12, 0.25, 3.6], motion: [{law: grow, to: 0, at: 16, for: 4}]}
              - {id: a2_edge, op: display, kind: block, block: iron_block, frame: fall_a2, pos: {v: 1.8, w: -0.05}, rotate: [{axis: s, deg: -10}], for: 21, scale: [0.12, 0.05, 3.6], motion: [{law: grow, to: 0, at: 16, for: 4}]}
              - {id: a2_handle, op: display, kind: block, block: black_concrete, frame: fall_a2, pos: {v: -0.8, w: 0.2}, rotate: [{axis: s, deg: 20}], for: 21, scale: [0.12, 0.1, 1.2], motion: [{law: grow, to: 0, at: 16, for: 4}]}
              - {id: b2_blade, op: display, kind: block, block: gray_concrete, frame: fall_b2, pos: {v: 1.8, w: -0.15}, rotate: [{axis: s, deg: -7}], for: 21, scale: [0.12, 0.25, 3.6], motion: [{law: grow, to: 0, at: 16, for: 4}]}
              - {id: b2_edge, op: display, kind: block, block: iron_block, frame: fall_b2, pos: {v: 1.8, w: -0.05}, rotate: [{axis: s, deg: -10}], for: 21, scale: [0.12, 0.05, 3.6], motion: [{law: grow, to: 0, at: 16, for: 4}]}
              - {id: b2_handle, op: display, kind: block, block: black_concrete, frame: fall_b2, pos: {v: -0.8, w: 0.2}, rotate: [{axis: s, deg: 20}], for: 21, scale: [0.12, 0.1, 1.2], motion: [{law: grow, to: 0, at: 16, for: 4}]}
              - {id: flower2, op: display, kind: block, block: white_concrete, frame: fall2, rotate: [{axis: v, deg: "= 45 * i"}], for: 21, times: 4, scale: [0.08, 0.08, 0.6], motion: [{law: grow, to: 0, at: 16, for: 4}]}
        - id: sel_4
          op: hit
          at: 59
          anchor: caster.eye
          targets: enemies
          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          damage: {physical: "= dmg_physical_2"}
          ignore_invulnerability: true
          on:
            hit:
              - {id: cross_2, op: display, kind: block, block: white_concrete, frame: cut2, pos: {w: 0.15}, for: 9, times: 2, rotate: [{axis: s, deg: "= 45 - 90 * i"}], scale: [0.05, 3.3, 0.05], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 3, scale: [0.8, 1, 0.8]}, {t: 8, scale: [0.2, 1, 0.2]}]}]}
              - {id: smoke_2, op: display, kind: text, text: " ", background: "#28201C", frame: cut2, pos: {v: -0.9, w: -0.6}, for: 7, scale: [1.2, 0.8, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 6, scale: [0.3, 0.3, 1]}]}, {law: fade, at: 0, for: 6, ease: out_cubic}]}
              - {id: bloom_2, op: display, kind: text, text: " ", background: "#EAD9B0", frame: cut2, pos: {w: 0.2}, for: 6, scale: [4, 2, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 1, scale: [2, 2, 1]}, {t: 5, scale: [2.5, 2.5, 1]}]}, {law: fade, at: 1, for: 4}]}
              - {id: petal_2, op: display, kind: block, block: white_concrete, frame: cut2, pos: {w: 0.1}, for: 8, times: 4, rotate: [{axis: v, deg: "= 45 * i"}], scale: [0.05, 0.05, 1.6], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 7, scale: [0.1, 0.1, 0.3]}]}]}
              - {id: fill_2, op: display, kind: text, text: "✦", color: "#FFF8ED", see_through: true, frame: cut2, pos: {w: 0.2}, for: 7, scale: [1, 1, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [0.5, 0.5, 1]}, {t: 1, scale: [9, 9, 1]}, {t: 3, scale: [8, 8, 1]}, {t: 6, scale: [1, 1, 1]}]}, {law: fade, at: 0, for: 6, ease: in_quad}]}
              - {id: sparks_2, op: particle_def, def: stab-spark, frame: cut2, pos: {w: 0.2}, every: 3, times: 2}
              - {id: snd_2, op: sound, sound: entity.player.attack.strong, frame: cut2, volume: 0.7, pitch: 1.1}
        - id: rosette_pick
          op: hit
          at: 62
          anchor: caster.eye
          targets: enemies
          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          ignore_invulnerability: true
          on:
            hit:
              - {id: rosette, op: display, kind: block, block: pink_concrete, frame: ring, pos: {w: 1.1}, for: 11, times: 6, rotate: [{axis: s, deg: "= 30 * i"}], scale: [0.05, 0.1, 6], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [0, 0, 0]}, {t: 2, scale: [1, 1, 1]}, {t: 11, scale: [0, 0, 0]}]}]}
    end: {final: true}
