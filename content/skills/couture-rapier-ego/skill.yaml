# v3 draft (wave 2, w2-couture). Hand-ported from the v2 skill.yaml + look.yaml; per-tick values come from the v2 tracks.
# Each linear run of a v2 track channel is one law (laws sum and hold).
apiVersion: astera/v3
kind: Skill
id: couture-rapier-ego
item: couture-rapier
meta: {name: {ja: "落花の裁断", en: "Falling Cutout"}, description: {ja: "E.G.Oを使い切り、鋏で強烈な連続斬りを叩き込む。", en: "Spend the full E.G.O gauge for a heavy shearing combo."}, cooldown_ticks: 220, resource_cost: 0, ego_cost: 100}
params:
  arc_deg: {type: number, default: 45}
  reach: {type: blocks, default: 12}
  dmg_physical: {type: number, default: 75}
  dmg_physical_2: {type: number, default: 100}
machine:
  start: cast
  states:
    cast:
      for: 73
      then: end
      do:
        # v2: origin eye, yaw-only forward (R31), sector angle_deg 45 = full opening (R24), ignore_invulnerability true; trigger-only hits omit damage (R24).
        # GAP(Q1): max_count spelling (required int/`all` vs optional); best-effort `max_count: 1` kept as v2 caps each selector at 1 victim.
        - id: sel
          op: hit
          at: 18
          anchor: caster.eye
          targets: enemies
          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          ignore_invulnerability: true
          on:
            hit:
              - id: h0
                op: group
                at: 0
                do:
                  - id: fx2_couture_shears_falling
                    op: frame
                    anchor: victim
                    axes: caster
                    mode: snapshot
                    for: 21
                  - id: fx2_couture_shears_falling_1_blade_0
                    op: display
                    kind: block
                    block: gray_concrete
                    anchor: fx2_couture_shears_falling
                    offset: {left: -0.09, up: 5.80718, forward: -0.4}
                    rotate: [{axis: left, deg: 120}]
                    scale: [0.12, 0.38, 1.6]
                    for: 21
                    motion:
                      - {law: move, velocity: {left: 0, up: -0.4625, forward: 0}, at: 0, for: 8}
                      - {law: move, velocity: {left: 0, up: -0.035563, forward: 0.124027}, at: 8, for: 3}
                      - {law: spin, axis: left, deg_per_tick: -9.33333, at: 8, for: 1}
                      - {law: spin, axis: left, deg_per_tick: -9.33334, at: 9, for: 1}
                      - {law: spin, axis: left, deg_per_tick: -9.33333, at: 10, for: 1}
