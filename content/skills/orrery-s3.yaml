# Persona weapon #9 (orrery-staff), S3 / sneak + right-click: Beam Litany.
# Beat sheet (ticks): 0 standing clock seal draws on in front of the caster, the orb swells at the staff tip
# and ornament motes spiral up (the 16-tick telegraph: a big hit is readable) -> 16 the beam fires through
# the seal (recoil nudge, shake) and burns ~26t; a 4-tick damage pulse pierces everything in the line, each
# pulse with a ring on every target -> 38 closing burst: impact frame, knockback; the Charge bank is spent.
# Damage per pulse: 2 + 0.2 per Charge (read, not consumed); burst: 4 + 0.5 per Charge (consumed).
# The lock: the line is the cast-time aim (vfx and cone both use the cast pose), so positioning decides it.

id: orrery-s3

name:
  ja: "天球の連禱"
  en: "Orrery Beam Litany"
description:
  ja: "前方に巨大な時計の封印を描き、宝珠から金の光線を放つ。貫通し、溜めた「充填」の数だけ威力が増して、最後に使い切る。"
  en: "Draws a huge clock seal and fires a piercing gold beam from the orb. Banked Charge adds power and is spent by the closing burst."

archetype: sequence
cooldown_ticks: 300
resource_cost: 50              # energy
tags: [ ranged, fire, persona, orrery, charge, finisher, pierce ]

params:
  type: sequence

phases:
  type: sequence
  cast:
    # 0: telegraph -- seal, orb, motes
    - type: play_sound
      targets: { type: caster }
      sound_id: block.beacon.activate
      volume: { type: literal, value: 0.9 }
      pitch: { type: literal, value: 0.7 }
    - type: play_vfx
      targets: { type: caster }
      vfx_id: orrery-seal-front
    - type: play_vfx
      targets: { type: caster }
      vfx_id: orrery-orb
    - type: play_vfx
      targets: { type: caster }
      vfx_id: orrery-motes
    - type: play_sound
      targets: { type: caster }
      sound_id: block.amethyst_block.resonate
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 0.8 }
      delay_ticks: { type: literal, value: 8 }
    # 16: fire
    - type: play_vfx
      targets: { type: caster }
      vfx_id: orrery-beam
      delay_ticks: { type: literal, value: 16 }
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.blaze.shoot
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 0.6 }
      delay_ticks: { type: literal, value: 16 }
    - type: play_sound
      targets: { type: caster }
      sound_id: block.beacon.power_select
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 1.6 }
      delay_ticks: { type: literal, value: 16 }
    - type: propel
      targets: { type: caster }
      direction: { type: from_caster }
      strength: { type: literal, value: -0.25 }
      delay_ticks: { type: literal, value: 16 }
    - type: camera_shake
      targets: { type: caster }
      intensity: { type: literal, value: 0.25 }
      ticks: { type: literal, value: 6 }
      delay_ticks: { type: literal, value: 16 }
    # 16..36: damage pulse every 4t on everything in the line
    - type: damage
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 10.0 }, distance: { type: literal, value: 22.0 } }
      ignore_invulnerability: { type: literal, value: true }
      delay_ticks: { type: literal, value: 16 }
      period_ticks: { type: literal, value: 4 }
      duration_ticks: { type: literal, value: 22 }
      components:
        - base: { type: literal, value: 2.0 }
          attribute: fire
          per_stack: { status_id: charge, amount: 0.2, on: caster, consume: false }
    - type: play_vfx
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 10.0 }, distance: { type: literal, value: 22.0 } }
      vfx_id: orrery-ring-pulse
      delay_ticks: { type: literal, value: 16 }
      period_ticks: { type: literal, value: 4 }
      duration_ticks: { type: literal, value: 22 }
    # 38: closing burst, spends the bank
    - type: damage
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 10.0 }, distance: { type: literal, value: 22.0 } }
      ignore_invulnerability: { type: literal, value: true }
      delay_ticks: { type: literal, value: 38 }
      components:
        - base: { type: literal, value: 4.0 }
          attribute: fire
          per_stack: { status_id: charge, amount: 0.5, on: caster, consume: true }
    - type: play_vfx
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 10.0 }, distance: { type: literal, value: 22.0 } }
      vfx_id: orrery-flash
      scale: { type: literal, value: 1.5 }
      delay_ticks: { type: literal, value: 38 }
    - type: knockback
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 10.0 }, distance: { type: literal, value: 22.0 } }
      direction: { type: from_caster }
      strength: { type: literal, value: 1.0 }
      delay_ticks: { type: literal, value: 39 }
    - type: camera_shake
      targets: { type: cone, from: { type: caster }, direction: { type: from_caster }, angle_degrees: { type: literal, value: 10.0 }, distance: { type: literal, value: 22.0 } }
      intensity: { type: literal, value: 0.7 }
      ticks: { type: literal, value: 10 }
      delay_ticks: { type: literal, value: 38 }
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.generic.explode
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 1.3 }
      delay_ticks: { type: literal, value: 38 }
    - type: remove_status
      targets: { type: caster }
      status_id: charge
      delay_ticks: { type: literal, value: 40 }
