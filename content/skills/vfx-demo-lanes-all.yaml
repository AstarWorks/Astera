# Audience demo (all): plays content/vfx/demo-lanes.yaml for viewers: all. Not bound to any item.

id: vfx-demo-lanes-all

name:
  ja: "デモ・レーン (all)"
  en: "Demo Lanes (all)"
description:
  ja: "レーン別の表示エンティティを viewers=all で再生するデモ。"
  en: "Plays one display per VFX lane with viewers=all."

archetype: sequence
cooldown_ticks: 20
tags: [ demo, vfx ]

params:
  type: sequence

phases:
  type: sequence
  cast:
    - type: play_vfx
      targets: { type: caster }
      vfx_id: demo-lanes
      viewers: all
