# iron-blade-slash: high-right to low-left diagonal cut of the iron blade (wind-up 3 ticks, hit at tick 3).
# Frames (ADR-0314, ADR-0315), the gameplay (hit tick, shape, damage, knockback, cooldown, cast length) is unchanged:
#   arm    - the right arm, rotate keys only. Origin = the right shoulder (`caster.shoulder_r`); the arm is one rigid 0.60 bone, so the hand travels on a sphere about it and a turn of this frame is that travel (about w left/right, about s up/down). Hand path: guard -> cocked high at the right -> down across to the left -> guard.
#   blade  - the iron blade. Origin = the hand, 0.60 along the arm frame (the hand path is the arm's turn: guard -> raised high at the right -> down across to the left -> guard). Long axis along v (grip at the
#            origin, tip at v 0.92), edge along w. Roll -135 about v lays the edge on the descending diagonal, then the cut is a turn about s (v moves towards w):
#            the edge leads. The wind-up tips the point to the right (-55), the cut carries it to the left (+85, hit at tick 3), `reset` eases back.
#            The engine pins the right hand to the origin; the origin sits exactly on the 0.60 reach sphere of the shoulder by construction.
#   body   - the caster's feet, v forward / w up / s right: the sounds. (The sweep arc sprite `fx` sits on frame `arc` (origin = the hand, a fixed cut plane, so it does not turn with the blade): a flat crescent centred on the hand, in a fixed horizontal cut plane, twice the blade length so its rim is at the blade tip: it shows the path the edge travels.)
#   wound  - one per victim at the victim's centre, v the way the blow came in: the hit sound and the hit spark.
#   edge   - line along the blade from part-way to the tip (v 0.56 .. 0.92), what the trail rows draw along.
apiVersion: astera/v3
kind: Skill
id: iron-blade-slash
item: iron-blade
meta:
  name: {ja: "鉄の斬撃", en: "Iron Slash"}
  description: {ja: "前方を斬りつける。", en: "A clean forward slash."}
  cooldown_ticks: 10
  resource_cost: 6
  tags: [melee, physical]
params:
  arc_deg:      {type: number, default: 90}
  range:        {type: blocks, default: 3.4}
  dmg_physical: {type: number, default: 36.0}
  knockback:    {type: number, default: 0.4}
frames:
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: w, to: -9}   # guard
      - {at: 0, for: 2, about: w, to: -73, ease: in_out_sine}   # cock the blade high at the right
      - {at: 2, for: 3, about: w, to: 44, ease: out_cubic}   # the cut: across to the left and down
      - {at: 5, for: 7, about: w, to: -9, ease: in_out_sine}   # back to guard
      - {at: 0, for: 0, about: s, to: -41}
      - {at: 0, for: 2, about: s, to: 15, ease: in_out_sine}
      - {at: 2, for: 3, about: s, to: -48, ease: out_cubic}
      - {at: 5, for: 7, about: s, to: -41, ease: in_out_sine}
  - id: blade
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: v, to: -135}  # roll the edge into the cut plane
      - {at: 0, for: 2, about: s, to: -55, ease: in_out_sine}  # wind-up turn
      - {at: 2, for: 3, about: s, to: 85, ease: out_cubic}  # the cut, edge first
      - {at: 5, for: 7, reset: true, ease: in_out_sine}
  - id: arc
    origin: {frame: blade}
    v: forward
    w: left
    s: v x w
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: wound
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    w_fallback: [1, 0, 0]
    s: v x w
lines:
  edge: {frame: blade, from: {v: 0.56}, to: {v: 0.92}}
machine:
  start: windup
  tail: 9
  states:
    windup:
      for: 3
      then: strike
      do:
        - {id: rig, op: rig, frame: blade, for: 12, detach: true}
    strike:
      for: 1
      then: end
      enter:
        - id: swing
          op: hit
          anchor: caster.eye
          at: 0
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          max_count: all
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: "${knockback}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", frame: wound, volume: 0.7, pitch: 1.2, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, frame: wound, pos: {w: 0.2}, detach: true}
        - {id: snd_swing, op: sound, sound: "astera:weapons/sword-swing", frame: body, volume: 1.0, pitch: 1.0, at: 0, detach: true}
        - {id: fx_swing, op: display, at: 0, for: 3, kind: sprite, sprite: slash, size: [1.84, 1.84], frame: arc, plane: [v, w], see_through: true, brightness: {block: 15, sky: 15}, detach: true}  # the sweep arc: a flat crescent on the fixed cut plane `arc`, rim at the blade tip, over the cut ticks
        - {id: trail_fx, op: particle, particle: crit, along: edge, samples: 2, count: 1, extra: 0.04, at: 0, every: 1, for: 4, detach: true}
    end: {final: true}
