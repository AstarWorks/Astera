# iron-blade-slash: high-right to low-left diagonal cut of the iron blade (wind-up 3 ticks, hit at tick 3).
# Frames (ADR-0314, ADR-0315), the gameplay (hit tick, shape, damage, knockback, cooldown, cast length) is unchanged:
#   blade  - the iron blade. Origin at the caster feet, moved along a hand path (guard -> raised high at the right -> down across to the left -> guard). Long axis along v (grip at the
#            origin, tip at v 0.92), edge along w. Roll -135 about v lays the edge on the descending diagonal, then the cut is a turn about s (v moves towards w):
#            the edge leads. The wind-up tips the point to the right (-55), the cut carries it to the left (+85, hit at tick 3), `reset` eases back.
#            The engine pins the right hand to the origin, so every `move:` point lies inside the 0.60 reach of the right shoulder (v 0 / w 1.29 / s 0.29).
#   body   - the caster's feet, v forward / w up / s right: sounds and the cast fx.
#   wound  - one per victim at the victim's centre, v the way the blow came in: the hit sound and the hit spark.
#   edge   - line along the blade from part-way to the tip (v 0.56 .. 0.92), what the trail rows draw along.
apiVersion: astera/v3
kind: Skill
id: iron-blade-slash
item: iron-blade
meta:
  name: {ja: "鉄の斬撃", en: "Iron Slash"}
  description: {ja: "前方を斬りつける。", en: "A clean forward slash."}
  cooldown_ticks: 10
  resource_cost: 6
  tags: [melee, physical]
params:
  arc_deg:      {type: number, default: 90}
  range:        {type: blocks, default: 3.4}
  dmg_physical: {type: number, default: 36.0}
  knockback:    {type: number, default: 0.4}
frames:
  - id: blade
    origin: caster
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: 0.45, w: 0.9, s: 0.36}}  # guard
      - {at: 0, for: 1, to: {v: 0.4, w: 1.17, s: 0.73}}
      - {at: 1, for: 1, to: {v: 0.16, w: 1.51, s: 0.83}}
      - {at: 2, for: 1, to: {v: 0.43, w: 0.88, s: 0.25}}
      - {at: 3, for: 1, to: {v: 0.3, w: 0.84, s: 0.03}}
      - {at: 4, for: 1, to: {v: 0.29, w: 0.84, s: 0.01}}
      - {at: 5, for: 1, to: {v: 0.3, w: 0.84, s: 0.03}}
      - {at: 6, for: 1, to: {v: 0.31, w: 0.82, s: 0.07}}
      - {at: 7, for: 1, to: {v: 0.37, w: 0.84, s: 0.15}}
      - {at: 8, for: 1, to: {v: 0.41, w: 0.85, s: 0.25}}
      - {at: 9, for: 1, to: {v: 0.44, w: 0.88, s: 0.29}}
      - {at: 10, for: 1, to: {v: 0.45, w: 0.9, s: 0.35}}
      - {at: 11, for: 1, to: {v: 0.45, w: 0.9, s: 0.36}}
    rotate:
      - {at: 0, for: 0, about: v, to: -135}  # roll the edge into the cut plane
      - {at: 0, for: 2, about: s, to: -55, ease: in_out_sine}  # wind-up turn
      - {at: 2, for: 3, about: s, to: 85, ease: out_cubic}  # the cut, edge first
      - {at: 5, for: 7, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: wound
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
lines:
  edge: {frame: blade, from: {v: 0.56}, to: {v: 0.92}}
machine:
  start: windup
  tail: 9
  states:
    windup:
      for: 3
      then: strike
      do:
        - {id: rig, op: rig, frame: blade, for: 12, detach: true}
    strike:
      for: 1
      then: end
      enter:
        - id: swing
          op: hit
          anchor: caster.eye
          at: 0
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          max_count: all
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: "${knockback}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", frame: wound, volume: 0.7, pitch: 1.2, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, frame: wound, pos: {w: 0.2}, detach: true}
        - {id: snd_swing, op: sound, sound: "astera:weapons/sword-swing", frame: body, volume: 1.0, pitch: 1.0, at: 0, detach: true}
        - {id: fx_swing, op: particle_def, def: slash-sweep, frame: body, pos: {v: 1.4, w: 1.42}, at: 0, detach: true}
        - {id: trail_fx, op: particle, particle: crit, along: edge, samples: 2, count: 1, extra: 0.04, at: 0, every: 1, for: 4, detach: true}
    end: {final: true}
