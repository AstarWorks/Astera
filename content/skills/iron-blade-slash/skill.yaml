# Wave 2 v3 draft (basic-ac): ported 1:1 from the v2 skill.yaml + look.yaml. GAP comments mark what v3 cannot spell yet.
apiVersion: astera/v3
kind: Skill
id: iron-blade-slash
item: iron-blade
meta:
  name: {ja: "鉄の斬撃", en: "Iron Slash"}
  description: {ja: "前方を斬りつける。", en: "A clean forward slash."}
  cooldown_ticks: 10
  resource_cost: 6
  tags: [melee, physical]
params:
  arc_deg: {type: number, default: 90}
  range: {type: blocks, default: 3.4}
  dmg_physical: {type: number, default: 36.0}
anchors:
  - {id: eye, anchor: caster.eye}
  - {id: sweep, anchor: caster.eye, offset: {up: -0.2, forward: 1.4}, mode: snapshot}   # was pt_aim_0_m0p2_1p4
  - {id: heart, anchor: victim.body, offset: {up: 0.4}}                              # was pt_enemy_0_1p2_0
machine:
  start: swing
  states:
    swing:
      for: 1
      then: end
      enter:
        - {id: snd_swing, op: sound, sound: "astera:weapons/sword-swing", anchor: caster, volume: 1.0, pitch: 1.0}
        - {id: fx_swing, op: particle_def, def: slash-sweep, anchor: sweep}
        - {id: swing, op: hit, anchor: eye, at: 0, shape: {sector: {deg: "= arc_deg", range: "= range", height: 2.0}}, targets: enemies, damage: {physical: "= dmg_physical"}}
      on:
        - event: swing
          do:
            - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: heart, volume: 0.7, pitch: 1.2}
            - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
    end: {final: true}
