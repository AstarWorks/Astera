# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: revolver-fan

name:
  ja: "ファニング"
  en: "Fan the Hammer"
description:
  ja: "至近距離へ素早く連射する。"
  en: "Rapid close-range fire."

archetype: melee
cooldown_ticks: 90
resource_cost: 10
tags: [ ranged, gun, burst ]

params:
  type: melee
  range: 5.0
  arc_degrees: 60.0
  knockback: 0.5
  damage:
    - base: { type: literal, value: 42.0 }
      attribute: physical

phases:
  type: melee
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/gun-shot
      volume: { type: literal, value: 0.9 }
      pitch: { type: literal, value: 1.1 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.1, height: -0.25 }
      particle_id: shotgun-muzzle
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/blade-hit
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
  miss: []
