# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: poison-cloud

name:
  ja: "毒霧の瓶"
  en: "Poison Cloud"
description:
  ja: "着弾点に毒の霧を広げる。"
  en: "Bursts into a lingering poison cloud."

archetype: projectile
cooldown_ticks: 160
resource_cost: 16
tags: [ ranged, poison, magic, zone ]

params:
  type: projectile
  launch_speed: 1.3
  max_lifetime_ticks: 50
  visual:
    trail_spacing: 0.4
    trail:
      - type: point
        particles:
          - { id: happy_villager, offset: { x: 0.04, y: 0.04, z: 0.04 } }
          - { id: dust, color: { r: 90, g: 170, b: 60 }, scale: 1.0 }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: entity.splash_potion.throw
      volume: { type: literal, value: 0.9 }
      pitch: { type: literal, value: 0.9 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 0.9, height: -0.25 }
      particle_id: verdant-cast
  hit_entity:
    - type: apply_status
      targets: { type: enemies, center: { type: target }, radius: { type: literal, value: 3.5 } }
      status_id: poison
      effect_duration_ticks: { type: literal, value: 80 }
    - type: schedule_particle_animation
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 0.15, z: 0.0 } } }
      animation:
        - type: ring
          period_ticks: 8
          points: 16
          start_radius: 0.4
          end_radius: 3.5
          particles:
            - { id: happy_villager, count: 0, extra: 0.02 }
            - { id: dust, color: { r: 90, g: 170, b: 60 }, scale: 1.4 }
    - type: play_sound
      targets: { type: target }
      sound_id: entity.splash_potion.break
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 0.8 }
  hit_block:
    - type: apply_status
      targets: { type: enemies, center: { type: hit_location }, radius: { type: literal, value: 3.5 } }
      status_id: poison
      effect_duration_ticks: { type: literal, value: 80 }
    - type: schedule_particle_animation
      targets: { type: hit_location }
      animation:
        - type: ring
          period_ticks: 8
          points: 16
          start_radius: 0.4
          end_radius: 3.5
          particles:
            - { id: happy_villager, count: 0, extra: 0.02 }
            - { id: dust, color: { r: 90, g: 170, b: 60 }, scale: 1.4 }
    - type: play_sound
      targets: { type: hit_location }
      sound_id: entity.splash_potion.break
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 0.8 }
  miss: []
  expire: []
