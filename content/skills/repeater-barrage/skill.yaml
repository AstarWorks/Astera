# repeater-barrage: one heavy bolt. The state lasts exactly the flight (life) and also ends on the body end.
apiVersion: astera/v3
kind: Skill
id: repeater-barrage
item: repeater-crossbow
meta:
  name: {ja: "重ボルト", en: "Heavy Bolt"}
  description: {ja: "重いボルトを強く撃ち込む。", en: "One heavy, hard-hitting bolt."}
  cooldown_ticks: 100
  resource_cost: 8
  tags: [ranged, physical]
params:
  dmg:   {type: number, default: 26}
  speed: {type: number, default: 3.4}
  life:  {type: ticks, default: 40}
anchors:
  - {id: start,  anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: muzzle, anchor: caster.eye, offset: {up: -0.25, forward: 0.9}, mode: snapshot}
  - {id: heart,  anchor: victim.center, mode: follow}
machine:
  start: fire
  tail: 2
  states:
    fire:
      for: 40
      then: end
      on:
        - {event: bolt.end, to: end}
      enter:
        - {id: snd, op: sound, sound: "item.crossbow.shoot", anchor: caster, volume: 0.9, pitch: 0.8}
        - {id: fl0, op: particle_def, def: gun-muzzle-flash, anchor: muzzle}
      do:
        - id: bolt
          op: projectile
          origin: start
          velocity: "= look(caster) * ${speed}"
          for: "${life}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg}"}}
              - {id: snd_hit, op: sound, sound: "astera:weapons/gun-impact", anchor: contact, volume: 0.8, pitch: 0.9, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart, detach: true}
            block:
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact, volume: 0.5, pitch: 1.5, detach: true}
              - {id: fx_blk0, op: particle_def, def: hit-spark, anchor: contact, detach: true}
        # the visible round, riding the body
        - {id: slug, op: display, kind: item, item: "minecraft:arrow", context: fixed, anchor: bolt, scale: [0.8, 0.8, 0.8], at: 0, until: bolt.end}
        - {id: trail0, op: particle, particle: crit, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.05, 0.05, 0.05], at: 0, every: 1, until: bolt.end}
        - {id: trail1, op: particle, particle: smoke, anchor: {of: bolt, sweep: 0.4}, count: 1, offset: [0.03, 0.03, 0.03], at: 0, every: 1, until: bolt.end}
    end: {final: true}
