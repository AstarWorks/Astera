# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: cleaver-chop

name:
  ja: "大鉈の一撃"
  en: "Cleaver Chop"
description:
  ja: "重い一撃を叩き込む。"
  en: "A heavy chop."

archetype: melee
cooldown_ticks: 30
resource_cost: 14
tags: [ melee, physical ]

params:
  type: melee
  range: 2.8
  arc_degrees: 90.0
  knockback: 0.5
  damage:
    - base: { type: literal, value: 62.0 }
      attribute: physical

phases:
  type: melee
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/blade-heavy-swing
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 0.8 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.3, height: -0.1 }
      particle_id: slash-sweep
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/blade-hit
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
    - type: apply_status
      targets: { type: target }
      status_id: bleed
      effect_duration_ticks: { type: literal, value: 60 }
      chance: { type: literal, value: 0.5 }
  miss: []
