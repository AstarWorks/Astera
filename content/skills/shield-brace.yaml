# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: shield-brace

name:
  ja: "防御姿勢"
  en: "Brace"
description:
  ja: "構えを固め、しばらく踏ん張る。"
  en: "Plants your feet and braces for a while."

archetype: buff
cooldown_ticks: 180
resource_cost: 0
tags: [ support, defense ]

params:
  type: buff
  status_effect_id: poise
  duration_ticks: 160

phases:
  type: buff
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: item.shield.block
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 1.0, z: 0.0 } } }
      particle_id: hit-spark
  expire: []
  removed: []
