# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: repeater-barrage

name:
  ja: "重ボルト"
  en: "Heavy Bolt"
description:
  ja: "重いボルトを強く撃ち込む。"
  en: "One heavy, hard-hitting bolt."

archetype: projectile
cooldown_ticks: 100
resource_cost: 8
tags: [ ranged, physical ]

params:
  type: projectile
  launch_speed: 3.4
  max_lifetime_ticks: 40
  visual:
    trail_spacing: 0.4
    trail:
      - type: point
        particles:
          - { id: crit, offset: { x: 0.05, y: 0.05, z: 0.05 } }
          - { id: smoke, offset: { x: 0.03, y: 0.03, z: 0.03 } }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: item.crossbow.shoot
      volume: { type: literal, value: 0.9 }
      pitch: { type: literal, value: 0.8 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 0.9, height: -0.25 }
      particle_id: gun-muzzle-flash
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 26 }
          attribute: physical
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/gun-impact
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 0.9 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
  hit_block:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: astera:weapons/gun-impact-block
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.5 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: hit-spark
  miss: []
  expire: []
