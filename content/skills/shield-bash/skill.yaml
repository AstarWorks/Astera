# shield-bash: wind-up 4 ticks (rule round(5 / attack_speed)), hit at tick 4. Rig: the shield model astera:shield-bulwark (content/models/items/shield-bulwark.model.json, frame table content/frames/shield-bulwark.yaml; the held item stays the vanilla SHIELD so blocking keeps working). The shield is drawn back over 3 ticks (top toward the caster), shoved forward so it reaches the target zone at the hit (tick 4), then eased back; long = up, edge = -X, outer face forward.
apiVersion: astera/v3
kind: Skill
id: shield-bash
item: shield-bulwark
meta:
  name: {ja: "シールドバッシュ", en: "Shield Bash"}
  description: {ja: "盾で殴り、相手を弾き飛ばす。", en: "Bashes with the shield and shoves the target back."}
  cooldown_ticks: 50
  resource_cost: 8
  tags: [melee, control, physical]
params:
  arc_deg:      {type: number, default: 70}
  range:        {type: blocks, default: 2.6}
  dmg_physical: {type: number, default: 18}
  knockback:    {type: number, default: 1.3}
  tremor_ticks: {type: ticks, default: 40}
anchors:
  - {id: eye,   anchor: caster.eye, mode: follow}
  - {id: front, anchor: caster, offset: {forward: 1.3}, mode: follow}
  - {id: heart, anchor: victim.center, mode: follow}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 4
      then: strike
      do:
        - {id: snd_windup, op: sound, sound: item.armor.equip_iron, anchor: caster, volume: 0.6, pitch: 0.7}
        - {id: charge, op: particle, particle: crit, anchor: front, count: 2, extra: 0.1, every: 2, for: 4}
        - id: rig
          op: rig
          parent: caster
          mount: caster.hand_r
          detach: true
          for: 10
          swing:
            - {at: 0, for: 3, from: {left: 0.000, up: 0.960, forward: 0.280}, to: {left: 0.000, up: 0.930, forward: -0.370}, edge: leading, roll: 0, ease: out_quad}
            - {at: 3, for: 2, to: {left: 0.000, up: 0.900, forward: 0.440}, edge: trailing, roll: 0, ease: out_cubic}
            - {at: 5, for: 5, to: {left: 0.000, up: 0.970, forward: 0.220}, edge: leading, roll: 0, ease: out_cubic}
    strike:
      for: 1
      then: end
      do:
        - id: swing
          op: hit
          at: 0
          anchor: eye
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: react, op: react, target: event.victim, flinch: true, for: 6}
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: "${knockback}"}
              - {id: st_tremor, op: status, target: event.victim, status: tremor, stacks: 1, for: "${tremor_ticks}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.2, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart, detach: true}
        - {id: snd, op: sound, sound: item.shield.block, anchor: caster, volume: 1.0, pitch: 0.9, detach: true}
        - {id: fx, op: particle_def, def: hit-spark, anchor: front, detach: true}
    end: {final: true}
