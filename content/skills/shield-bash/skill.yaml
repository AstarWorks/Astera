# shield-bash: shield bash: the shield drawn back, shoved forward at the hit (wind-up 4 ticks, hit at tick 4).
# Frames (ADR-0314, ADR-0315), the gameplay (hit tick, shape, damage, knockback, cooldown, cast length) is unchanged:
#   blade  - the shield-bulwark (the held item stays the vanilla SHIELD so blocking keeps working). This frame is turned to the shield model: v UP (the long axis of the model), w RIGHT (its edge),
#            s = v x w = FORWARD (the outer face). So the `move:` coefficients read up / right / forward from the feet. The bash is the hand `move:` along s: drawn back over three ticks, shoved
#            forward so the face reaches the target zone at the hit (tick 4), eased back; the turn about w tips the top toward the caster while drawing back and ahead on the shove.
#            The engine pins the right hand to the origin, so every `move:` point lies inside the 0.60 reach of the right shoulder (v 0 / w 1.29 / s 0.29).
#   body   - the caster's feet, v forward / w up / s right: sounds and the cast fx.
#   wound  - one per victim at the victim's centre, v the way the blow came in: the hit sound and the hit spark.
apiVersion: astera/v3
kind: Skill
id: shield-bash
item: shield-bulwark
meta:
  name: {ja: "シールドバッシュ", en: "Shield Bash"}
  description: {ja: "盾で殴り、相手を弾き飛ばす。", en: "Bashes with the shield and shoves the target back."}
  cooldown_ticks: 50
  resource_cost: 8
  tags: [melee, control, physical]
params:
  arc_deg:      {type: number, default: 70}
  range:        {type: blocks, default: 2.6}
  dmg_physical: {type: number, default: 18}
  knockback:    {type: number, default: 1.3}
  tremor_ticks: {type: ticks, default: 40}
frames:
  - id: shield
    origin: caster
    v: up
    w: right
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: 0.88, w: 0.38, s: 0.43}}  # guard
      - {at: 0, for: 1, to: {v: 0.83, w: 0.3, s: 0.38}}
      - {at: 1, for: 1, to: {v: 0.8, w: 0.23, s: 0.34}}
      - {at: 2, for: 1, to: {v: 0.79, w: 0.21, s: 0.31}}
      - {at: 3, for: 1, to: {v: 1.05, w: 0.29, s: 0.55}}
      - {at: 4, for: 1, to: {v: 1.08, w: 0.3, s: 0.56}}
      - {at: 5, for: 1, to: {v: 1.06, w: 0.31, s: 0.55}}
      - {at: 6, for: 1, to: {v: 1.01, w: 0.32, s: 0.53}}
      - {at: 7, for: 1, to: {v: 0.95, w: 0.35, s: 0.49}}
      - {at: 8, for: 1, to: {v: 0.9, w: 0.37, s: 0.45}}
      - {at: 9, for: 1, to: {v: 0.88, w: 0.38, s: 0.43}}
    rotate:
      - {at: 0, for: 3, about: w, to: 20, ease: out_quad}                       # top toward the caster while drawing back
      - {at: 3, for: 2, about: w, to: -8, ease: out_cubic}                      # top leans ahead on the shove
      - {at: 5, for: 5, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: wound
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 4
      then: strike
      do:
        - {id: snd_windup, op: sound, sound: item.armor.equip_iron, frame: body, volume: 0.6, pitch: 0.7}
        - {id: charge, op: particle, particle: crit, frame: body, pos: {v: 1.3}, count: 2, extra: 0.1, every: 2, for: 4}
        - {id: rig, op: rig, frame: shield, for: 10, detach: true}
    strike:
      for: 1
      then: end
      do:
        - id: swing
          op: hit
          at: 0
          frame: shield
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: react, op: react, target: event.victim, flinch: true, for: 6}
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: "${knockback}"}
              - {id: st_tremor, op: status, target: event.victim, status: tremor, stacks: 1, for: "${tremor_ticks}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", frame: wound, volume: 0.7, pitch: 1.2, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, frame: wound, pos: {w: 0.2}, detach: true}
        - {id: snd, op: sound, sound: item.shield.block, frame: body, volume: 1.0, pitch: 0.9, detach: true}
        - {id: fx, op: particle_def, def: hit-spark, frame: body, pos: {v: 1.3}, detach: true}
    end: {final: true}
