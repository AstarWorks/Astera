# astera/v3 hand port of the v2 skill.yaml + look.yaml (tick for tick).
apiVersion: astera/v3
kind: Skill
id: shield-bash
item: shield-bulwark
meta:
  name: {ja: "シールドバッシュ", en: "Shield Bash"}
  description: {ja: "盾で殴り、相手を弾き飛ばす。", en: "Bashes with the shield and shoves the target back."}
  cooldown_ticks: 50
  resource_cost: 8
  tags: [melee, control, physical]
anchors:
  - {id: eye,   anchor: caster.eye}
  - {id: front, anchor: caster, offset: {forward: 1.3}}   # was pt_aim_0_0_1p3
  - {id: heart, anchor: victim.root, offset: {up: 1.2}}   # was pt_enemy_0_1p2_0 (v2 enemy frame = victim feet)
machine:
  start: cast
  states:
    cast:
      for: 1
      then: end
      do:
        - {id: snd, op: sound, sound: item.shield.block, anchor: caster, volume: 1.0, pitch: 0.9}
        - {id: fx, op: particle_def, def: hit-spark, anchor: front}
        - id: swing
          op: hit
          at: 0
          anchor: eye
          shape: {sector: {deg: 70.0, range: 2.6, height: 2.0, forward: look}}
          targets: enemies
          # GAP(Q1): v2 has no cap (unlimited, nearest-first); spelling A `max_count: all`, B omitted
          window: once
          ignore_invulnerability: false
          damage: {physical: 18.0}
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: 1.3}
              - {id: st_tremor, op: status, target: event.victim, status: tremor, stacks: 1, for: 40}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.2}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
    end: {final: true}
