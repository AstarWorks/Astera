                  - {id: a3_handle, op: display, kind: block, block: black_concrete, frame: hinge_a3, pos: {v: -0.8, w: 0.2}, rotate: [{axis: s, deg: 20}], for: 14, scale: [0.12, 0.1, 0.6], motion: [{law: grow, to: 0, at: 10, for: 3}]}
