                  - {id: a2_edge, op: display, kind: block, block: iron_block, frame: hinge_a2, pos: {v: 0.9, w: -0.05}, rotate: [{axis: s, deg: -10}], for: 14, scale: [0.12, 0.05, 1.8], motion: [{law: grow, to: 0, at: 10, for: 3}]}
                  - {id: a2_handle, op: display, kind: block, block: black_concrete, frame: hinge_a2, pos: {v: -0.8, w: 0.2}, rotate: [{axis: s, deg: 20}], for: 14, scale: [0.12, 0.1, 0.6], motion: [{law: grow, to: 0, at: 10, for: 3}]}
                  - {id: b2_blade, op: display, kind: block, block: gray_concrete, frame: hinge_b2, pos: {v: 0.9, w: -0.15}, rotate: [{axis: s, deg: -7}], for: 14, scale: [0.12, 0.25, 1.8], motion: [{law: grow, to: 0, at: 10, for: 3}]}
                  - {id: b2_edge, op: display, kind: block, block: iron_block, frame: hinge_b2, pos: {v: 0.9, w: -0.05}, rotate: [{axis: s, deg: -10}], for: 14, scale: [0.12, 0.05, 1.8], motion: [{law: grow, to: 0, at: 10, for: 3}]}
                  - {id: b2_handle, op: display, kind: block, block: black_concrete, frame: hinge_b2, pos: {v: -0.8, w: 0.2}, rotate: [{axis: s, deg: 20}], for: 14, scale: [0.12, 0.1, 0.6], motion: [{law: grow, to: 0, at: 10, for: 3}]}
                  - {id: flower2, op: display, kind: block, block: white_concrete, frame: pivot2, rotate: [{axis: v, deg: "= 45 * i"}], for: 14, times: 4, scale: [0.08, 0.08, 0.6], motion: [{law: grow, to: 0, at: 10, for: 3}]}
        - id: sel_5
          op: hit
          at: 46
          anchor: caster.eye
          targets: enemies
