# Floral Closure (couture rapier S3) in the frame grammar (ADR-0314): three cuts of the shears. A cut is a sector hit; its contact fx are points of
# frames, so `left` / `up` / `forward` are not written. A caster frame has v = forward, w = up, s = v x w (to the right).
#   body          - the caster's feet. Both crescents of 12 white blades (ticks 28 and 43), the overhead glass arc (58) and the ten black
#                   threads on the ring at the feet (89) are points of it, each blade rotated in its own plane about w / s / v.
#   blade         - the rapier in the hand: origin at the arm tip (0.6 along the arm frame v), long axis along v. Its `move` lifts the
#                   hand to wind up and drops it into each cut; its `rotate` about s IS the cut (tip up 55 / 75 degrees, then down through -35 / -45),
#                   one beat per blow, timed so the hit tick (24, 40, 107) falls mid-cut. The engine pins the right hand to this origin.
#   pivotN        - one per blow N (shears at ticks 24, 40, 107): the victim's feet, v the caster's forward. It is the point the flower sits on:
#                   the pair of shears drops in from 3 behind and 2.5 above and settles 0.7 behind and 1.1 above in 3 ticks.
#   hinge_aN/_bN  - the two scissor halves of blow N, 0.05 either side of the pivot; they ride the same drop. The `rotate` keys about s ARE
#                   the snip: half A closes through -25, 5, -10 degrees, half B opens the other way (39, 9, -6), so the two cross and
#                   shut like shears. Blades, edges and handles lie in the v-w plane.
#   cutN          - the victim's centre, v the way the blow came in: cross, four shards, bloom, eight petals, fill and sparks of the cut that lands
#                   (ticks 30, 46, 113). Its scale key is the burst: it opens from 0.1 to 1 over 7 ticks (out_cubic), so every shard and petal,
#                   placed at its final radius, flies out and slows. One frame per blow because a per-victim frame's keys run from its first use.
#   ring          - the victim's feet: the 15 pink blades of the rosette (tick 127) close around the head at 2.6 and collapse.
# Gameplay (every hit tick, window, damage, cast length 138) is unchanged.
apiVersion: astera/v3
kind: Skill
id: couture-rapier-s3
item: couture-rapier
meta: {name: {ja: "花鋏の終縫", en: "Floral Closure"}, description: {ja: "鋏で三度切りつける仕上げの大技。", en: "A three-cut finisher with the shears."}, cooldown_ticks: 180, resource_cost: 25}
params:
  arc_deg: {type: number, default: 45}
  reach: {type: blocks, default: 12}
  dmg_physical: {type: number, default: 35}
  dmg_physical_2: {type: number, default: 70}
frames:
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  # arm: the right arm. Origin = the right shoulder, rotate keys only; the hand is 0.6 along its v, so it can never leave arm reach.
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: w, to: -70}
      - {at: 14, for: 8, about: s, to: 10, ease: out_quad}
      - {at: 22, for: 4, about: s, to: -20, ease: in_quad}
      - {at: 26, for: 8, about: s, to: 0}
      - {at: 32, for: 6, about: s, to: 10, ease: out_quad}
      - {at: 38, for: 4, about: s, to: -20, ease: in_quad}
      - {at: 44, for: 8, about: s, to: 0}
      - {at: 96, for: 9, about: s, to: 10, ease: out_quad}
      - {at: 105, for: 4, about: s, to: -25, ease: in_quad}
      - {at: 116, for: 10, about: s, to: 0}
  # blade: the rapier. Origin = the hand (arm tip); its keys are the blade angle (positive about s lifts the point).
  - id: blade
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      # blow 1 (hit 24): raise the point, cut down across the front, come back
      - {at: 14, for: 8, about: s, to: 55, ease: out_quad}
      - {at: 22, for: 4, about: s, to: -35, ease: in_quad}
      - {at: 26, for: 8, about: s, to: 0}
      # blow 2 (hit 40)
      - {at: 32, for: 6, about: s, to: 55, ease: out_quad}
      - {at: 38, for: 4, about: s, to: -35, ease: in_quad}
      - {at: 44, for: 8, about: s, to: 0}
      # blow 3 (hit 107): the big wind-up and the cut that closes the shears
      - {at: 96, for: 9, about: s, to: 75, ease: out_quad}
      - {at: 105, for: 4, about: s, to: -45, ease: in_quad}
      - {at: 116, for: 10, about: s, to: 0}
  - id: pivot1
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: -3, w: 2.5}}
      - {at: 0, for: 3, to: {v: -0.7, w: 1.1}}
  - id: hinge_a1
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: -3, w: 2.5, s: 0.05}}
      - {at: 0, for: 3, to: {v: -0.7, w: 1.1, s: 0.05}}
    rotate:
      - {at: 0, for: 3, about: s, from: -50, to: -25}
      - {at: 3, for: 3, about: s, to: 5}
      - {at: 6, for: 4, about: s, to: -10}
  - id: hinge_b1
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: -3, w: 2.5, s: -0.05}}
      - {at: 0, for: 3, to: {v: -0.7, w: 1.1, s: -0.05}}
    rotate:
      - {at: 0, for: 3, about: s, from: 14, to: 39}
      - {at: 3, for: 3, about: s, to: 9}
      - {at: 6, for: 4, about: s, to: -6}
  - id: cut1
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    w_fallback: [1, 0, 0]
    s: v x w
    scale:
      - {at: 0, for: 0, to: {v: 0.1, w: 0.1, s: 0.1}}
      - {at: 0, for: 7, to: {v: 1, w: 1, s: 1}, ease: out_cubic}
  - id: pivot2
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: -3, w: 2.5}}
      - {at: 0, for: 3, to: {v: -0.7, w: 1.1}}
  - id: hinge_a2
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: -3, w: 2.5, s: 0.05}}
      - {at: 0, for: 3, to: {v: -0.7, w: 1.1, s: 0.05}}
    rotate:
      - {at: 0, for: 3, about: s, from: -50, to: -25}
      - {at: 3, for: 3, about: s, to: 5}
      - {at: 6, for: 4, about: s, to: -10}
  - id: hinge_b2
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: -3, w: 2.5, s: -0.05}}
      - {at: 0, for: 3, to: {v: -0.7, w: 1.1, s: -0.05}}
    rotate:
      - {at: 0, for: 3, about: s, from: 14, to: 39}
      - {at: 3, for: 3, about: s, to: 9}
      - {at: 6, for: 4, about: s, to: -6}
  - id: cut2
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    w_fallback: [1, 0, 0]
    s: v x w
    scale:
      - {at: 0, for: 0, to: {v: 0.1, w: 0.1, s: 0.1}}
      - {at: 0, for: 7, to: {v: 1, w: 1, s: 1}, ease: out_cubic}
  - id: pivot3
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: -3, w: 2.5}}
      - {at: 0, for: 3, to: {v: -0.7, w: 1.1}}
  - id: hinge_a3
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: -3, w: 2.5, s: 0.05}}
      - {at: 0, for: 3, to: {v: -0.7, w: 1.1, s: 0.05}}
    rotate:
      - {at: 0, for: 3, about: s, from: -50, to: -25}
      - {at: 3, for: 3, about: s, to: 5}
      - {at: 6, for: 4, about: s, to: -10}
  - id: hinge_b3
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: -3, w: 2.5, s: -0.05}}
      - {at: 0, for: 3, to: {v: -0.7, w: 1.1, s: -0.05}}
    rotate:
      - {at: 0, for: 3, about: s, from: 14, to: 39}
      - {at: 3, for: 3, about: s, to: 9}
      - {at: 6, for: 4, about: s, to: -6}
  - id: cut3
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    w_fallback: [1, 0, 0]
    s: v x w
    scale:
      - {at: 0, for: 0, to: {v: 0.1, w: 0.1, s: 0.1}}
      - {at: 0, for: 7, to: {v: 1, w: 1, s: 1}, ease: out_cubic}
  - id: ring
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
machine:
  start: cast
  states:
    cast:
      for: 138
      then: end
      do:
        - {id: rig, op: rig, frame: blade, for: 130}
        # Every cut is the same sector (origin eye, yaw-only forward, full opening, nearest 1 target, once, through invulnerability).
        - id: sel
          op: hit
          at: 24
          anchor: caster.eye
          targets: enemies
          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          ignore_invulnerability: true
          on:
            hit:
                  - {id: a1_blade, op: display, kind: block, block: gray_concrete, frame: hinge_a1, pos: {v: 0.9, w: -0.15}, rotate: [{axis: s, deg: -7}], for: 14, scale: [0.12, 0.25, 1.8], motion: [{law: grow, to: 0, at: 10, for: 3}]}
                  - {id: a1_edge, op: display, kind: block, block: iron_block, frame: hinge_a1, pos: {v: 0.9, w: -0.05}, rotate: [{axis: s, deg: -10}], for: 14, scale: [0.12, 0.05, 1.8], motion: [{law: grow, to: 0, at: 10, for: 3}]}
                  - {id: a1_handle, op: display, kind: block, block: black_concrete, frame: hinge_a1, pos: {v: -0.8, w: 0.2}, rotate: [{axis: s, deg: 20}], for: 14, scale: [0.12, 0.1, 0.6], motion: [{law: grow, to: 0, at: 10, for: 3}]}
                  - {id: b1_blade, op: display, kind: block, block: gray_concrete, frame: hinge_b1, pos: {v: 0.9, w: -0.15}, rotate: [{axis: s, deg: -7}], for: 14, scale: [0.12, 0.25, 1.8], motion: [{law: grow, to: 0, at: 10, for: 3}]}
                  - {id: b1_edge, op: display, kind: block, block: iron_block, frame: hinge_b1, pos: {v: 0.9, w: -0.05}, rotate: [{axis: s, deg: -10}], for: 14, scale: [0.12, 0.05, 1.8], motion: [{law: grow, to: 0, at: 10, for: 3}]}
                  - {id: b1_handle, op: display, kind: block, block: black_concrete, frame: hinge_b1, pos: {v: -0.8, w: 0.2}, rotate: [{axis: s, deg: 20}], for: 14, scale: [0.12, 0.1, 0.6], motion: [{law: grow, to: 0, at: 10, for: 3}]}
                  - {id: flower1, op: display, kind: block, block: white_concrete, frame: pivot1, rotate: [{axis: v, deg: "= 45 * i"}], for: 14, times: 4, scale: [0.08, 0.08, 0.6], motion: [{law: grow, to: 0, at: 10, for: 3}]}
        - id: sel_2
          op: hit
          at: 30
          anchor: caster.eye
          targets: enemies
          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          damage: {physical: = dmg_physical}
          ignore_invulnerability: true
        - id: sel_3
          op: hit
          at: 30
          anchor: caster.eye
          targets: enemies
          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          ignore_invulnerability: true
          on:
            hit:
                  - {id: cross_1, op: display, kind: block, block: white_concrete, frame: cut1, pos: {w: 0.15}, for: 9, times: 2, rotate: [{axis: s, deg: "= 45 - 90 * i"}], scale: [0.05, 3.3, 0.05], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 3, scale: [0.8, 1, 0.8]}, {t: 8, scale: [0.2, 1, 0.2]}]}]}
                  - {id: smoke_1, op: display, kind: text, text: " ", background: "#28201C", frame: cut1, pos: {v: -0.9, w: -0.6}, for: 7, scale: [1.2, 0.8, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 6, scale: [0.3, 0.3, 1]}]}, {law: fade, at: 0, for: 6, ease: out_cubic}]}
                  - {id: bloom_1, op: display, kind: text, text: " ", background: "#EAD9B0", frame: cut1, pos: {w: 0.2}, for: 6, scale: [4, 2, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 1, scale: [2, 2, 1]}, {t: 5, scale: [2.5, 2.5, 1]}]}, {law: fade, at: 1, for: 4}]}
                  - {id: petal_1, op: display, kind: block, block: white_concrete, frame: cut1, pos: {w: 0.1}, for: 8, times: 4, rotate: [{axis: v, deg: "= 45 * i"}], scale: [0.05, 0.05, 1.6], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 7, scale: [0.1, 0.1, 0.3]}]}]}
                  - {id: fill_1, op: display, kind: text, text: "✦", color: "#FFF8ED", see_through: true, frame: cut1, pos: {w: 0.2}, for: 7, scale: [1, 1, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [0.5, 0.5, 1]}, {t: 1, scale: [9, 9, 1]}, {t: 3, scale: [8, 8, 1]}, {t: 6, scale: [1, 1, 1]}]}, {law: fade, at: 0, for: 6, ease: in_quad}]}
                  - {id: sparks_1, op: particle_def, def: stab-spark, frame: cut1, pos: {w: 0.2}, every: 3, times: 2}
                  - {id: snd_1, op: sound, sound: entity.player.attack.strong, frame: cut1, volume: 0.7, pitch: 1.1}
        - id: sel_4
          op: hit
