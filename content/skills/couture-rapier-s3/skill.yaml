          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          ignore_invulnerability: true
          on:
            hit:
                  - {id: cross_2, op: display, kind: block, block: white_concrete, frame: cut2, pos: {w: 0.15}, for: 9, times: 2, rotate: [{axis: s, deg: "= 45 - 90 * i"}], scale: [0.05, 3.3, 0.05], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 3, scale: [0.8, 1, 0.8]}, {t: 8, scale: [0.2, 1, 0.2]}]}]}
                  - {id: smoke_2, op: display, kind: text, text: " ", background: "#28201C", frame: cut2, pos: {v: -0.9, w: -0.6}, for: 7, scale: [1.2, 0.8, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 6, scale: [0.3, 0.3, 1]}]}, {law: fade, at: 0, for: 6, ease: out_cubic}]}
                  - {id: bloom_2, op: display, kind: text, text: " ", background: "#EAD9B0", frame: cut2, pos: {w: 0.2}, for: 6, scale: [4, 2, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 1, scale: [2, 2, 1]}, {t: 5, scale: [2.5, 2.5, 1]}]}, {law: fade, at: 1, for: 4}]}
                  - {id: petal_2, op: display, kind: block, block: white_concrete, frame: cut2, pos: {w: 0.1}, for: 8, times: 4, rotate: [{axis: v, deg: "= 45 * i"}], scale: [0.05, 0.05, 1.6], brightness: {block: 15, sky: 15}, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1]}, {t: 7, scale: [0.1, 0.1, 0.3]}]}]}
