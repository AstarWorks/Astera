# Floral Closure: three cuts of the shears. Each cut lands as a sector hit; the contact fx (a pair of shears folding shut, a white cross)
# repeat per hit through YAML anchors. Written in the ADR-0303 high-level form: one op per visual object, copies as `times:` families,
# shape as laws and keys, rings placed by CEL on the copy index `i`.
apiVersion: astera/v3
kind: Skill
id: couture-rapier-s3
item: couture-rapier
meta: {name: {ja: "花鋏の終縫", en: "Floral Closure"}, description: {ja: "鋏で三度切りつける仕上げの大技。", en: "A three-cut finisher with the shears."}, cooldown_ticks: 180, resource_cost: 25}
params:
  arc_deg: {type: number, default: 45}
  reach: {type: blocks, default: 12}
  dmg_physical: {type: number, default: 35}
  dmg_physical_2: {type: number, default: 70}
machine:
  start: cast
  states:
    cast:
      for: 138
      then: end
      do:
        # Every cut is the same sector (origin eye, yaw-only forward, full opening, nearest 1 target, once, through invulnerability).
        # Trigger-only hits omit damage; the damage and the fx of one tick are separate hits so a missing fx never changes the damage.
        # --- cut 1 (tick 24 shears, 30 damage + cross)
        - id: sel
          op: hit
          at: 24
          anchor: caster.eye
          targets: enemies
          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          ignore_invulnerability: true
          on:
            hit: &shears
              # a pair of shears drops in from behind and above the target, snaps shut and shrinks away
              - {id: remote, op: frame, anchor: victim, axes: caster, mode: snapshot, for: 14}
              - id: pivot
                op: frame
                anchor: remote
                mode: follow
                offset: {up: 2.5, forward: -3}
                for: 14
                motion:
                  - {law: move, velocity: {up: -0.46667, forward: 0.76667}, at: 0, for: 3}
              - id: hinge_a
                op: frame
                anchor: pivot
                offset: {left: -0.045}
                turn: [{axis: left, deg: 50}]
                for: 14
                motion:
                  - {law: spin, axis: left, deg_per_tick: -8.33333, at: 0, for: 3}
                  - {law: spin, axis: left, deg_per_tick: -10, at: 3, for: 3}
                  - {law: spin, axis: left, deg_per_tick: 3.75, at: 6, for: 4}
              - id: blade_a
                op: display
                kind: block
                block: gray_concrete
                anchor: hinge_a
                for: 14
                times: 3
                offset: [{up: -0.04875, forward: 0.39702}, {up: -0.13406, forward: 1.0918}, {up: -0.19499, forward: 1.58807}]
                rotate: [{axis: left, deg: 7}]
                scale: [[0.042, 0.133, 0.56], [0.042, 0.084, 0.42], [0.042, 0.0315, 0.28]]
                motion:
                  - {law: grow, by: 1.42857, at: 0, for: 3}
                  - {law: grow, to: 0, at: 10, for: 3}
              - id: edge_a
                op: display
                kind: block
                block: iron_block
                anchor: hinge_a
                for: 14
                times: 3
                offset: [{up: 0.01066, forward: 0.40431}, {up: -0.09654, forward: 1.09641}, {up: -0.18092, forward: 1.5898}]
                rotate: [[{axis: left, deg: 10.66907}], [{axis: left, deg: 10.09097}], [{axis: left, deg: 8.73982}]]
                scale: [[0.042, 0.0175, 0.56115], [0.042, 0.0175, 0.42061], [0.042, 0.0175, 0.28013]]
                motion:
                  - {law: grow, by: 1.42857, at: 0, for: 3}
                  - {law: grow, to: 0, at: 10, for: 3}
              - id: handle_a
                op: display
                kind: block
                block: black_concrete
                anchor: hinge_a
                for: 14
                times: 5
                offset: [{up: 0.13234, forward: -0.17518}, {up: 0.26745, forward: -0.4961}, {up: 0.1924, forward: -0.78742}, {up: -0.01821, forward: -0.67223}, {up: -0.06574, forward: -0.28514}]
                rotate: [[{axis: left, deg: -128}], [{axis: left, deg: -176.81407}], [{axis: left, deg: 127.06858}], [{axis: left, deg: 34.14968}], [{axis: left, deg: -20.14968}]]
                scale: [[0.042, 0.0315, 0.21779], [0.042, 0.0315, 0.3157], [0.042, 0.0315, 0.15368], [0.042, 0.0315, 0.3068], [0.042, 0.0315, 0.3068]]
                motion:
                  - {law: grow, by: 1.42857, at: 0, for: 3}
                  - {law: grow, to: 0, at: 10, for: 3}
              - id: hinge_b
                op: frame
                anchor: pivot
                offset: {left: 0.045}
                turn: [{axis: left, deg: -14}]
                for: 14
                motion:
                  - {law: spin, axis: left, deg_per_tick: -8.33333, at: 0, for: 3}
                  - {law: spin, axis: left, deg_per_tick: 10, at: 3, for: 3}
                  - {law: spin, axis: left, deg_per_tick: 3.75, at: 6, for: 4}
              - id: blade_b
                op: display
                kind: block
                block: gray_concrete
                anchor: hinge_b
                for: 14
                times: 3
                offset: [{up: -0.04875, forward: 0.39702}, {up: -0.13406, forward: 1.0918}, {up: -0.19499, forward: 1.58807}]
                rotate: [{axis: left, deg: 7}]
                scale: [[0.042, 0.133, 0.56], [0.042, 0.084, 0.42], [0.042, 0.0315, 0.28]]
                motion:
                  - {law: grow, by: 1.42857, at: 0, for: 3}
                  - {law: grow, to: 0, at: 10, for: 3}
              - id: edge_b
                op: display
                kind: block
                block: iron_block
                anchor: hinge_b
                for: 14
                times: 3
                offset: [{up: 0.01066, forward: 0.40431}, {up: -0.09654, forward: 1.09641}, {up: -0.18092, forward: 1.5898}]
                rotate: [[{axis: left, deg: 10.66907}], [{axis: left, deg: 10.09097}], [{axis: left, deg: 8.73982}]]
                scale: [[0.042, 0.0175, 0.56115], [0.042, 0.0175, 0.42061], [0.042, 0.0175, 0.28013]]
                motion:
                  - {law: grow, by: 1.42857, at: 0, for: 3}
                  - {law: grow, to: 0, at: 10, for: 3}
              - id: handle_b
                op: display
                kind: block
                block: black_concrete
                anchor: hinge_b
                for: 14
                times: 5
                offset: [{up: 0.13234, forward: -0.17518}, {up: 0.26745, forward: -0.4961}, {up: 0.1924, forward: -0.78742}, {up: -0.01821, forward: -0.67223}, {up: -0.06574, forward: -0.28514}]
                rotate: [[{axis: left, deg: -128}], [{axis: left, deg: -176.81407}], [{axis: left, deg: 127.06858}], [{axis: left, deg: 34.14968}], [{axis: left, deg: -20.14968}]]
                scale: [[0.042, 0.0315, 0.21779], [0.042, 0.0315, 0.3157], [0.042, 0.0315, 0.15368], [0.042, 0.0315, 0.3068], [0.042, 0.0315, 0.3068]]
                motion:
                  - {law: grow, by: 1.42857, at: 0, for: 3}
                  - {law: grow, to: 0, at: 10, for: 3}
              - id: hinge_flower
                op: display
                kind: block
                block: white_concrete
                anchor: pivot
                for: 14
                times: 4
                offset: [{left: -0.12}, {left: 0.12}, {up: 0.12}, {up: -0.12}]
                scale: [0.105, 0.105, 0.084]
                motion:
                  - {law: grow, by: 1.42857, at: 0, for: 3}
                  - {law: grow, to: 0, at: 10, for: 3}
        - id: sel_2
          op: hit
          at: 30
          anchor: caster.eye
          targets: enemies
          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          damage: {physical: = dmg_physical}
          ignore_invulnerability: true
        - id: sel_3
          op: hit
          at: 30
          anchor: caster.eye
          targets: enemies
          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          ignore_invulnerability: true
          on:
            hit: &cross
              # a white cross thins to nothing, four dark shards fan out, eight petals burst on a spiral and fade
              - {id: hit_pt, op: frame, anchor: victim, axes: caster, mode: snapshot, for: 9}
              - id: cross
                op: display
                kind: block
                block: white_concrete
                anchor: hit_pt
                for: 9
                times: 3
                offset: {up: 1.05}
                rotate: [[{axis: left, deg: -45}], [{axis: left, deg: 45}], [{axis: left, deg: 0}]]
                scale: {left: 0.05, up: 3.3, forward: 0.06}
                brightness: {block: 15, sky: 15}
                motion:
                  - {law: grow, per_tick: {left: -0.005, forward: -0.006667}, at: 0, for: 3}
                  - {law: grow, per_tick: {left: -0.007, forward: -0.008}, at: 3, for: 5, ease: in_quad}
              - {id: dark_0, op: display, kind: text, text: " ", background: "#28201C", anchor: hit_pt, for: 7, offset: {up: 1.1}, scale: [0.96, 0.64, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: move, velocity: {up: -0.13333, forward: -0.15}, at: 0, for: 6, ease: out_cubic}, {law: grow, per_tick: {left: -0.093333, up: -0.053333}, at: 0, for: 6, ease: out_cubic}, {law: fade, at: 0, for: 6, ease: out_cubic}]}
              - {id: dark_1, op: display, kind: text, text: " ", background: "#28201C", anchor: hit_pt, for: 7, offset: {up: 1.1}, scale: [0.96, 0.64, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: spin, axis: forward, deg_per_tick: 10, at: 0, for: 6, ease: out_cubic}, {law: move, velocity: {up: -0.08333, forward: -0.05}, at: 0, for: 6, ease: out_cubic}, {law: grow, per_tick: {left: -0.093333, up: -0.053333}, at: 0, for: 6, ease: out_cubic}, {law: fade, at: 0, for: 6, ease: out_cubic}]}
              - {id: dark_2, op: display, kind: text, text: " ", background: "#28201C", anchor: hit_pt, for: 7, offset: {up: 1.1}, scale: [0.96, 0.64, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: spin, axis: forward, deg_per_tick: 20, at: 0, for: 6, ease: out_cubic}, {law: move, velocity: {up: -0.03333, forward: 0.05}, at: 0, for: 6, ease: out_cubic}, {law: grow, per_tick: {left: -0.093333, up: -0.053333}, at: 0, for: 6, ease: out_cubic}, {law: fade, at: 0, for: 6, ease: out_cubic}]}
              - {id: dark_3, op: display, kind: text, text: " ", background: "#28201C", anchor: hit_pt, for: 7, offset: {up: 1.1}, scale: [0.96, 0.64, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: spin, axis: forward, deg_per_tick: 30, at: 0, for: 6, ease: out_cubic}, {law: move, velocity: {up: 0.01667, forward: 0.15}, at: 0, for: 6, ease: out_cubic}, {law: grow, per_tick: {left: -0.093333, up: -0.053333}, at: 0, for: 6, ease: out_cubic}, {law: fade, at: 0, for: 6, ease: out_cubic}]}
              - id: bloom
                op: display
                kind: text
                text: " "
                background: "#EAD9B0"
                anchor: hit_pt
                for: 6
                offset: {up: 1.1}
                scale: [4, 2, 1]
                billboard: center
                brightness: {block: 15, sky: 15}
                motion:
                  - {law: keys, keys: [{t: 0, scale: {left: 4, up: 2, forward: 1}, alpha: 0.2}, {t: 1, scale: {left: 12, up: 6, forward: 1}}, {t: 5, scale: {left: 16, up: 8, forward: 1}, alpha: 0}]}
              # petals slow by 7% per tick; two move segments approximate the decay
              - {id: petal_0, op: display, kind: text, text: " ", background: "#FFF5E9", anchor: hit_pt, for: 8, offset: {up: 1.1}, scale: [0.58, 0.29, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: move, velocity: {left: 0.05872, up: 0.09921, forward: 0}, at: 0, for: 3}, {law: move, velocity: {left: 0.04562, up: 0.07707, forward: 0}, at: 3, for: 4}, {law: grow, to: {left: 0.058, up: 0.029, forward: 1}, at: 0, for: 7}, {law: keys, keys: [{t: 0, alpha: 1}, {t: 7, alpha: 0}]}]}
              - {id: petal_1, op: display, kind: text, text: " ", background: "#FFF5E9", anchor: hit_pt, for: 8, offset: {up: 1.1}, scale: [0.58, 0.29, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: move, velocity: {left: -0.06982, up: 0.06888, forward: 0.06397}, at: 0, for: 3}, {law: move, velocity: {left: -0.05424, up: 0.05352, forward: 0.04969}, at: 3, for: 4}, {law: grow, to: {left: 0.058, up: 0.029, forward: 1}, at: 0, for: 7}, {law: keys, keys: [{t: 0, alpha: 1}, {t: 7, alpha: 0}]}]}
              - {id: petal_2, op: display, kind: text, text: " ", background: "#FFF5E9", anchor: hit_pt, for: 8, offset: {up: 1.1}, scale: [0.58, 0.29, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: move, velocity: {left: 0.00983, up: 0.03856, forward: -0.11202}, at: 0, for: 3}, {law: move, velocity: {left: 0.00764, up: 0.02996, forward: -0.08703}, at: 3, for: 4}, {law: grow, to: {left: 0.058, up: 0.029, forward: 1}, at: 0, for: 7}, {law: keys, keys: [{t: 0, alpha: 1}, {t: 7, alpha: 0}]}]}
              - {id: petal_3, op: display, kind: text, text: " ", background: "#FFF5E9", anchor: hit_pt, for: 8, offset: {up: 1.1}, scale: [0.58, 0.29, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: move, velocity: {left: 0.07323, up: 0.00824, forward: 0.09551}, at: 0, for: 3}, {law: move, velocity: {left: 0.05689, up: 0.0064, forward: 0.0742}, at: 3, for: 4}, {law: grow, to: {left: 0.058, up: 0.029, forward: 1}, at: 0, for: 7}, {law: keys, keys: [{t: 0, alpha: 1}, {t: 7, alpha: 0}]}]}
              - {id: petal_4, op: display, kind: text, text: " ", background: "#FFF5E9", anchor: hit_pt, for: 8, offset: {up: 1.1}, scale: [0.58, 0.29, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: move, velocity: {left: -0.1185, up: -0.02209, forward: -0.02096}, at: 0, for: 3}, {law: move, velocity: {left: -0.09206, up: -0.01716, forward: -0.01628}, at: 3, for: 4}, {law: grow, to: {left: 0.058, up: 0.029, forward: 1}, at: 0, for: 7}, {law: keys, keys: [{t: 0, alpha: 1}, {t: 7, alpha: 0}]}]}
              - {id: petal_5, op: display, kind: text, text: " ", background: "#FFF5E9", anchor: hit_pt, for: 8, offset: {up: 1.1}, scale: [0.58, 0.29, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: move, velocity: {left: 0.09488, up: -0.05241, forward: -0.06035}, at: 0, for: 3}, {law: move, velocity: {left: 0.07371, up: -0.04072, forward: -0.04689}, at: 3, for: 4}, {law: grow, to: {left: 0.058, up: 0.029, forward: 1}, at: 0, for: 7}, {law: keys, keys: [{t: 0, alpha: 1}, {t: 7, alpha: 0}]}]}
              - {id: petal_6, op: display, kind: text, text: " ", background: "#FFF5E9", anchor: hit_pt, for: 8, offset: {up: 1.1}, scale: [0.58, 0.29, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: move, velocity: {left: -0.02459, up: -0.08274, forward: 0.09144}, at: 0, for: 3}, {law: move, velocity: {left: -0.0191, up: -0.06428, forward: 0.07104}, at: 3, for: 4}, {law: grow, to: {left: 0.058, up: 0.029, forward: 1}, at: 0, for: 7}, {law: keys, keys: [{t: 0, alpha: 1}, {t: 7, alpha: 0}]}]}
              - {id: petal_7, op: display, kind: text, text: " ", background: "#FFF5E9", anchor: hit_pt, for: 8, offset: {up: 1.1}, scale: [0.58, 0.29, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: move, velocity: {left: -0.02706, up: -0.11306, forward: -0.05212}, at: 0, for: 3}, {law: move, velocity: {left: -0.02103, up: -0.08784, forward: -0.04049}, at: 3, for: 4}, {law: grow, to: {left: 0.058, up: 0.029, forward: 1}, at: 0, for: 7}, {law: keys, keys: [{t: 0, alpha: 1}, {t: 7, alpha: 0}]}]}
              - {id: fill, op: display, kind: text, text: "✦", color: "#FFF8ED", see_through: true, anchor: hit_pt, for: 7, offset: {up: 1.1}, scale: [0.5, 0.5, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: grow, per_tick: {left: 8.5, up: 8.5}, at: 0, for: 1, ease: out_expo}, {law: grow, per_tick: {left: -0.5, up: -0.5}, at: 1, for: 2}, {law: grow, per_tick: {left: -2.33333, up: -2.33333}, at: 3, for: 3, ease: in_quad}, {law: fade, at: 0, for: 6, ease: in_quad}]}
              - {id: sparks_at, op: frame, anchor: hit_pt, mode: follow, offset: {up: 1.1}, for: 1}
              - {id: sparks, op: particle_def, def: stab-spark, anchor: sparks_at, every: 3, times: 2}
              - {id: snd, op: sound, sound: entity.player.attack.strong, anchor: hit_pt, volume: 0.7, pitch: 1.1}
        # --- cut 2 (tick 40 shears, tick 46 damage + cross)
        - id: sel_4
          op: hit
          at: 40
          anchor: caster.eye
          targets: enemies
          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          ignore_invulnerability: true
          on:
            hit: *shears
        - id: sel_5
          op: hit
          at: 46
          anchor: caster.eye
          targets: enemies
          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          damage: {physical: = dmg_physical}
          ignore_invulnerability: true
        - id: sel_6
          op: hit
          at: 46
          anchor: caster.eye
          targets: enemies
          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          ignore_invulnerability: true
          on:
            hit: *cross
        # --- cut 3 (tick 107 shears, tick 113 damage + cross, tick 127 rosette)
        - id: sel_7
          op: hit
          at: 107
          anchor: caster.eye
          targets: enemies
          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          ignore_invulnerability: true
          on:
            hit: *shears
        - id: sel_8
          op: hit
          at: 113
          anchor: caster.eye
          targets: enemies
          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          damage: {physical: = dmg_physical_2}
          ignore_invulnerability: true
        - id: sel_9
          op: hit
          at: 113
          anchor: caster.eye
          targets: enemies
          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          ignore_invulnerability: true
          on:
            hit: *cross
        - id: sel_10
          op: hit
          at: 127
          anchor: caster.eye
          targets: enemies
          max_count: 1
          shape: {sector: {deg: = arc_deg, range: = reach, height: 2.0, forward: yaw}}
          window: once
          ignore_invulnerability: true
          on:
            hit:
              # a ring of 15 pink blades closes around the target at head height and collapses
              - {id: ring, op: frame, anchor: victim, axes: caster, mode: snapshot, for: 11}
              - id: blade
                op: display
                kind: block
                block: pink_concrete
                anchor: ring
                for: 11
                times: 15
                offset: {up: "= 1.1 + 2.6 * sin(rad(24 * i))", forward: "= 0.4 + 2.6 * cos(rad(24 * i))"}
                rotate: [{axis: left, deg: "= -90 - 24 * i"}]
                scale: [0, 0, 0]
                brightness: {block: 15, sky: 15}
                motion:
                  - {law: keys, keys: [{t: 0, scale: [0, 0, 0]}, {t: 2, scale: [0.05, "= 0.047 + 0.1024 * sin(rad(12 * i))", 1.25245]}, {t: 11, scale: [0, 0, 0]}]}

        # --- three crescents of light and the thread ring: casting only, no hit
        # a crescent of 12 white blades swept in front of the caster (cut 1 at tick 28, cut 2 at tick 43)
        - id: swing_a
          op: group
          at: 28
          do: &crescent
            - {id: crescent, op: frame, anchor: caster, mode: follow, for: 12}
            - id: arc
              op: display
              kind: block
              block: white_concrete
              anchor: crescent
              for: 12
