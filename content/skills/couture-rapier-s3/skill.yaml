# v3 draft (wave 2, w2-couture). Hand-ported from the v2 skill.yaml + look.yaml; per-tick values come from the v2 tracks.
# Each linear run of a v2 track channel is one law (laws sum and hold).
apiVersion: astera/v3
kind: Skill
id: couture-rapier-s3
item: couture-rapier
meta: {name: {ja: "花鋏の終縫", en: "Floral Closure"}, description: {ja: "鋏で三度切りつける仕上げの大技。", en: "A three-cut finisher with the shears."}, cooldown_ticks: 180, resource_cost: 25}
params:
