# Floral Closure (couture rapier S3) in the frame grammar (ADR-0314): three cuts of the shears. A cut is a sector hit; its contact fx are points of
# frames, so `left` / `up` / `forward` are not written. A caster frame has v = forward, w = up, s = v x w (to the right).
#   body          - the caster's feet. Both crescents of 12 white blades (ticks 28 and 43), the overhead glass arc (58) and the ten black
#                   threads on the ring at the feet (89) are points of it, each blade rotated in its own plane about w / s / v.
#   pivotN        - one per blow N (shears at ticks 24, 40, 107): the victim's feet, v the caster's forward. It is the point the flower sits on:
#                   the pair of shears drops in from 3 behind and 2.5 above and settles 0.7 behind and 1.1 above in 3 ticks.
#   hinge_aN/_bN  - the two scissor halves of blow N, 0.05 either side of the pivot; they ride the same drop. The `rotate` keys about s ARE
#                   the snip: half A closes through -25, 5, -10 degrees, half B opens the other way (39, 9, -6), so the two cross and
#                   shut like shears. Blades, edges and handles lie in the v-w plane.
#   cutN          - the victim's centre, v the way the blow came in: cross, four shards, bloom, eight petals, fill and sparks of the cut that lands
#                   (ticks 30, 46, 113). Its scale key is the burst: it opens from 0.1 to 1 over 7 ticks (out_cubic), so every shard and petal,
#                   placed at its final radius, flies out and slows. One frame per blow because a per-victim frame's keys run from its first use.
#   ring          - the victim's feet: the 15 pink blades of the rosette (tick 127) close around the head at 2.6 and collapse.
# Gameplay (every hit tick, window, damage, cast length 138) is unchanged.
apiVersion: astera/v3
kind: Skill
id: couture-rapier-s3
item: couture-rapier
meta: {name: {ja: "花鋏の終縫", en: "Floral Closure"}, description: {ja: "鋏で三度切りつける仕上げの大技。", en: "A three-cut finisher with the shears."}, cooldown_ticks: 180, resource_cost: 25}
params:
  arc_deg: {type: number, default: 45}
  reach: {type: blocks, default: 12}
  dmg_physical: {type: number, default: 35}
  dmg_physical_2: {type: number, default: 70}
frames:
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: pivot1
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: -3, w: 2.5}}
      - {at: 0, for: 3, to: {v: -0.7, w: 1.1}}
  - id: hinge_a1
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: -3, w: 2.5, s: 0.05}}
      - {at: 0, for: 3, to: {v: -0.7, w: 1.1, s: 0.05}}
    rotate:
      - {at: 0, for: 3, about: s, from: -50, to: -25}
      - {at: 3, for: 3, about: s, to: 5}
      - {at: 6, for: 4, about: s, to: -10}
  - id: hinge_b1
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: -3, w: 2.5, s: -0.05}}
      - {at: 0, for: 3, to: {v: -0.7, w: 1.1, s: -0.05}}
    rotate:
      - {at: 0, for: 3, about: s, from: 14, to: 39}
      - {at: 3, for: 3, about: s, to: 9}
      - {at: 6, for: 4, about: s, to: -6}
  - id: cut1
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
    scale:
      - {at: 0, for: 0, to: {v: 0.1, w: 0.1, s: 0.1}}
      - {at: 0, for: 7, to: {v: 1, w: 1, s: 1}, ease: out_cubic}
  - id: pivot2
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: -3, w: 2.5}}
      - {at: 0, for: 3, to: {v: -0.7, w: 1.1}}
  - id: hinge_a2
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: -3, w: 2.5, s: 0.05}}
      - {at: 0, for: 3, to: {v: -0.7, w: 1.1, s: 0.05}}
    rotate:
      - {at: 0, for: 3, about: s, from: -50, to: -25}
      - {at: 3, for: 3, about: s, to: 5}
      - {at: 6, for: 4, about: s, to: -10}
  - id: hinge_b2
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: -3, w: 2.5, s: -0.05}}
      - {at: 0, for: 3, to: {v: -0.7, w: 1.1, s: -0.05}}
    rotate:
      - {at: 0, for: 3, about: s, from: 14, to: 39}
      - {at: 3, for: 3, about: s, to: 9}
      - {at: 6, for: 4, about: s, to: -6}
  - id: cut2
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
    scale:
      - {at: 0, for: 0, to: {v: 0.1, w: 0.1, s: 0.1}}
      - {at: 0, for: 7, to: {v: 1, w: 1, s: 1}, ease: out_cubic}
  - id: pivot3
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: -3, w: 2.5}}
      - {at: 0, for: 3, to: {v: -0.7, w: 1.1}}
  - id: hinge_a3
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: -3, w: 2.5, s: 0.05}}
      - {at: 0, for: 3, to: {v: -0.7, w: 1.1, s: 0.05}}
    rotate:
      - {at: 0, for: 3, about: s, from: -50, to: -25}
      - {at: 3, for: 3, about: s, to: 5}
      - {at: 6, for: 4, about: s, to: -10}
  - id: hinge_b3
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: -3, w: 2.5, s: -0.05}}
      - {at: 0, for: 3, to: {v: -0.7, w: 1.1, s: -0.05}}
    rotate:
      - {at: 0, for: 3, about: s, from: 14, to: 39}
      - {at: 3, for: 3, about: s, to: 9}
      - {at: 6, for: 4, about: s, to: -6}
  - id: cut3
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
    scale:
      - {at: 0, for: 0, to: {v: 0.1, w: 0.1, s: 0.1}}
      - {at: 0, for: 7, to: {v: 1, w: 1, s: 1}, ease: out_cubic}
  - id: ring
    on: event.victim
    each: true
    origin: victim
    v: forward
    w: up
    s: v x w
