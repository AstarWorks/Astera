apiVersion: astera/v3
kind: Skill
id: scythe-reap
item: scythe
meta: {name: {ja: "刈り取り", en: "Scythe Reap"}, description: {ja: "半円状に刈り取る。", en: "A wide reaping arc."}, cooldown_ticks: 16, resource_cost: 8, tags: [melee, physical]}
params:
  arc_deg:      {type: number, default: 180}
  range:        {type: blocks, default: 3.4}
  dmg_physical: {type: number, default: 28}
  knockback:    {type: number, default: 0.3}
anchors:
  - {id: sweep, anchor: caster, offset: {up: -0.2, forward: 1.5}, mode: snapshot}
  - {id: heart, anchor: victim.root, offset: {up: 1.2}}
machine:
  start: cast
  states:
    cast:
      for: 1
      then: end
      do:
        - {id: snd, op: sound, sound: entity.player.attack.sweep, anchor: caster, volume: 1.0, pitch: 1.0, at: 0}
        - {id: fx, op: particle_def, def: slash-sweep, anchor: sweep, at: 0}
        - id: swing
          op: hit
          at: 0
          anchor: caster.eye
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(event.victim - pos(caster))", strength: "${knockback}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact, volume: 0.7, pitch: 1.2}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
    end: {final: true}
