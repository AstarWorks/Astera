# scythe-reap: right-to-left reap of the scythe (wind-up 4 ticks, hit at tick 4).
# Frames (ADR-0314, ADR-0315), the gameplay (hit tick, shape, damage, knockback, cooldown, cast length) is unchanged:
#   blade  - the scythe. Origin at the caster feet, moved along a hand path (guard -> drawn back high at the right -> across to the left -> guard). Long axis along v (grip at the origin), edge along w. Roll -80 about v lays the edge on the left, the cut is then a turn about s (v moves towards w), so the edge leads. The wind-up tips the point to the right (-60),
#            the cut carries it across the front to the left (90, hit when the blade crosses the middle), `reset` eases back to guard.
#            The engine pins the right hand to the origin, so every `move:` point lies inside the 0.60 reach of the right shoulder (v 0 / w 1.29 / s 0.29).
#   body   - the caster's feet, v forward / w up / s right: sounds and the cast fx.
#   wound  - one per victim at the victim's centre, v the way the blow came in: the hit sound and the hit spark.
#   edge   - line along the curved blade from its root (v 0.88, s 0.69) to its tip (v 0.13, s 0.82), what the trail rows draw along.
apiVersion: astera/v3
kind: Skill
id: scythe-reap
item: scythe
meta: {name: {ja: "刈り取り", en: "Scythe Reap"}, description: {ja: "半円状に刈り取る。", en: "A wide reaping arc."}, cooldown_ticks: 16, resource_cost: 8, tags: [melee, physical]}
params:
  arc_deg:      {type: number, default: 180}
  range:        {type: blocks, default: 3.4}
  dmg_physical: {type: number, default: 28}
  knockback:    {type: number, default: 0.3}
frames:
  - id: blade
    origin: caster
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: 0.45, w: 0.9, s: 0.36}}  # guard
      - {at: 0, for: 1, to: {v: 0.45, w: 0.96, s: 0.5}}
      - {at: 1, for: 1, to: {v: 0.29, w: 1.15, s: 0.79}}
      - {at: 2, for: 1, to: {v: 0.19, w: 1.3, s: 0.86}}
      - {at: 3, for: 1, to: {v: 0.43, w: 0.9, s: 0.13}}
      - {at: 4, for: 1, to: {v: 0.25, w: 0.95, s: -0.14}}
      - {at: 6, for: 1, to: {v: 0.25, w: 0.9, s: -0.09}}
      - {at: 7, for: 1, to: {v: 0.32, w: 0.87, s: 0}}
      - {at: 8, for: 1, to: {v: 0.34, w: 0.82, s: 0.14}}
      - {at: 9, for: 1, to: {v: 0.43, w: 0.87, s: 0.29}}
      - {at: 10, for: 1, to: {v: 0.46, w: 0.9, s: 0.34}}
      - {at: 11, for: 1, to: {v: 0.45, w: 0.9, s: 0.36}}
    rotate:
      - {at: 0, for: 0, about: v, to: -80}  # roll the edge into the cut plane
      - {at: 0, for: 3, about: s, to: -60, ease: in_out_sine}  # wind-up turn
      - {at: 3, for: 3, about: s, to: 90, ease: out_cubic}  # the cut, edge first
      - {at: 6, for: 6, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: wound
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
lines:
  edge: {frame: blade, from: {v: 0.88, s: 0.69}, to: {v: 0.13, s: 0.82}}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 4
      then: strike
      do:
        - {id: snd_windup, op: sound, sound: item.armor.equip_chain, frame: body, volume: 0.5, pitch: 0.8}
        # weapon rig: right-to-left reap. One performance in the windup state, detached so it plays on through the strike and the tail:
        # drawn back over 3 ticks, the cut starts at tick 3 so the blade crosses the target zone at the hit (tick 4), then 6 ticks of follow-through.
        - {id: rig, op: rig, frame: blade, for: 12, detach: true}
    strike:
      for: 1
      then: end
      do:
        - id: swing
          op: hit
          at: 0
          anchor: caster.eye
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: react, op: react, target: event.victim, flinch: true, for: 6}
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(event.victim - pos(caster))", strength: "${knockback}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", frame: wound, volume: 0.7, pitch: 1.2, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, frame: wound, pos: {w: 0.2}, detach: true}
        - {id: snd, op: sound, sound: entity.player.attack.sweep, frame: body, volume: 1.0, pitch: 1.0, detach: true}
        - {id: fx, op: particle_def, def: slash-sweep, frame: body, pos: {v: 1.5, w: 1.42}, detach: true}
        - {id: trail, op: particle, particle: crit, along: edge, samples: 2, count: 1, extra: 0.04, at: 0, every: 1, for: 4, detach: true}
    end: {final: true}
