# ECO-04: heal-potion right-click. Consumes one potion, then heals the caster 8 HP (4 hearts).
id: heal-potion-use
name: {ja: 回復薬, en: Healing Draught}
description: {ja: 使い切りで体力を 8 回復する。, en: Single use; restores 8 HP.}
archetype: sequence
cooldown_ticks: 100
resource_cost: 0
tags: [support, heal, consumable]
params: {type: sequence}
phases:
  type: sequence
  cast:
  - type: consume_item
    targets: {type: caster}
    item_id: heal-potion
  - type: heal
    targets: {type: caster}
    amount: {type: literal, value: 8.0}
  - type: play_sound
    targets: {type: caster}
    sound_id: entity.generic.drink
  - type: play_sound
    targets: {type: caster}
    sound_id: block.amethyst_block.chime
    volume: {type: literal, value: 0.7}
    pitch: {type: literal, value: 1.3}
  - type: spawn_particle
    targets: {type: caster_offset, offset: {type: literal, value: {x: 0.0, y: 1.0, z: 0.0}}}
    particle_id: verdant-heal
