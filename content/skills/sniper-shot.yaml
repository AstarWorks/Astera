# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: sniper-shot

name:
  ja: "狙撃"
  en: "Sniper Shot"
description:
  ja: "遠距離から強烈な一発を撃ち込む。"
  en: "A single, devastating long-range shot."

archetype: projectile
cooldown_ticks: 50
resource_cost: 12
tags: [ ranged, gun, physical ]

params:
  type: projectile
  launch_speed: 6.0
  max_lifetime_ticks: 50
  visual:
    trail_spacing: 0.4
    trail:
      - type: point
        particles:
          - { id: end_rod, offset: { x: 0.01, y: 0.01, z: 0.01 } }
          - { id: crit, offset: { x: 0.02, y: 0.02, z: 0.02 } }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/rifle-crack
      volume: { type: literal, value: 0.9 }
      pitch: { type: literal, value: 0.8 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 1.0, height: -0.25 }
      particle_id: gun-muzzle-flash
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 47.5 }
          attribute: physical
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/blade-crit
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 1.0 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
  hit_block:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: astera:weapons/gun-impact-block
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.5 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: hit-spark
  miss: []
  expire: []
