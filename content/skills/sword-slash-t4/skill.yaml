# Weapon upgrade tier 4 of knight-sword (bought at the match base shop, content/shops/match-shop.yaml); hit damage x2.05.
apiVersion: astera/v3
kind: Skill
id: sword-slash-t4
item: knight-sword-t4
meta:
  name: {ja: "斬撃", en: "Sword Slash"}
  description: {ja: "前方を薙ぎ払う基本の斬撃。", en: "A basic sweeping slash."}
  cooldown_ticks: 10
  tags: [melee, physical]
anchors:
  - {id: sweep_pt, anchor: caster, offset: {up: -0.3, forward: 1.6}}
  - {id: heart, anchor: victim.root, offset: {up: 1.2}}   # was pt_enemy_0_1p2_0 (victim feet, yaw-only)
machine:
  start: swing
  states:
    swing:
      for: 2   # v2 cast lasts until its last presentation row (snd_miss at tick 2)
      then: end
      do:
        - id: swing
          op: hit
          at: 0
          anchor: caster.eye
          shape: {sector: {deg: 100, range: 3.5, height: 2.0, forward: look}}
          targets: enemies
          ignore_invulnerability: false
          damage: {physical: 82.0}
          window: once
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: 0.4}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: contact}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
            # v2 miss cue: sound at tick 2 when counter('swing_hits') == 0
            miss:
              - {id: snd_miss, op: sound, at: 2, sound: "astera:weapons/blade-miss", anchor: caster}
        - {id: snd, op: sound, sound: "astera:weapons/sword-swing", anchor: caster}
        - {id: fx, op: particle_def, def: slash-sweep, anchor: sweep_pt}
    end: {final: true}
