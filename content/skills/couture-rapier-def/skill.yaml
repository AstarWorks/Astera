# Trimming Guard: black threads trail behind the caster while she holds the guard; a hit from within 3.5 blocks snips open a pair of shears and cuts the attacker.
# Written in the ADR-0303 high-level form: one op per visual object, copies as `times:` families, shape as laws and keys.
# The petal fans use `grow prop: offset` with an `accel` (a decaying move) on a golden-angle direction computed from the copy index.
apiVersion: astera/v3
kind: Skill
id: couture-rapier-def
item: couture-rapier
meta: {name: {ja: "返し裁ち", en: "Trimming Guard"}, description: {ja: "構えて近距離の攻撃を受けると、一度だけ攻撃者を裁つ。", en: "Trimming Guard"}, cooldown_ticks: 85, resource_cost: 10}
params:
  dmg_physical: {type: number, default: 30}
machine:
  start: cast
  states:
    cast:
      for: 46
      then: end
      start: guard
      on:
        - {event: cast.end, to: end}
      do:
        # --- tick 0..30: six black threads trail behind the caster and thin to nothing
        - {id: guard_at, op: frame, anchor: caster, mode: snapshot, at: 0, for: 30}
        - id: thread
          op: display
          kind: block
          block: black_concrete
          anchor: guard_at
          at: 0
          for: 30
          times: 6
          offset: {left: "= -0.55 + 0.22 * i", up: 0.1, forward: -1.8}
          rotate: [{axis: up, deg: "= 12 - 5 * i"}]
          scale: [0.04, 0.025, 3.2]
          brightness: {block: 15, sky: 15}
          motion:
            - {law: grow, to: [0, 0.025, 3.2], at: 0, for: 29}

        # --- tick 16..24: ten petals fan out on a golden-angle spiral (0.095 blocks/tick, slowing) and fade; a rose ring swells
        - id: guard_petal
          op: display
          kind: text
          text: " "
          background: "#FFF4EE"
          anchor: guard_at
          at: 16
          for: 8
          times: 10
          offset: {up: 1.2}
          scale: [1.12, 0.56, 1]
          billboard: center
          brightness: {block: 15, sky: 15}
          motion:
            - law: grow
              prop: offset
              per_tick: {left: "= 0.095 * sqrt(1 - pow(0.9 - 0.2 * i, 2)) * cos(rad(137.5 * i))", up: "= 0.095 * (0.9 - 0.2 * i)", forward: "= 0.095 * sqrt(1 - pow(0.9 - 0.2 * i, 2)) * sin(rad(137.5 * i))"}
              accel: {left: "= -0.0045 * sqrt(1 - pow(0.9 - 0.2 * i, 2)) * cos(rad(137.5 * i))", up: "= -0.0045 * (0.9 - 0.2 * i)", forward: "= -0.0045 * sqrt(1 - pow(0.9 - 0.2 * i, 2)) * sin(rad(137.5 * i))"}
              at: 0
              for: 7
            - {law: fade, at: 0, for: 7}
        - id: guard_ring
          op: display
          kind: text
          text: "◯"
          color: "#E5B9BE"
          anchor: guard_at
          at: 16
          for: 14
          offset: {up: 1}
          scale: [8.5, 10.5, 1]
          billboard: center
          brightness: {block: 15, sky: 15}
          motion:
            - {law: grow, per_tick: {left: 0.15, up: 0.15}, at: 0, for: 10, ease: out_cubic}
            - {law: fade, start: 0.4, to: 0, at: 0, for: 10, ease: out_cubic}
      states:
        guard:
          # v2 window: listen incoming_hit, ticks 30, filter dist(caster, victim) <= 3.5
          # GAP(Q5): v2 window absorb true (the parried hit is cancelled). Current best-effort form is observe-only (hurt -> riposte); founder picks A `absorb: true` on this transition / B resist.phys
          for: 30
          then: done
          on:
            - event: hurt
              when: "= dist(caster, event.attacker) <= 3.5"
              to: riposte
              do:
                # v2: delay 7, damage only when dist < 3.5 (strict); at is relative to the hurt tick
                - {id: riposte_hit, op: damage, target: event.attacker, damage: {physical: "= dmg_physical"}, ignore_invulnerability: true, at: 7, when: "= dist(caster, event.attacker) < 3.5"}
        riposte:
          # v2 counter_fx events: raise (0), +7, +13, +14, +15, +16; damage via delay 7 when dist < 3.5 (strict)
          for: 16
          then: done
          do:
            # --- tick 0..16: two scissor halves, 64 degrees apart, snip about the hinge (up 1.05, forward 0.45) and shrink away
            - {id: shears, op: frame, anchor: caster, mode: follow, at: 0, for: 16}
            - id: hinge_a
              op: frame
              anchor: shears
              at: 0
              for: 16
              offset: {left: -0.295, up: 1.05, forward: 0.45}
              motion:
                - {law: spin, axis: left, deg_per_tick: 5.5, at: 0, for: 4}
                - {law: spin, axis: left, deg_per_tick: -9, at: 4, for: 3}
                - {law: spin, axis: left, deg_per_tick: 4.4, at: 7, for: 5}
                - {law: spin, axis: left, deg_per_tick: 5, at: 12, for: 3}
            - id: blade_a
              op: display
              kind: block
              block: gray_concrete
              anchor: hinge_a
              at: 0
              for: 16
              times: 3
              offset: [{up: -0.04875, forward: 0.39702}, {up: -0.13406, forward: 1.0918}, {up: -0.19499, forward: 1.58807}]
              rotate: [{axis: left, deg: 7}]
              scale: [[0.06, 0.19, 0.8], [0.06, 0.12, 0.6], [0.06, 0.045, 0.4]]
              motion:
                - {law: grow, to: 0, at: 12, for: 3}
            - id: edge_a
              op: display
              kind: block
              block: iron_block
              anchor: hinge_a
              at: 0
              for: 16
              times: 3
              offset: [{up: 0.01066, forward: 0.40431}, {up: -0.09654, forward: 1.09641}, {up: -0.18092, forward: 1.5898}]
              rotate: [[{axis: left, deg: 10.66907}], [{axis: left, deg: 10.09097}], [{axis: left, deg: 8.73982}]]
              scale: [[0.06, 0.025, 0.80164], [0.06, 0.025, 0.60087], [0.06, 0.025, 0.40018]]
              motion:
                - {law: grow, to: 0, at: 12, for: 3}
            - id: handle_a
              op: display
              kind: block
              block: black_concrete
              anchor: hinge_a
              at: 0
              for: 16
              times: 5
              offset: [{up: 0.13234, forward: -0.17518}, {up: 0.26745, forward: -0.4961}, {up: 0.1924, forward: -0.78742}, {up: -0.01821, forward: -0.67223}, {up: -0.06574, forward: -0.28514}]
              rotate: [[{axis: left, deg: -128}], [{axis: left, deg: -176.81407}], [{axis: left, deg: 127.06858}], [{axis: left, deg: 34.14968}], [{axis: left, deg: -20.14968}]]
              scale: [[0.06, 0.045, 0.31113], [0.06, 0.045, 0.451], [0.06, 0.045, 0.21954], [0.06, 0.045, 0.43829], [0.06, 0.045, 0.43829]]
              motion:
                - {law: grow, to: 0, at: 12, for: 3}
            - id: hinge_b
              op: frame
              anchor: shears
              at: 0
              for: 16
              offset: {left: -0.205, up: 1.05, forward: 0.45}
              turn: [{axis: left, deg: -64}]
              motion:
                - {law: spin, axis: left, deg_per_tick: 4.5, at: 0, for: 4}
                - {law: spin, axis: left, deg_per_tick: 12.33333, at: 4, for: 3}
                - {law: spin, axis: left, deg_per_tick: 3.6, at: 7, for: 5}
                - {law: spin, axis: left, deg_per_tick: 5, at: 12, for: 3}
            - id: blade_b
              op: display
              kind: block
              block: gray_concrete
              anchor: hinge_b
              at: 0
              for: 16
              times: 3
              offset: [{up: -0.04875, forward: 0.39702}, {up: -0.13406, forward: 1.0918}, {up: -0.19499, forward: 1.58807}]
              rotate: [{axis: left, deg: 7}]
              scale: [[0.06, 0.19, 0.8], [0.06, 0.12, 0.6], [0.06, 0.045, 0.4]]
              motion:
                - {law: grow, to: 0, at: 12, for: 3}
            - id: edge_b
              op: display
              kind: block
              block: iron_block
              anchor: hinge_b
              at: 0
              for: 16
              times: 3
              offset: [{up: 0.01066, forward: 0.40431}, {up: -0.09654, forward: 1.09641}, {up: -0.18092, forward: 1.5898}]
              rotate: [[{axis: left, deg: 10.66907}], [{axis: left, deg: 10.09097}], [{axis: left, deg: 8.73982}]]
              scale: [[0.06, 0.025, 0.80164], [0.06, 0.025, 0.60087], [0.06, 0.025, 0.40018]]
              motion:
                - {law: grow, to: 0, at: 12, for: 3}
            - id: handle_b
              op: display
              kind: block
              block: black_concrete
              anchor: hinge_b
              at: 0
              for: 16
              times: 5
              offset: [{up: 0.13234, forward: -0.17518}, {up: 0.26745, forward: -0.4961}, {up: 0.1924, forward: -0.78742}, {up: -0.01821, forward: -0.67223}, {up: -0.06574, forward: -0.28514}]
              rotate: [[{axis: left, deg: -128}], [{axis: left, deg: -176.81407}], [{axis: left, deg: 127.06858}], [{axis: left, deg: 34.14968}], [{axis: left, deg: -20.14968}]]
              scale: [[0.06, 0.045, 0.31113], [0.06, 0.045, 0.451], [0.06, 0.045, 0.21954], [0.06, 0.045, 0.43829], [0.06, 0.045, 0.43829]]
              motion:
                - {law: grow, to: 0, at: 12, for: 3}
            - id: hinge_flower
              op: display
              kind: block
              block: white_concrete
              anchor: shears
              at: 0
              for: 16
              times: 4
              offset: [{left: -0.37, up: 1.05, forward: 0.45}, {left: -0.13, up: 1.05, forward: 0.45}, {left: -0.25, up: 1.17, forward: 0.45}, {left: -0.25, up: 0.93, forward: 0.45}]
              scale: [0.15, 0.15, 0.12]
              motion:
                - {law: grow, to: 0, at: 12, for: 3}

            # --- tick 7..16: the cut lands. A white cross, four dark shards, a bloom, eight petals and a flash at the attacker
            - {id: contact, op: frame, anchor: victim, axes: caster, mode: snapshot, at: 7, for: 9}
            - id: cross
              op: display
              kind: block
              block: white_concrete
              anchor: contact
              at: 7
              for: 9
              times: 3
              offset: {up: 1.05}
              rotate: [[{axis: left, deg: -45}], [{axis: left, deg: 45}], [{axis: left, deg: 0}]]
              scale: [0.05, 3.3, 0.06]
              brightness: {block: 15, sky: 15}
              motion:
                - {law: grow, per_tick: {left: -0.005, forward: -0.006667}, at: 0, for: 3}
                - {law: grow, per_tick: {left: -0.007, forward: -0.008}, at: 3, for: 5, ease: in_quad}
            # four dark shards fan out, spinning faster the further they travel
            - id: dark
              op: display
              kind: text
              text: " "
              background: "#28201C"
              anchor: contact
              at: 7
              for: 7
              times: 4
              offset: {up: 1.1}
              scale: [0.96, 0.64, 1]
              billboard: center
              brightness: {block: 15, sky: 15}
              motion:
                - {law: spin, axis: forward, deg_per_tick: "= 10 * i", at: 0, for: 6, ease: out_cubic}
                - {law: move, velocity: {up: "= -0.13333 + 0.05 * i", forward: "= -0.15 + 0.1 * i"}, at: 0, for: 6, ease: out_cubic}
                - {law: grow, per_tick: {left: -0.093333, up: -0.053333}, at: 0, for: 6, ease: out_cubic}
                - {law: fade, at: 0, for: 6, ease: out_cubic}
            - id: bloom
              op: display
              kind: text
              text: " "
              background: "#EAD9B0"
              anchor: contact
              at: 7
              for: 6
              offset: {up: 1.1}
              scale: [4, 2, 1]
              billboard: center
              brightness: {block: 15, sky: 15}
              motion:
                - {law: keys, keys: [{t: 0, scale: {left: 4, up: 2, forward: 1}, alpha: 0.2}, {t: 1, scale: {left: 12, up: 6, forward: 1}}, {t: 5, scale: {left: 16, up: 8, forward: 1}, alpha: 0}]}
            # eight petals burst out on a golden-angle spiral (0.124 blocks/tick, slowing about 7% per tick), shrinking and fading
            - id: petal
              op: display
              kind: text
              text: " "
              background: "#FFF5E9"
              anchor: contact
              at: 7
              for: 8
              times: 8
              offset: {up: 1.1}
              scale: [0.58, 0.29, 1]
              billboard: center
              brightness: {block: 15, sky: 15}
              motion:
                - law: grow
                  prop: offset
                  per_tick: {left: "= 0.1237 * sqrt(1 - pow(0.86 - 0.2457 * i, 2)) * cos(rad(137.5 * i))", up: "= 0.1237 * (0.86 - 0.2457 * i)", forward: "= 0.1237 * sqrt(1 - pow(0.86 - 0.2457 * i, 2)) * sin(rad(137.5 * i))"}
                  accel: {left: "= -0.0067 * sqrt(1 - pow(0.86 - 0.2457 * i, 2)) * cos(rad(137.5 * i))", up: "= -0.0067 * (0.86 - 0.2457 * i)", forward: "= -0.0067 * sqrt(1 - pow(0.86 - 0.2457 * i, 2)) * sin(rad(137.5 * i))"}
                  at: 0
                  for: 7
                - {law: grow, to: {left: 0.058, up: 0.029, forward: 1}, at: 0, for: 7}
                - {law: fade, at: 0, for: 7}
            - id: contact_fill
              op: display
              kind: text
              text: "✦"
              color: "#FFF8ED"
              see_through: true
              anchor: contact
              at: 7
              for: 7
              offset: {up: 1.1}
              scale: [0.5, 0.5, 1]
              billboard: center
              brightness: {block: 15, sky: 15}
              motion:
                - {law: grow, per_tick: {left: 8.5, up: 8.5}, at: 0, for: 1, ease: out_expo}
                - {law: grow, per_tick: {left: -0.5, up: -0.5}, at: 1, for: 2}
                - {law: grow, per_tick: {left: -2.333333, up: -2.333333}, at: 3, for: 3, ease: in_quad}
                - {law: fade, at: 0, for: 6, ease: in_quad}
            - {id: sparks_at, op: frame, anchor: contact, mode: follow, offset: {up: 1.1}, at: 7, for: 1}
            - {id: sparks, op: particle_def, def: stab-spark, anchor: sparks_at, at: 7, every: 3, times: 2}
            - {id: snd, op: sound, sound: entity.player.attack.strong, anchor: victim, volume: 0.7, pitch: 1.1, at: 7}
        done: {final: true}
    end: {final: true}
