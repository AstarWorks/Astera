              for: 14
              motion:
                - {law: grow, per_tick: {left: 0.15, up: 0.15, forward: 0}, at: 0, for: 10, ease: out_cubic}
                - {law: fade, start: 0.4, to: 0.0, at: 0, for: 10, ease: out_cubic}
      states:
        guard:
          # v2 window: listen incoming_hit, ticks 30, filter dist(caster, victim) <= 3.5
          # GAP(Q5): v2 window absorb true (the parried hit is cancelled). Current best-effort form is observe-only (hurt -> riposte); founder picks A `absorb: true` on this transition / B resist.physical / C `parry` op.
          # (example e's resist.physical +0.7 is NOT in v2 and is not added here)
          for: 30
          then: done
          on:
            - event: hurt
              when: "= dist(caster, event.attacker) <= 3.5"
              to: riposte
              do:
                # v2: delay 7, damage only when dist < 3.5 (strict); at is relative to the hurt tick
                - {id: riposte_hit, op: damage, target: event.attacker, damage: {physical: "= dmg_physical"}, ignore_invulnerability: true, at: 7, when: "= dist(caster, event.attacker) < 3.5"}
        riposte:
          # v2 counter_fx events: raise (0), +7, +13, +14, +15, +16; damage via delay 7 when dist < 3.5 (strict)
          for: 16
          then: done
          do:
            - id: counter_fx
