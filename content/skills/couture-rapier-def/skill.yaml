# Trimming Guard: black threads trail behind the caster while she holds the guard; a hit from within 3.5 blocks snips open a pair of shears and cuts the attacker.
# Written in the frame grammar (ADR-0314, event clock + attacker origin ADR-0315 G1/G2): no anchor / offset is left. A caster frame has v = forward,
# w = up, s = v x w (to the right); a positive turn about s tips v toward w.
#   trail   - the caster held in the world at tick 0: the six black threads and the petal fan / rose ring behind and above her.
#   blade   - the caster's eye (followed): the frame the shared parry part rides for its clang, spark and flash.
#   shears  - born on entry to the riposte state, follows the caster; the hinges hang on it.
#   hinge_a / hinge_b - the pivot of each scissor half (0.295 / 0.205 to the right, 1.05 up, 0.45 ahead). Their keys count from the riposte entry,
#             whatever the parry took: a snips 22, back to -5, 17, then 32 degrees (about s, tipping down); b starts 64 degrees the other way and ends 24 up.
#   hit     - the attacker's feet, held in the world at riposte tick 7: the cut lands. The cross, dark shards, bloom, petals, flash and sparks hang on it.
# The blades are collapsed from 3 + 3 + 5 converter segments per half to a base bar, a tip bar, one edge strip and two handle bars.
apiVersion: astera/v3
kind: Skill
id: couture-rapier-def
item: couture-rapier
meta: {name: {ja: "返し裁ち", en: "Trimming Guard"}, description: {ja: "構えて近距離の攻撃を受けると、一度だけ攻撃者を裁つ。", en: "Trimming Guard"}, cooldown_ticks: 85, resource_cost: 10}
params:
  dmg_physical: {type: number, default: 30}
frames:
  - {id: trail, origin: caster, v: forward, w: up, s: v x w, snapshot: 0}
  - {id: blade, origin: caster.eye, v: forward, w: up, s: v x w}
  - {id: shears, origin: caster, v: forward, w: up, s: v x w}
  - id: hinge_a
    on: state.riposte
    origin: {frame: shears, pos: {s: 0.3, w: 1.05, v: 0.45}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 4, about: s, to: -22}
      - {at: 4, for: 3, about: s, to: 5}
      - {at: 7, for: 5, about: s, to: -17}
      - {at: 12, for: 3, about: s, to: -32}
  - id: hinge_b
    on: state.riposte
    origin: {frame: shears, pos: {s: 0.2, w: 1.05, v: 0.45}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 4, about: s, from: 64, to: 46}
      - {at: 4, for: 3, about: s, to: 9}
      - {at: 7, for: 5, about: s, to: -9}
      - {at: 12, for: 3, about: s, to: -24}
  - {id: hit, on: state.riposte, origin: attacker.feet, v: forward, w: up, s: v x w, snapshot: 7}
machine:
  start: cast
  states:
    cast:
      for: 46
      then: end
      start: guard
      on:
        - {event: cast.end, to: end}
      do:
        # --- tick 0..30: six black threads trail behind the caster, fanned 5 degrees apart, and thin to nothing
        - {id: thread_0, op: display, kind: block, block: black_concrete, frame: trail, pos: {s: 0.55, w: 0.1, v: -1.8}, rotate: [{axis: w, deg: 12}], scale: [0.04, 0.03, 3.2], brightness: {block: 15, sky: 15}, at: 0, for: 30, motion: [{law: grow, to: [0, 0.03, 3.2], at: 0, for: 29}]}
        - {id: thread_1, op: display, kind: block, block: black_concrete, frame: trail, pos: {s: 0.33, w: 0.1, v: -1.8}, rotate: [{axis: w, deg: 7}], scale: [0.04, 0.03, 3.2], brightness: {block: 15, sky: 15}, at: 0, for: 30, motion: [{law: grow, to: [0, 0.03, 3.2], at: 0, for: 29}]}
        - {id: thread_2, op: display, kind: block, block: black_concrete, frame: trail, pos: {s: 0.11, w: 0.1, v: -1.8}, rotate: [{axis: w, deg: 2}], scale: [0.04, 0.03, 3.2], brightness: {block: 15, sky: 15}, at: 0, for: 30, motion: [{law: grow, to: [0, 0.03, 3.2], at: 0, for: 29}]}
        - {id: thread_3, op: display, kind: block, block: black_concrete, frame: trail, pos: {s: -0.11, w: 0.1, v: -1.8}, rotate: [{axis: w, deg: -3}], scale: [0.04, 0.03, 3.2], brightness: {block: 15, sky: 15}, at: 0, for: 30, motion: [{law: grow, to: [0, 0.03, 3.2], at: 0, for: 29}]}
        - {id: thread_4, op: display, kind: block, block: black_concrete, frame: trail, pos: {s: -0.33, w: 0.1, v: -1.8}, rotate: [{axis: w, deg: -8}], scale: [0.04, 0.03, 3.2], brightness: {block: 15, sky: 15}, at: 0, for: 30, motion: [{law: grow, to: [0, 0.03, 3.2], at: 0, for: 29}]}
        - {id: thread_5, op: display, kind: block, block: black_concrete, frame: trail, pos: {s: -0.55, w: 0.1, v: -1.8}, rotate: [{axis: w, deg: -13}], scale: [0.04, 0.03, 3.2], brightness: {block: 15, sky: 15}, at: 0, for: 30, motion: [{law: grow, to: [0, 0.03, 3.2], at: 0, for: 29}]}

        # --- tick 16..24: ten petals fan out on a golden-angle spiral (0.095 blocks/tick, slowing) and fade; a rose ring swells
        - id: guard_petal
          op: display
          kind: text
          text: " "
          background: "#FFF4EE"
          frame: trail
          pos: {w: 1.2}
          at: 16
          for: 8
          times: 10
          scale: [1.12, 0.56, 1]
          billboard: center
          brightness: {block: 15, sky: 15}
          motion:
            - law: grow
              prop: offset
              per_tick: {s: "= -(0.095 * sqrt(1 - pow(0.9 - 0.2 * i, 2)) * cos(rad(137.5 * i)))", w: "= 0.095 * (0.9 - 0.2 * i)", v: "= 0.095 * sqrt(1 - pow(0.9 - 0.2 * i, 2)) * sin(rad(137.5 * i))"}
              accel: {s: "= -(-0.0045 * sqrt(1 - pow(0.9 - 0.2 * i, 2)) * cos(rad(137.5 * i)))", w: "= -0.0045 * (0.9 - 0.2 * i)", v: "= -0.0045 * sqrt(1 - pow(0.9 - 0.2 * i, 2)) * sin(rad(137.5 * i))"}
              at: 0
              for: 7
            - {law: fade, at: 0, for: 7}
        - {id: guard_ring, op: display, kind: text, text: "◯", color: "#E5B9BE", frame: trail, pos: {w: 1}, at: 16, for: 14, scale: [8.5, 10.5, 1], billboard: center, brightness: {block: 15, sky: 15}, motion: [{law: grow, per_tick: {s: 0.15, w: 0.15}, at: 0, for: 10, ease: out_cubic}, {law: fade, start: 0.4, to: 0, at: 0, for: 10, ease: out_cubic}]}
      states:
        guard:
          # parry window: 30 ticks, range 3.5. The shared parry part absorbs the hit; a parry buys the riposte.
          use: parry
          with: {window: 30, arc: 360, range: 3.5, recover: 10, whiff_lag: 1}
          frames: {weapon: blade}
          on:
            - {event: cast/guard.parried, to: riposte}
            - {event: cast/guard.end, to: done}
        riposte:
          # counter_fx events: raise (0), +7, +13, +14, +15, +16; damage via delay 7 when dist < 3.5 (strict)
          for: 16
          then: done
          do:
            # 7 ticks after the parry, damage only when dist < 3.5 (strict); `at` is relative to the parry tick
            - {id: riposte_hit, op: damage, target: event.attacker, damage: {physical: "= dmg_physical"}, ignore_invulnerability: true, at: 7, when: "= dist(caster, event.attacker) < 3.5"}
            # --- tick 0..16: two scissor halves snip about their hinges and shrink away over the last 3 ticks. Blocks: x = s (thickness), y = w, z = v (along the blade).
            - {id: blade_a_base, op: display, kind: block, block: gray_concrete, frame: hinge_a, pos: {w: -0.08, v: 0.6}, rotate: [{axis: s, deg: -7}], scale: [0.06, 0.16, 1.2], at: 0, for: 16, motion: [{law: grow, to: 0, at: 12, for: 3}]}
            - {id: blade_a_tip, op: display, kind: block, block: gray_concrete, frame: hinge_a, pos: {w: -0.17, v: 1.6}, rotate: [{axis: s, deg: -7}], scale: [0.06, 0.06, 0.8], at: 0, for: 16, motion: [{law: grow, to: 0, at: 12, for: 3}]}
            - {id: edge_a, op: display, kind: block, block: iron_block, frame: hinge_a, pos: {w: -0.09, v: 1.0}, rotate: [{axis: s, deg: -10}], scale: [0.06, 0.03, 2.0], at: 0, for: 16, motion: [{law: grow, to: 0, at: 12, for: 3}]}
            - {id: handle_a_out, op: display, kind: block, block: black_concrete, frame: hinge_a, pos: {w: 0.2, v: -0.5}, scale: [0.06, 0.05, 0.62], at: 0, for: 16, motion: [{law: grow, to: 0, at: 12, for: 3}]}
            - {id: handle_a_in, op: display, kind: block, block: black_concrete, frame: hinge_a, pos: {w: -0.04, v: -0.48}, scale: [0.06, 0.05, 0.4], at: 0, for: 16, motion: [{law: grow, to: 0, at: 12, for: 3}]}
            - {id: blade_b_base, op: display, kind: block, block: gray_concrete, frame: hinge_b, pos: {w: -0.08, v: 0.6}, rotate: [{axis: s, deg: -7}], scale: [0.06, 0.16, 1.2], at: 0, for: 16, motion: [{law: grow, to: 0, at: 12, for: 3}]}
            - {id: blade_b_tip, op: display, kind: block, block: gray_concrete, frame: hinge_b, pos: {w: -0.17, v: 1.6}, rotate: [{axis: s, deg: -7}], scale: [0.06, 0.06, 0.8], at: 0, for: 16, motion: [{law: grow, to: 0, at: 12, for: 3}]}
            - {id: edge_b, op: display, kind: block, block: iron_block, frame: hinge_b, pos: {w: -0.09, v: 1.0}, rotate: [{axis: s, deg: -10}], scale: [0.06, 0.03, 2.0], at: 0, for: 16, motion: [{law: grow, to: 0, at: 12, for: 3}]}
            - {id: handle_b_out, op: display, kind: block, block: black_concrete, frame: hinge_b, pos: {w: 0.2, v: -0.5}, scale: [0.06, 0.05, 0.62], at: 0, for: 16, motion: [{law: grow, to: 0, at: 12, for: 3}]}
            - {id: handle_b_in, op: display, kind: block, block: black_concrete, frame: hinge_b, pos: {w: -0.04, v: -0.48}, scale: [0.06, 0.05, 0.4], at: 0, for: 16, motion: [{law: grow, to: 0, at: 12, for: 3}]}
            # the four white cubes of the pivot flower, around the hinge point (0.25 to the right, 1.05 up, 0.45 ahead) on `shears`
            - {id: flower_l, op: display, kind: block, block: white_concrete, frame: shears, pos: {s: 0.37, w: 1.05, v: 0.45}, scale: [0.15, 0.15, 0.12], at: 0, for: 16, motion: [{law: grow, to: 0, at: 12, for: 3}]}
            - {id: flower_r, op: display, kind: block, block: white_concrete, frame: shears, pos: {s: 0.13, w: 1.05, v: 0.45}, scale: [0.15, 0.15, 0.12], at: 0, for: 16, motion: [{law: grow, to: 0, at: 12, for: 3}]}
            - {id: flower_u, op: display, kind: block, block: white_concrete, frame: shears, pos: {s: 0.25, w: 1.17, v: 0.45}, scale: [0.15, 0.15, 0.12], at: 0, for: 16, motion: [{law: grow, to: 0, at: 12, for: 3}]}
            - {id: flower_d, op: display, kind: block, block: white_concrete, frame: shears, pos: {s: 0.25, w: 0.93, v: 0.45}, scale: [0.15, 0.15, 0.12], at: 0, for: 16, motion: [{law: grow, to: 0, at: 12, for: 3}]}

            # --- tick 7..16: the cut lands. A white cross, four dark shards, a bloom, eight petals and a flash at the attacker (frame `hit`, 1.1 up)
            - {id: cross, op: display, kind: block, block: white_concrete, frame: hit, pos: {w: 1.05}, times: 2, rotate: [{axis: s, deg: "= 45 - 90 * i"}], scale: [0.05, 3.3, 0.06], brightness: {block: 15, sky: 15}, at: 7, for: 9, motion: [{law: grow, per_tick: {s: -0.005, v: -0.006667}, at: 0, for: 3}, {law: grow, per_tick: {s: -0.007, v: -0.008}, at: 3, for: 5, ease: in_quad}]}
            - {id: cross_up, op: display, kind: block, block: white_concrete, frame: hit, pos: {w: 1.05}, scale: [0.05, 3.3, 0.06], brightness: {block: 15, sky: 15}, at: 7, for: 9, motion: [{law: grow, per_tick: {s: -0.005, v: -0.006667}, at: 0, for: 3}, {law: grow, per_tick: {s: -0.007, v: -0.008}, at: 3, for: 5, ease: in_quad}]}
            # four dark shards fan out, spinning faster the further they travel
            - {id: dark, op: display, kind: text, text: " ", background: "#28201C", frame: hit, pos: {w: 1.1}, times: 4, scale: [0.96, 0.64, 1], billboard: center, brightness: {block: 15, sky: 15}, at: 7, for: 7, motion: [{law: spin, axis: forward, deg_per_tick: "= 10 * i", at: 0, for: 6, ease: out_cubic}, {law: move, velocity: {w: "= -0.13333 + 0.05 * i", v: "= -0.15 + 0.1 * i"}, at: 0, for: 6, ease: out_cubic}, {law: grow, per_tick: {s: -0.093333, w: -0.053333}, at: 0, for: 6, ease: out_cubic}, {law: fade, at: 0, for: 6, ease: out_cubic}]}
            - {id: bloom, op: display, kind: text, text: " ", background: "#EAD9B0", frame: hit, pos: {w: 1.1}, scale: [4, 2, 1], billboard: center, brightness: {block: 15, sky: 15}, at: 7, for: 6, motion: [{law: keys, keys: [{t: 0, scale: [1, 1, 1], alpha: 0.2}, {t: 1, scale: [3, 3, 1]}, {t: 5, scale: [4, 4, 1], alpha: 0}]}]}
            # eight petals burst out on a golden-angle spiral (0.124 blocks/tick, slowing about 7% per tick), shrinking and fading
            - id: petal
              op: display
              kind: text
              text: " "
              background: "#FFF5E9"
              frame: hit
              pos: {w: 1.1}
              at: 7
              for: 8
              times: 8
              scale: [0.58, 0.29, 1]
              billboard: center
              brightness: {block: 15, sky: 15}
              motion:
                - law: grow
                  prop: offset
                  per_tick: {s: "= -(0.1237 * sqrt(1 - pow(0.86 - 0.2457 * i, 2)) * cos(rad(137.5 * i)))", w: "= 0.1237 * (0.86 - 0.2457 * i)", v: "= 0.1237 * sqrt(1 - pow(0.86 - 0.2457 * i, 2)) * sin(rad(137.5 * i))"}
                  accel: {s: "= -(-0.0067 * sqrt(1 - pow(0.86 - 0.2457 * i, 2)) * cos(rad(137.5 * i)))", w: "= -0.0067 * (0.86 - 0.2457 * i)", v: "= -0.0067 * sqrt(1 - pow(0.86 - 0.2457 * i, 2)) * sin(rad(137.5 * i))"}
                  at: 0
                  for: 7
                - {law: grow, to: {s: 0.06, w: 0.03, v: 1}, at: 0, for: 7}
                - {law: fade, at: 0, for: 7}
            - {id: contact_fill, op: display, kind: text, text: "✦", color: "#FFF8ED", see_through: true, frame: hit, pos: {w: 1.1}, scale: [0.5, 0.5, 1], billboard: center, brightness: {block: 15, sky: 15}, at: 7, for: 7, motion: [{law: grow, per_tick: {s: 8.5, w: 8.5}, at: 0, for: 1, ease: out_expo}, {law: grow, per_tick: {s: -0.5, w: -0.5}, at: 1, for: 2}, {law: grow, per_tick: {s: -2.333333, w: -2.333333}, at: 3, for: 3, ease: in_quad}, {law: fade, at: 0, for: 6, ease: in_quad}]}
            - {id: sparks, op: particle_def, def: stab-spark, frame: hit, pos: {w: 1.1}, at: 7, every: 3, times: 2}
            - {id: snd, op: sound, sound: entity.player.attack.strong, frame: hit, pos: {}, volume: 0.7, pitch: 1.1, at: 7}
        done: {final: true}
    end: {final: true}
