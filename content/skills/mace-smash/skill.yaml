# Wave 2 v3 draft (basic-ac): ported 1:1 from the v2 skill.yaml + look.yaml. GAP comments mark what v3 cannot spell yet.
apiVersion: astera/v3
kind: Skill
id: mace-smash
item: mace
meta:
  name: {ja: "叩き潰し", en: "Smash"}
  description: {ja: "強烈な打撃で相手を吹き飛ばす。", en: "A crushing blow that knocks back."}
  cooldown_ticks: 28
  resource_cost: 12
  tags: [melee, physical]
params:
  arc_deg: {type: number, default: 100}
  range: {type: blocks, default: 3.0}
  dmg_physical: {type: number, default: 60.0}
  knockback: {type: number, default: 1.0}
anchors:
  - {id: eye, anchor: caster.eye}
  - {id: sweep, anchor: caster.eye, offset: {up: -0.2, forward: 1.4}, mode: snapshot}   # was pt_aim_0_m0p2_1p4
machine:
  start: swing
  states:
    swing:
      for: 1
      then: end
      enter:
        - {id: snd_swing, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 1.0, pitch: 0.7}
        - {id: fx_swing, op: particle_def, def: slash-sweep, anchor: sweep}
        # GAP(Q1): max_count spelling (A: required int|all, B: optional); v2 had no cap, so `all` = unlimited.
        - id: swing
          op: hit
          anchor: eye
          at: 0
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          max_count: all
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(event.victim - pos(caster))", strength: "${knockback}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-crit", anchor: contact, volume: 0.7, pitch: 1.2}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: contact}
    end: {final: true}
