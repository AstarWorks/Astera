# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: rapier-sidestep

name:
  ja: "受け流し"
  en: "Parry Step"
description:
  ja: "後方へ軽く身を引き、素早く動ける。"
  en: "A light backstep followed by a short sprint."

archetype: buff
cooldown_ticks: 120
resource_cost: 0
tags: [ melee, movement ]

params:
  type: buff
  status_effect_id: evasive
  duration_ticks: 20

phases:
  type: buff
  cast:
    - type: propel
      targets: { type: caster }
      direction: { type: from_caster }
      strength: { type: literal, value: -0.9 }
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/dash-whoosh
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 1.4 }
    - type: spawn_particle
      targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 0.2, z: 0.0 } } }
      particle_id: dash-cloud
  expire: []
  removed: []
