# Showcase S8 (foundation audit 5): the area / zone template. Written from zero on ADR-0303 rev4.10.
# Beat sheet (ticks since cast): 0 ground ring opens (grow by 9 over 8, fades out over the last 20), spine beam stretches ground -> sky,
# four motes orbit the caster, a halo follows the caster's eye; 10 the ward strikes: lightning (visual only), enemies in `radius` take
# damage (nearest 3), allies heal and are cleansed; 36 the hum is stopped; 40 end.
# Only the visuals use rand; every tick above is fixed.
# Frame grammar (ADR-0314): floor - the plate under the caster's feet (v up, so the ring lies flat without an `align` law): the opening chime, the ground ring,
# the spine plate (fading out) and the strike dust are drawn on it; swirl - the same point at chest height, turning 14 degrees a tick about v: the four motes
# sit on it at 90 degree phases; eye - the caster's eye, the halo's rise. The strike, damage, heal and cleanse sit on `floor` (live, where the old `ground`
# anchor was a snapshot). Gameplay unchanged.
apiVersion: astera/v3
kind: Skill
id: sanctuary-ward
meta: {name: {ja: "聖域の結界", en: "Sanctuary Ward"}, description: {ja: "足元に結界を張り、範囲内の敵を打ち、味方を癒して浄化する。", en: "Raises a ward at your feet: it strikes enemies inside, heals and cleanses allies."}, cooldown_ticks: 300, resource_cost: 40, tags: [magic, support, zone]}
params:
  radius:      {type: blocks, default: 5.0}
  heal:        {type: number, default: 20.0}
  damage:      {type: number, default: 12.0}
  cap:         {type: number, default: 3}
frames:
  - {id: floor, origin: caster.feet, v: up, w: forward, s: right, move: [{at: 0, for: 0, to: {v: 0.05}}]}
  - {id: swirl, origin: caster.feet, v: up, w: forward, s: right, move: [{at: 0, for: 0, to: {v: 1.0}}], rotate: [{at: 2, for: 34, about: v, to: 476}]}
  - {id: eye, origin: caster.eye, v: up, w: forward, s: right}
  - {id: torso, origin: caster.feet, v: up, w: forward, s: right, move: [{at: 0, for: 0, to: {v: 1.0}}]}
machine:
  start: ward
  states:
    ward:
      for: 40
      then: end
      enter:
        - {id: snd_open, op: sound, sound: "astera:skills/heal-chime", frame: floor, volume: 0.8, pitch: 0.8}
        - {id: hum, op: sound, sound: block.amethyst_block.resonate, frame: floor, volume: 0.9, pitch: 0.7, every: 6, times: 6}
      do:
        # --- the strike, tick 10 ---
        - {id: bolt, op: lightning, frame: floor, pos: {v: 0}, visual_only: true, at: 10}
        - {id: smite, op: damage, target: {kind: enemies, frame: floor, pos: {v: 0}, radius: "${radius}", max_count: "${cap}"}, damage: {electric: "${damage}"}, ignore_invulnerability: false, at: 10}
        - {id: mend, op: heal, target: {kind: allies, frame: floor, pos: {v: 0}, radius: "${radius}", include_self: true}, amount: "${heal}", at: 10}
        - {id: purge, op: cleanse, negative_only: true, target: {kind: allies, frame: floor, pos: {v: 0}, radius: "${radius}", include_self: true}, at: 10}
        - {id: snd_strike, op: sound, sound: "astera:skills/lightning-impact", frame: floor, volume: 0.8, pitch: 1.1, at: 10}
        - {id: stop_hum, op: stop_sound, target: caster, sound: block.amethyst_block.resonate, at: 36}
        # --- ground ring: grows to 9x over 8 ticks, holds, fades over the last 20 ---
        - id: ring
          op: display
          kind: sprite
          sprite: ring
          frame: floor
          size: [0.8, 0.8]
          billboard: fixed
          brightness: {block: 15, sky: 15}
          flipbook: {frames: 6, every: 2, loop: true}
          at: 0
          for: 40
          motion:
            - {law: grow, by: 9.0, at: 0, for: 8, ease: out_cubic}
            - {law: fade, start: 1.0, to: 0.0, at: 20, for: 20}
        # --- spine: a plate from the floor to 2.35 above it, fading out over its last 16 ticks ---
        - {id: spine, op: display, kind: sprite, sprite: line-thin, frame: floor, plane: [s, v], pos: {v: 1.2}, size: [0.6, 2.4], color: "#fff3c8", see_through: true, brightness: {block: 15, sky: 15}, at: 0, for: 40, motion: [{law: fade, start: 1.0, to: 0.0, at: 24, for: 16}]}
        # --- four motes circle the caster on the turning `swirl` frame; phase from the copy index, height spread from rand (visual only) ---
        - id: mote
          op: display
          kind: sprite
          sprite: holy-glint
          frame: swirl
          times: 4
          size: [0.5, 0.5]
          pos: {w: "= 2.2 * cos(rad(90 * i))", s: "= 2.2 * sin(rad(90 * i))", v: "= 0.25 * i + rand('mote') * 0.2"}
          billboard: center
          brightness: {block: 15, sky: 15}
          at: 2
          for: 34
          motion:
            - {law: fade, start: 1.0, to: 0.0, at: 24, for: 10}
        # --- halo rises from the eye frame ---
        - id: halo
          op: display
          kind: sprite
          sprite: sparkle-cross
          frame: eye
          pos: {v: 0}
          size: [0.8, 0.8]
          billboard: center
          brightness: {block: 15, sky: 15}
          at: 10
          for: 26
          motion:
            - {law: grow, by: 0.4, at: 12, for: 14}
            - {law: fade, start: 1.0, to: 0.0, at: 12, for: 14}
        # --- burst on the strike ---
        - {id: fx_heal, op: particle_def, def: verdant-heal, frame: torso, at: 10}
        - {id: fx_dust, op: particle, particle: dust, frame: floor, count: 24, offset: [3.0, 0.2, 3.0], extra: 0, color: "#fff3c8", size: 1.2, at: 10}
    end: {final: true}
