apiVersion: astera/v3
kind: Skill
id: shovel-earth-bridge-stone
item: stone-shovel
meta:
  name: {ja: "石の土橋", en: "Stone Earth Bridge"}
  description: {ja: "目の前に固めた粘土の橋を架ける。", en: "Lays a packed-clay bridge ahead of you."}
  cooldown_ticks: 300
  resource_cost: 0
  tags: [tool, cover]
anchors:
  - {id: spark, anchor: caster, offset: {forward: 2.0}, mode: follow}
machine:
  start: cast
  states:
    cast:
      for: 1
      then: end
      do:
        - {id: earth_bridge, use: shovel-earth-bridge, with: {length: 5, width: 2, tier: 1, gravel_pitch: 0.8}, frames: {spot: spark}}
    end: {final: true}
