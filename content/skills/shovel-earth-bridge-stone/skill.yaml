# Lays a packed-clay bridge ahead of the caster, in the frame grammar (ADR-0314 / ADR-0315). Base of the shovel-earth-bridge tiers (this is the stone tier);
# shovel-earth-bridge-iron / -diamond extend it (ADR-0303 9.3): same document, other id / item / meta and the `with:` values below.
# Wind-up W = 5 ticks (round_half_up(5 / attack_speed 1.0 (vanilla shovel))):
# the shovel is drawn back over 4 ticks, the cut starts at tick 4 so the blade crosses the target at the impact (tick 5) and the bridge is laid there; then 6 ticks of follow-through.
# Gameplay (the bridge, sounds, cooldown) is unchanged.
# Two frames carry everything drawn:
#   tool - the shovel: origin at the caster's feet moved along the hand path (`move:`), the held shovel rides it, long axis along v (grip at the origin,
#          blade at v 0.9). The right hand is pinned onto this origin by the engine (ADR-0315): the blade leads, the hand follows. The scoop is a turn about s, which moves v towards w: the blade is drawn back to 95 degrees, scooped down through the target to -35 and runs out to -60,
#          then `reset` eases it back to the rest pose before the rig ends. The line `edge` (blade base 0.4 -> blade 0.9) is what the trail draws along.
#   body - the caster's feet, v forward / w up / s right: the hit area spark and the sounds are points of it.
apiVersion: astera/v3
kind: Skill
id: shovel-earth-bridge-stone
item: stone-shovel
meta:
  name: {ja: "石の土橋", en: "Stone Earth Bridge"}
  description: {ja: "目の前に固めた粘土の橋を架ける。", en: "Lays a packed-clay bridge ahead of you."}
  cooldown_ticks: 300
  resource_cost: 0
  tags: [tool, cover]
params:
  length: {type: number, default: 5}
  width: {type: number, default: 2}
  gravel_pitch: {type: number, default: 0.8}
  dirt_vol: {type: number, default: 0.8}
  dirt_pitch: {type: number, default: 0.9}
  dirt: {type: bool, default: false}
  flatten: {type: bool, default: false}
  spark: {type: string, default: tool-shovel-stone}
frames:
  - id: tool
    origin: caster
    v: forward
    w: up
    s: v x w
    move:
      - {at: 0, for: 0, to: {v: 0.20, w: 0.95, s: 0.45}}
      - {at: 0, for: 4, to: {v: 0.30, w: 1.35, s: 0.52}, ease: out_quad}      # drawn back
      - {at: 4, for: 3, to: {v: 0.55, w: 1.15, s: 0.42}, ease: out_cubic}      # the cut
      - {at: 7, for: 3, to: {v: 0.55, w: 1.00, s: 0.40}, ease: out_cubic}      # follow-through
      - {at: 10, for: 3, to: {v: 0.20, w: 0.95, s: 0.45}, ease: in_out_sine}      # back to the hip
    rotate:
      - {at: 0, for: 4, about: s, to: 95, ease: out_quad}
      - {at: 4, for: 3, about: s, to: -35, ease: out_cubic}
      - {at: 7, for: 3, about: s, to: -60, ease: out_cubic}
      - {at: 10, for: 3, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
lines:
  edge: {frame: tool, from: {v: 0.4}, to: {v: 0.9}}      # head base -> head
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 5
      then: cast
      do:
        - {id: rig, op: rig, frame: tool, for: 13, detach: true}
        - {id: trail, op: particle, particle: crit, along: edge, samples: 4, count: 1, extra: 0.04, at: 4, every: 2, for: 6, detach: true}
    cast:
      for: 1
      then: end
      do:
        - {id: bridge, op: place_shape, anchor: caster, shape: {bridge: {length: "${length}", width: "${width}"}}, block: "astera:packed_clay", consume: none, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, sound: block.gravel.break, frame: body, volume: 1.0, pitch: "${gravel_pitch}"}
        - {id: snd_2, op: sound, sound: block.rooted_dirt.break, frame: body, volume: "${dirt_vol}", pitch: "${dirt_pitch}", when: "= ${dirt}"}
        - {id: snd_3, op: sound, sound: item.shovel.flatten, frame: body, volume: 0.8, pitch: 0.9, when: "= ${flatten}"}
        - {id: spark, op: particle_def, def: "${spark}", frame: body, pos: {v: 2.0}}
    end: {final: true}
