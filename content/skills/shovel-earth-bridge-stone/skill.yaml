# Hand-authored tool presentation. Mechanical shape / timing / damage / cooldown stay unchanged.
# Dust uses typical tool material; no per-cell surface data is exposed to presentation rows.
apiVersion: astera/v3
kind: Skill
id: shovel-earth-bridge-stone
item: stone-shovel
meta:
  name: {ja: "石の土橋", en: "Stone Earth Bridge"}
  description: {ja: "目の前に固めた粘土の橋を架ける。", en: "Lays a packed-clay bridge ahead of you."}
  cooldown_ticks: 300
  resource_cost: 0
  tags: [tool, cover]
params:
  length: {type: number, default: 5}
  width: {type: number, default: 2}
  gravel_pitch: {type: number, default: 0.8}
  dirt_vol: {type: number, default: 0.8}
  dirt_pitch: {type: number, default: 0.9}
  dirt: {type: bool, default: false}
  flatten: {type: bool, default: false}
  spark: {type: string, default: tool-shovel-stone}
  trail_span: {type: number, default: 6}
  metallic: {type: bool, default: false}
  bright: {type: bool, default: false}
frames:
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: w, to: 0}
      - {at: 0, for: 4, about: w, to: -45, ease: out_cubic}
      - {at: 4, for: 3, about: w, to: 0, ease: out_cubic}
      - {at: 0, for: 0, about: s, to: -30}
      - {at: 0, for: 4, about: s, to: -50, ease: out_quad}
      - {at: 4, for: 3, about: s, to: 25, ease: out_cubic}
      - {at: 7, for: 3, about: s, to: -25, ease: out_cubic}
      - {at: 10, for: 3, about: s, to: -30, ease: in_out_sine}
  - id: tool
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 4, about: s, to: -65, ease: out_quad}
      - {at: 4, for: 3, about: s, to: 35, ease: out_cubic}
      - {at: 7, for: 3, about: s, to: -60, ease: out_cubic}
      - {at: 10, for: 3, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
lines:
  edge: {frame: tool, from: {v: 0.4}, to: {v: 0.9}}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 5
      then: cast
      do:
        - {id: rig, op: rig, frame: tool, for: 13, detach: true}
        - {id: trail, op: particle, particle: dust, along: edge, samples: 5, count: 1, color: "#856349", size: 0.35, extra: 0, at: 4, every: 2, for: "${trail_span}", detach: true}
        - {id: wind, op: sound, sound: entity.player.attack.sweep, frame: body, at: 3, volume: 0.35, pitch: 0.65}
    cast:
      for: 1
      then: end
      do:
        - {id: bridge, op: place_shape, frame: body, shape: {bridge: {length: "${length}", width: "${width}"}}, block: "astera:packed_clay", consume: none, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, sound: block.packed_mud.place, frame: body, volume: 1.0, pitch: "${gravel_pitch}"}
        - {id: snd_2, op: sound, sound: block.rooted_dirt.place, frame: body, volume: "${dirt_vol}", pitch: "${dirt_pitch}", when: "= ${dirt}"}
        - {id: snd_3, op: sound, sound: block.packed_mud.place, frame: body, volume: 0.8, pitch: 0.9, when: "= ${flatten}"}
        - {id: wave_0, op: particle, particle: block_crumble, block: minecraft:clay, frame: body, pos: {v: "= 1 + (0 / 2.0) * (${length} - 1)", w: 0.15, s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: 6, offset: [0.14, 0.14, 0.14], extra: 0.08, at: 0}
        - {id: wave_1, op: particle, particle: block_crumble, block: minecraft:clay, frame: body, pos: {v: "= 1 + (1 / 2.0) * (${length} - 1)", w: 0.15, s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: 6, offset: [0.14, 0.14, 0.14], extra: 0.08, at: 2, detach: true}
        - {id: wave_2, op: particle, particle: block_crumble, block: minecraft:clay, frame: body, pos: {v: "= 1 + (2 / 2.0) * (${length} - 1)", w: 0.15, s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: 6, offset: [0.14, 0.14, 0.14], extra: 0.08, at: 4, detach: true}
        - {id: wave_quarter, op: particle, particle: block_crumble, block: minecraft:clay, frame: body, pos: {v: "= 1 + (0.5 / 2.0) * (${length} - 1)", w: 0.15, s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: 6, offset: [0.14, 0.14, 0.14], extra: 0.08, at: 1, detach: true}
        - {id: wave_three_quarters, op: particle, particle: block_crumble, block: minecraft:clay, frame: body, pos: {v: "= 1 + (1.5 / 2.0) * (${length} - 1)", w: 0.15, s: "= i - floor(${width} / 2.0)"}, times: "${width}", count: 6, offset: [0.14, 0.14, 0.14], extra: 0.08, at: 3, detach: true}
        - {id: material_accent, op: particle, particle: block_crumble, block: minecraft:clay, count: 12, extra: 0.03, frame: body, pos: {v: 2, w: 0.15}}
        - {id: metal, op: particle, particle: electric_spark, frame: body, pos: {v: 2, w: 0.15}, count: 12, offset: [0.14, 0.14, 0.14], extra: 0.12, at: 0, when: "= ${metallic}"}
        - {id: diamond_flash, op: particle, particle: dust, frame: body, pos: {v: 2, w: 0.15}, count: 12, offset: [0.14, 0.14, 0.14], extra: 0, at: 0, color: "#64f5ef", size: 0.8, when: "= ${bright}"}
        - {id: diamond_glint, op: particle, particle: end_rod, frame: body, pos: {v: 2, w: 0.15}, count: 6, offset: [0.14, 0.14, 0.14], extra: 0.04, at: 2, detach: true, when: "= ${bright}"}
        - {id: metal_rim, op: particle, particle: electric_spark, frame: body, pos: {v: "= 2 + 0.8 * cos(i * 2 * pi / 16)", w: 0.15, s: "= 0.8 * sin(i * 2 * pi / 16)"}, times: 16, count: 1, extra: 0.02, when: "= ${metallic}"}
        - {id: ring, op: sound, sound: block.anvil.land, frame: body, pos: {v: 2, w: 0.15}, volume: 0.18, pitch: 1.4, when: "= ${metallic}"}
        - {id: chime, op: sound, sound: block.amethyst_block.chime, frame: body, pos: {v: 2, w: 0.15}, volume: 0.6, pitch: 1.3, when: "= ${bright}"}
        - {id: settle, op: sound, sound: block.gravel.step, frame: body, pos: {v: 2, w: 0.15}, at: 5, detach: true, volume: 0.4, pitch: 0.75}
    end: {final: true}
