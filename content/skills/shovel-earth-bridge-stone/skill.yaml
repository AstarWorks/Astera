# astera/v3 hand port of the v2 skill.yaml + look.yaml (tick for tick).
apiVersion: astera/v3
kind: Skill
id: shovel-earth-bridge-stone
item: stone-shovel
meta: {name: {ja: "石の土橋", en: "Stone Earth Bridge"}, description: {ja: "目の前に固めた粘土の橋を架ける。", en: "Lays a packed-clay bridge ahead of you."}, cooldown_ticks: 300, resource_cost: 0, tags: [tool, cover]}
anchors:
  - {id: spark,  anchor: caster, offset: {forward: 2.0}}      # was pt_caster_0_0_2 (feet, yaw-only)
machine:
  start: cast
  states:
    cast:
      for: 1
      then: end
      do:
        - {id: bridge, op: place_shape, at: 0, anchor: caster, shape: {bridge: {length: 5, width: 2}}, block: "astera:packed_clay", consume: none, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, sound: block.gravel.break, anchor: caster, volume: 1.0, pitch: 0.8}
        - {id: fx, op: particle_def, def: tool-shovel-stone, anchor: spark}
    end: {final: true}
