# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: shortbow-snare

name:
  ja: "足止めの矢"
  en: "Snare Arrow"
description:
  ja: "当たった相手の足を鈍らせる。"
  en: "Slows whoever it hits."

archetype: projectile
cooldown_ticks: 120
resource_cost: 8
tags: [ ranged, physical, control ]

params:
  type: projectile
  launch_speed: 2.6
  max_lifetime_ticks: 40
  visual:
    trail_spacing: 0.4
    trail:
      - type: point
        particles:
          - { id: crit, offset: { x: 0.04, y: 0.04, z: 0.04 } }
          - { id: dust, color: { r: 120, g: 120, b: 120 }, scale: 0.9 }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/sword-swing
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 0.9 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 0.9, height: -0.25 }
      particle_id: gun-muzzle-smoke
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 14 }
          attribute: physical
    - type: apply_status
      targets: { type: target }
      status_id: sinking
      effect_duration_ticks: { type: literal, value: 80 }
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/blade-hit
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.0 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
  hit_block:
    - type: play_sound
      targets: { type: hit_location }
      sound_id: astera:weapons/gun-impact-block
      volume: { type: literal, value: 0.5 }
      pitch: { type: literal, value: 1.5 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: hit-spark
  miss: []
  expire: []
