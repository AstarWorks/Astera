apiVersion: astera/v3
kind: Skill
id: throwing-knives-slip
item: throwing-knives
meta:
  name: {ja: "すり抜け", en: "Slip Away"}
  description: {ja: "後ろへ跳んで間合いを取る。", en: "Hops back to break contact."}
  cooldown_ticks: 120
  resource_cost: 0
  tags: [buff, movement]
# GAP: gameplay.expose (duration <- evasive_ticks) -> none (inline literal)
anchors:
  - {id: puff_pt, anchor: caster, offset: {up: 0.2}}
machine:
  start: main
  states:
    main:
      for: 1
      then: end
      do:
        - {id: buff, op: status, target: caster, status: evasive, stacks: 1, for: 25}
        # GAP: propel {direction: axis(caster,"forward"), strength: -1.0} -> impulse (fields not spelled in ADR 10.1b); row below is the closest form
        - {id: propel, op: impulse, target: caster, direction: "= axis(caster, \"forward\")", strength: -1.0}
        - {id: snd, op: sound, sound: "astera:weapons/dash-whoosh", anchor: caster, volume: 0.8, pitch: 1.3}
        - {id: puff, op: particle_def, def: dash-cloud, anchor: puff_pt}
    end: {final: true}
