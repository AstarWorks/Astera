# throwing-knives-slip: hop back and become evasive for a moment. Written from zero on the rev4.10 grammar (ADR-0303).
apiVersion: astera/v3
kind: Skill
id: throwing-knives-slip
item: throwing-knives
meta: {name: {ja: "すり抜け", en: "Slip Away"}, description: {ja: "後ろへ跳んで間合いを取る。", en: "Hops back to break contact."}, cooldown_ticks: 120, resource_cost: 0, tags: [buff, movement]}
params:
  hop_forward:   {type: number, default: -1.0}    # negative = backwards
  evasive_ticks: {type: ticks, default: 25}
anchors:
  - {id: puff_pt, anchor: caster, offset: {up: 0.2}, mode: follow}
machine:
  start: main
  states:
    main:
      for: 1
      then: end
      do:
        - {id: buff, op: status, at: 0, target: caster, status: evasive, stacks: 1, for: "${evasive_ticks}"}
        - {id: propel, op: impulse, at: 0, target: caster, vector: {of: caster, forward: "${hop_forward}"}}
        - {id: snd, op: sound, at: 0, sound: "astera:weapons/dash-whoosh", anchor: caster, volume: 0.8, pitch: 1.3}
        - {id: puff, op: particle_def, at: 0, def: dash-cloud, anchor: puff_pt}
    end: {final: true}
