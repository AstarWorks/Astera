# throwing-knives-slip: hop back and become evasive for a moment, in the frame grammar (ADR-0314). Gameplay (evasive 25 ticks, impulse -1.0 forward) unchanged.
# One frame, `feet`: the caster's feet, v forward / w up / s right (it follows the caster). The hop sound is a point of it and the dash cloud
# sits 0.2 above it, where the hop starts.
apiVersion: astera/v3
kind: Skill
id: throwing-knives-slip
item: throwing-knives
meta: {name: {ja: "すり抜け", en: "Slip Away"}, description: {ja: "後ろへ跳んで間合いを取る。", en: "Hops back to break contact."}, cooldown_ticks: 120, resource_cost: 0, tags: [buff, movement]}
params:
  hop_forward:   {type: number, default: -1.0}    # negative = backwards
  evasive_ticks: {type: ticks, default: 25}
frames:
  - id: feet
    origin: caster
    v: forward
    w: up
    s: v x w
machine:
  start: main
  states:
    main:
      for: 1
      then: end
      do:
        - {id: buff, op: status, at: 0, target: caster, status: evasive, stacks: 1, for: "${evasive_ticks}"}
        - {id: propel, op: impulse, at: 0, target: caster, vector: {of: caster, forward: "${hop_forward}"}}
        - {id: snd, op: sound, at: 0, sound: "astera:weapons/dash-whoosh", frame: feet, volume: 0.8, pitch: 1.3}
        - {id: puff, op: particle_def, at: 0, def: dash-cloud, frame: feet, pos: {w: 0.2}}
    end: {final: true}
