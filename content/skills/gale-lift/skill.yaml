apiVersion: "astera/v3"
kind: Skill
id: gale-lift
item: gale-fan
meta: {name: {ja: "追い風", en: Updraft}, description: {ja: "自分を前上方へ吹き飛ばす。", en: "Launches you up and forward."}, cooldown_ticks: 160, resource_cost: 10, tags: [magic, wind, movement]}
anchors:
  feet_fx: {anchor: caster.body, offset: {up: 0.2}, mode: snapshot}
presentation:
  timeline:
    - at: 0
      do:
        - {id: snd, op: sound, sound: entity.breeze.jump, anchor: caster, volume: 0.9, pitch: 1.1}
        - {id: fx, op: particle_def, def: dash-cloud, anchor: feet_fx}
gameplay:
  timeline:
    - at: 0
      do:
        # GAP: propel (forward 1.0 then up 0.6, two ops) -> impulse is the closest op; propel semantics (velocity set vs add, axis(caster, "forward") horizontal vs look) unverified
        - {id: lift, op: impulse, target: caster, vector: "= look(caster) * 1.0 + vec(0.0, 0.6, 0.0)"}
