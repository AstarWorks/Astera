apiVersion: astera/v3
kind: Skill
id: gale-lift
item: gale-fan
meta: {name: {ja: "追い風", en: Updraft}, description: {ja: "自分を前上方へ吹き飛ばす。", en: "Launches you up and forward."}, cooldown_ticks: 160, resource_cost: 10, tags: [magic, wind, movement]}
params:
  propel:   {type: number, default: 1.0}
  propel_2: {type: number, default: 0.6}
anchors:
  - {id: feet_fx, anchor: caster, offset: {up: 0.2}}   # was pt_caster_0_0p2_0
machine:
  start: lift
  states:
    lift:
      for: 1
      then: end
      do:
        - {id: propel, op: impulse, at: 0, target: caster, vector: {of: caster, forward: "${propel}"}}
        - {id: propel_2, op: impulse, at: 0, target: caster, vector: {x: 0, y: "${propel_2}", z: 0}}
        - {id: snd, op: sound, at: 0, sound: entity.breeze.jump, anchor: caster, volume: 0.9, pitch: 1.1}
        - {id: fx, op: particle_def, at: 0, def: dash-cloud, anchor: feet_fx}
    end: {final: true}
