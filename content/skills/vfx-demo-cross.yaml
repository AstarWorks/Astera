# ADR-0220 demo: plays content/vfx/demo-cross.yaml in front of the caster. Not bound to any
# item; cast it with `caster.cast(...)` in the simulator.

id: vfx-demo-cross

name:
  ja: "デモ・十字斬"
  en: "Demo Cross Slash"
description:
  ja: "表示エンティティの演出（十字の斬撃・文字フラッシュ）を再生するデモ。"
  en: "Plays a display-entity choreography: a crimson cross slash with a glyph flash."

archetype: aoe
cooldown_ticks: 60
tags: [ demo, vfx ]

params:
  type: aoe
  radius: 4.0
  falloff: linear
  damage:
    - base: { type: literal, value: 1.0 }
      attribute: physical

phases:
  type: aoe
  cast:
    - type: play_vfx
      targets: { type: caster }
      vfx_id: demo-cross
  hit_entity: []
  expire: []
