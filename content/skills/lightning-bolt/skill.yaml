# Wave 2 v3 draft (basic-ac): ported 1:1 from the v2 skill.yaml + look.yaml. GAP comments mark what v3 cannot spell yet.
apiVersion: astera/v3
kind: Skill
id: lightning-bolt
item: thunder-staff
meta:
  name: {ja: "稲妻", en: "Lightning Bolt"}
  description: {ja: "電撃の閃光を一直線に放ち、対象を麻痺させる。", en: "Hurls a crackling bolt of lightning that can paralyze the target."}
  cooldown_ticks: 35
  resource_cost: 30
  tags: [ranged, electric-family, stun]
params:
  launch_speed: {type: number, default: 3.0}
  max_lifetime_ticks: {type: ticks, default: 40}
  dmg_electric: {type: number, default: 25.0}
  shock_ticks: {type: ticks, default: 30}
anchors:
  - {id: origin, anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}       # was pt_aim_0_0_0p5
  - {id: muzzle, anchor: caster.eye, offset: {up: -0.2, forward: 1.0}, mode: snapshot}   # was pt_aim_0_m0p2_1
  - {id: heart, anchor: victim.body, offset: {up: 0.2}}                            # was pt_enemy_0_1_0
  - {id: feet, anchor: victim.body, offset: {up: -0.6}}                            # was pt_enemy_0_0p2_0
  - {id: sky, anchor: victim.body, offset: {up: 7.2}}                              # was pt_enemy_0_8_0
machine:
  start: fly
  states:
    fly:
      for: "= max_lifetime_ticks"
      then: end
      enter:
        - id: bolt
          op: projectile
          origin: origin
          velocity: "= look(caster) * launch_speed"
          for: "= max_lifetime_ticks"
          radius: 0.5
          hit: {targets: enemies, once: true}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, components: [{kind: electric, amount: "= dmg_electric"}]}
              - {id: st_shock, op: status, target: event.victim, status: shock, stacks: 1, for: "= shock_ticks", when: "= rand() < 0.6"}
              # GAP: summon_lightning {at: enemy, visual_only: true} (vanilla lightning visual) -> none.
              - {id: lightning, op: summon_lightning, anchor: heart, visual_only: true}
              # GAP: break_area chip (sphere 1.0, block_damage 25, breaks, not staged) -> none in v3; kept verbatim, v2 `at: contact.point` is `anchor: contact`.
              - {id: chip, op: break_area, shape: sphere, radius: 1.0, block_damage: 25, breaks: true, staged: false, length: 0.0, anchor: contact}
              - {id: snd_hit, op: sound, sound: "astera:skills/lightning-impact", anchor: heart, volume: 0.7, pitch: 1.3}
              - {id: fx_impact, op: particle_def, def: thunder-impact, anchor: heart}
              # GAP: the sky strike column (v2 emit_3..emit_33: 4-segment electric_spark and end_rod zigzag falling from enemy+8 with roll()-jittered vertices, 3 strands) -> none (needs a jittered polyline particle).
              # GAP: hit rings at hit+1..hit+3 (electric_spark, 14 points, speed 0.1, radius 1.1667/1.8333/2.5 at enemy+0.2, random phase) -> directions kept, radius shift and phase have no v3 field.
              - id: hit_rings
                at: 1
                every: 1
                times: 3
                do:
                  - {id: ring_hit, op: particle, particle: electric_spark, anchor: feet, at: 0, times: 14, count: 0, offset: "= vec(cos(6.283185307179586 * i / 14), 0.0, -sin(6.283185307179586 * i / 14))", extra: 0.1}
            block:
              - {id: chip_blk, op: break_area, shape: sphere, radius: 1.0, block_damage: 25, breaks: true, staged: false, length: 0.0, anchor: contact}
              # GAP: block rings at block+1..block+3 (same shape as the hit rings, at contact.point): radius shift and phase have no v3 field.
              - id: block_rings
                at: 1
                every: 1
                times: 3
                do:
                  - {id: ring_blk, op: particle, particle: electric_spark, anchor: contact, at: 0, times: 14, count: 0, offset: "= vec(cos(6.283185307179586 * i / 14), 0.0, -sin(6.283185307179586 * i / 14))", extra: 0.1}
      do:
        - id: mesh
          op: display
          kind: item
          item: minecraft:end_rod
          context: none
          anchor: bolt
          scale: [0.8, 0.8, 0.8]
          until: end
          motion:
            - {law: follow, anchor: bolt, step: 1}
        - {id: snd_cast, op: sound, sound: "astera:skill/wand/cast", anchor: caster, at: 0, volume: 0.45, pitch: 1.8}
        - {id: fx_cast, op: particle_def, def: thunder-cast, anchor: muzzle, at: 0}
        - id: trail
          at: 0
          every: 1
          until: end
          do:
            - {id: tr_spark, op: particle, particle: electric_spark, anchor: {of: bolt, sweep: 0.5}, count: 4, offset: [0.15, 0.15, 0.15], extra: 0.05}
            - {id: tr_rod, op: particle, particle: end_rod, anchor: {of: bolt, sweep: 0.5}, count: 1, offset: [0.02, 0.02, 0.02], extra: 0}
            # GAP: 8 trail strands (rep3..rep10: electric_spark and end_rod, 3-segment zigzag along the flight axis with roll()-jittered vertices +-0.25, length 0.9) -> none (jittered polyline particle).
    end: {final: true}
