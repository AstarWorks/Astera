apiVersion: astera/v3
kind: Skill
id: lightning-bolt
item: thunder-staff
meta:
  name: {ja: "稲妻", en: "Lightning Bolt"}
  description: {ja: "電撃の閃光を一直線に放ち、対象を麻痺させる。", en: "Hurls a crackling bolt of lightning that can paralyze the target."}
  cooldown_ticks: 35
  resource_cost: 30
  tags: [ranged, electric-family, stun]
params:
  launch_speed: {type: number, default: 3.0}
  max_lifetime_ticks: {type: ticks, default: 40}
  dmg_electric: {type: number, default: 25.0}
  shock_ticks: {type: ticks, default: 30}
anchors:
  - {id: origin, anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}       # was pt_aim_0_0_0p5
  - {id: muzzle, anchor: caster, offset: {up: -0.2, forward: 1.0}, mode: snapshot}   # was pt_caster_0_m0p2_1 (feet, yaw-only)
  - {id: heart, anchor: victim.root, offset: {up: 1.0}, mode: follow}
  - {id: feet, anchor: victim.root, offset: {up: 0.2}, mode: follow}
  - {id: sky, anchor: victim.root, offset: {up: 8.0}, mode: follow}
machine:
  start: fly
  states:
    fly:
      for: "= max_lifetime_ticks"
      then: end
      on:
        - {event: bolt.end, to: end}      # v2: the cast ends when the projectile body ends (manager ruling 2026-10-29)
      enter:
        - id: bolt
          op: projectile
          origin: origin
          velocity: "= look(caster) * ${launch_speed}"
          for: "= max_lifetime_ticks"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {electric: "${dmg_electric}"}}
              - {id: st_shock, op: status, target: event.victim, status: shock, stacks: 1, for: "${shock_ticks}", when: "= roll('shock') < 0.6"}
              - {id: lightning, op: lightning, anchor: victim.root, visual_only: true}
              - {id: chip, op: break_area, anchor: contact, shape: {sphere: {radius: 1.0, ahead: 4.0}}, tool: none, block_damage: 25, ripple: 29, revert: 200, outside_arena: false}
              - {id: snd_hit, op: sound, sound: "astera:skills/lightning-impact", anchor: heart, volume: 0.7, pitch: 1.3}
              - {id: fx_impact, op: particle_def, def: thunder-impact, anchor: heart}
              - {id: fx_sky_spark, op: particle, particle: electric_spark, anchor: sky, count: 1}
              - {id: fx_sky_rod, op: particle, particle: end_rod, anchor: sky, count: 1}
              - {id: fx_burst_spark, op: particle, particle: electric_spark, anchor: feet, count: 40, extra: 0.35}
              - {id: fx_burst_rod, op: particle, particle: end_rod, anchor: feet, count: 12, extra: 0.25}
              - {id: fx_burst_spark0, op: particle, particle: electric_spark, anchor: feet, count: 0, extra: 0.1}
            block:
              - {id: chip_blk, op: break_area, anchor: contact, shape: {sphere: {radius: 1.0, ahead: 4.0}}, tool: none, block_damage: 25, ripple: 29, revert: 200, outside_arena: false}
              - {id: snd_blk, op: sound, sound: "astera:skills/lightning-impact", anchor: contact, volume: 0.5, pitch: 1.6}
              - {id: fx_blk_spark, op: particle, particle: electric_spark, anchor: contact, count: 40, extra: 0.35}
              - {id: fx_blk_rod, op: particle, particle: end_rod, anchor: contact, count: 12, extra: 0.25}
              - {id: fx_blk_spark0, op: particle, particle: electric_spark, anchor: contact, count: 0, extra: 0.1}
            expire:
              - {id: fx_exp, op: particle_def, def: thunder-impact-glow, anchor: contact}
      do:
        - id: mesh
          op: display
          kind: item
          item: minecraft:end_rod
          context: none
          anchor: bolt
          scale: [0.8, 0.8, 0.8]
          until: bolt.end
        - {id: snd_cast, op: sound, sound: "astera:skill/wand/cast", anchor: caster, at: 0, volume: 0.45, pitch: 1.8}
        - {id: fx_cast, op: particle_def, def: thunder-cast, anchor: muzzle, at: 0}
        - {id: tr_spark, op: particle, particle: electric_spark, anchor: {of: bolt, sweep: 0.5}, count: 4, offset: [0.15, 0.15, 0.15], extra: 0.05, at: 0, every: 1, until: bolt.end}
        - {id: tr_rod, op: particle, particle: end_rod, anchor: {of: bolt, sweep: 0.5}, count: 1, offset: [0.02, 0.02, 0.02], at: 0, every: 1, until: bolt.end}
        - {id: tr_spark2, op: particle, particle: electric_spark, anchor: {of: bolt, sweep: 0.5}, count: 1, at: 0, every: 1, until: bolt.end}
        - {id: tr_rod2, op: particle, particle: end_rod, anchor: {of: bolt, sweep: 0.5}, count: 1, at: 0, every: 1, until: bolt.end}
    end: {final: true}
