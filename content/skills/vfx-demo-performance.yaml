# ADR-0254 performance demo: plays content/vfx/demo-performance.yaml (skin-rig body + one hand-parented weapon). No hide_held_item
# step: the performance claims the hand/body lease itself. Not bound to any item; cast it with `caster.cast(...)` in the simulator.

id: vfx-demo-performance

name:
  ja: "デモ・身体と武器の演技"
  en: "Demo Performance"
description:
  ja: "スキンリグの身体と、その右手に付いた1本の武器が同じ時計で動くデモ。"
  en: "A skin-rig body and one weapon hanging from its right hand, played on one clock."

archetype: aoe
cooldown_ticks: 60
tags: [ demo, vfx ]

params:
  type: aoe
  radius: 4.0
  falloff: linear
  damage:
    - base: { type: literal, value: 1.0 }
      attribute: physical

phases:
  type: aoe
  cast:
    - type: play_vfx
      targets: { type: caster }
      vfx_id: demo-performance
      freeze: [ { at: 9, ticks: 2 } ]
  hit_entity: []
  expire: []
