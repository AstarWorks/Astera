# Match arsenal (wp/match-arsenal, batch 2): simple PvP skill. One cast sound, a few particles.

id: grapple-shot

name:
  ja: "フック射出"
  en: "Grapple Shot"
description:
  ja: "フックを撃ち、壁なら自分が、敵なら相手が引かれる。"
  en: "Fires a hook: reels you to a wall, or the enemy to you."

archetype: projectile
cooldown_ticks: 120
resource_cost: 10
tags: [ ranged, utility, movement ]

params:
  type: projectile
  launch_speed: 2.4
  max_lifetime_ticks: 40
  visual:
    trail_spacing: 0.4
    trail:
      - type: point
        particles:
          - { id: crit, offset: { x: 0.02, y: 0.02, z: 0.02 } }
          - { id: dust, color: { r: 120, g: 120, b: 120 }, scale: 0.8 }

phases:
  type: projectile
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: block.chain.place
      volume: { type: literal, value: 0.9 }
      pitch: { type: literal, value: 1.2 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 0.9, height: -0.25 }
      particle_id: hit-spark
  hit_entity:
    - type: damage
      targets: { type: target }
      components:
        - base: { type: literal, value: 5 }
          attribute: physical
    - type: knockback
      targets: { type: target }
      direction: { type: toward_caster, vertical: 0.2 }
      strength: { type: literal, value: 1.2 }
    - type: play_sound
      targets: { type: target }
      sound_id: block.chain.place
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 0.8 }
    - type: spawn_particle
      targets: { type: target_offset, offset: { type: literal, value: { x: 0.0, y: 1.2, z: 0.0 } } }
      particle_id: hit-spark
  hit_block:
    - type: propel
      targets: { type: caster }
      direction: { type: from_caster }
      strength: { type: literal, value: 1.3 }
    - type: propel
      targets: { type: caster }
      direction: { type: up }
      strength: { type: literal, value: 0.4 }
    - type: play_sound
      targets: { type: hit_location }
      sound_id: block.chain.place
      volume: { type: literal, value: 0.8 }
      pitch: { type: literal, value: 0.8 }
    - type: spawn_particle
      targets: { type: hit_location }
      particle_id: hit-spark
  miss: []
  expire: []
