# Match arsenal (wp/match-arsenal): simple PvP skill. One cast sound, a few particles.

id: war-axe-whirl

name:
  ja: "旋風斬り"
  en: "Whirl"
description:
  ja: "回転して周囲の敵をまとめて斬る。"
  en: "Spins and cuts everyone around you."

archetype: aoe
cooldown_ticks: 120
resource_cost: 15
tags: [ aoe, physical ]

params:
  type: aoe
  radius: 3.5
  falloff: linear
  damage:
    - base: { type: literal, value: 35.0 }
      attribute: physical

phases:
  type: aoe
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/blade-heavy-swing
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 1.2 }
    - type: schedule_particle_animation
      targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 0.15, z: 0.0 } } }
      animation:
        - type: ring
          period_ticks: 6
          points: 16
          start_radius: 0.5
          end_radius: 3.5
          particles:
            - { id: crit, count: 0, extra: 0.03 }
            - { id: dust, color: { r: 220, g: 220, b: 220 }, scale: 1.4 }
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/blade-hit
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.0 }
  expire: []
