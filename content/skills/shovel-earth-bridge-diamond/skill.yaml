# astera/v3 hand port of the v2 skill.yaml + look.yaml (tick for tick).
apiVersion: astera/v3
kind: Skill
id: shovel-earth-bridge-diamond
item: diamond-shovel
meta: {name: {ja: "ダイヤの土橋", en: "Diamond Earth Bridge"}, description: {ja: "目の前に固めた粘土の橋を架ける。", en: "Lays a packed-clay bridge ahead of you."}, cooldown_ticks: 160, resource_cost: 0, tags: [tool, cover]}
anchors:
  - {id: spark,  anchor: caster.eye, offset: {forward: 2.0}}      # was pt_aim_0_0_2
machine:
  start: cast
  states:
    cast:
      for: 1
      then: end
      do:
        - {id: bridge, op: place_shape, at: 0, anchor: caster, shape: {bridge: {length: 9, width: 3}}, block: "astera:packed_clay", consume: none, ripple: 29, revert: 200, outside_arena: false}
        - {id: snd, op: sound, sound: "astera:weapons/gun-impact-block", anchor: caster, volume: 1.0, pitch: 1.0}
        - {id: fx, op: particle_def, def: hit-spark, anchor: spark}
    end: {final: true}
