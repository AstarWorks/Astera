# Wave 2 v3 draft of bastion-greatsword-ego (v2: skill.yaml + look.yaml), generated from the v2 files by a scratch script, gameplay hand-authored.
# Offsets [left, up, forward] -> name-keyed maps. Euler turn [pitch, yaw, roll] -> pose list [up -yaw, left pitch, forward roll].
# The v2 slam sword is built from block parts parented to a rig frame (hand: false), not the held item blade: those 2 rigs and their 14 blocks are GAP comments below.
# GAP: v2 gameplay.expose (damage -> dmg_physical, range -> reach) -> none (no expose field in v3 params)
# GAP: v2 `frames: tele` (inactive body frame at world, placed like the caster at tick 20 by `place`) -> a doc-level anchor is taken at cast start
apiVersion: astera/v3
kind: Skill
id: bastion-greatsword-ego
item: bastion-greatsword
meta:
  name: {ja: "城塞の暁", en: "Citadel Dawn"}
  description: {ja: "大盾を掲げて跳び、剣を突き立てて黄金の稲妻を放つ。E.G.Oゲージを全て消費する。", en: "Raise the barrier, leap and plant the blade in a burst of golden lightning. Consumes the full E.G.O gauge."}
  cooldown_ticks: 300
  resource_cost: 0
  ego_cost: 100
  tags: [aoe, physical, finisher, charge]
params:
  propel: {type: number, default: 0.3}
  dash_distance: {type: blocks, default: 2.8}
  arc_deg: {type: number, default: 110}
  reach: {type: blocks, default: 3.8}
  dmg_physical: {type: number, default: 140}
  knockback: {type: number, default: 1.6}
anchors:
  # v2: frame fx1_bastion_ego_guard at caster orient yaw follow, group tick 0
  # GAP: anchor teleport_ticks 2 -> none (engine-owned teleport_duration)
  - {id: fx1_guard, anchor: caster, mode: follow}
  # v2: frame fx4_bastion_ego_slam at caster orient yaw, group tick 27
  # NOTE: v2 created this frame at tick 27; a doc-level anchor exists from tick 0 and follows the caster the same way
  - {id: fx4_slam, anchor: caster, mode: snapshot}
machine:
  start: slam
  states:
    slam:
      for: 70
      then: end
      do:
        # --- gameplay (v2 gameplay.timeline t0 / t20 / t31) ---
        # v2 lock speed 0.0 ticks 20 -> lock move for 20 ticks (pitch / yaw stay free; v2 locked only speed).
        - {id: windup_lock, op: lock, at: 0, for: 20, move: true}
        # GAP: place frame tele like caster at tick 20 -> none (see header; the telegraph anchor `tele` is a cast-start snapshot)
        # v2 propel direction (0,1,0) strength 0.3 -> impulse (0, 0.3, 0).
        - {id: propel, op: impulse, at: 20, target: caster, vector: [0.0, "= propel", 0.0]}
        # v2 dash_strike 2.8 over 6 ticks -> speed 2.8/6.
        # GAP: dash_strike hit_once: true -> none (dash has no hit_once)
        - {id: dash, op: dash, at: 20, speed: "= dash_distance / 6", for: 6, radius: 0.3, stop_before_target: 1.6, invulnerable: true, stop_on_block: true, follow_pitch: false}
        # v2 sel (damage 140 per_stack charge 0.5 consume true, ignore_invulnerability) + sel_2 (freeze 4, knockback) are the same sector at the same tick: merged.
        # sector {angle 110, range 3.8, height 2.0} at `eye` with forward caster.forward -> origin anchor caster.eye (full look basis, includes pitch).
        # GAP: hit max_count: 1 -> none (a once-window hit can touch several victims)
        # GAP: damage per_stack {status: charge, amount: 0.5, on: caster, consume: true} -> none (inline hit damage is a flat number)
        # GAP: damage ignore_invulnerability: true -> none
        # GAP: freeze ticks 4 scope [enemy, caster] -> none
        - {id: hit1, op: hit, at: 31, anchor: caster.eye, shape: {sector: {deg: "${arc_deg}", range: "${reach}", height: 2.0}}, targets: enemies, damage: {physical: "${dmg_physical}"}, window: once}
      on:
        - event: hit1
          do:
            - {id: kb, op: knockback, target: event.victim, direction: "= normalize(flat(pos(event.victim) - pos(caster))) + vec(0.0, 0.3, 0.0)", strength: "${knockback}"}
    end: {final: true}
presentation:
  timeline:
      - id: fx0
        at: 0
        do:
# GAP: plate see_through: true on a sprite -> none (see_through is kind: text only)
# GAP: plate frame_ticks 30 (animated sprite frame stepping) -> none
          - {id: fx1_guard_rim0r, op: display, kind: sprite, sprite: bastion-rim, size: [3.712, 1.92], anchor: fx1_guard, brightness: {block: 15, sky: 15}, offset: {left: 0.2, up: 1.3, forward: 1.15}, rotate: [{axis: up, deg: 39.0405}, {axis: left, deg: -39.0405}, {axis: forward, deg: 83.72263}], for: 30}
# GAP: plate see_through: true on a sprite -> none (see_through is kind: text only)
# GAP: plate frame_ticks 30 (animated sprite frame stepping) -> none
          - {id: fx1_guard_rim0l, op: display, kind: sprite, sprite: bastion-rim, size: [3.712, 1.92], anchor: fx1_guard, brightness: {block: 15, sky: 15}, offset: {left: 0.2, up: 1.3, forward: 1.15}, rotate: [{axis: up, deg: 39.0405}, {axis: left, deg: 39.0405}, {axis: forward, deg: -83.72263}], for: 30}
# GAP: plate see_through: true on a sprite -> none (see_through is kind: text only)
# GAP: plate frame_ticks 30 (animated sprite frame stepping) -> none
          - {id: fx1_guard_rim1r, op: display, kind: sprite, sprite: bastion-rim, size: [3.072, 1.408], tint: "#FFF3C8", anchor: fx1_guard, brightness: {block: 15, sky: 15}, offset: {left: 0.2, up: 1.3, forward: 1.15}, rotate: [{axis: up, deg: 39.0405}, {axis: left, deg: -39.0405}, {axis: forward, deg: 83.72263}], for: 30}
# GAP: plate see_through: true on a sprite -> none (see_through is kind: text only)
# GAP: plate frame_ticks 30 (animated sprite frame stepping) -> none
          - {id: fx1_guard_rim1l, op: display, kind: sprite, sprite: bastion-rim, size: [3.072, 1.408], tint: "#FFF3C8", anchor: fx1_guard, brightness: {block: 15, sky: 15}, offset: {left: 0.2, up: 1.3, forward: 1.15}, rotate: [{axis: up, deg: 39.0405}, {axis: left, deg: 39.0405}, {axis: forward, deg: -83.72263}], for: 30}
# GAP: plate see_through: true on a sprite -> none (see_through is kind: text only)
# GAP: plate frame_ticks 30 (animated sprite frame stepping) -> none
          - {id: fx1_guard_crest, op: display, kind: sprite, sprite: bastion-crest, size: [1.664, 1.664], anchor: fx1_guard, brightness: {block: 15, sky: 15}, offset: {left: 0.2, up: 1.35, forward: 1.15}, rotate: [{axis: up, deg: 50.0}], for: 30}
# GAP: quad colour #FFD66E on a text display -> none (text display has no colour field)
# GAP: track keys alpha [0.0, 0.14, 0.14, 0.0] -> none (no alpha channel on keys; text_opacity via fade law only)
          - {id: fx1_guard_fill, op: display, kind: text, text: "●", text_opacity: 0, anchor: fx1_guard, brightness: {block: 15, sky: 15}, offset: {left: 0.2, up: 1.3, forward: 1.15}, rotate: [{axis: up, deg: 50.0}], for: 30}
          - {id: fx1_guard_fill, op: display, kind: text, text: "●", text_opacity: 0, anchor: fx1_guard, brightness: {block: 15, sky: 15}, offset: {left: 0.2, up: 1.3, forward: 1.15}, rotate: [{axis: up, deg: 50.0}], for: 30, motion: [{law: keys, keys: [{t: 0, offset: {left: 0.2, up: 1.3, forward: 1.15}, pose: [{axis: up, deg: 50.0}], scale: [0.3, 0.6, 1.0]}, {t: 6, scale: [1.5, 3.3, 1.0], ease: out_cubic}, {t: 22}, {t: 30, scale: [1.4, 3.1, 1.0], ease: in_quad}]}]}
          # v2 sound pitch 0.6 -> 1.8 over 25 ticks (in_quad), every 5, until stop_sound at tick 30: unrolled to one sound per repeat with the pitch sampled at its tick
          - {id: snd, op: sound, sound: block.amethyst_block.resonate, anchor: caster, at: 0, volume: 1.0, pitch: 0.6}
          - {id: snd_1, op: sound, sound: block.amethyst_block.resonate, anchor: caster, at: 5, volume: 1.0, pitch: 0.648}
          - {id: snd_2, op: sound, sound: block.amethyst_block.resonate, anchor: caster, at: 10, volume: 1.0, pitch: 0.792}
          - {id: snd_3, op: sound, sound: block.amethyst_block.resonate, anchor: caster, at: 15, volume: 1.0, pitch: 1.032}
          - {id: snd_4, op: sound, sound: block.amethyst_block.resonate, anchor: caster, at: 20, volume: 1.0, pitch: 1.368}
          - {id: snd_5, op: sound, sound: block.amethyst_block.resonate, anchor: caster, at: 25, volume: 1.0, pitch: 1.8}
      - id: fx20
        at: 20
        do:
          - {id: hide_hand, op: caster_anim, anim: hide-main-hand, for: 24}
