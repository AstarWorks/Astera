            - {id: tele_rim_arc_1, op: display, kind: sprite, sprite: quad, size: [0.68173, 0.12], color: "#d9ff3b2f", anchor: tele, brightness: {block: 15, sky: 15}, offset: {left: -2.74219, up: 0.05, forward: 5.56061}, rotate: [{axis: up, deg: 20.58401}, {axis: left, deg: -88.27999}, {axis: forward, deg: -20.58401}], for: 12}
