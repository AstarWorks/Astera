            - {id: fx4_slam_sword_face, op: display, kind: block, block: "minecraft:gray_concrete", scale: [0.46, 1.9, 0.07], anchor: fx4_slam_sword_parts, brightness: {block: 15, sky: 15}, offset: {left: 0.0, up: 1.55, forward: 0.0}, for: 43}
