# Citadel Dawn (EGO): guard shield, leap, block-built sword slam, golden lightning. One visual object = one op; indexed families use times + CEL.
apiVersion: astera/v3
kind: Skill
id: bastion-greatsword-ego
item: bastion-greatsword
meta:
  name: {ja: "城塞の暁", en: "Citadel Dawn"}
  description: {ja: "大盾を掲げて跳び、剣を突き立てて黄金の稲妻を放つ。E.G.Oゲージを全て消費する。", en: "Raise the barrier, leap and plant the blade in a burst of golden lightning. Consumes the full E.G.O gauge."}
  cooldown_ticks: 300
  resource_cost: 0
  ego_cost: 100
  tags: [aoe, physical, finisher, charge]
params:
  propel: {type: number, default: 0.3}
  dash_distance: {type: blocks, default: 2.8}
  arc_deg: {type: number, default: 110}
  reach: {type: blocks, default: 3.8}
  dmg_physical: {type: number, default: 140}
  knockback: {type: number, default: 1.6}
anchors:
  - {id: guard, anchor: caster, mode: follow, offset: {left: 0.2, up: 1.3, forward: 1.15}}
machine:
  start: slam
  states:
    slam:
      for: 70
      then: end
      do:
        - {id: windup_lock, op: lock, at: 0, for: 20, move: walk}
        - {id: tele, op: frame, at: 20, anchor: caster, mode: snapshot, for: 20}
        - {id: propel, op: impulse, at: 20, target: caster, vector: {x: 0.0, y: "= propel", z: 0.0}}
        - {id: dash_hit, op: hit, at: 20, for: 6, every: 1, anchor: caster.body, shape: {sphere: 1.6}, targets: enemies, window: once, ignore_invulnerability: false}
        - {id: dash, op: dash, at: 20, speed: "= dash_distance / 6", for: 6, until: dash_hit.hit, direction: {forward: 1.0}, invulnerable: true, stop_on_block: true, follow_pitch: false, face_movement: false}
        - {id: hit1, op: hit, at: 31, anchor: caster.eye, shape: {sector: {deg: "${arc_deg}", range: "${reach}", height: 2.0, forward: yaw}}, targets: enemies, damage: {physical: "= dmg_physical + 0.5 * stacks(caster, 'charge')"}, window: once, ignore_invulnerability: true, on: {hit: [{id: react, op: react, target: event.victim, flinch: true, for: 6}, {id: stop, op: freeze, at: 0, ticks: 8, scope: [caster, event.victim]}, {id: shake, op: camera_shake, at: 0, target: event.victim, intensity: 1.0, for: 10, direction: from_hit}, {id: kb, op: knockback, target: event.victim, direction: "= normalize(flat(pos(event.victim) - pos(caster))) + vec(0.0, 0.3, 0.0)", strength: "${knockback}"}]}}
        - {id: spend, op: consume_status, at: 31, target: caster, status: charge}
        # --- guard shield (same plates as the defense skill) ---
        - {id: guard_rim0, op: display, kind: sprite, sprite: bastion-rim, anchor: guard, times: 2, size: [3.712, 1.92], rotate: [{axis: up, deg: -50}, {axis: forward, deg: "= 90 - 180 * i"}], billboard: fixed, see_through: true, brightness: {block: 15, sky: 15}, at: 0, for: 30}
        - {id: guard_rim1, op: display, kind: sprite, sprite: bastion-rim, anchor: guard, times: 2, size: [3.072, 1.408], color: "#FFF3C8", rotate: [{axis: up, deg: -50}, {axis: forward, deg: "= 90 - 180 * i"}], billboard: fixed, see_through: true, brightness: {block: 15, sky: 15}, at: 0, for: 30}
        - {id: guard_crest, op: display, kind: sprite, sprite: bastion-crest, anchor: guard, offset: {up: 0.05}, rotate: [{axis: up, deg: -50}], size: [1.664, 1.664], billboard: fixed, see_through: true, brightness: {block: 15, sky: 15}, at: 0, for: 30}
        - id: guard_fill
          op: display
          kind: text
          text: "●"
          color: "#FFD66E"
          anchor: guard
          billboard: fixed
          brightness: {block: 15, sky: 15}
          at: 0
          for: 30
          motion:
            - law: keys
              keys:
                - {t: 0, pose: [{axis: up, deg: -50}], scale: {left: 1.5, up: 3, forward: 1.0}, alpha: 0.0}
                - {t: 6, scale: {left: 7.5, up: 16.5, forward: 1.0}, alpha: 0.14, ease: out_cubic}
                - {t: 22, alpha: 0.14}
                - {t: 30, scale: {left: 7, up: 15.5, forward: 1.0}, alpha: 0.0, ease: in_quad}
        # Resonance rising 0.6 -> 1.8 (in_quad) every 5 ticks until stopsnd at 30.
        - {id: hum, op: sound, sound: block.amethyst_block.resonate, anchor: caster, volume: 1.0, pitch: "= 0.6 + 1.2 * pow(i / 5.0, 2.0)", every: 5, times: 6, at: 0}
        - {id: stopsnd, op: stop_sound, target: caster, sound: block.amethyst_block.resonate, at: 30}
        - {id: hide_hand, op: body, target: caster, anim: hide-main-hand, speed: 1.0, at: 20, for: 24}
        # --- telegraph cone on the snapshot frame: arc rim, two edges, fan of fill slivers (flat planes on the ground; i walks the arc, +35 .. -35 degrees) ---
        - {id: tele_arc, op: display, kind: sprite, sprite: quad, size: [0.68173, 0.12], color: "#d9ff3b2f", anchor: tele, brightness: {block: 15, sky: 15}, times: 12, offset: {left: "= -6.2 * sin(rad(35 - 70 * (i + 0.5) / 12))", up: 0.05, forward: "= 6.2 * cos(rad(35 - 70 * (i + 0.5) / 12))"}, rotate: [{axis: up, deg: "= -(35 - 70 * (i + 0.5) / 12)"}, {axis: left, deg: -90}], at: 20, for: 12}
        - {id: tele_edge, op: display, kind: sprite, sprite: quad, size: [6.2, 0.12], color: "#d9ff3b2f", anchor: tele, brightness: {block: 15, sky: 15}, times: 2, offset: {left: "= -3.1 * sin(rad(70 * i - 35))", up: 0.05, forward: "= 3.1 * cos(rad(70 * i - 35))"}, rotate: [{axis: up, deg: "= -55 - 70 * i"}, {axis: left, deg: -90}], at: 20, for: 12}
        - {id: tele_ray, op: frame, anchor: tele, mode: snapshot, times: 12, turn: [{axis: up, deg: "= -(35 - 70 * (i + 0.5) / 12)"}], at: 20, for: 12}
        - {id: tele_fill, op: display, kind: sprite, sprite: quad, size: [1.0, 1.0], color: "#59ff3b2f", anchor: "tele_ray[i]", brightness: {block: 15, sky: 15}, times: 12, at: 20, for: 12, motion: [{law: keys, keys: [{t: 0, offset: {up: 0.0006, forward: 0.031}, pose: [{axis: up, deg: 90}, {axis: left, deg: -90}], scale: {left: 0.062, up: 0.006, forward: 1.0}}, {t: 10, offset: {up: 0.06, forward: 3.1}, scale: {left: 6.2, up: 0.6, forward: 1.0}}]}]}
        - {id: snd_shield, op: sound, sound: item.shield.block, anchor: caster, pitch: 0.8, at: 20}
        # --- leap trail: 11 beads along the dash line, fading out ---
        - {id: trail, op: frame, anchor: caster, mode: snapshot, at: 20, for: 14}
        - {id: trail_bead, op: display, kind: sprite, sprite: dot, size: [0.2688, 0.2688], color: "#FFE08A", anchor: trail, billboard: center, brightness: {block: 15, sky: 15}, times: 11, offset: {up: "= 1.0 + 0.04 * i", forward: "= 0.2 + 0.28 * i"}, at: 20, for: 14, motion: [{law: keys, keys: [{t: 0, alpha: 1.0}, {t: 14, alpha: 0.0, ease: in_quad}]}]}
        # --- slam: caster-pinned frames, block sword swung by one rig ---
        - {id: impact, op: frame, anchor: caster, mode: snapshot, at: 27, for: 43}
        - {id: blade, op: frame, anchor: caster, mode: follow, at: 27}
        # Pure pitch swing about pivot (0, 1.4, 0.3): tip directions -125 -> -150 (anticipation) -> -97 -> 62 (strike) -> 66 (settle).
        - id: blade_rig
          op: rig
          of: blade
          part: slam_blocks
          parent: caster.body
          pivot: {up: 1.4, forward: 0.3}
          rest: [{axis: left, deg: 90.0}]
          at: 27
          for: 43
          swing:
            - {at: 0, for: 1, from: {up: 0.81915, forward: -0.57358}, to: {up: 0.5, forward: -0.86603}, edge: trailing}
            - {for: 1, from: {up: 0.5, forward: -0.86603}, to: {up: 0.99255, forward: -0.12187}, edge: leading}
            - {for: 1, from: {up: 0.99255, forward: -0.12187}, to: {up: -0.88295, forward: 0.46947}, edge: leading}
            - {for: 2, from: {up: -0.88295, forward: 0.46947}, to: {up: -0.91355, forward: 0.40674}, edge: leading}
        - {id: blade_face, op: display, kind: block, viewers: owner-hidden, block: "minecraft:gray_concrete", scale: [0.46, 1.9, 0.07], anchor: blade, offset: {up: 1.55}, brightness: {block: 15, sky: 15}, at: 27, for: 43}
        - {id: blade_rim, op: display, kind: block, viewers: owner-hidden, block: "minecraft:white_concrete", scale: [0.07, 1.9, 0.12], anchor: blade, offset: {left: "= 0.25 - 0.5 * i", up: 1.55}, times: 2, brightness: {block: 15, sky: 15}, at: 27, for: 43}
        - {id: blade_end, op: display, kind: block, viewers: owner-hidden, block: "minecraft:white_concrete", scale: [0.58, 0.08, 0.12], anchor: blade, offset: {up: "= 2.5 - 1.88 * i"}, times: 2, brightness: {block: 15, sky: 15}, at: 27, for: 43}
        - {id: blade_inset, op: display, kind: block, viewers: owner-hidden, block: "minecraft:yellow_concrete", scale: [0.09, 0.2, 0.09], anchor: blade, offset: {up: 0.86}, brightness: {block: 15, sky: 15}, at: 27, for: 43}
        - {id: blade_guard, op: display, kind: block, viewers: owner-hidden, block: "minecraft:black_concrete", scale: [0.62, 0.1, 0.18], anchor: blade, offset: {up: 0.5}, brightness: {block: 15, sky: 15}, at: 27, for: 43}
        - {id: blade_grip, op: display, kind: block, viewers: owner-hidden, block: "minecraft:black_concrete", scale: [0.09, 0.8, 0.09], anchor: blade, offset: {up: 0.05}, brightness: {block: 15, sky: 15}, at: 27, for: 43}
        - {id: snd_trident, op: sound, sound: item.trident.return, anchor: caster, volume: 0.8, pitch: 0.6, at: 27}
        # --- impact (tick 31) ---
        - {id: flash_star, op: display, kind: text, text: "✦", anchor: impact, brightness: {block: 15, sky: 15}, at: 31, for: 6, motion: [{law: keys, keys: [{t: 0, offset: {up: 1.0, forward: 1.7}, scale: {left: 2.25, up: 2.25, forward: 1.0}, alpha: 1.0, color: "#FFF2B0"}, {t: 1, scale: {left: 15, up: 15, forward: 1.0}, ease: out_back}, {t: 6, scale: {left: 7.5, up: 7.5, forward: 1.0}, alpha: 0.0, color: "#FFD060", ease: out_quad}]}]}
        - {id: pillar_core, op: display, kind: block, block: "minecraft:white_concrete", anchor: impact, brightness: {block: 15, sky: 15}, at: 31, for: 16, motion: [{law: keys, keys: [{t: 0, offset: {up: 5.0, forward: 1.7}, scale: {left: 0.15, up: 0.3, forward: 0.15}}, {t: 1, scale: {left: 0.5, up: 10.0, forward: 0.5}, ease: out_expo}, {t: 10, scale: {left: 0.425, up: 10.0, forward: 0.425}}, {t: 16, scale: {left: 0.0, up: 10.0, forward: 0.0}, ease: in_quad}]}]}
        - {id: pillar_bloom, op: display, kind: block, block: "minecraft:yellow_stained_glass", anchor: impact, brightness: {block: 15, sky: 15}, at: 31, for: 16, motion: [{law: keys, keys: [{t: 0, offset: {up: 4.8, forward: 1.7}, scale: {left: 0.5, up: 0.3, forward: 0.5}}, {t: 1, scale: {left: 1.4, up: 9.6, forward: 1.4}, ease: out_expo}, {t: 16, scale: {left: 0.0, up: 9.6, forward: 0.0}, ease: in_quad}]}]}
        - {id: ground_disc, op: display, kind: text, text: "●", anchor: impact, brightness: {block: 15, sky: 15}, at: 31, for: 12, motion: [{law: keys, keys: [{t: 0, offset: {up: 1.25, forward: 1.7}, pose: [{axis: left, deg: 90.0}], scale: {left: 2, up: 2, forward: 1.0}, alpha: 0.95, color: "#FFF2B0"}, {t: 2, scale: {left: 18, up: 18, forward: 1.0}, ease: out_expo}, {t: 12, scale: {left: 19.5, up: 19.5, forward: 1.0}, alpha: 0.0, color: "#FFD060", ease: out_quad}]}]}
        - {id: dust, op: display, kind: sprite, sprite: smoke-puff, size: [0.8, 0.8], flipbook: {frames: 4, every: 6, loop: false}, color: "#8A8478", anchor: impact, billboard: center, brightness: {block: 9, sky: 9}, times: 6, at: 31, for: 18, motion: [{law: keys, keys: [{t: 0, offset: {left: "= 1.5 * sin(rad(60 * i))", up: 0.25, forward: "= 1.7 + 1.5 * cos(rad(60 * i))"}, scale: {left: 1.2, up: 1.2, forward: 1.0}, alpha: 0.9}, {t: 18, offset: {left: "= 1.5 * sin(rad(60 * i))", up: 0.95, forward: "= 1.7 + 1.5 * cos(rad(60 * i))"}, scale: {left: 2.6, up: 2.6, forward: 1.0}, alpha: 0.0, ease: out_quad}]}]}
        - {id: snd_anvil, op: sound, sound: block.anvil.land, anchor: caster, pitch: 0.5, at: 31}
        - {id: shake_2, op: camera_shake, target: caster, intensity: 0.5, for: 8, direction: none, at: 31}
        - {id: veil, op: screen_veil, target: caster, sprite: burst, ticks: 5, color: "#FFC84A", distance: 0.4, scale: 1.4, max_screen_fraction: 0.15, at: 31}
        - {id: flash, op: screen_flash, target: {kind: enemies, around: caster, radius: 5.0, max_count: all}, overlay: gold_burst, color: "#FFC84A", fade_in: 0, stay: 2, fade_out: 2, at: 31}
        - {id: snd_explode, op: sound, sound: entity.generic.explode, anchor: caster, pitch: 0.6, at: 31}
        # --- lightning (tick 32): four jagged bolts of 8 segments fanned ahead of the impact, alternating yellow / white; each segment zig-zags in yaw and climbs ---
        - {id: bolt_y_f, op: frame, anchor: impact, mode: snapshot, times: 16, offset: {left: "= (i - 8 * floor(i / 8)) * 0.75 * sin(rad(-45 + 30 * (2 * floor(i / 8)))) + 0.12 * (1 - 2 * (i - 2 * floor(i / 2)))", up: "= 0.2 + 0.17 * (i - 8 * floor(i / 8))", forward: "= 1.7 + (i - 8 * floor(i / 8)) * 0.75 * cos(rad(-45 + 30 * (2 * floor(i / 8))))"}, turn: [{axis: up, deg: "= -45 + 30 * (2 * floor(i / 8)) + 25 * (1 - 2 * (i - 2 * floor(i / 2)))"}, {axis: left, deg: -12.6}], at: 32, for: 12}
        - {id: bolt_y, op: display, kind: block, block: "minecraft:yellow_concrete", anchor: "bolt_y_f[i]", brightness: {block: 15, sky: 15}, times: 16, at: 32, for: 12, motion: [{law: keys, keys: [{t: 0, scale: {left: 0.05, up: 0.05, forward: 0.1}}, {t: 1, scale: {left: 0.12, up: 0.12, forward: 0.76}, ease: out_expo}, {t: 9, scale: {left: 0.09, up: 0.09, forward: 0.76}}, {t: 12, scale: {left: 0.0, up: 0.0, forward: 0.76}, ease: in_quad}]}]}
        - {id: bolt_w_f, op: frame, anchor: impact, mode: snapshot, times: 16, offset: {left: "= (i - 8 * floor(i / 8)) * 0.75 * sin(rad(-45 + 30 * (2 * floor(i / 8) + 1))) + 0.12 * (1 - 2 * (i - 2 * floor(i / 2)))", up: "= 0.2 + 0.17 * (i - 8 * floor(i / 8))", forward: "= 1.7 + (i - 8 * floor(i / 8)) * 0.75 * cos(rad(-45 + 30 * (2 * floor(i / 8) + 1)))"}, turn: [{axis: up, deg: "= -45 + 30 * (2 * floor(i / 8) + 1) + 25 * (1 - 2 * (i - 2 * floor(i / 2)))"}, {axis: left, deg: -12.6}], at: 32, for: 12}
        - {id: bolt_w, op: display, kind: block, block: "minecraft:white_concrete", anchor: "bolt_w_f[i]", brightness: {block: 15, sky: 15}, times: 16, at: 32, for: 12, motion: [{law: keys, keys: [{t: 0, scale: {left: 0.05, up: 0.05, forward: 0.1}}, {t: 1, scale: {left: 0.12, up: 0.12, forward: 0.76}, ease: out_expo}, {t: 9, scale: {left: 0.09, up: 0.09, forward: 0.76}}, {t: 12, scale: {left: 0.0, up: 0.0, forward: 0.76}, ease: in_quad}]}]}
    end: {final: true}
