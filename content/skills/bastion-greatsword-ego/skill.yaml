# Wave 2 v3 draft of bastion-greatsword-ego (v2: skill.yaml + look.yaml), generated from the v2 files by a scratch script, gameplay hand-authored.
# Offsets [left, up, forward] -> name-keyed maps. Euler turn [pitch, yaw, roll] -> pose list [up -yaw, left pitch, forward roll].
# The v2 slam sword is built from block parts parented to a rig frame (hand: false), not the held item blade: 2 `rig of:` ops drive the frames fx4_slam_sword / fx4_slam_sword_parts (R27).
apiVersion: astera/v3
kind: Skill
id: bastion-greatsword-ego
item: bastion-greatsword
meta:
  name: {ja: "城塞の暁", en: "Citadel Dawn"}
  description: {ja: "大盾を掲げて跳び、剣を突き立てて黄金の稲妻を放つ。E.G.Oゲージを全て消費する。", en: "Raise the barrier, leap and plant the blade in a burst of golden lightning. Consumes the full E.G.O gauge."}
  cooldown_ticks: 300
  resource_cost: 0
  ego_cost: 100
  tags: [aoe, physical, finisher, charge]
params:
  propel: {type: number, default: 0.3}
  dash_distance: {type: blocks, default: 2.8}
  arc_deg: {type: number, default: 110}
  reach: {type: blocks, default: 3.8}
  dmg_physical: {type: number, default: 140}
  knockback: {type: number, default: 1.6}
anchors:
  # v2: frame fx1_bastion_ego_guard at caster orient yaw follow, group tick 0
  - {id: fx1_guard, anchor: caster, mode: follow}
  # v2: frames fx4_bastion_ego_slam_sword / _sword_parts (parent caster, passenger false), driven by the two rigs of group fx27 (R27); declared as frame ops in fx27.
  # (v2 fx4_bastion_ego_slam and fx2_telegraph_cone_2 / fx3_bastion_ego_trail were created at ticks 27 / 20: they are `frame` rows, R29.)
machine:
  start: slam
  states:
    slam:
      for: 70
      then: end
      do:
        # --- gameplay (v2 gameplay.timeline t0 / t20 / t31) ---
        # v2 lock speed 0.0 ticks 20 -> lock move for 20 ticks (pitch / yaw stay free; v2 locked only speed).
        - {id: windup_lock, op: lock, at: 0, for: 20, move: walk}
        # v2 `place tele like caster` at tick 20 (R29): the telegraph anchor.
        - {id: tele, op: frame, at: 20, anchor: caster, mode: snapshot, for: 20}
        # v2 propel direction (0,1,0) strength 0.3 -> impulse (0, 0.3, 0).
        - {id: propel, op: impulse, at: 20, target: caster, vector: {x: 0.0, y: "= propel", z: 0.0}}
        # v2 dash_strike 2.8 over 6 ticks -> speed 2.8/6.
        # v2 hit_once + stop_before_target 1.6 (R9): sibling trigger-only corridor hit, window once; the dash ends at its first victim (sphere 1.6 = the stop distance).
        - {id: dash_hit, op: hit, at: 20, for: 6, every: 1, anchor: caster.body, shape: {sphere: 1.6}, targets: enemies, window: once, ignore_invulnerability: false}
        - {id: dash, op: dash, at: 20, speed: "= dash_distance / 6", for: 6, until: dash_hit.hit, direction: {forward: 1.0}, invulnerable: true, stop_on_block: true, follow_pitch: false, face_movement: false}
        # v2 sel (damage 140 per_stack charge 0.5 consume true, ignore_invulnerability) + sel_2 (freeze 4, knockback) are the same sector at the same tick: merged.
        # sector {angle 110, range 3.8, height 2.0} at `eye` with forward caster.forward (yaw only) -> anchor caster.eye + `forward: yaw` (R31).
        # max_count: 1 = the nearest 1 target (v2 hit cap; founder 10/28 ruling, TablePlayer hit sorts nearest-first then takes N).
        # per_stack charge 0.5 consume TRUE: stacks() is read once before the first victim and consume_status lands after all victims (R24); hit-stop 4 = freeze row in `on: hit1`.
        - {id: hit1, op: hit, at: 31, anchor: caster.eye, shape: {sector: {deg: "${arc_deg}", range: "${reach}", height: 2.0, forward: yaw}}, targets: enemies, damage: {physical: "= dmg_physical + 0.5 * stacks(caster, 'charge')"}, window: once, ignore_invulnerability: true, on: {hit: [{id: stop, op: freeze, at: 0, ticks: 4, scope: [caster, event.victim]}, {id: shake, op: camera_shake, at: 0, target: event.victim, intensity: 1.0, for: 10, direction: from_hit}, {id: kb, op: knockback, target: event.victim, direction: "= normalize(flat(pos(event.victim) - pos(caster))) + vec(0.0, 0.3, 0.0)", strength: "${knockback}"}]}}
        - {id: spend, op: consume_status, at: 31, target: caster, status: charge}
        # --- presentation (v2 look.yaml timeline groups, folded from the former top-level `presentation:`) ---
        - id: fx0
          op: group
          at: 0
          do:
            - {id: fx1_guard_rim0r, op: display, kind: sprite, see_through: true, sprite: bastion-rim, flipbook: {frames: 1, every: 30, loop: false}, size: [3.712, 1.92], anchor: fx1_guard, brightness: {block: 15, sky: 15}, offset: {left: 0.2, up: 1.3, forward: 1.15}, rotate: [{axis: up, deg: -50}, {axis: forward, deg: 90}], for: 30}
            - {id: fx1_guard_rim0l, op: display, kind: sprite, see_through: true, sprite: bastion-rim, flipbook: {frames: 1, every: 30, loop: false}, size: [3.712, 1.92], anchor: fx1_guard, brightness: {block: 15, sky: 15}, offset: {left: 0.2, up: 1.3, forward: 1.15}, rotate: [{axis: up, deg: -50}, {axis: forward, deg: -90}], for: 30}
            - {id: fx1_guard_rim1r, op: display, kind: sprite, see_through: true, sprite: bastion-rim, flipbook: {frames: 1, every: 30, loop: false}, size: [3.072, 1.408], color: "#FFF3C8", anchor: fx1_guard, brightness: {block: 15, sky: 15}, offset: {left: 0.2, up: 1.3, forward: 1.15}, rotate: [{axis: up, deg: -50}, {axis: forward, deg: 90}], for: 30}
            - {id: fx1_guard_rim1l, op: display, kind: sprite, see_through: true, sprite: bastion-rim, flipbook: {frames: 1, every: 30, loop: false}, size: [3.072, 1.408], color: "#FFF3C8", anchor: fx1_guard, brightness: {block: 15, sky: 15}, offset: {left: 0.2, up: 1.3, forward: 1.15}, rotate: [{axis: up, deg: -50}, {axis: forward, deg: -90}], for: 30}
            - {id: fx1_guard_crest, op: display, kind: sprite, see_through: true, sprite: bastion-crest, flipbook: {frames: 1, every: 30, loop: false}, size: [1.664, 1.664], anchor: fx1_guard, brightness: {block: 15, sky: 15}, offset: {left: 0.2, up: 1.35, forward: 1.15}, rotate: [{axis: up, deg: -50}], for: 30}
            # v2 quad "fill": text glyph "●", colour #FFD66E, keys on scale + alpha (out_cubic into t6, in_quad into t30).
            - {id: fx1_guard_fill, op: display, kind: text, text: "●", color: "#FFD66E", anchor: fx1_guard, brightness: {block: 15, sky: 15}, offset: {left: 0.2, up: 1.3, forward: 1.15}, rotate: [{axis: up, deg: -50}], for: 30, motion: [{law: keys, keys: [{t: 0, offset: {left: 0.2, up: 1.3, forward: 1.15}, scale: {left: 1.5, up: 3, forward: 1.0}, alpha: 0.0}, {t: 6, scale: {left: 7.5, up: 16.5, forward: 1.0}, alpha: 0.14, ease: out_cubic}, {t: 22, alpha: 0.14}, {t: 30, scale: {left: 7, up: 15.5, forward: 1.0}, alpha: 0.0, ease: in_quad}]}]}
            # v2 sound pitch 0.6 -> 1.8 over 25 ticks (in_quad), every 5, until stop_sound at tick 30: unrolled to one sound per repeat with the pitch sampled at its tick
            - {id: snd, op: sound, sound: block.amethyst_block.resonate, anchor: caster, at: 0, volume: 1.0, pitch: 0.6}
            - {id: snd_1, op: sound, sound: block.amethyst_block.resonate, anchor: caster, at: 5, volume: 1.0, pitch: 0.648}
            - {id: snd_2, op: sound, sound: block.amethyst_block.resonate, anchor: caster, at: 10, volume: 1.0, pitch: 0.792}
            - {id: snd_3, op: sound, sound: block.amethyst_block.resonate, anchor: caster, at: 15, volume: 1.0, pitch: 1.032}
            - {id: snd_4, op: sound, sound: block.amethyst_block.resonate, anchor: caster, at: 20, volume: 1.0, pitch: 1.368}
            - {id: snd_5, op: sound, sound: block.amethyst_block.resonate, anchor: caster, at: 25, volume: 1.0, pitch: 1.8}
        - id: fx20
          op: group
          at: 20
          do:
            # v2 caster_anim hide-main-hand 24 ticks (R41).
            - {id: hide_hand, op: body, anim: hide-main-hand, speed: 1.0, for: 24}
            - {id: fx3_trail, op: frame, at: 0, anchor: caster, mode: snapshot, for: 14}
            # v2 telegraph cone: 26 plain coloured planes (#ff3b2f; rim alpha 0.85, fill alpha 0.35) on the world frame placed at tick 20, removed at tick 32 (R33 quad sprite).
            # Offsets [left, up, forward]; turn [pitch, yaw, roll] -> rotate [up -yaw, left pitch, forward roll]; plane size = v2 track scale x [1, 1].
