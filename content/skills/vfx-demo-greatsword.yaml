# Weapon rig demo: plays content/vfx/demo-greatsword-swing.yaml (a swinging greatsword + 風切り fan).
# Not bound to any item; cast it with `caster.cast(...)` in the simulator. `freeze` is the hit-stop window.

id: vfx-demo-greatsword

name:
  ja: "デモ・大剣の風切り"
  en: "Demo Greatsword Swing"
description:
  ja: "ブロック表示の大剣リグが振り抜かれ、軌跡が扇状の面になるデモ。"
  en: "Plays a block-display greatsword rig swing with a swept-surface wind-cut fan."

archetype: aoe
cooldown_ticks: 60
tags: [ demo, vfx ]

params:
  type: aoe
  radius: 4.0
  falloff: linear
  damage:
    - base: { type: literal, value: 6.25 }
      attribute: physical

phases:
  type: aoe
  cast:
    - type: play_vfx
      targets: { type: caster }
      vfx_id: demo-greatsword-swing
      freeze: [ { at: 7, ticks: 3 } ]
  hit_entity: []
  expire: []
