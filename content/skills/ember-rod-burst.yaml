# Match arsenal (wp/match-arsenal): simple PvP skill. One cast sound, a few particles.

id: ember-rod-burst

name:
  ja: "火炎爆発"
  en: "Ember Burst"
description:
  ja: "周囲を炎で焼き払う。"
  en: "A blast of fire around you."

archetype: aoe
cooldown_ticks: 150
resource_cost: 18
tags: [ aoe, fire ]

params:
  type: aoe
  radius: 3.5
  falloff: linear
  damage:
    - base: { type: literal, value: 45.0 }
      attribute: fire

phases:
  type: aoe
  cast:
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:skill/wand/cast
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 0.9 }
    - type: schedule_particle_animation
      targets: { type: caster_offset, offset: { type: literal, value: { x: 0.0, y: 0.15, z: 0.0 } } }
      animation:
        - type: ring
          period_ticks: 6
          points: 16
          start_radius: 0.5
          end_radius: 3.5
          particles:
            - { id: flame, count: 0, extra: 0.03 }
            - { id: dust, color: { r: 255, g: 110, b: 20 }, scale: 1.4 }
  hit_entity:
    - type: play_sound
      targets: { type: target }
      sound_id: astera:weapons/blade-hit
      volume: { type: literal, value: 0.7 }
      pitch: { type: literal, value: 1.0 }
    - type: apply_status
      targets: { type: target }
      status_id: burn
      effect_duration_ticks: { type: literal, value: 40 }
  expire: []
