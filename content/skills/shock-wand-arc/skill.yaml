# astera/v3 hand port of the v2 skill.yaml + look.yaml (tick for tick).
# GAP: gameplay.expose [damage <- dmg_electric, radius <- radius] -> none (no v3 spelling; the numbers are inline below)
apiVersion: astera/v3
kind: Skill
id: shock-wand-arc
item: shock-wand
meta: {name: {ja: "放電", en: "Arc Burst"}, description: {ja: "周囲へ放電し、敵を痺れさせる。", en: "Releases a ring of lightning around you."}, cooldown_ticks: 140, resource_cost: 16, tags: [aoe, electric]}
anchors:
  - {id: ring,  anchor: caster, offset: {up: 0.15}}   # ring origin (caster + 0.15 up)
  - {id: heart, anchor: victim, offset: {up: 1.2}}
machine:
  start: burst
  states:
    burst:
      for: 6   # ring waves at ticks 0..5
      then: end
      do:
        - {id: snd, op: sound, sound: "astera:skill/wand/cast", anchor: caster, volume: 1.0, pitch: 1.1}
        - id: area
          op: hit
          at: 0
          anchor: caster
          shape: {sphere: 3.5}
          targets: enemies
          # GAP: damage amount depends on the victim (event.victim) inside a hit's damage map -> closest: CEL on event.victim as written; unconfirmed
          damage: {electric: "= 15.0 * (1.0 - 0.5 * dist(pos(caster), pos(event.victim)) / 3.5)"}
          # GAP: inline `on: hit` handler on a hit op is not in ADR 10.1b (closest: projectile on: 3.6)
          on:
            hit:
              - {id: st_shock, op: status, target: event.victim, status: shock, stacks: 1, for: 30, when: "= rand() < 0.5"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: victim, volume: 0.7, pitch: 1.0}
        # Ring waves: radius 0.5 + 0.6 * wave (0.5 .. 3.5), 16 points, angle a = 2*pi*i/16.
        # GAP: v2 phase = draw('shape_ph') (per-cast shared random ring phase) -> none; fixed phase 0
        # GAP: v2 per-particle position shift (ring radius) -> closest is an inline anchor `{of: ring, offset: {...}}`, not in ADR 2.2
        - id: wave
          at: 0
          every: 1
          times: 6
          do:
            - id: spark
              op: particle
              particle: electric_spark
              count: 0
              extra: 0.03
              times: 16
              offset: ["= cos(2 * pi * i / 16)", 0, "= -sin(2 * pi * i / 16)"]   # [left, up, forward] direction
              anchor: {of: ring, offset: {left: "= (0.5 + 0.6 * parent.i) * cos(2 * pi * i / 16)", forward: "= -(0.5 + 0.6 * parent.i) * sin(2 * pi * i / 16)"}}
            - id: dust
              op: particle
              particle: dust
              count: 1
              color: "#fff078"
              size: 1.4
              times: 16
              anchor: {of: ring, offset: {left: "= (0.5 + 0.6 * parent.i) * cos(2 * pi * i / 16)", forward: "= -(0.5 + 0.6 * parent.i) * sin(2 * pi * i / 16)"}}
    end: {final: true}
