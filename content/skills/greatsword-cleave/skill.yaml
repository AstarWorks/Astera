apiVersion: astera/v3
kind: Skill
id: greatsword-cleave
item: greatsword
meta:
  name: {ja: "大剣の薙ぎ払い", en: "Greatsword Cleave"}
  description: {ja: "前方の広い範囲を重い一撃で薙ぎ払い、敵を大きく吹き飛ばす。", en: "A slow, wide, heavy sweep that sends enemies flying."}
  cooldown_ticks: 28
  resource_cost: 35
  tags: [melee, physical, burst]
anchors:
  - {id: cast_fx, anchor: caster, offset: {up: -0.3, forward: 2.4}, mode: snapshot}
  - {id: heart, anchor: victim.root, offset: {up: 1.2}}   # v2 pt_enemy_0_1p2_0
  - {id: head, anchor: victim.root, offset: {up: 1.6}}   # v2 pt_enemy_0_1p6_0
machine:
  start: cast
  states:
    cast:
      start: strike
      do:
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 1.0, pitch: 0.6, at: 0}
        - {id: fx, op: particle_def, def: cleave-sweep, anchor: cast_fx, at: 0}
      on:
        - {event: end, to: done}
      states:
        strike:
          for: 3   # v2 miss cue fires at tick 2, so the state must outlast it
          then: recover
          enter:
            - id: swing
              op: hit
              anchor: caster.eye
              at: 0
              targets: enemies
              shape: {sector: {deg: 150.0, range: 4.2, height: 2.0, forward: look}}
              max_count: all       # GAP(Q1): v2 had no cap
              window: once
              ignore_invulnerability: false
              damage: {physical: 65.0}
              on:
                hit:
                  - {id: snd_hit, op: sound, sound: "astera:weapons/blade-crit", anchor: contact, volume: 1.0, pitch: 1.0}
                  - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
                  - {id: fx_ind, op: particle_def, def: hit-indicator, anchor: head}
                  - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: 1.3}
                # v2 miss cue: sound at tick 2 when counter('swing_hits') == 0 (same spelling as sword-slash)
                miss:
                  - {id: whiff, op: sound, at: 2, sound: "astera:weapons/blade-miss", anchor: caster}
        recover: {final: true}
    done: {final: true}
