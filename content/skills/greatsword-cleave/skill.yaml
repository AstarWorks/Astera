apiVersion: "astera/v3"
kind: Skill
id: greatsword-cleave
item: greatsword
meta:
  name: {ja: "大剣の薙ぎ払い", en: "Greatsword Cleave"}
  description: {ja: "前方の広い範囲を重い一撃で薙ぎ払い、敵を大きく吹き飛ばす。", en: "A slow, wide, heavy sweep that sends enemies flying."}
  cooldown_ticks: 28
  resource_cost: 35
  tags: [melee, physical, burst]
anchors:
  cast_fx: {anchor: caster.eye, offset: {up: -0.3, forward: 2.4}, mode: snapshot}
  heart: {anchor: victim.body, offset: {up: 0.4}}
  head: {anchor: victim.body, offset: {up: 0.8}}
presentation:
  timeline:
    - at: 0
      do:
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 1.0, pitch: 0.6}
        - {id: fx, op: particle_def, def: cleave-sweep, anchor: cast_fx}
gameplay:
  timeline:
    - at: 0
      do:
        - id: swing
          op: hit
          anchor: caster.eye
          targets: enemies
          shape: {sector: {deg: 150.0, range: 4.2, height: 2.0}}
          damage: {physical: 65.0}
          on:
            hit:
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-crit", anchor: victim.body, volume: 1.0, pitch: 1.0}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
              - {id: fx_ind, op: particle_def, def: hit-indicator, anchor: head}
              # GAP: counter swing_hits (+ miss sound when counter == 0) -> none in v3; the astera:weapons/blade-miss sound on a whiff is lost, nothing in v3 reads 'no hit' (hit.on has only hit)
