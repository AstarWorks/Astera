# greatsword-cleave: wide horizontal cleave of the greatsword (wind-up 6 ticks, strike 3 ticks).
# Frames (ADR-0314, ADR-0315), the gameplay (hit tick, shape, damage, knockback, cooldown, cast length) is unchanged:
#   arm    - the right arm, rotate keys only. Origin = the right shoulder (`caster.shoulder_r`); the arm is one rigid 0.60 bone, so the hand travels on a sphere about it and a turn of this frame is that travel (about w left/right, about s up/down). Hand path: guard -> a long draw out to the right -> cleave across to the left -> guard.
#   blade  - the greatsword. Origin = the hand, 0.60 along the arm frame (the hand path is the arm's turn: guard -> drawn back high at the right -> across to the left -> guard). Long axis along v (grip at the origin,
#            tip at v 1.14), edge along w. Roll -80 about v lays the edge on the left, the cut is then a turn about s (v moves towards w), so the edge leads. The wind-up tips the point to the right (-70),
#            the cut carries it across the front to the left (100, hit when the blade crosses the middle), `reset` eases back to guard.
#            The engine pins the right hand to the origin; the origin sits exactly on the 0.60 reach sphere of the shoulder by construction.
#   body   - the caster's feet, v forward / w up / s right: sounds and the cast fx.
#   wound  - one per victim at the victim's centre, v the way the blow came in: the hit sound and the hit spark.
#   edge   - line along the blade from part-way to the tip (v 0.69 .. 1.14), what the trail rows draw along.
apiVersion: astera/v3
kind: Skill
id: greatsword-cleave
item: greatsword
meta:
  name: {ja: "大剣の薙ぎ払い", en: "Greatsword Cleave"}
  description: {ja: "前方の広い範囲を重い一撃で薙ぎ払い、敵を大きく吹き飛ばす。", en: "A slow, wide, heavy sweep that sends enemies flying."}
  cooldown_ticks: 28
  resource_cost: 35
  tags: [melee, physical, burst]
params:
  arc_deg:      {type: number, default: 150}
  range:        {type: blocks, default: 4.2}
  dmg_physical: {type: number, default: 65}
  knockback:    {type: number, default: 1.3}
frames:
  - id: arm
    origin: caster.shoulder_r
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: w, to: -9}   # guard
      - {at: 0, for: 5, about: w, to: -78, ease: in_out_sine}   # the slow draw: the sword is lifted out to the right
      - {at: 5, for: 3, about: w, to: 60, ease: out_cubic}   # the cleave: across to the left and down
      - {at: 8, for: 6, about: w, to: -9, ease: in_out_sine}   # back to guard
      - {at: 0, for: 0, about: s, to: -41}
      - {at: 0, for: 5, about: s, to: 10, ease: in_out_sine}
      - {at: 5, for: 3, about: s, to: -34, ease: out_cubic}
      - {at: 8, for: 6, about: s, to: -41, ease: in_out_sine}
  - id: blade
    origin: {frame: arm, pos: {v: 0.6}}
    v: forward
    w: up
    s: v x w
    rotate:
      - {at: 0, for: 0, about: v, to: -80}  # roll the edge into the cut plane
      - {at: 0, for: 5, about: s, to: -70, ease: in_out_sine}  # wind-up turn
      - {at: 5, for: 3, about: s, to: 100, ease: out_cubic}  # the cut, edge first
      - {at: 8, for: 6, reset: true, ease: in_out_sine}
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
  - id: wound
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
lines:
  edge: {frame: blade, from: {v: 0.69}, to: {v: 1.14}}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 6
      then: strike
      do:
        - {id: snd_windup, op: sound, sound: item.armor.equip_iron, frame: body, volume: 0.6, pitch: 0.5}
        # weapon rig: wide cleave. One performance in the windup state, detached so it plays on through the strike and the tail:
        # drawn back over 5 ticks, the cut starts at tick 5 so the blade crosses the target zone at the hit (tick 6), then 6 ticks of follow-through.
        - {id: rig, op: rig, frame: blade, for: 14, detach: true}
    strike:
      for: 3
      then: end
      do:
        - id: swing
          op: hit
          frame: blade
          at: 0
          targets: enemies
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: react, op: react, target: event.victim, flinch: true, for: 6}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-crit", frame: wound, volume: 1.0, pitch: 1.0, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, frame: wound, pos: {w: 0.2}, detach: true}
              - {id: fx_ind, op: particle_def, def: hit-indicator, frame: wound, pos: {w: 0.7}, detach: true}
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: "${knockback}"}
            miss:
              - {id: whiff, op: sound, at: 2, sound: "astera:weapons/blade-miss", frame: body, detach: true}
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", frame: body, volume: 1.0, pitch: 0.6, detach: true}
        - {id: fx, op: particle_def, def: cleave-sweep, frame: body, pos: {v: 2.4, w: 1.32}, detach: true}
        - {id: trail, op: particle, particle: crit, along: edge, samples: 3, count: 1, extra: 0.04, at: 0, every: 1, for: 3, detach: true}
    end: {final: true}
