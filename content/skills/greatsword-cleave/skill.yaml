apiVersion: astera/v3
kind: Skill
id: greatsword-cleave
item: greatsword
meta:
  name: {ja: "大剣の薙ぎ払い", en: "Greatsword Cleave"}
  description: {ja: "前方の広い範囲を重い一撃で薙ぎ払い、敵を大きく吹き飛ばす。", en: "A slow, wide, heavy sweep that sends enemies flying."}
  cooldown_ticks: 28
  resource_cost: 35
  tags: [melee, physical, burst]
params:
  arc_deg:      {type: number, default: 150}
  range:        {type: blocks, default: 4.2}
  dmg_physical: {type: number, default: 65}
  knockback:    {type: number, default: 1.3}
anchors:
  - {id: cast_fx, anchor: caster, offset: {up: -0.3, forward: 2.4}, mode: snapshot}
  - {id: heart, anchor: victim.root, offset: {up: 1.2}, mode: follow}
  - {id: head, anchor: victim.root, offset: {up: 1.6}, mode: follow}
machine:
  start: cast
  states:
    cast:
      start: strike
      do:
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 1.0, pitch: 0.6, at: 0}
        - {id: fx, op: particle_def, def: cleave-sweep, anchor: cast_fx, at: 0}
      on:
        - {event: end, to: done}
      states:
        strike:
          for: 3   # outlasts the miss cue at tick 2
          then: recover
          enter:
            - id: swing
              op: hit
              anchor: caster.eye
              at: 0
              targets: enemies
              shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
              window: once
              ignore_invulnerability: false
              damage: {physical: "${dmg_physical}"}
              on:
                hit:
                  - {id: snd_hit, op: sound, sound: "astera:weapons/blade-crit", anchor: contact, volume: 1.0, pitch: 1.0}
                  - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
                  - {id: fx_ind, op: particle_def, def: hit-indicator, anchor: head}
                  - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: "${knockback}"}
                miss:
                  - {id: whiff, op: sound, at: 2, sound: "astera:weapons/blade-miss", anchor: caster}
        recover: {final: true}
    done: {final: true}
