# greatsword-cleave: wind-up 6 ticks (rule round(5 / attack_speed)), hit at tick 6. Wide horizontal cleave. The strike state keeps its 3 ticks so the miss cue (hit + 2) is inside the cast as before; the cast end therefore moves by exactly W like the hit.
apiVersion: astera/v3
kind: Skill
id: greatsword-cleave
item: greatsword
meta:
  name: {ja: "大剣の薙ぎ払い", en: "Greatsword Cleave"}
  description: {ja: "前方の広い範囲を重い一撃で薙ぎ払い、敵を大きく吹き飛ばす。", en: "A slow, wide, heavy sweep that sends enemies flying."}
  cooldown_ticks: 28
  resource_cost: 35
  tags: [melee, physical, burst]
params:
  arc_deg:      {type: number, default: 150}
  range:        {type: blocks, default: 4.2}
  dmg_physical: {type: number, default: 65}
  knockback:    {type: number, default: 1.3}
anchors:
  - {id: cast_fx, anchor: caster.eye, offset: {up: -0.3, forward: 2.4}, mode: snapshot}
  - {id: heart, anchor: victim.center, mode: follow}
  - {id: head, anchor: victim.root, offset: {up: 1.6}, mode: follow}
machine:
  start: windup
  tail: 10
  states:
    windup:
      for: 6
      then: strike
      do:
        - {id: snd_windup, op: sound, sound: item.armor.equip_iron, anchor: caster, volume: 0.6, pitch: 0.5}
        # weapon rig: wide cleave. One performance in the windup state, detached so it plays on through the strike and the tail:
        # drawn back over 5 ticks, the cut starts at tick 5 so the blade crosses the target zone at the hit (tick 6), then 6 ticks of follow-through.
        - id: rig
          op: rig
          parent: caster
          mount: caster.hand_r
          rest: [{axis: left, deg: 72}]
          detach: true
          for: 14
          swing:
            - {at: 0, for: 5, from: {left: 0.000, up: 0.507, forward: 0.862}, to: {left: -0.958, up: 0.202, forward: -0.202}, edge: trailing, roll: 0, ease: out_quad}
            - {at: 5, for: 3, to: {left: 0.909, up: -0.101, forward: 0.404}, edge: leading, roll: 0, ease: out_cubic}
            - {at: 8, for: 6, to: {left: 0.834, up: 0.152, forward: -0.531}, edge: leading, roll: 0, ease: out_cubic}
    strike:
      for: 3
      then: end
      do:
        - id: swing
          op: hit
          anchor: caster.eye
          at: 0
          targets: enemies
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: react, op: react, target: event.victim, flinch: true, for: 6}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-crit", anchor: contact, volume: 1.0, pitch: 1.0, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart, detach: true}
              - {id: fx_ind, op: particle_def, def: hit-indicator, anchor: head, detach: true}
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: "${knockback}"}
            miss:
              - {id: whiff, op: sound, at: 2, sound: "astera:weapons/blade-miss", anchor: caster, detach: true}
        - {id: snd, op: sound, sound: "astera:weapons/blade-heavy-swing", anchor: caster, volume: 1.0, pitch: 0.6, detach: true}
        - {id: fx, op: particle_def, def: cleave-sweep, anchor: cast_fx, detach: true}
        - {id: trail, op: particle, particle: crit, anchor: {of: /windup/rig.root, to: /windup/rig.tip, samples: 3}, count: 1, extra: 0.04, at: 0, every: 1, for: 8, detach: true}
    end: {final: true}
