apiVersion: astera/v3
kind: Skill
id: twin-daggers-shadowstep
item: twin-daggers
meta:
  name: {ja: "影走り", en: "Shadow Step"}
  description: {ja: "後ろへ跳んで短時間走り抜ける。", en: "Hops back and sprints for a moment."}
  cooldown_ticks: 100
  resource_cost: 0
  tags: [buff, movement]
# GAP: gameplay.expose (duration <- swift_ticks) -> none (inline literal)
anchors:
  - {id: puff_pt, anchor: caster, offset: {up: 0.2}}
machine:
  start: main
  states:
    main:
      for: 1
      then: end
      do:
        - {id: buff, op: status, target: caster, status: swift, stacks: 1, for: 40}
        # GAP: propel {direction: axis(caster,"forward"), strength: -1.0} -> impulse (fields not spelled in ADR 10.1b); row below is the closest form
        - {id: propel, op: impulse, target: caster, direction: "= axis(caster, \"forward\")", strength: -1.0}
        - {id: snd, op: sound, sound: "astera:weapons/dash-whoosh", anchor: caster, volume: 0.8, pitch: 1.3}
        - {id: puff, op: particle_def, def: dash-cloud, anchor: puff_pt}
    end: {final: true}
