apiVersion: astera/v3
kind: Skill
id: twin-daggers-shadowstep
item: twin-daggers
meta:
  name: {ja: "影走り", en: "Shadow Step"}
  description: {ja: "後ろへ跳んで短時間走り抜ける。", en: "Hops back and sprints for a moment."}
  cooldown_ticks: 100
  resource_cost: 0
  tags: [buff, movement]
anchors:
  - {id: puff_pt, anchor: caster, offset: {up: 0.2}}
machine:
  start: main
  states:
    main:
      for: 1
      then: end
      do:
        - {id: buff, op: status, target: caster, status: swift, stacks: 1, for: 40}
        - {id: propel, op: impulse, at: 0, target: caster, vector: {of: caster, forward: -1.0}}
        - {id: snd, op: sound, sound: "astera:weapons/dash-whoosh", anchor: caster, volume: 0.8, pitch: 1.3}
        - {id: puff, op: particle_def, def: dash-cloud, anchor: puff_pt}
    end: {final: true}
