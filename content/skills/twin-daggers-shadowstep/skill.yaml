# twin-daggers-shadowstep: shadow step, no weapon motion (instant buff and dash cloud).
# Frames (ADR-0314): the skill moves no weapon, so there is no blade frame; the only frame is
#   body   - the caster's feet, v forward / w up / s right: the sound and the dash cloud at the feet (w 0.2).
apiVersion: astera/v3
kind: Skill
id: twin-daggers-shadowstep
item: twin-daggers
meta:
  name: {ja: "影走り", en: "Shadow Step"}
  description: {ja: "後ろへ跳んで短時間走り抜ける。", en: "Hops back and sprints for a moment."}
  cooldown_ticks: 100
  resource_cost: 0
  tags: [buff, movement]
params:
  swift_ticks: {type: ticks, default: 40}
  propel:      {type: number, default: -1.0}
frames:
  - id: body
    origin: caster
    v: forward
    w: up
    s: v x w
machine:
  start: main
  states:
    main:
      for: 1
      then: end
      do:
        - {id: buff, op: status, target: caster, status: swift, stacks: 1, for: "${swift_ticks}"}
        - {id: propel, op: impulse, at: 0, target: caster, vector: {of: caster, forward: "${propel}"}}
        - {id: snd, op: sound, sound: "astera:weapons/dash-whoosh", frame: body, volume: 0.8, pitch: 1.3}
        - {id: puff, op: particle_def, def: dash-cloud, frame: body, pos: {w: 0.2}}
    end: {final: true}
