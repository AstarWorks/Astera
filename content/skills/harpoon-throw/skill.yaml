# harpoon-throw: a thrown harpoon that reels its victim toward the caster. Rewritten from zero on the rev4.10 grammar (ADR-0303):
# a visible item display riding the projectile body, the impact as one skill-local fragment, the trail as one rider group.
# Straight flight on purpose (no gravity): the hit tick is balance. Randomness: none. Visuals need a founder look on skill-compare.
apiVersion: astera/v3
kind: Skill
id: harpoon-throw
item: harpoon
meta: {name: {ja: "銛", en: "Harpoon"}, description: {ja: "銛を投げ、当たった相手を引き寄せる。", en: "Hurls a harpoon and reels the target in."}, cooldown_ticks: 100, resource_cost: 10, tags: [ranged, physical, control]}
params:
  launch_speed: {type: number, default: 2.2}
  dmg_physical: {type: number, default: 18}
  reel_strength: {type: number, default: 1.4}
  max_lifetime_ticks: {type: ticks, default: 40}
anchors:
  - {id: muzzle,  anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}
  - {id: cast_fx, anchor: caster, offset: {up: -0.25, forward: 0.9}, mode: snapshot}
  - {id: heart,   anchor: victim.root, offset: {up: 1.2}, mode: follow}
fragments:
  impact:
    frames_in: {spot: anchor}
    do:
      - {id: snd, op: sound, at: 0, sound: "item.trident.hit", anchor: spot, volume: 0.8, pitch: 1.0}
      - {id: spark, op: particle_def, at: 0, def: hit-spark, anchor: spot}
      - {id: fleck, op: particle, at: 0, particle: dust, anchor: spot, count: 4, offset: [0.15, 0.15, 0.15], color: "#5abec8", size: 1.0}
machine:
  start: fly
  tail: 2
  states:
    fly:
      for: 40      # = max_lifetime_ticks (a state `for` cannot read a param yet)
      then: end
      on:
        - {event: bolt.end, to: end}
      do:
        - {id: snd, op: sound, at: 0, sound: "item.trident.throw", anchor: caster, volume: 0.9, pitch: 1.0}
        - {id: fx, op: particle_def, at: 0, def: hit-spark, anchor: cast_fx}
        - id: bolt
          op: projectile
          at: 0
          origin: muzzle
          velocity: "= look(caster) * ${launch_speed}"
          for: "${max_lifetime_ticks}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg_physical}"}}
              - {id: reel, op: knockback, target: event.victim, direction: "= normalize(pos(caster) - pos(event.victim)) + vec(0.0, 0.2, 0.0)", strength: "${reel_strength}"}
              - {id: hit_fx, use: "fragment:impact", frames: {spot: heart}, detach: true}
            block:
              - {id: block_snd, op: sound, at: 0, sound: "astera:weapons/gun-impact-block", anchor: contact.point, volume: 0.5, pitch: 1.5, detach: true}
              - {id: block_fx, op: particle_def, at: 0, def: hit-spark, anchor: contact.point, detach: true}
        - {id: shaft, op: display, kind: item, item: trident, context: fixed, anchor: bolt, scale: [1.2, 1.2, 1.2], at: 0, until: bolt.end}
        - id: trail
          op: group
          at: 0
          every: 1
          until: bolt.end
          do:
            - {id: wake, op: particle, particle: crit, count: 1, offset: [0.03, 0.03, 0.03], anchor: {of: bolt, sweep: 0.4}, at: 0}
            - {id: dust, op: particle, particle: dust, count: 1, color: "#5abec8", size: 1.0, anchor: {of: bolt, sweep: 0.4}, at: 0}
    end: {final: true}
