# Wave 2 v3 draft (basic-ac): ported 1:1 from the v2 skill.yaml + look.yaml. GAP comments mark what v3 cannot spell yet.
apiVersion: astera/v3
kind: Skill
id: harpoon-throw
item: harpoon
meta:
  name: {ja: "銛", en: "Harpoon"}
  description: {ja: "銛を投げ、当たった相手を引き寄せる。", en: "Hurls a harpoon and reels the target in."}
  cooldown_ticks: 100
  resource_cost: 10
  tags: [ranged, physical, control]
params:
  launch_speed: {type: number, default: 2.2}
  max_lifetime_ticks: {type: ticks, default: 40}
  dmg_physical: {type: number, default: 18.0}
  knockback: {type: number, default: 1.4}
anchors:
  - {id: origin, anchor: caster.eye, offset: {forward: 0.5}, mode: snapshot}       # was pt_aim_0_0_0p5
  - {id: muzzle, anchor: caster.eye, offset: {up: -0.25, forward: 0.9}, mode: snapshot}   # was pt_aim_0_m0p25_0p9
  - {id: heart, anchor: victim.root, offset: {up: 1.2}}                            # was pt_enemy_0_1p2_0 ; GAP(Q2): v2 enemy frame origin = feet+0.8 (victim.root = feet)
machine:
  start: fly
  states:
    fly:
      for: "= max_lifetime_ticks"
      then: end
      enter:
        - id: bolt
          op: projectile
          origin: origin
          velocity: "= look(caster) * launch_speed"
          for: "= max_lifetime_ticks"
          radius: 0.5
          hit: {targets: enemies, once: true}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "= dmg_physical"}}
              - {id: pull, op: knockback, target: event.victim, direction: "= normalize(flat(pos(caster) - pos(event.victim))) + vec(0.0, 0.2, 0.0)", strength: "= knockback"}
              - {id: snd_hit, op: sound, sound: "item.trident.hit", anchor: heart, volume: 0.8, pitch: 1.0}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
            block:
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", anchor: contact, volume: 0.5, pitch: 1.5}
              - {id: fx_blk, op: particle_def, def: hit-spark, anchor: contact}
      do:
        - {id: snd_cast, op: sound, sound: "item.trident.throw", anchor: caster, at: 0, volume: 0.9, pitch: 1.0}
        - {id: fx_cast, op: particle_def, def: hit-spark, anchor: muzzle, at: 0}
        - id: trail
          at: 0
          every: 1
          until: end
          do:
            - {id: tr0, op: particle, anchor: {of: bolt, sweep: 0.4}, particle: crit, count: 1, offset: [0.03, 0.03, 0.03], extra: 0}
            - {id: tr1, op: particle, anchor: {of: bolt, sweep: 0.4}, particle: dust, count: 1, offset: [0, 0, 0], extra: 0, color: "#5abec8", size: 1.0}
    end: {final: true}
