# harpoon-throw: a thrown harpoon that reels its victim toward the caster, in the frame grammar (ADR-0314, ADR-0315). `throw` is the throwing hand: rooted
# in the caster's eye / aim basis (v = aim, s = right, w = s x v) at the aimed position 0.57 ahead, 0.51 below the eye line, 0.30 right (the right arm out
# from the shoulder), so the harpoon leaves the hand 0.40 ahead along the aim, not the head. The cast spark and sound are points of it. The trident display
# and its wake ride the body; `hit` one per victim at its centre, `blk` one per block contact, v the way the harpoon came in; the sparks sit at v -0.2.
# Straight flight on purpose (no gravity): the hit tick is balance. Randomness: none.
apiVersion: astera/v3
kind: Skill
id: harpoon-throw
item: harpoon
meta: {name: {ja: "銛", en: "Harpoon"}, description: {ja: "銛を投げ、当たった相手を引き寄せる。", en: "Hurls a harpoon and reels the target in."}, cooldown_ticks: 100, resource_cost: 10, tags: [ranged, physical, control]}
params:
  launch_speed: {type: number, default: 2.2}
  dmg_physical: {type: number, default: 18}
  reel_stop: {type: number, default: 1.5}
  max_lifetime_ticks: {type: ticks, default: 40}
frames:
  - id: throw
    origin: caster.eye
    v: aim
    w: s x v
    s: right
    move:
      - {at: 0, for: 0, to: {v: 0.57, w: -0.51, s: 0.30}}
  - id: hit
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
  - id: blk
    on: event.block
    each: true
    origin: contact
    v: incoming
    w: up
    s: v x w
  - id: body
    origin: bolt
    v: forward
    w: up
    s: v x w
lines:
  trail: {frame: body, from: {v: -0.4}, to: {v: 0}}
machine:
  start: fly
  tail: 2
  states:
    fly:
      for: "${max_lifetime_ticks}"
      then: end
      on:
        - {event: bolt.end, to: end}
      do:
        - {id: snd, op: sound, at: 0, sound: "item.trident.throw", frame: throw, volume: 0.9}
        - {id: fx, op: particle_def, at: 0, def: hit-spark, frame: throw, pos: {v: 0.4}}
        - id: bolt
          op: projectile
          at: 0
          frame: throw
          pos: {v: 0.4}
          velocity: "= look(caster) * ${launch_speed}"
          for: "${max_lifetime_ticks}"
          radius: 0.5
          hit: {targets: enemies, once: true, attach: false}
          block: {mode: despawn}
          on:
            hit:
              - {id: dmg, op: damage, target: event.victim, damage: {physical: "${dmg_physical}"}}
              - {id: reel, op: pull, target: event.victim, direction: "= flat(pos(caster) - pos(event.victim))", distance: "= length(flat(pos(caster) - pos(event.victim))) - ${reel_stop}"}
              - {id: snd_hit, op: sound, sound: "item.trident.hit", frame: hit, volume: 0.8, detach: true}
              - {id: fx_hit, op: particle_def, def: hit-spark, frame: hit, pos: {v: -0.2}, detach: true}
            block:
              - {id: snd_blk, op: sound, sound: "astera:weapons/gun-impact-block", frame: blk, volume: 0.5, pitch: 1.5, detach: true}
              - {id: fx_blk, op: particle_def, def: hit-spark, frame: blk, pos: {v: -0.2}, detach: true}
        - {id: shaft, op: display, kind: item, item: "minecraft:trident", context: fixed, frame: body, pos: {}, scale: [1.2, 1.2, 1.2], at: 0, until: bolt.end}
        - id: trail
          op: group
          at: 2
          every: 1
          until: bolt.end
          do:
            - {id: wake, op: particle, particle: crit, count: 1, offset: [0.03, 0.03, 0.03], along: trail, samples: 2, at: 0}
            - {id: dust, op: particle, particle: dust, count: 1, color: "#5abec8", size: 1.0, along: trail, samples: 2, at: 0}
    end: {final: true}
