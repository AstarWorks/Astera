# v3 hand port of the v2 skill (ADR-0303 rev4.3).
apiVersion: astera/v3
kind: Skill
id: revolver-fan
item: revolver
meta: {name: {ja: "ファニング", en: "Fan the Hammer"}, description: {ja: "至近距離へ素早く連射する。", en: "Rapid close-range fire."}, cooldown_ticks: 90, resource_cost: 10, tags: [ranged, gun, burst]}
params:
  arc_deg:      {type: number, default: 60.0}
  range:        {type: blocks, default: 5.0}
  dmg_physical: {type: number, default: 21.0}
  knockback:    {type: number, default: 0.5}
anchors:
  - {id: eye,    anchor: caster.eye}
  - {id: muzzle, anchor: caster.eye, offset: {up: -0.25, forward: 1.1}, mode: snapshot}
  - {id: foe,    anchor: victim.root}   # GAP(Q2): v2 enemy frame origin = feet+0.8; victim.root = feet
  - {id: heart,  anchor: victim.root, offset: {up: 1.2}}   # GAP(Q2): same
machine:
  start: strike
  states:
    strike:
      for: 1
      then: end
      do:
        - {id: snd, op: sound, at: 0, sound: "astera:weapons/gun-shot", anchor: caster, volume: 0.9, pitch: 1.1}
        - {id: fx, op: particle_def, at: 0, def: shotgun-muzzle, anchor: muzzle}
        - id: swing
          op: hit
          at: 0
          anchor: eye
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: yaw}}
          targets: enemies
          max_count: all                   # GAP(Q1): v2 had no cap; A=`all`, B=omit
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: "${knockback}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", anchor: foe, volume: 0.7, pitch: 1.2}
              - {id: fx_hit, op: particle_def, def: hit-spark, anchor: heart}
    end: {final: true}
