# revolver-fan: one close-range sector hit with a push, on the cast tick, in the frame grammar (ADR-0314).
# `eye` is the caster's eye with v = aim, s = right, w = s x v (the up perpendicular to the aim): the sector hit sits on its origin and the
# muzzle flash is a point of it, 1.1 ahead and 0.25 below the eye line, so the flash pitches with the look. `hit` is one frame per victim at
# the victim's centre, v the way the shot came in: the spark and the impact sound are points of it. Nothing is authored in world offsets.
apiVersion: astera/v3
kind: Skill
id: revolver-fan
item: revolver
meta:
  name: {ja: "ファニング", en: "Fan the Hammer"}
  description: {ja: "至近距離へ素早く連射する。", en: "Rapid close-range fire."}
  cooldown_ticks: 90
  resource_cost: 10
  tags: [ranged, gun, burst]
params:
  arc_deg:      {type: number, default: 60.0}
  range:        {type: blocks, default: 5.0}
  dmg_physical: {type: number, default: 21.0}
  knockback:    {type: number, default: 0.5}
frames:
  - id: eye
    origin: caster.eye
    v: aim
    w: s x v
    s: right
  - id: hit
    on: event.victim
    each: true
    origin: victim.center
    v: incoming
    w: up
    s: v x w
machine:
  start: strike
  states:
    strike:
      for: 1
      then: end
      do:
        - {id: snd, op: sound, at: 0, sound: "astera:weapons/gun-shot", anchor: caster, volume: 0.9, pitch: 1.1}
        - {id: fx, op: particle_def, at: 0, def: shotgun-muzzle, frame: eye, pos: {v: 1.1, w: -0.25}}
        - id: swing
          op: hit
          at: 0
          frame: eye
          shape: {sector: {deg: "${arc_deg}", range: "${range}", height: 2.0, forward: look}}
          targets: enemies
          window: once
          ignore_invulnerability: false
          damage: {physical: "${dmg_physical}"}
          on:
            hit:
              - {id: kb, op: knockback, target: event.victim, direction: "= normalize(pos(event.victim) - pos(caster))", strength: "${knockback}"}
              - {id: snd_hit, op: sound, sound: "astera:weapons/blade-hit", frame: hit, volume: 0.7, pitch: 1.2}
              - {id: fx_hit, op: particle_def, def: hit-spark, frame: hit, pos: {v: -0.2}}
    end: {final: true}
