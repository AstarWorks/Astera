# Match arsenal (wp/match-arsenal): simple PvP skill. One cast sound, a few particles.

id: axe-plank-wall-iron

name:
  ja: "鉄の板壁"
  en: "Iron Plank Wall"
description:
  ja: "目の前に補強板の壁を築く。"
  en: "Raises a wall of reinforced planks in front of you."

archetype: sequence
cooldown_ticks: 300
resource_cost: 0
tags: [ tool, cover ]

params:
  type: sequence

phases:
  type: sequence
  cast:
    - type: place_shape
      shape: wall
      block_key: "astera:reinforced_planks"
      width: 5
      height: 3
      consume_from_inventory: false
    - type: play_sound
      targets: { type: caster }
      sound_id: astera:weapons/gun-impact-block
      volume: { type: literal, value: 1.0 }
      pitch: { type: literal, value: 0.9 }
    - type: spawn_particle
      targets: { type: caster_forward, distance: 2.0, height: 0.0 }
      particle_id: hit-spark
