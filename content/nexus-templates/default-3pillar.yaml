# Default 3-pillar Nexus template (ADR-0108, Wave 5annihilation).
#
# Per-tier block material + offset relative to the team's base spawn:
#   Tier 1 (outer): plain obsidian, 4 blocks forward.
#   Tier 2 (middle): crying obsidian, 6 blocks forward.
#   Tier 3 (Nexus proper): beacon, 8 blocks forward + 1 block raised.
#
# The Phase 1 PoC tracker does NOT consume this file — it seeds pillars at a
# placeholder position. Wave 6 Paper adapter wires the template through to
# actual block placement at match-world generation time.

id: default-3pillar
name_key: astera.gamemode.annihilation.template.default

tiers:
  - tier: 1
    block_material: minecraft:obsidian
    offset:
      x: 4
      y: 1
      z: 0
  - tier: 2
    block_material: minecraft:crying_obsidian
    offset:
      x: 6
      y: 1
      z: 0
  - tier: 3
    block_material: minecraft:beacon
    offset:
      x: 8
      y: 2
      z: 0
    hp_override: 800
