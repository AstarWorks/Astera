name: CI

on:
  # Founder 2026-10-23: no automatic CI; run manually if ever needed.
  workflow_dispatch:

# Cancel superseded runs per branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (./gradlew check)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # Wrapper-driven: the gradle version comes from gradle/wrapper/gradle-wrapper.properties.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check (unit tests + Konsist architecture tests)
        run: ./gradlew check --no-daemon --stacktrace

      - name: Build the 7 plugin shadow jars
        run: make build GRADLEW="./gradlew --no-daemon"

      - name: Upload plugin jars
        uses: actions/upload-artifact@v4
        with:
          name: astera-plugin-jars
          path: plugin/*/build/libs/astera-*.jar
          retention-days: 14
          if-no-files-found: error

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: E2E (make e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run the e2e suite
        run: make e2e

      - name: Summary
        if: always()
        run: |
          if [ -f build/e2e-report.md ]; then
            cat build/e2e-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No build/e2e-report.md produced (backend or runner failed to start)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: build/e2e-report.md
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Velocity log (decode logging on)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-velocity-log
          path: build/e2e-velocity.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Backend logs (on failure)
        if: failure()
        run: |
          mkdir -p build
          for c in $(docker ps -a --format '{{.Names}}' | grep astera-e2e); do docker logs --tail 20000 "$c" > "build/docker-$c.log" 2>&1 || true; done

      - name: Upload backend logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-logs
          path: build/docker-*.log
          retention-days: 7
          if-no-files-found: ignore

  skill-frames:
    name: Skill frame renders
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - uses: oven-sh/setup-bun@v2

      - name: Install ffmpeg + Chromium
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          cd tools/skill-viewer
          bun install --frozen-lockfile
          bunx playwright-core install --with-deps chromium

      - name: Pick skills
        id: pick
        run: |
          if [ -n "${{ inputs.skills }}" ]; then
            echo "skills=${{ inputs.skills }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base="$(git merge-base origin/main HEAD)"; fi
          skills="$(git diff --name-only "$base" HEAD -- 'content/skills/*.yaml' | xargs -r -n1 basename | sed 's/\.yaml$//' | tr '\n' ' ')"
          echo "changed skills: ${skills:-none}"
          echo "skills=${skills}" >> "$GITHUB_OUTPUT"

      - name: Render skills
        if: steps.pick.outputs.skills != ''
        run: |
          if [ "${{ steps.pick.outputs.skills }}" = "ALL" ]; then
            ./gradlew :tools:skill-viewer:render --no-daemon --stacktrace
          else
            for s in ${{ steps.pick.outputs.skills }}; do
              ./gradlew :tools:skill-viewer:render -Pscenario="$s" --no-daemon --stacktrace
            done
          fi

      - name: Upload skill frames
        uses: actions/upload-artifact@v4
        with:
          name: skill-frames
          path: tools/skill-viewer/build/skill-frames/
          retention-days: 14
          if-no-files-found: ignore
