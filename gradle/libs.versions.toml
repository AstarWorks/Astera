[versions]
# JVM / Kotlin (latest stable as of 2026-05-17)
kotlin = "2.3.21"               # Kotlin 2.3 supports JVM target 25 natively
ksp = "2.3.8"                   # KSP2 new numbering (no -kotlin- prefix)
jdk = "25"

# Paper (Minecraft Java Edition 26.x — requires JDK 25)
paper = "26.1.2.build.63-stable"

# JOML (pure-math library — Vector3f / Quaternionf / Matrix4f).
# Paper API pulls 1.10.8 transitively; we declare it here so `:plugin:core`
# (and test source) can import directly. ADR-0074 Wave 5h-fix: JOML in
# `core.domain.hologram.*` is allowed (Bukkit-free domain rule does not
# extend to pure-math libraries).
joml = "1.10.8"

# DI / Config
koin = "4.2.1"
# koin-annotations + koin-ksp-compiler stay on the 2.x stream — the 4.x version
# of koin-annotations exists but no matching koin-ksp-compiler 4.x is published.
koin-annotations = "2.3.1"
kaml = "0.104.0"
ktoml = "0.7.1"                 # Latest stable; 0.6 / 0.7 line drops kotlinx-datetime jvm-only quirks
kotlinx-coroutines = "1.11.0"
kotlinx-collections-immutable = "0.4.0" # Pure-Kotlin persistent collections; used in domain (PersistentMap in GuiSpec etc.)
kotlinx-serialization = "1.9.0" # Pinned to match kaml 0.104 and ktoml 0.7 transitive core (avoid duplicate-class risk)

# Logging
slf4j = "2.0.18"                # 2.1.x still alpha — stay on stable 2.0 line
logback = "1.5.32"

# Observability (Wave _ops — Phase 1.5)
micrometer = "1.14.6"           # Current stable LTS line (1.13 EOL Oct 2025)

# Distributed tracing (Wave 5u — ADR-0087)
# OpenTelemetry — CNCF graduated, Jaeger / Zipkin both supported through OTLP.
# 1.42 ships against API/SDK with stable cross-cutting context propagators.
opentelemetry = "1.42.1"

# Persistence (PostgreSQL + Exposed; Astera independent of AstarManagement's 1.1.1)
postgresql = "42.7.11"
exposed = "1.3.0"
flyway = "12.6.1"
hikari-cp = "6.2.1"             # Connection pool — Astera bootstraps HikariDataSource manually (no Spring)
lettuce = "7.5.2.RELEASE"

# Testing
junit = "6.0.3"                 # JUnit 6 — major bump from 5.x
junit-platform = "6.0.3"        # JUnit 6 unified platform versioning
assertj = "3.27.7"              # 4.0 still milestone
testcontainers = "1.21.4"
mockk = "1.14.9"
konsist = "0.17.3"

# Build
detekt = "1.23.8"               # Disabled until 2.x; pinned for re-enable
shadow = "9.4.1"                # Gradle 9 native

# tools:content-lint — JSON Schema validation pipeline for content/*.yaml (ADR-0067)
networknt-json-schema-validator = "1.5.4"   # Active maintenance; supports Draft 07 (matches content/schemas/*) + 2020-12
snakeyaml = "2.4"                            # YAML 1.1 parser — produces nested Maps/Lists/scalars
jackson = "2.21.0"                           # ObjectMapper.valueToTree(...) bridges SnakeYAML output → JsonNode for the validator

# External Paper plugins (compileOnly, soft-dep) — sentinel until Phase 2 mid
weaponmechanics = "999.999.999"
oraxen = "999.999.999"
mythic-dist = "999.999.999"

# PacketEvents (Wave 6c-stub-packetevents, ADR-0170) — softdepend.
# 2.12.x supports Minecraft 26.1; CodeMC repo (declared in settings.gradle.kts).
# Astera boots in vanilla Paper without it (CLAUDE.md §4 invariant); the
# Paper adapter performs a runtime `Bukkit.getPluginManager().getPlugin(...)`
# check and stays on the InMemory IPacketInterceptor when absent.
packetevents = "2.12.2"

[libraries]
# Kotlin / kotlinx
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }

# Paper
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
joml = { module = "org.joml:joml", version.ref = "joml" }

# PacketEvents (Wave 6c-stub-packetevents, ADR-0170) — softdepend.
# `packetevents-spigot` is the canonical artifact for Paper/Spigot (no
# `-paper` variant exists in 2.x). Distributed via CodeMC repo.
packetevents-spigot = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }

# Koin (DI)
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-annotations = { module = "io.insert-koin:koin-annotations", version.ref = "koin-annotations" }
koin-ksp-compiler = { module = "io.insert-koin:koin-ksp-compiler", version.ref = "koin-annotations" }

# Config / Serialization
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }
ktoml-core = { module = "com.akuleshov7:ktoml-core", version.ref = "ktoml" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Logging
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Observability — Micrometer (Prometheus exposition + JVM metrics)
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }

# Distributed tracing — OpenTelemetry (Wave 5u, ADR-0087)
#  - api: vendor-neutral Tracer / Span / Context (application port impl uses this)
#  - sdk: backbone tracer impl + TracerProvider builder
#  - exporter-otlp: OTLP/gRPC + OTLP/HTTP exporters — pluggable to Jaeger 1.50+ and Zipkin via collector
#  - context: explicit dep so `Context.current()` works without sdk wired
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk", version.ref = "opentelemetry" }
opentelemetry-context = { module = "io.opentelemetry:opentelemetry-context", version.ref = "opentelemetry" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp", version.ref = "opentelemetry" }
opentelemetry-exporter-logging = { module = "io.opentelemetry:opentelemetry-exporter-logging", version.ref = "opentelemetry" }

# Persistence
postgresql-jdbc = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
hikari-cp = { module = "com.zaxxer:HikariCP", version.ref = "hikari-cp" }

# Messaging / Cache
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }

# Testing
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
testcontainers-core = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }

# Build plugin classpaths (referenced from buildSrc convention plugins)
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# tools:content-lint
networknt-json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "networknt-json-schema-validator" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }

[bundles]
test-common = ["junit-jupiter", "assertj-core"]
exposed = ["exposed-core", "exposed-jdbc", "exposed-json", "exposed-java-time"]
testcontainers = ["testcontainers-core", "testcontainers-junit-jupiter"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
